ARTICLES.push({"treaty": "unclos", "no": "209", "heading": "來自「區域」內活動的污染", "tier": "B", "paras": [{"n": "1", "en": "International rules, regulations and procedures shall be established in accordance with Part XI to prevent, reduce and control pollution of the marine environment from activities in the Area. Such rules, regulations and procedures shall be re-examined from time to time as necessary.", "zh": "為了防止、減少和控制「區域」內活動對海洋環境的污染，應按照第十一部份制定國際規則、規章和程序。這種規則、規章和程序應根據需要隨時重新審查。"}, {"n": "2", "en": "Subject to the relevant provisions of this section, States shall adopt laws and regulations to prevent, reduce and control pollution of the marine environment from activities in the Area undertaken by vessels, installations, structures and other devices flying their flag or of their registry or operating under their authority, as the case may be. The requirements of such laws and regulations shall be no less effective than the international rules, regulations and procedures referred to in paragraph 1.", "zh": "在本節有關規定的限制下，各國應制定法律和規章，以防止、減少和控制由懸掛其旗幟或在其國內登記或在其權力下經營的船隻、設施、結構和其他裝置所進行的「區域」內活動造成對海洋環境的污染。這種法律和規章的要求的效力應不低於第一款所指的國際規則、規章和程序。"}], "keys": ["應按照第十一部份制定國際規則、規章和程序", "這種法律和規章的要求的效力應不低於第一款所指的國際規則"], "plain": "國家管轄範圍外的深海底（「區域」）活動造成的污染，由{{國際海床管理局}}依第十一部分制定國際規則（第1項）；各國則應對懸掛其旗幟、在其國內登記或在其權力下經營的船舶與設施，制定效力不低於這些國際規則的法律規章（第2項）。國際海床管理局已通過探勘階段的規章，但商業開採規章（所謂採礦法典）仍在談判中。", "elements": [{"req": ["「區域」內活動造成的海洋環境污染"], "effect": "依第十一部分制定國際規則；各國對其船舶與設施的國內法效力不得低於國際規則"}], "traps": [], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-136", "unclos-137", "unclos-140", "unclos-215"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「隨時重審查」依英文作準本及上下文更正為「隨時重新審查」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "210", "heading": "傾倒造成的污染", "tier": "A", "paras": [{"n": "1", "en": "States shall adopt laws and regulations to prevent, reduce and control pollution of the marine environment by dumping.", "zh": "各國應制定法律和規章，以防止、減少和控制傾倒對海洋環境的污染。"}, {"n": "2", "en": "States shall take other measures as may be necessary to prevent, reduce and control such pollution.", "zh": "各國應採取其他可能必要的措施，以防止、減少和控制這種污染。"}, {"n": "3", "en": "Such laws, regulations and measures shall ensure that dumping is not carried out without the permission of the competent authorities of States.", "zh": "這種法律、規章和措施應確保非經各國主管當局准許，不進行傾倒。"}, {"n": "4", "en": "States, acting especially through competent international organizations or diplomatic conference, shall endeavour to establish global and regional rules, standards and recommended practices and procedures to prevent, reduce and control such pollution. Such rules, standards and recommended practices and procedures shall be re-examined from time to time as necessary.", "zh": "各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。"}, {"n": "5", "en": "Dumping within the territorial sea and the exclusive economic zone or onto the continental shelf shall not be carried out without the express prior approval of the coastal State, which has the right to permit, regulate and control such dumping after due consideration of the matter with other States which by reason of their geographical situation may be adversely affected thereby.", "zh": "非經沿海國事前明示核准，不應在領海和專屬經濟區內或在大陸架上進行傾倒，沿海國經與由於地理處境可能受傾倒不利影響的其他國家適當審議此事後，有權准許、規定和控制這種傾倒。"}, {"n": "6", "en": "National laws, regulations and measures shall be no less effective in preventing, reducing and controlling such pollution than the global rules and standards.", "zh": "國內法律、規章和措施在防止、減少和控制這種污染方面的效力應不低於全球性規則和標準。"}], "keys": ["非經各國主管當局准許，不進行傾倒", "非經沿海國事前明示核准，不應在領海和專屬經濟區內或在大陸架上進行傾倒", "國內法律、規章和措施在防止、減少和控制這種污染方面的效力應不低於全球性規則和標準"], "plain": "{{傾倒}}依第1條第1項第5款，指從船隻、飛機、平臺或其他人造海上結構故意處置廢物或其他物質（含故意棄置船隻、平臺本身），但不包括這些載具正常操作附帶產生的廢物。本條規定：①各國應制定法律規章防治傾倒污染；③傾倒須經主管當局許可（許可制）；④透過國際組織制定全球與區域規則——即1972年《倫敦傾倒公約》及其1996年議定書（後者原則禁止、只許可特定物質傾倒的「反向清單」）；⑤在領海、專屬經濟海域或大陸礁層上傾倒，須經沿海國「事前明示核准」，沿海國並應與可能受影響的鄰國適當審議；⑥國內法效力不得低於全球性規則和標準。執行規定在第216條。", "elements": [{"req": ["在海上傾倒廢物或其他物質"], "effect": "須經國家主管當局許可；國內法效力不得低於全球性規則和標準"}, {"req": ["在他國領海、專屬經濟海域或大陸礁層上傾倒"], "effect": "須經該沿海國事前明示核准"}], "traps": ["陷阱：「傾倒」包括從「飛機」處置廢物（第1條第1項第5款）；gl109a_4選項D稱「不包括飛行器」錯誤。", "陷阱：在專屬經濟海域或大陸礁層傾倒須經沿海國「事前明示」核准，默示同意不夠。", "陷阱：陸上設施排放屬陸源污染（第207條），不是傾倒。", "陷阱：傾倒的國內法效力須「不低於全球性規則和標準」，與陸源污染「考慮到」國際規則不同。"], "custom": {"status": "不適用", "note": "條約規定；具體規則見1972年倫敦傾倒公約及其1996年議定書。", "cases": []}, "related": ["unclos-1", "unclos-216", "unclos-194", "unclos-195"], "cases": [], "roc": "我國《海洋污染防治法》規定海洋棄置應向主管機關申請許可，並以附表限定可棄置的物質。", "essay": "傾倒：「依第210條，傾倒須經主管當局許可，在領海、專屬經濟海域或大陸礁層上傾倒並須經沿海國事前明示核准；國內法效力不得低於全球性規則和標準，即倫敦傾倒公約及其1996年議定書。」", "exam": [{"qid": "gl109a_4", "note": "選項D稱傾倒「不包括陸上設施與飛行器」：依第1條第1項第5款，傾倒包括從飛機處置廢物，故錯誤（正解D）。陸上設施的排放屬陸源污染，本來就不是傾倒。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "211", "heading": "來自船隻的污染", "tier": "A", "paras": [{"n": "1", "en": "States, acting through the competent international organization or general diplomatic conference, shall establish international rules and standards to prevent, reduce and control pollution of the marine environment from vessels and promote the adoption, in the same manner, wherever appropriate, of routeing systems designed to minimize the threat of accidents which might cause pollution of the marine environment, including the coastline, and pollution damage to the related interests of coastal States. Such rules and standards shall, in the same manner, be re-examined from time to time as necessary.", "zh": "各國應通過主管國際組織或一般外交會議採取行動，制訂國際規則和標準，以防止、減少和控制船隻對海洋環境的污染，並於適當情形下，以同樣方式促進對劃定航線制度的採用，以期盡量減少可能對海洋環境，包括對海岸造成污染和對沿海國的有關利益可能造成污染損害的意外事件的威脅。這種規則和標準應根據需要隨時以同樣方式重新審查。"}, {"n": "2", "en": "States shall adopt laws and regulations for the prevention, reduction and control of pollution of the marine environment from vessels flying their flag or of their registry. Such laws and regulations shall at least have the same effect as that of generally accepted international rules and standards established through the competent international organization or general diplomatic conference.", "zh": "各國應制定法律和規章，以防止、減少和控制懸掛其旗幟或在其國內登記的船隻對海洋環境的污染。這種法律和規章至少應具有與通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準相同的效力。"}, {"n": "3", "en": "States which establish particular requirements for the prevention, reduction and control of pollution of the marine environment as a condition for the entry of foreign vessels into their ports or internal waters or for a call at their off-shore terminals shall give due publicity to such requirements and shall communicate them to the competent international organization. Whenever such requirements are established in identical form by two or more coastal States in an endeavour to harmonize policy, the communication shall indicate which States are participating in such cooperative arrangements. Every State shall require the master of a vessel flying its flag or of its registry, when navigating within the territorial sea of a State participating in such cooperative arrangements, to furnish, upon the request of that State, information as to whether it is proceeding to a State of the same region participating in such cooperative arrangements and, if so, to indicate whether it complies with the port entry requirements of that State. This article is without prejudice to the continued exercise by a vessel of its right of innocent passage or to the application of article 25, paragraph 2.", "zh": "各國如制訂關於防止、減少和控制海洋環境污染的特別規定作為外國船隻進入其港口或內水或在其岸外設施停靠的條件，應將這種規定妥為公佈，並通知主管國際組織。如兩個或兩個以上的沿海國制訂相同的規定，以求協調政策，在通知時應說明那些國家參加這種合作安排。每個國家應規定懸掛其旗幟或在其國內登記的船隻的船長在參加這種合作安排的國家的領海內航行時，經該國要求應向其提送通知是否正駛往參加這種合作安排的同一區域的國家，如係駛往這種國家，應說明是否遵守該國關於進入港口的規定。本條不妨害船隻繼續行使其無害通過權，也不妨害第二十五條第二款的適用。"}, {"n": "4", "en": "Coastal States may, in the exercise of their sovereignty within their territorial sea, adopt laws and regulations for the prevention, reduction and control of marine pollution from foreign vessels, including vessels exercising the right of innocent passage. Such laws and regulations shall, in accordance with Part II, section 3, not hamper innocent passage of foreign vessels.", "zh": "沿海國在其領海內行使主權，可制定法律和規章，以防止、減少和控制外國船隻，包括行使無害通過權的船隻對海洋的污染。按照第二部份第三節的規定，這種法律和規章不應阻礙外國船隻的無害通過。"}, {"n": "5", "en": "Coastal States, for the purpose of enforcement as provided for in section 6, may in respect of their exclusive economic zones adopt laws and regulations for the prevention, reduction and control of pollution from vessels conforming to and giving effect to generally accepted international rules and standards established through the competent international organization or general diplomatic conference.", "zh": "沿海國為第六節所規定的執行的目的，可對其專屬經濟區制定法律和規章，以防止、減少和控制來自船隻的污染。這種法律和規章應符合通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準，並使其有效。"}, {"n": "6", "en": "(a) Where the international rules and standards referred to in paragraph 1 are inadequate to meet special circumstances and coastal States have reasonable grounds for believing that a particular, clearly defined area of their respective exclusive economic zones is an area where the adoption of special mandatory measures for the prevention of pollution from vessels is required for recognized technical reasons in relation to its oceanographical and ecological conditions, as well as its utilization or the protection of its resources and the particular character of its traffic, the coastal States, after appropriate consultations through the competent international organization with any other States concerned, may, for that area, direct a communication to that organization, submitting scientific and technical evidence in support and information on necessary reception facilities. Within 12 months after receiving such a communication, the organization shall determine whether the conditions in that area correspond to the requirements set out above. If the organization so determines, the coastal States may, for that area, adopt laws and regulations for the prevention, reduction and control of pollution from vessels implementing such international rules and standards or navigational practices as are made applicable, through the organization, for special areas. These laws and regulations shall not become applicable to foreign vessels until 15 months after the submission of the communication to the organization.\n(b) The coastal States shall publish the limits of any such particular, clearly defined area.\n(c) If the coastal States intend to adopt additional laws and regulations for the same area for the prevention, reduction and control of pollution from vessels, they shall, when submitting the aforesaid communication, at the same time notify the organization thereof. Such additional laws and regulations may relate to discharges or navigational practices but shall not require foreign vessels to observe design, construction, manning or equipment standards other than generally accepted international rules and standards; they shall become applicable to foreign vessels 15 months after the submission of the communication to the organization, provided that the organization agrees within 12 months after the submission of the communication.", "zh": "(a)如果第一款所指的國際規則和標準不足以適應特殊情況，又如果沿海國有合理根據認為其專屬經濟區某一明確劃定的特定區域，因與其海洋學和生態條件有關的公認技術理由，以及該區域的利用或其資源的保護及其在航運上的特殊性質，要求採取防止來自船隻的污染的特別強制性措施，該沿海國通過主管國際組織與任何其他有關國家進行適當協商後，可就該區域向該組織送發通知後，提出所依據的科學和技術證據，以及關於必要的回收設施的情報。該組織收到這種通知，應在十二個月內確定該區域的情況與上述要求是否相符。如果該組織確定是符合的，該沿海國即可對該區域制定防止、減少和控制來自船隻的污染的法律和規章，實施通過主管國際組織使其適用於各特別區域的國際規則和標準或航行辦法。在向該組織送發通知滿十五個月後，這些法律和規章才可適用於外國船隻；\n(b)沿海國應公佈任何這種明確劃定的特定區域的界限；\n(c)如果沿海國有意為同一區域制定其他法律和規章，以防止、減少和控制來自船隻的污染，它們應於提出上述通知時，同時將這一意向通知該組織。這種增訂的法律和規章可涉及排放和航行辦法，但不應要求外國船隻遵守一般接受的國際規則和標準以外的設計、建造、人員配備或裝備標準；這種法律和規章應在向該組織送發通知十五個月後適用於外國船隻，但須在送發通知後十二個月內該組織表示同意。"}, {"n": "7", "en": "The international rules and standards referred to in this article should include inter alia those relating to prompt notification to coastal States, whose coastline or related interests may be affected by incidents, including maritime casualties, which involve discharges or probability of discharges.", "zh": "本條所指的國際規則和標準，除其他外，應包括遇有引起排放或排放可能的海難等事故時，立即通知其海岸或有關利益可能受到影響的沿海國的義務。"}], "keys": ["至少應具有與通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準相同的效力", "這種法律和規章不應阻礙外國船隻的無害通過", "符合通過主管國際組織或一般外交會議制訂的一般接受的國際規則和標準"], "plain": "船舶污染採「國際標準為核心」的設計，依海域分層規定立法權：①國際規則由「主管國際組織」（即國際海事組織IMO）或一般外交會議制定，代表性成果是《防止船舶污染國際公約》（MARPOL 73/78）；②{{船旗國}}對本國船舶的法律規章，至少應與「一般接受的國際規則和標準」具有相同效力（國際標準是下限）；③港口國可把防污要求列為外國船舶入港條件，但應公布並通知IMO；④沿海國在領海內可為外國船舶（含行使{{無害通過}}者）制定防污法規，但不得妨礙無害通過——依第21條第2項，這類法規不得涉及外國船舶的設計、構造、人員配備或裝備，除非是在實施一般接受的國際規則；⑤在專屬經濟海域，沿海國的防污法規只能「符合並實施」一般接受的國際規則和標準（國際標準是上限）；⑥特殊區域經IMO同意後，可制定特別強制措施（IMO應在12個月內決定，法規在通知滿15個月後才適用於外國船舶）；⑦國際規則應包括事故時立即通知沿海國的義務。", "elements": [{"req": ["船旗國對懸掛其旗幟或在其國內登記的船舶"], "effect": "制定防污法規，效力至少與一般接受的國際規則和標準相同（下限）"}, {"req": ["沿海國在其領海內"], "effect": "可制定防污法規適用於外國船舶，但不得妨礙無害通過"}, {"req": ["沿海國在其專屬經濟海域"], "effect": "為執行目的，只能制定符合並實施一般接受的國際規則和標準的法規（上限）"}, {"req": ["專屬經濟海域內明確劃定的特定區域，國際規則不足以應付特殊情況", "經主管國際組織確定符合要件"], "effect": "可制定特別強制措施，於通知送交該組織滿15個月後適用於外國船舶"}], "traps": ["陷阱：船旗國法規以國際標準為「下限」（至少相同效力），沿海國在專屬經濟海域的法規以國際標準為「上限」（只能符合並實施），兩者方向相反。", "陷阱：沿海國在領海內的防污法規不得妨礙無害通過，也不得規範外國船舶的設計、構造、人員配備或裝備（第21條第2項），除非是實施一般接受的國際規則。", "陷阱：「主管國際組織」在船舶污染脈絡下指國際海事組織（IMO），不是聯合國環境規劃署。", "陷阱：特殊區域的法規在通知送交IMO滿「15個月」後才適用於外國船舶；IMO應在「12個月」內作成決定。"], "custom": {"status": "不適用", "note": "條約規定；具體標準見MARPOL等IMO公約。", "cases": []}, "related": ["unclos-21", "unclos-25", "unclos-56", "unclos-194", "unclos-217", "unclos-218", "unclos-220", "unclos-234"], "cases": [], "roc": "我國《海洋污染防治法》規範船舶排放與防污設備，並參照MARPOL等國際公約的標準；我國不是IMO會員，但交通部航港局依國際公約執行船舶檢查。", "essay": "船舶污染的立法管轄：「第211條依主體與海域分層規定立法權：船旗國的法規效力至少等於一般接受的國際規則和標準（第2項）；沿海國在領海內可立法但不得妨礙無害通過（第4項）；在專屬經濟海域只能制定符合並實施國際規則和標準的法規（第5項），特殊區域須經國際海事組織同意（第6項）。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「制度的採用。以期」依英文作準本及上下文更正為「制度的採用，以期」（待以聯合國作準中文本覆核）。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第6項「國際規則和標準國航行辦法」依英文作準本及上下文更正為「國際規則和標準或航行辦法」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "212", "heading": "來自大氣層或通過大氣層的污染", "tier": "B", "paras": [{"n": "1", "en": "States shall adopt laws and regulations to prevent, reduce and control pollution of the marine environment from or through the atmosphere, applicable to the air space under their sovereignty and to vessels flying their flag or vessels or aircraft of their registry, taking into account internationally agreed rules, standards and recommended practices and procedures and the safety of air navigation.", "zh": "各國為防止、減少和控制來自大氣層或通過大氣層的海洋環境污染，應制定適用於在其主權下的上空和懸掛其旗幟的船隻或在其國內登記的船隻或飛機的法律和規章，同時考慮到國際上議定的規則、標準和建議的辦法及程序，以及航空的安全。"}, {"n": "2", "en": "States shall take other measures as may be necessary to prevent, reduce and control such pollution.", "zh": "各國應採取其他可能必要的措施，以防止、減少和控制這種污染。"}, {"n": "3", "en": "States, acting especially through competent international organizations or diplomatic conference, shall endeavour to establish global and regional rules, standards and recommended practices and procedures to prevent, reduce and control such pollution.", "zh": "各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染。"}], "keys": ["防止、減少和控制來自大氣層或通過大氣層的海洋環境污染"], "plain": "經由大氣進入海洋的污染（例如酸雨、空氣中的重金屬、溫室氣體）：各國應制定適用於其主權下空域、本國船舶與航空器的法律規章，並考慮國際規則及航空安全（第1項），採取其他必要措施（第2項），並盡力制定全球及區域規則（第3項）。[[case|itlos-climate|國際海洋法法庭2024年諮詢意見]]認為，人為溫室氣體排放屬於本條與第207條所稱的污染，各國有義務立法並依第222條執行。", "elements": [{"req": ["來自大氣層或通過大氣層的海洋環境污染"], "effect": "各國應制定適用於其主權下空域、本國船舶與航空器的法律規章，並考慮國際規則與航空安全"}], "traps": ["陷阱：溫室氣體排放可構成經由大氣的海洋環境污染（國際海洋法法庭2024年諮詢意見）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-194", "unclos-207", "unclos-222"], "cases": [{"id": "itlos-climate", "point": "人為溫室氣體排放屬經由大氣的海洋環境污染；各國應依本條制定法律規章，並依第222條執行。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "216", "heading": "關於傾倒造成污染的執行", "tier": "B", "paras": [{"n": "1", "en": "Laws and regulations adopted in accordance with this Convention and applicable international rules and standards established through competent international organizations or diplomatic conference for the prevention, reduction and control of pollution of the marine environment by dumping shall be enforced:\n(a) by the coastal State with regard to dumping within its territorial sea or its exclusive economic zone or onto its continental shelf;\n(b) by the flag State with regard to vessels flying its flag or vessels or aircraft of its registry;\n(c) by any State with regard to acts of loading of wastes or other matter occurring within its territory or at its off-shore terminals.", "zh": "為了防止、減少和控制傾倒對海洋環境的污染而按照本公約制定的法律和規章，以及通過主管國際組織或外交會議制訂的可適用的國際規則和標準，應依下列規定執行：\n(a)對於在沿海國領海或其專屬經濟區內或在其大陸架上的傾倒，應由該沿海國執行；\n(b)對於懸掛旗籍國旗幟的船隻或在其國內登記的船隻和飛機，應由該旗籍國執行；\n(c)對於任何國家領土內或在其岸外設施裝載廢料或其他物質的行為，應由該國執行。"}, {"n": "2", "en": "No State shall be obliged by virtue of this article to institute proceedings when another State has already instituted proceedings in accordance with this article.", "zh": "本條不應使任何國家承擔提起司法程序的義務，如果另一國已按照本條提起這種程序。"}], "keys": ["應由該沿海國執行", "應由該旗籍國執行", "應由該國執行"], "plain": "傾倒的執行權由三種國家分擔：①在領海、專屬經濟海域或大陸礁層上的傾倒，由沿海國執行；②懸掛其旗幟或在其國內登記的船舶與飛機，由船旗國（登記國）執行；③在其領土內或岸外設施裝載廢料的行為，由該裝載國執行。第2項避免重複追訴：他國已依本條提起司法程序者，其他國家無義務再提起。", "elements": [{"req": ["沿海國領海、專屬經濟海域或大陸礁層上的傾倒"], "effect": "由沿海國執行"}, {"req": ["懸掛其旗幟或在其國內登記的船舶與飛機"], "effect": "由船旗國（登記國）執行"}, {"req": ["在其領土內或岸外設施裝載廢料或其他物質"], "effect": "由裝載國執行"}], "traps": ["陷阱：傾倒的執行國除沿海國、船旗國外，還包括「裝載國」。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-210", "unclos-217"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "217", "heading": "船旗國的執行", "tier": "B", "paras": [{"n": "1", "en": "States shall ensure compliance by vessels flying their flag or of their registry with applicable international rules and standards, established through the competent international organization or general diplomatic conference, and with their laws and regulations adopted in accordance with this Convention for the prevention, reduction and control of pollution of the marine environment from vessels and shall accordingly adopt laws and regulations and take other measures necessary for their implementation. Flag States shall provide for the effective enforcement of such rules, standards, laws and regulations, irrespective of where a violation occurs.", "zh": "各國應確保懸掛其旗幟或在其國內登記的船隻，遵守為防止、減少和控制來自船隻的海洋環境污染而通過主管國際組織或一般外交會議制訂的可適用的國際規則和標準以及各該國按照本公約制定的法律和規章，並應為此制定法律和規章和採取其他必要措施，以實施這種規則、標準、法律和規章。船旗國應作出規定使這種規則、標準、法律和規章得到有效執行，不論違反行為在何處發生。"}, {"n": "2", "en": "States shall, in particular, take appropriate measures in order to ensure that vessels flying their flag or of their registry are prohibited from sailing, until they can proceed to sea in compliance with the requirements of the international rules and standards referred to in paragraph 1, including requirements in respect of design, construction, equipment and manning of vessels.", "zh": "各國特別應採取適當措施，以確保懸掛其旗幟或在其國內登記的船隻，在能遵守第一款所指的國際規則和標準的規定，包括關於船隻的設計、建造、裝備和人員配備的規定以前，禁止其出海航行。"}, {"n": "3", "en": "States shall ensure that vessels flying their flag or of their registry carry on board certificates required by and issued pursuant to international rules and standards referred to in paragraph 1. States shall ensure that vessels flying their flag are periodically inspected in order to verify that such certificates are in conformity with the actual condition of the vessels. These certificates shall be accepted by other States as evidence of the condition of the vessels and shall be regarded as having the same force as certificates issued by them, unless there are clear grounds for believing that the condition of the vessel does not correspond substantially with the particulars of the certificates.", "zh": "各國應確保懸掛其旗幟或在其國內登記的船隻在船上持有第一款所指的國際規則和標準所規定並依據該規則和標準頒發的各種證書。各國應確保懸掛其旗幟的船隻受到定期檢查，以證實這些證書與船隻的實際情況相符。其他國家應接受這些證書，作為船隻情況的證據，並應將這些證書視為與其本國所發的證書具有相同效力，除非有明顯根據認為船隻的情況與證書所載各節有重大不符。"}, {"n": "4", "en": "If a vessel commits a violation of rules and standards established through the competent international organization or general diplomatic conference, the flag State, without prejudice to articles 218, 220 and 228, shall provide for immediate investigation and where appropriate institute proceedings in respect of the alleged violation irrespective of where the violation occurred or where the pollution caused by such violation has occurred or has been spotted.", "zh": "如果船隻違反通過主管國際組織或一般外交會議制訂的規則和標準，船旗國在不妨害第二百一十八、第二百二十和第二百二十八條的情形下，應設法立即進行調查，並在適當情形下應對被指控的違反行為提起司法程序，不論違反行為在何處發生也不論這種違反行為所造成的污染在何處發生或發現。"}, {"n": "5", "en": "Flag States conducting an investigation of the violation may request the assistance of any other State whose cooperation could be useful in clarifying the circumstances of the case. States shall endeavour to meet appropriate requests of flag States.", "zh": "船旗國調查違反行為時，可向提供合作能有助於澄清案件情況的任何其他國家請求協助。各國應盡力滿足船旗國的適當請求。"}, {"n": "6", "en": "States shall, at the written request of any State, investigate any violation alleged to have been committed by vessels flying their flag. If satisfied that sufficient evidence is available to enable proceedings to be brought in respect of the alleged violation, flag States shall without delay institute such proceedings in accordance with their laws.", "zh": "各國經任何國家的書面請求，應對懸掛其旗幟的船隻被指控所犯的任何違反行為進行調查。船旗國如認為有充分證據可對被指控的違反行為提起司法程序，應毫不遲延地按照其法律提起這種程序。"}, {"n": "7", "en": "Flag States shall promptly inform the requesting State and the competent international organization of the action taken and its outcome. Such information shall be available to all States.", "zh": "船旗國應將所採取行動及其結果迅速通知請求國和主管國際組織。所有國家應能得到這種情報。"}, {"n": "8", "en": "Penalties provided for by the laws and regulations of States for vessels flying their flag shall be adequate in severity to discourage violations wherever they occur.", "zh": "各國的法律和規章對懸掛其旗幟的船隻所規定的處罰應足夠嚴厲，以防阻違反行為在任何地方發生。"}], "keys": ["不論違反行為在何處發生", "在能遵守第一款所指的國際規則和標準的規定", "處罰應足夠嚴厲"], "plain": "船旗國是船舶污染的主要執行者：①應確保本國船舶遵守國際規則與本國法規，並有效執行，「不論違反行為在何處發生」；②本國船舶在符合國際規則的設計、構造、裝備與人員配備要求前，應禁止出海；③船上應備有國際規則所要求的證書，並定期檢查；他國原則上應承認這些證書，除非有明顯根據認為船況與證書嚴重不符；④船舶違反國際規則時，船旗國應立即調查，並在適當時提起司法程序；⑤至⑦經任何國家書面請求，船旗國應調查並通報結果；⑧處罰應足夠嚴厲，以防止違反行為。實務上，權宜船旗國執行不力，正是公約另設港口國（第218條）與沿海國（第220條）執行權的原因。", "elements": [{"req": ["懸掛其旗幟或在其國內登記的船舶違反防污國際規則或本國法規"], "effect": "船旗國應不論違反地點，立即調查並在適當情形下提起司法程序；處罰應足夠嚴厲"}], "traps": ["陷阱：船旗國的執行義務「不論違反行為在何處發生」，也不論污染在何處發生或被發現。"], "custom": {"status": "不適用", "note": "條約規定；船旗國對其船舶的專屬管轄與監督義務亦見第94條。", "cases": []}, "related": ["unclos-94", "unclos-211", "unclos-218", "unclos-220", "unclos-228"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "218", "heading": "港口國的執行", "tier": "A", "paras": [{"n": "1", "en": "When a vessel is voluntarily within a port or at an off-shore terminal of a State, that State may undertake investigations and, where the evidence so warrants, institute proceedings in respect of any discharge from that vessel outside the internal waters, territorial sea or exclusive economic zone of that State in violation of applicable international rules and standards established through the competent international organization or general diplomatic conference.", "zh": "當船隻自願位於一國港口或岸外設施時，該國可對該船違反通過主管國際組織或一般外交會議制訂的可適用的國際規則和標準在該國內水、領海或專屬經濟區外的任何排放進行調查，並可在有充分證據的情形下，提起司法程序。"}, {"n": "2", "en": "No proceedings pursuant to paragraph 1 shall be instituted in respect of a discharge violation in the internal waters, territorial sea or exclusive economic zone of another State unless requested by that State, the flag State, or a State damaged or threatened by the discharge violation, or unless the violation has caused or is likely to cause pollution in the internal waters, territorial sea or exclusive economic zone of the State instituting the proceedings.", "zh": "對於在另一國內水、領海或專屬經濟區內發生的違章排放行為，除非經該國、船旗國或受違章排放行為損害或威脅的國家請求，或者違反行為已對或可能對提起司法程序的國家的內水、領海或專屬經濟區造成污染，不應依據第一款提起司法程序。"}, {"n": "3", "en": "When a vessel is voluntarily within a port or at an off-shore terminal of a State, that State shall, as far as practicable, comply with requests from any State for investigation of a discharge violation referred to in paragraph 1, believed to have occurred in, caused, or threatened damage to the internal waters, territorial sea or exclusive economic zone of the requesting State. It shall likewise, as far as practicable, comply with requests from the flag State for investigation of such a violation, irrespective of where the violation occurred.", "zh": "當船隻自願位於一國港口或岸外設施時，該國應在實際可行範圍內滿足任何國家因認為第一款所指的違章排放行為已在其內水、領海或專屬經濟區內發生，對於內水、領海或專屬經濟區已造成損害或有損害的威脅而提出的進行調查的請求，並且應在實際可行範圍內，滿足船旗國對這一違反行為所提出的進行調查請求，不論違反行為在何處發生。"}, {"n": "4", "en": "The records of the investigation carried out by a port State pursuant to this article shall be transmitted upon request to the flag State or to the coastal State. Any proceedings instituted by the port State on the basis of such an investigation may, subject to section 7, be suspended at the request of the coastal State when the violation has occurred within its internal waters, territorial sea or exclusive economic zone. The evidence and records of the case, together with any bond or other financial security posted with the authorities of the port State, shall in that event be transmitted to the coastal State. Such transmittal shall preclude the continuation of proceedings in the port State.", "zh": "港口國依據本條規定進行的調查的紀錄，如經請求，應轉交船旗國或沿海國。在第七節限制下，如果違反行為發生在沿海國的內水、領海或專屬經濟區內，港口國根據這種調查提起的任何司法程序，經該沿海國請求可暫停進行。案件的證據和記錄，連同繳交港口國當局的任何保證書或其他財政擔保，應在這種情形下轉交給該沿海國。轉交後，在港口國即不應繼續進行司法程序。"}], "keys": ["當船隻自願位於一國港口或岸外設施時", "在該國內水、領海或專屬經濟區外的任何排放進行調查", "經該沿海國請求可暫停進行"], "plain": "{{港口國管轄}}是海洋法公約的創新設計：外國船舶「自願」進入一國港口或岸外設施時，該港口國可以調查該船在本國內水、領海、專屬經濟海域「以外」（例如公海）違反國際規則的排放行為，證據充分時並可提起司法程序（第1項）。管轄基礎不是領域或損害，而是船舶自願停靠，加上違反的是「國際」規則。限制：①排放發生在另一國的內水、領海或專屬經濟海域時，須經該國、船旗國或受損害國請求，或該排放已對港口國海域造成或可能造成污染，才能提起程序（第2項）；②港口國應盡量配合他國及船旗國的調查請求（第3項）；③排放發生在沿海國海域者，經該沿海國請求，港口國應暫停程序並移交證據與擔保金，移交後即不得續行（第4項）；④適用第七節的保障辦法（例如第228條船旗國優先、第230條原則上只能科罰金）。實務上，各區域的港口國管制備忘錄（例如1982年《巴黎備忘錄》、1993年《東京備忘錄》）以船舶檢查落實港口國管轄。", "elements": [{"req": ["外國船舶自願位於一國港口或岸外設施", "該船在港口國內水、領海、專屬經濟海域以外的排放", "違反經主管國際組織或一般外交會議制定的可適用國際規則和標準"], "effect": "港口國可以調查，證據充分時可提起司法程序"}, {"req": ["排放發生在另一國的內水、領海或專屬經濟海域"], "effect": "須經該國、船旗國或受損害或威脅的國家請求，或已對港口國海域造成或可能造成污染，才可提起程序"}], "traps": ["陷阱：港口國管轄以船舶「自願」進港為前提；因遇難或不可抗力被迫進港者不適用。", "陷阱：港口國追訴的是違反「國際規則和標準」的排放，管轄範圍可及於公海上的排放，不以港口國受害為要件。", "陷阱：排放發生在另一國海域時，原則上須經該國、船旗國或受害國請求才可追訴。", "陷阱：港口國管轄（第218條）與沿海國管轄（第220條第1項）不同：後者追訴的是發生在「本國」領海或專屬經濟海域內的違反行為。"], "custom": {"status": "不適用", "note": "條約創設的管轄權，一般不認為已屬習慣法。", "cases": []}, "related": ["unclos-211", "unclos-217", "unclos-220", "unclos-228", "unclos-230"], "cases": [], "roc": "我國不是港口國管制備忘錄的成員，但交通部航港局依《商港法》與《船舶法》對進港外國船舶實施港口國檢查。", "essay": "港口國管轄：「第218條授權港口國對自願進港的外國船舶，就其在港口國管轄海域外違反國際規則和標準的排放進行調查與追訴；排放發生在他國海域者，原則上須經該國、船旗國或受害國請求。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "220", "heading": "沿海國的執行", "tier": "A", "paras": [{"n": "1", "en": "When a vessel is voluntarily within a port or at an off-shore terminal of a State, that State may, subject to section 7, institute proceedings in respect of any violation of its laws and regulations adopted in accordance with this Convention or applicable international rules and standards for the prevention, reduction and control of pollution from vessels when the violation has occurred within the territorial sea or the exclusive economic zone of that State.", "zh": "當船隻自願位於一國港口或岸外設施時，該國對在其領海或專屬經濟區內發生的任何違反關於防止、減少和控制船隻造成的污染的該國按照本公約制定的法律和規章或可適用的國際規則和標準的行為，可在第七節限制下，提起司法程序。"}, {"n": "2", "en": "Where there are clear grounds for believing that a vessel navigating in the territorial sea of a State has, during its passage therein, violated laws and regulations of that State adopted in accordance with this Convention or applicable international rules and standards for the prevention, reduction and control of pollution from vessels, that State, without prejudice to the application of the relevant provisions of Part II, section 3, may undertake physical inspection of the vessel relating to the violation and may, where the evidence so warrants, institute proceedings, including detention of the vessel, in accordance with its laws, subject to the provisions of section 7.", "zh": "如有明顯根據認為在一國領海內航行的船隻，在通過領海時，違反關於防止、減少和控制來自船隻的污染的該國按照本公約制定的法律和規章或可適用的國際規則和標準，該國在不妨害第二部份第三節有關規定的適用的情形下，可就違反行為對該船進行實際檢查，並可在有充分證據時，在第七節限制下按照該國法律提起司法程序，包括對該船的拘留在內。"}, {"n": "3", "en": "Where there are clear grounds for believing that a vessel navigating in the exclusive economic zone or the territorial sea of a State has, in the exclusive economic zone, committed a violation of applicable international rules and standards for the prevention, reduction and control of pollution from vessels or laws and regulations of that State conforming and giving effect to such rules and standards, that State may require the vessel to give information regarding its identity and port of registry, its last and its next port of call and other relevant information required to establish whether a violation has occurred.", "zh": "如有明顯根據認為在一國專屬經濟區或領海內航行的船隻，在專屬經濟區違反關於防止、減少和控制來自船隻的污染的可適用的國際規則和標準或符合這種國際規則和標準並使其有效的該國的法律和規章，該國可要求該船提供關於該船的識別標誌、登記港口、上次停泊和下次停泊的港口，以及其他必要的有關情報，以確定是否已有違反行為發生。"}, {"n": "4", "en": "States shall adopt laws and regulations and take other measures so that vessels flying their flag comply with requests for information pursuant to paragraph 3.", "zh": "各國應制定法律和規章，並採取其他措施，以使懸掛其旗幟的船隻遵從依據第三款提供情報的要求。"}, {"n": "5", "en": "Where there are clear grounds for believing that a vessel navigating in the exclusive economic zone or the territorial sea of a State has, in the exclusive economic zone, committed a violation referred to in paragraph 3 resulting in a substantial discharge causing or threatening significant pollution of the marine environment, that State may undertake physical inspection of the vessel for matters relating to the violation if the vessel has refused to give information or if the information supplied by the vessel is manifestly at variance with the evident factual situation and if the circumstances of the case justify such inspection.", "zh": "如有明顯根據認為在一國專屬經濟區或領海內航行的船隻，在專屬經濟區內犯有第三款所指的違反行為而導致大量排放，對海洋環境造成重大污染或有造成重大污染的威脅，該國在該船拒不提供情報，或所提供的情報與明顯的實際情況顯然不符，並且依案件情況確有進行檢查的理由時，可就有關違反行為的事項對該船進行實際檢查。"}, {"n": "6", "en": "Where there is clear objective evidence that a vessel navigating in the exclusive economic zone or the territorial sea of a State has, in the exclusive economic zone, committed a violation referred to in paragraph 3 resulting in a discharge causing major damage or threat of major damage to the coastline or related interests of the coastal State, or to any resources of its territorial sea or exclusive economic zone, that State may, subject to section 7, provided that the evidence so warrants, institute proceedings, including detention of the vessel, in accordance with its laws.", "zh": "如有明顯客觀證據證明在一國專屬經濟區或領海內航行的船隻，在專屬經濟區內犯有第三款所指的違反行為而導致排放，對沿海國的海岸或有關利益，或對其領海或專屬經濟區內的任何資源，造成重大損害或有造成重大損害的威脅，該國在有充分證據時，可在第七節限制下，按照該國法律提起司法程序，包括對該船的拘留在內。"}, {"n": "7", "en": "Notwithstanding the provisions of paragraph 6, whenever appropriate procedures have been established, either through the competent international organization or as otherwise agreed, whereby compliance with requirements for bonding or other appropriate financial security has been assured, the coastal State if bound by such procedures shall allow the vessel to proceed.", "zh": "雖有第六款的規定，無論何時如已通過主管國際組織或另外協議制訂了適當的程序，從而已經確保關於保證書或其他適當財政擔保的規定得到遵守，沿海國如受這種程序的拘束，應即准許該船繼續航行。"}, {"n": "8", "en": "The provisions of paragraphs 3, 4, 5, 6 and 7 also apply in respect of national laws and regulations adopted pursuant to article 211, paragraph 6.", "zh": "第三、第四、第五、第六和第七款的規定也應適用於依據第二百一十一條第六款制定的國內法律和規章。"}], "keys": ["可就違反行為對該船進行實際檢查", "可要求該船提供關於該船的識別標誌、登記港口", "造成重大損害或有造成重大損害的威脅", "應即准許該船繼續航行"], "plain": "沿海國的執行權依違規地點與嚴重程度分級：①船舶自願在港時，可追訴其在本國領海或專屬經濟海域內的違反行為（第1項）；②在領海內航行的船舶，如有明顯根據認為其通過時違反防污法規，可實際檢查，證據充分時並可提起程序、拘留船舶（第2項）；③在專屬經濟海域違反防污規則者，分三級——有明顯根據即可「要求提供資料」（識別、登記港口、上一個和下一個停靠港，第3項）；導致「大量排放、造成重大污染或其威脅」，且船舶拒絕提供資料或資料明顯不實時，才可「實際檢查」（第5項）；有「明顯客觀證據」證明排放造成沿海國海岸、有關利益或資源「重大損害或其威脅」時，才可提起程序並拘留船舶（第6項）；④已有保證書或其他財政擔保的程序時，沿海國應准許船舶繼續航行（第7項）。另受第七節保障辦法限制。", "elements": [{"req": ["在領海內航行的船舶", "有明顯根據認為其通過時違反沿海國防污法規或國際規則"], "effect": "可實際檢查；證據充分時可提起司法程序，包括拘留船舶"}, {"req": ["船舶在專屬經濟海域違反防污國際規則或相關國內法", "有明顯根據"], "effect": "只可要求提供識別、登記港口與停靠港等資料"}, {"req": ["在專屬經濟海域違反並導致大量排放，造成重大污染或其威脅", "船舶拒絕提供資料或資料明顯不實"], "effect": "可實際檢查"}, {"req": ["有明顯客觀證據證明在專屬經濟海域的排放造成沿海國重大損害或其威脅"], "effect": "可提起司法程序，包括拘留船舶"}], "traps": ["陷阱：在專屬經濟海域違規，沿海國不能一開始就登檢拘留，要依「要求資料→實際檢查→提起程序與拘留」逐級升高。", "陷阱：拘留的門檻是「明顯客觀證據」與「重大損害或其威脅」，比要求資料的「明顯根據」高。", "陷阱：已有保證書或財政擔保程序時，沿海國應准許船舶繼續航行（第7項），與第73條漁業執法的迅速釋放概念相近。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-211", "unclos-218", "unclos-226", "unclos-73", "unclos-292", "unclos-19"], "cases": [], "roc": "", "essay": "沿海國執法：「第220條依海域與嚴重程度分級：在領海內可實際檢查並拘留（第2項）；在專屬經濟海域則由要求資料（第3項）、實際檢查（第5項，須有大量排放造成重大污染）到提起程序與拘留（第6項，須有明顯客觀證據證明重大損害）逐級升高。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "英文本第8項「6and 7」為文字辨識錯誤，依聯合國英文本更正為「6 and 7」。"}]});
ARTICLES.push({"treaty": "unclos", "no": "221", "heading": "避免海難引起污染的措施", "tier": "B", "paras": [{"n": "1", "en": "Nothing in this Part shall prejudice the right of States, pursuant to international law, both customary and conventional, to take and enforce measures beyond the territorial sea proportionate to the actual or threatened damage to protect their coastline or related interests, including fishing, from pollution or threat of pollution following upon a maritime casualty or acts relating to such a casualty, which may reasonably be expected to result in major harmful consequences.", "zh": "本部份的任何規定不應妨害各國為保護其海岸或有關利益，包括捕魚，免受海難或與海難有關的行動所引起，並能合理預期造成重大有害後果的污染或污染威脅，而依據國際法，不論是根據習慣還是條約，在其領海範圍以外，採取和執行與實際的或可能發生的損害相稱的措施的權利。"}, {"n": "2", "en": "For the purposes of this article, \"maritime casualty\" means a collision of vessels, stranding or other incident of navigation, or other occurrence on board a vessel or external to it resulting in material damage or imminent threat of material damage to a vessel or cargo.", "zh": "為本條的目的，「海難」是指船隻碰撞、擱淺或其他航行事故，或船上或船外所發生對船隻或船貨造成重大損害或重大損害的迫切威脅的其他事故。"}], "keys": ["在其領海範圍以外，採取和執行與實際的或可能發生的損害相稱的措施的權利"], "plain": "發生海難（船舶碰撞、擱淺或其他航行事故，造成船舶或貨物重大損害或其迫切威脅）時，沿海國為保護其海岸與相關利益（包括漁業），可依習慣法與條約，在領海以外採取與實際或可能損害「相稱」的措施（第1項）。背景是1967年托利峽谷號（Torrey Canyon）油輪在英國外海擱淺，英國轟炸船體燃燒剩油，催生1969年《公海油污事故干預公約》。本條保留這項權利，不受第十二部分其他規定影響。", "elements": [{"req": ["海難或與海難有關的行動", "可合理預期造成重大有害後果的污染或其威脅"], "effect": "沿海國可在領海以外，採取與實際或可能損害相稱的措施，保護其海岸與相關利益"}], "traps": ["陷阱：措施必須與損害「相稱」（比例原則），且可在「領海以外」採取。"], "custom": {"status": "部分", "note": "本條明文承認此權利可依習慣法或條約（1969年干預公約）行使。", "cases": []}, "related": ["unclos-211", "unclos-194"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "234", "heading": "冰封區域", "tier": "B", "paras": [{"n": "", "en": "Coastal States have the right to adopt and enforce non-discriminatory laws and regulations for the prevention, reduction and control of marine pollution from vessels in ice-covered areas within the limits of the exclusive economic zone, where particularly severe climatic conditions and the presence of ice covering such areas for most of the year create obstructions or exceptional hazards to navigation, and pollution of the marine environment could cause major harm to or irreversible disturbance of the ecological balance. Such laws and regulations shall have due regard to navigation and the protection and preservation of the marine environment based on the best available scientific evidence.", "zh": "沿海國有權制定和執行非歧視性的法律和規章，以防止、減少和控制船隻在專屬經濟區範圍內冰封區域對海洋的污染，這種區域內的特別嚴寒氣候和一年中大部分時候冰封的情形對航行造成障礙或特別危險，而且海洋環境污染可能對生態平衡造成重大的損害或無可挽救的擾亂。這種法律和規章應適當顧及航行和以現有最可靠的科學證據為基礎對海洋環境的保護和保全。"}], "keys": ["沿海國有權制定和執行非歧視性的法律和規章", "專屬經濟區範圍內冰封區域"], "plain": "「北極條款」：在專屬經濟海域範圍內的{{冰封區域}}，因氣候特別嚴寒、終年大部分時間冰封，對航行造成障礙或特別危險，污染可能嚴重破壞生態平衡時，沿海國有權制定並執行「非歧視性」的船舶防污法規。這比第211條第5、6項只能實施國際規則更寬，沿海國可以訂得比國際標準嚴格。主要受益者是加拿大與俄羅斯（西北航道、北方海航道）。限制：法規應適當顧及航行，並以現有最可靠的科學證據為基礎。", "elements": [{"req": ["專屬經濟海域範圍內的冰封區域", "特別嚴寒、終年大部分時間冰封，對航行造成障礙或特別危險", "污染可能嚴重損害或不可逆地擾亂生態平衡"], "effect": "沿海國可制定並執行非歧視性的船舶防污法規，但應適當顧及航行"}], "traps": ["陷阱：冰封區域條款允許沿海國制定比國際標準更嚴格的法規，但必須「非歧視」，並適當顧及航行。", "陷阱：適用範圍是「專屬經濟海域範圍內」的冰封區域。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-211", "unclos-56"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "235", "heading": "責任", "tier": "A", "paras": [{"n": "1", "en": "States are responsible for the fulfilment of their international obligations concerning the protection and preservation of the marine environment. They shall be liable in accordance with international law.", "zh": "各國有責任履行其關於保護和保全海洋環境的國際義務，各國應按照國際法承擔責任。"}, {"n": "2", "en": "States shall ensure that recourse is available in accordance with their legal systems for prompt and adequate compensation or other relief in respect of damage caused by pollution of the marine environment by natural or juridical persons under their jurisdiction.", "zh": "各國對於在其管轄下的自然人或法人污染海洋環境所造成的損害，應確保按照其法律制度，可以提起申訴以獲得迅速和適當的補償或其他救濟。"}, {"n": "3", "en": "With the objective of assuring prompt and adequate compensation in respect of all damage caused by pollution of the marine environment, States shall cooperate in the implementation of existing international law and the further development of international law relating to responsibility and liability for the assessment of and compensation for damage and the settlement of related disputes, as well as, where appropriate, development of criteria and procedures for payment of adequate compensation, such as compulsory insurance or compensation funds.", "zh": "為了對污染海洋環境所造成的一切損害保證迅速而適當地給予補償的目的，各國應進行合作，以便就估量和補償損害的責任以及解決有關的爭端，實施現行國際法和進一步發展國際法，並在適當情形下，擬訂諸如強制保險或補償基金等關於給付適當補償的標準和程序。"}], "keys": ["各國應按照國際法承擔責任", "可以提起申訴以獲得迅速和適當的補償或其他救濟", "強制保險或補償基金"], "plain": "三層責任機制：①國家層次——各國有責任履行保護海洋環境的國際義務，違反時依國際法負國家責任（第1項），即依國家責任的一般規則判斷不法行為、歸責與賠償；②國內層次——對於其管轄下自然人或法人造成的污染損害，各國應確保其國內法提供可以迅速、適當取得補償或其他救濟的途徑（第2項）；③國際合作——各國應合作發展責任與賠償的國際法，例如擬訂強制保險或補償基金制度（第3項），具體成果如1969年《油污損害民事責任國際公約》（CLC）、1971年《設立國際油污損害賠償基金國際公約》（後以1992年議定書取代）。[[case|icj-climate|國際法院2025年諮詢意見]]指出，國家未履行保護氣候系統的義務（包括第十二部分的義務）構成國際不法行為，應負停止、保證不再犯與完全賠償等法律後果。", "elements": [{"req": ["國家違反保護和保全海洋環境的國際義務"], "effect": "依國際法承擔國家責任"}, {"req": ["其管轄下的自然人或法人污染海洋環境造成損害"], "effect": "國家應確保其國內法提供迅速和適當的補償或其他救濟途徑"}], "traps": ["陷阱：第1項指國家依國際法的責任；第2項是國家確保「國內」救濟途徑的義務，兩者不同。", "陷阱：第3項舉例的是「強制保險或補償基金」等制度，具體賠償制度另由油污責任公約、基金公約等條約規定。"], "custom": {"status": "部分", "note": "違反國際義務即生國家責任，屬習慣法（國家責任條款第1條）；第2、3項為條約規定。", "cases": []}, "related": ["unclos-192", "unclos-194", "unclos-139", "unclos-304"], "cases": [{"id": "icj-climate", "point": "違反保護氣候系統的義務（包括海洋法公約第十二部分）構成國際不法行為，依國家責任一般規則負停止、保證不再犯與完全賠償等後果。"}], "roc": "", "essay": "責任：「第235條規定各國有責任履行保護海洋環境的國際義務，違反時依國際法負國家責任（第1項）；並應確保國內法提供迅速適當的補償救濟（第2項），及合作發展強制保險、補償基金等賠償制度（第3項）。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「加強保險」依英文作準本及上下文更正為「強制保險」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "236", "heading": "主權豁免", "tier": "B", "paras": [{"n": "", "en": "The provisions of this Convention regarding the protection and preservation of the marine environment do not apply to any warship, naval auxiliary, other vessels or aircraft owned or operated by a State and used, for the time being, only on government non-commercial service. However, each State shall ensure, by the adoption of appropriate measures not impairing operations or operational capabilities of such vessels or aircraft owned or operated by it, that such vessels or aircraft act in a manner consistent, so far as is reasonable and practicable, with this Convention.", "zh": "本公約關於保護和保全海洋環境的規定，不適用於任何軍艦、海軍輔助船、為國家所擁有或經營並在當時只供政府非商業性服務之用的其他船隻或飛機。但每一國家應採取不妨害該國所擁有或經營的這種船隻或飛機的操作或操作能力的適當措施，以確保在合理可行範圍內這種船隻或飛機的活動方式符合本公約。"}], "keys": ["不適用於任何軍艦、海軍輔助船", "在合理可行範圍內這種船隻或飛機的活動方式符合本公約"], "plain": "第十二部分關於保護海洋環境的規定，不適用於{{軍艦}}、海軍輔助船，以及國家擁有或經營、當時只供政府非商業性服務的其他船舶或飛機。但各國仍應採取不妨害其操作的適當措施，確保這些船舶或飛機在合理可行範圍內符合公約。豁免的意義是：他國不能依第十二部分對這些船舶執法（第218、220條等），但船旗國本身仍負有確保其大致合規的義務。與第32、95、96條的軍艦豁免一致。", "elements": [{"req": ["軍艦、海軍輔助船，或國家擁有或經營、當時只供政府非商業性服務的船舶或飛機"], "effect": "不適用第十二部分保護海洋環境的規定；但其所屬國應確保其在合理可行範圍內符合公約"}], "traps": ["陷阱：主權豁免排除的是第十二部分的適用與他國執法，不是讓船旗國完全不必在意環保；船旗國仍應確保其在合理可行範圍內符合公約。", "陷阱：豁免限於「政府非商業性服務」的國有船舶；國營商船不在此列。"], "custom": {"status": "不適用", "note": "條約規定；軍艦與政府非商業船舶豁免的一般規則見第32、95、96條。", "cases": []}, "related": ["unclos-29", "unclos-32", "unclos-95", "unclos-96"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "237", "heading": "關於保護和保全海洋環境的其他公約所規定的義務", "tier": "B", "paras": [{"n": "1", "en": "The provisions of this Part are without prejudice to the specific obligations assumed by States under special conventions and agreements concluded previously which relate to the protection and preservation of the marine environment and to agreements which may be concluded in furtherance of the general principles set forth in this Convention.", "zh": "本部份的規定不影響各國根據先前締結的關於保護和保全海洋環境的特別公約和協定所承擔的特定義務，也不影響為了推行本公約所載的一般原則而可能締結的協定。"}, {"n": "2", "en": "Specific obligations assumed by States under special conventions, with respect to the protection and preservation of the marine environment, should be carried out in a manner consistent with the general principles and objectives of this Convention.", "zh": "各國根據特別公約所承擔的關於保護和保全海洋環境的特定義務，應依符合本公約一般原則和目標的方式履行。"}], "keys": ["不影響各國根據先前締結的關於保護和保全海洋環境的特別公約和協定所承擔的特定義務", "應依符合本公約一般原則和目標的方式履行"], "plain": "第十二部分是海洋環境保護的「綱要」：不影響各國依既有或未來特別公約承擔的特定義務（第1項），但這些特別義務應以符合本公約一般原則和目標的方式履行（第2項）。所以MARPOL、倫敦傾倒公約、區域海洋公約與第十二部分並存互補。國際海洋法法庭2024年諮詢意見依此認為，《巴黎協定》不是排除第十二部分的特別法，遵守《巴黎協定》不當然等於履行公約義務。", "elements": [{"req": ["各國依其他保護海洋環境的特別公約承擔的特定義務"], "effect": "不受第十二部分影響，但應以符合本公約一般原則和目標的方式履行"}], "traps": ["陷阱：其他環境條約與第十二部分並存，不是互相取代；《巴黎協定》不是排除海洋法公約的特別法（國際海洋法法庭2024年）。"], "custom": {"status": "不適用", "note": "條約關係規定。", "cases": []}, "related": ["unclos-192", "unclos-311"], "cases": [{"id": "itlos-climate", "point": "《巴黎協定》不是排除第十二部分的特別法；履行《巴黎協定》不當然滿足海洋法公約的義務。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "238", "heading": "進行海洋科學研究的權利", "tier": "B", "paras": [{"n": "", "en": "All States, irrespective of their geographical location, and competent international organizations have the right to conduct marine scientific research subject to the rights and duties of other States as provided for in this Convention.", "zh": "所有國家，不論其地理位置如何，以及各主管國際組織，在本公約所規定的其他國家的權利和義務的限制下，均有權進行海洋科學研究。"}], "keys": ["均有權進行海洋科學研究"], "plain": "第十三部分的總綱：所有國家（不論地理位置，包括內陸國）與主管國際組織，都有權進行{{海洋科學研究}}，但須受公約規定的其他國家權利與義務的限制。在不同海域受到的限制不同：領海須經明示同意（第245條）；專屬經濟海域與大陸礁層須經同意（第246條）；公海與「區域」則為自由（第87條第1項(f)款、第256、257條）。", "elements": [{"req": ["所有國家（不論地理位置）與主管國際組織"], "effect": "有權進行海洋科學研究，但受公約規定的其他國家權利和義務限制"}], "traps": ["陷阱：海洋科學研究的權利主體包括內陸國與主管國際組織；但在他國管轄海域須依第245、246條取得同意。"], "custom": {"status": "不適用", "note": "條約規定；公海科研自由則列於第87條。", "cases": []}, "related": ["unclos-87", "unclos-240", "unclos-245", "unclos-246"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "240", "heading": "進行海洋科學研究的一般原則", "tier": "B", "paras": [{"n": "", "en": "In the conduct of marine scientific research the following principles shall apply:\n(a) marine scientific research shall be conducted exclusively for peaceful purposes;\n(b) marine scientific research shall be conducted with appropriate scientific methods and means compatible with this Convention;\n(c) marine scientific research shall not unjustifiably interfere with other legitimate uses of the sea compatible with this Convention and shall be duly respected in the course of such uses;\n(d) marine scientific research shall be conducted in compliance with all relevant regulations adopted in conformity with this Convention including those for the protection and preservation of the marine environment.", "zh": "進行海洋科學研究時應適用下列原則：\n(a)海洋科學研究應專為和平目的而進行；\n(b)海洋科學研究應以符合本公約的適當科學方法和工具進行；\n(c)海洋科學研究不應對符合本公約的海洋其他正當用途有不當干擾，而這種研究在上述用途過程中應適當地受到尊重；\n(d)海洋科學研究的進行應遵守依照本公約制定的一切有關規章，包括關於保護和保全海洋環境的規章。"}], "keys": ["海洋科學研究應專為和平目的而進行"], "plain": "四項一般原則：(a)專為和平目的；(b)以符合公約的適當科學方法和工具進行；(c)不得不當干擾海洋其他正當用途，而這種研究也應受到適當尊重；(d)遵守依公約制定的有關規章，包括保護海洋環境的規章。另依第241條，海洋科學研究不構成任何權利主張的法律根據——在爭議海域做研究，不能據此主張主權或海域權利。", "elements": [{"req": ["進行海洋科學研究"], "effect": "應專為和平目的、以適當科學方法進行、不得不當干擾海洋其他正當用途，並遵守相關規章"}], "traps": ["陷阱：海洋科學研究「專為和平目的」；依第241條，研究活動不構成任何權利主張的法律根據。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-238", "unclos-246", "unclos-88"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "245", "heading": "領海內的海洋科學研究", "tier": "B", "paras": [{"n": "", "en": "Coastal States, in the exercise of their sovereignty, have the exclusive right to regulate, authorize and conduct marine scientific research in their territorial sea. Marine scientific research therein shall be conducted only with the express consent of and under the conditions set forth by the coastal State.", "zh": "沿海國在行使其主權時，有規定、准許和進行其領海內的海洋科學研究的專屬權利。領海內的海洋科學研究，應經沿海國明示同意並在沿海國規定的條件下，才可進行。"}], "keys": ["有規定、准許和進行其領海內的海洋科學研究的專屬權利", "應經沿海國明示同意"], "plain": "領海是沿海國主權範圍，沿海國有規定、准許和進行領海內海洋科學研究的「專屬權利」；外國須經沿海國「明示同意」，並依其規定的條件才能進行。對照：外國船舶在領海內進行研究或測量活動，會使其通過不再是無害通過（第19條第2項(j)款）；在國際海峽過境通行時，非經海峽沿岸國事前准許，也不得進行研究或測量（第40條）。", "elements": [{"req": ["在沿海國領海內進行海洋科學研究"], "effect": "須經沿海國明示同意，並依其規定的條件進行"}], "traps": ["陷阱：領海內研究須「明示」同意；專屬經濟海域與大陸礁層則是「同意」制，並有正常情形下應同意與默示同意（第252條）的設計。", "陷阱：過境通行中的船舶也不得未經許可進行研究或測量（第40條；gl114a_8選項D錯誤）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-2", "unclos-19", "unclos-40", "unclos-238", "unclos-246"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_8", "note": "過境通行的船舶不得未經海峽沿岸國事前准許進行研究或測量（第40條）；領海內研究亦須明示同意（本條）。選項D錯誤，為正解。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "246", "heading": "專屬經濟區內和大陸架上的海洋科學研究", "tier": "A", "paras": [{"n": "1", "en": "Coastal States, in the exercise of their jurisdiction, have the right to regulate, authorize and conduct marine scientific research in their exclusive economic zone and on their continental shelf in accordance with the relevant provisions of this Convention.", "zh": "沿海國在行使其管轄權時，有權按照本公約的有關條款，規定、准許和進行在其專屬經濟區內或大陸架上的海洋科學研究。"}, {"n": "2", "en": "Marine scientific research in the exclusive economic zone and on the continental shelf shall be conducted with the consent of the coastal State.", "zh": "在專屬經濟區內和大陸架上進行海洋科學研究，應經沿海國同意。"}, {"n": "3", "en": "Coastal States shall, in normal circumstances, grant their consent for marine scientific research projects by other States or competent international organizations in their exclusive economic zone or on their continental shelf to be carried out in accordance with this Convention exclusively for peaceful purposes and in order to increase scientific knowledge of the marine environment for the benefit of all mankind. To this end, coastal States shall establish rules and procedures ensuring that such consent will not be delayed or denied unreasonably.", "zh": "在正常情形下，沿海國應對其他國家或各主管國際組織按照本公約專為和平目的和為了增進關於海洋環境的科學知識以謀全人類利益，而在其專屬經濟區內或大陸架上進行的海洋科學研究計劃，給予同意。為此目的，沿海國應制定規則和程序，確保不致不合理地推遲或拒絕給予同意。"}, {"n": "4", "en": "For the purposes of applying paragraph 3, normal circumstances may exist in spite of the absence of diplomatic relations between the coastal State and the researching State.", "zh": "為適用第三款的目的，儘管沿海國和研究國之間沒有外交關係，它們之間仍可存在正常情況。"}, {"n": "5", "en": "Coastal States may however in their discretion withhold their consent to the conduct of a marine scientific research project of another State or competent international organization in the exclusive economic zone or on the continental shelf of the coastal State if that project:\n(a) is of direct significance for the exploration and exploitation of natural resources, whether living or non-living;\n(b) involves drilling into the continental shelf, the use of explosives or the introduction of harmful substances into the marine environment;\n(c) involves the construction, operation or use of artificial islands, installations and structures referred to in articles 60 and 80;\n(d) contains information communicated pursuant to article 248 regarding the nature and objectives of the project which is inaccurate or if the researching State or competent international organization has outstanding obligations to the coastal State from a prior research project.", "zh": "但沿海國可斟酌決定，拒不同意另一國家或主管國際組織在該沿海國專屬經濟區內或大陸架上進行海洋科學研究計劃，如果該計劃：\n(a)與生物或非生物自然資源的勘探和開發有直接關係；\n(b)涉及大陸架的鑽探、炸藥的使用或將有害物質引入海洋環境；\n(c)涉及第六十和第八十條所指的人工島嶼、設施和結構的建造、操作或使用；\n(d)含有依據第二百四十八條提出的關於該計劃的性質和目標的不正確情報，或如進行研究的國家或主管國際組織由於先前進行研究計劃而對沿海國負有尚未履行的義務。"}, {"n": "6", "en": "Notwithstanding the provisions of paragraph 5, coastal States may not exercise their discretion to withhold consent under subparagraph (a) of that paragraph in respect of marine scientific research projects to be undertaken in accordance with the provisions of this Part on the continental shelf, beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured, outside those specific areas which coastal States may at any time publicly designate as areas in which exploitation or detailed exploratory operations focused on those areas are occurring or will occur within a reasonable period of time. Coastal States shall give reasonable notice of the designation of such areas, as well as any modifications thereto, but shall not be obliged to give details of the operations therein.", "zh": "雖有第五款的規定，如果沿海國已在任何時候公開指定從測算領海寬度的基線量起二百海里以外的某些特定區域為已在進行或將在合理期間內進行開發或詳探作業的重點區域，則沿海國對於在這些特定區域之外的大陸架上按照本部份規定進行的海洋科學研究計劃，即不得行使該款(a) 項規定的斟酌決定權而拒不同意。沿海國對於這類區域的指定及其任何更改，應提出合理的通知，但無須提供其中作業的詳情。"}, {"n": "7", "en": "The provisions of paragraph 6 are without prejudice to the rights of coastal States over the continental shelf as established in article 77.", "zh": "第六款的規定不影響第七十七條所規定的沿海國對大陸架的權利。"}, {"n": "8", "en": "Marine scientific research activities referred to in this article shall not unjustifiably interfere with activities undertaken by coastal States in the exercise of their sovereign rights and jurisdiction provided for in this Convention.", "zh": "本條所指的海洋科學研究活動，不應對沿海國行使本公約所規定的主權權利和管轄權所進行的活動有不當的干擾。"}], "keys": ["在專屬經濟區內和大陸架上進行海洋科學研究，應經沿海國同意", "在正常情形下，沿海國應對其他國家或各主管國際組織", "儘管沿海國和研究國之間沒有外交關係", "沿海國可斟酌決定，拒不同意"], "plain": "專屬經濟海域與大陸礁層上的{{海洋科學研究}}採「同意制」，但同意權受到限制：①沿海國依其管轄權，有權規定、准許和進行研究（第1項，對應第56條第1項(b)款(ii)目）；②外國研究須經沿海國同意（第2項）；③「正常情形下」，對專為和平目的、為增進全人類科學知識的研究計畫，沿海國「應」給予同意，並應訂定規則避免不合理地延遲或拒絕（第3項）；④即使兩國沒有外交關係，仍可能屬於正常情形（第4項）；⑤沿海國可斟酌拒絕的情形限於四種：(a)與自然資源的探勘開發有直接關係；(b)涉及大陸礁層鑽探、使用炸藥或引入有害物質；(c)涉及人工島嶼、設施和結構；(d)提供的資料不正確，或研究方對沿海國尚有前次研究的未履行義務（第5項）；⑥在200浬以外的大陸礁層，除沿海國公開指定的開發重點區域外，不得以(a)款理由拒絕（第6項）。此外，依第252條，研究國依第248條提供資料後滿6個月，沿海國4個月內未表示反對者，視為默示同意。", "elements": [{"req": ["外國或主管國際組織在沿海國專屬經濟海域或大陸礁層上進行海洋科學研究"], "effect": "須經沿海國同意"}, {"req": ["研究專為和平目的、為增進全人類科學知識", "屬正常情形（即使沒有外交關係）"], "effect": "沿海國應給予同意，不得不合理地延遲或拒絕"}, {"req": ["研究與資源探勘開發直接相關、涉及鑽探或炸藥或有害物質、涉及人工島嶼設施，或資料不正確或有未履行義務"], "effect": "沿海國可斟酌拒絕同意"}], "traps": ["陷阱：專屬經濟海域的研究須經沿海國「同意」，但正常情形下沿海國「應」同意；不是完全自由，也不是沿海國可以任意拒絕。", "陷阱：沒有外交關係仍可能屬於「正常情形」（第4項）。", "陷阱：可斟酌拒絕的理由限於第5項四款；200浬以外大陸礁層原則上不得以資源開發相關為由拒絕（第6項）。", "陷阱：研究權利受沿海國管轄，但研究活動本身不能作為主張權利的依據（第241條）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-56", "unclos-77", "unclos-238", "unclos-240", "unclos-245", "unclos-60", "unclos-80"], "cases": [], "roc": "《中華民國專屬經濟海域及大陸礁層法》規定，外國人在我國專屬經濟海域或大陸礁層進行海洋科學研究，應經我國政府許可。", "essay": "專屬經濟海域的科學研究：「依第246條，外國在沿海國專屬經濟海域或大陸礁層進行海洋科學研究須經同意，但正常情形下沿海國應給予同意，不得不合理延遲或拒絕；僅於第5項所列情形（如與資源開發直接相關、涉及鑽探或炸藥）得斟酌拒絕。依第252條並有默示同意制度。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「不合理地推進或拒絕」依英文作準本及上下文更正為「不合理地推遲或拒絕」（待以聯合國作準中文本覆核）。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第4項「盡管」依英文作準本及上下文更正為「儘管」（待以聯合國作準中文本覆核）。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第5項「大陸架的鈷探」依英文作準本及上下文更正為「大陸架的鑽探」（待以聯合國作準中文本覆核）。"}]});
CASES.push({"id": "pulp-mills", "nameZh": "烏拉圭河紙漿廠案（阿根廷訴烏拉圭）", "nameEn": "Pulp Mills on the River Uruguay (Argentina v. Uruguay)", "court": "國際法院", "year": "2010", "date": "2010-04-20", "kind": "判決", "parties": "阿根廷2006年5月4日依1975年《烏拉圭河規約》第60條起訴烏拉圭；兩次臨時措施聲請（阿根廷2006年、烏拉圭2006年）均遭駁回。", "facts": "烏拉圭河是阿根廷與烏拉圭的界河，兩國於1975年訂立《烏拉圭河規約》，設烏拉圭河管理委員會（CARU），要求一方在河上進行可能影響航行、水量或水質的工程前，須經委員會通知他方並進行協商。烏拉圭未依此程序，即核准兩座紙漿廠（其中Orion廠，即Botnia廠，2007年開始運轉）。阿根廷主張烏拉圭違反程序義務，並違反防止污染、保護河川生態的實體義務。", "issues": ["烏拉圭是否違反規約第7至12條的通知與協商程序義務？", "烏拉圭是否違反規約第35、36、41條防止污染與保護水質的實體義務？", "環境影響評估是否為一般國際法上的義務？其內容如何決定？"], "holding": ["程序義務：烏拉圭未經委員會通知阿根廷即核准紙漿廠，違反規約第7至12條的程序義務（13比1）；法院宣告此違約即構成適當的「抵償」，不命拆廠或賠償。", "實體義務：阿根廷未能證明紙漿廠運轉造成違反規約的污染，烏拉圭未違反第35、36、41條的實體義務（11比3）。", "環境影響評估：在擬議的工業活動可能於跨界脈絡下造成重大不利影響，特別是對共享資源時，事前進行環境影響評估已屬一般國際法上的要求；評估的範圍與內容則由各國國內法或核准程序決定，並須於計畫實施前進行，計畫開始後須持續監測。", "預防與相當注意：防止原則源於國家應盡的相當注意義務；未進行環境影響評估，即不能認為已盡相當注意。"], "significance": "考點：①國際法院首次確認環境影響評估是一般國際法上的義務（gl114a_13選項C正確）；②程序義務與實體義務可分別違反，違反程序義務不當然構成實體違反；③宣告違法本身可構成抵償。後續哥斯大黎加訴尼加拉瓜（2015）將環境影響評估義務延伸至一般有重大跨界損害風險的活動；國際海洋法法庭2024年諮詢意見與國際法院2025年諮詢意見都援引本案。海洋法公約的對應條文為第206條（評估）與第204條（監測）。", "articles": ["unclos-194", "unclos-206"], "exam": ["gl114a_13"], "srcUrl": "https://www.icj-cij.org/case/135", "verified": "2026-10-07"});
CASES.push({"id": "itlos-climate", "nameZh": "國際海洋法法庭氣候變遷諮詢意見（小島國家氣候變遷與國際法委員會請求）", "nameEn": "Request for an Advisory Opinion submitted by the Commission of Small Island States on Climate Change and International Law (Case No. 31)", "court": "國際海洋法法庭（全庭）", "year": "2024", "date": "2024-05-21", "kind": "諮詢意見", "parties": "小島國家氣候變遷與國際法委員會（COSIS，2021年由安地卡及巴布達與吐瓦魯設立）於2022年12月12日提出請求；多國及國際組織提出書面與言詞意見。", "facts": "COSIS依其設立協定的授權，請求法庭就兩個問題提出諮詢意見：海洋法公約締約國依公約負有何種特定義務，以(a)防止、減少和控制人為溫室氣體排放造成的氣候變遷（包括海洋暖化、海平面上升與海洋酸化）對海洋環境的污染；(b)保護和保全海洋環境免受氣候變遷衝擊與海洋酸化。法庭依其規約第21條與法庭規則第138條，以國際協定授權為基礎行使全庭諮詢管轄。", "issues": ["法庭全庭是否有諮詢管轄權？", "人為溫室氣體排放是否屬公約第1條第1項第4款的「海洋環境污染」？", "締約國依第194條等規定負有何種義務？標準為何？", "第192條的保護與保全義務是否涵蓋氣候變遷衝擊？"], "holding": ["管轄權：法庭全庭依國際協定的授權有諮詢管轄權，並無拒絕提供意見的理由（全體一致）。", "人為溫室氣體排放進入大氣，屬於公約所稱的「海洋環境污染」。", "第194條第1項要求締約國採取一切必要措施，防止、減少和控制溫室氣體排放造成的海洋污染；這是行為義務，須盡嚴格的相當注意，標準高於一般情形，因為損害嚴重且不可逆。", "《巴黎協定》不是排除公約適用的特別法；僅遵守《巴黎協定》的承諾，不當然足以履行公約義務。", "第194條第2項：應確保管轄下的排放不致對他國造成污染損害；第207、212條要求制定法規，第213、222條要求執行；可能造成重大污染的計畫活動應依第206條進行環境影響評估。", "第192條涵蓋保護海洋環境免受氣候變遷衝擊與海洋酸化，必要時應恢復退化的海洋棲地與生態系；並有合作義務（第197條），以及協助發展中國家的特定義務（第202、203條）。"], "significance": "第一份由國際法院或法庭就氣候變遷義務作成的意見，全體一致。考點：①溫室氣體屬海洋環境污染；②第194條第1項是須盡嚴格相當注意的行為義務；③《巴黎協定》不是特別法；④國際海洋法法庭全庭可依協定授權行使諮詢管轄（2015年次區域漁業委員會案已確認）。答題時可用於es114l_2等海洋環境申論題。", "articles": ["unclos-1", "unclos-192", "unclos-194", "unclos-197", "unclos-206", "unclos-207", "unclos-212", "unclos-237"], "exam": [], "srcUrl": "https://www.itlos.org/en/main/cases/list-of-cases/request-for-an-advisory-opinion-submitted-by-the-commission-of-small-island-states-on-climate-change-and-international-law-request-for-advisory-opinion-submitted-to-the-tribunal/", "verified": "2026-10-07"});
CASES.push({"id": "icj-climate", "nameZh": "國家在氣候變遷方面的義務諮詢意見", "nameEn": "Obligations of States in respect of Climate Change (Advisory Opinion)", "court": "國際法院", "year": "2025", "date": "2025-07-23", "kind": "諮詢意見", "parties": "聯合國大會2023年3月29日以第77/276號決議（萬那杜主導）請求；91份書面意見、96個國家與11個國際組織參加言詞程序。", "facts": "大會請求法院回答：(a)依國際法，各國為當代與後代保護氣候系統及環境其他部分免受人為溫室氣體排放影響，負有何種義務？(b)各國因作為或不作為對氣候系統造成重大損害時，對受影響國家（特別是小島嶼發展中國家）及當代與後代的人民與個人，應負何種法律後果？", "issues": ["哪些國際法規範適用於氣候變遷義務？氣候條約是否為排除其他規範的特別法？", "各國依氣候條約、習慣法、海洋法公約與人權法負有何種義務？", "違反這些義務的法律後果為何？"], "holding": ["適用法：氣候條約不是排除其他規範的特別法；習慣法、海洋法公約、人權條約等同樣適用。", "氣候條約：《巴黎協定》締約國須盡相當注意，使其國家自定貢獻能對達成升溫目標作出適當貢獻；1.5°C已成為主要目標。", "習慣法：各國有防止對氣候系統造成重大損害的義務（須盡嚴格的相當注意），以及合作義務；這些義務具{{對世義務}}性質。", "海洋法公約：援引國際海洋法法庭2024年意見，確認第192、194條等要求各國保護海洋環境免受溫室氣體排放影響；海平面上升時，依公約劃定並公布的海域界限，國家沒有更新的義務。", "法律後果：違反上述義務構成國際不法行為，應停止、保證不再犯，並完全賠償；未採取適當措施保護氣候系統（包括化石燃料的生產、消費、探勘許可與補貼）可能構成國際不法行為。", "全部判斷全體一致通過。"], "significance": "國際法院史上第五份全體一致的諮詢意見，與國際海洋法法庭（2024）、美洲人權法院（2025）並稱氣候變遷三大諮詢意見。考點：①氣候條約不是特別法；②防止重大損害的習慣法義務與相當注意；③對世義務；④海平面上升不必更新已依公約公布的海域界限；⑤違反的後果依國家責任一般規則。諮詢意見本身無拘束力，但具權威性。", "articles": ["unclos-192", "unclos-194", "unclos-235"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/187", "verified": "2026-10-07"});
CONCEPTS.push({"id": "env-principles", "title": "國際環境法原則", "definition": "國際環境法沒有單一法典，主要由條約、習慣法與里約宣言等軟法文件形成的原則構成。考試常把原則名稱、出處與判例交錯出題，必須記清楚「哪個原則見於哪份文件、經哪個判例確認」。", "points": ["不損害原則（善鄰原則）：國家應確保其管轄或控制下的活動不損害他國或國家管轄範圍外的環境。源自特雷爾冶煉廠仲裁案（1941），見斯德哥爾摩宣言原則21、里約宣言原則2；國際法院在核武合法性諮詢意見（1996）確認屬一般國際法（gl114a_13選項A正確、gl112a_14正解A）。海洋法公約的對應條文是[[art|unclos-194|第194條第2項]]。", "防止原則與相當注意：國家須盡相當注意（due diligence）防止重大跨界損害；[[case|pulp-mills|紙漿廠案]]指出防止原則源於相當注意義務。國際海洋法法庭2024年認為溫室氣體造成的損害嚴重且不可逆，注意標準更嚴格。", "環境影響評估：可能造成重大跨界損害的活動須事前評估，已屬一般國際法上的要求（紙漿廠案，gl114a_13選項C正確）；海洋法公約見[[art|unclos-206|第206條]]。", "預防原則：有嚴重或不可逆損害威脅時，不得以缺乏充分科學確定性為由延遲採取措施（里約宣言原則15）。注意與「防止原則」區別：前者處理科學不確定的風險，後者處理已知的損害。", "污染者付費原則：污染成本應由污染者負擔，見1992年里約宣言原則16（不是1972年斯德哥爾摩宣言，gl114a_13正解B）；最早由經濟合作暨發展組織1972年提出。", "共同但有區別的責任：各國對全球環境負共同責任，但依歷史責任與能力不同而有區別（里約宣言原則7、《聯合國氣候變化綱要公約》第3條；《巴黎協定》加上「各自能力，考慮不同國情」）。", "永續發展：兼顧經濟發展與環境保護（加布契科沃—大毛羅斯案，1997）；已被運用於許多經貿協定，例如WTO設立協定前言（gl114a_13選項D正確）。", "通知與合作：緊急情況應通知可能受影響的國家（里約宣言原則18、海洋法公約[[art|unclos-198|第198條]]）；合作義務是防止海洋污染的基本原則（MOX工廠案，2001）。", "陷阱：斯德哥爾摩宣言（1972）、里約宣言（1992）都是不具拘束力的宣言（gl114a_2）；其中原則經判例確認者才屬習慣法。"], "cases": ["pulp-mills", "itlos-climate", "icj-climate"], "articles": ["unclos-192", "unclos-194", "unclos-206", "unclos-198"], "exam": ["gl112a_14", "gl114a_13"], "verified": "2026-10-07"});
GLOSSARY["海洋環境污染"] = {"en": "pollution of the marine environment", "tw": "海洋環境污染", "cn": "海洋环境的污染", "def": "人類直接或間接把物質或能量引入海洋環境（包括河口灣），造成或可能造成損害生物資源、危害人類健康、妨礙捕魚等正當用途、損壞海水品質等有害影響（海洋法公約第1條第1項第4款）；國際海洋法法庭2024年認為人為溫室氣體排放屬之。"};
GLOSSARY["傾倒"] = {"en": "dumping", "tw": "傾倒、海洋棄置", "cn": "倾倒", "def": "從船隻、飛機、平臺或其他人造海上結構故意處置廢物或其他物質，包括故意棄置這些載具本身；不包括其正常操作附帶產生的廢物（海洋法公約第1條第1項第5款）。"};

GLOSSARY["港口國管轄"] = {"en": "port State jurisdiction", "tw": "港口國管轄、港口國執行", "cn": "港口国的执行", "def": "外國船舶自願停靠一國港口或岸外設施時，該港口國可調查並追訴其在港口國管轄海域以外違反國際規則和標準的排放（海洋法公約第218條）。"};
GLOSSARY["環境影響評估"] = {"en": "environmental impact assessment (EIA)", "tw": "環境影響評估", "cn": "环境影响评价", "def": "在核准可能造成重大環境損害的計畫前，評估其可能影響；海洋法公約第206條（作準中文本稱「評價」）；國際法院在紙漿廠案（2010）確認屬一般國際法上的要求。"};
GLOSSARY["相當注意義務"] = {"en": "due diligence", "tw": "相當注意義務、盡職注意", "cn": "应有的注意（审慎义务）", "def": "國家應盡適當的努力與謹慎，採取合理措施防止損害；屬行為義務而非結果義務，注意程度依風險與損害的嚴重性調整（紙漿廠案；國際海洋法法庭2024年諮詢意見）。"};
GLOSSARY["預防原則"] = {"en": "precautionary principle / precautionary approach", "tw": "預防原則、風險預防原則", "cn": "风险预防原则", "def": "有嚴重或不可逆損害威脅時，不得以缺乏充分科學確定性為由延遲採取符合成本效益的措施（里約宣言原則15）；與以已知損害為前提的「防止原則」不同。"};
GLOSSARY["海洋科學研究"] = {"en": "marine scientific research (MSR)", "tw": "海洋科學研究", "cn": "海洋科学研究", "def": "所有國家與主管國際組織均有權進行（海洋法公約第238條）；領海內須經沿海國明示同意（第245條），專屬經濟海域與大陸礁層上須經同意，但正常情形下沿海國應同意（第246條）；公海則為自由。"};
GLOSSARY["冰封區域"] = {"en": "ice-covered areas", "tw": "冰封區域", "cn": "冰封区域", "def": "專屬經濟海域範圍內終年大部分時間冰封、航行特別危險的區域；沿海國可制定並執行比國際標準更嚴格、但非歧視性的船舶防污法規（海洋法公約第234條，俗稱北極條款）。"};

ARTICLES.push({"treaty": "vclt", "no": "1", "heading": "本公約之範圍", "tier": "B", "paras": [{"n": "", "en": "The present Convention applies to treaties between States.", "zh": "本公約適用於國家間之條約。"}], "keys": ["本公約適用於國家間之條約"], "plain": "公約只適用於「國家間」的條約。國家與國際組織之間、或國際組織相互間的條約，另由1986年《關於國家與國際組織間或國際組織相互間條約法之維也納公約》規範（該公約至今尚未生效）；但依第3條，這些協定的效力不受影響，公約中反映習慣法的規則仍可適用。", "elements": [{"req": ["國家間的條約"], "effect": "適用本公約"}], "traps": ["陷阱：國際組織不是本公約的締約主體，但這不表示國際組織不能締約；其締約能力另由1986年公約規範（SG025選項C錯誤）。"], "custom": {"status": "不適用", "note": "範圍條款。", "cases": []}, "related": ["vclt-2", "vclt-3", "vclt-5"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG025", "note": "選項C稱國際組織因條約法公約的除外規定而無法締約，錯誤；公約只是不適用於國際組織的條約，國際組織締約另由1986年公約規範（正解C）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "2", "heading": "用語", "tier": "A", "paras": [{"n": "1", "en": "For the purposes of the present Convention:\n(a) \"Treaty\" means an international agreement concluded between States in written form and governed by international law, whether embodied in a single instrument or in two or more related instruments and whatever its particular designation;\n(b) \"Ratification\", \"acceptance\", \"approval\" and \"accession\" mean in each case the international act so named whereby a State establishes on the international plane its consent to be bound by a treaty;\n(c) \"Full powers\" means a document emanating from the competent authority of a State designating a person or persons to represent the State for negotiating, adopting or authenticating the text of a treaty, for expressing the consent of the State to be bound by a treaty, or for accomplishing any other act with respect to a treaty;\n(d) \"Reservation\" means a unilateral statement, however phrased or named, made by a State, when signing, ratifying, accepting, approving or acceding to a treaty, whereby it purports to exclude or to modify the legal effect of certain provisions of the treaty in their application to that State;\n(e) \"Negotiating State\" means a State which took part in the drawing up and adoption of the text of the treaty;\n(f) \"Contracting State\" means a State which has consented to be bound by the treaty, whether or not the treaty has entered into force;\n(g) \"Party\" means a State which has consented to be bound by the treaty and for which the treaty is in force;\n(h) \"Third State\" means a State not a party to the treaty;\n(i) \"International organization\" means an intergovernmental organization.", "zh": "就適用本公約而言：\n(甲)稱「條約」者，謂國家間所締結而以國際法為準之國際書面協定，不論其載於一項單獨文書或兩項以上相互有關之文書內，亦不論其特定名稱為何；\n(乙)稱「批准」、「接受」、「贊同」及「加入」者，各依本義指一國據以在國際上確定其同意承受條約拘束之國際行為；\n(丙)稱「全權證書」者，謂一國主管當局所頒發，指派一人或數人代表該國談判、議定或認證條約約文，表示該國同意承受條約拘束，或完成有關條約之任何其他行為之文件；\n(丁)稱「保留」者，謂一國於簽署、批准、接受、贊同或加入條約時所作之片面聲明，不論措辭或名稱為何，其目的在摒除或更改條約中若干規定對該國適用時之法律效果；\n(戊)稱「談判國」者，謂參與草擬及議定條約約文之國家；\n(己)稱「締約國」者，謂不問條約已未生效，同意承受條約拘束之國家；\n(庚)稱「當事國」者，謂同意承受條約拘束及條約對其有效之國家；\n(辛)稱「第三國」者，謂非條約當事國之國家；\n(壬)稱「國際組織」者，謂政府間之組織。"}, {"n": "2", "en": "The provisions of paragraph 1 regarding the use of terms in the present Convention are without prejudice to the use of those terms or to the meanings which may be given to them in the internal law of any State.", "zh": "第一項關於本公約內各項用語之規定不妨礙此等用語在任何國家國內法上之使用或所具有之意義。"}], "keys": ["國家間所締結而以國際法為準之國際書面協定", "不論其特定名稱為何", "各依本義指一國據以在國際上確定其同意承受條約拘束之國際行為", "其目的在摒除或更改條約中若干規定對該國適用時之法律效果", "謂不問條約已未生效，同意承受條約拘束之國家", "謂同意承受條約拘束及條約對其有效之國家"], "plain": "本條是整部公約的「字典」，最常考的是條約與保留的定義，以及締約國、當事國的區別。①條約的要件：國家之間；書面；以國際法為準（不是依某國國內法訂立的契約）；一份或數份相關文書均可；名稱不拘——條約、公約、協定、議定書、換文、宣言都可能是條約，關鍵是當事方有受國際法拘束的意思。②{{批准}}、接受、贊同、加入，都是「在國際上」確定同意承受拘束的國際行為；國內的立法院審議只是國內程序。③{{全權證書}}是授權代表締約的文件。④{{保留}}是片面聲明，名稱不拘，重點在「目的」是排除或更改條約部分規定對該國的法律效果——所以名為「解釋性聲明」者，實質上若想改變效果，仍是保留。⑤締約國與當事國：締約國是已同意承受拘束的國家，不論條約是否已生效；當事國是已同意承受拘束「且」條約對其有效的國家。第2項提醒：這些定義不影響各國國內法上的用語，例如我國《條約締結法》對「條約」「協定」的區分。", "elements": [{"req": ["國家間締結", "書面", "以國際法為準", "一項或數項相關文書", "名稱不拘"], "effect": "構成本公約所稱的條約"}, {"req": ["簽署、批准、接受、贊同或加入時所作的片面聲明", "目的在排除或更改條約部分規定對該國的法律效果"], "effect": "構成保留（不論名稱為何）"}], "traps": ["陷阱：「締約國」不以條約已生效為要件；條約已對其生效的才是「當事國」（gl109a_8選項A錯誤）。", "陷阱：條約不以名稱為準；但1972年《斯德哥爾摩人類環境宣言》等不具拘束意思的宣言不是條約（gl114a_2正解B）。", "陷阱：國營企業之間、或未經國家授權的地方政府之間的協議，不是本公約所稱的條約（SG042）。", "陷阱：保留看「目的」不看名稱；稱為解釋性聲明，但實際在排除或更改法律效果者，仍是保留。", "陷阱：本公約的條約限於「書面」；口頭協定不在公約範圍，但依第3條其效力不受影響。"], "custom": {"status": "部分", "note": "條約定義大致反映習慣法；國際法院在卡達訴巴林案（1994）依此認定會議紀錄構成國際協定。", "cases": ["qatar-bahrain"]}, "related": ["vclt-1", "vclt-3", "vclt-11", "vclt-14", "vclt-19", "vclt-7"], "cases": [{"id": "qatar-bahrain", "point": "1990年多哈會議紀錄雖名為紀錄，但載有雙方承諾並經外交部長簽署，構成國際協定；名稱與形式不是決定因素，要看用語與締結情況。"}], "roc": "我國《條約締結法》（2015）依名稱與內容區分「條約」與「協定」：條約須送立法院審議，協定原則上送立法院查照或備查；公約第2條第2項明示這類國內法上的用語不受公約定義影響。", "essay": "條約的定義：「依條約法公約第2條第1項(甲)款，條約係國家間所締結而以國際法為準之國際書面協定，不論其載於一項或多項相關文書，亦不論其特定名稱為何。判斷重點在當事方有無受國際法拘束的意思；國際法院在卡達訴巴林案（1994）即認定經外交部長簽署的會議紀錄構成國際協定。」", "exam": [{"qid": "gl109a_8", "note": "選項A把「締約國」定義為條約已於其境內生效的國家，混淆了締約國（第2條第1項(己)款）與當事國（(庚)款），故錯誤（正解A）。"}, {"qid": "gl114a_2", "note": "斯德哥爾摩人類環境宣言是不具拘束力的宣言，不符合第2條第1項(甲)款以國際法為準、有受拘束意思的條約要件（正解B）。"}, {"qid": "SG042", "note": "多國締結創設政府間國際組織的協議是國家間的書面協定，屬條約（正解A）；地方政府、國營企業間的協議不是國家間條約，以武力兼併他國領土為目的的協議則因違反強行法而無效（第53條）。"}, {"qid": "gl112a_2", "note": "依第2條第1項(乙)款，批准是確定同意承受條約拘束的國際行為；保留、議定、認證約文都不是（正解B）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "3", "heading": "不屬本公約範圍之國際協定", "tier": "B", "paras": [{"n": "", "en": "The fact that the present Convention does not apply to international agreements concluded between States and other subjects of international law or between such other subjects of international law, or to international agreements not in written form, shall not affect:\n(a) The legal force of such agreements;\n(b) The application to them of any of the rules set forth in the present Convention to which they would be subject under international law independently of the Convention;\n(c) The application of the Convention to the relations of States as between themselves under international agreements to which other subjects of international law are also parties.", "zh": "本公約不適用於國家與其他國際法主體間所締結之國際協定或此種其他國際法主體間之國際協定或非書面國際協定，此一事實並不影響：\n(甲)此類協定之法律效力；\n(乙)本公約所載任何規則之依照國際法而毋須基於本公約原應適用於此類協定者，對於此類協定之適用；\n(丙)本公約之適用於國家間以亦有其他國際法主體為其當事者之國際協定為根據之彼此關係。"}], "keys": ["此類協定之法律效力", "非書面國際協定"], "plain": "公約不適用於三類協定：國家與其他國際法主體（如國際組織）間的協定、其他國際法主體相互間的協定、非書面的協定。但這「不適用」不影響：(甲)這些協定本身的法律效力——口頭協定照樣可以有拘束力（東格陵蘭案中挪威外交部長的口頭答覆即被認定有拘束力）；(乙)公約中「不依賴公約而依國際法本來就適用」的規則（即習慣法）仍適用於它們；(丙)在同時有國家與其他主體參加的協定中，國家相互之間的關係仍適用本公約。", "elements": [{"req": ["國家與其他國際法主體間的協定、其他國際法主體相互間的協定，或非書面協定"], "effect": "不適用本公約，但其法律效力不受影響；反映習慣法的規則仍適用"}], "traps": ["陷阱：口頭協定不適用本公約，但仍可有法律效力（gl115a_6選項D稱非書面協議不具條約效力，錯誤）。", "陷阱：公約不適用不等於國際法不適用；習慣法規則照樣適用於這些協定。"], "custom": {"status": "不適用", "note": "範圍條款；但其承認非書面協定效力的立場與東格陵蘭案一致。", "cases": ["eastern-greenland"]}, "related": ["vclt-1", "vclt-2", "vclt-4"], "cases": [{"id": "eastern-greenland", "point": "挪威外交部長伊倫（Ihlen）對丹麥公使的口頭答覆拘束挪威；非書面的國家承諾亦可有法律效力。"}], "roc": "", "essay": "", "exam": [{"qid": "gl115a_6", "note": "選項D稱公約規定非書面協議不具條約效力，錯誤：第3條明定公約不適用於非書面協定，但不影響其法律效力。本題正解B（第74條：無外交關係不妨礙締約）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "6", "heading": "國家締結條約之能力", "tier": "B", "paras": [{"n": "", "en": "Every State possesses capacity to conclude treaties.", "zh": "每一國家皆有締結條約之能力。"}], "keys": ["每一國家皆有締結條約之能力"], "plain": "締約能力是國家主權的屬性，每一國家都有。聯邦國家的成員邦能否締約，取決於聯邦憲法的授權與締約對方是否接受，公約草案中曾有相關條文，最後刪除。國際組織的締約能力則依其組織約章與隱含權能（見[[concept|intl-org|國際組織的法律人格與權能]]）。", "elements": [{"req": ["國家"], "effect": "具有締結條約的能力"}], "traps": [], "custom": {"status": "習慣法", "note": "締約能力為國家的固有屬性。", "cases": []}, "related": ["vclt-7", "vclt-2"], "cases": [], "roc": "我國雖不是聯合國會員，仍與邦交國及許多無邦交國家（以「協定」等形式，常由駐外代表處簽署）締結國際書面協定；依《條約締結法》由外交部或各主管機關辦理。", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "7", "heading": "全權證書", "tier": "A", "paras": [{"n": "1", "en": "A person is considered as representing a State for the purpose of adopting or authenticating the text of a treaty or for the purpose of expressing the consent of the State to be bound by a treaty if:\n(a) He produces appropriate full powers; or\n(b) It appears from the practice of the States concerned or from other circumstances that their intention was to consider that person as representing the State for such purposes and to dispense with full powers.", "zh": "任一人員如有下列情形之一，視為代表一國議定或認證條約約文或表示該國承受條約拘束之同意：\n(甲)出具適當之全權證書；或\n(乙)由於有關國家之慣例或由於其他情況可見此等國家之意思係認為該人員為此事代表該國而可免除全權證書。"}, {"n": "2", "en": "In virtue of their functions and without having to produce full powers, the following are considered as representing their State:\n(a) Heads of State, Heads of Government and Ministers for Foreign Affairs, for the purpose of performing all acts relating to the conclusion of a treaty;\n(b) Heads of diplomatic missions, for the purpose of adopting the text of a treaty between the accrediting State and the State to which they are accredited;\n(c) Representatives accredited by States to an international conference or to an international organization or one of its organs, for the purpose of adopting the text of a treaty in that conference, organization or organ.", "zh": "下列人員由於所任職務毋須出具全權證書，視為代表其國家：\n(甲)國家元首、政府首長及外交部長，為實施關於締結條約之一切行為；\n(乙)使館館長，為議定派遣國與駐在國間條約約文；\n(丙)國家派往國際會議或派駐國際組織或該國際組織一機關之代表，為議定在該會議、組織或機關內議定之條約約文。"}], "keys": ["出具適當之全權證書", "國家元首、政府首長及外交部長，為實施關於締結條約之一切行為", "使館館長，為議定派遣國與駐在國間條約約文"], "plain": "誰可以代表國家締約？第1項：出具適當的{{全權證書}}，或依相關國家的慣例或其他情況，可見各方有意免除全權證書。第2項：三類人「因其職務」不必出具全權證書即視為代表國家，但權限範圍不同——(甲)國家元首、政府首長、外交部長：締約的「一切行為」，包括簽署、表示同意承受拘束；(乙)使館館長：只限「議定」派遣國與駐在國之間的條約約文；(丙)派往國際會議或國際組織的代表：只限議定在該會議或組織內議定的約文。未經授權者所為的締約行為，非經該國事後確認，不生法律效果（第8條）。國際法院在喀麥隆訴奈及利亞案（2002）認為，國家元首依第7條第2項被視為代表國家，簽署的《馬魯阿宣言》拘束奈及利亞，即使奈及利亞主張未經其國內必要程序。", "elements": [{"req": ["出具適當的全權證書，或依慣例或其他情況可見各方有意免除全權證書"], "effect": ARTICLES.push({"treaty": "vclt", "no": "12", "heading": "以簽署表示承受條約拘束之同意", "tier": "B", "paras": [{"n": "1", "en": "The consent of a State to be bound by a treaty is expressed by the signature of its representative when:\n(a) The treaty provides that signature shall have that effect;\n(b) It is otherwise established that the negotiating States were agreed that signature should have that effect; or\n(c) The intention of the State to give that effect to the signature appears from the full powers of its representative or was expressed during the negotiation.", "zh": "遇有下列情形之一，一國承受條約拘束之同意以該國代表之簽署表示之：\n(甲)條約規定簽署有此效果；\n(乙)另經確定談判國協議簽署有此效果；或\n(丙)該國使簽署有此效果之意思可見諸其代表所奉之全權證書或已於談判時有此表示。"}, {"n": "2", "en": "For the purposes of paragraph 1:\n(a) The initialling of a text constitutes a signature of the treaty when it is established that the negotiating States so agreed;\n(b) The signature ad referendum of a treaty by a representative, if confirmed by his State, constitutes a full signature of the treaty.", "zh": "就適用第一項而言：\n(甲)倘經確定談判國有此協議，約文之草簽構成條約之簽署；\n(乙)代表對條約作待核准之簽署，倘經其本國確認，即構成條約之正式簽署。"}], "keys": ["一國承受條約拘束之同意以該國代表之簽署表示之", "約文之草簽構成條約之簽署", "即構成條約之正式簽署"], "plain": "簽署何時就等於同意承受拘束？三種情形：(甲)條約規定簽署有此效果；(乙)談判國另有此協議；(丙)該國的意思見於全權證書或談判時已表示。第2項：草簽（initialling，只簽姓名縮寫）經談判國協議時構成簽署；「待核准之簽署」（signature ad referendum）經本國確認後，構成正式簽署。雙邊行政協定常採「簽署即生效」。", "elements": [{"req": ["條約規定，或談判國協議，或全權證書、談判時可見此意思"], "effect": "簽署即表示同意承受條約拘束"}], "traps": ["陷阱：草簽原則上只是認證約文；須經談判國協議才構成條約的簽署。"], "custom": {"status": "不適用", "note": "程序規定。", "cases": []}, "related": ["vclt-11", "vclt-10", "vclt-14", "vclt-18"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "14", "heading": "以批准、接受或贊同表示承受條約拘束之同意", "tier": "A", "paras": [{"n": "1", "en": "The consent of a State to be bound by a treaty is expressed by ratification when:\n(a) The treaty provides for such consent to be expressed by means of ratification;\n(b) It is otherwise established that the negotiating States were agreed that ratification should be required;\n(c) The representative of the State has signed the treaty subject to ratification; or\n(d) The intention of the State to sign the treaty subject to ratification appears from the full powers of its representative or was expressed during the negotiation.", "zh": "遇有下列情形之一，一國承受條約拘束之同意，以批准表示之：\n(甲)條約規定以批准方式表示同意；\n(乙)另經確定談判國協議需要批准；\n(丙)該國代表已對條約作須經批准之簽署；或\n(丁)該國對條約作須經批准之簽署之意思可見諸其代表所奉之全權證書，或已於談判時有此表示。"}, {"n": "2", "en": "The consent of a State to be bound by a treaty is expressed by acceptance or approval under conditions similar to those which apply to ratification.", "zh": "一國承受條約拘束之同意以接受或贊同方式表示者，其條件與適用於批准者同。"}], "keys": ["一國承受條約拘束之同意，以批准表示之", "該國代表已對條約作須經批准之簽署", "其條件與適用於批准者同"], "plain": "何時須經{{批准}}？四種情形：(甲)條約規定；(乙)談判國協議需要批准；(丙)代表作了「須經批准之簽署」；(丁)全權證書或談判時已表示須經批准。第2項：接受、贊同與批准條件相同，只是名稱不同（常用於國內法上不需國會批准的情形）。批准的功能是給國家在簽署後、受拘束前，有時間完成國內程序（如國會同意）並再三考慮；國家並沒有批准已簽署條約的義務，但在明白表示不欲成為當事國前，須遵守第18條。", "elements": [{"req": ["條約規定、談判國協議、代表作須經批准的簽署，或全權證書或談判時已表示"], "effect": "一國承受條約拘束的同意以批准表示"}], "traps": ["陷阱：國家沒有批准其已簽署條約的國際法義務（SG005選項B正確）；但簽署後到明白表示不欲成為當事國前，不得妨礙條約目的及宗旨（第18條）。", "陷阱：批准是「國際行為」，與國內的國會同意程序不同。"], "custom": {"status": "不適用", "note": "程序規定。", "cases": []}, "related": ["vclt-2", "vclt-11", "vclt-16", "vclt-18"], "cases": [], "roc": "我國《條約締結法》：條約案經立法院審議通過後，由總統頒發批准書或加入書，再由外交部辦理交換或交存。", "essay": "", "exam": [{"qid": "SG005", "note": "選項B「國家並無批准條約之義務」正確；本題錯誤選項為C（批准不是唯一方式）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "16", "heading": "批准書、接受書、贊同書或加入書之交換或交存", "tier": "A", "paras": [{"n": "", "en": "Unless the treaty otherwise provides, instruments of ratification, acceptance, approval or accession establish the consent of a State to be bound by a treaty upon:\n(a) Their exchange between the contracting States;\n(b) Their deposit with the depositary; or\n(c) Their notification to the contracting States or to the depositary, if so agreed.", "zh": "除條約另有規定外，批准書、接受書、贊同書或加入書依下列方式確定一國承受條約拘束之同意：\n(甲)由締約國互相交換；\n(乙)將文書交存保管機關；或\n(丙)如經協議，通知締約國或保管機關。"}], "keys": ["由締約國互相交換", "將文書交存保管機關"], "plain": "批准書、接受書、贊同書或加入書何時確定同意？除條約另有規定外：(甲)雙邊條約多採「互換」；(乙)多邊條約多採「交存」{{保管機關}}（通常是聯合國秘書長）；(丙)經協議時，通知締約國或保管機關。注意：同意的「確定」與條約對該國「生效」是兩回事——多邊條約常規定交存後滿一定期間才生效，而且條約本身須已達生效門檻（第24條）。", "elements": [{"req": ["批准書、接受書、贊同書或加入書"], "effect": "於互換、交存保管機關或經協議的通知時，確定該國同意承受拘束"}], "traps": ["陷阱：交存批准書是確定同意的時點，不等於條約已對該國生效；生效依第24條及條約本身的規定。"], "custom": {"status": "不適用", "note": "程序規定。", "cases": []}, "related": ["vclt-14", "vclt-15", "vclt-24"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl112a_2", "note": "題幹問確定同意受拘束的國際行為；第2條第1項(乙)款與第14、16條：批准並交換或交存批准書（正解B）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "18", "heading": "不得在條約生效前妨礙其目的及宗旨之義務", "tier": "A", "paras": [{"n": "", "en": "A State is obliged to refrain from acts which would defeat the object and purpose of a treaty when:\n(a) It has signed the treaty or has exchanged instruments constituting the treaty subject to ratification, acceptance or approval, until it shall have made its intention clear not to become a party to the treaty; or\n(b) It has expressed its consent to be bound by the treaty, pending the entry into force of the treaty and provided that such entry into force is not unduly delayed.", "zh": "一國負有義務不得採取任何足以妨礙條約目的及宗旨之行動：\n(甲)如該國已簽署條約或已交換構成條約之文書而須經批准、接受或贊同，但尚未明白表示不欲成為條約當事國之意思；或\n(乙)如該國業已表示同意承受條約之拘束，而條約尚未生效，且條約之生效不稽延過久。"}], "keys": ["一國負有義務不得採取任何足以妨礙條約目的及宗旨之行動", "尚未明白表示不欲成為條約當事國之意思", "且條約之生效不稽延過久"], "plain": "條約尚未對某國生效，該國就可以為所欲為嗎？不行。兩種情形下，國家負有「不得妨礙條約目的及宗旨」的消極義務：(甲)已簽署（或交換文書）而須經批准、接受或贊同，在「明白表示不欲成為當事國」之前；(乙)已表示同意承受拘束，條約尚未生效，且生效未過度遲延。注意：此義務不是要遵守條約的全部規定，而是不得作出使條約失去意義的行為。著名實例：美國2002年致函聯合國秘書長，表示不欲成為《羅馬規約》當事國（俗稱「撤簽」），即是援用第(甲)款解除此義務。", "elements": [{"req": ["已簽署或交換文書而須經批准、接受或贊同", "尚未明白表示不欲成為當事國"], "effect": "不得採取足以妨礙條約目的及宗旨的行動"}, {"req": ["已表示同意承受拘束", "條約尚未生效且生效不過度遲延"], "effect": "不得採取足以妨礙條約目的及宗旨的行動"}], "traps": ["陷阱：本條只禁止妨礙條約「目的及宗旨」的行動，不是要求簽署國遵守條約的每一條規定。", "陷阱：簽署國可以「明白表示不欲成為當事國」來解除此義務（如美國2002年對羅馬規約）。"], "custom": {"status": "部分", "note": "一般認為反映善意原則與習慣法，但內容範圍仍有爭議。", "cases": []}, "related": ["vclt-14", "vclt-24", "vclt-26"], "cases": [], "roc": "", "essay": "簽署後生效前的義務：「依第18條，已簽署須經批准之條約而尚未明白表示不欲成為當事國之國家，負有不得妨礙條約目的及宗旨之義務；此係善意原則的具體化，並非要求遵守條約全部規定。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "19", "heading": "提具保留", "tier": "A", "paras": [{"n": "", "en": "A State may, when signing, ratifying, accepting, approving or acceding to a treaty, formulate a reservation unless:\n(a) The reservation is prohibited by the treaty;\n(b) The treaty provides that only specified reservations, which do not include the reservation in question, may be made; or\n(c) In cases not falling under sub-paragraphs (a) and (b), the reservation is incompatible with the object and purpose of the treaty.", "zh": "一國得於簽署、批准、接受、贊同或加入條約時，提具保留，但有下列情形之一者不在此限：\n(甲)該項保留為條約所禁止者；\n(乙)條約僅准許特定之保留而有關之保留不在其內者；或\n(丙)凡不屬(甲)及(乙)兩款所稱之情形，該項保留與條約目的及宗旨不合者。"}], "keys": ["該項保留為條約所禁止者", "條約僅准許特定之保留而有關之保留不在其內者", "該項保留與條約目的及宗旨不合者"], "plain": "{{保留}}原則上自由，但有三種情形不得提出：(甲)條約禁止保留（例如《羅馬規約》第120條、海洋法公約第309條）；(乙)條約只准許特定保留，而該保留不在其內；(丙)前兩款以外，保留與條約「目的及宗旨」不合。(丙)款源自[[case|genocide-reservations|殘害人群罪公約保留諮詢意見]]（1951）：國際法院放棄傳統「保留須經全體當事國同意」的全體一致原則，改以目的及宗旨為標準。難題在於誰來判斷「不合」：公約沒有中央判斷機關，實際上由各締約國依第20條自行接受或反對；人權條約機構（如人權事務委員會第24號一般性意見）主張自己可判斷並可「分割」無效保留，但不為多數國家接受。國際法委員會2011年《條約保留實踐指南》則認為，無效保留不生法律效果。", "elements": [{"req": ["條約禁止該保留"], "effect": "不得提出"}, {"req": ["條約只准許特定保留，該保留不在其內"], "effect": "不得提出"}, {"req": ["不屬前兩種情形，但保留與條約目的及宗旨不合"], "effect": "不得提出"}], "traps": ["陷阱：即使條約沒有禁止保留，保留仍不得違背條約目的及宗旨（SG041選項B正確）。", "陷阱：「目的及宗旨」標準源自1951年殘害人群罪公約保留諮詢意見，取代了全體一致原則。", "陷阱：保留只能在簽署、批准、接受、贊同或加入時提出（第2條第1項(丁)款），成為當事國後不能任意追加。"], "custom": {"status": "部分", "note": "目的及宗旨標準源自國際法院1951年諮詢意見，一般認為已成為習慣法。", "cases": []}, "related": ["vclt-2", "vclt-20", "vclt-21", "vclt-23"], "cases": [{"id": "genocide-reservations", "point": "保留與公約目的及宗旨相容者，保留國可成為當事國；不相容者不得成為當事國。以目的及宗旨標準取代全體一致原則。"}], "roc": "", "essay": "不得提出保留的情形：「依條約法公約第19條，國家得於簽署、批准、接受、贊同或加入時提具保留，但(甲)條約禁止保留、(乙)條約僅准許特定保留而該保留不在其內、(丙)保留與條約目的及宗旨不合者，不得提出。(丙)款源自國際法院1951年殘害人群罪公約保留諮詢意見。」", "exam": [{"qid": "SG041", "note": "選項B「即使條約未規定不得保留，保留亦不得違背條約之目的與宗旨」正確（第19條(丙)款）；本題錯誤選項A，依第22條保留得隨時撤回。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "
