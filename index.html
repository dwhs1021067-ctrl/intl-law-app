ARTICLES.push({"treaty": "unclos", "no": "282", "heading": "一般性、區域性或雙邊協定的義務", "tier": "A", "paras": [{"n": "", "en": "If the States Parties which are parties to a dispute concerning the interpretation or application of this Convention have agreed, through a general, regional or bilateral agreement or otherwise, that such dispute shall, at the request of any party to the dispute, be submitted to a procedure that entails a binding decision, that procedure shall apply in lieu of the procedures provided for in this Part, unless the parties to the dispute otherwise agree.", "zh": "作為有關本公約的解釋或適用的爭端各方的締約各國如已通過一般性、區域性或雙邊協定或以其他方式協議，經爭端任何一方請求，應將這種爭端提交導致有拘束力裁判的程序，該程序應代替本部份規定的程序而適用，除非爭端各方另有協議。"}], "keys": ["提交導致有拘束力裁判的程序", "該程序應代替本部份規定的程序而適用"], "plain": "若當事國早已透過一般性、區域性或雙邊協定「或以其他方式」約定：經任一方請求即可把爭端交付會作成有拘束力裁判的程序，則該程序優先，取代第十五部分的程序。與第281條的差別在於：第281條處理的是一般和平方法（不一定有拘束力），第282條處理的是另一個「有拘束力」的程序。典型例子是歐盟會員國之間的爭端須交歐盟法院（MOX工廠案中，附件七仲裁庭因此暫停程序）。國際法院在索馬利亞訴肯亞海洋劃界案（2017年初步反對判決）認定，雙方依國際法院規約第36條第2項所作的任擇條款聲明，屬於本條的「以其他方式」協議，因此國際法院的管轄取代公約程序。", "elements": [{"req": ["爭端各方已以一般性、區域性、雙邊協定或其他方式約定", "經任一方請求即可交付導致有拘束力裁判的程序"], "effect": "該程序代替第十五部分的程序適用，除非爭端各方另有協議"}], "traps": ["陷阱：第282條的程序必須能作成「有拘束力」的裁判；只約定談判、協商的屬於第281條的問題。", "陷阱：任擇條款聲明也可能構成第282條的「以其他方式」協議（索馬利亞訴肯亞案）。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-281", "unclos-287", "icj-36"], "cases": [], "roc": "", "essay": "第282條：「當事國另有協議得單方交付有拘束力的程序者（例如區域法院、國際法院任擇條款），該程序取代公約第十五部分。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "283", "heading": "交換意見的義務", "tier": "B", "paras": [{"n": "1", "en": "When a dispute arises between States Parties concerning the interpretation or application of this Convention, the parties to the dispute shall proceed expeditiously to an exchange of views regarding its settlement by negotiation or other peaceful means.", "zh": "如果締約國之間對本公約的解釋或適用發生爭端，爭端各方應迅速就以談判或其他和平方法解決爭端一事交換意見。"}, {"n": "2", "en": "The parties shall also proceed expeditiously to an exchange of views where a procedure for the settlement of such a dispute has been terminated without a settlement or where a settlement has been reached and the circumstances require consultation regarding the manner of implementing the settlement.", "zh": "如果解決這種爭端的程序已經終止，而爭端仍未得到解決，或如已達成解決辦法，而情況要求就解決辦法的實施方式進行協商時，爭端各方也應迅速著手交換意見。"}], "keys": ["應迅速就以談判或其他和平方法解決爭端一事交換意見"], "plain": "提起強制程序前的程序門檻：爭端發生後，當事國應「迅速交換意見」，討論要用談判或其他何種和平方法解決。這是就「解決方法」交換意見，不要求先談判到破裂。實務上法院或法庭通常只確認雙方確有交換意見、且繼續交換已無實益。[[case|south-china-sea|南海仲裁案]]中，仲裁庭認定菲律賓與中國多年來的雙邊協商已滿足本條要求。", "elements": [{"req": ["締約國之間發生公約解釋或適用的爭端"], "effect": "爭端各方應迅速就解決方法交換意見（提起第二節程序前的條件）"}], "traps": ["陷阱：本條要求就「解決方法」交換意見，不等於必須談判到窮盡一切可能。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-279", "unclos-286"], "cases": [{"id": "south-china-sea", "point": "菲律賓與中國長期的雙邊磋商已滿足交換意見的義務，繼續交換已無實益。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "286", "heading": "本節規定的程序的適用", "tier": "B", "paras": [{"n": "", "en": "Subject to section 3, any dispute concerning the interpretation or application of this Convention shall, where no settlement has been reached by recourse to section 1, be submitted at the request of any party to the dispute to the court or tribunal having jurisdiction under this section.", "zh": "在第三節限制下，有關本公約的解釋或適用的任何爭端，如已訴諸第一節而仍未得到解決，經爭端任何一方請求，應提交根據本節具有管轄權的法院或法庭。"}], "keys": ["經爭端任何一方請求，應提交根據本節具有管轄權的法院或法庭"], "plain": "強制程序的開關：第一節的方法無法解決時，「經爭端任何一方請求」就可以把爭端交付第287條所定、具有管轄權的法院或法庭，不需要他方在個案中另行同意。這是海洋法公約爭端解決最大的特色：當事國在批准公約時就已概括同意強制程序。但有兩個前提：①先經過第一節（交換意見、自選方法等）；②受第三節的限制與例外（第297、298條）。", "elements": [{"req": ["有關本公約解釋或適用的爭端", "已訴諸第一節仍未解決", "不屬第三節的限制或例外"], "effect": "經任一方請求，應提交依第二節有管轄權的法院或法庭"}], "traps": ["陷阱：海洋法公約的強制程序可由「一方」單方提起，不必在個案中取得他方同意；這與國際法院以個案同意為原則不同。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-279", "unclos-287", "unclos-297", "unclos-298"], "cases": [], "roc": "", "essay": "第286條：「第一節無法解決時，經爭端任一方請求，即應提交第二節有管轄權的法院或法庭；締約國批准公約時即已概括同意強制程序，但受第297、298條限制。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "287", "heading": "程序的選擇", "tier": "A", "paras": [{"n": "1", "en": "When signing, ratifying or acceding to this Convention or at any time thereafter, a State shall be free to choose, by means of a written declaration, one or more of the following means for the settlement of disputes concerning the interpretation or application of this Convention:\n(a) the International Tribunal for the Law of the Sea established in accordance with Annex VI;\n(b) the International Court of Justice;\n(c) an arbitral tribunal constituted in accordance with Annex VII;\n(d) a special arbitral tribunal constituted in accordance with Annex VIII for one or more of the categories of disputes specified therein.", "zh": "一國在簽署、批准或加入本公約時，或在其後任何時間，應有自由用書面聲明的方式選擇下列一個或一個以上方法，以解決有關本公約的解釋或適用的爭端：\n(a)按照附件六設立的國際海洋法法庭；\n(b)國際法院；\n(c)按照附件七組成的仲裁法庭；\n(d)按照附件八組成的處理其中所列的一類或一類以上爭端的特別仲裁法庭。"}, {"n": "2", "en": "A declaration made under paragraph 1 shall not affect or be affected by the obligation of a State Party to accept the jurisdiction of the Seabed Disputes Chamber of the International Tribunal for the Law of the Sea to the extent and in the manner provided for in Part XI, section 5.", "zh": "根據第一款作出的聲明，不應影響締約國在第十一部份第五節規定的範圍內和以該節規定的方式，接受國際海洋法法庭海底爭端分庭管轄的義務，該聲明亦不受締約國的這種義務的影響。"}, {"n": "3", "en": "A State Party, which is a party to a dispute not covered by a declaration in force, shall be deemed to have accepted arbitration in accordance with Annex VII.", "zh": "締約國如為有效聲明所未包括的爭端的一方，應視為已接受附件七所規定的仲裁。"}, {"n": "4", "en": "If the parties to a dispute have accepted the same procedure for the settlement of the dispute, it may be submitted only to that procedure, unless the parties otherwise agree.", "zh": "如果爭端各方已接受同一程序以解決這項爭端，除各方另有協議外，爭端僅可提交該程序。"}, {"n": "5", "en": "If the parties to a dispute have not accepted the same procedure for the settlement of the dispute, it may be submitted only to arbitration in accordance with Annex VII, unless the parties otherwise agree.", "zh": "如果爭端各方未接受同一程序以解決這項爭端，除各方另有協議外，爭端僅可提交附件七所規定的仲裁。"}, {"n": "6", "en": "A declaration made under paragraph 1 shall remain in force until three months after notice of revocation has been deposited with the Secretary-General of the United Nations.", "zh": "根據第一款作出的聲明，應繼續有效，至撤銷聲明的通知交存於聯合國秘書長後滿三個月為止。"}, {"n": "7", "en": "A new declaration, a notice of revocation or the expiry of a declaration does not in any way affect proceedings pending before a court or tribunal having jurisdiction under this article, unless the parties otherwise agree.", "zh": "新的聲明、撤銷聲明的通知或聲明的滿期，對於根據本條具有管轄權的法院或法庭進行中的程序並無任何影響，除非爭端各方另有協議。"}, {"n": "8", "en": "Declarations and notices referred to in this article shall be deposited with the Secretary-General of the United Nations, who shall transmit copies thereof to the States Parties.", "zh": "本條所指的聲明和通知應交存於聯合國秘書長，秘書長應將其副本分送各締約國。"}], "keys": ["用書面聲明的方式選擇下列一個或一個以上方法", "應視為已接受附件七所規定的仲裁", "爭端僅可提交附件七所規定的仲裁"], "plain": "締約國可用書面聲明，從四種機構中選一種或多種來處理公約爭端：{{國際海洋法法庭}}（附件六）、國際法院、{{附件七仲裁}}、附件八特別仲裁（限漁業、海洋環境、海洋科學研究、航行與污染四類）。這種「讓各國自選、再找交集」的設計稱為{{程序選擇}}。運作規則：①雙方選了同一程序，就交該程序（第4項）；②雙方沒有交集，或一方根本沒有聲明，就交附件七仲裁（第3、5項）——附件七仲裁因此是「預設程序」。例如中國與菲律賓都沒有作第287條聲明，菲律賓2013年1月22日即依附件七單方提起[[case|south-china-sea|南海仲裁案]]。常設仲裁法院（PCA）在該案只擔任書記處，不是審理機關。聲明撤銷後滿三個月才失效，而且不影響已進行中的程序（第6、7項）。", "elements": [{"req": ["爭端各方的第287條聲明選了相同程序"], "effect": "爭端只能提交該程序（除非另有協議）"}, {"req": ["爭端各方未選相同程序，或一方未作聲明"], "effect": "爭端只能提交附件七仲裁（除非另有協議）"}], "traps": ["陷阱：南海仲裁案是依第287條與附件七組成的仲裁庭審理，不是常設仲裁法院、國際法院或國際海洋法法庭（gl114a_17正解D）；常設仲裁法院只提供書記處服務。", "陷阱：未作任何聲明的締約國「視為接受附件七仲裁」，不是視為接受國際海洋法法庭或國際法院。", "陷阱：附件八特別仲裁只處理漁業、海洋環境保護、海洋科學研究、航行（含船舶污染）四類爭端。", "陷阱：撤銷聲明須交存聯合國秘書長滿三個月才生效，且不影響進行中的程序。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-286", "unclos-288", "unclos-290", "unclos-298", "unclos-a7-1", "unclos-a7-3", "icj-36"], "cases": [{"id": "south-china-sea", "point": "菲中兩國都未作第287條聲明，菲律賓依第287條第3、5項與附件七單方提起仲裁。"}, {"id": "arctic-sunrise", "point": "荷蘭與俄羅斯未選同一程序，荷蘭依附件七提起仲裁；仲裁庭組成前，由國際海洋法法庭依第290條第5項作成臨時措施。"}], "roc": "南海仲裁案中，我國不是當事方，也不是公約締約國，無法依第287條參與或另行提起程序；總統府於判斷公布當日聲明不接受、對我國不具法律拘束力。", "essay": "程序選擇：「第287條讓締約國以書面聲明選擇國際海洋法法庭、國際法院、附件七仲裁或附件八特別仲裁；雙方選擇相同者交該程序，無交集或未聲明者，一律交附件七仲裁。南海仲裁案即因菲中兩國均未聲明，由菲律賓依附件七單方提起。」", "exam": [{"qid": "gl114a_17", "note": "正解D：菲律賓依第287條第3、5項及附件七提起仲裁；常設仲裁法院只是書記處。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "288", "heading": "管轄權", "tier": "A", "paras": [{"n": "1", "en": "A court or tribunal referred to in article 287 shall have jurisdiction over any dispute concerning the interpretation or application of this Convention which is submitted to it in accordance with this Part.", "zh": "第二百八十七條所指的法院或法庭，對於按照本部份向其提出的有關本公約的解釋或適用的任何爭端，應具有管轄權。"}, {"n": "2", "en": "A court or tribunal referred to in article 287 shall also have jurisdiction over any dispute concerning the interpretation or application of an international agreement related to the purposes of this Convention, which is submitted to it in accordance with the agreement.", "zh": "第二百八十七條所指的法院或法庭，對於按照與本公約的目的有關的國際協定向其提出的有關該協定的解釋或適用的任何爭端，也應具有管轄權。"}, {"n": "3", "en": "The Seabed Disputes Chamber of the International Tribunal for the Law of the Sea established in accordance with Annex VI, and any other chamber or arbitral tribunal referred to in Part XI, section 5, shall have jurisdiction in any matter which is submitted to it in accordance therewith.", "zh": "按照附件六設立的國際海洋法法庭海底爭端分庭和第十一部份第五節所指的任何其他分庭或仲裁法庭，對按照該節向其提出的任何事項，應具有管轄權。"}, {"n": "4", "en": "In the event of a dispute as to whether a court or tribunal has jurisdiction, the matter shall be settled by decision of that court or tribunal.", "zh": "對於法院或法庭是否具有管轄權如果發生爭端，這一問題應由該法院或法庭以裁定解決。"}], "keys": ["有關本公約的解釋或適用的任何爭端，應具有管轄權", "這一問題應由該法院或法庭以裁定解決"], "plain": "第287條所列的法院或法庭，管轄範圍有三：①公約的解釋或適用爭端；②其他與公約目的有關的國際協定，若該協定把爭端交給它們（例如1995年《跨界魚群協定》）；③第十一部分「區域」相關事項（海底爭端分庭）。第4項確立「管轄權的管轄權」：對有無管轄權發生爭執時，由該法院或法庭自己裁定，這和國際法院規約第36條第6項相同。所以[[case|south-china-sea|南海仲裁案]]中，中國雖主張仲裁庭顯然沒有管轄權，仲裁庭仍有權自行判斷，並於2015年10月29日作成管轄權判斷。管轄的關鍵限制是「解釋或適用本公約」：陸地領土主權本身不是公約問題，因此菲律賓沒有請求仲裁庭判斷島礁主權。", "elements": [{"req": ["第287條所列法院或法庭", "依第十五部分提出的公約解釋或適用爭端"], "effect": "具有管轄權"}, {"req": ["對法院或法庭有無管轄權發生爭端"], "effect": "由該法院或法庭自行裁定"}], "traps": ["陷阱：法院或法庭有無管轄權，由該法院或法庭自行決定，不是由聯合國秘書長或當事國決定。", "陷阱：管轄限於公約（及相關協定）的解釋或適用；單純的陸地或島嶼主權爭端不在範圍內。", "陷阱：法庭管轄可及於公約以外「與本公約目的有關」且將爭端交付它的國際協定（SG020選項B錯誤）。"], "custom": {"status": "不適用", "note": "條約程序規定；管轄權的管轄權原則亦見國際法院規約第36條第6項。", "cases": []}, "related": ["unclos-287", "unclos-293", "unclos-297", "unclos-298", "icj-36"], "cases": [{"id": "south-china-sea", "point": "中國拒絕參與並主張無管轄權，仲裁庭依本條第4項自行裁定有管轄權（2015年管轄權判斷）。"}], "roc": "", "essay": "管轄範圍：「第287條所列機構對公約解釋或適用爭端、與公約目的相關協定的爭端及『區域』事項有管轄權；有無管轄權由其自行裁定（第288條第4項）。主權爭端不屬公約解釋或適用，故不在管轄範圍內。」", "exam": [{"qid": "SG020", "note": "選項B稱法庭管轄不包括公約以外其他協定所生爭端，與本條第2項不符，錯誤；本題正解C。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「第二百八十七載條」依英文作準本及上下文更正為「第二百八十七條」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "290", "heading": "臨時措施", "tier": "A", "paras": [{"n": "1", "en": "If a dispute has been duly submitted to a court or tribunal which considers that prima facie it has jurisdiction under this Part or Part XI, section 5, the court or tribunal may prescribe any provisional measures which it considers appropriate under the circumstances to preserve the respective rights of the parties to the dispute or to prevent serious harm to the marine environment, pending the final decision.", "zh": "如果爭端已經正式提交法院或法庭，而該法院或法庭依據初步證明認為其根據本部份或第十一部份第五節具有管轄權，該法院或法庭可在最後裁判前，規定其根據情況認為適當的任何臨時措施，以保全爭端各方的各自權利或防止對海洋環境的嚴重損害。"}, {"n": "2", "en": "Provisional measures may be modified or revoked as soon as the circumstances justifying them have changed or ceased to exist.", "zh": "臨時措施所根據的情況一旦改變或不復存在，即可修改或撤銷。"}, {"n": "3", "en": "Provisional measures may be prescribed, modified or revoked under this article only at the request of a party to the dispute and after the parties have been given an opportunity to be heard.", "zh": "臨時措施僅在爭端一方提出請求並使爭端各方有陳述意見的機會後，才可根據本條予以規定、修改或撤銷。"}, {"n": "4", "en": "The court or tribunal shall forthwith give notice to the parties to the dispute, and to such other States Parties as it considers appropriate, of the prescription, modification or revocation of provisional measures.", "zh": "法院或法庭應將臨時措施的規定、修改或撤銷迅速通知爭端各方及其認為適當的其他締約國。"}, {"n": "5", "en": "Pending the constitution of an arbitral tribunal to which a dispute is being submitted under this section, any court or tribunal agreed upon by the parties or, failing such agreement within two weeks from the date of the request for provisional measures, the International Tribunal for the Law of the Sea or, with respect to activities in the Area, the Seabed Disputes Chamber, may prescribe, modify or revoke provisional measures in accordance with this article if it considers that prima facie the tribunal which is to be constituted would have jurisdiction and that the urgency of the situation so requires. Once constituted, the tribunal to which the dispute has been submitted may modify, revoke or affirm those provisional measures, acting in conformity with paragraphs 1 to 4.", "zh": "在爭端根據本節正向其提交的仲裁法庭組成以前，經爭端各方協議的任何法院或法庭，如在請求規定臨時措施之日起兩週內不能達成這種協議，則為國際海洋法法庭，或在關於「區域」內活動時的海底爭端分庭，如果根據初步證明認為將予組成的法庭具有管轄權，而且認為情況緊急有此必要，可按照本條規定、修改或撤銷臨時措施。受理爭端的法庭一旦組成，即可依照第一至第四款行事，對這種臨時措施予以修改、撤銷或確認。"}, {"n": "6", "en": "The parties to the dispute shall comply promptly with any provisional measures prescribed under this article.", "zh": "爭端各方應迅速遵從根據本條所規定的任何臨時措施。"}], "keys": ["依據初步證明認為其根據本部份或第十一部份第五節具有管轄權", "以保全爭端各方的各自權利或防止對海洋環境的嚴重損害", "爭端各方應迅速遵從根據本條所規定的任何臨時措施"], "plain": "{{臨時措施}}是在最後裁判前，為避免情況惡化而先下的命令。要件：①爭端已正式提交；②法院或法庭「初步證明」（prima facie）有管轄權；③目的在保全雙方權利，或「防止對海洋環境的嚴重損害」——後者是海洋法公約特有的目的，國際法院規約第41條沒有。程序上只能依當事方請求，不能依職權（第3項）。第5項最重要：爭端要交{{附件七仲裁}}，但仲裁庭組成需要時間，這段期間可由雙方合意的法院或法庭處理；兩週內談不攏，就由{{國際海洋法法庭}}（涉及「區域」時為海底爭端分庭）在「情況緊急」時先下臨時措施，仲裁庭組成後可修改、撤銷或確認。依第6項，臨時措施具拘束力，當事方應迅速遵從。著名例子：南方黑鮪案（1999）、[[case|arctic-sunrise|北極曙光號案]]（2013年命俄羅斯在荷蘭提供360萬歐元擔保後釋放船舶與船員）。", "elements": [{"req": ["爭端已正式提交法院或法庭", "初步證明有管轄權", "為保全爭端各方權利或防止海洋環境嚴重損害", "經爭端一方請求並給予各方陳述機會"], "effect": "法院或法庭得規定適當的臨時措施，當事方應迅速遵從"}, {"req": ["爭端將提交附件七仲裁庭但尚未組成", "兩週內未合意由其他法院或法庭處理", "初步證明將組成的仲裁庭有管轄權", "情況緊急"], "effect": "國際海洋法法庭（「區域」事項為海底爭端分庭）得規定臨時措施"}], "traps": ["陷阱：臨時措施的目的包括「防止對海洋環境的嚴重損害」（SG020正解C）。", "陷阱：臨時措施只能依爭端一方請求作成，不能依職權（第3項）。", "陷阱：管轄權只需「初步證明」，不必在臨時措施階段確定。", "陷阱：第5項的備位機構是國際海洋法法庭，不是國際法院；且以「情況緊急」為要件。", "陷阱：依第6項臨時措施具拘束力，當事方應迅速遵從。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-287", "unclos-288", "unclos-292", "unclos-a7-3", "icj-41"], "cases": [{"id": "southern-bluefin-tuna", "point": "國際海洋法法庭1999年依第5項命三國限制捕撈；附件七仲裁庭2000年認定無管轄權後撤銷該命令。"}, {"id": "arctic-sunrise", "point": "國際海洋法法庭2013年依第5項命俄羅斯在荷蘭提供360萬歐元擔保後釋放船舶與船員；俄羅斯未遵從，仲裁庭認定違反公約。"}], "roc": "", "essay": "臨時措施：「第290條第1項授權法院或法庭在初步證明有管轄權時，為保全當事方權利或防止海洋環境嚴重損害規定臨時措施；第5項使國際海洋法法庭得在附件七仲裁庭組成前處理緊急聲請；依第6項，臨時措施具拘束力。」", "exam": [{"qid": "SG020", "note": "正解C：法庭得為防止嚴重損害海洋環境規定具拘束力的臨時措施（第1、6項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第5項「法院或法庭、如在」「將予組成的法庭組成的法庭」、第6項「應迅遵從」，依英文作準本及上下文更正為「法院或法庭，如在」「將予組成的法庭」「應迅速遵從」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "292", "heading": "船隻和船員的迅速釋放", "tier": "A", "paras": [{"n": "1", "en": "Where the authorities of a State Party have detained a vessel flying the flag of another State Party and it is alleged that the detaining State has not complied with the provisions of this Convention for the prompt release of the vessel or its crew upon the posting of a reasonable bond or other financial security, the question of release from detention may be submitted to any court or tribunal agreed upon by the parties or, failing such agreement within 10 days from the time of detention, to a court or tribunal accepted by the detaining State under article 287 or to the International Tribunal for the Law of the Sea, unless the parties otherwise agree.", "zh": "如果締約國當局扣留了一艘懸掛另一締約國旗幟的船隻，而且據指控，扣留國在合理的保證書或其他財政擔保經提供後，仍然沒有遵從本公約的規定，將該船隻或其船員迅速釋放，釋放問題可向爭端各方協議的任何法院或法庭提出，如從扣留時起十日內不能達成這種協議，則除爭端各方另有協議外，可向扣留國根據第二百八十七條接受的法院或法庭，或向國際海洋法法庭提出。"}, {"n": "2", "en": "The application for release may be made only by or on behalf of the flag State of the vessel.", "zh": "這種釋放的申請，僅可由船旗國或以該國名義提出。"}, {"n": "3", "en": "The court or tribunal shall deal without delay with the application for release and shall deal only with the question of release, without prejudice to the merits of any case before the appropriate domestic forum against the vessel, its owner or its crew. The authorities of the detaining State remain competent to release the vessel or its crew at any time.", "zh": "法院或法庭應不遲延地處理關於釋放的申請，並且應僅處理釋放問題，而不影響在主管的國內法庭對該船隻、其船主或船員的任何案件的是非曲直。扣留國當局應仍有權隨時釋放該船隻或其船員。"}, {"n": "4", "en": "Upon the posting of the bond or other financial security determined by the court or tribunal, the authorities of the detaining State shall comply promptly with the decision of the court or tribunal concerning the release of the vessel or its crew.", "zh": "在法院或法庭裁定的保證書或其他財政擔保經提供後，扣留國當局應迅速遵從法院或法庭關於釋放船隻或其船員的裁定。"}], "keys": ["僅可由船旗國或以該國名義提出", "應僅處理釋放問題", "十日內不能達成這種協議"], "plain": "{{迅速釋放}}程序是快速救濟。公約有幾條規定要求沿海國在對方提供合理保證金後迅速釋放被扣船舶或船員，最典型的是專屬經濟海域漁業執法的[[art|unclos-73|第73條第2項]]（另有第220條第7項、第226條第1項(b)款）。扣留國不放人時：①先看雙方有無合意的法院或法庭；②扣留起10日內無合意，可向扣留國依第287條接受的機構，或直接向{{國際海洋法法庭}}聲請。要點：只有船旗國（或以其名義）才能聲請，船東或船員個人不行；法庭只處理「放不放、保證金多少」，不審理漁業違規本身的是非。國際海洋法法庭的第1號案件就是塞加號案（第1號，1997）的迅速釋放聲請，後續實體爭議即[[case|saiga-2|塞加號案（第2號）]]。", "elements": [{"req": ["締約國扣留懸掛另一締約國旗幟的船隻", "據指控扣留國在合理擔保提供後未依公約迅速釋放船隻或船員", "由船旗國或以其名義聲請", "扣留起10日內未合意法院或法庭時，向扣留國依第287條接受的機構或國際海洋法法庭提出"], "effect": "法院或法庭應不遲延地只就釋放問題作成裁定；擔保提供後扣留國應迅速釋放"}], "traps": ["陷阱：迅速釋放只能由「船旗國」或以其名義聲請，法庭不能依職權裁定（SG020選項D錯誤）。", "陷阱：法庭只處理釋放問題，不影響國內法院對船舶、船東或船員案件的實體審理。", "陷阱：期限是自扣留時起「10日」內未合意，才可向國際海洋法法庭等機構提出。", "陷阱：迅速釋放不以用盡當地救濟為要件，這是快速程序的設計目的。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-73", "unclos-220", "unclos-226", "unclos-287", "unclos-290", "unclos-295"], "cases": [{"id": "saiga-2", "point": "塞加號案的迅速釋放聲請（第1號，1997）是國際海洋法法庭的第一個案件；實體爭議由第2號案處理。"}], "roc": "依本條，只有締約國才能為懸掛其旗幟的船舶聲請迅速釋放。我國不是締約國，我國漁船在他國專屬經濟海域被扣時，無法使用本條程序，只能透過外交交涉或扣留國的國內程序（例如繳納保證金）處理。", "essay": "迅速釋放：「第73條第2項要求沿海國在合理擔保提供後迅速釋放被扣漁船及船員；扣留國未遵守時，船旗國得依第292條於扣留起10日內未合意機構時，向國際海洋法法庭聲請。法庭只處理釋放與擔保問題，不涉及實體是非。」", "exam": [{"qid": "SG020", "note": "選項D錯誤：迅速釋放須由船旗國或以其名義聲請，法庭不得依職權裁定。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「國際海法法庭」依英文作準本更正為「國際海洋法法庭」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "295", "heading": "用盡當地救濟（用盡當地補救辦法）", "tier": "B", "paras": [{"n": "", "en": "Any dispute between States Parties concerning the interpretation or application of this Convention may be submitted to the procedures provided for in this section only after local remedies have been exhausted where this is required by international law.", "zh": "締約國間有關本公約的解釋或適用的任何爭端，僅在依照國際法的要求用盡當地補救辦法後，才可提交本節規定的程序。"}], "keys": ["依照國際法的要求用盡當地補救辦法後"], "plain": "公約把一般國際法的{{用盡當地救濟}}規則帶進強制程序，但加了限定語「依照國際法的要求」：只有國際法本來就要求用盡時才需要，也就是國家在替本國國民主張權利（外交保護）的情形。若受侵害的是國家自己的權利（例如船旗國的航行自由），就不必先在對方法院走完程序。[[case|saiga-2|塞加號案（第2號）]]中，國際海洋法法庭據此駁回幾內亞的抗辯：聖文森及格瑞那丁主張的是船旗國的公約權利直接受侵害，而且塞加號與幾內亞之間沒有管轄上的聯繫，不適用本條。迅速釋放程序（第292條）也不需要先用盡當地救濟。", "elements": [{"req": ["締約國間公約爭端", "國際法要求用盡當地救濟（例如國家為本國國民行使外交保護）"], "effect": "須先用盡當地救濟，才可提交第二節程序"}], "traps": ["陷阱：本條不是一律要求用盡當地救濟，只限「國際法要求」的情形；國家自身權利受直接侵害時不適用。"], "custom": {"status": "習慣法", "note": "用盡當地救濟是習慣國際法上外交保護的要件（國際法委員會2006年《外交保護條款草案》第14條）；本條把它納入公約程序。", "cases": []}, "related": ["unclos-292", "unclos-286"], "cases": [{"id": "saiga-2", "point": "船旗國主張自身權利受直接侵害，且船舶與幾內亞欠缺管轄聯繫，不適用用盡當地救濟規則。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "296", "heading": "裁判的確定性和拘束力", "tier": "A", "paras": [{"n": "1", "en": "Any decision rendered by a court or tribunal having jurisdiction under this section shall be final and shall be complied with by all the parties to the dispute.", "zh": "根據本節具有管轄權的法院或法庭對爭端所作的任何裁判應有確定性，爭端所有各方均應遵從。"}, {"n": "2", "en": "Any such decision shall have no binding force except between the parties and in respect of that particular dispute.", "zh": "這種裁判僅在爭端各方間和對該特定爭端具有拘束力。"}], "keys": ["應有確定性，爭端所有各方均應遵從", "僅在爭端各方間和對該特定爭端具有拘束力"], "plain": "第二節的裁判有兩個效力：①確定性，當事方必須遵從（附件七第11條也規定仲裁判斷不得上訴）；②拘束力只及於當事方與該特定爭端，與國際法院規約第59條相同。所以[[case|south-china-sea|南海仲裁案]]的判斷對菲律賓與中國有拘束力，中國拒絕承認不影響其效力；但對我國、越南等非當事方沒有拘束力，只是其中對第121條第3項的解釋具有重要的參考價值。公約沒有強制執行機制，判斷能否落實仍取決於當事方。", "elements": [{"req": ["依第二節有管轄權的法院或法庭作成裁判"], "effect": "裁判有確定性，爭端各方應遵從；拘束力只及於當事方與該爭端"}], "traps": ["陷阱：裁判只對爭端當事方及該特定爭端有拘束力，對第三國沒有拘束力（與國際法院規約第59條相同）。", "陷阱：當事方拒不參與或拒絕承認，不影響裁判的拘束力；但公約沒有強制執行機制。", "陷阱：南海仲裁判斷對我國不當然具有國內法效力（gl111a_2正解C）。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-a7-11", "icj-59", "icj-60"], "cases": [{"id": "south-china-sea", "point": "判斷對菲中兩國有拘束力，中國拒絕承認不影響其效力；對非當事方（含我國）不具拘束力。"}], "roc": "南海仲裁判斷依本條只拘束菲律賓與中國。總統府2016年7月12日聲明，判斷對我國不具法律拘束力，我國絕不接受。", "essay": "裁判效力：「依第296條及附件七第11條，強制程序的裁判具確定性、不得上訴，當事方均應遵從；但拘束力只及於當事方與該特定爭端。中國不參與南海仲裁，不影響判斷對其的拘束力；該判斷對我國不具拘束力。」", "exam": [{"qid": "gl111a_2", "note": "南海仲裁判斷依本條只拘束當事方，對我國不具國內法效力；正解C（身心障礙者權利公約經施行法內國法化）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「爭諯」依英文作準本更正為「爭端」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "297", "heading": "適用第二節的限制", "tier": "A", "paras": [{"n": "1", "en": "Disputes concerning the interpretation or application of this Convention with regard to the exercise by a coastal State of its sovereign rights or jurisdiction provided for in this Convention shall be subject to the procedures provided for in section 2 in the following cases:\n(a) when it is alleged that a coastal State has acted in contravention of the provisions of this Convention in regard to the freedoms and rights of navigation, overflight or the laying of submarine cables and pipelines, or in regard to other internationally lawful uses of the sea specified in article 58;\n(b) when it is alleged that a State in exercising the aforementioned freedoms, rights or uses has acted in contravention of this Convention or of laws or regulations adopted by the coastal State in conformity with this Convention and other rules of international law not incompatible with this Convention; or\n(c) when it is alleged that a coastal State has acted in contravention of specified international rules and standards for the protection and preservation of the marine environment which are applicable to the coastal State and which have been established by this Convention or through a competent international organization or diplomatic conference in accordance with this Convention.", "zh": "關於因沿海國行使本公約規定的主權權利或管轄權而發生的對本公約的解釋或適用的爭端，還有下列情形，應遵守第二節所規定的程序：\n(a)據指控，沿海國在第五十八條規定的關於航行、飛越或鋪設海底電纜和管道的自由和權利，或關於海洋的其他國際合法用途方面，有違反本公約的規定的行為；\n(b)據指控，一國在行使上述自由、權利或用途時，有違反本公約或沿海國按照本公約和其他與本公約不相牴觸的國際法規則制定的法律或規章的行為；或\n(c)據指控，沿海國有違反適用於該沿海國、並由本公約所制訂或通過主管國際組織或外交會議按照本公約制定的關於保護和保全海洋環境的特定國際規則和標準的行為。"}, {"n": "2", "en": "(a) Disputes concerning the interpretation or application of the provisions of this Convention with regard to marine scientific research shall be settled in accordance with section 2, except that the coastal State shall not be obliged to accept the submission to such settlement of any dispute arising out of:\n(i) the exercise by the coastal State of a right or discretion in accordance with article 246; or\n(ii) a decision by the coastal State to order suspension or cessation of a research project in accordance with article 253.\n(b) A dispute arising from an allegation by the researching State that with respect to a specific project the coastal State is not exercising its rights under articles 246 and 253 in a manner compatible with this Convention shall be submitted, at the request of either party, to conciliation under Annex V, section 2, provided that the conciliation commission shall not call in question the exercise by the coastal State of its discretion to designate specific areas as referred to in article 246, paragraph 6, or of its discretion to withhold consent in accordance with article 246, paragraph 5.", "zh": "(a)本公約關於海洋科學研究的規定在解釋或適用上的爭端，應按照第二節解決，但對下列情形所引起的任何爭端，沿海國並無義務同意將其提交這種解決程序：\n(1)沿海國按照第二百四十六條行使權利或斟酌決定權；或\n(2)沿海國按照第二百五十三條決定命令暫停或停止一項研究計劃。\n(b)因進行研究國家指控沿海國對某一特定計劃行使第二百四十六和第二百五十三條所規定權利的方式不符合本公約而引起的爭端，經任何一方請求，應按照附件五第二節提交調解程序，但調解委員會對沿海國行使斟酌決定權指定第二百四十六條第六款所指特定區域，或按照第二百四十六條第五款行使斟酌決定權拒不同意，不應提出疑問。"}, {"n": "3", "en": "(a) Disputes concerning the interpretation or application of the provisions of this Convention with regard to fisheries shall be settled in accordance with section 2, except that the coastal State shall not be obliged to accept the submission to such settlement of any dispute relating to its sovereign rights with respect to the living resources in the exclusive economic zone or their exercise, including its discretionary powers for determining the allowable catch, its harvesting capacity, the allocation of surpluses to other States and the terms and conditions established in its conservation and management laws and regulations.\n(b) Where no settlement has been reached by recourse to section 1 of this Part, a dispute shall be submitted to conciliation under Annex V, section 2, at the request of any party to the dispute, when it is alleged that:\n(i) a coastal State has manifestly failed to comply with its obligations to ensure through proper conservation and management measures that the maintenance of the living resources in the exclusive economic zone is not seriously endangered;\n(ii) a coastal State has arbitrarily refused to determine, at the request of another State, the allowable catch and its capacity to harvest living resources with respect to stocks which that other State is interested in fishing; or\n(iii) a coastal State has arbitrarily refused to allocate to any State, under articles 62, 69 and 70 and under the terms and conditions established by the coastal State consistent with this Convention, the whole or part of the surplus it has declared to exist.\n(c) In no case shall the conciliation commission substitute its discretion for that of the coastal State.\n(d) The report of the conciliation commission shall be communicated to the appropriate international organizations.\n(e) In negotiating agreements pursuant to articles 69 and 70, States Parties, unless they otherwise agree, shall include a clause on measures which they shall take in order to minimize the possibility of a disagreement concerning the interpretation or application of the agreement, and on how they should proceed if a disagreement nevertheless arises.", "zh": "(a)對本公約關於漁業的規定在解釋或適用上的爭端，應按照第二節解決，但沿海國並無義務同意將任何有關其對專屬經濟區內生物資源的主權權利或此項權利的行使的爭端，包括關於其對決定可捕量、其捕撈能力、分配剩餘量給其他國家、其關於養護和管理這種資源的法律和規章中所制訂的條款和條件的斟酌決定權的爭端，提交這種解決程序。\n(b)據指控有下列情事時，如已訴諸第一節而仍未得到解決，經爭端任何一方請求，應將爭端提交附件五第二節所規定的調解程序：\n(1)一個沿海國明顯地沒有履行其義務，通過適當的養護和管理措施，以確保專屬經濟區內生物資源的維持不致受到嚴重危害；\n(2)一個沿海國，經另一國請求，對該另一國有意捕撈的種群，專斷地拒絕決定可捕量及沿海國捕撈生物資源的能力；或\n(3)一個沿海國專斷地拒絕根據第六十二、第六十九和第七十條以及該沿海國所制訂的符合本公約的條款和條件，將其已宣佈存在的剩餘量的全部或一部份分配給任何國家。\n(c)在任何情形下，調解委員會不得以其斟酌決定權代替沿海國的斟酌決定權。\n(d)調解委員會的報告應送交有關的國際組織。\n(e)各締約國在依據第六十九和七十條談判協定時，除另有協議外，應列入一個條款，規定各締約國為了盡量減少對協定的解釋或適用發生爭議的可能性所應採取的措施，並規定如果仍然發生爭議，各締約國應採取何種步驟。"}], "keys": ["沿海國並無義務同意將任何有關其對專屬經濟區內生物資源的主權權利", "應按照附件五第二節提交調解程序"], "plain": "第297條是「自動」適用的限制，不需要聲明。對象是沿海國在專屬經濟海域與大陸礁層行使主權權利或管轄權所生的爭端：\n①第1項：航行、飛越、鋪設海底電纜管道等自由受沿海國侵犯，或他國行使這些自由時違反沿海國合法法規，或沿海國違反特定海洋環境國際標準——這三類仍「應」適用強制程序。\n②第2項（海洋科學研究）：沿海國依第246條同意或拒絕研究、依第253條命令暫停或停止研究，沿海國可不接受強制程序，只能交強制「調解」。\n③第3項（漁業）：涉及專屬經濟海域生物資源主權權利的爭端（可捕量、捕撈能力、剩餘量分配、養護法規），沿海國可不接受強制程序；特定情形交強制調解，但調解委員會不得以自己的判斷取代沿海國的裁量。\n簡單說：專屬經濟海域內的「資源」裁量交給沿海國，「航行自由」則受強制程序保障。", "elements": [{"req": ["沿海國行使主權權利或管轄權所生爭端", "涉及航行、飛越、海底電纜管道自由或特定海洋環境標準"], "effect": "應適用第二節強制程序"}, {"req": ["涉及沿海國對專屬經濟海域生物資源的主權權利或其行使（可捕量、捕撈能力、剩餘量分配、養護法規）"], "effect": "沿海國無義務接受強制程序；特定情形交附件五強制調解"}, {"req": ["涉及沿海國依第246條或第253條對海洋科學研究的權利或裁量"], "effect": "沿海國無義務接受強制程序；研究國得請求附件五強制調解"}], "traps": ["陷阱：第297條是自動適用的限制，不需要締約國另作聲明；需要聲明的是第298條的任擇性例外。", "陷阱：沿海國「無義務接受」強制程序的漁業爭端，限於專屬經濟海域內生物資源的主權權利；公海漁業爭端不在此限。", "陷阱：航行、飛越自由受侵害的爭端仍應適用強制程序（第1項(a)款）。", "陷阱：強制調解的結論沒有拘束力，且調解委員會不得以其裁量代替沿海國的裁量。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-56", "unclos-58", "unclos-61", "unclos-62", "unclos-73", "unclos-246", "unclos-286", "unclos-298"], "cases": [], "roc": "", "essay": "強制程序的限制：「第297條自動排除沿海國在專屬經濟海域內對生物資源及海洋科學研究的裁量性爭端，改交強制調解；但涉及航行、飛越、電纜管道自由與特定環境標準的爭端，仍應適用強制程序。」", "exam": [{"qid": "SG036", "note": "選項D錯誤：專屬經濟海域生物資源主權權利的爭端，沿海國「無義務」交付強制程序（第3項(a)款）；本題正解C（第298條）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第2項(a)款(1)目「沿海洋國」、第3項(b)款(3)目「第七十號條」，依英文作準本更正為「沿海國」「第七十條」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "298", "heading": "適用第二節的任擇性例外", "tier": "A", "paras": [{"n": "1", "en": "When signing, ratifying or acceding to this Convention or at any time thereafter, a State may, without prejudice to the obligations arising under section 1, declare in writing that it does not accept any one or more of the procedures provided for in section 2 with respect to one or more of the following categories of disputes:\n(a) (i) disputes concerning the interpretation or application of articles 15, 74 and 83 relating to sea boundary delimitations, or those involving historic bays or titles, provided that a State having made such a declaration shall, when such a dispute arises subsequent to the entry into force of this Convention and where no agreement within a reasonable period of time is reached in negotiations between the parties, at the request of any party to the dispute, accept submission of the matter to conciliation under Annex V, section 2; and provided further that any dispute that necessarily involves the concurrent consideration of any unsettled dispute concerning sovereignty or other rights over continental or insular land territory shall be excluded from such submission;\n(ii) after the conciliation commission has presented its report, which shall state the reasons on which it is based, the parties shall negotiate an agreement on the basis of that report; if these negotiations do not result in an agreement, the parties shall, by mutual consent, submit the question to one of the procedures provided for in section 2, unless the parties otherwise agree;\n(iii) this subparagraph does not apply to any sea boundary dispute finally settled by an arrangement between the parties, or to any such dispute which is to be settled in accordance with a bilateral or multilateral agreement binding upon those parties;\n(b) disputes concerning military activities, including military activities by government vessels and aircraft engaged in non-commercial service, and disputes concerning law enforcement activities in regard to the exercise of sovereign rights or jurisdiction excluded from the jurisdiction of a court or tribunal under article 297, paragraph 2 or 3;\n(c) disputes in respect of which the Security Council of the United Nations is exercising the functions assigned to it by the Charter of the United Nations, unless the Security Council decides to remove the matter from its agenda or calls upon the parties to settle it by the means provided for in this Convention.", "zh": "一國在簽署、批准或加入本公約時，或在其後任何時間，在不妨害根據第一節所產生的義務的情形下，可以書面聲明對於下列各類爭端的一類或一類以上，不接受第二節規定的一種或一種以上的程序：\n(a)(1)關於劃定海洋邊界的第十五、第七十四和第八十三條在解釋或適用上的爭端，或涉及歷史性海灣或所有權的爭端，但如這種爭端發生於本公約生效之後，經爭端各方談判仍未能在合理期間內達成協議，則作此聲明的國家，經爭端任何一方請求，應同意將該事項提交附件五第二節所規定的調解；此外，任何爭端如果必然涉及同時審議與大陸或島嶼陸地領土的主權或其他權利有關的任何尚未解決的爭端，則不應提交這一程序；\n(2)在調解委員會提出其中說明所根據的理由的報告後，爭端各方應根據各報告以談判達成協議；如果談判未能達成協議，經彼此同意，爭端各方應將問題提交第二節所規定的程序之一，除非爭端各方另有協議；\n(3)本項不適用於爭端各方已以一項安排確定解決的任何海洋邊界爭端，也不適用於按照對爭端各方有拘束力的雙邊或多邊協定加以解決的任何爭端；\n(b)關於軍事活動，包括從事非商業服務的政府船隻和飛機的軍事活動的爭端，以及根據第二百九十七條第二和第三款不屬法院或法庭管轄的關於行使主權權利或管轄權的法律執行活動的爭端；\n(c)正由聯合國安全理事會執行「聯合國憲章」所賦予的職務的爭端，但安全理事會決定將該事項從其議程刪除或要求爭端各方用本公約規定的方法解決該爭端者除外。"}, {"n": "2", "en": "A State Party which has made a declaration under paragraph 1 may at any time withdraw it, or agree to submit a dispute excluded by such declaration to any procedure specified in this Convention.", "zh": "根據第一款作出聲明的締約國，可隨時撤回聲明，或同意將該聲明所排除的爭端提交本公約規定的任何程序。"}, {"n": "3", "en": "A State Party which has made a declaration under paragraph 1 shall not be entitled to submit any dispute falling within the excepted category of disputes to any procedure in this Convention as against another State Party, without the consent of that party.", "zh": "根據第一款作出聲明的締約國，應無權對另一締約國，將屬於被除外的一類爭端的任何爭端，未經該另一締約國同意，提交本公約的任何程序。"}, {"n": "4", "en": "If one of the States Parties has made a declaration under paragraph 1(a), any other State Party may submit any dispute falling within an excepted category against the declarant party to the procedure specified in such declaration.", "zh": "如締約國之一已根據第一款(a)項作出聲明，任何其他締約國可對作出聲明締約國，將屬於被除外一類的任何爭端提交這種聲明內指明的程序。"}, {"n": "5", "en": "A new declaration, or the withdrawal of a declaration, does not in any way affect proceedings pending before a court or tribunal in accordance with this article, unless the parties otherwise agree.", "zh": "新的聲明，或聲明的撤回，對按照本條在法院或法庭進行中的程序並無任何影響，除非爭端各方另有協議。"}, {"n": "6", "en": "Declarations and notices of withdrawal of declarations under this article shall be deposited with the Secretary-General of the United Nations, who shall transmit copies thereof to the States Parties.", "zh": "根據本條作出的聲明和撤回聲明的通知，應交存於聯合國秘書長，秘書長應將其副本分送各締約國。"}], "keys": ["可以書面聲明對於下列各類爭端的一類或一類以上，不接受第二節規定的一種或一種以上的程序", "關於劃定海洋邊界的第十五、第七十四和第八十三條", "關於軍事活動"], "plain": "{{任擇性例外}}：締約國可以隨時用書面聲明，把三類爭端排除在強制程序之外：\n①(a)款：海洋劃界（第15、74、83條）及歷史性海灣或所有權爭端。但公約生效後發生的劃界爭端，談判不成時應接受附件五強制調解；若必然涉及陸地或島嶼主權爭端，連調解也不必。\n②(b)款：軍事活動，以及依第297條第2、3項本來就排除的漁業、科研執法活動。\n③(c)款：安理會正在處理的爭端。\n另有互惠效果：作出聲明的國家不能把同類爭端拿去告別國（第3項）。中國2006年8月25日依本條作出排除(a)(b)(c)三類的聲明，所以[[case|south-china-sea|南海仲裁案]]中菲律賓刻意不請求劃界，只請求判斷地物地位與歷史性權利；仲裁庭也認定仁愛暗沙的對峙屬軍事活動，無管轄權。[[case|arctic-sunrise|北極曙光號案]]中，俄羅斯的執法活動聲明被認定只涵蓋第297條第2、3項的漁業與科研執法，不包括對油氣平台抗議船的扣押，因此不排除管轄。", "elements": [{"req": ["締約國以書面聲明", "爭端屬劃界／歷史性海灣或所有權、軍事活動或特定執法活動、安理會正處理事項"], "effect": "該類爭端不適用第二節強制程序（劃界爭端仍可能須接受強制調解）"}, {"req": ["聲明國就被排除類別的爭端控告他國"], "effect": "須經他國同意（第3項）"}], "traps": ["陷阱：締約國得以書面聲明就第15、74、83條的劃界爭端不接受強制程序（SG036正解C）。", "陷阱：第298條要「聲明」才生效；第297條的限制則自動適用。", "陷阱：劃界例外下，公約生效後發生的劃界爭端，聲明國仍應接受附件五「強制調解」；但涉及陸地或島嶼主權的爭端可排除調解。", "陷阱：聲明只排除第二節（強制程序），不影響第一節的和平解決義務。", "陷阱：中國的第298條聲明不能排除南海仲裁案中「地物法律地位」「歷史性權利是否符合公約」的爭端，因為這些不是劃界本身。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-15", "unclos-74", "unclos-83", "unclos-10", "unclos-297", "unclos-299", "unclos-287"], "cases": [{"id": "south-china-sea", "point": "中國2006年第298條聲明排除劃界爭端；仲裁庭認定地物地位與歷史性權利不等於劃界，但仁愛暗沙對峙屬軍事活動而無管轄權。"}, {"id": "arctic-sunrise", "point": "俄羅斯的執法活動聲明只能排除第297條第2、3項的漁業與科研執法爭端，不及於本案扣押。"}], "roc": "", "essay": "任擇性例外：「依第298條，締約國得書面聲明就劃界與歷史性所有權、軍事及特定執法活動、安理會處理中的爭端，不接受強制程序；劃界例外下仍有強制調解。中國2006年聲明排除三類爭端，菲律賓因此不請求劃界，改請求判斷地物地位與歷史性權利，仲裁庭認定此類請求不受該聲明排除。」", "exam": [{"qid": "SG036", "note": "正解C：締約國得依第1項(a)款以書面聲明，就第15、74、83條的劃界爭端不接受強制程序。選項A錯（第287條可選四種程序），選項B錯（附件五調解員可不限名單內人選）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項(a)款(1)目「權利稅有關」、(c)款「聯合安全理事會」、第5項「並 無」，依英文作準本更正為「權利有關」「聯合國安全理事會」「並無」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "a7-1", "heading": "附件七 仲裁：程序的提起", "tier": "B", "paras": [{"n": "", "en": "Subject to the provisions of Part XV, any party to a dispute may submit the dispute to the arbitral procedure provided for in this Annex by written notification addressed to the other party or parties to the dispute. The notification shall be accompanied by a statement of the claim and the grounds on which it is based.", "zh": "在第十五部分限制下，爭端任何一方可向爭端他方發出書面通知，將爭端提交本附件所規定的仲裁程序。通知應附有一份關於其權利主張及該權利主張所依據的理由的說明。"}], "keys": ["爭端任何一方可向爭端他方發出書面通知"], "plain": "{{附件七仲裁}}由爭端「任何一方」以書面通知他方即可提起，並附上請求與理由說明，不需要他方同意或簽訂仲裁協議。這是它和傳統仲裁（須當事國合意）最大的不同，也是附件七能成為第287條預設程序的基礎。菲律賓2013年1月22日向中國發出的通知與請求說明，就是依本條提起[[case|south-china-sea|南海仲裁案]]。", "elements": [{"req": ["符合第十五部分的要件", "爭端一方向他方發出書面通知", "附請求及理由說明"], "effect": "附件七仲裁程序開始"}], "traps": ["陷阱：附件七仲裁可由一方單方提起，不必先簽仲裁協議。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-287", "unclos-a7-3", "unclos-a7-9"], "cases": [{"id": "south-china-sea", "point": "菲律賓2013年1月22日以書面通知及請求說明提起仲裁。"}], "roc": "", "essay": "", "exam": [{"qid": "gl114a_17", "note": "菲律賓依本條向中國發出書面通知提起仲裁；正解D附件七仲裁庭。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。中文依一網路轉錄本逐字比對；原文「第ＸＶ部分」依作準本格式寫作「第十五部分」。附件七中文本依聯合國作準中文本轉錄並改為正體字（海洋委員會正體本未收附件條文）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "a7-3", "heading": "附件七 仲裁：仲裁法庭的組成", "tier": "B", "paras": [{"n": "", "en": "For the purpose of proceedings under this Annex, the arbitral tribunal shall, unless the parties otherwise agree, be constituted as follows:\n(a) Subject to subparagraph (g), the arbitral tribunal shall consist of five members.\n(b) The party instituting the proceedings shall appoint one member to be chosen preferably from the list referred to in article 2 of this Annex, who may be its national. The appointment shall be included in the notification referred to in article 1 of this Annex.\n(c) The other party to the dispute shall, within 30 days of receipt of the notification referred to in article 1 of this Annex, appoint one member to be chosen preferably from the list, who may be its national. If the appointment is not made within that period, the party instituting the proceedings may, within two weeks of the expiration of that period, request that the appointment be made in accordance with subparagraph (e).\n(d) The other three members shall be appointed by agreement between the parties. They shall be chosen preferably from the list and shall be nationals of third States unless the parties otherwise agree. The parties to the dispute shall appoint the President of the arbitral tribunal from among those three members. If, within 60 days of receipt of the notification referred to in article 1 of this Annex, the parties are unable to reach agreement on the appointment of one or more of the members of the tribunal to be appointed by agreement, or on the appointment of the President, the remaining appointment or appointments shall be made in accordance with subparagraph (e), at the request of a party to the dispute. Such request shall be made within two weeks of the expiration of the aforementioned 60-day period.\n(e) Unless the parties agree that any appointment under subparagraphs (c) and (d) be made by a person or a third State chosen by the parties, the President of the International Tribunal for the Law of the Sea shall make the necessary appointments. If the President is unable to act under this subparagraph or is a national of one of the parties to the dispute, the appointment shall be made by the next senior member of the International Tribunal for the Law of the Sea who is available and is not a national of one of the parties. The appointments referred to in this subparagraph shall be made from the list referred to in article 2 of this Annex within a period of 30 days of the receipt of the request and in consultation with the parties. The members so appointed shall be of different nationalities and may not be in the service of, ordinarily resident in the territory of, or nationals of, any of the parties to the dispute.\n(f) Any vacancy shall be filled in the manner prescribed for the initial appointment.\n(g) Parties in the same interest shall appoint one member of the tribunal jointly by agreement. Where there are several parties having separate interests or where there is disagreement as to whether they are of the same interest, each of them shall appoint one member of the tribunal. The number of members of the tribunal appointed separately by the parties shall always be smaller by one than the number of members of the tribunal to be appointed jointly by the parties.\n(h) In disputes involving more than two parties, the provisions of subparagraphs (a) to (f) shall apply to the maximum extent possible.", "zh": "為本附件所規定程序的目的，除非爭端各方另有協議，仲裁法庭應依下列規定組成：\n(a)在(g)項限制下，仲裁法庭應由仲裁員五人組成。\n(b)提起程序的一方應指派一人，最好從本附件第2條所指名單中選派，並可為其本國國民。這種指派應列入本附件第1條所指的通知。\n(c)爭端他方應在收到本附件第1條所指通知三十天內指派一名仲裁員，最好從名單中選派，並可為其國民。如在該期限內未作出指派，提起程序的一方，可在該期限屆滿後兩星期內，請求按照(e)項作出指派。\n(d)另三名仲裁員應由爭端各方間以協議指派。他們最好從名單中選派，並應為第三國國民，除非各方另有協議。爭端各方應從這三名仲裁員中選派一人為仲裁法庭庭長。如果在收到本附件第1條所指通知後六十天內，各方未能就應以協議指派的仲裁法庭一名或一名以上仲裁員的指派達成協議，或未能就指派庭長達成協議，則經爭端一方請求，所餘指派應按照(e)項作出。這種請求應於上述六十天期間屆滿後兩星期內作出。\n(e)除非爭端各方協議將本條(c)和(d)項規定的任何指派交由爭端各方選定的某一人士或第三國作出，應由國際海洋法法庭庭長作出必要的指派。如果庭長不能依據本項辦理，或為爭端一方的國民，這種指派應由可以擔任這項工作並且不是爭端任何一方國民的國際海洋法法庭年資次深法官作出。本項所指的指派，應於收到請求後三十天期間內，在與爭端雙方協商後，從本附件第2條所指名單中作出。這樣指派的仲裁員應屬不同國籍，且不得為爭端任何一方的工作人員，或其境內的通常居民或其國民。\n(f)任何出缺應按照原來的指派方法補缺。\n(g)利害關係相同的爭端各方，應通過協議共同指派一名仲裁員。如果爭端若干方利害關係不同，或對彼此是否利害關係相同，意見不一致，則爭端每一方應指派一名仲裁員。由爭端各方分別指派的仲裁員，其人數應始終比由爭端各方共同指派的仲裁員少一人。\n(h)對於涉及兩個以上爭端各方的爭端，應在最大可能範圍內適用(a)至(f)項的規定。"}], "keys": ["仲裁法庭應由仲裁員五人組成", "應由國際海洋法法庭庭長作出必要的指派"], "plain": "附件七仲裁庭原則上5人：雙方各指派1人（可為本國國民），另3人由雙方協議指派、原則上為第三國國民，並從中選出庭長。關鍵是防止一方「拖延不指派」讓仲裁卡住：他方30天內不指派，或60天內就另3人或庭長談不攏，經請求即由{{國際海洋法法庭}}庭長代為指派（庭長為當事國國民或不能辦理時，由次資深且非當事國國民的法官指派）。[[case|south-china-sea|南海仲裁案]]中，中國未指派仲裁員，國際海洋法法庭庭長柳井俊二依本條指派了中方應指派的1名及其餘3名仲裁員；[[case|arctic-sunrise|北極曙光號案]]中，俄羅斯未指派，同樣由法庭庭長代為指派。", "elements": [{"req": ["他方收到通知後30天內未指派仲裁員"], "effect": "提起方得於期滿後兩星期內請求依(e)項由國際海洋法法庭庭長指派"}, {"req": ["收到通知後60天內未就另3名仲裁員或庭長達成協議"], "effect": "經一方請求，由國際海洋法法庭庭長指派"}], "traps": ["陷阱：代為指派仲裁員的是「國際海洋法法庭庭長」，不是聯合國秘書長或國際法院院長。", "陷阱：雙方各自指派的仲裁員可以是本國國民；共同指派的3人原則上須為第三國國民。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-a7-1", "unclos-a7-9", "unclos-287", "unclos-290"], "cases": [{"id": "south-china-sea", "point": "中國未指派仲裁員，國際海洋法法庭庭長柳井俊二依(c)(e)項代為指派其餘4名仲裁員。"}, {"id": "arctic-sunrise", "point": "俄羅斯未指派仲裁員，由國際海洋法法庭庭長代為指派。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。開頭句與(a)至(c)、(f)至(h)項中文已與一網路轉錄本逐字比對；(d)、(e)項轉錄本取得不完整，暫依聯合國作準中文本轉錄，待逐字覆核。附件七中文本依聯合國作準中文本轉錄並改為正體字（海洋委員會正體本未收附件條文）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "a7-9", "heading": "附件七 仲裁：不到案", "tier": "A", "paras": [{"n": "", "en": "If one of the parties to the dispute does not appear before the arbitral tribunal or fails to defend its case, the other party may request the tribunal to continue the proceedings and to make its award. Absence of a party or failure of a party to defend its case shall not constitute a bar to the proceedings. Before making its award, the arbitral tribunal must satisfy itself not only that it has jurisdiction over the dispute but also that the claim is well founded in fact and law.", "zh": "如爭端一方不出庭或對案件不進行辯護，他方可請求仲裁法庭繼續進行程序並作出裁決。爭端一方缺席或不對案件進行辯護，應不妨礙程序的進行。仲裁法庭在作出裁決前，必須不但查明對該爭端確有管轄權，而且查明所提要求在事實上和法律上均確有根據。"}], "keys": ["應不妨礙程序的進行", "查明所提要求在事實上和法律上均確有根據"], "plain": "{{不到案}}（不出庭）規則：一方拒絕參與或不答辯，不能讓仲裁停擺，他方可請求繼續進行並作出判斷。但為了保護缺席的一方，仲裁庭有兩項「查明義務」：①自己確認有管轄權；②確認請求在事實與法律上都有根據——不能因為一方缺席就照單全收。國際法院規約第53條有相同設計（法院亦須查明管轄權與請求有根據）。[[case|south-china-sea|南海仲裁案]]中，中國拒絕參與，但透過2014年12月7日的立場文件等表達意見；仲裁庭把這些文件視為管轄權抗辯處理，並主動檢驗菲律賓的主張、委任獨立專家。[[case|arctic-sunrise|北極曙光號案]]中，俄羅斯同樣拒絕出庭，仲裁庭依本條繼續審理。", "elements": [{"req": ["爭端一方不出庭或不答辯", "他方請求繼續"], "effect": "仲裁庭得繼續進行程序並作成判斷；缺席不妨礙程序"}, {"req": ["仲裁庭作成判斷前"], "effect": "須查明有管轄權，且請求在事實上與法律上均有根據"}], "traps": ["陷阱：一方缺席不會使仲裁程序終止；但仲裁庭也不能因缺席就逕認請求成立，仍須查明管轄權與請求的事實、法律根據。", "陷阱：國際法院規約第53條（缺席判決）有相同的查明義務。"], "custom": {"status": "不適用", "note": "條約程序規定；與國際法院規約第53條相同。", "cases": []}, "related": ["unclos-a7-1", "unclos-a7-3", "unclos-a7-11", "unclos-288", "icj-53"], "cases": [{"id": "south-china-sea", "point": "中國不參與，仲裁庭依本條繼續審理，並把中國的立場文件視為管轄權抗辯，主動檢驗菲方請求。"}, {"id": "arctic-sunrise", "point": "俄羅斯拒絕參與，仲裁庭繼續審理並作成判斷。"}], "roc": "", "essay": "不到案：「依附件七第9條，一方不出庭不妨礙程序進行，但仲裁庭須查明有管轄權且請求在事實及法律上有根據（與國際法院規約第53條相同）。南海仲裁案中國拒絕參與，仲裁庭仍作成判斷。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。中文已與一網路轉錄本逐字比對。附件七中文本依聯合國作準中文本轉錄並改為正體字（海洋委員會正體本未收附件條文）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "a7-11", "heading": "附件七 仲裁：裁決的確定性", "tier": "B", "paras": [{"n": "", "en": "The award shall be final and without appeal, unless the parties to the dispute have agreed in advance to an appellate procedure. It shall be complied with by the parties to the dispute.", "zh": "除爭端各方事前議定某種上訴程序外，裁決應有確定性，不得上訴，爭端各方均應遵守裁決。"}], "keys": ["裁決應有確定性，不得上訴"], "plain": "附件七仲裁判斷一經作成即確定、不得上訴（除非雙方事前另約定上訴程序），當事方都應遵守；配合第296條，判斷只拘束當事方與該爭端。公約沒有執行機關，[[case|south-china-sea|南海仲裁案]]的判斷雖有拘束力，中國拒絕承認，也無法強制執行。", "elements": [{"req": ["附件七仲裁庭作成判斷", "爭端各方未事前議定上訴程序"], "effect": "判斷確定、不得上訴，當事方應遵守"}], "traps": ["陷阱：附件七仲裁判斷原則上不得上訴；國際海洋法法庭不是它的上訴機關。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-296", "unclos-a7-9"], "cases": [{"id": "south-china-sea", "point": "判斷確定且不得上訴；中國拒絕承認，公約沒有強制執行機制。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。中文已與一網路轉錄本逐字比對。附件七中文本依聯合國作準中文本轉錄並改為正體字（海洋委員會正體本未收附件條文）。"}]});
CASES.push({"id": "southern-bluefin-tuna", "nameZh": "南方黑鮪案（澳洲、紐西蘭訴日本）", "nameEn": "Southern Bluefin Tuna Case (Australia and New Zealand v. Japan)", "court": "附件七仲裁庭（臨時措施由國際海洋法法庭作成）", "year": "2000", "date": "2000-08-04", "kind": "仲裁", "parties": "澳洲、紐西蘭訴日本。國際海洋法法庭1999年8月27日依第290條第5項作成臨時措施命令；附件七仲裁庭由史瓦博（Stephen Schwebel，庭長）等五人組成，2000年8月4日作成管轄權與可受理性判斷。", "facts": "澳、紐、日三國於1993年締結《南方黑鮪養護公約》，設委員會決定總可捕量與各國配額。日本1998年起單方實施「實驗性捕撈」，超出配額。澳、紐主張日本違反海洋法公約第64、116至119條的養護與合作義務，依第十五部分提起附件七仲裁，並先向國際海洋法法庭聲請臨時措施。日本抗辯：爭端屬1993年公約的範圍，該公約第16條規定爭端須經全體當事國同意才能交付國際法院或仲裁，已排除海洋法公約的強制程序。", "issues": ["爭端是否同時涉及海洋法公約的解釋或適用？", "1993年公約第16條是否屬於第281條第1項「排除任何其他程序」的協議？"], "holding": ["國際海洋法法庭（1999）：初步證明附件七仲裁庭有管轄權，命三國不得超過既有配額捕撈，並不得進行實驗性捕撈（除非計入其配額）。", "仲裁庭（2000）：爭端同時涉及1993年公約與海洋法公約，一個事實可同時違反兩項條約（條約平行）。", "但1993年公約第16條要求經全體當事國同意才交付司法或仲裁，雖未明文排除，已足以排除海洋法公約第十五部分的強制程序；依第281條第1項，仲裁庭無管轄權（4比1，基思法官〔Kenneth Keith〕提出個別意見，認為仲裁庭有管轄權）。", "仲裁庭並撤銷國際海洋法法庭的臨時措施命令（依第290條第5項，仲裁庭組成後得修改、撤銷或確認）。"], "significance": "第一件附件七仲裁案。多數意見讓區域漁業協定的「合意交付」條款即可排除強制程序，被批評削弱公約強制機制；[[case|south-china-sea|南海仲裁案]]（2015）改採較嚴格標準，認為第281條原則上需要明示排除。考點：①第281條的排除協議；②第290條第5項國際海洋法法庭在仲裁庭組成前的臨時措施權限，以及仲裁庭組成後可撤銷；③條約平行。我國漁業實體自2002年起加入南方黑鮪養護委員會的延伸委員會，參與配額管理。", "articles": ["unclos-281", "unclos-290"], "exam": [], "srcUrl": "https://legal.un.org/riaa/vol_23.shtml", "verified": "2026-10-07"});
CASES.push({"id": "arctic-sunrise", "nameZh": "北極曙光號案（荷蘭訴俄羅斯）", "nameEn": "The \"Arctic Sunrise\" Arbitration (Kingdom of the Netherlands v. Russian Federation)", "court": "附件七仲裁庭（常設仲裁法院擔任書記處；臨時措施由國際海洋法法庭作成）", "year": "2015", "date": "2015-08-14", "kind": "仲裁", "parties": "荷蘭（船旗國）2013年10月4日依附件七提起仲裁；俄羅斯以照會表示拒絕參與。仲裁庭由門沙（Thomas Mensah，庭長）等五人組成。", "facts": "北極曙光號是綠色和平組織使用、懸掛荷蘭旗幟的船舶。2013年9月18日，船上人員在俄羅斯專屬經濟海域內，乘小艇接近俄羅斯在伯朝拉海的普里拉茲洛姆納亞（Prirazlomnaya）石油平台抗議，部分人試圖攀上平台。次日，俄羅斯海岸防衛隊以直升機登臨該船，扣押船舶並逮捕船上30人，押往莫曼斯克，以海盜罪、後改以流氓罪追訴。荷蘭向國際海洋法法庭聲請臨時措施，並提起附件七仲裁。", "issues": ["俄羅斯依第298條第1項(b)款所作的「執法活動」聲明，能否排除管轄？", "俄羅斯在專屬經濟海域登臨、扣押外國船舶有無公約依據？", "俄羅斯不遵從臨時措施、拒絕出庭的法律後果？"], "holding": ["國際海洋法法庭（2013年11月22日）：命俄羅斯在荷蘭提供360萬歐元銀行擔保後，釋放船舶及船上所有人員並准其離境。", "管轄權判斷（2014年11月26日）：俄羅斯的聲明只能在第298條第1項(b)款允許的範圍內生效，即依第297條第2、3項排除的漁業與海洋科學研究執法；本案不屬之，仲裁庭有管轄權。一方不出庭不妨礙程序（附件七第9條）。", "實體判斷（2015年8月14日）：沿海國對專屬經濟海域內人工設施周圍的安全地帶可採合理措施，但本案登臨、扣押船舶與拘禁人員，不符第60條、緊追權（第111條）或其他公約依據，侵害荷蘭作為船旗國的航行自由與專屬管轄；俄羅斯未遵從國際海洋法法庭的臨時措施，也違反第290條第6項與第296條。", "賠償判斷（2017年7月10日）：俄羅斯應賠償荷蘭約540萬歐元及利息。"], "significance": "考點：①第298條聲明只能在條文允許的範圍內排除管轄，不能自行擴大；②不出庭不影響附件七仲裁進行（附件七第9條），他方未指派仲裁員時由國際海洋法法庭庭長代為指派（附件七第3條）；③臨時措施具拘束力（第290條第6項）；④專屬經濟海域內的抗議活動仍屬航行自由範圍，沿海國執法須有公約依據且合乎比例。", "articles": ["unclos-287", "unclos-290", "unclos-298", "unclos-a7-3", "unclos-a7-9"], "exam": [], "srcUrl": "https://pca-cpa.org/en/cases/21/", "verified": "2026-10-07"});

ARTICLES.push({"treaty": "unclos", "no": "192", "heading": "一般義務", "tier": "A", "paras": [{"n": "", "en": "States have the obligation to protect and preserve the marine environment.", "zh": "各國有保護和保全海洋環境的義務。"}], "keys": ["各國有保護和保全海洋環境的義務"], "plain": "第十二部分的總綱，只有一句話，卻是整部分最常被引用的條文。①義務主體是「各國」，不限沿海國；②空間上及於所有海域，包括國家管轄範圍以外的公海與「區域」；③「保護」指防止未來的損害，「保全」指維持甚至改善海洋環境的現狀。[[case|south-china-sea|南海仲裁案]]（2016）指出，本條同時包含積極義務（採取措施保護海洋環境）與消極義務（不使海洋環境惡化），其內容須參照第十二部分其他條文及國際環境法的相關規則來具體化。[[case|itlos-climate|國際海洋法法庭2024年氣候變遷諮詢意見]]進一步認為，本條涵蓋保護海洋環境免受氣候變遷衝擊與海洋酸化，必要時並須恢復已退化的海洋棲地；[[case|icj-climate|國際法院2025年氣候變遷諮詢意見]]也採相同見解。", "elements": [{"req": ["國家（不限沿海國）", "任何海域的海洋環境"], "effect": "負有保護（防止損害）與保全（維持、改善）海洋環境的一般義務"}], "traps": ["陷阱：本條的義務主體是「各國」，不是只有沿海國；也不限於本國管轄海域。", "陷阱：本條雖然抽象，仍是有拘束力的法律義務；南海仲裁案即據以認定中國違約（大規模填海造陸、縱容捕撈瀕危物種）。", "陷阱：第193條的開發資源主權權利，須「按照」本條的保護義務行使，兩者不是並列無先後。"], "custom": {"status": "部分", "note": "防止跨界環境損害的一般義務已屬習慣法（特雷爾冶煉廠仲裁案、核武合法性諮詢意見）；本條把義務擴及所有海域，包括國家管轄範圍以外地區。", "cases": []}, "related": ["unclos-1", "unclos-193", "unclos-194", "unclos-235", "unclos-237"], "cases": [{"id": "south-china-sea", "point": "本條包含積極與消極義務；中國在南沙大規模填海造陸，並縱容捕撈硨磲貝、海龜等，違反第192條與第194條第5項。"}, {"id": "itlos-climate", "point": "本條涵蓋保護海洋環境免受氣候變遷衝擊與海洋酸化，必要時須恢復退化的海洋棲地。"}, {"id": "icj-climate", "point": "國際法院援引國際海洋法法庭見解，確認第192條要求各國保護海洋環境免受人為溫室氣體排放的不利影響。"}], "roc": "我國1998年《中華民國專屬經濟海域及大陸礁層法》與2000年《海洋污染防治法》都以保護海洋環境為目的；海洋污染防治的主管機關自2018年起為海洋委員會（海洋保育署）。", "essay": "一般義務：「公約第192條規定各國有保護和保全海洋環境的義務，義務主體不限沿海國、範圍及於所有海域。南海仲裁案指出本條兼含積極與消極義務；國際海洋法法庭2024年諮詢意見並認為本條涵蓋氣候變遷與海洋酸化的衝擊。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "193", "heading": "各國開發其自然資源的主權權利", "tier": "B", "paras": [{"n": "", "en": "States have the sovereign right to exploit their natural resources pursuant to their environmental policies and in accordance with their duty to protect and preserve the marine environment.", "zh": "各國有依據其環境政策和按照其保護和保全海洋環境的職責開發其自然資源的主權權利。"}], "keys": ["開發其自然資源的主權權利"], "plain": "各國有權依自己的環境政策開發自然資源，但必須「按照」保護和保全海洋環境的職責行使。本條是1972年《斯德哥爾摩人類環境宣言》原則21（1992年《里約宣言》原則2）在海洋法上的翻版：資源主權與不損害環境的責任一體兩面。考試重點在於「主權權利受第192條義務限制」，不是可以優先於環境保護的絕對權利。", "elements": [{"req": ["國家依其環境政策開發其自然資源"], "effect": "享有主權權利，但須按照其保護和保全海洋環境的職責行使"}], "traps": ["陷阱：本條的開發權利須「按照」保護和保全海洋環境的職責行使，不能以資源主權為由排除第192條。"], "custom": {"status": "習慣法", "note": "資源永久主權與不損害他國或國家管轄範圍外環境的責任並列，見斯德哥爾摩宣言原則21、里約宣言原則2；國際法院在核武合法性諮詢意見（1996）確認後者屬一般國際法。", "cases": []}, "related": ["unclos-192", "unclos-56", "unclos-77"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）條文標題「各國開發其自然環境的主權權利」依英文作準本（natural resources）更正為「各國開發其自然資源的主權權利」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "194", "heading": "防止、減少和控制海洋環境污染的措施", "tier": "A", "paras": [{"n": "1", "en": "States shall take, individually or jointly as appropriate, all measures consistent with this Convention that are necessary to prevent, reduce and control pollution of the marine environment from any source, using for this purpose the best practicable means at their disposal and in accordance with their capabilities, and they shall endeavour to harmonize their policies in this connection.", "zh": "各國應在適當情形下個別或聯合地採取一切符合本公約的必要措施，防止、減少和控制任何來源的海洋環境污染，為此目的，按照其能力使用其所掌握的最切實可行的方法，並應在這方面盡力協調它們的政策。"}, {"n": "2", "en": "States shall take all measures necessary to ensure that activities under their jurisdiction or control are so conducted as not to cause damage by pollution to other States and their environment, and that pollution arising from incidents or activities under their jurisdiction or control does not spread beyond the areas where they exercise sovereign rights in accordance with this Convention.", "zh": "各國應採取一切必要措施，確保在其管轄或控制下的活動的進行不致使其他國家及其環境遭受污染的損害，並確保在其管轄或控制範圍內的事件或活動所造成的污染不致擴大到其按照本公約行使主權權利的區域之外。"}, {"n": "3", "en": "The measures taken pursuant to this Part shall deal with all sources of pollution of the marine environment. These measures shall include, inter alia, those designed to minimize to the fullest possible extent:\n(a) the release of toxic, harmful or noxious substances, especially those which are persistent, from land-based sources, from or through the atmosphere or by dumping;\n(b) pollution from vessels, in particular measures for preventing accidents and dealing with emergencies, ensuring the safety of operations at sea, preventing intentional and unintentional discharges, and regulating the design, construction, equipment, operation and manning of vessels;\n(c) pollution from installations and devices used in exploration or exploitation of the natural resources of the seabed and subsoil, in particular measures for preventing accidents and dealing with emergencies, ensuring the safety of operations at sea, and regulating the design, construction, equipment, operation and manning of such installations or devices;\n(d) pollution from other installations and devices operating in the marine environment, in particular measures for preventing accidents and dealing with emergencies, ensuring the safety of operations at sea, and regulating the design, construction, equipment, operation and manning of such installations or devices.", "zh": "依據本部份採取的措施，應針對海洋環境的一切污染來源。這些措施，除其他外，應包括旨在在最大可能範圍內盡量減少下列污染的措施：\n(a)從陸上來源、從大氣層或通過大氣層或由於傾倒而放出的有毒、有害或有礙健康的物質，特別是持久不變的物質；\n(b)來自船隻的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，防止故意和無意的排放，以及規定船隻的設計、建造、裝備、操作和人員配備的措施；\n(c)來自用於勘探或開發海床和底土的自然資源的設施和裝置的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，以及規定這些設施或裝置的設計、建造、裝備、操作和人員配備的措施；\n(d)來自在海洋環境內操作的其他設施和裝置的污染，特別是為了防止意外事件和處理緊急情況，保證海上操作安全，以及規定這些設施或裝置的設計、建造、裝備、操作和人員配備的措施。"}, {"n": "4", "en": "In taking measures to prevent, reduce or control pollution of the marine environment, States shall refrain from unjustifiable interference with activities carried out by other States in the exercise of their rights and in pursuance of their duties in conformity with this Convention.", "zh": "各國採取措施防止、減少或控制海洋環境的污染時，不應對其他國家依照本公約行使其權利並履行其義務所進行的活動有不當的干擾。"}, {"n": "5", "en": "The measures taken in accordance with this Part shall include those necessary to protect and preserve rare or fragile ecosystems as well as the habitat of depleted, threatened or endangered species and other forms of marine life.", "zh": "按照本部份採取的措施，應包括為保護和保全稀有或脆弱的生態系統，以及衰竭、受威脅或有滅絕危險的物種和其他形式的海洋生物的生存環境，而有必要的措施。"}], "keys": ["防止、減少和控制任何來源的海洋環境污染", "不致使其他國家及其環境遭受污染的損害", "保護和保全稀有或脆弱的生態系統"], "plain": "把第192條的一般義務具體化，五項分別是：①各國應依其能力，採取「一切必要措施」防止、減少和控制「任何來源」的{{海洋環境污染}}，並盡力協調政策；②確保管轄或控制下的活動不使他國遭受污染損害，污染也不擴散到本國行使主權權利的區域以外——這是國際環境法「不損害原則」（特雷爾冶煉廠仲裁案）在海洋上的條文化；③措施應涵蓋一切污染來源，並列舉陸源與大氣、船舶、海底設施、其他設施四類（第207至212條分別規範）；④採取措施時不得不當干擾他國依公約行使權利；⑤措施應包括保護稀有或脆弱的生態系統，以及瀕危物種的棲地。[[case|itlos-climate|國際海洋法法庭2024年諮詢意見]]認為第1項是行為義務而非結果義務，但須盡「嚴格」的{{相當注意義務}}；因溫室氣體排放的損害嚴重且不可逆，注意標準更高，而且僅遵守《巴黎協定》不足以滿足本條義務。", "elements": [{"req": ["任何來源的海洋環境污染", "國家依其能力"], "effect": "應採取一切必要措施防止、減少和控制（行為義務，須盡相當注意）"}, {"req": ["國家管轄或控制下的活動"], "effect": "應確保不致使其他國家及其環境遭受污染損害，污染不擴散至本國主權權利範圍以外"}, {"req": ["稀有或脆弱的生態系統、瀕危物種的棲地"], "effect": "採取的措施應包括必要的保護措施"}], "traps": ["陷阱：第1項是「行為義務」（盡相當注意），不是保證絕不發生污染的「結果義務」；但國際海洋法法庭2024年認為對溫室氣體排放須盡嚴格的注意。", "陷阱：「任何來源」包括陸源污染，不限船舶污染。", "陷阱：第2項的不損害原則對應gl112a_14的「善鄰原則」；不是預防原則（precautionary principle），也不是污染者付費原則。", "陷阱：第5項保護脆弱生態系統的措施，即使是在本國管轄海域內也適用（南海仲裁案認定中國違反本項）。"], "custom": {"status": "部分", "note": "第2項反映習慣法上的不損害原則與防止跨界損害義務（特雷爾冶煉廠仲裁案、核武合法性諮詢意見、紙漿廠案）。", "cases": ["pulp-mills"]}, "related": ["unclos-1", "unclos-192", "unclos-195", "unclos-206", "unclos-207", "unclos-211", "unclos-212"], "cases": [{"id": "south-china-sea", "point": "中國在南沙大規模填海造陸破壞珊瑚礁，並容許漁民以破壞性方式捕撈硨磲貝等瀕危物種，違反第192條與第194條第5項。"}, {"id": "itlos-climate", "point": "人為溫室氣體排放屬海洋環境污染；第1項要求採取一切必要措施減排，屬須盡嚴格相當注意的行為義務，遵守《巴黎協定》不當然足夠。"}, {"id": "icj-climate", "point": "國際法院援引並肯定國際海洋法法庭對第194條的解釋。"}], "roc": "", "essay": "防止污染的措施：「第194條要求各國採取一切必要措施，防止、減少和控制任何來源的海洋環境污染（第1項），確保管轄下活動不致對他國造成污染損害（第2項，即不損害原則），並保護稀有或脆弱的生態系統（第5項）。此係須盡相當注意的行為義務；國際海洋法法庭2024年諮詢意見認為，溫室氣體排放造成的損害嚴重且不可逆，注意標準更為嚴格。」", "exam": [{"qid": "gl112a_14", "note": "題幹所述「確保管轄或控制範圍內的活動不損害他國或國家管轄範圍外的環境」即不損害（善鄰）原則；本條第2項是此原則在海洋環境的條文化。正解A。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「操作船和人員配備」依英文作準本及上下文更正為「操作和人員配備」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "195", "heading": "不將損害或危險轉移或將一種污染轉變成另一種污染的義務", "tier": "B", "paras": [{"n": "", "en": "In taking measures to prevent, reduce and control pollution of the marine environment, States shall act so as not to transfer, directly or indirectly, damage or hazards from one area to another or transform one type of pollution into another.", "zh": "各國在採取措施防止、減少和控制海洋環境的污染時採取的行動不應直接或間接將損害或危險從一個區域轉移到另一個區域，或將一種污染轉變成另一種污染。"}], "keys": ["不應直接或間接將損害或危險從一個區域轉移到另一個區域"], "plain": "防治污染不能「搬家」或「換形式」：不得把損害或危險從一個區域移到另一個區域，也不得把一種污染轉成另一種污染。例如為避免港口污染而改在公海排放廢水，或把海上傾倒改成海上焚化，造成大氣污染後再回到海洋，都違反本條精神。", "elements": [{"req": ["國家採取防止、減少和控制海洋環境污染的措施"], "effect": "不得直接或間接轉移損害或危險至其他區域，也不得將一種污染轉變成另一種污染"}], "traps": [], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-194", "unclos-210"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "197", "heading": "在全球性或區域性的基礎上的合作", "tier": "B", "paras": [{"n": "", "en": "States shall cooperate on a global basis and, as appropriate, on a regional basis, directly or through competent international organizations, in formulating and elaborating international rules, standards and recommended practices and procedures consistent with this Convention, for the protection and preservation of the marine environment, taking into account characteristic regional features.", "zh": "各國在為保護和保全海洋環境而擬訂和制訂符合本公約的國際規則、標準和建議的辦法及程序時，應在全球性的基礎上或在區域性的基礎上，直接或通過主管國際組織進行合作，同時考慮到區域的特點。"}], "keys": ["應在全球性的基礎上或在區域性的基礎上，直接或通過主管國際組織進行合作"], "plain": "各國應在全球或區域層級，直接或透過主管國際組織合作，制定保護海洋環境的國際規則、標準與建議辦法，並考慮區域特點。實際成果如國際海事組織（IMO）主導的《防止船舶污染國際公約》（MARPOL）、1972年《倫敦傾倒公約》，以及聯合國環境規劃署的區域海洋計畫。國際海洋法法庭在MOX工廠案臨時措施命令（2001）中稱合作義務是第十二部分與一般國際法防止海洋污染的「基本原則」；2024年氣候變遷諮詢意見也強調，合作義務是持續性的，各國須善意參與。", "elements": [{"req": ["制定保護和保全海洋環境的國際規則、標準與建議辦法"], "effect": "各國應在全球性或區域性基礎上，直接或通過主管國際組織合作"}], "traps": ["陷阱：合作義務是有拘束力的法律義務（國際海洋法法庭稱為基本原則），不只是政治宣示。"], "custom": {"status": "部分", "note": "國際海洋法法庭在MOX工廠案（2001）稱合作義務為一般國際法上防止海洋環境污染的基本原則。", "cases": []}, "related": ["unclos-192", "unclos-198", "unclos-199", "unclos-207", "unclos-211"], "cases": [{"id": "itlos-climate", "point": "合作義務是持續性義務，各國須直接或透過主管國際組織善意合作，以防止、減少和控制溫室氣體排放造成的海洋污染。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "198", "heading": "即將發生的損害或實際損害的通知", "tier": "B", "paras": [{"n": "", "en": "When a State becomes aware of cases in which the marine environment is in imminent danger of being damaged or has been damaged by pollution, it shall immediately notify other States it deems likely to be affected by such damage, as well as the competent international organizations.", "zh": "當一國得知海洋環境有即將遭受污染損害的迫切危險或已經遭受污染損害的情況時，應立即通知其認為可能受這種損害影響的其他國家以及各主管國際組織。"}], "keys": ["應立即通知其認為可能受這種損害影響的其他國家"], "plain": "一國一旦得知海洋環境即將或已經遭受污染損害，應「立即」通知可能受影響的國家與主管國際組織。通知義務是預防損害擴大的程序性義務，與習慣法上的通知與警告義務一脈相承——[[case|corfu|科孚海峽案]]（1949）中，國際法院即以「基本人道考量」為由，認定阿爾巴尼亞應將領海內的水雷危險通知過往船舶。", "elements": [{"req": ["一國得知海洋環境有即將遭受污染損害的迫切危險，或已經遭受污染損害"], "effect": "應立即通知可能受影響的其他國家與各主管國際組織"}], "traps": ["陷阱：通知對象包括「主管國際組織」，不限於可能受影響的國家。"], "custom": {"status": "習慣法", "note": "緊急情況下的通知與警告義務屬一般國際法（科孚海峽案、里約宣言原則18）。", "cases": []}, "related": ["unclos-197", "unclos-199", "unclos-211"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）本條「其他國家以公及」依英文作準本及上下文更正為「其他國家以及」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "199", "heading": "對污染的應急計劃", "tier": "B", "paras": [{"n": "", "en": "In the cases referred to in article 198, States in the area affected, in accordance with their capabilities, and the competent international organizations shall cooperate, to the extent possible, in eliminating the effects of pollution and preventing or minimizing the damage. To this end, States shall jointly develop and promote contingency plans for responding to pollution incidents in the marine environment.", "zh": "在第一百九十八條所指的情形下，受影響區域的各國，應按照其能力，與各主管國際組織盡可能進行合作，以消除污染的影響並防止或盡量減少損害。為此目的，各國應共同發展和促進各種應急計劃，以應付海洋環境的污染事故。"}], "keys": ["應共同發展和促進各種應急計劃"], "plain": "接續第198條：受影響區域的國家應依其能力，與主管國際組織合作消除污染影響、減少損害，並應共同發展應急計畫，以應付海洋污染事故。實務上的條約化成果是1990年《油污防備、應變與合作國際公約》（OPRC）。", "elements": [{"req": ["第198條所指的污染損害情形"], "effect": "受影響區域的國家應合作消除污染影響，並共同發展應急計畫"}], "traps": [], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-197", "unclos-198"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "204", "heading": "對污染危險或影響的監測", "tier": "B", "paras": [{"n": "1", "en": "States shall, consistent with the rights of other States, endeavour, as far as practicable, directly or through the competent international organizations, to observe, measure, evaluate and analyse, by recognized scientific methods, the risks or effects of pollution of the marine environment.", "zh": "各國應在符合其他國家權利的情形下，在實際可行範圍內，盡力直接或通過各主管國際組織，用公認的科學方法觀測、測算、估計和分析海洋環境污染的危險或影響。"}, {"n": "2", "en": "In particular, States shall keep under surveillance the effects of any activities which they permit or in which they engage in order to determine whether these activities are likely to pollute the marine environment.", "zh": "各國特別應不斷監視其所准許或從事的任何活動的影響，以便確定這些活動是否可能污染海洋環境。"}], "keys": ["用公認的科學方法觀測、測算、估計和分析海洋環境污染的危險或影響", "不斷監視其所准許或從事的任何活動的影響"], "plain": "各國應盡力用公認的科學方法，觀測、評估海洋污染的危險或影響（第1項），尤其應持續監視自己准許或從事的活動，判斷是否可能污染海洋（第2項）。監測結果須依第205條提出報告。監測是環境影響評估（第206條）的延續：[[case|pulp-mills|紙漿廠案]]指出，計畫開始運作後仍須在整個存續期間持續監測其環境影響。", "elements": [{"req": ["國家准許或從事的活動"], "effect": "應持續監視其影響，以判斷是否可能污染海洋環境"}], "traps": ["陷阱：第2項是對本國准許或從事活動的持續監視義務，不是一次性的事前評估（事前評估規定在第206條）。"], "custom": {"status": "不適用", "note": "條約規定；持續監測的要求亦見紙漿廠案。", "cases": []}, "related": ["unclos-206", "unclos-194"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}, {"date": "2026-10-07", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「直接或通過和主管國際組織」依英文作準本及上下文更正為「直接或通過各主管國際組織」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "206", "heading": "對各種活動的可能影響的評價", "tier": "A", "paras": [{"n": "", "en": "When States have reasonable grounds for believing that planned activities under their jurisdiction or control may cause substantial pollution of or significant and harmful changes to the marine environment, they shall, as far as practicable, assess the potential effects of such activities on the marine environment and shall communicate reports of the results of such assessments in the manner provided in article 205.", "zh": "各國如有合理根據認為在其管轄或控制下的計劃中的活動可能對海洋環境造成重大污染或重大和有害的變化，應在實際可行範圍內，就這種活動對海洋環境的可能影響作出評價，並應依照第二百零五條規定的方式提送這些評價結果的報告。"}], "keys": ["就這種活動對海洋環境的可能影響作出評價", "依照第二百零五條規定的方式提送這些評價結果的報告"], "plain": "這就是{{環境影響評估}}在海洋法公約的依據。要件：國家有合理根據認為，其管轄或控制下「計畫中」的活動，可能造成重大污染或重大有害變化。效果：①應在實際可行範圍內事前評估；②應依第205條把評估結果報告提送主管國際組織。[[case|pulp-mills|紙漿廠案]]（2010）確認，可能造成重大跨界損害的工業活動須先做環境影響評估，已是一般國際法上的要求，但評估的範圍與內容由各國國內法決定。[[case|south-china-sea|南海仲裁案]]中，中國稱曾就南沙填海進行環境評估，卻未提出任何報告，仲裁庭認定中國違反本條的報告義務。國際海洋法法庭2024年諮詢意見則指出，可能造成溫室氣體污染的計畫活動，也應進行本條的評估。", "elements": [{"req": ["國家管轄或控制下計畫中的活動", "有合理根據認為可能造成重大污染或重大和有害的變化"], "effect": "應在實際可行範圍內評估可能影響，並依第205條提送評估報告"}], "traps": ["陷阱：評估對象是「計畫中」的活動，須在決定核准前進行；活動開始後的持續監視規定在第204條。", "陷阱：本條除了「評估」，還有「報告」義務；南海仲裁案認定中國違反的是未提出評估報告。", "陷阱：紙漿廠案確認環境影響評估是一般國際法上的義務（gl114a_13選項C正確），但其內容與範圍由各國自行決定。"], "custom": {"status": "習慣法", "note": "紙漿廠案（2010）確認，可能造成重大跨界損害的工業活動須進行環境影響評估，屬一般國際法上的要求。", "cases": ["pulp-mills"]}, "related": ["unclos-204", "unclos-194", "unclos-192"], "cases": [{"id": "pulp-mills", "point": "可能造成重大跨界損害的工業活動，須事前進行環境影響評估，已屬一般國際法上的要求；評估內容由國內法決定，計畫開始後須持續監測。"}, {"id": "south-china-sea", "point": "中國未就南沙大規模填海造陸提出環境影響評估報告，違反第206條。"}, {"id": "itlos-climate", "point": "可能造成溫室氣體污染的計畫活動，也須依本條進行環境影響評估。"}], "roc": "我國《環境影響評估法》（1994）規定開發行為應實施環境影響評估，海域內的開發（例如離岸風電）也適用。", "essay": "環境影響評估：「第206條要求各國對管轄或控制下可能造成重大污染的計畫活動進行評估，並依第205條提出報告。國際法院在紙漿廠案（2010）確認環境影響評估已屬一般國際法上的義務；南海仲裁案則認定中國未提出填海造陸的評估報告，違反本條。」", "exam": [{"qid": "gl114a_13", "note": "選項C「要求進行環境影響評估已為2010年 ARTICLES.push({"treaty": "unclos", "no": "207", "heading": "陸地來源的污染", "tier": "A", "paras": [{"n": "1", "en": "States shall adopt laws and regulations to prevent, reduce and control pollution of the marine environment from land-based sources, including rivers, estuaries, pipelines and outfall structures, taking into account internationally agreed rules, standards and recommended practices and procedures.", "zh": "各國應制定法律和規章，以防止、減少和控制陸地來源，包括河流、河口灣、管道和排水口結構對海洋環境的污染，同時考慮到國際上議定的規則、標準和建議的辦法及程序。"}, {"n": "2", "en": "States shall take other measures as may be necessary to prevent, reduce and control such pollution.", "zh": "各國應採取其他可能必要的措施，以防止、減少和控制這種污染。"}, {"n": "3", "en": "States shall endeavour to harmonize their policies in this connection at the appropriate regional level.", "zh": "各國應盡力在適當的區域一級協調其在這方面的政策。"}, {"n": "4", "en": "States, acting especially through competent international organizations or diplomatic conference, shall endeavour to establish global and regional rules, standards and recommended practices and procedures to prevent, reduce and control pollution of the marine environment from land-based sources, taking into account characteristic regional features, the economic capacity of developing States and their need for economic development. Such rules, standards and recommended practices and procedures shall be re-examined from time to time as necessary.", "zh": "各國特別應通過主管國際組織或外交會議採取行動，盡力制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制這種污染，同時考慮到區域的特點，發展中國家的經濟能力及其經濟發展的需要。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。"}, {"n": "5", "en": "Laws, regulations, measures, rules, standards and recommended practices and procedures referred to in paragraphs 1, 2 and 4 shall include those designed to minimize, to the fullest extent possible, the release of toxic, harmful or noxious substances, especially those which are persistent, into the marine environment.", "zh": "第一、第二和第四款提及的法律、規章、措施、規則、標準和建議的辦法及程序，應包括旨在在最大可能範圍內盡量減少有毒、有害或有礙健康的物質，特別是持久不變的物質，排放到海洋環境的各種規定。"}], "keys": ["防止、減少和控制陸地來源，包括河流、河口灣、管道和排水口結構對海洋環境的污染", "同時考慮到國際上議定的規則、標準和建議的辦法及程序"], "plain": "{{陸源污染}}指來自陸地、經河流、河口、管道與排水口進入海洋的污染，是海洋污染的最大來源，塑膠垃圾、農業逕流、工業廢水多屬此類。本條要求：①各國制定法律和規章防治陸源污染，但只需「考慮到」國際規則與標準；②採取其他必要措施；③在區域層級協調政策；④透過國際組織或外交會議盡力制定全球及區域規則，並考慮發展中國家的經濟能力與發展需要；⑤盡量減少有毒、有害物質的排放。與船舶污染（第211條）相比，陸源污染的國際約束最弱，因為它直接涉及各國的經濟活動與領土主權；至今沒有全球性的陸源污染公約，主要靠區域公約與1995年《保護海洋環境免受陸上活動污染全球行動綱領》。塑膠污染是典型的陸源污染，聯合國環境大會2022年第5/14號決議啟動具法律拘束力文書的談判。", "elements": [{"req": ["陸地來源（含河流、河口灣、管道與排水口結構）造成的海洋環境污染"], "effect": "應制定法律和規章防治，同時「考慮到」國際上議定的規則與標準"}, {"req": ["全球及區域規則的制定"], "effect": "應盡力透過主管國際組織或外交會議制定，並考慮區域特點、發展中國家的經濟能力與發展需要"}], "traps": ["陷阱：陸源污染的國內法只需「考慮到」國際規則，不像船舶污染（第211條第2項）要求「至少具有相同效力」，也不像海底活動（第208條第3項）要求「不低於」國際標準。", "陷阱：塑膠污染主要屬陸源污染，依第207條處理，不是傾倒（第210條）。", "陷阱：國際海洋法法庭2024年諮詢意見認為，人為溫室氣體排放可能同時屬於陸源污染（第207條）與經由大氣的污染（第212條）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-194", "unclos-212", "unclos-213", "unclos-192", "unclos-197"], "cases": [{"id": "itlos-climate", "point": "人為溫室氣體排放可視為陸源污染與經由大氣的污染，各國應依第207、212條制定法律規章並執行。"}], "roc": "我國《海洋污染防治法》規範陸上污染源排放廢（污）水入海；限塑政策（購物用塑膠袋、一次用塑膠吸管限制等）由環境部推動。", "essay": "陸源污染與塑膠：「塑膠污染主要來自陸地，屬第207條的陸源污染。各國應制定法律規章並考慮國際規則與標準（第1項），在區域層級協調（第3項），並透過國際組織制定全球與區域規則（第4項）。但本條只要求『考慮』國際規則，約束力弱於船舶污染，因此聯合國環境大會第5/14號決議啟動具拘束力的塑膠公約談判。」", "exam": [], "news": [{"text": "全球塑膠公約談判：聯合國環境大會2022年第5/14號決議設立政府間談判委員會（INC）。2024年釜山（INC-5）與2025年8月日內瓦（INC-5.2）兩次會議均未達成協議；2026年2月7日INC-5.3在日內瓦選出智利籍大使科達諾（Julio Cordano）為新任主席，實質談判預定於後續會議恢復。", "checked": "2026-10-07"}], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-2批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "208", "heading": "國家管轄的海底活動造成的污染", "tier": "B", "paras": [{"n": "1", "en": "Coastal States shall adopt laws and regulations to prevent, reduce and control pollution of the marine environment arising from or in connection with seabed activities subject to their jurisdiction and from artificial islands, installations and structures under their jurisdiction, pursuant to articles 60 and 80.", "zh": "沿海國應制定法律和規章，以防止、減少和控制來自受其管轄的海底活動或與此種活動有關的對海洋環境的污染以及來自依據第六十和第八十條在其管轄下的人工島嶼、設施和結構對海洋環境的污染。"}, {"n": "2", "en": "States shall take other measures as may be necessary to prevent, reduce and control such pollution.", "zh": "各國應採取其他可能必要的措施，以防止、減少和控制這種污染。"}, {"n": "3", "en": "Such laws, regulations and measures shall be no less effective than international rules, standards and recommended practices and procedures.", "zh": "這種法律、規章和措施的效力應不低於國際規則、標準和建議的辦法及程序。"}, {"n": "4", "en": "States shall endeavour to harmonize their policies in this connection at the appropriate regional level.", "zh": "各國應盡力在適當的區域一級協調其在這方面的政策。"}, {"n": "5", "en": "States, acting especially through competent international organizations or diplomatic conference, shall establish global and regional rules, standards and recommended practices and procedures to prevent, reduce and control pollution of the marine environment referred to in paragraph 1. Such rules, standards and recommended practices and procedures shall be re-examined from time to time as necessary.", "zh": "各國特別應通過主管國際組織或外交會議採取行動，制訂全球性和區域性規則、標準和建議的辦法及程序，以防止、減少和控制第一款所指的海洋環境污染。這種規則、標準和建議的辦法及程序應根據需要隨時重新審查。"}], "keys": ["這種法律、規章和措施的效力應不低於國際規則、標準和建議的辦法及程序"], "plain": "沿海國應制定法律規章，防治其管轄下的海底活動（例如大陸礁層上的油氣開採），以及依第60、80條在其管轄下的人工島嶼、設施和結構所造成的污染（第1項）。重點在第3項：這些國內法、規章和措施的效力「不得低於」國際規則與標準，即國際標準是最低門檻。", "elements": [{"req": ["沿海國管轄下的海底活動，或其管轄下的人工島嶼、設施和結構"], "effect": "沿海國應制定法律規章防治污染，效力不得低於國際規則、標準"}], "traps": ["陷阱：義務主體是「沿海國」；效力標準是「不低於」國際規則，比陸源污染（只需考慮）嚴格。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": [
