ARTICLES.push({"treaty": "unclos", "no": "86", "heading": "公海的範圍（本部分規定的適用）", "tier": "A", "paras": [{"n": "", "en": "The provisions of this Part apply to all parts of the sea that are not included in the exclusive economic zone, in the territorial sea or in the internal waters of a State, or in the archipelagic waters of an archipelagic State. This article does not entail any abridgement of the freedoms enjoyed by all States in the exclusive economic zone in accordance with article 58.", "zh": "本部份的規定適用於不包括在國家的專屬經濟區、領海或內水或群島國的群島水域內的全部海域。本條規定並不使各國按照第五十八條規定在專屬經濟區內所享有的自由受到任何減損。"}], "keys": ["不包括在國家的專屬經濟區、領海或內水或群島國的群島水域內的全部海域", "不使各國按照第五十八條規定在專屬經濟區內所享有的自由受到任何減損"], "plain": "{{公海}}採「排除法」定義：凡不屬於任何國家的內水、領海、專屬經濟海域，也不屬於群島國群島水域的海域，就適用第七部分的公海規定。因此公海的範圍取決於沿海國有沒有主張專屬經濟海域。1958年《公海公約》第1條把公海定義為領海以外的一切海域；本公約創設專屬經濟海域後，公海範圍大幅縮小。後半句提醒：專屬經濟海域雖然不是公海，各國依第58條在其中享有的航行、飛越等自由並不因此減少。", "elements": [{"req": ["不屬於內水、領海、專屬經濟海域", "不屬於群島水域"], "effect": "屬公海，適用第七部分規定"}, {"req": ["專屬經濟海域"], "effect": "不是公海，但各國依第58條享有的自由不受減損"}], "traps": ["陷阱：公海採排除式定義；專屬經濟海域不是公海（1958年公海公約時代則屬公海），但公海的航行、飛越自由與第88至115條，依第58條仍適用於專屬經濟海域。", "陷阱：大陸礁層不在排除名單中：200海里以外延伸大陸礁層的上覆水域仍是公海（第78條），沿海國只對海床和底土有權利。", "陷阱：公海指「水體」，「區域」指國家管轄範圍以外的「海床、洋底及其底土」（第1條），兩者分別適用第七部分與第十一部分。"], "custom": {"status": "習慣法", "note": "公海是國家主權以外海域的概念早已成為習慣法；其範圍隨專屬經濟海域被普遍接受而縮小。", "cases": []}, "related": ["unclos-55", "unclos-57", "unclos-58", "unclos-78", "unclos-87", "unclos-89", "unclos-1"], "cases": [], "roc": "我國依《中華民國專屬經濟海域及大陸礁層法》主張200海里專屬經濟海域，其外即為公海；我國遠洋漁船多在公海作業，須遵守區域漁業管理組織的規範。", "essay": "論公海的範圍：「依海洋法公約第86條，公海採排除式定義，指不包括在各國內水、領海、專屬經濟海域及群島水域內的全部海域。因專屬經濟海域制度的建立，公海範圍較1958年公海公約縮小，但各國在專屬經濟海域仍享有第58條所保障的航行與飛越自由。」", "exam": [], "news": [{"text": "《國家管轄範圍以外區域海洋生物多樣性養護和永續利用協定》（BBNJ協定，俗稱公海條約）於2023年6月通過，2025年9月達到60國批准門檻，2026年1月17日生效，處理公海與「區域」的海洋遺傳資源、公海保護區與環境影響評估。", "checked": "2026-10-06"}], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "87", "heading": "公海自由", "tier": "A", "paras": [{"n": "1", "en": "The high seas are open to all States, whether coastal or land-locked. Freedom of the high seas is exercised under the conditions laid down by this Convention and by other rules of international law. It comprises, inter alia, both for coastal and land-locked States:\n(a) freedom of navigation;\n(b) freedom of overflight;\n(c) freedom to lay submarine cables and pipelines, subject to Part VI;\n(d) freedom to construct artificial islands and other installations permitted under international law, subject to Part VI;\n(e) freedom of fishing, subject to the conditions laid down in section 2;\n(f) freedom of scientific research, subject to Parts VI and XIII.", "zh": "公海對所有國家開放，不論其為沿海國或內陸國。公海自由是在本公約和其他國際法規則所規定的條件下行使的。公海自由對沿海國和內陸國而言，除其他外，包括：\n(a)航行自由；\n(b)飛越自由；\n(c)鋪設海底電纜和管道的自由，但受第六部份的限制；\n(d)建造國際法所容許的人工島嶼和其他設施的自由，但受第六部份的限制；\n(e)捕魚自由，但受第二節規定條件的限制；\n(f)科學研究的自由，但受第六和第十三部份的限制。"}, {"n": "2", "en": "These freedoms shall be exercised by all States with due regard for the interests of other States in their exercise of the freedom of the high seas, and also with due regard for the rights under this Convention with respect to activities in the Area.", "zh": "這些自由應由所有國家行使，但須適當顧及其他國家行使公海自由的利益，並適當顧及本公約所規定的同「區域」內活動有關的權利。"}], "keys": ["公海對所有國家開放", "航行自由", "捕魚自由", "適當顧及其他國家行使公海自由的利益"], "plain": "公海對所有國家開放，沿海國與內陸國一律平等。第1項列舉六種{{公海自由}}：航行、飛越、鋪設海底電纜和管道、建造人工島嶼和其他設施、捕魚、科學研究；「除其他外」表示只是例示，其他合法用途也可能包括在內（例如海上軍事演習，一般認為屬公海自由）。後四種自由附有限制：電纜管道與人工島嶼受第六部分（大陸礁層）限制，捕魚受第二節養護規定限制，科研受第六、十三部分限制。各國行使時都須{{適當顧及}}其他國家的公海自由，以及「區域」內活動的權利（第2項）。", "elements": [{"req": ["所有國家（含內陸國）", "在公海"], "effect": "享有航行、飛越、鋪設電纜管道、建造人工島嶼、捕魚、科學研究等自由（例示）"}, {"req": ["行使公海自由"], "effect": "須適當顧及他國行使公海自由的利益，以及「區域」內活動的權利"}], "traps": ["陷阱：列舉是例示（inter alia），不是窮盡；1958年公海公約第2條只列航行、捕魚、鋪設電纜管道、飛越四種，建造人工島嶼與科學研究是本公約新增。", "陷阱：公海自由不是絕對的：捕魚受養護與合作義務限制（第116至120條），跨界與高度洄游魚群另有1995年《魚群協定》與區域漁業管理組織規範。", "陷阱：「適當顧及」是相互的義務，不是要求取得他國同意。"], "custom": {"status": "習慣法", "note": "公海自由是公認的習慣國際法，可追溯至格勞秀斯《海洋自由論》（1609）。", "cases": []}, "related": ["unclos-86", "unclos-88", "unclos-89", "unclos-90", "unclos-58", "unclos-112", "unclos-116", "unclos-136"], "cases": [], "roc": "我國遠洋漁業規模居世界前列；2016年制定的《遠洋漁業條例》要求漁船遵守區域漁業管理組織的養護管理措施，落實公海捕魚自由所附的養護義務。", "essay": "軍艦在公海的航行：「依第87條，公海對所有國家開放，各國享有航行與飛越自由，軍艦亦然；行使時須適當顧及他國利益（第2項），公海並應只用於和平目的（第88條）。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項(c)「鋪造海底電纜」依英文作準本（lay）及第58、79、112條用語更正為「鋪設」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "89", "heading": "對公海主權主張的無效", "tier": "A", "paras": [{"n": "", "en": "No State may validly purport to subject any part of the high seas to its sovereignty.", "zh": "任何國家不得有效地聲稱將公海的任何部分置於其主權之下。"}], "keys": ["不得有效地聲稱將公海的任何部分置於其主權之下"], "plain": "公海不屬於任何國家：任何國家都不能主張公海的任何部分屬其主權，即使實際占用或長期使用也一樣。這是公海自由的前提，也是公海成為「全球公域」的法律基礎。本條禁止的是「主權」主張；在公海上依公約行使特定管轄，例如船旗國管轄（第92條）、扣押海盜（第105條），並不違反本條。", "elements": [{"req": ["任何國家", "對公海任何部分"], "effect": "主權主張無效"}], "traps": ["陷阱：本條只禁止主權主張；船旗國管轄、普遍管轄等功能性管轄並不違反本條。", "陷阱：公海中因自然力形成的島嶼是陸地，國家可依先占取得主權（SG026選項B為正確敘述）；人工島嶼與設施則不能取得領土主權。", "陷阱：考題常把公海、「區域」、南極、外太空並列為「不屬國家領土」的地區（es114l_1）：依據分別是本條、第137條、南極條約第4條、外太空條約第2條。"], "custom": {"status": "習慣法", "note": "公海不得被據為己有，早在19世紀即成為習慣國際法。", "cases": []}, "related": ["unclos-86", "unclos-87", "unclos-92", "unclos-137", "unclos-2"], "cases": [], "roc": "", "essay": "不屬國家領土的地區：「公海不屬任何國家，依海洋法公約第89條，任何國家不得有效地聲稱將公海的任何部分置於其主權之下；各國在公海享有第87條的自由。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "91", "heading": "船舶的國籍", "tier": "A", "paras": [{"n": "1", "en": "Every State shall fix the conditions for the grant of its nationality to ships, for the registration of ships in its territory, and for the right to fly its flag. Ships have the nationality of the State whose flag they are entitled to fly. There must exist a genuine link between the State and the ship.", "zh": "每個國家應確定對船舶給予國籍、船舶在其領土內登記及船舶懸掛該國旗幟的權利的條件。船舶具有其有權懸掛的旗幟所屬國家的國籍。國家和船舶之間必須有真正聯繫。"}, {"n": "2", "en": "Every State shall issue to ships to which it has granted the right to fly its flag documents to that effect.", "zh": "每個國家應向其給予懸掛該國旗幟權利的船舶頒發給予該權利的文件。"}], "keys": ["船舶具有其有權懸掛的旗幟所屬國家的國籍", "國家和船舶之間必須有真正聯繫"], "plain": "每個國家自行決定給予船舶國籍、登記與懸掛國旗的條件；船舶的國籍，就是它有權懸掛的國旗所屬國家的國籍。條文要求國家與船舶之間要有{{真正聯繫}}，但沒有說明內容，也沒有規定欠缺時的效果。國際海洋法法庭在[[case|saiga-2|塞加號案（第2號）]]指出：真正聯繫的目的是確保船旗國能有效履行第94條的義務，不是讓其他國家據以否認船舶的登記或國籍。所以懸掛{{權宜船旗}}的船舶，仍然具有船旗國的國籍。", "elements": [{"req": ["各國"], "effect": "自行決定給予船舶國籍、登記與懸旗權利的條件"}, {"req": ["船舶有權懸掛某國旗幟"], "effect": "具有該國國籍"}, {"req": ["國家與船舶"], "effect": "須有真正聯繫（內容與欠缺的效果條文未規定）"}], "traps": ["陷阱：欠缺真正聯繫時，其他國家不得因此拒絕承認船舶國籍（塞加號案第2號）；有疑慮的國家應依第94條第6項通知船旗國調查。", "陷阱：權宜船旗（例如在巴拿馬、賴比瑞亞、馬紹爾群島登記）並不使船舶成為無國籍船舶；無國籍或視同無國籍見第92條第2項。", "陷阱：「真正聯繫」一詞令人聯想到國際法院諾特鮑姆案（1955）的自然人國籍，但該案的見解不能直接套用到船舶。"], "custom": {"status": "習慣法", "note": "國家自行決定船舶國籍條件與真正聯繫要求，已見於1958年公海公約第5條，屬習慣法。", "cases": []}, "related": ["unclos-90", "unclos-92", "unclos-94", "unclos-110"], "cases": [{"id": "saiga-2", "point": "法庭認為真正聯繫的目的在確保船旗國有效履行義務，不是他國據以拒絕承認船舶國籍的標準。"}], "roc": "我國《船舶法》規定我國籍船舶的條件與登記；我國人投資經營、懸掛外國旗幟的漁船（權宜船），另依2016年制定的《投資經營非我國籍漁船管理條例》管理。", "essay": "權宜船旗與真正聯繫：「第91條要求國家與船舶之間須有真正聯繫，但未定其內容與欠缺的效果。依塞加號案（第2號），真正聯繫旨在確保船旗國有效履行第94條的義務，他國不得據以拒絕承認船舶國籍，只能依第94條第6項通知船旗國。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "92", "heading": "船舶的地位（船旗國專屬管轄）", "tier": "A", "paras": [{"n": "1", "en": "Ships shall sail under the flag of one State only and, save in exceptional cases expressly provided for in international treaties or in this Convention, shall be subject to its exclusive jurisdiction on the high seas. A ship may not change its flag during a voyage or while in a port of call, save in the case of a real transfer of ownership or change of registry.", "zh": "船舶航行應僅懸掛一國的旗幟，而且除國際條約或本公約明文規定的例外情形外，在公海上應受該國的專屬管轄。除所有權確實轉移或變更登記的情形外，船舶在航程中或在停泊港內不得更換其旗幟。"}, {"n": "2", "en": "A ship which sails under the flags of two or more States, using them according to convenience, may not claim any of the nationalities in question with respect to any other State, and may be assimilated to a ship without nationality.", "zh": "懸掛兩國或兩國以上旗幟航行並視方便而換用旗幟的船舶，對任何其他國家不得主張其中的任一國籍，並可視同無國籍的船舶。"}], "keys": ["在公海上應受該國的專屬管轄", "可視同無國籍的船舶"], "plain": "船舶只能懸掛一國國旗，在公海上原則上只受船旗國管轄（{{船旗國專屬管轄}}），這是公海秩序的基石。例外必須有條約或本公約明文規定，例如海盜（第105條）、未經許可的廣播（第109條）、登臨權（第110條）、緊追權（第111條）。航程中或停泊港內不得更換國旗，除非所有權確實轉移或變更登記。視方便輪流懸掛兩國以上國旗的船舶，不能對任何國家主張其中任何國籍，並可被視為{{無國籍船舶}}，任何國家的軍艦都可依第110條登臨。", "elements": [{"req": ["船舶", "在公海上"], "effect": "原則上受船旗國專屬管轄；例外須條約或本公約明文"}, {"req": ["航程中或停泊港內", "無所有權確實轉移或變更登記"], "effect": "不得更換旗幟"}, {"req": ["懸掛兩國以上旗幟", "視方便換用"], "effect": "不得對他國主張任一國籍，可視同無國籍船舶"}], "traps": ["陷阱：專屬管轄限於「公海上」；船舶進入他國港口、內水或領海時，沿海國仍有屬地管轄。", "陷阱：雙重國旗船舶是「可」視同無國籍，不是自動喪失國籍。", "陷阱：常設國際法院蓮花號案（1927）承認受害船舶的船旗國也可審判肇事船員；碰撞事故現已改由第97條規範，只有船旗國或行為人國籍國可以追訴。"], "custom": {"status": "習慣法", "note": "公海上船旗國專屬管轄原則為習慣國際法，1958年公海公約第6條亦有相同規定。", "cases": []}, "related": ["unclos-91", "unclos-94", "unclos-97", "unclos-105", "unclos-110", "unclos-111", "unclos-58"], "cases": [], "roc": "我國《刑法》第3條規定，在中華民國領域外的中華民國船艦或航空器內犯罪者，以在中華民國領域內犯罪論，等同在國內法上落實船旗國管轄。", "essay": "郵輪案的船旗國管轄：「依第92條第1項，船舶在公海上受船旗國專屬管轄，故船籍國得對船上發生的犯罪主張管轄；但海盜屬本公約明文的例外，依第105條任何國家均可扣押並審判。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "94", "heading": "船旗國的義務", "tier": "B", "paras": [{"n": "1", "en": "Every State shall effectively exercise its jurisdiction and control in administrative, technical and social matters over ships flying its flag.", "zh": "每個國家應對懸掛該國旗幟的船舶有效地行使行政、技術及社會事項上的管轄和控制。"}, {"n": "2", "en": "In particular every State shall:\n(a) maintain a register of ships containing the names and particulars of ships flying its flag, except those which are excluded from generally accepted international regulations on account of their small size; and\n(b) assume jurisdiction under its internal law over each ship flying its flag and its master, officers and crew in respect of administrative, technical and social matters concerning the ship.", "zh": "每個國家特別應：\n(a)保持一本船舶登記冊，載列懸掛該國旗幟的船舶的名稱和詳細情況，但因體積過小而不在一般接受的國際規章規定範圍內的船舶除外；\n(b)根據其國內法，就有關每艘懸掛該國旗幟的船舶的行政、技術和社會事項，對該船及其船長、高級船員和船員行使管轄權。"}, {"n": "3", "en": "Every State shall take such measures for ships flying its flag as are necessary to ensure safety at sea with regard, inter alia, to:\n(a) the construction, equipment and seaworthiness of ships;\n(b) the manning of ships, labour conditions and the training of crews, taking into account the applicable international instruments;\n(c) the use of signals, the maintenance of communications and the prevention of collisions.", "zh": "每個國家對懸掛該國旗幟的船舶，除其他外，應就下列各項採取為保證海上安全所必要的措施：\n(a)船舶的構造、裝備和適航條件；\n(b)船舶的人員配備、船員的勞動條件和訓練，同時考慮到適用的國際文件；\n(c)信號的使用、通信的維持和碰撞的防止。"}, {"n": "4", "en": "Such measures shall include those necessary to ensure:\n(a) that each ship, before registration and thereafter at appropriate intervals, is surveyed by a qualified surveyor of ships, and has on board such charts, nautical publications and navigational equipment and instruments as are appropriate for the safe navigation of the ship;\n(b) that each ship is in the charge of a master and officers who possess appropriate qualifications, in particular in seamanship, navigation, communications and marine engineering, and that the crew is appropriate in qualification and numbers for the type, size, machinery and equipment of the ship;\n(c) that the master, officers and, to the extent appropriate, the crew are fully conversant with and required to observe the applicable international regulations concerning the safety of life at sea, the prevention of collisions, the prevention, reduction and control of marine pollution, and the maintenance of communications by radio.", "zh": "這種措施應包括為確保下列事項所必要的措施：\n(a)每艘船舶，在登記前及其後適當的間隔期間，受合格的船舶檢驗人的檢查，並在船上備有船舶安全航行所需要的海圖、航海出版物以及航行裝備和儀器；\n(b)每艘船舶都由具備適當資格，特別是具備航海術、航行、通信和海洋工程方面資格的船長和高級船員負責，而且船員的資格和人數與船舶種類、大小、機械和裝備都是相稱的；\n(c)船長、高級船員和在適當範圍內的船員，充分熟悉並須遵守關於海上生命安全，防止碰撞，防止、減少和控制海洋污染和維持無線電通信所適用的國際規章。"}, {"n": "5", "en": "In taking the measures called for in paragraphs 3 and 4 each State is required to conform to generally accepted international regulations, procedures and practices and to take any steps which may be necessary to secure their observance.", "zh": "每一國家採取第三和第四款要求的措施時，須遵守一般接受的國際規章、程序和慣例，並採取為保證這些規章、程序和慣例得到遵行所必要的任何步驟。"}, {"n": "6", "en": "A State which has clear grounds to believe that proper jurisdiction and control with respect to a ship have not been exercised may report the facts to the flag State. Upon receiving such a report, the flag State shall investigate the matter and, if appropriate, take any action necessary to remedy the situation.", "zh": "一個國家如有明確理由相信對某一船舶未行使適當的管轄和管制，可將這項事實通知船旗國。船旗國接到通知後，應對這一事項進行調查，並於適當時採取任何必要行動，以補救這種情況。"}, {"n": "7", "en": "Each State shall cause an inquiry to be held by or before a suitably qualified person or persons into every marine casualty or incident of navigation on the high seas involving a ship flying its flag and causing loss of life or serious injury to nationals of another State or serious damage to ships or installations of another State or to the marine environment. The flag State and the other State shall cooperate in the conduct of any inquiry held by that other State into any such marine casualty or incident of navigation.", "zh": "每一國家對於涉及懸掛該國旗幟的船舶在公海上因海難或航行事故對另一國國民造成死亡或嚴重傷害，或對另一國的船舶或設施、或海洋環境造成嚴重損害的每一事件，都應由適當的合格人士一人或數人或在有這種人士在場的情況下進行調查。對於該另一國就任何這種海難或航行事故進行的任何調查，船旗國應與該另一國合作。"}], "keys": ["有效地行使行政、技術及社會事項上的管轄和控制", "可將這項事實通知船旗國"], "plain": "{{船旗國}}給了船舶國籍，就要對它負責：對行政、技術與社會事項有效行使管轄和控制（第1項），包括保持船舶登記冊、對船長與船員行使管轄（第2項），確保船舶構造、適航、人員配備與訓練、通訊與避碰等海上安全措施（第3、4項），並遵守一般接受的國際規章（第5項，例如國際海事組織的《海上人命安全公約》、《防止船舶污染國際公約》）。其他國家有明確理由認為船旗國沒有善盡管轄時，可以通知船旗國，船旗國應調查並補救（第6項）。公海上發生造成他國國民傷亡或嚴重損害的海難，船旗國應進行調查（第7項）。本條可說是{{真正聯繫}}的實質內容。", "elements": [{"req": ["船旗國", "對懸掛其旗幟的船舶"], "effect": "有效行使行政、技術、社會事項的管轄與控制；保持登記冊並確保海上安全"}, {"req": ["他國有明確理由認為船旗國未善盡管轄"], "effect": "可通知船旗國，船旗國應調查並補救"}, {"req": ["公海海難或航行事故", "造成他國國民死傷或嚴重損害"], "effect": "船旗國應進行調查，並與該他國合作"}], "traps": ["陷阱：他國發現船旗國未盡義務時，公約給的救濟是「通知船旗國」（第6項），不是自行拒絕承認船舶國籍或登臨檢查。", "陷阱：第5項要求遵守「一般接受的國際規章」，通說認為藉此把國際海事組織的主要公約標準帶入，即使船旗國未批准該公約也須遵守。"], "custom": {"status": "部分", "note": "船旗國有效管轄的一般義務屬習慣法；具體技術標準來自國際海事組織的公約。", "cases": []}, "related": ["unclos-91", "unclos-92", "unclos-97", "unclos-98", "unclos-217"], "cases": [{"id": "saiga-2", "point": "法庭指出真正聯繫的目的在確保船旗國有效履行本條義務。"}], "roc": "歐盟於2015年10月因我國遠洋漁業監管不足（打擊非法、未報告及不受規範漁業不力），對我國發出「黃牌」警告；我國2016年制定遠洋漁業三法強化船旗國管理，歐盟於2019年6月解除黃牌。", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第2項(a)「國際規章定正範圍」、第4項(b)「資格得船長」「船員的資格和人類」，依英文作準本及上下文更正為「規定範圍」「資格的船長」「資格和人數」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "95", "heading": "公海上軍艦的豁免權", "tier": "A", "paras": [{"n": "", "en": "Warships on the high seas have complete immunity from the jurisdiction of any State other than the flag State.", "zh": "軍艦在公海上有不受船旗國以外任何其他國家管轄的完全豁免權。"}], "keys": ["完全豁免權"], "plain": "軍艦（定義見第29條）在公海上享有「完全」豁免：除船旗國外，任何國家都不能對它行使管轄，包括登臨、檢查、扣押或逮捕（第110條第1項明文排除）。在他國領海內，軍艦仍有豁免（第32條），但沿海國可要求不遵守其法令的軍艦離開（第30條）；軍艦造成的損害則由船旗國負國際責任（第31條）。", "elements": [{"req": ["軍艦", "在公海上"], "effect": "不受船旗國以外任何國家管轄（完全豁免）"}], "traps": ["陷阱：是「完全」豁免：他國軍艦不得對其行使登臨權（第110條第1項排除第95、96條船舶）。", "陷阱：豁免不等於不受國際法拘束：軍艦違法造成損害，由船旗國負國際責任（第31條）。", "陷阱：軍艦的船員叛變並控制船舶從事海盜時，視同私人船舶（第102條），不再受本條保護。", "延伸：阿根廷自由號案（國際海洋法法庭臨時措施命令，2012）：軍艦停泊在他國港口（內水）時，依一般國際法仍享有豁免，法庭命迦納釋放被扣押的阿根廷海軍訓練艦。"], "custom": {"status": "習慣法", "note": "軍艦豁免為公認的習慣國際法，1958年公海公約第8條亦有規定。", "cases": []}, "related": ["unclos-29", "unclos-30", "unclos-31", "unclos-32", "unclos-96", "unclos-102", "unclos-110"], "cases": [], "roc": "", "essay": "軍艦在公海的地位：「依第95條，軍艦在公海上有不受船旗國以外任何其他國家管轄的完全豁免權，他國不得登臨（第110條第1項）；其不法行為由船旗國負國際責任。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）「不受船旗國公以任何其他國家」依英文作準本（any State other than the flag State）及第96條用語更正為「不受船旗國以外任何其他國家」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "96", "heading": "專用於政府非商業性服務的船舶的豁免權", "tier": "B", "paras": [{"n": "", "en": "Ships owned or operated by a State and used only on government non-commercial service shall, on the high seas, have complete immunity from the jurisdiction of any State other than the flag State.", "zh": "由一國所有或經營並專用於政府非商業性服務的船舶，在公海上應有不受船旗國以外任何其他國家管轄的完全豁免權。"}], "keys": ["專用於政府非商業性服務的船舶"], "plain": "海巡船、緝私船、公務研究船等由國家所有或經營、並且專用於政府非商業性服務的船舶，在公海上和軍艦一樣享有完全豁免。關鍵在「非商業性」：國營航運公司的商船從事商業運輸，不享有本條豁免。", "elements": [{"req": ["國家所有或經營", "專用於政府非商業性服務", "在公海上"], "effect": "不受船旗國以外任何國家管轄（完全豁免）"}], "traps": ["陷阱：國有船舶從事商業服務，不享有豁免（限制豁免論）。", "陷阱：判斷重點是用途（政府非商業性服務），不只看所有權；國家「經營」的船舶也可能符合。"], "custom": {"status": "習慣法", "note": "政府非商業船舶豁免為習慣法，1958年公海公約第9條亦有規定。", "cases": []}, "related": ["unclos-95", "unclos-32", "unclos-110", "unclos-236"], "cases": [], "roc": "我國海巡署艦艇屬政府非商業性服務船舶；我國雖非締約方，本條規則屬習慣法，海巡艦艇在公海執行任務時亦得主張豁免。", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "97", "heading": "碰撞或其他航行事故的刑事管轄權", "tier": "A", "paras": [{"n": "1", "en": "In the event of a collision or any other incident of navigation concerning a ship on the high seas, involving the penal or disciplinary responsibility of the master or of any other person in the service of the ship, no penal or disciplinary proceedings may be instituted against such person except before the judicial or administrative authorities either of the flag State or of the State of which such person is a national.", "zh": "遇有船舶在公海上碰撞或任何其他航行事故涉及船長或任何其他為船舶服務的人員的刑事或紀律責任時，對此種人員的任何刑事訴訟或紀律程序，僅可向船旗國或此種人員所屬國的司法或行政當局提出。"}, {"n": "2", "en": "In disciplinary matters, the State which has issued a master's certificate or a certificate of competence or licence shall alone be competent, after due legal process, to pronounce the withdrawal of such certificates, even if the holder is not a national of the State which issued them.", "zh": "在紀律事項上，只有發給船長證書或駕駛資格證書或執照的國家，才有權在經過適當的法律程序後宣告撤銷該證書，即使證書持有人不是發給證書的國家的國民也不例外。"}, {"n": "3", "en": "No arrest or detention of the ship, even as a measure of investigation, shall be ordered by any authorities other than those of the flag State.", "zh": "船旗國當局以外的任何當局，即使作為一種調查措施，也不應命令逮捕或扣留船舶。"}], "keys": ["僅可向船旗國或此種人員所屬國的司法或行政當局提出", "也不應命令逮捕或扣留船舶"], "plain": "公海上的碰撞或其他航行事故，要追究船長或船員的刑事或紀律責任，只能由船旗國或該人員的國籍國審理；受害船舶的船旗國或受害者國籍國不能起訴對方船員。撤銷船長證書或駕駛執照只能由發證國決定；除船旗國外，任何國家都不得扣留肇事船舶，即使只是為了調查。本條推翻了常設國際法院蓮花號案（1927）的結論：該案法國郵船蓮花號與土耳其船相撞，法院以國際法沒有禁止為由，承認土耳其可審判法國船員。1952年《布魯塞爾碰撞刑事管轄公約》與1958年《公海公約》第11條已改採本條的規則。", "elements": [{"req": ["公海上碰撞或其他航行事故", "涉及船長或船員的刑事或紀律責任"], "effect": "只能由船旗國或該人員國籍國追訴"}, {"req": ["紀律事項"], "effect": "只有發證國可撤銷證書或執照"}, {"req": ["船旗國以外的當局"], "effect": "不得命令逮捕或扣留船舶，即使作為調查措施"}], "traps": ["陷阱：受害船舶的船旗國或受害者國籍國（被動屬人原則）不能依本條追訴，這是推翻蓮花號案的重點。", "陷阱：蓮花號案「國際法未禁止即屬允許」的見解（蓮花號原則）在管轄理論上仍常被引用，但其碰撞管轄的具體結論已被本條取代。", "陷阱：只適用「航行事故」；義大利與印度的恩里卡．萊克西號仲裁案（附件七仲裁，2020）認定，船上海軍陸戰隊員射擊漁船不是航行事故，不適用本條。"], "custom": {"status": "習慣法", "note": "本條規則經1952年布魯塞爾公約與1958年公海公約確立，現已普遍接受。", "cases": []}, "related": ["unclos-92", "unclos-94", "unclos-98", "unclos-27"], "cases": [], "roc": "", "essay": "蓮花號案與第97條：「常設國際法院蓮花號案（1927）以國際法未禁止即屬允許，承認土耳其得審判法國船員；但其碰撞管轄的結論已為1952年布魯塞爾公約、1958年公海公約第11條及海洋法公約第97條推翻，改由船旗國或行為人國籍國專屬管轄。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "98", "heading": "救助的義務", "tier": "B", "paras": [{"n": "1", "en": "Every State shall require the master of a ship flying its flag, in so far as he can do so without serious danger to the ship, the crew or the passengers:\n(a) to render assistance to any person found at sea in danger of being lost;\n(b) to proceed with all possible speed to the rescue of persons in distress, if informed of their need of assistance, in so far as such action may reasonably be expected of him;\n(c) after a collision, to render assistance to the other ship, its crew and its passengers and, where possible, to inform the other ship of the name of his own ship, its port of registry and the nearest port at which it will call.", "zh": "每個國家應責成懸掛該國旗幟航行的船舶的船長，在不嚴重危及其船舶、船員或乘客的情況下：\n(a)救助在海上遇到的任何有生命危險的人；\n(b)如果得悉有遇難者需要救助的情形，在可以合理地期待其採取救助行動時，盡速前往拯救；\n(c)在碰撞後，對另一船舶，其船員和乘客給予救助，並在可能情況下，將自己船舶的名稱、船籍港和將停泊的最近港口通知另一船舶。"}, {"n": "2", "en": "Every coastal State shall promote the establishment, operation and maintenance of an adequate and effective search and rescue service regarding safety on and over the sea and, where circumstances so require, by way of mutual regional arrangements cooperate with neighbouring States for this purpose.", "zh": "每個沿海國應促進有關海上和上空安全的足敷應用和有效的搜尋和救助服務的建立、經營和維持，並應在情況需要時，為此目的通過相互的區域性安排與鄰國合作。"}], "keys": ["救助在海上遇到的任何有生命危險的人", "搜尋和救助服務"], "plain": "船旗國應要求本國船長在不嚴重危及自身船舶、船員或乘客的情況下：救助海上遇險的任何人；得知有人遇難時盡速前往；碰撞後救助對方並通報自己的船名、船籍港與將停靠的港口。沿海國則應建立有效的搜救服務，必要時與鄰國合作。本條是海上救援難民與移民爭議的基礎，但公約沒有規定獲救者應被送往哪裡上岸，相關規則另見《海上人命安全公約》與《海上搜索救助公約》的修正。", "elements": [{"req": ["船長", "不嚴重危及船舶、船員或乘客"], "effect": "應救助海上遇險者、盡速前往拯救、碰撞後救助並通報"}, {"req": ["沿海國"], "effect": "應建立有效的搜救服務，並與鄰國合作"}], "traps": ["陷阱：義務主體是「國家」（應責成船長），不是由公約直接對船長課予國際法義務。", "陷阱：救助對象是「任何」遇險者，不論國籍、身分或處境。"], "custom": {"status": "習慣法", "note": "海上救助義務為歷史悠久的海事習慣，也是1958年公海公約第12條的內容。", "cases": []}, "related": ["unclos-94", "unclos-97", "unclos-18"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "99", "heading": "販運奴隸的禁止", "tier": "B", "paras": [{"n": "", "en": "Every State shall take effective measures to prevent and punish the transport of slaves in ships authorized to fly its flag and to prevent the unlawful use of its flag for that purpose. Any slave taking refuge on board any ship, whatever its flag, shall ipso facto be free.", "zh": "每個國家應採取有效措施，防止和懲罰准予懸掛該國旗幟的船舶販運奴隸，並防止為此目的而非法使用其旗幟。在任何船舶上避難的任何奴隸，不論該船懸掛何國旗幟均當然獲得自由。"}], "keys": ["防止和懲罰准予懸掛該國旗幟的船舶販運奴隸", "均當然獲得自由"], "plain": "船旗國應防止並懲罰本國船舶販運奴隸，也要防止他人冒用本國國旗販奴。任何奴隸逃到任何船上，不論船旗，當然獲得自由。注意：販奴不在第105條普遍扣押的範圍；他國軍艦只能依第110條登臨查核，扣押與處罰仍由船旗國負責。", "elements": [{"req": ["船旗國"], "effect": "應防止並懲罰本國船舶販運奴隸，並防止冒用其旗幟"}, {"req": ["奴隸在任何船舶上避難"], "effect": "當然獲得自由"}], "traps": ["陷阱：有販奴嫌疑可以登臨（第110條第1項(b)），但不像海盜那樣任何國家都可扣押審判；處罰主要靠船旗國。"], "custom": {"status": "習慣法", "note": "禁止奴隸制度屬強行法；海上執法權限則以本條與第110條為準。", "cases": []}, "related": ["unclos-92", "unclos-105", "unclos-110"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "100", "heading": "合作制止海盜行為的義務", "tier": "B", "paras": [{"n": "", "en": "All States shall cooperate to the fullest possible extent in the repression of piracy on the high seas or in any other place outside the jurisdiction of any State.", "zh": "所有國家應盡最大可能進行合作，以制止在公海上或在任何國家管轄範圍以外的任何其他地方的海盜行為。"}], "keys": ["盡最大可能進行合作"], "plain": "各國負有合作制止{{海盜行為}}的義務，範圍是公海及任何國家管轄範圍以外的地方（依第58條第2項，專屬經濟海域也適用）。實務上的合作包括多國護航（例如歐盟在亞丁灣的亞特蘭大行動）、區域協定（2004年《亞洲地區反海盜及武裝搶劫船舶區域合作協定》），以及安理會針對索馬利亞海盜的授權決議。", "elements": [{"req": ["所有國家", "公海或任何國家管轄範圍以外的海盜行為"], "effect": "應盡最大可能合作制止"}], "traps": ["陷阱：他國領海內的同類行為不是公約定義的海盜，而是「海上武裝搶劫」，由沿海國管轄；本條的合作義務不及於他國領海。", "陷阱：安理會第1816號決議（2008）授權各國進入索馬利亞領海打擊海盜，是經索馬利亞過渡政府同意、只針對該國的例外，決議明言不得被視為形成習慣國際法。"], "custom": {"status": "習慣法", "note": "合作制止海盜的義務承襲1958年公海公約第14條。", "cases": []}, "related": ["unclos-101", "unclos-105", "unclos-58"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "101", "heading": "海盜行為的定義", "tier": "A", "paras": [{"n": "", "en": "Piracy consists of any of the following acts:\n(a) any illegal acts of violence or detention, or any act of depredation, committed for private ends by the crew or the passengers of a private ship or a private aircraft, and directed:\n(i) on the high seas, against another ship or aircraft, or against persons or property on board such ship or aircraft;\n(ii) against a ship, aircraft, persons or property in a place outside the jurisdiction of any State;\n(b) any act of voluntary participation in the operation of a ship or of an aircraft with knowledge of facts making it a pirate ship or aircraft;\n(c) any act of inciting or of intentionally facilitating an act described in subparagraph (a) or (b).", "zh": "下列行為中的任何行為構成海盜行為：\n(a)私人船舶或私人飛機的船員、機組成員或乘客為私人目的，對下列對象所從事的任何非法的暴力或扣留行為，或任何掠奪行為：\n(1)在公海上對另一船舶或飛機，或對另一船舶或飛機上的人或財物；\n(2)在任何國家管轄範圍以外的地方對船舶、飛機、人或財物；\n(b)明知船舶或飛機成為海盜船舶或飛機的事實，而自願參加其活動的任何行為；\n(c)教唆或故意便利(a)或(b)項所述行為的任何行為。"}], "keys": ["私人船舶或私人飛機", "為私人目的", "在公海上對另一船舶或飛機"], "plain": "{{海盜行為}}有四個要件：①行為：非法的暴力、扣留或掠奪；②主體：私人船舶或私人飛機的船員、機組人員或乘客（政府船舶原則上不是，除非船員叛變，見第102條）；③目的：為私人目的；④地點與對象：在公海（依第58條第2項含專屬經濟海域）或任何國家管轄範圍以外的地方，針對「另一」船舶或飛機。第④點就是「兩船要件」：船上乘客劫持自己所搭乘的船，不是海盜。此外，明知而自願參加海盜船舶的活動，以及教唆或故意便利上述行為，也構成海盜。發生在領海內的同類行為則是{{海上武裝搶劫}}。", "elements": [{"req": ["非法暴力、扣留或掠奪", "私人船舶或飛機的人員", "為私人目的", "在公海或國家管轄範圍以外", "針對另一船舶或飛機（兩船要件）"], "effect": "構成海盜行為"}, {"req": ["明知為海盜船舶或飛機", "自願參加其活動"], "effect": "構成海盜行為"}, {"req": ["教唆或故意便利上述行為"], "effect": "構成海盜行為"}], "traps": ["陷阱：兩船要件：1985年阿基萊．勞倫號事件的劫持者原是船上乘客，依本條不構成海盜，國際社會因此於1988年制定《制止危及海上航行安全非法行為公約》。", "陷阱：地點限於公海或國家管轄範圍以外；領海與內水內的同類行為是「海上武裝搶劫」，只有沿海國能管轄。", "陷阱：政治目的的劫船（例如恐怖攻擊）通常被認為不是「私人目的」；但美國第九巡迴上訴法院在鯨類研究所訴海洋守護者協會案（2013）採廣義解釋，認為私人目的不限於財產利益。", "陷阱：軍艦或政府船舶的人員原則上不構成海盜，除非叛變並控制船舶（第102條）。"], "custom": {"status": "習慣法", "note": "海盜是最早被承認適用普遍管轄的國際罪行；本條定義承襲1958年公海公約第15條。", "cases": []}, "related": ["unclos-100", "unclos-102", "unclos-103", "unclos-105", "unclos-110", "unclos-58"], "cases": [], "roc": "我國《刑法》第333條規定海盜罪（未受交戰國允准或不屬於各國海軍，而駕駛船艦，意圖施強暴、脅迫於他船或他船之人或物）；構成要件與本條不完全相同，並未要求行為地在公海。", "essay": "海盜的定義：「依第101條，海盜須①私人船舶或飛機的人員②為私人目的③在公海或任何國家管轄範圍以外④對另一船舶或飛機或其上人員財物⑤從事非法暴力、扣留或掠奪；明知而自願參加及教唆、故意便利者亦屬之。領海內的同類行為為海上武裝搶劫，由沿海國管轄。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）(a)(2)「對船舶、飛機，人或財物」的逗號依英文作準本及上下文改為頓號，(c)款句末補句號（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "102", "heading": "船員叛變的軍艦、政府船舶或政府飛機的海盜行為", "tier": "B", "paras": [{"n": "", "en": "The acts of piracy, as defined in article 101, committed by a warship, government ship or government aircraft whose crew has mutinied and taken control of the ship or aircraft are assimilated to acts committed by a private ship or aircraft.", "zh": "軍艦、政府船舶或政府飛機由於其船員或機組成員發生叛變並控制該船舶或飛機而從事第一百零一條所規定的海盜行為，視同私人船舶或飛機所從事的行為。"}], "keys": ["發生叛變並控制該船舶或飛機", "視同私人船舶或飛機所從事的行為"], "plain": "軍艦、政府船舶或政府飛機原則上不會構成海盜，因為第101條要求「私人」船舶或飛機。但如果船員或機組人員叛變並控制了它，再從事海盜行為，就視同私人船舶或飛機的行為，可依第105條扣押。", "elements": [{"req": ["軍艦、政府船舶或飛機", "船員叛變並控制", "從事第101條的行為"], "effect": "視同私人船舶或飛機的海盜行為"}], "traps": ["陷阱：必須同時有「叛變」與「控制」；政府船舶依政府命令從事不法行為，屬國家責任問題，不是海盜。"], "custom": {"status": "習慣法", "note": "承襲1958年公海公約第16條。", "cases": []}, "related": ["unclos-101", "unclos-95", "unclos-96", "unclos-105"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "103", "heading": "海盜船舶或飛機的定義", "tier": "B", "paras": [{"n": "", "en": "A ship or aircraft is considered a pirate ship or aircraft if it is intended by the persons in dominant control to be used for the purpose of committing one of the acts referred to in article 101. The same applies if the ship or aircraft has been used to commit any such act, so long as it remains under the control of the persons guilty of that act.", "zh": "如果處於主要控制地位的人員意圖利用船舶或飛機從事第一百零一條所指的各項行為之一，該船舶或飛機視為海盜船舶或飛機。如果該船舶或飛機曾被用以從事任何這種行為，在該船舶或飛機仍在犯有該行為的人員的控制之下時，上述規定同樣適用。"}], "keys": ["處於主要控制地位的人員"], "plain": "判斷是不是海盜船舶或飛機，看「處於主要控制地位的人」的意圖：他們打算用來從事海盜行為，就是海盜船舶。曾被用來從事海盜行為的船舶，只要仍在犯行者控制之下，也是海盜船舶。", "elements": [{"req": ["主要控制者意圖用以從事海盜行為"], "effect": "視為海盜船舶或飛機"}, {"req": ["曾被用以從事海盜行為", "仍在犯行者控制下"], "effect": "視為海盜船舶或飛機"}], "traps": ["陷阱：只看主要控制者的意圖，不必船上所有人都是海盜；被海盜劫持、仍由海盜控制的船舶，也可依第105條扣押。"], "custom": {"status": "習慣法", "note": "承襲1958年公海公約第17條。", "cases": []}, "related": ["unclos-101", "unclos-104", "unclos-105"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "104", "heading": "海盜船舶或飛機國籍的保留或喪失", "tier": "B", "paras": [{"n": "", "en": "A ship or aircraft may retain its nationality although it has become a pirate ship or aircraft. The retention or loss of nationality is determined by the law of the State from which such nationality was derived.", "zh": "船舶或飛機雖已成為海盜船舶或飛機，仍可保有其國籍。國籍的保留或喪失由原來給予國籍的國家的法律予以決定。"}], "keys": ["仍可保有其國籍"], "plain": "船舶或飛機成為海盜船舶或飛機，並不當然喪失國籍；是否保有或喪失，依原來給予國籍的國家的法律決定。不論國籍是否保留，任何國家都可依第105條扣押。", "elements": [{"req": ["船舶或飛機成為海盜船舶或飛機"], "effect": "仍可保有國籍；保留或喪失依原國籍國法律決定"}], "traps": ["陷阱：成為海盜船舶不會自動喪失國籍；但國籍是否保留，不影響各國依第105條扣押的權利。"], "custom": {"status": "習慣法", "note": "承襲1958年公海公約第18條。", "cases": []}, "related": ["unclos-91", "unclos-103", "unclos-105"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "105", "heading": "海盜船舶或飛機的扣押（普遍管轄）", "tier": "A", "paras": [{"n": "", "en": "On the high seas, or in any other place outside the jurisdiction of any State, every State may seize a pirate ship or aircraft, or a ship or aircraft taken by piracy and under the control of pirates, and arrest the persons and seize the property on board. The courts of the State which carried out the seizure may decide upon the penalties to be imposed, and may also determine the action to be taken with regard to the ships, aircraft or property, subject to the rights of third parties acting in good faith.", "zh": "在公海上，或在任何國家管轄範圍以外的任何其他地方，每個國家均可扣押海盜船舶或飛機或為海盜所奪取並在海盜控制下的船舶或飛機，和逮捕船上或機上人員並扣押船上或機上財物。扣押國的法院可判定應處的刑罰，並可決定對船舶、飛機或財產所應採取的行動，但受善意第三者的權利的限制。"}], "keys": ["每個國家均可扣押海盜船舶或飛機", "扣押國的法院可判定應處的刑罰", "善意第三者的權利"], "plain": "這是{{普遍管轄}}最典型的條文：在公海或任何國家管轄範圍以外的地方，任何國家都可以扣押海盜船舶或飛機（包括被海盜奪取並控制的船舶），逮捕船上人員並扣押財物；由扣押國法院判處刑罰，並決定如何處置船舶與財產，但不得損害善意第三人（例如被劫船舶的原所有人）的權利。理由是海盜被視為「人類公敵」，危害所有國家的航運利益，與行為人或被害人的國籍無關。限制：只有軍艦、軍用飛機或經授權的政府船舶飛機可以扣押（第107條）；無足夠理由而扣押者應負賠償責任（第106條）。", "elements": [{"req": ["在公海或國家管轄範圍以外", "海盜船舶或飛機（含被海盜控制者）"], "effect": "任何國家均可扣押、逮捕人員並扣押財物"}, {"req": ["扣押國"], "effect": "其法院可判刑並決定處置，但受善意第三人權利限制"}], "traps": ["陷阱：條文用「可」（may）：扣押與審判是權利不是義務；實務上常見逮捕後釋放的情形。", "陷阱：普遍管轄適用於海盜，不適用於販毒（gl108a_9正解A）；公海販毒只有合作義務（第108條）。", "陷阱：地點不包括他國領海；追捕海盜不得進入他國領海，索馬利亞是經安理會授權的例外。", "陷阱：由「扣押國」的國內法院審判；國際刑事法院對海盜罪沒有管轄權。"], "custom": {"status": "習慣法", "note": "海盜的普遍管轄是最早確立的習慣國際法普遍管轄，承襲1958年公海公約第19條。", "cases": []}, "related": ["unclos-100", "unclos-101", "unclos-104", "unclos-106", "unclos-107", "unclos-110"], "cases": [], "roc": "我國《刑法》第5條將第333條、第334條的海盜罪列為在中華民國領域外犯罪仍適用我國刑法的罪名，不問行為人國籍，屬普遍管轄的國內法依據。", "essay": "海盜的普遍管轄與限制：「依第105條，在公海或任何國家管轄範圍以外，每個國家均可扣押海盜船舶、逮捕人員並由本國法院審判，是普遍管轄的典型。其限制為：只有軍艦或經授權的政府船舶可扣押（第107條）、無足夠理由扣押應賠償（第106條）、登臨須有合理根據（第110條），且不得進入他國領海。」", "exam": [{"qid": "gl108a_9", "note": "正解A：海盜罪依本條適用普遍管轄；販毒罪一般認為不屬習慣法上的普遍管轄，公約只規定合作義務（第108條）。"}], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "106", "heading": "無足夠理由扣押的賠償責任", "tier": "B", "paras": [{"n": "", "en": "Where the seizure of a ship or aircraft on suspicion of piracy has been effected without adequate grounds, the State making the seizure shall be liable to the State the nationality of which is possessed by the ship or aircraft for any loss or damage caused by the seizure.", "zh": "如果扣押涉有海盜行為嫌疑的船舶或飛機並無足夠的理由，扣押國應向船舶或飛機所屬的國家負擔因扣押而造成的任何損失或損害的賠償責任。"}], "keys": ["並無足夠的理由"], "plain": "以海盜嫌疑扣押船舶或飛機，如果沒有足夠理由，扣押國要對該船舶或飛機的國籍國賠償因扣押造成的損失或損害。這是對普遍管轄的制衡，避免各國濫用海盜之名干涉他國船舶。", "elements": [{"req": ["以海盜嫌疑扣押", "無足夠理由"], "effect": "扣押國應對船舶或飛機國籍國負賠償責任"}], "traps": ["陷阱：賠償的對象是船舶或飛機的「國籍國」（國家對國家），不是直接對船東。"], "custom": {"status": "習慣法", "note": "承襲1958年公海公約第20條。", "cases": []}, "related": ["unclos-105", "unclos-110", "unclos-111"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "107", "heading": "有權因海盜行為進行扣押的船舶和飛機", "tier": "B", "paras": [{"n": "", "en": "A seizure on account of piracy may be carried out only by warships or military aircraft, or other ships or aircraft clearly marked and identifiable as being on government service and authorized to that effect.", "zh": "由於發生海盜行為而進行的扣押，只可由軍艦、軍用飛機或其他有清楚標誌可以識別的為政府服務並經授權扣押的船舶或飛機實施。"}], "keys": ["只可由軍艦、軍用飛機"], "plain": "因海盜而扣押，只能由軍艦、軍用飛機，或有清楚標誌、可識別為政府服務並經授權的船舶或飛機（例如海巡艦艇）執行。商船與私人保全只能自衛，沒有扣押權。", "elements": [{"req": ["因海盜行為扣押"], "effect": "只可由軍艦、軍用飛機或經授權且有清楚標誌的政府船舶飛機實施"}], "traps": ["陷阱：私人保全或武裝商船不得扣押海盜船，只能自衛。", "陷阱：第110條第5項（登臨）、第111條第5項（緊追）對執行主體有相同的限制。"], "custom": {"status": "習慣法", "note": "承襲1958年公海公約第21條。", "cases": []}, "related": ["unclos-29", "unclos-105", "unclos-110", "unclos-111"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）「軍艦，軍用飛機」依上下文及第110、111條用語改為頓號（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "108", "heading": "麻醉藥品或精神調理物質的非法販運", "tier": "B", "paras": [{"n": "1", "en": "All States shall cooperate in the suppression of illicit traffic in narcotic drugs and psychotropic substances engaged in by ships on the high seas contrary to international conventions.", "zh": "所有國家應進行合作，以制止船舶違反國際公約在海上從事非法販運麻醉藥品和精神調理物質。"}, {"n": "2", "en": "Any State which has reasonable grounds for believing that a ship flying its flag is engaged in illicit traffic in narcotic drugs or psychotropic substances may request the cooperation of other States to suppress such traffic.", "zh": "任何國家如有合理根據認為一艘懸掛其旗幟的船舶從事非法販運麻醉藥品或精神調理物質，可要求其他國家合作，制止這種販運。"}], "keys": ["可要求其他國家合作"], "plain": "公約對海上販毒只規定合作義務：各國應合作制止，船旗國懷疑本國船舶販毒時，可以請求他國協助。販毒不是第110條的登臨事由，他國要登臨外國船舶，須有船旗國同意或條約依據，例如1988年《聯合國禁止非法販運麻醉藥品和影響精神物質公約》第17條。", "elements": [{"req": ["所有國家"], "effect": "應合作制止船舶在海上非法販毒"}, {"req": ["船旗國有合理根據認為本國船舶販毒"], "effect": "可請求他國合作制止"}], "traps": ["陷阱：公海販毒不是第110條的登臨事由；除條約另有約定或船旗國同意，不得登檢他國船舶（SG027選項A為正確敘述）。", "陷阱：販毒不屬海盜，不適用第105條的普遍扣押（gl108a_9）。", "陷阱：沿海國在領海內可為取締販毒行使刑事管轄（第27條第1項(d)），在鄰接區可為防止違反海關法令行使管制（第33條）。"], "custom": {"status": "不適用", "note": "海上禁毒合作主要依1988年聯合國禁毒公約等條約。", "cases": []}, "related": ["unclos-27", "unclos-33", "unclos-105", "unclos-110"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG027", "note": "選項A：公海販毒不屬第110條登臨事由，除條約另有約定不得登檢他國船舶，敘述正確。本題答案仍有查證旗標（見待查）。"}], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「所有國家應進行點作」依英文作準本（cooperate）更正為「進行合作」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "109", "heading": "從公海從事未經許可的廣播", "tier": "B", "paras": [{"n": "1", "en": "All States shall cooperate in the suppression of unauthorized broadcasting from the high seas.", "zh": "所有國家應進行合作，以制止從公海從事未經許可的廣播。"}, {"n": "2", "en": "For the purposes of this Convention, \"unauthorized broadcasting\" means the transmission of sound radio or television broadcasts from a ship or installation on the high seas intended for reception by the general public contrary to international regulations, but excluding the transmission of distress calls.", "zh": "為本公約的目的，「未經許可的廣播」是指船舶或設施違反國際規章在公海上播送旨在使公眾收聽或收看的無線電傳音或電視廣播，但遇難呼號的播送除外。"}, {"n": "3", "en": "Any person engaged in unauthorized broadcasting may be prosecuted before the court of:\n(a) the flag State of the ship;\n(b) the State of registry of the installation;\n(c) the State of which the person is a national;\n(d) any State where the transmissions can be received; or\n(e) any State where authorized radio communication is suffering interference.", "zh": "對於從公海從事未經許可的廣播的任何人，均可向下列國家的法院起訴：\n(a)船旗國；\n(b)設施登記國；\n(c)廣播人所屬國；\n(d)可以收到這種廣播的任何國家；或\n(e)得到許可的無線電通信受到干擾的任何國家。"}, {"n": "4", "en": "On the high seas, a State having jurisdiction in accordance with paragraph 3 may, in conformity with article 110, arrest any person or ship engaged in unauthorized broadcasting and seize the broadcasting apparatus.", "zh": "在公海上按照第三款有管轄權的國家，可依照第一百一十條逮捕從事未經許可的廣播的任何人或船舶，並扣押廣播器材。"}], "keys": ["未經許可的廣播", "扣押廣播器材"], "plain": "本條針對1960年代起在歐洲沿海公海上設台的「海盜電台」。未經許可的廣播，指船舶或設施違反國際規章，在公海上播送給公眾收聽收看的廣播（遇難呼號除外）。可以起訴的國家有五類：船旗國、設施登記國、廣播人國籍國、收得到廣播的國家、合法通信受干擾的國家。這些國家可在公海上依第110條逮捕人員或船舶、扣押器材。", "elements": [{"req": ["船舶或設施在公海", "違反國際規章播送公眾廣播", "非遇難呼號"], "effect": "構成未經許可的廣播"}, {"req": ["第3項所列五類國家"], "effect": "可起訴，並可在公海逮捕人員或船舶、扣押器材"}], "traps": ["陷阱：有管轄權的國家限於第3項五類，不是任何國家，所以不是普遍管轄；軍艦登臨也須其船旗國依本條有管轄權（第110條第1項(c)）。"], "custom": {"status": "不適用", "note": "本條是第三次海洋法會議新增的規定，1958年公海公約沒有。", "cases": []}, "related": ["unclos-92", "unclos-110"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第3項(d)「任何國家或；」依英文作準本（; or）調整為「任何國家；或」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "110", "heading": "登臨權", "tier": "A", "paras": [{"n": "1", "en": "Except where acts of interference derive from powers conferred by treaty, a warship which encounters on the high seas a foreign ship, other than a ship entitled to complete immunity in accordance with articles 95 and 96, is not justified in boarding it unless there is reasonable ground for suspecting that:\n(a) the ship is engaged in piracy;\n(b) the ship is engaged in the slave trade;\n(c) the ship is engaged in unauthorized broadcasting and the flag State of the warship has jurisdiction under article 109;\n(d) the ship is without nationality; or\n(e) though flying a foreign flag or refusing to show its flag, the ship is, in reality, of the same nationality as the warship.", "zh": "除條約授權的干涉行為外，軍艦在公海上遇到按照第九十五和第九十六條享有完全豁免權的船舶以外的外國船舶，非有合理根據認為有下列嫌疑，不得登臨該船：\n(a)該船從事海盜行為；\n(b)該船從事奴隸販賣；\n(c)該船從事未經許可的廣播而且軍艦的船旗國依據第一百零九條有管轄權；\n(d)該船沒有國籍；或\n(e)該船雖懸掛外國旗幟或拒不展示其旗幟，而事實上卻與該軍艦屬同一國籍。"}, {"n": "2", "en": "In the cases provided for in paragraph 1, the warship may proceed to verify the ship's right to fly its flag. To this end, it may send a boat under the command of an officer to the suspected ship. If suspicion remains after the documents have been checked, it may proceed to a further examination on board the ship, which must be carried out with all possible consideration.", "zh": "在第一款規定的情形下，軍艦可查核該船懸掛其旗幟的權利。為此目的，軍艦可派一艘由一名軍官指揮的小艇到該嫌疑船舶。如果檢驗船舶文件後仍有嫌疑，軍艦可進一步在該船上進行檢查，但檢查須盡量審慎進行。"}, {"n": "3", "en": "If the suspicions prove to be unfounded, and provided that the ship boarded has not committed any act justifying them, it shall be compensated for any loss or damage that may have been sustained.", "zh": "如果嫌疑經證明為無根據，而且被登臨的船舶並未從事嫌疑的任何行為，對該船舶可能遭受的任何損失或損害應予賠償。"}, {"n": "4", "en": "These provisions apply mutatis mutandis to military aircraft.", "zh": "這些規定比照適用於軍用飛機。"}, {"n": "5", "en": "These provisions also apply to any other duly authorized ships or aircraft clearly marked and identifiable as being on government service.", "zh": "這些規定也適用於經正式授權並有清楚標誌可以識別的為政府服務的任何其他船舶或飛機。"}], "keys": ["非有合理根據認為有下列嫌疑，不得登臨該船", "該船沒有國籍", "應予賠償"], "plain": "{{登臨權}}是公海上船旗國專屬管轄的例外，但範圍很窄：軍艦（或經授權的政府船舶、軍用飛機）在公海上遇到外國船舶（軍艦與政府非商業船舶除外），只有在合理懷疑對方①從事海盜、②販運奴隸、③從事未經許可的廣播且本國依第109條有管轄權、④沒有國籍、⑤懸掛外國旗或拒不展示國旗但實際上與軍艦同國籍時，才可以登臨。程序分兩步：先派小艇查核船舶文件；查核後仍有嫌疑，才能進一步在船上檢查，而且要盡量審慎。嫌疑查無根據、該船也沒有可疑行為時，應賠償其損失。登臨只是「查核」，查到後能否扣押要看各事由的規定：海盜可依第105條扣押，販奴則交由船旗國處理。條約也可另外授權登臨，例如禁毒公約或各國間的雙邊登臨協定。", "elements": [{"req": ["軍艦或經授權的政府船舶、軍用飛機", "在公海", "外國非豁免船舶", "合理懷疑五種情形之一"], "effect": "得登臨查核船舶文件；仍有嫌疑時可進一步在船上檢查"}, {"req": ["嫌疑經證明無根據", "被登臨船舶未從事可疑行為"], "effect": "應賠償其損失或損害"}], "traps": ["陷阱：五種事由是限定列舉；販毒、恐怖活動、非法捕魚都不在其中，須靠條約或船旗國同意。", "陷阱：無國籍船舶可被登臨；懸掛兩國以上國旗而視方便換用的船舶可視同無國籍（第92條第2項）。", "陷阱：登臨不等於扣押：查到販奴嫌疑也只能交由船旗國處理，只有海盜可以由任何國家扣押。", "陷阱：依第58條第2項，本條也適用於專屬經濟海域。"], "custom": {"status": "習慣法", "note": "登臨權的事由（海盜、販奴、無國籍、冒用國旗）承襲1958年公海公約第22條；未經許可的廣播是本公約新增。", "cases": []}, "related": ["unclos-92", "unclos-95", "unclos-96", "unclos-99", "unclos-105", "unclos-108", "unclos-109", "unclos-111"], "cases": [], "roc": "我國《海岸巡防法》授權海巡人員對我國管轄海域內的船舶實施登臨、檢查；在公海登臨外國船舶，則須符合本條或相關國際協定，例如區域漁業管理組織的公海登臨檢查程序。", "essay": "登臨權的限制：「依第110條，軍艦在公海上登臨外國船舶，須有合理根據懷疑其從事海盜、販奴、未經許可的廣播（且本國有管轄權）、無國籍或實際與軍艦同國籍；應先查核文件，仍有嫌疑始得進一步檢查；嫌疑無根據時應賠償。」", "exam": [{"qid": "SG027", "note": "選項A：運毒不是本條所列的登臨事由，除條約另有約定不得登檢他國船舶，敘述正確。"}], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項(d)「該船沒有國籍或；」依英文作準本（; or）調整為「該船沒有國籍；或」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "111", "heading": "緊追權", "tier": "A", "paras": [{"n": "1", "en": "The hot pursuit of a foreign ship may be undertaken when the competent authorities of the coastal State have good reason to believe that the ship has violated the laws and regulations of that State. Such pursuit must be commenced when the foreign ship or one of its boats is within the internal waters, the archipelagic waters, the territorial sea or the contiguous zone of the pursuing State, and may only be continued outside the territorial sea or the contiguous zone if the pursuit has not been interrupted. It is not necessary that, at the time when the foreign ship within the territorial sea or the contiguous zone receives the order to stop, the ship giving the order should likewise be within the territorial sea or the contiguous zone. If the foreign ship is within a contiguous zone, as defined in article 33, the pursuit may only be undertaken if there has been a violation of the rights for the protection of which the zone was established.", "zh": "沿海國主管當局有充分理由認為外國船舶違反該國法律和規章時，可對該外國船舶進行緊追。此項追逐須在外國船舶或其小艇之一在追逐國的內水、群島水域、領海或毗連區內時開始，而且只有追逐未曾中斷，才可在領海或毗連區外繼續進行。當外國船舶在領海或毗連區內接獲停駛命令時，發出命令的船舶並無必要也在領海或毗連區內。如果外國船舶是在第三十三條所規定的毗連區內，追逐只有在設立該區所保護的權利遭到侵犯的情形下才可進行。"}, {"n": "2", "en": "The right of hot pursuit shall apply mutatis mutandis to violations in the exclusive economic zone or on the continental shelf, including safety zones around continental shelf installations, of the laws and regulations of the coastal State applicable in accordance with this Convention to the exclusive economic zone or the continental shelf, including such safety zones.", "zh": "對於在專屬經濟區內或大陸架上，包括大陸架上設施周圍的安全地帶內，違反沿海國按照本公約適用於專屬經濟區或大陸架包括這種安全地帶的法律和規章的行為，應比照適用緊追權。"}, {"n": "3", "en": "The right of hot pursuit ceases as soon as the ship pursued enters the territorial sea of its own State or of a third State.", "zh": "緊追權在被追逐的船舶駛入其本國領海或第三國領海時立即終止。"}, {"n": "4", "en": "Hot pursuit is not deemed to have begun unless the pursuing ship has satisfied itself by such practicable means as may be available that the ship pursued or one of its boats or other craft working as a team and using the ship pursued as a mother ship is within the limits of the territorial sea, or, as the case may be, within the contiguous zone or the exclusive economic zone or above the continental shelf. The pursuit may only be commenced after a visual or auditory signal to stop has been given at a distance which enables it to be seen or heard by the foreign ship.", "zh": "除非追逐的船舶以可用的實際方法認定被追逐的船舶或其小艇之一或作為一隊進行活動而以被追逐的船舶為母船的其他船艇是在領海範圍內，或者，根據情況，在毗連區或專屬經濟區內或在大陸架上，緊追不得認為已經開始。追逐只有在外國船舶視聽所及的距離內發出視覺或聽覺的停駛信號後，才可開始。"}, {"n": "5", "en": "The right of hot pursuit may be exercised only by warships or military aircraft, or other ships or aircraft clearly marked and identifiable as being on government service and authorized to that effect.", "zh": "緊追權只可由軍艦、軍用飛機或其他有清楚標誌可以識別的為政府服務並經授權緊追的船舶或飛機行使。"}, {"n": "6", "en": "Where hot pursuit is effected by an aircraft:\n(a) the provisions of paragraphs 1 to 4 shall apply mutatis mutandis;\n(b) the aircraft giving the order to stop must itself actively pursue the ship until a ship or another aircraft of the coastal State, summoned by the aircraft, arrives to take over the pursuit, unless the aircraft is itself able to arrest the ship. It does not suffice to justify an arrest outside the territorial sea that the ship was merely sighted by the aircraft as an offender or suspected offender, if it was not both ordered to stop and pursued by the aircraft itself or other aircraft or ships which continue the pursuit without interruption.", "zh": "在飛機進行緊追時：\n(a)應比照適用第一至第四款的規定；\n(b)發出停駛命令的飛機，除非其本身能逮捕該船舶，否則須其本身積極追逐船舶直至其所召喚的沿海國船舶或另一飛機前來接替追逐為止。飛機僅發現船舶犯法或有犯法嫌疑，如果該飛機本身或接著無間斷地進行追逐的其他飛機或船舶既未命令該船停駛也未進行追逐，則不足以構成在領海以外逮捕的理由。"}, {"n": "7", "en": "The release of a ship arrested within the jurisdiction of a State and escorted to a port of that State for the purposes of an inquiry before the competent authorities may not be claimed solely on the ground that the ship, in the course of its voyage, was escorted across a portion of the exclusive economic zone or the high seas, if the circumstances rendered this necessary.", "zh": "在一國管轄範圍內被逮捕並被押解到該國港口以便主管當局審問的船舶，不得僅以其在航行中由於情況需要而曾被押解通過專屬經濟區的或公海的一部份理由而要求釋放。"}, {"n": "8", "en": "Where a ship has been stopped or arrested outside the territorial sea in circumstances which do not justify the exercise of the right of hot pursuit, it shall be compensated for any loss or damage that may have been thereby sustained.", "zh": "在無正當理由行使緊追權的情況下，在領海以外被命令停駛或被逮捕的船舶，對於可能因此遭受的任何損失或損害應獲賠償。"}], "keys": ["追逐未曾中斷", "駛入其本國領海或第三國領海時立即終止", "視覺或聽覺的停駛信號"], "plain": "{{緊追權}}讓沿海國可以把在其管轄海域內違法的外國船舶一路追到公海上逮捕。要件環環相扣，[[case|saiga-2|塞加號案（第2號）]]強調必須全部具備：①有充分理由認為外國船舶違反沿海國法令；②追逐須在對方（或其小艇、以其為母船的船艇，即{{推定出現}}）位於內水、群島水域、領海或鄰接區時開始；在鄰接區只能為該區所保護的海關、財政、移民、衛生利益而追；在專屬經濟海域或大陸礁層（含安全地帶），則限於違反適用於該區域的法令（第2項）；③須在對方視聽所及的距離內發出視覺或聽覺的停駛信號後才開始；④追逐不得中斷；⑤只能由軍艦、軍用飛機或經授權的政府船舶飛機執行；⑥對方一駛入本國或第三國領海，緊追權立即終止。不當行使緊追權須賠償（第8項）。", "elements": [{"req": ["有充分理由認為外國船舶違反沿海國法令", "對方在內水、群島水域、領海或鄰接區（鄰接區限該區保護利益），或在專屬經濟海域、大陸礁層違反適用法令", "在視聽所及距離內發出停駛信號", "由軍艦或經授權的政府船舶飛機執行", "追逐未中斷"], "effect": "得在領海或鄰接區外繼續追逐並逮捕"}, {"req": ["被追逐船舶駛入其本國或第三國領海"], "effect": "緊追權立即終止"}, {"req": ["無正當理由行使緊追權"], "effect": "在領海外被命令停駛或被逮捕的船舶應獲賠償"}], "traps": ["陷阱：緊追權終止於「領海」，不是專屬經濟海域或鄰接區；被追船舶逃進第三國專屬經濟海域，仍可繼續追。", "陷阱：發出停駛命令的船舶不必也在領海或鄰接區內（第1項），但被追船舶須在其內。", "陷阱：信號須在對方「視聽所及」距離內發出，可以是視覺或聽覺信號（第4項）；SG027選項C以「目視範圍」描述，與條文用語不完全相同，該題已列查證旗標。", "陷阱：飛機緊追時，發出命令的飛機須自己積極追逐直到船艦接手；只是「發現」違法，不足以在領海外逮捕（第6項）。", "陷阱：塞加號案（第2號）：幾內亞的追逐有中斷、未證明發出停駛信號，且把海關法令適用於專屬經濟海域本身就違反公約，所以緊追不合法。"], "custom": {"status": "習慣法", "note": "緊追權承襲1958年公海公約第23條，為習慣國際法；專屬經濟海域與大陸礁層部分（第2項）是本公約擴張。", "cases": []}, "related": ["unclos-33", "unclos-56", "unclos-60", "unclos-73", "unclos-107", "unclos-110", "unclos-292"], "cases": [{"id": "saiga-2", "point": "法庭認定第111條的要件是累積的，必須全部滿足；幾內亞的追逐有中斷，也未證明發出停駛信號，緊追不合法。"}], "roc": "我國《中華民國專屬經濟海域及大陸礁層法》明定我國得對違反我國法令的外國船舶行使緊追權；海巡署取締越界捕撈的外國漁船時，即以命令停船、追緝與登檢為主要手段。", "essay": "緊追權的要件：「依第111條，緊追須①有充分理由認為外國船舶違反沿海國法令；②於被追船舶在內水、群島水域、領海或鄰接區（或於專屬經濟海域、大陸礁層違反相關法令）時開始；③在視聽所及距離發出停駛信號；④追逐未中斷；⑤由軍艦或經授權的政府船舶執行；⑥對方駛入本國或第三國領海即終止。塞加號案（第2號）強調各要件須同時具備。」", "exam": [{"qid": "SG027", "note": "選項C涉及第4項：條文要求在外國船舶視聽所及的距離內發出視覺或聽覺停駛信號。本題答案仍有查證旗標（見待查）。"}], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「敕入」、第6項(b)「召換」依英文作準本及上下文更正為「駛入」「召喚」（待以聯合國作準中文本覆核）。"}]});
ARTICLES.push({"treaty": "unclos", "no": "121", "heading": "島嶼制度", "tier": "A", "paras": [{"n": "1", "en": "An island is a naturally formed area of land, surrounded by water, which is above water at high tide.", "zh": "島嶼是四面環水並在高潮時高於水平面的自然形成的陸地區域。"}, {"n": "2", "en": "Except as provided for in paragraph 3, the territorial sea, the contiguous zone, the exclusive economic zone and the continental shelf of an island are determined in accordance with the provisions of this Convention applicable to other land territory.", "zh": "除第三款另有規定外，島嶼的領海、毗連區、專屬經濟區和大陸架應按照本公約適用於其他陸地領土的規定加以確定。"}, {"n": "3", "en": "Rocks which cannot sustain human habitation or economic life of their own shall have no exclusive economic zone or continental shelf.", "zh": "不能維持人類居住或其本身的經濟生活的岩礁，不應有專屬經濟區或大陸架。"}], "keys": ["在高潮時高於水平面的自然形成的陸地區域", "不能維持人類居住或其本身的經濟生活的岩礁"], "plain": "{{島嶼}}有三個要件：自然形成、四面環水、高潮時高於水面。人工島嶼和設施不是島嶼，沒有領海（第60條第8項）；只在低潮時露出的低潮高地也不是島嶼（第13條）。島嶼原則上和陸地領土一樣，可以有領海、鄰接區、專屬經濟海域與大陸礁層；但第3項設了例外：「不能維持人類居住或其本身的經濟生活的{{岩礁}}」，只能有領海與鄰接區，不能有專屬經濟海域與大陸礁層。[[case|south-china-sea|南海仲裁案]]（2016）首次全面解釋第3項：看的是地物在「自然狀態」下的「客觀能力」，須能維持穩定人類社群的居住，或不依賴外來資源的獨立經濟生活；駐軍、政府人員駐守或依賴外部補給都不算。仲裁庭據此認定南沙群島所有高潮地物（包括太平島）都是岩礁。此外，即使是完整的島嶼，在劃界時也常被減少效力，例如[[case|black-sea|黑海劃界案]]的蛇島。", "elements": [{"req": ["自然形成", "四面環水", "高潮時高於水面"], "effect": "屬島嶼，原則上可有領海、鄰接區、專屬經濟海域與大陸礁層"}, {"req": ["島嶼中的岩礁", "不能維持人類居住或其本身的經濟生活"], "effect": "只有領海與鄰接區，不得有專屬經濟海域或大陸礁層"}], "traps": ["陷阱：島嶼是「高潮時」高於水面，不是低潮時（gl113a_8正解A）；低潮時高於水面、高潮時淹沒的是低潮高地（第13條）。", "陷阱：人工島嶼不具島嶼地位，不能有領海（gl110a_6正解A、第60條第8項）；把低潮高地填海造陸，也不能取得領土主權或改變其地位（SG026正解C）。", "陷阱：第3項的岩礁仍有12海里領海與鄰接區，只是沒有專屬經濟海域與大陸礁層。", "陷阱：「人類居住」與「其本身的經濟生活」是擇一要件，滿足其一就不是第3項的岩礁；但南海仲裁案對兩者都採嚴格標準。"], "custom": {"status": "習慣法", "note": "國際法院在尼加拉瓜訴哥倫比亞領土與海洋爭端案（2012）認定，第121條的島嶼制度（含第3項）是不可分割的整體，具有習慣法地位。", "cases": []}, "related": ["unclos-13", "unclos-46", "unclos-57", "unclos-60", "unclos-74", "unclos-76", "unclos-83", "unclos-147"], "cases": [{"id": "south-china-sea", "point": "首次全面解釋第3項：以自然狀態下的客觀能力判斷，須能維持穩定社群居住或不依賴外來資源的獨立經濟生活；南沙群島所 ARTICLES.push({"treaty": "unclos", "no": "133", "heading": "用語（「區域」的資源與礦物）", "tier": "B", "paras": [{"n": "", "en": "For the purposes of this Part:\n(a) \"resources\" means all solid, liquid or gaseous mineral resources in situ in the Area at or beneath the seabed, including polymetallic nodules;\n(b) resources, when recovered from the Area, are referred to as \"minerals\".", "zh": "為本部份的目的：\n(a)「資源」是指「區域」內在海床及其下原來位置的一切固體、液體或氣體礦物資源，其中包括多金屬結核；\n(b)從「區域」回收的資源稱為「礦物」。"}], "keys": ["多金屬結核", "從「區域」回收的資源稱為「礦物」"], "plain": "{{國際海底區域}}本身的定義在第1條第1項(1)款：國家管轄範圍以外的海床和洋底及其底土。本條定義第十一部分所說的「資源」：限於「區域」內在海床及其下原來位置的固體、液體或氣體礦物資源，包括多金屬結核；資源從「區域」回收之後稱為「礦物」。生物資源不屬第十一部分的「資源」，深海生物與海洋遺傳資源另由BBNJ協定規範。", "elements": [{"req": ["「區域」內原地的固體、液體或氣體礦物資源"], "effect": "屬第十一部分所稱「資源」（含多金屬結核）"}, {"req": ["從「區域」回收的資源"], "effect": "稱為「礦物」"}], "traps": ["陷阱：第十一部分的「資源」只限礦物；漁業資源屬公海制度。", "陷阱：「區域」只指海床底土，其上覆水域與上空的法律地位不受影響（第135條），仍是公海。"], "custom": {"status": "不適用", "note": "「區域」制度為公約創設。", "cases": []}, "related": ["unclos-1", "unclos-86", "unclos-135", "unclos-136", "unclos-137"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_7", "note": "選項A「國家管轄以外的海床和洋底及其底土」即「區域」，受海洋法公約第十一部分規範；正解C地心不受任何多邊公約規範。"}], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "136", "heading": "人類的共同繼承財產", "tier": "A", "paras": [{"n": "", "en": "The Area and its resources are the common heritage of mankind.", "zh": "「區域」及其資源是人類的共同繼承財產。"}], "keys": ["人類的共同繼承財產"], "plain": "本條是第十一部分的核心原則：{{國際海底區域}}及其資源是{{人類共同繼承財產}}。內涵包括：任何國家不得據為己有（第137條）；由國際機構代表全人類管理（國際海床管理局）；為全人類利益開發並公平分享收益（第140條）；專為和平目的利用（第141條）；保護海洋環境（第145條）。這個概念源自1967年馬爾他駐聯合國大使帕多在聯大的提議，以及1970年聯大第2749號決議。第311條第6項規定締約國不得修正本原則，也不得參加任何減損本原則的協定。", "elements": [{"req": ["「區域」及其資源"], "effect": "屬人類共同繼承財產：不得據為己有、由管理局代表全人類管理、為全人類利益開發並公平分享"}], "traps": ["陷阱：「區域」及其資源的法律性質是人類共同繼承財產，不是無主物、無主地或海洋保護區（gl112a_6正解C）。", "陷阱：1994年《關於執行第十一部分的協定》大幅修改第十一部分（例如取消強制技術轉讓與生產限額），但沒有改變人類共同繼承財產原則。", "陷阱：公海是「共有物」式的自由使用，「區域」則是共同繼承財產式的共同管理；兩者的法律性質不同。"], "custom": {"status": "部分", "note": "多數國家認為原則本身已成為習慣法，但美國等未加入公約的國家對其拘束力有不同看法。", "cases": []}, "related": ["unclos-1", "unclos-133", "unclos-137", "unclos-140", "unclos-141", "unclos-156", "unclos-311"], "cases": [], "roc": "", "essay": "「區域」的法律地位：「依第136條，「區域」及其資源是人類的共同繼承財產；任何國家不得主張主權或主權權利，也不得據為己有（第137條），資源權利屬全人類，由國際海床管理局代表行使，開發收益應公平分享（第140條）。」", "exam": [{"qid": "gl112a_6", "note": "正解C：依本條，「區域」及其資源為人類共同繼承財產。"}], "news": [{"text": "美國總統於2025年4月簽署第14285號行政命令，依美國國內法推動深海採礦；2026年3月美國國家海洋暨大氣總署認定總部在加拿大的金屬公司（The Metals Company）美國子公司的探勘與商業開採申請「實質符合」法定要求。國際海床管理局的採礦規章仍未完成，美國單方核發許可被批評繞過管理局、違反人類共同繼承財產原則。", "checked": "2026-10-06"}], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "137", "heading": "「區域」及其資源的法律地位", "tier": "A", "paras": [{"n": "1", "en": "No State shall claim or exercise sovereignty or sovereign rights over any part of the Area or its resources, nor shall any State or natural or juridical person appropriate any part thereof. No such claim or exercise of sovereignty or sovereign rights nor such appropriation shall be recognized.", "zh": "任何國家不應對「區域」的任何部份或其資源主張或行使主權或主權權利，任何國家或自然人或法人，也不應將「區域」或其資源的任何部分據為己有。任何這種主權和主權權利的主張或行使，或這種據為己有的行為，均應不予承認。"}, {"n": "2", "en": "All rights in the resources of the Area are vested in mankind as a whole, on whose behalf the Authority shall act. These resources are not subject to alienation. The minerals recovered from the Area, however, may only be alienated in accordance with this Part and the rules, regulations and procedures of the Authority.", "zh": "對「區域」內資源的一切權利屬於全人類，由管理局代表全人類行使，這種資源不得讓渡。但從「區域」內回收的礦物，只可按照本部份和管理局的規則、規章和程序予以讓渡。"}, {"n": "3", "en": "No State or natural or juridical person shall claim, acquire or exercise rights with respect to the minerals recovered from the Area except in accordance with this Part. Otherwise, no such claim, acquisition or exercise of such rights shall be recognized.", "zh": "任何國家或自然人或法人，除按照本部份外，不應對「區域」礦物主張取得或行使權利。否則，對於任何這種權利的主張，取得或行使，應不予承認。"}], "keys": ["不應對「區域」的任何部份或其資源主張或行使主權或主權權利", "由管理局代表全人類行使", "這種資源不得讓渡"], "plain": "第1項有三個「不」：任何國家不得對「區域」或其資源主張或行使主權或主權權利；任何國家、自然人或法人都不得把它據為己有；違反者一律不予承認。第2項：資源的一切權利屬於全人類，由國際海床管理局代表行使，資源本身不得讓渡；開採出來的「礦物」則可依第十一部分與管理局規則讓渡。第3項：不依第十一部分取得的礦物權利，不予承認，這是對未經管理局許可而單方開採的直接限制。", "elements": [{"req": ["任何國家", "對「區域」或其資源"], "effect": "不得主張或行使主權或主權權利"}, {"req": ["任何國家、自然人或法人"], "effect": "不得據為己有；違反者不予承認"}, {"req": ["「區域」內資源"], "effect": "權利屬全人類，由管理局代表行使，不得讓渡；回收的礦物依規則讓渡"}, {"req": ["未依第十一部分取得的礦物權利"], "effect": "不予承認"}], "traps": ["陷阱：連「主權權利」也不得主張（比較：沿海國對大陸礁層有主權權利，第77條）。", "陷阱：不只國家，自然人與法人也不得據為己有。", "陷阱：「資源」不得讓渡，但回收後的「礦物」可依管理局規則讓渡（第133條區分資源與礦物）。"], "custom": {"status": "部分", "note": "禁止對國際海床主張主權已有廣泛支持；具體的 ARTICLES.push({"treaty": "unclos", "no": "140", "heading": "全人類的利益", "tier": "B", "paras": [{"n": "1", "en": "Activities in the Area shall, as specifically provided for in this Part, be carried out for the benefit of mankind as a whole, irrespective of the geographical location of States, whether coastal or land-locked, and taking into particular consideration the interests and needs of developing States and of peoples who have not attained full independence or other self-governing status recognized by the United Nations in accordance with General Assembly resolution 1514 (XV) and other relevant General Assembly resolutions.", "zh": "「區域」內活動應依本部份的明確規定為全人類的利益而進行，不論各國的地理位置如何，也不論是沿海國或內陸國，並特別考慮到發展中國家和尚未取得完全獨立或聯合國按照其大會第1514(XV)號決議和其他有關大會決議所承認的其他自治地位的人民的利益和需要。"}, {"n": "2", "en": "The Authority shall provide for the equitable sharing of financial and other economic benefits derived from activities in the Area through any appropriate mechanism, on a non-discriminatory basis, in accordance with article 160, paragraph 2(f)(i).", "zh": "管理局應按照第一百六十條第二款(f)項(1)目作出規定，通過任何適當的機構，在無歧視的基礎上公平分配從「區域」內活動取得的財政及其他經濟利益。"}], "keys": ["為全人類的利益而進行", "公平分配從「區域」內活動取得的財政及其他經濟利益"], "plain": "「區域」內活動要為全人類的利益進行，不論國家的地理位置，沿海國或內陸國都一樣；並特別考慮發展中國家，以及尚未取得完全獨立或其他自治地位的人民。管理局應建立機制，在無歧視基礎上公平分配「區域」內活動的財政與經濟利益。第82條規定200海里以外大陸礁層開發應繳的費用或實物，也透過管理局分配。", "elements": [{"req": ["「區域」內活動"], "effect": "應為全人類利益進行，特別考慮發展中國家與未完全獨立人民的利益"}, {"req": ["管理局"], "effect": "應在無歧視基礎上公平分配「區域」內活動的財政及經濟利益"}], "traps": ["陷阱：受益者不限於締約國，條文特別提到尚未取得完全獨立或其他自治地位的人民。"], "custom": {"status": "不適用", "note": "利益分享機制為公約創設，管理局至今仍在研議具體分配規則。", "cases": []}, "related": ["unclos-82", "unclos-136", "unclos-137", "unclos-156", "unclos-160"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [{"date": "2026-10-06", "type": "新增", "text": "第2C批新增本條。"}, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「第 1514(xv)號決議」依英文作準本統一寫作「第1514(XV)號決議」（格式調整）。"}]});

  "facts": "菲律賓與中國在南海的島礁與海域爭議長期未決。2012年黃岩島對峙後，菲律賓依公約附件七提起仲裁，請求仲裁庭判斷：中國依「九段線」主張的歷史性權利是否符合公約；南沙群島與黃岩島各地物屬於島嶼、岩礁或低潮高地；中國在菲律賓專屬經濟海域內阻撓捕魚與油氣探勘、大規模填海造陸等行為是否違法。菲律賓沒有請求仲裁庭判斷島礁主權或劃定海域界線：主權問題不屬公約的解釋或適用，劃界爭端則已被中國2006年依第298條所作的聲明排除。中國不參與程序，仲裁庭依附件七第9條在一方缺席下繼續進行，2015年10月29日作成管轄權與可受理性判斷，2016年7月12日作成實體判斷。",

    "第121條第3項：以地物在自然狀態下的客觀能力判斷，須能維持穩定人類社群的居住，或不依賴外來資源的獨立經濟生活；歷史上的短暫居住、駐軍或政府人員駐守、依賴外部補給都不足以證明。南沙群島所有高潮地物（含太平島）及黃岩島都是岩礁，不能有專屬經濟海域或大陸礁層。",

  "significance": "這是國際裁判機構首次全面解釋第121條第3項，標準相當嚴格，可能影響許多國家對偏遠小島主張的專屬經濟海域。依公約第296條與附件七第11條，判斷對當事國有拘束力，但中國拒絕承認，也沒有執行機制。我國不是當事方，也未受邀表示意見；中華民國國際法學會曾向仲裁庭提出法庭之友意見，說明太平島有淡水、農作與長期居住的事實，仲裁庭仍認定為岩礁，總統府聲明不接受該判斷。考試重點：①菲律賓依第287條與附件七提起強制仲裁（gl114a_17）；②第121條第3項的判斷標準；③判斷對我國沒有國內法效力（gl111a_2）。",

  "facts": "塞加號是懸掛聖文森及格瑞那丁旗幟的油輪，1997年10月27日在幾內亞專屬經濟海域內向漁船供應燃油。幾內亞認為這違反其海關法令（幾內亞把海關法令擴大適用到專屬經濟海域內的大片區域），派巡邏艇追逐，於10月28日在幾內亞專屬經濟海域以外攔截，登船時使用實彈，造成船員受傷，並扣押船舶與船貨、判處船長刑罰。法庭先於1997年12月4日在第1號案命幾內亞迅速釋放船舶與船員；本案（第2號）處理實體問題。",

ARTICLES.push({"treaty": "unclos", "no": "279", "heading": "用和平方法解決爭端的義務", "tier": "B", "paras": [{"n": "", "en": "States Parties shall settle any dispute between them concerning the interpretation or application of this Convention by peaceful means in accordance with Article 2, paragraph 3, of the Charter of the United Nations and, to this end, shall seek a solution by the means indicated in Article 33, paragraph 1, of the Charter.", "zh": "各締約國應按照「聯合國憲章」第二條第三項以和平方法解決它們之間有關本公約的解釋或適用的任何爭端，並應為此目的以「憲章」第三十三條第一項所指的方法求得解決。"}], "keys": ["以和平方法解決它們之間有關本公約的解釋或適用的任何爭端", "第三十三條第一項所指的方法"], "plain": "第十五部分的總綱。締約國之間凡是關於公約「解釋或適用」的爭端，都必須用和平方法解決；本條直接引用[[art|unc-2|憲章第2條第3項]]的和平解決義務，以及[[art|unc-33|憲章第33條第1項]]列出的方法（談判、調查、調停、和解、仲裁、司法解決、區域機關等）。本條本身不指定某一種方法，選擇權仍在當事國（第280條）；只有在第一節的方法都無法解決時，才進入第二節的強制程序（第286條）。注意適用範圍限於「本公約的解釋或適用」：單純的島嶼主權爭端不屬之，這也是[[case|south-china-sea|南海仲裁案]]中管轄權爭執的起點。", "elements": [{"req": ["締約國之間的爭端", "涉及本公約的解釋或適用"], "effect": "負有以和平方法解決的義務，並應以憲章第33條第1項所列方法求得解決"}], "traps": ["陷阱：本條只要求「以和平方法」解決，並未強制交付特定法院；強制程序規定在第二節（第286、287條）。"], "custom": {"status": "習慣法", "note": "和平解決爭端原則本身已具習慣法地位（尼加拉瓜案）；本條是把該原則適用於海洋法公約的爭端。", "cases": ["nicaragua"]}, "related": ["unclos-280", "unclos-283", "unclos-286", "unc-2", "unc-33"], "cases": [], "roc": "我國不是公約締約國，無法使用第十五部分的任何程序；與鄰國的海域爭議只能透過雙邊談判或協議處理，例如2013年《台日漁業協議》與2015年台菲漁業執法合作協定。", "essay": "爭端解決的層次：「公約第十五部分採『先自選、後強制』的結構：第一節要求締約國以和平方法解決爭端（第279條），並尊重其自行選擇的方法（第280–282條）；第一節無法解決時，才依第二節提交導致有拘束力裁判的強制程序（第286條以下），但受第三節的限制與例外拘束（第297、298條）。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "280", "heading": "用爭端各方選擇的任何和平方法解決爭端", "tier": "B", "paras": [{"n": "", "en": "Nothing in this Part impairs the right of any States Parties to agree at any time to settle a dispute between them concerning the interpretation or application of this Convention by any peaceful means of their own choice.", "zh": "本公約的任何規定均不損害任何締約國於任何時候協議用自行選擇的任何和平方法解決它們之間有關本公約的解釋或適用的爭端的權利。"}], "keys": ["於任何時候協議用自行選擇的任何和平方法"], "plain": "當事國的選擇權優先：締約國隨時可以協議用自己選擇的任何和平方法解決公約爭端，例如雙邊談判、交付國際法院、特別仲裁。第十五部分的強制程序是「備位」機制，在當事國沒有另行協議或協議方法失敗時才登場。第281、282條進一步規定，當事國自選的方法與公約程序之間如何銜接。", "elements": [{"req": ["締約國之間有關本公約解釋或適用的爭端", "當事國協議採用自選的和平方法"], "effect": "得隨時依該方法解決，不受第十五部分程序妨礙"}], "traps": [], "custom": {"status": "不適用", "note": "程序性規定。", "cases": []}, "related": ["unclos-279", "unclos-281", "unclos-282"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第2D-1批新增本條。"}]});
ARTICLES.push({"treaty": "unclos", "no": "281", "heading": "爭端各方在爭端未得到解決時所適用的程序", "tier": "A", "paras": [{"n": "1", "en": "If the States Parties which are parties to a dispute concerning the interpretation or application of this Convention have agreed to seek settlement of the dispute by a peaceful means of their own choice, the procedures provided for in this Part apply only where no settlement has been reached by recourse to such means and the agreement between the parties does not exclude any further procedure.", "zh": "作為有關本公約的解釋或適用的爭端各方的締約各國，如已協議用自行選擇的和平方法來謀求解決爭端，則只有在訴諸這種方法而仍未得到解決以及爭端各方間的協議並不排除任何其他程序的情形下，才適用本部份所規定的程序。"}, {"n": "2", "en": "If the parties have also agreed on a time-limit, paragraph 1 applies only upon the expiration of that time-limit.", "zh": "爭端各方如已就時限也達成協議，則只有在該時限屆滿時才適用第一款。"}], "keys": ["訴諸這種方法而仍未得到解決", "爭端各方間的協議並不排除任何其他程序"], "plain": "當事國已經約定用某種自選方法解決爭端時，要進入第十五部分的程序，必須同時符合兩個條件：①已訴諸該方法但仍未解決；②當事國之間的協議沒有排除其他程序。若協議另訂期限，須等期限屆滿（第2項）。爭點在於「排除其他程序」要多明確：[[case|southern-bluefin-tuna|南方黑鮪案]]（2000）仲裁庭多數認為，1993年《南方黑鮪養護公約》第16條要求爭端須經全體同意才交付司法或仲裁，已足以排除公約的強制程序，因而自認無管轄權；[[case|south-china-sea|南海仲裁案]]（2015年管轄權判斷）則認為第281條原則上需要「明示」排除，並認定2002年《南海各方行為宣言》是政治文件、不是排除強制程序的協議，因此不妨礙仲裁。", "elements": [{"req": ["爭端各方已協議以自選的和平方法解決", "訴諸該方法仍未解決", "該協議未排除其他程序", "若有約定時限，時限已屆滿"], "effect": "得適用第十五部分的程序"}, {"req": ["爭端各方的協議排除其他程序"], "effect": "不得提交第十五部分的程序（南方黑鮪案多數意見；南海仲裁案要求明示排除）"}], "traps": ["陷阱：第281條看的是當事國自選方法「有沒有排除其他程序」，不是只要有雙邊協議就一律排除強制程序。", "陷阱：南方黑鮪案的仲裁庭是「附件七仲裁庭」，不是國際海洋法法庭；法庭只在仲裁庭組成前作成臨時措施命令（1999），仲裁庭其後認定自己無管轄權並撤銷該命令。", "陷阱：南海仲裁案認定《南海各方行為宣言》（2002）不具法律拘束力，不構成第281條的排除協議。"], "custom": {"status": "不適用", "note": "條約程序規定。", "cases": []}, "related": ["unclos-280", "unclos-282", "unclos-286", "unclos-a7-9"], "cases": [{"id": "southern-bluefin-tuna", "point": "仲裁庭多數認為《南方黑鮪養護公約》第16條已排除進一步程序，依第281條第1項無管轄權。"}, {"id": "south-china-sea", "point": "第281條需明示排除；《南海各方行為宣言》是政治文件，不構成排除強制程序的協議。"}], "roc": "", "essay": "第281條：「當事國已約定以自選方法解決爭端者，須訴諸該方法仍未解決，且協議未排除其他程序，始得適用第十五部分。南方黑鮪案採寬鬆解釋，認為須經全體同意才可交
