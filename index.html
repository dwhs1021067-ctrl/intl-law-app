n  (a.paras || []).forEach((p, i) => { if (!p.en || !p.zh) errors.push('條文段落缺中文或英文：' + id + ' #' + i); });\n  if ((a.tier === 'A') && !(a.traps || []).length) errors.push('A級條文無陷阱：' + id);\n  (a.keys || []).forEach(k => { if (!(a.paras || []).some(p => p.zh.includes(k))) errors.push('關鍵字未出現在中文條文：' + id + '「' + k + '」'); });\n  (a.related || []).forEach(r => checkArtRef(r, id + '.related'));\n  (a.cases || []).forEach(c => { if (!valid.case.has(c.id)) errors.push('條文引用不存在判例：' + id + ' → ' + c.id); });\n  ((a.custom || {}).cases || []).forEach(c => { if (!valid.case.has(c)) errors.push('習慣法欄位引用不存在判例：' + id + ' → ' + c); });\n  (a.exam || []).forEach(e => { if (!examIds.has(e.qid)) errors.push('考古題 id 不存在：' + id + ' → ' + e.qid); });\n  (a.changelog || []).forEach(c => { if (!c.date || !c.type || !c.text) errors.push('更新紀錄欄位不完整：' + id); });\n  (a.news || []).forEach(n => { if (!n.checked) errors.push('時事缺查證日期：' + id); });\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(a.verified || '')) errors.push('查證日期格式錯誤：' + id);\n});\nCASES.forEach(c => {\n  ['nameZh', 'nameEn', 'court', 'year', 'date', 'kind', 'facts', 'issues', 'holding', 'significance', 'articles', 'exam', 'verified', 'srcUrl'].forEach(k => { if (c[k] === undefined || c[k] === '') errors.push('判例缺欄位 ' + k + '：' + c.id); });\n  (c.articles || []).forEach(r => checkArtRef(r, 'case:' + c.id));\n  (c.exam || []).forEach(q => { if (!examIds.has(q)) errors.push('判例考古題 id 不存在：' + c.id + ' → ' + q); });\n  // 雙向：判例列出的已收錄條文，該條應在 cases 欄位列出此判例\n  (c.articles || []).filter(r => valid.art.has(r)).forEach(r => {\n    const a = ARTICLES.find(x => x.treaty + '-' + x.no === r);\n    if (!(a.cases || []).some(x => x.id === c.id) && !((a.custom || {}).cases || []).includes(c.id)) warns.push('單向連結（條文頁未列此判例）：' + r + ' ← ' + c.id);\n  });\n});\nARTICLES.forEach(a => (a.cases || []).forEach(c => { const cs = CASES.find(x => x.id === c.id); if (cs && !cs.articles.includes(a.treaty + '-' + a.no)) warns.push('單向連結（判例卡未列此條）：' + c.id + ' ← ' + a.treaty + '-' + a.no); }));\nCONCEPTS.forEach(c => {\n  (c.cases || []).forEach(x => { if (!valid.case.has(x)) errors.push('概念卡引用不存在判例：' + c.id + ' → ' + x); });\n  (c.articles || []).forEach(r => checkArtRef(r, 'concept:' + c.id));\n  (c.exam || []).forEach(q => { if (!examIds.has(q)) errors.push('概念卡考古題 id 不存在：' + c.id + ' → ' + q); });\n});\n// 申論題\nconst planned = new Set(); let essayPending = 0;\nESSAYS.forEach(e => {\n  ['id', 'year', 'exam', 'code', 'paper', 'no', 'points', 'topic', 'key', 'stem', 'arts', 'treaties', 'cases', 'concepts'].forEach(k => { if (e[k] === undefined || e[k] === '') errors.push('申論題缺欄位 ' + k + '：' + e.id); });\n  if (!/^es\\d{3}[ldeg]_\\d$/.test(e.id)) errors.push('申論題 id 格式錯誤：' + e.id);\n  if (/涉外民事|準據法/.test(e.stem)) errors.push('申論題疑似國際私法：' + e.id);\n  (e.arts || []).forEach(a => {\n    if (valid.art.has(a)) return;\n    const t = a.split('-')[0];\n    if (T[t]) { checkArtRef(a, 'essay:' + e.id); essayPending++; }\n    else if (PLANNED[t]) { planned.add(t); essayPending++; }\n    else errors.push('申論題引用未知條約：' + e.id + ' → ' + a);\n  });\n  (e.cases || []).forEach(c => { if (c.id && !valid.case.has(c.id)) errors.push('申論題引用不存在判例：' + e.id + ' → ' + c.id); if (!c.id && !c.label) errors.push('申論題判例缺名稱：' + e.id); });\n  (e.concepts || []).forEach(c => { if (c.id && !(valid[c.type] && valid[c.type].has(c.id))) errors.push('申論題引用不存在概念或比較表：' + e.id + ' → ' + c.type + '|' + c.id); });\n  if (e.outline && (!Array.isArray(e.outline.points) || !e.outline.points.length || !e.outline.verified)) errors.push('答題架構格式錯誤：' + e.id);\n});\n\n// 內文 [[type|id|label]] 與 {{詞條}}\nconst all = JSON.stringify({ TREATIES, ARTICLES, CASES, CONCEPTS, COMPARISONS, GLOSSARY, OUTLINES: ESSAYS.map(e => e.outline || null) });\nconst links = [...all.matchAll(/\\[\\[([a-z]+)\\|([a-z0-9-]+)\\|/g)].map(m => [m[1], m[2]]);\nlinks.forEach(([t, id]) => { if (t === 'art') checkArtRef(id, 'inline'); else if (!valid[t]) errors.push('未知連結類型：' + t + '|' + id); else if (!valid[t].has(id)) errors.push('壞連結：' + t + '|' + id); });\nconst terms = [...all.matchAll(/\\{\\{(.*?)\\}\\}/g)].map(m => m[1]);\nconst unresolved = [...new Set(terms.filter(t => !(t in GLOSSARY)))];\nif (unresolved.length) errors.push('未解析詞條：' + unresolved.join('、'));\nObject.entries(GLOSSARY).forEach(([k, g]) => ['en', 'tw', 'cn', 'def'].forEach(f => { if (!g[f]) errors.push('用語缺欄位 ' + f + '：' + k); }));\n// 大陸用語檢查（白話與說明欄位）\nconst CN_WORDS = ['毗連區', '专属经济区', '專屬經濟區', '大陸架', '信息', '質量', '咨询'];\nARTICLES.forEach(a => { const txt = [a.plain, a.essay, a.roc].concat(a.traps || []).join(''); CN_WORDS.forEach(w => { if (txt.includes(w)) warns.push('疑似大陸用語「' + w + '」：' + a.treaty + '-' + a.no); }); });\n// 考古題覆蓋\nconst mapped = new Set(); ARTICLES.forEach(a => (a.exam || []).forEach(e => mapped.add(e.qid))); CASES.forEach(c => c.exam.forEach(q => mapped.add(q))); CONCEPTS.forEach(c => c.exam.forEach(q => mapped.add(q)));\nout.push('jump links  ' + links.length + '  term refs ' + terms.length);\nout.push('考古題已對應 ' + mapped.size + ' / ' + EXAMS.length);\nout.push('申論題引用待收錄條文 ' + essayPending + ' 處（涉及尚未收錄的條約：' + [...planned].join('、') + '）');\nout.push('待收錄連結（後續批次）' + pending.size + '：' + [...pending].sort().join(' '));\nout.push('警告 ' + warns.length + (warns.length ? '\\n  ' + warns.join('\\n  ') : ''));\nout.push('錯誤 ' + errors.length + (errors.length ? '\\n  ' + errors.join('\\n  ') : ''));\nconsole.log(out.join('\\n'));\nprocess.exit(errors.length ? 1 : 0);\n",
"smoke_test.js": "// 用法：先 npm install jsdom@24，再 node smoke_test.js <index.html 路徑>\n// 模擬瀏覽器：開目錄、跳轉輸入、搜尋、標記、返回、滑動換條，並把所有條文（四分頁×三種文字模式×測驗開關）、\n// 判例卡、概念卡、比較表、概要卡、各彙整頁、測驗、匯出全部渲染一次，回報錯誤數。錯誤數必須為 0。\nconst { JSDOM } = require('jsdom'); const fs = require('fs');\nconst errors = [];\nconst dom = new JSDOM(fs.readFileSync(process.argv[2] || 'index.html', 'utf8'), {\n  runScripts: 'dangerously', url: 'https://example.org/',\n  beforeParse(w) { w.scrollTo = () => {}; w.addEventListener('error', e => errors.push('window error: ' + e.message)); }\n});\nconst w = dom.window, d = w.document; w.console.error = (...a) => errors.push(a.join(' '));\nconst $ = q => d.querySelector(q), $$ = q => [...d.querySelectorAll(q)];\nconst click = el => { if (!el) { errors.push('找不到要點擊的元素'); return; } el.dispatchEvent(new w.MouseEvent('click', { bubbles: true })); };\nconst out = [];\nconst S = w.eval('state');\n\n// 1. 首頁與目錄\nout.push('首頁標題：' + ($('.home-hero h1') || {}).textContent);\nout.push('首頁版本：' + (($('.app-version') || {}).textContent || '無'));\nclick($('#menu-btn'));\nout.push('目錄條約群組：' + $$('.acc-group-title').map(x => x.textContent.replace(/\\s+/g, ' ')).join(' | '));\nclick($('[data-acc=\"t-icj\"]'));\nout.push('規約展開後條目數：' + $$('.acc-body.open .ttl').length);\nclick($$('.acc-body.open .ttl')[8]);\nout.push('點目錄第9條後路由：' + S.route + '/' + S.id + '　返回鈕：' + !!$('#back-btn'));\n\n// 2. 跳轉輸入\nfunction jump(q) { const inp = $('#jump-input'); inp.value = q; click($('[data-act=\"jump\"]')); return S.route + '/' + (S.id || '') + (S.jumpMsg ? '（' + S.jumpMsg + '）' : ''); }\nout.push('跳轉「憲章 51」→ ' + jump('憲章 51'));\nout.push('跳轉「規約第38條」→ ' + jump('規約第38條'));\nout.push('跳轉「icj 36」→ ' + jump('icj 36'));\nout.push('跳轉「UNCLOS 121」→ ' + jump('UNCLOS 121'));\nout.push('跳轉「憲章 61」→ ' + jump('憲章 61'));\nout.push('跳轉「海洋法 附件七 9」→ ' + jump('海洋法 附件七 9'));\nout.push('跳轉「unclos 附7-3」→ ' + jump('unclos 附7-3'));\n\n// 3. 內文跳轉連結與返回\nw.eval(\"go('art/icj-38')\");\nclick($$('[data-act=\"tab\"]')[2]);\nconst before = S.id; click($('.case-ref .jumplink'));\nout.push('實務分頁點判例連結：' + before + ' → ' + S.route + '/' + S.id);\nw.eval(\"go('cmp/icj-jurisdiction')\");\nconst jl = $$('.jumplink').filter(x => x.getAttribute('data-href'));\nout.push('比較表內跳轉連結數：' + jl.length);\n\n// 4. 詞條彈出\nw.eval(\"go('art/icj-31')\"); click($$('[data-act=\"tab\"]')[1]);\nclick($('.term'));\nout.push('詞條彈窗：' + (($('.pop h3') || {}).textContent || '無'));\nclick($('[data-act=\"close-pop\"]'));\n\n// 5. 搜尋\nclick($('#search-btn')); const si = $('#search-input'); si.value = '自衛'; si.dispatchEvent(new w.Event('input', { bubbles: true }));\nout.push('搜尋「自衛」結果類型：' + [...new Set($$('.sr-type').map(x => x.textContent))].join(',') + '，筆數 ' + $$('.search-result-item').length);\nsi.value = 'ex aequo'; si.dispatchEvent(new w.Event('input', { bubbles: true }));\nout.push('搜尋「ex aequo」筆數：' + $$('.search-result-item').length);\nclick($('[data-act=\"close-search\"]'));\n\n// 6. 標記與已讀（localStorage）\nw.eval(\"go('art/unc-51')\"); click($('[data-act=\"star\"]')); click($('[data-act=\"read\"]'));\nout.push('標記後 localStorage：' + w.localStorage.getItem('ilapp-progress-v1'));\n\n// 7. 上一條／下一條與滑動\nw.eval(\"go('art/icj-2')\"); click($('[data-act=\"next\"]')); const afterNext = S.id;\nconst app = $('#app');\nconst touch = (x, y, type) => { const ev = new w.Event(type, { bubbles: true }); ev[type === 'touchstart' ? 'touches' : 'changedTouches'] = [{ clientX: x, clientY: y }]; app.dispatchEvent(ev); };\ntouch(300, 200, 'touchstart'); touch(100, 205, 'touchend');\nout.push('下一條：icj-2 → ' + afterNext + '；左滑 → ' + S.id);\n\n// 8. 考點陷阱、勘誤、考古題、測驗、匯出\nw.eval(\"go('home')\"); click($('#menu-btn')); click($('[data-goto-traps]'));\nout.push('考點陷阱頁條目：' + $$('.trap-item').length);\nw.eval(\"go('errata')\"); out.push('勘誤清單（更正／待查／備註）：' + $$('.box.log').length);\nw.eval(\"go('exams')\"); out.push('考古題對照頁題數：' + $$('details.q').length);\nw.eval(\"go('essays')\"); const coreN = $$('.essay-item').length;\nclick($('[data-act=\"esfilter\"][data-f=\"all\"]')); const allN = $$('.essay-item').length;\nclick($('[data-act=\"esfilter\"][data-f=\"outline\"]')); const olN = $$('.essay-item').length;\nout.push('申論題頁：語組 ' + coreN + '／全部 ' + allN + '／有答題架構 ' + olN);\nclick($('.essay-item')); const olBefore = !!$('.outline'); click($('[data-act=\"reveal\"]'));\nout.push('申論題詳頁：' + S.route + '/' + S.id + '　架構先隱藏 ' + !olBefore + '　點擊後顯示 ' + !!$('.outline'));\nw.eval(\"go('art/unc-2')\"); click($$('[data-act=\"tab\"]')[3]);\nout.push('憲章第2條考試分頁的申論題數：' + $$('.essay-item').length);\nw.eval(\"go('practice')\");\n['cloze', 'which', 'match'].forEach(t => { w.eval(\"state.practiceType='\" + t + \"';state.practice=null;render()\"); click($('.opt-btn')); });\nout.push('測驗三題型作答後解答框：' + !!$('.opt-btn.right'));\nw.eval(\"go('export')\"); click($('[data-act=\"export\"]'));\nlet exp = []; try { exp = JSON.parse($('#export-text').value); } catch (e) { errors.push('匯出 JSON 解析失敗：' + e.message); }\nconst badExp = exp.filter(q => !(q.id && q.exam === '國際公法' && q.part === '' && q.stem && Array.isArray(q.options) && q.options.length === 4 && q.answer >= 0 && q.answer < 4 && q.legal && q.legal.flagged === false));\nout.push('匯出題數：' + exp.length + '，格式不符：' + badExp.length + '，id 重複：' + (exp.length - new Set(exp.map(q => q.id)).size));\nconst exp2 = w.eval('JSON.stringify(buildExport())');\nout.push('匯出結果可重現：' + (exp2 === JSON.stringify(exp)));\n\n// 9. 全卡渲染\nconst res = w.eval(`(function(){\n  var errs = [], n = 0;\n  function tryR(label){ try { render(); n++; if (!document.getElementById('app').innerHTML) errs.push(label + ' 空白'); } catch (e) { errs.push(label + ' ' + e.message); } }\n  ARTICLES.forEach(function(a){ ['text','explain','practice','exam'].forEach(function(tab){ ['both','zh','en'].forEach(function(m){ [false,true].forEach(function(q){ [false,true].forEach(function(rv){\n    state.route='art'; state.id=artId(a); state.tab=tab; state.textMode=m; state.quiz=q; state.revealed=rv; tryR(artId(a)+' '+tab+' '+m+' quiz='+q+' rv='+rv); }); }); }); }); });\n  state.quiz=false;\n  CASES.forEach(function(c){ [false,true].forEach(function(q){ state.route='case'; state.id=c.id; state.quiz=q; state.revealed=false; tryR('case '+c.id); }); });\n  CONCEPTS.forEach(function(c){ state.route='concept'; state.id=c.id; tryR('concept '+c.id); });\n  COMPARISONS.forEach(function(c){ state.route='cmp'; state.id=c.id; tryR('cmp '+c.id); });\n  TREATIES.forEach(function(t){ state.route='treaty'; state.id=t.id; tryR('treaty '+t.id); });\n  ['home','glossary','traps','errata','exams','practice','export','cases','concepts','cmps','essays'].forEach(function(r){ state.route=r; state.id=null; tryR(r); });\n  ['core','d','other','outline','all'].forEach(function(f){ state.route='essays'; state.essayFilter=f; tryR('essays '+f); });\n  ESSAYS.forEach(function(e){ [false,true].forEach(function(rv){ state.route='essay'; state.id=e.id; state.revealed=rv; tryR('essay '+e.id); }); });\n  state.revealed=false;\n  ['all','mapped','unmapped','dip','bar'].forEach(function(f){ state.route='exams'; state.examFilter=f; tryR('exams '+f); });\n  state.quiz=false; state.drawer=true; TREATIES.forEach(function(t){ state.openAcc['t-'+t.id]=true; }); state.route='home'; tryR('drawer');\n  state.drawer=false; state.search=true; ['規約','self-defence','公斷','海盜','不存在的字串xyz'].forEach(function(q){ state.searchQ=q; tryR('search '+q); }); state.search=false;\n  Object.keys(GLOSSARY).forEach(function(k){ state.pop=k; tryR('pop '+k); }); state.pop=null;\n  for (var i=0;i<60;i++){ ['cloze','which','match'].forEach(function(t){ try { var q=makeQuestion(t); if(q.options.length!==4||q.answer<0) errs.push('測驗題異常 '+t); } catch(e){ errs.push('makeQuestion '+t+' '+e.message); } }); }\n  return { n: n, errs: errs };\n})()`);\nout.push('全卡渲染次數：' + res.n + '　錯誤數：' + res.errs.length + (res.errs.length ? '　' + res.errs.slice(0, 5).join(' ; ') : ''));\n// 10. 直接以網址錨點開啟\nconst dom2 = new JSDOM(fs.readFileSync(process.argv[2] || 'index.html', 'utf8'), { runScripts: 'dangerously', url: 'https://example.org/#art/unc-2', beforeParse(w2) { w2.scrollTo = () => {}; w2.addEventListener('error', e => errors.push('window2 error: ' + e.message)); } });\nout.push('以 #art/unc-2 開啟：' + dom2.window.document.querySelector('.art-heading').textContent);\nconst dom3 = new JSDOM(fs.readFileSync(process.argv[2] || 'index.html', 'utf8'), { runScripts: 'dangerously', url: 'https://example.org/#art/unc-999', beforeParse(w3) { w3.scrollTo = () => {}; w3.addEventListener('error', e => errors.push('window3 error: ' + e.message)); } });\nout.push('以不存在錨點開啟回首頁：' + !!dom3.window.document.querySelector('.home-hero'));\n\nout.push('腳本錯誤數：' + errors.length + (errors.length ? '　' + errors.slice(0, 5).join(' ; ') : ''));\nconsole.log(out.join('\\n'));\nprocess.exit(res.errs.length + errors.length ? 1 : 0);\n",
"gen_md.py": "# -*- coding: utf-8 -*-\n\"\"\"由 index.html 產生 Obsidian 可用的 .md 講義（內容與 App 同步）。\n用法：python3 gen_md.py <index.html 路徑> <輸出資料夾>\n需要 node（用來執行 index.html 內的資料區段）。\"\"\"\nimport json, re, os, subprocess, sys\n\nHTML = sys.argv[1] if len(sys.argv) > 1 else 'index.html'\nOUT = sys.argv[2] if len(sys.argv) > 2 else 'md'\nos.makedirs(OUT, exist_ok=True)\n_js = r\"\"\"\nconst h = require('fs').readFileSync(process.argv[1], 'utf8');\nconst s = h.split('<script>')[1].split('<\/script>')[0];\nconst i = s.indexOf(\"\\nfunction esc\");\nif (i < 0) { console.error('找不到資料區段結尾標記 function esc'); process.exit(2); }\nconst D = new Function(s.slice(0, i) + ';return {TREATIES,ARTICLES,CASES,CONCEPTS,COMPARISONS,GLOSSARY,EXAMS,EXAM_FLAGS,ESSAYS:(typeof ESSAYS!==\"undefined\"?ESSAYS:[]),PLANNED:(typeof TREATY_NAMES_PLANNED!==\"undefined\"?TREATY_NAMES_PLANNED:{})};')();\nprocess.stdout.write(JSON.stringify(D));\n\"\"\"\nD = json.loads(subprocess.run(['node', '-e', _js, HTML], capture_output=True, text=True, check=True).stdout)\nT = {t['id']: t for t in D['TREATIES']}\nEX = {q['id']: q for q in D['EXAMS']}\n\ndef num(no):\n    m = re.search(r'\\d+', str(no)); return int(m.group()) if m else 0\ndef aid(a): return f\"{a['treaty']}-{a['no']}\"\nARTS = sorted(D['ARTICLES'], key=lambda a: (list(T).index(a['treaty']), num(a['no'])))\nART = {aid(a): a for a in ARTS}\nFILE_OF_TREATY = {t: T[t]['titleZh'] for t in T}\n\nTARGET = {}\nfor a in ARTS: TARGET[('art', aid(a))] = (FILE_OF_TREATY[a['treaty']], f\"第{a['no']}條　{a['heading']}\")\nfor c in D['CASES']: TARGET[('case', c['id'])] = ('判例卡', f\"{c['nameZh']}（{c['year']}）\")\nfor c in D['CONCEPTS']: TARGET[('concept', c['id'])] = ('概念卡與比較表', c['title'])\nfor c in D['COMPARISONS']: TARGET[('cmp', c['id'])] = ('概念卡與比較表', c['title'])\nfor t in T.values(): TARGET[('treaty', t['id'])] = (t['titleZh'], '條約概要')\nGROUP = {'l': '外交特考各語組', 'd': '外交特考國際法組', 'e': '國際經濟商務人員特考', 'g': '高考國際文教行政'}\ndef eshead(e): return f\"{e['year']}年{GROUP[e['code']]}第{e['no']}題\"\nfor e in D['ESSAYS']: TARGET[('essay', e['id'])] = ('申論考古題', eshead(e))\nESS_OF = {}\nfor e in D['ESSAYS']:\n    for a in e['arts']: ESS_OF.setdefault(('art', a), []).append(e)\n    for c in e['cases']:\n        if c['id']: ESS_OF.setdefault(('case', c['id']), []).append(e)\n    for c in e['concepts']:\n        if c['id']: ESS_OF.setdefault((c['type'], c['id']), []).append(e)\n\ndef link(kind, i, label, here):\n    t = TARGET.get((kind, i))\n    if not t: return f\"{label}（待收錄）\"\n    f, h = t\n    return f\"[[#{h}|{label}]]\" if f == here else f\"[[{f}#{h}|{label}]]\"\ndef artlabel(i):\n    p = i.split('-'); return f\"{T[p[0]]['short'] if p[0] in T else D['PLANNED'].get(p[0], p[0])}第{'-'.join(p[1:])}條\"\ndef md(text, here):\n    text = text or ''\n    text = re.sub(r'\\[\\[([a-z]+)\\|([a-z0-9-]+)\\|(.*?)\\]\\]', lambda m: link(m.group(1), m.group(2), m.group(3), here), text)\n    return re.sub(r'\\{\\{(.*?)\\}\\}', r'\\1', text)\ndef header(title, desc, count):\n    return f\"# {title}\\n\\n> {desc}本檔案由 index.html 網頁 App 資料自動轉換生成，內容與 App 同步，請勿直接修改。\\n> {count}\\n\\n---\\n\\n\"\ndef exam_md(qid, note, here):\n    q = EX.get(qid)\n    if not q: return f\"- {qid}（題庫中找不到）\"\n    s = f\"- **{q['src']}　{qid}**：{q['stem']}\\n\"\n    for i, o in enumerate(q['options']):\n        s += f\"    - {'ABCD'[i]}. {o}{'　✔' if i == q['answer'] else ''}\\n\"\n    if note: s += f\"    - 說明：{md(note, here)}\\n\"\n    if qid in D['EXAM_FLAGS']: s += f\"    - ⚠ {D['EXAM_FLAGS'][qid]}\\n\"\n    return s.rstrip('\\n')\n\ndef article_block(a, here):\n    L = [f\"### 第{a['no']}條　{a['heading']}\", '', f\"`{a['tier']}級`　最後查證：{a['verified']}\", '']\n    for p in a['paras']:\n        n = f\"**{p['n']}.** \" if p['n'] else ''\n        L += [f\"{n}{p['zh']}\".replace('\\n', '  \\n'), '', f\"> {p['en']}\".replace('\\n', '  \\n> '), '']\n    L += ['**白話解釋**：' + md(a['plain'], here), '', '**構成要件 → 法律效果**：']\n    for e in a['elements']:\n        L.append('- ' + '＋'.join(md(r, here) for r in e['req']) + ' ⇒ ' + md(e['effect'], here))\n    L += ['', '**常見誤解與陷阱**：'] + ['- ' + md(x, here) for x in a['traps']]\n    c = a.get('custom') or {}\n    L += ['', f\"**習慣法地位**：〔{c.get('status', '未確認')}〕{md(c.get('note', ''), here)}\"]\n    if a['cases']:\n        L += ['', '**判決與實踐**：'] + [f\"- {link('case', x['id'], TARGET.get(('case', x['id']), ('', x['id']))[1], here)}：{md(x['point'], here)}\" for x in a['cases']]\n    if a.get('roc'): L += ['', '**我國實踐**：' + md(a['roc'], here)]\n    if a.get('essay'): L += ['', '**申論用法**：' + md(a['essay'], here)]\n    if a['exam']: L += ['', f\"**考古題（{len(a['exam'])}）**：\"] + [exam_md(e['qid'], e['note'], here) for e in a['exam']]\n    if a['news']: L += ['', '**時事連結**：'] + [f\"- {md(n['text'], here)}（最後查證 {n['checked']}）\" for n in a['news']]\n    if a['related']: L += ['', '**相關條文**：' + '、'.join(link('art', r, artlabel(r), here) for r in a['related'])]\n    es = ESS_OF.get(('art', aid(a)), [])\n    if es: L += ['', f\"**申論題（{len(es)}）**：\"] + [f\"- {link('essay', e['id'], eshead(e), here)}：{e['key']}\" for e in sorted(es, key=lambda e: (e['code'] != 'l', -e['year']))]\n    L += ['', '**更新紀錄**：'] + [f\"- {x['date']}　{x['type']}：{md(x['text'], here)}\" for x in a['changelog']]\n    return '\\n'.join(L) + '\\n'\n\nfiles = {}\nfor tid, t in T.items():\n    here = t['titleZh']; arts = [a for a in ARTS if a['treaty'] == tid]\n    s = header(f\"《{t['titleZh']}》逐條講義\", f\"{t['titleEn']}。\", f\"已收錄條文：{len(arts)} 條\")\n    s += \"## 條約概要\\n\\n\"\n    for k, v in [('通過', t['adopted']), ('生效', t['inForce']), ('締約狀況', t['parties']), ('結構', t['structure']), ('我國關係', t['rocStatus']), ('中文本來源', t['zhSource']['label'] + '。' + t['zhSource']['note']), ('英文來源', t['srcUrl'])]:\n        s += f\"- **{k}**：{md(v, here)}\\n\"\n    s += '\\n---\\n\\n'\n    for p in t['parts']:\n        pa = [a for a in arts if p['from'] <= num(a['no']) <= p['to']]\n        if not pa: continue\n        s += f\"## {p['title']}\\n\\n\" + '\\n---\\n\\n'.join(article_block(a, here) for a in pa) + '\\n---\\n\\n'\n    files[here] = s\n\nhere = '判例卡'\ns = header('判例卡', '國際法院等判決與諮詢意見。', f\"收錄判例：{len(D['CASES'])} 張\")\nfor c in sorted(D['CASES'], key=lambda c: c['date']):\n    s += f\"### {c['nameZh']}（{c['year']}）\\n\\n*{c['nameEn']}*　{c['court']}　{c['date']}　〔{c['kind']}〕　{c['parties']}\\n\\n\"\n    s += f\"**事實**：{md(c['facts'], here)}\\n\\n**爭點**：\\n\" + '\\n'.join('- ' + md(x, here) for x in c['issues'])\n    s += '\\n\\n**判決**：\\n' + '\\n'.join('- ' + md(x, here) for x in c['holding'])\n    s += f\"\\n\\n**意義**：{md(c['significance'], here)}\\n\\n**引用條文**：\" + '、'.join(link('art', r, artlabel(r), here) for r in c['articles'])\n    if c['exam']: s += '\\n\\n**考古題**：\\n' + '\\n'.join(exam_md(q, '', here) for q in c['exam'])\n    s += f\"\\n\\n來源：{c['srcUrl']}　最後查證：{c['verified']}\\n\\n---\\n\\n\"\nfiles[here] = s\n\nhere = '概念卡與比較表'\ns = header('概念卡與比較表', '不屬於單一條文的主題與比較整理。', f\"概念卡：{len(D['CONCEPTS'])} 張；比較表：{len(D['COMPARISONS'])} 張\")\ns += '# 壹、概念卡\\n\\n'\nfor c in D['CONCEPTS']:\n    s += f\"### {c['title']}\\n\\n**定義**：{md(c['definition'], here)}\\n\\n**重點**：\\n\" + '\\n'.join('- ' + md(p, here) for p in c['points'])\n    s += '\\n\\n**相關判例**：' + '、'.join(link('case', x, TARGET[('case', x)][1], here) for x in c['cases'])\n    s += '\\n\\n**相關條文**：' + '、'.join(link('art', r, artlabel(r), here) for r in c['articles'])\n    if c['exam']: s += '\\n\\n**考古題**：\\n' + '\\n'.join(exam_md(q, '', here) for q in c['exam'])\n    s += '\\n\\n---\\n\\n'\ns += '# 貳、比較表\\n\\n'\nfor c in D['COMPARISONS']:\n    s += f\"### {c['title']}\\n\\n| \" + ' | '.join(c['columns']) + ' |\\n|' + '---|' * len(c['columns']) + '\\n'\n    for r in c['rows']: s += '| ' + ' | '.join(md(x, here).replace('|', '\\\\|') for x in r) + ' |\\n'\n    s += '\\n---\\n\\n'\nfiles[here] = s\n\nhere = '申論考古題'\ns = header('申論考古題', '外交特考各語組（核心）、國際法組與其他考試的國際公法申論題，已排除國際私法題。答題架構由Claude整理，作答時請依最新發展複核。', f\"收錄 {len(D['ESSAYS'])} 題，答題架構 {sum(1 for e in D['ESSAYS'] if e.get('outline'))} 題\")\nfor code in ['l', 'd', 'e', 'g']:\n    grp = [e for e in D['ESSAYS'] if e['code'] == code]\n    if not grp: continue\n    s += f\"## {GROUP[code]}（{len(grp)}題）\\n\\n\"\n    for e in grp:\n        s += f\"### {eshead(e)}\\n\\n`{e['points']}分`　{e['topic']}　**考點**：{e['key']}\\n\\n> {e['stem']}\\n\\n\"\n        refs = [link('art', a, artlabel(a), here) for a in e['arts']] + e['treaties']\n        if refs: s += '**相關條文與文件**：' + '、'.join(refs) + '\\n\\n'\n        cs = [link('case', c['id'], TARGET[('case', c['id'])][1], here) if c['id'] else c['label'] + '（待收錄）' for c in e['cases']]\n        if cs: s += '**相關判例**：' + '、'.join(cs) + '\\n\\n'\n        ks = [link(c['type'], c['id'], TARGET[(c['type'], c['id'])][1], here) if c['id'] else c['label'] for c in e['concepts']]\n        if ks: s += '**概念卡與比較表**：' + '、'.join(ks) + '\\n\\n'\n        if e.get('outline'):\n            s += '**答題架構**：\\n\\n' + '\\n'.join('- ' + md(x, here) for x in e['outline']['points']) + f\"\\n\\n*{e['outline']['note']}（{e['outline']['verified']}）*\\n\\n\"\n        s += '---\\n\\n'\nfiles[here] = s\n\nhere = '用語對照表'\ns = header('用語對照表', '英文、台灣用語、大陸用語對照。', f\"詞條：{len(D['GLOSSARY'])} 條\")\ns += '| 詞條 | 英文 | 台灣用語 | 大陸用語 | 定義 |\\n|---|---|---|---|---|\\n'\nfor k in sorted(D['GLOSSARY']):\n    g = D['GLOSSARY'][k]; s += f\"| {k} | {g['en']} | {g['tw']} | {g['cn']} | {md(g['def'], here)} |\\n\"\nfiles[here] = s\n\nhere = '考點陷阱彙整'\nitems = []\nfor a in ARTS:\n    for x in a['traps']: items.append((T[a['treaty']]['titleZh'], link('art', aid(a), f\"{artlabel(aid(a))} {a['heading']}\", here), x))\nfor c in D['CONCEPTS']:\n    for x in c['points']:\n        if '陷阱' in x: items.append(('概念卡', link('concept', c['id'], c['title'], here), x))\ns = header('考點陷阱彙整', '自動彙整各條文的「常見誤解與陷阱」與概念卡中標註陷阱的重點。', f\"共 {len(items)} 條\")\nfor g in dict.fromkeys(i[0] for i in items):\n    gi = [i for i in items if i[0] == g]\n    s += f\"## {g}（{len(gi)}）\\n\\n\" + '\\n'.join(f\"- {'⚠️ ' if '陷阱' in x else ''}{l}：{md(x, here)}\" for _, l, x in gi) + '\\n\\n'\nfiles[here] = s\n\nhere = '勘誤清單'\nlogs = sorted([(x['date'], x['type'], link('art', aid(a), artlabel(aid(a)), here), x['text']) for a in ARTS for x in a['changelog'] if x['type'] != '新增'], key=lambda z: z[0], reverse=True)\ns = header('勘誤清單', '彙整各條「更新紀錄」中的更正、待查與備註，方便同步修改手寫筆記。', f\"共 {len(logs)} 筆\")\ns += '| 日期 | 類型 | 條文 | 內容 |\\n|---|---|---|---|\\n' + ''.join(f\"| {d} | {t} | {l} | {md(x, here)} |\\n\" for d, t, l, x in logs)\nfiles[here] = s\n\nfor name, content in files.items():\n    open(os.path.join(OUT, name + '.md'), 'w', encoding='utf-8').write(content)\n    print(f\"{name}.md  {len(content)} chars\")\n",
"diff_app.js": "// 用法：node diff_app.js <寫入前 index.html|none> <寫入後 index.html>\n// 比對兩版資料區段：各陣列新增／刪除／修改的 id，以及修改了哪些欄位；程式區是否變動。\nconst fs = require('fs');\nfunction load(f) {\n  if (!f || f === 'none') return null;\n  const s = fs.readFileSync(f, 'utf8').split('<script>')[1].split('<\/script>')[0];\n  const i = s.indexOf('\\nfunction esc');\n  const D = new Function(s.slice(0, i) + ';return {TREATIES,ARTICLES,CASES,CONCEPTS,COMPARISONS,GLOSSARY,EXAMS,ESSAYS:(typeof ESSAYS!==\"undefined\"?ESSAYS:[])};')();\n  D.CODE = s.slice(i); return D;\n}\nconst A = load(process.argv[2]), B = load(process.argv[3]);\nconst keyOf = { TREATIES: x => x.id, ARTICLES: x => x.treaty + '-' + x.no, CASES: x => x.id, CONCEPTS: x => x.id, COMPARISONS: x => x.id, EXAMS: x => x.id, ESSAYS: x => x.id };\nconst out = [];\nfor (const k of Object.keys(keyOf)) {\n  const mb = new Map(B[k].map(x => [keyOf[k](x), x]));\n  const ma = new Map(A ? A[k].map(x => [keyOf[k](x), x]) : []);\n  const added = [...mb.keys()].filter(x => !ma.has(x)), removed = [...ma.keys()].filter(x => !mb.has(x));\n  const changed = [...mb.keys()].filter(x => ma.has(x) && JSON.stringify(ma.get(x)) !== JSON.stringify(mb.get(x)))\n    .map(x => x + '(' + Object.keys(mb.get(x)).filter(f => JSON.stringify(ma.get(x)[f]) !== JSON.stringify(mb.get(x)[f])).join(',') + ')');\n  out.push(k.padEnd(12) + (A ? A[k].length : 0) + ' → ' + B[k].length + '　新增 ' + added.length + (added.length ? ' [' + added.join(' ') + ']' : '') + '　刪除 ' + removed.length + (removed.length ? ' [' + removed.join(' ') + ']' : '') + '　修改 ' + changed.length + (changed.length ? ' [' + changed.join(' ') + ']' : ''));\n}\nconst ga = A ? Object.keys(A.GLOSSARY) : [], gb = Object.keys(B.GLOSSARY);\nout.push('GLOSSARY'.padEnd(12) + ga.length + ' → ' + gb.length + '　新增 [' + gb.filter(x => !ga.includes(x)).join('、') + ']　刪除 [' + ga.filter(x => !gb.includes(x)).join('、') + ']');\nout.push('程式區 ' + (A ? (A.CODE === B.CODE ? '未變動' : '有變動') : '（無寫入前版本，首次建立）'));\nif (A && removed_any()) out.push('⚠ 有刪除項目，請確認是否為預期變更。');\nfunction removed_any() { return Object.keys(keyOf).some(k => A[k].some(x => !B[k].find(y => keyOf[k](y) === keyOf[k](x)))); }\nconsole.log(out.join('\\n'));\n",
"insert_data.py": "# -*- coding: utf-8 -*-\n\"\"\"後續批次寫入用：把新資料（JS 片段）插入 index.html 資料區段，不重印全文。\n用法：python3 insert_data.py <index.html> <片段.js> [--before \"// ===== 官方考古題（由\"]\n片段內容範例：\n  ARTICLES.push({ treaty: \"unc\", no: \"24\", ... });\n  CASES.push({ id: \"certain-expenses\", ... });\n  GLOSSARY[\"否決權\"] = { en: \"veto\", tw: \"否決權\", cn: \"否决权\", def: \"…\" };\n會先備份成 index.html.bak-<時間>，插入位置預設在「官方考古題」區段標記之前。\n修改既有內容請用 str_replace 方式精準替換，並在該條 changelog 加一筆紀錄。\"\"\"\nimport sys, shutil, time\nhtml_path, frag_path = sys.argv[1], sys.argv[2]\nmarker = '\\n// ===== 官方考古題（由'  # 以「換行＋標記」比對：打包區的 JSON 內換行已轉義，故只會命中程式區的真標記\nif '--before' in sys.argv: marker = sys.argv[sys.argv.index('--before') + 1]\nhtml = open(html_path, encoding='utf-8').read()\nfrag = open(frag_path, encoding='utf-8').read().rstrip() + '\\n'\nassert '\\nfunction esc' not in frag, '片段不可包含程式區標記'\nassert html.count(marker) == 1, '找不到唯一的插入標記：' + marker\nbak = html_path + '.bak-' + time.strftime('%Y%m%d-%H%M%S')\nshutil.copyfile(html_path, bak)\nhtml = html.replace(marker, '\\n' + frag.rstrip('\\n') + marker, 1)\nopen(html_path, 'w', encoding='utf-8').write(html)\nprint('已備份：', bak)\nprint('已插入', len(frag), '字元於「' + marker + '」之前')\n",
"sync_exams.py": "# -*- coding: utf-8 -*-\n\"\"\"依題庫JSON重新產生 index.html 內的 EXAMS 區段（只換這一段，其餘不動）。\n用法：python3 sync_exams.py <index.html> <國際公法題庫.json>\n題庫有更新（更正答案、新增題目）時使用；EXAM_FLAGS 不受影響。\"\"\"\nimport json, re, sys\nhtml_path, bank_path = sys.argv[1], sys.argv[2]\nbank = json.load(open(bank_path, encoding='utf-8'))\nexams = []\nfor q in bank:\n    m = re.match(r'gl(\\d+)a_', q['id'])\n    if m: src, kind = f\"{m.group(1)}年外交特考\", '外交特考'\n    elif q['id'].startswith('SG'):\n        y = re.match(r'(\\d+)年', q['source']).group(1); src, kind = f\"{y}年律師一試\", '律師一試'\n    else: continue\n    exams.append({'id': q['id'], 'src': src, 'kind': kind, 'topic': q.get('topic', ''), 'stem': q['stem'],\n                  'options': q['options'], 'answer': q['answer'], 'explanation': q.get('explanation', '')})\nh = open(html_path, encoding='utf-8').read()\na = h.index('var EXAMS = ')\nb = h.index('\\n// ===== 題目查證旗標', a)\nnew = 'var EXAMS = ' + json.dumps(exams, ensure_ascii=False) + ';\\n'\nh = h[:a] + new + h[b:].lstrip('\\n') if False else h[:a] + new + h[b + 1:]\nopen(html_path, 'w', encoding='utf-8').write(h)\nprint('EXAMS 已更新：', len(exams), '題')\n",
"bundle.py": "# -*- coding: utf-8 -*-\n\"\"\"把驗證工具與收錄清單打包進 index.html（不執行的 JSON 區塊），讓知識庫只需保存 index.html。\n用法：\n  python3 bundle.py unpack index.html <輸出資料夾>        取出全部檔案（每次對話開始時使用）\n  python3 bundle.py pack   index.html <檔案1> [檔案2 ...]  放入或更新檔案（同名覆蓋，其餘保留）\n  python3 bundle.py list   index.html                      列出內容與版本\n  python3 bundle.py version index.html \"<版本說明>\"        更新 App 版本標記（APP_VERSION）\n區塊格式：<script type=\"application/json\" id=\"app-bundle\">{\"files\": {檔名: 內容}}<\/script>\n內容中的「<\/」一律存成「<\\\\/」，避免提早結束 script 標籤；JSON 解析後自動還原。\"\"\"\nimport json, os, re, sys\n\nOPEN = '<script type=\"application/json\" id=\"app-bundle\">'\nCLOSE = '<\/script>'\n\n\ndef read(path):\n    return open(path, encoding='utf-8').read()\n\n\ndef load(html):\n    i = html.find(OPEN)\n    if i < 0:\n        return {'files': {}}, None\n    j = html.index(CLOSE, i + len(OPEN))\n    return json.loads(html[i + len(OPEN):j]), (i, j + len(CLOSE))\n\n\ndef dump(data):\n    s = json.dumps(data, ensure_ascii=False, indent=0).replace('<\/', '<\\\\/')\n    return OPEN + s + CLOSE\n\n\ndef main():\n    cmd, path = sys.argv[1], sys.argv[2]\n    html = read(path)\n    data, span = load(html)\n    if cmd == 'unpack':\n        out = sys.argv[3]\n        os.makedirs(out, exist_ok=True)\n        for name, content in data['files'].items():\n            open(os.path.join(out, name), 'w', encoding='utf-8').write(content)\n        m = re.search(r\"var APP_VERSION = '([^']*)'\", html[:span[0]] if span else html)\n        print('版本：', m.group(1) if m else '（無）')\n        print('已取出', len(data['files']), '個檔案到', out, '：', '、'.join(data['files']))\n        return\n    if cmd == 'list':\n        m = re.search(r\"var APP_VERSION = '([^']*)'\", html[:span[0]] if span else html)\n        print('版本：', m.group(1) if m else '（無）')\n        for name, content in data['files'].items():\n            print(f'  {name}  {len(content)} 字元')\n        return\n    if cmd == 'version':\n        new = sys.argv[3].replace(\"'\", '’')\n        cut = span[0] if span else len(html)   # 只改主程式區，不動打包區塊內的工具原始碼\n        head, tail = html[:cut], html[cut:]\n        assert head.count(\"var APP_VERSION = '\") == 1, '找不到唯一的 APP_VERSION'\n        head = re.sub(r\"var APP_VERSION = '[^']*';\", f\"var APP_VERSION = '{new}';\", head)\n        open(path, 'w', encoding='utf-8').write(head + tail)\n        print('版本已更新為：', new)\n        return\n    if cmd == 'pack':\n        for f in sys.argv[3:]:\n            data['files'][os.path.basename(f)] = read(f)\n        block = dump(data)\n        if span:\n            html = html[:span[0]] + block + html[span[1]:]\n        else:\n            assert html.count('<\/body>') == 1\n            html = html.replace('<\/body>', block + '\\n<\/body>')\n        open(path, 'w', encoding='utf-8').write(html)\n        # 驗證可還原\n        back, _ = load(read(path))\n        for f in sys.argv[3:]:\n            assert back['files'][os.path.basename(f)] == read(f), f\n        print('已打包：', '、'.join(os.path.basename(f) for f in sys.argv[3:]), '；區塊內共', len(back['files']), '個檔案')\n        return\n    raise SystemExit('未知指令：' + cmd)\n\n\nif __name__ == '__main__':\n    main()\n",
"國際公法app_收錄清單.md": "# 國際公法條文 App 收錄清單（v2.3，2026-10-07）\n\n> 依據：專案知識庫「國際公法題庫.json」183 題逐題比對。官方考古題 146 題 = 外交特考三等 96 題（109–112 年「國際法（含公法與私法）」各 14 題公法題、113–114 年「國際公法」各 20 題）＋司法官律師第一試綜合法學 50 題（111–115 年各 10 題）。另有 AI 生成 36 題與範例 1 題，**不計入命中統計**。\n> 命中標記：「外」＝外交特考、「律」＝律師一試；括號內為題庫 id。\n> 分級：A＝全文收錄、列出條文逐條完整解說；B＝只收常考條文、中度解說；C＝一張概要卡。\n> v1.1 更正：依 gl109a_1 命中補列規約第 10、53 條（已於第 1A 批寫入）。\n> 存放方式：本清單與驗證工具一併打包在 index.html 尾端的 app-bundle 區塊；知識庫只需保存 index.html（題庫JSON有變動時另傳）。\n> v2.3：外交關係公約第4A批已寫入（第1–4、9、14、19、22、24、27、29–32、37–41、45條，共20條），條約概要卡（我國1961年4月18日簽署、1969年12月19日批准，已查證），判例卡德黑蘭人質案（1980），比較表「外交豁免與領事豁免」改為連結外交關係公約條文，用語5條（同意、臨時代辦、外交郵袋、外交代表、保護國）；es115d_2、es112d_1、es110d_4、es108d_4撰寫答題架構，es110d_4改連結德黑蘭人質案。官方選擇題已對應96/180。**外交與領事關係公約批次全部完成**，外交關係中英文PDF、領事關係中英文PDF可自知識庫刪除。下一批：國家責任條款與國家豁免。\n> v2.2：領事關係公約第4B批已寫入（第5、23、31、36、41、43、53、55、70條，共9條），條約概要卡、判例卡阿韋納案（2004）、賈達夫案（2019），拉格朗案補連結第36條；比較表「外交豁免與領事豁免」（外交關係公約條文暫以純文字引用，4A批再補連結），用語5條（不受歡迎人員、領事證書、領事通知、職務豁免、名譽領事官員）；es110d_2改連結阿韋納案與第36條。官方選擇題已對應89/180（新增gl115a_16，對應第70條）。待查：我國簽署本公約的日期；當事國數（182或183）。下一批：4A外交關係公約（20條，底本已在知識庫）。\n> v2.1：條約法公約第3C批已寫入（第54–74、80條，共22條；第73條原列B級、第80條為清單所列），判例卡加布契科沃—大毛羅斯案（1997）、冰島漁業管轄權案（1973）、納米比亞諮詢意見（1971），比較表「條約失效、終止與停止施行」，用語3條（重大違約、情況之基本改變、停止施行）；es111g_1撰寫答題架構，es109l_2、es111g_1連結判例。官方選擇題已對應88/180（新增gl108a_14、gl110a_2）。第61條第1項首行原件字跡模糊列入待查。**條約法公約批次全部完成（共70條）**，兩份條約法PDF可自知識庫刪除。下一批：外交與領事關係公約（需另附中英文底本）。\n> v2.0：條約法公約第3B批已寫入（第30–53條，共24條），判例卡喀麥隆訴奈及利亞案（2002）、柏威夏寺案（1962），概念卡「強行法」，用語4條（弁言、準備工作、嗣後慣例、相對無效）；申論題es115d_3、es115d_4撰寫答題架構，東格陵蘭案補列第31條。官方選擇題已對應86/180（新增gl111a_3、gl113a_1、gl114a_3、SG022）。中文照錄作準本；第30條第5項、第37條第2項原件字跡模糊列入待查；第31條第4項原件項次誤作「(四)」、第43條「基」字形近「其」，均依體例與上下文處理並記入更新紀錄；異體「强」統一作「強」。下一批：3C第54–74、80條。\n> v1.9：條約法公約第3A批已寫入（第1–3、6–7、11–29條，共24條；第29條為清單外新增，因gl113a_2選項D），條約概要卡（119個締約國，待以聯合國條約資料庫確認），判例卡殘害人群罪公約保留諮詢意見（1951）、卡達訴巴林案（1994）、東格陵蘭案（1933），比較表「保留的接受、反對與最大反對」，用語9條；申論題es112d_2、es110d_2撰寫答題架構。官方選擇題已對應83/180。中文依聯合國條約集第1155卷作準中文本（正體字原本）照錄：底本為掃描影像，經OCR後逐字對照影像校對；第7條第1項(乙)款、第15條首句原件字跡模糊，列入待查。條約法公約後續：3B第30–53條、3C第54–74、80條。\n> v1.8：海洋法公約第2D-2批已寫入（第192–195、197–199、204、206–212、216–218、220、221、234–238、240、245、246條，共28條；除第192、194、207、208、210、211、235條外均為清單外新增，依申論題es114l_2與第十二、十三部分體系需要），判例卡烏拉圭河紙漿廠案（2010）、國際海洋法法庭氣候變遷諮詢意見（2024）、國際法院氣候變遷諮詢意見（2025），概念卡「國際環境法原則」（原清單第三節已列），用語9條；南海仲裁案補列第206條，es114l_2重寫答題架構並連結判例與概念卡，es111e_2補列第246條。官方選擇題已對應74/180（新增gl112a_14、gl114a_13）。中文本依英文作準本與上下文更正10條12處（第193條標題、第194、198、204、208、209、211、235、246條），均待以聯合國作準中文本覆核；英文本文字辨識錯誤2處（第208、220條）。**海洋法公約批次全部完成**，兩份海洋法PDF可自知識庫刪除。下一批：條約法公約。\n> v1.7：海洋法公約第2D批拆為2D-1、2D-2。2D-1已寫入（第279–283、286–288、290、292、295–298條，附件七第1、3、9、11條，共18條；第280、282、283、286、288、295–297條及附件七第1、3、9、11條為清單外新增），判例卡南方黑鮪案（2000）、北極曙光號案（2015），比較表「國際法院、國際海洋法法庭、附件七仲裁庭與常設仲裁法院」（原清單第五節已列），用語6條；南海仲裁案、塞加號案（第2號）補連結。附件條號格式為「a7-9」（顯示為「附件七第9條」），程式已支援。中文本依英文作準本更正8條（第281、288、290、292、296–298條），附件七中文依聯合國作準中文本轉錄，附件七第3條(d)(e)項待逐字覆核。官方選擇題對應仍為72/180（本批命中的gl114a_17、SG020、SG036、gl111a_2先前已由其他卡片對應）。下一批：2D-2第192–246條（海洋環境、海洋科學研究）。\n> v1.6：海洋法公約第2C批已寫入（第86、87、89、91、92、94–111、121、133、136、137、140、156條共29條；第91、96–99、102–104、106–109、133、140條為清單外新增B級，依申論題或條文體系需要），判例卡南海仲裁案（2016）、塞加號案（第2號，1999）、用語18條；es111g_2連結南海仲裁案，es109d_3新增答題架構。官方選擇題已對應72/180。中文本明顯錯字依英文作準本與上下文更正10條（第87、94、95、101、107–111、140條），因環境無法連線聯合國網站，未能逐字比對聯合國作準中文本，列入待查。下一批：2D第192–298條與附件七。\n> v1.5：海洋法公約第2B批已寫入（第34、37–40、44–53、55–60、73、74、76、77、82、83條共27條；第34、40、44、45、59、73條為清單外新增，第40條因gl114a_8選項D需要），判例卡黑海劃界案（羅馬尼亞訴烏克蘭，2009）、用語16條；北海大陸礁層案、科孚海峽案補連結；申論題es114l_3連結黑海劃界案，es111e_2新增答題架構。官方選擇題已對應68/180。中文本依聯合國作準中文本更正14條共25處（第46–50、56、58、60、73、74、76、77、82、83條；「海浬」統一為「海里」計1處）；作準本PDF本身的明顯錯字（第34條「本分部」、第38條「排队」、第76條第2項漏「大陸」、第82條「缯加」、第83條「或或」）不採。下一批：2C第86–156條。\n> v1.4：海洋法公約第2A批已寫入（第1–10、13、15、17–19、21、25、27–33條共24條；第4、6、9條為清單外新增B級），判例卡英挪漁業案、比較表「各海域的寬度、沿海國權利與航行制度」、用語11條；官方選擇題已對應60/180題。中文本採海洋委員會公布之正體本，與聯合國作準本有出入處依作準本更正。海洋法公約其餘分三批：2B第34–83條（海峽、群島、專屬經濟海域、大陸礁層、劃界）、2C第86–156條（公海、海盜、島嶼、「區域」）、2D第192–298條與附件七（海洋環境、爭端解決）。\n> v1.3：使用者報考英語組，以外交特考各語組試卷為核心。申論題已寫入App（74題，含語組19題、國際法組32題、其他23題；已排除國際私法8題），答題架構29題（語組19題全數）。選擇題增補108年14題、115年20題，官方題共180題，並以公布答案核對既有96題全部一致。下一批：海洋法公約。\n> v1.2 進度：第 1A、1B 批已寫入並通過完整驗證；規約 16 條、憲章 33 條、判例卡 9 張、概念卡 4 張、比較表 2 張、用語 29 條，官方考古題已對應 40/146 題。SG007 答案與規約第 38 條「陳訴」已查證結案（見第六節）。\n> 本清單是規劃起點，逐條精讀討論時可增刪，每次更新請整份覆蓋本檔。\n\n## 一、題庫統計重點\n\n- **官方題分布**（146 題）：領土與管轄權 20、條約法 17、海洋法 17、國際法院與爭端解決 16、國際組織與聯合國 16、國家承認與繼承 15、國際環境與經濟法 12、國際人權與刑事法 10、外交與領事關係 6、國家豁免與國家責任 6、使用武力與國際人道法 6、國際法淵源 5。\n- **單一條文最高頻**：《國際法院規約》第 38 條（法源），共 7 題（外 5、律 2）。\n- **外交特考本身考 WTO 達 8 題**，與條約法公約同級，必須收錄。\n- **我國《條約締結法》4 題**（外 1、律 3），加上施行法 1 題，「我國實踐」欄位有實際命中。\n- **《維也納領事關係公約》官方選擇題 0 命中**，但屬領事人員職務核心、申論可能考，仍列 A 級並在卡片註明「選擇題未命中」。\n- **更正**：先前以為本科正式考試只考申論，但 113、114 年外交特考三等「國際公法」各有 20 題選擇題，代表本科是申論加測驗。申論考古題尚未收集，待補。\n\n## 二、條約與條文（逐條頁）\n\n### A 級\n\n| 文件 | 收錄條文（逐條解說） | 考古題命中 |\n|---|---|---|\n| 《國際法院規約》 | 2–3、10、13（組成、選舉與任期）、31（專案法官）、34–36、38、41、53（缺席判決）、59–60、62–63、65 | 第 2、10、53 條：外 1（gl109a_1）；第 3、13 條：外 1（gl110a_12）；第 38 條：外 5（gl109a_7、gl110a_1、gl111a_1、gl112a_3、gl113a_5）、律 2（SG002、SG021）；第 34–35 條：外 3（gl109a_1、gl110a_12、gl112a_12）、律 1（SG010）；第 36 條：律 1（SG019）；第 59 條：外 1（gl111a_1）；第 62–63 條：律 1（SG049）；第 65 條諮詢意見：外 1（gl111a_5 科索沃） |\n| 《聯合國憲章》 | 1、2、4、7、17–18、23–27、33、39–43、51–53、55–56、73、92–96、99、102–105（**全部已寫入**：1A＝1、2、4、7、51；1B＝其餘 28 條） | 第 1 條：外 2（gl112a_10、gl114a_6）、律 1（SG014）；第 2 條：外 4（gl113a_13、gl114a_4、gl114a_18、gl111a_11）；第 4 條：外 1（gl114a_15）；第 7 條：外 1（gl113a_14）；第 17 條：律 1（SG007，題庫答案已更正為 B）；第 33 條：外 1（gl109a_11）；第七章：外 1（gl114a_14）；第 51 條：外 1（gl110a_9）；第 73 條：外 1（gl111a_4）、律 1（SG032）；第 93 條：外 1（gl110a_12） |\n| 《維也納條約法公約》 | 1–3、6–7、11–18、19–23、24–25、26–28、30、31–33、34–38、39–41、42–45、46–53、54–64、65–72、80 | 第 2 條：外 2（gl109a_8、gl114a_2）、律 1（SG042）；第 11–16 條：外 1（gl112a_2）、律 1（SG005）；第 19–23 條：律 1（SG041）；第 27 條：外 2（gl113a_2、gl114a_1）；第 31–33 條：外 2（gl111a_3、gl113a_1）；第 34 條：外 1（gl114a_3）；第 54–56 條：外 1（gl110a_2）；國際組織締約能力：律 1（SG025，涉及 1986 年國際組織條約法公約） |\n| 《條約締結法》（我國） | 全文 | 外 1（gl109a_3）、律 3（SG004、SG016、SG038） |\n| 《聯合國海洋法公約》 | 1–3、5、7–8、13、15、17–19、21、25、27–28、33、37–39、46–53、55–58、60、74、76–77、82–83、86–87、92、101、105、110–111、121、133、136–137、279、287、2 治領土 | 律 SG014 |\n| 核武合法性諮詢意見 | 1996 | 武力使用、人道法 | 外 gl113a_18 |\n\n無直接命中、但屬核心教材：蓮花號案（1927，管轄）、帕爾馬斯島仲裁案（1928，先占）、東格陵蘭案（1933）、科孚海峽案（1949，無害通過）、英挪漁業案（1951，直線基線與持續反對者）、殘害人群罪公約保留諮詢意見（1951）、巴塞隆納電力公司案（1970，對世義務）、德黑蘭人質案（1980，外交公約第 22、29 條）、加布契科沃—大毛羅斯案（1997，情勢變遷）、拉格朗案（2001）、逮捕令案（2002）、阿韋納案（2004）、波士尼亞殘害人群罪案（2007，歸責）、紙漿廠案（2010，環境影響評估）、賈達夫案（2019）。\n\n已寫入：科索沃、尼加拉瓜、北海大陸礁層、庇護、拉格朗、科孚海峽（1A）；聯合國特定經費、執行聯合國職務遭受損害賠償、查哥斯（1B）；英挪漁業案（2A）；黑海劃界案（2B，原清單未列，因es114l_3與第74、83條需要而新增）；南海仲裁案、塞加號案（第2號）（2C）；南方黑鮪案、北極曙光號案（2D-1，原清單未列，因第281、298條與附件七需要而新增）；烏拉圭河紙漿廠案、國際海洋法法庭氣候變遷諮詢意見、國際法院氣候變遷諮詢意見（2D-2，後二者原清單未列，因第192、194條與es114l_2需要而新增）。其餘待後續批次。\n\n## 五、比較表（第一批）\n\n外交豁免與領事豁免；內水、領海、鄰接區、專屬經濟海域、大陸礁層、公海、「區域」的權利與航行制度（無害通過、過境通行、群島海道通過、航行自由）；簽署、批准、接受、贊同、加入；條約無效、終止、停止施行；國家承認與政府承認；國家繼承的類型；國際法院訴訟管轄與諮詢管轄；國際法院、國際海洋法法庭、附件七仲裁、常設仲裁法院；國際刑事法院、特設法庭與混合法庭；五種管轄原則。\n\n已寫入：比較表「國際法院訴訟管轄與諮詢管轄」（1A）、「聯合國大會與安全理事會」（1B，原清單未列，因憲章第 17–27 條需要而新增）、「各海域的寬度、沿海國權利與航行制度」（2A）、「國際法院、國際海洋法法庭、附件七仲裁庭與常設仲裁法院」（2D-1）。概念卡已寫入：習慣國際法、和平解決爭端（1A）；國際組織的法律人格與權能、集體安全與安理會職權（1B；後者原清單未列，屬新增）；國際環境法原則（2D-2）。\n\n## 六、依申論題調整（v1.3）\n\n**批次順序**：海洋法公約 → 條約法公約 → 外交與領事關係公約 → 國家責任條款與國家豁免 → WTO與國際環境法。\n\n**清單外新增**（括號為命中的申論題）：\n- 海洋法公約：第29–32、95條（軍艦，es112l_1）；第100、102–104、106、107條（海盜，es113l_1）；第89條（es114l_1）；第94條（es109d_3）；第156條（es109l_1）；第192、194、207–211、235條（海洋環境，es114l_2）；第10條（歷史性海灣，B級）。\n- 條約法公約：第74條（es111l_2，另有選擇題 gl115a_6）；第73條（B級）。\n- WTO設立協定第11條、爭端解決瞭解書第25條（es108l_2、es113l_2）。\n- 第一附加議定書第35條，並將第一附加議定書選條升為A級（es111l_1、es115l_2）。\n- 國際民航公約升為B級：第1、2、3、3之1、8條（es112l_2、es114d_3）。\n- 外交關係公約第40條（es108d_4）；國家豁免公約（2004）升為A級並加收第12條（es112d_3、es115d_4）；WHO組織法升為B級（es109d_4）；外交保護條款草案（2006）新增B級（es114d_2）。\n- 1C批次（憲章第10–12、14、29條，規約第61條；B級憲章第5、6、97、98、100條）：主要命中國際法組，改為較低優先。\n\n**概念卡新增**：不干涉原則、軟法、跨國企業與國際法主體；比較表新增：布列頓森林機構與WTO（會員資格與決策）。\n\n## 七、待查證項目\n\n- 已結案：gl113a_19 公布答案為A（1750年）。\n- 已結案：SG007 題庫答案原為 C，與特定經費諮詢意見不符；依意見及坊間彙編所載公布答案更正為 B（已更正於題庫 JSON 與 App）。仍待以考選部標準答案 PDF 確認。\n- 已結案：《國際法院規約》第 38 條第 1 項開頭中文作「陳訴」（聯合國文件中文本與正體轉錄本一致），（子）款作「規條」，已更正。\n- 待查：《聯合國憲章》第 73 條「以充量／充分增進領土居民福利」，正體轉錄本作「充量」，聯合國中 "工作流程.md": "# 國際公法 App 工作流程（給每次新對話的 Claude）\n\n> 本檔打包在 index.html 尾端的 app-bundle 區塊。使用者開新對話時，只會貼一句開場指令；Claude 依本檔自行完成開場檢查並接續工作。\n> 修改本檔後須以 bundle.py pack 放回，並更新版本。\n> 後續條約批次的底本：使用者需另附該條約的中英文本（或確認來源），完成後即可自知識庫刪除，以維持單檔制。\n> 條約法公約已全部寫入（2026-10-07，3C批），兩份條約法PDF不再需要，若仍在知識庫，回報並建議刪除。以下掃描底本的處理方式供後續條約沿用：中文本為掃描影像（第1–39頁為中文，第40頁起為俄文、西班牙文）：以 tesseract 正體中文模型（tessdata_best 的 chi_tra，自 raw.githubusercontent.com 下載）產生草稿，再以 300dpi 影像逐頁目視校對，一律以影像為準；英文本已有文字層，但需修正斷字與款次辨識錯誤。\n\n> 外交關係公約（4A批）與領事關係公約（4B批）已全部寫入（2026-10-07），四份外交、領事PDF不再需要，若仍在知識庫，回報並建議刪除。4A批沿用下述作法，未再被封鎖。**重要經驗**：(1) 放進專案知識庫的「領事關係中文.pdf」被平台轉成純文字檔（只剩亂碼文字層、沒有影像），掃描型PDF若在知識庫讀不到影像，請使用者改用對話附件上傳（/mnt/user-data/uploads）。(2) 網路上已廣泛流傳的條約中文全文，若由Claude在回覆或工具呼叫中逐字打出，會被內容篩選機制封鎖；做法是條文全文一律由程式取得：英文本以腳本從PDF文字層切分清理；中文本以多組前處理的 tesseract 結果逐字投票（ocr/run.py 的方法）、套用通用詞彙修正，再以短的「錯字→正字」對照逐條修正並對照影像核對，不在回覆中輸出整段條文。已收錄於其他欄位的條文（如申論題題幹引用的全文）可由程式直接擷取。\n\n## 一、開場檢查（每次新對話的第一件事）\n\n1. **確認知識庫**：執行 `ls /mnt/project`（若環境沒有此目錄，改用 Projects 工具的 project_info 查看文件清單、project_read 讀取 index.html）。正常情況有 `index.html`、`國際公法題庫.json`，海洋法公約已全部寫入（2026-10-07，2D-2批），兩份海洋法PDF（`海洋法中文.pdf`、`海洋法英文.pdf`）不再需要，若仍在知識庫，回報並建議刪除。若有其他檔案，回報並建議使用者刪除（舊版工具、講義等皆已打包或可重新產生）。\n2. **取出工具**：從 `index.html` 的 app-bundle 區塊解析 JSON，先寫出 `bundle.py`，再執行 `python3 bundle.py unpack /mnt/project/index.html <工作目錄>/tools` 取出全部工具與收錄清單；在 tools 目錄執行 `npm install jsdom@24`（模擬瀏覽器測試用）。\n3. **比對版本**：讀取 `index.html` 的 `APP_VERSION`，與專案記憶中記錄的「最新版本」比對。不一致時，先告訴使用者可能漏傳或傳錯檔，請其確認或補傳；**不要在舊版上寫入**。\n4. **快速健檢**：執行 `check_app.js`，錯誤須為 0。\n5. **讀取狀態**：專案記憶（進度、待寫入清單、待查事項）與收錄清單（批次順序、各條約條文清單、依申論題的調整）。\n6. **回報**（10 行以內）：目前版本、已完成進度、下一步建議、待查事項中與下一步有關者。使用者在開場指令中若另外指定任務，以使用者指定為準。\n\n## 二、批次寫入流程（新增條文、判例、概念卡等）\n\n1. **規劃與確認**：先列總表（條文、標題、命中的選擇題與申論題、判例、概念卡、預計新增用語）。條數多時建議分批（每批約 15–25 條）。**等使用者確認後才寫入**；使用者明說「直接做」時除外。\n2. **查證**：\n   - 條文英文以官方來源核對（聯合國、條約保存機關、官方網站），辨識錯誤依官方文本補正並記入更新紀錄。\n   - 中文依中文本政策（見專案記憶）：1971年前有正體作準本者原文照錄；之後採我國官方譯本，無則僅字形簡轉正；皆無則標「非官方譯文」。轉錄本錯字以第二來源交叉比對。\n   - 判例核對官網摘要（日期、票數、核心見解）；時事須實際查證並記錄查證日期。\n   - 無法確定者標「待查」，不臆測。\n3. **寫入**：\n   - 先複製一份寫入前版本，供差異比對。\n   - 新資料用 `insert_data.py` 插入資料區段；修改既有內容用精確字串替換（每處須恰好匹配一次），並在該條 changelog 登錄。\n   - **不得重新產生整份 index.html**，以免覆蓋既有資料。\n   - 動到程式區時，同步更新 `check_app.js`、`smoke_test.js` 等工具，並以 `bundle.py pack` 放回（`gen_md.py` 已停用，不必同步）。\n   - （已完成，供修訂參考）海洋法公約批次：中英文底本直接從知識庫讀取（project_read「海洋法中文.pdf」「海洋法英文.pdf」，英文本可用腳本依「Article N」切分），不必請使用者另附。與聯合國作準中文本有出入處依作準本更正並記入更新紀錄。\n   - 附件條文的條號寫作「a7-9」（附件七第9條），id 為 unclos-a7-9，連結寫 [[art|unclos-a7-9|附件七第9條]]；海委會中文本未收附件條文，附件中文依聯合國作準中文本轉錄並註明覆核狀況。\n   - 本環境的網路只開放套件來源，無法以 curl 下載聯合國網站；WebFetch 讀PDF會被摘要改寫，不能當逐字來源。無法取得作準中文本時，只更正依英文作準本與上下文可確定的明顯錯字，更新紀錄註明「待以聯合國作準中文本覆核」並列入待查。\n4. **更新版本**：`python3 bundle.py version index.html \"日期 批次名稱\"`。\n5. **完整驗證**（全部通過才交付）：\n   語法檢查 → `check_app.js`（錯誤 0、警告 0）→ `smoke_test.js`（錯誤 0）→ `diff_app.js 寫入前 寫入後`（確認只有預期變動，刪除項目須說明）。使用者已不需要 Obsidian 講義（2026-10-06），不再執行 `gen_md.py`、不交付 md。\n6. **交付**：`index.html`。若可使用 Projects 工具，以 project_write 直接覆蓋知識庫的 index.html，並另附檔案供部署 GitHub Pages。回覆結尾固定附一行「**本次需上傳：**…」（已直接更新知識庫時寫「無」）。\n7. **更新專案記憶**：批次進度、最新版本字串、待寫入清單、待查事項。\n\n## 三、題庫與申論題\n\n- **選擇題**：新題先以公布答案核對；只收國際公法題，排除國際私法題。更新 `國際公法題庫.json` 後以 `sync_exams.py` 同步進 App。此時「本次需上傳」要加上題庫 JSON，並另附「新增題目」JSON 供考古題 App 匯入。\n- **申論題**：以外交特考各語組試卷為核心（使用者報考英語組），國際法組與其他考試為參考。答題架構只對已收錄的條文、判例、概念卡使用 `[[…]]` 連結，其餘寫純文字；隨各條約批次補寫或修訂。\n\n## 四、共同原則\n\n- 一律使用繁體中文與台灣慣用的法律用語。\n- 有疑義先問再做；一次只問最關鍵的問題。\n- 對話變長時，在完成一個段落（例如交付一批）後，主動提醒使用者「適合開新對話」。只要已交付並更新記憶，任何時候開新對話都能接續。\n"
