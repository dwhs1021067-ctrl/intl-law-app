<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ECEEE5">
<title>國際公法條文卷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEEE5; --card:#F7F7F1; --line:#D2D6C5; --ink:#1F2622; --muted:#5E6B63;
  --jade:#2E5E4E; --jade-soft:#DCE6DF; --seal:#A3402F; --seal-soft:#F1DED8; --amber:#8C6D1F;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#171C19; --card:#202722; --line:#344039; --ink:#E4E8E1; --muted:#9AA79F;
    --jade:#7FB49D; --jade-soft:#28372F; --seal:#E08A77; --seal-soft:#3A2722; --amber:#D2B260; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:16px;line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 56px}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--serif);font-size:18px;letter-spacing:1px;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.jumprow{display:flex;gap:6px;margin-bottom:12px}
.jumprow input{flex:1;min-width:0;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.jumprow button{padding:0 14px;border-radius:9px;background:var(--jade);color:var(--paper);font-size:14px}
.jump-msg{font-size:12.5px;color:var(--seal);margin:-6px 0 10px}
.back-btn{font-size:13px;color:var(--jade);margin-bottom:10px;display:inline-block}

/* 條文頁：法典式版心 */
.art-head{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;border-left:4px solid var(--jade);padding:4px 0 4px 12px;margin-bottom:10px}
.art-no{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1;color:var(--jade);grid-row:span 2}
.art-treaty{font-size:12.5px;color:var(--muted)}
.art-heading{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.3}
.art-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tier{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--jade-soft);color:var(--jade);font-weight:700}
.mark-btn{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.mark-btn.on{border-color:var(--jade);color:var(--jade);font-weight:700}
.mark-btn.star.on{border-color:var(--amber);color:var(--amber)}
.nav-pn{margin-left:auto;display:flex;gap:6px}
.nav-pn button{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.nav-pn button[disabled]{opacity:.35}

.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;padding:9px 0;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--jade)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.seg button{padding:4px 12px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--jade);color:var(--paper)}
.quizbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quiz-toggle{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);margin-bottom:12px}
.quiz-toggle.on{background:var(--seal);border-color:var(--seal);color:#fff}

.para{display:grid;grid-template-columns:28px 1fr;gap:0 8px;margin-bottom:14px}
.para .pn{font-family:var(--serif);font-weight:700;color:var(--jade);text-align:right;padding-top:1px}
.para .zh{font-family:var(--serif);font-size:16.5px;line-height:1.9;white-space:pre-line}
.para .en{font-size:14px;line-height:1.6;color:var(--muted);white-space:pre-line;margin-top:4px}
.para.en-only .en{color:var(--ink);font-size:15px;margin-top:0}
.cloze{display:inline-block;min-width:3em;border-bottom:2px solid var(--seal);color:transparent;padding:0 2px;font-family:inherit}
.cloze.shown{color:var(--seal);font-weight:700}
.src-note{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}

.sec{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--jade);display:flex;align-items:center;gap:6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-size:15.5px;line-height:1.8}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.el{margin-bottom:10px;font-size:14.5px}
.el .req{padding-left:0;margin:0;list-style:none}
.el .req li{padding-left:16px;position:relative}
.el .req li::before{content:"□";position:absolute;left:0;color:var(--jade);font-size:12px;top:2px}
.el .eff{margin-top:4px;padding-left:16px;position:relative;font-weight:500}
.el .eff::before{content:"⇒";position:absolute;left:0;color:var(--seal)}
.trap{font-size:14.5px;padding:8px 10px 8px 12px;border-left:3px solid var(--seal);background:var(--seal-soft);border-radius:0 8px 8px 0;margin-bottom:8px}
.custom-status{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px;border:1px solid var(--jade);color:var(--jade);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--jade-soft);color:var(--jade)}
.chip.pending{background:transparent;border:1px dashed var(--line);color:var(--muted);cursor:default}
.case-ref{margin-bottom:10px}
.case-ref .jumplink{font-weight:700}
.jumplink{color:var(--jade);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.jumplink.pending{color:var(--muted);text-decoration-style:dashed;cursor:default}
.term{border-bottom:1px dotted var(--amber);cursor:pointer}
.news{font-size:14.5px;margin-bottom:8px}
.news small,.muted{color:var(--muted);font-size:12px}

.q{margin-bottom:12px}
.q .qhead{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q .stem{font-size:15px;margin:4px 0 6px}
.q ol{margin:0;padding-left:0;list-style:none;font-size:14px}
.q li{padding:3px 0 3px 22px;position:relative}
.q li .lbl{position:absolute;left:0;color:var(--muted)}
.q li.ok{color:var(--jade);font-weight:700}
.q .qnote{font-size:13.5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.flag{font-size:12.5px;color:var(--seal);margin-top:4px}
.reveal-btn{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--seal);color:var(--seal);font-size:14px;margin-bottom:10px}
.log{font-size:13px;margin-bottom:4px}
.log b{font-weight:500;color:var(--jade)}
.log .t-更正,.log .t-待查{color:var(--seal)}

/* 卡片頁 */
.card-title{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.35;margin:4px 0 2px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:12px}
.kind{font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--seal-soft);color:var(--seal);font-weight:700}
.list{margin:0;padding-left:20px;font-size:15px;line-height:1.75}
.list li{margin-bottom:6px}
table.cmp{border-collapse:collapse;font-size:13.5px;min-width:520px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.cmp th{background:var(--jade-soft);color:var(--jade)}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
.scroll-x{overflow-x:auto;margin-bottom:12px}

.row-link{display:block;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.row-link .t{font-size:15px}
.row-link .s{font-size:12.5px;color:var(--muted)}
.home-hero{padding:6px 0 14px}
.home-hero h1{font-family:var(--serif);font-size:26px;margin:0 0 4px;letter-spacing:1px}
.home-hero p{margin:0;color:var(--muted);font-size:14px}
.stat{display:flex;gap:18px;margin:14px 0;font-size:13px;color:var(--muted)}
.stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt-btn{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:8px;font-size:14.5px}
.opt-btn.right{border-color:var(--jade);background:var(--jade-soft);font-weight:700}
.opt-btn.wrong{border-color:var(--seal);background:var(--seal-soft)}
.primary{padding:10px 16px;border-radius:9px;background:var(--jade);color:var(--paper);font-size:14px}
textarea.export{width:100%;height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px}

/* 抽屜與覆蓋層 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--paper);z-index:50;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 30px);border-right:1px solid var(--line)}
.drawer h2{font-family:var(--serif);font-size:17px;margin:4px 0 10px}
.acc-head{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.acc-head .cnt{font-size:12px;color:var(--muted);font-weight:400}
.acc-body{display:none;padding:2px 0 6px 8px}
.acc-body.open{display:block}
.acc-sub{font-size:12.5px;color:var(--muted);padding:8px 0 2px}
.d-row{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;padding:6px 2px;font-size:14px}
.d-row .no{font-family:var(--serif);font-weight:700;color:var(--jade);min-width:44px}
.d-row .mk{margin-left:auto;font-size:11px;color:var(--muted)}
.d-row.cur{background:var(--jade-soft);border-radius:6px}
.d-link{display:block;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.overlay{position:fixed;inset:0;background:var(--paper);z-index:60;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0}
.overlay .bar{display:flex;gap:8px;margin-bottom:10px}
.overlay .bar input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.overlay .results{flex:1;overflow-y:auto;padding-bottom:30px}
.sr{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.sr .ty{font-size:11px;color:var(--amber);font-weight:700}
.sr .tt{font-size:15px}
.sr .sn{font-size:12.5px;color:var(--muted)}
.pop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(92vw,520px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;z-index:70;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop h3{margin:0 0 4px;font-family:var(--serif);font-size:17px}
.pop .r{font-size:13px;margin-bottom:2px}
@media (prefers-reduced-motion: no-preference){ .drawer{animation:slidein .18s ease-out} @keyframes slidein{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>

var TREATIES = [

  elements: [

"破題：國家豁免指一國及其財產在他國法院享有管轄豁免，源自主權平等（par in parem non habet imperium）；現代採限制豁免論，主權行為（acta jure imperii）享有豁免，商業行為不享有。{{強行法}}依[[art|vclt-53|條約法公約第53條]]，是國際社會全體接受並公認為不許損抑的規範（見[[concept|jus-cogens|強行法概念卡]]）。",

"key": "斷交後使館館產的保護與第三國代管；沒收館產的違法性（草擬抗議聲明）",
"stem": "一、A、B、C、D四國均為維也納外交關係公約之締約國。B、C兩國因歷史因素，長久處於軍事敵對狀態，A國僅與B、D國有正式外交關係。某日A國突然片面終止與B國外交關係，並於同日宣布與C國建交。B國洽獲D國代為管理在A國館產，但為A國所拒，B國在時間緊迫情形之下，只好以象徵性1美元轉售予當地天主教教會，該買賣契約並經當地公證。但A國後以非法交易為由，將B國在當地購置的駐館等資產全部沒收並移轉給C國。C國外交部宣稱A國沒收B國館產是正義之舉，並聲稱擁有B國財產所有權。假設你為B國外交官，請依維也納外交關係公約為B國外交部草擬一份聲明稿，對A、C兩國表達抗議。（25分）",

"stem": "二、多邊條約涉及各國利益，對條約內容不易完全達成共識，故國際法上設有保留（Reservations）制度。請依維也納條約法公約（Vienna Convention on the Law of Treaties）關於保留之規定，試述下列問題：（一）何種情況下當事國不得提出保留？（15分）（二）假設保留提出國提出的保留並無條約法公約中不得提出保留的情況，但另一締約國提出書面反對，應如何處理？（10分）",

"concepts": [],
"outline": {
"points": [
"保留的定義：一國於簽署、批准、接受、贊同或加入條約時所作的片面聲明，不論措辭或名稱，目的在排除或更改條約部分規定對該國的法律效果（[[art|vclt-2|條約法公約第2條]]第1項(丁)款）。保留制度兼顧條約的普遍參加與完整性。",
"（一）不得提出保留的情形（[[art|vclt-19|第19條]]）：①條約禁止保留（如羅馬規約第120條、海洋法公約第309條）；②條約僅准許特定保留，而該保留不在其內；③其他情形下，保留與條約目的及宗旨不合。第③款源自[[case|genocide-reservations|殘害人群罪公約保留諮詢意見]]（1951），以目的及宗旨標準取代全體一致原則。",
"時間與程序限制：保留只能在表示同意承受拘束的階段提出；須以書面提具並送交各締約國（[[art|vclt-23|第23條]]第1項）；簽署時提出者，須在批准時正式確認（第23條第2項）。小型多邊條約須經全體當事國接受、國際組織約章須經主管機關接受（[[art|vclt-20|第20條]]第2、3項）。",
"爭點：誰判斷保留與目的及宗旨不合？公約無中央機關，由各國以接受或反對表態；人權事務委員會第24號一般性意見主張由條約機構判斷並分割無效保留，國際法委員會2011年《條約保留實踐指南》則認為無效保留不生效果。",
"（二）他國書面反對時：依第20條第4項(乙)款，反對不妨礙條約在反對國與保留國間生效，除非反對國「確切表示」相反意思；條約生效時，依[[art|vclt-21|第21條]]第3項，保留所涉規定在保留範圍內於兩國間不適用。若反對國確切表示反對條約生效（最大反對），兩國間無條約關係。比較見[[cmp|reservation-effects|保留效果比較表]]。",
"其他當事國：保留不影響其他當事國彼此間的關係（第21條第2項）；未反對而經12個月者視為接受（第20條第5項）。反對與保留都可隨時以書面撤回（[[art|vclt-22|第22條]]、第23條第4項）。"
],

"stem": "一、假設有A國和B國兩國邊境發生軍事衝突，A國稱為懲戒衝突製造者，發動對B國有關軍事行動，造成對於區域安全和穩定之威脅。由於A國為聯合國安理會常任理事國，藉由其否決權之行使，往往能阻礙聯合國安理會對於有關情勢進行回應和採取行動。試從聯合國憲章和有關決議回答：於此等情況下，為維持和平，聯合國大會能否就相關集體辦法進行具體建議？是否包含採取維和行動？（25分）",

"前提：安理會對維持和平負「主要」而非「專屬」責任（[[art|unc-24|第24條]]、[[case|certain-expenses|特定經費案]]）。",
"大會的職權：依憲章第10、11、14條，大會可以討論並提出建議；限制是，需要採取「行動」的問題應提交安理會（第11條第2項），安理會正在處理時，除經請求外不得建議（第12條）。",
"「聯合維護和平」決議（聯大第377A號，1950）：安理會因常任理事國意見不一致而未能行使主要責任時，大會應立即審議，向會員國提出集體辦法的建議，必要時包括使用武力；並可召開緊急特別會議。實例：1956年蘇伊士危機設立聯合國緊急部隊；2022年起關於烏克蘭的第ES-11系列決議。",
"維和行動：大會可以設立經當事國同意部署的維和行動，因為它不是強制行動（特定經費案）。但大會只能「建議」，不能強制會員國。",
"第12條的限制在實務上已經放寬：隔離牆諮詢意見指出，大會與安理會常同時處理同一事項。",
"補充：2022年聯大第76/262號決議要求，否決發生後十個工作日內召開大會辯論（見[[art|unc-27|第27條]]）。",

"stem": "二、A、B兩國皆為維也納領事關係公約之締約國。A國國民甲於B國搶劫銀行，在銀行中爆發槍戰，並擊斃一名B國警察。最後甲終於被捕，並且被B國法院判處死刑。不過甲於被逮捕以及隨後之訴訟中，無論是B國警方或法院皆未告知甲根據維也納領事關係公約第36條第1項第2款，甲可以向自己本國A國派駐於B國之領事請求協助。因此甲在B國之刑事訴訟未受到A國領事之協助，就被判處死刑。A國於是向國際法院對B國提起訴訟。試回答下列問題：（一）B國抗辯：維也納領事關係公約第36條第1項第2款之規定只有拘束締約國之A、B兩國，只有賦予締約國A國權利，但並未賦予A國國民權利。亦即，該條文並非是自動履行（self-executing）之條約規定，因此還有賴於B國作進一步之具體化。B國縱然沒有告知甲該條款之內容，亦不構成對甲權利之侵害。甲既無權利被侵害，A國亦無從本於其國民權利受害為由提起訴訟。此一抗辯是否正確？（15分）（二）B國抗辯：B國是權力分立之民主法治國家，B國總統與外交部長負擔憲法上之義務，並不能干涉內國法院之判決，縱然B國總統曾經要求法院暫緩死刑之裁判與執行，但B國之司法機關仍然可以獨立為之，因為依照B國憲法規定，國際條約於B國之內國只具有法律位階，因此維也納領事關係公約之效力低於B國憲法。此一抗辯是否正確？（10分）參考法條：維也納領事關係公約第36條與派遣國國民通訊及聯絡一、為便於領館執行其對派遣國國民之職務計：（一）領事官員得自由與派遣國國民通訊及會見。派遣國國民與派遣國領事官員通訊及會見應有同樣自由。（二）遇有領館轄區內有派遣國國民受逮捕或監禁或羈押候審、或受任何其他方式之拘禁之情事，經其本人請求時，接受國主管當局應迅即通知派遣國領館。受逮捕、監禁、羈押或拘禁之人致領館之信件亦應由該當局迅予遞交。該當局應將本款規定之權利迅即告知當事人。（三）領事官員有權探訪受監禁、羈押或拘禁之派遣國國民，與之交談或通訊，並代聘其法律代表。領事官員並有權探訪其轄區內依判決而受監禁、羈押或拘禁之派遣國國民。但如受監禁、羈押或拘禁之國民明示反對為其採取行動時，領事官員應避免採取此種行動。二、本條第一項所稱各項權利應遵照接受國法律規章行使之，但此項法律規章務須使本條所規定之權利之目的得以充分實現。",

"outline": {
"points": [
"（一）[[art|vccr-36|領事關係公約第36條]]第1項(二)款是否賦予個人權利：國際法院在[[case|lagrand|拉格朗案]]（2001）依文義解釋，認定該款明文規定「應將本款規定之權利迅即告知當事人」，創設個人權利，派遣國除自身權利受侵害外，亦可代其國民行使外交保護；[[case|avena|阿韋納案]]（2004）重申此見解。是否「自動履行」是國內法問題，不影響其在國際法上的拘束力。故B國抗辯不成立，A國得以自身權利及其國民權利受侵害為由起訴。",
"B國違反告知義務：逮捕後未「迅即」告知甲得請求領事協助，即違反第36條第1項(二)款，無須證明若有領事協助結果必然不同（拉格朗案）。",
"（二）權力分立與條約位階抗辯：依[[art|vclt-27|條約法公約第27條]]，當事國不得援引其國內法規定為理由而不履行條約；國家責任條款第4條規定，國家任何機關（含司法機關）的行為均歸屬於國家，行政權無法干預法院不能免責。條約在國內僅具法律位階，同樣是國內法問題，不能對抗國際義務。",
"國際法院的實踐：拉格朗案中，美國以國內「程序失權」規則為由不審查違反領事通知的判決，法院認定該規則的適用違反第36條第2項；法院並首次明確認定依規約第41條作成的臨時措施具拘束力，美國未遵守亦構成違法。",
"結論：B國兩項抗辯均不成立；B國應負國家責任，並應以其選擇的方式對判決進行有效的審查與複查（拉格朗案、阿韋納案的救濟方式）。"
],

"concepts": [],
"outline": {
"points": [
"定義：{{情況之基本改變}}（rebus sic stantibus）指締約時存在、構成當事國同意必要根據的情況，發生非當事國所預料的基本改變，以致根本變動尚待履行的義務時，當事國得援引為終止、退出或停止施行條約的理由（[[art|vclt-62|條約法公約第62條]]）。此為條約必須遵守原則（第26條）的例外，國際法院確認反映習慣法。",
"要件（第62條第1項，須同時具備）：①締約時存在的情況發生基本改變；②非當事國所預料；③該情況的存在構成同意的必要根據；④改變的影響將根本變動尚待履行義務的範圍。條文採「不得援引……除非」的否定句式，表示是嚴格例外。",
"排除（第2項）：①劃定邊界的條約；②改變係援引國違反條約或其他國際義務的結果。效果：終止、退出，或僅停止施行（第3項）；須依第65條以下程序，且可能因默認喪失援引權（第45條）。",
"實踐：[[case|fisheries-jurisdiction|冰島漁業管轄權案]]（1973），捕魚技術進步未根本變動提交法院的義務；[[case|gabcikovo|加布契科沃—大毛羅斯案]]（1997），政治變局、經濟可行性降低、環境知識發展均不符要件，第62條僅於例外情形適用。國際法院迄未接受此主張；歐洲法院拉克案（1998）是少數成功例。",
"（二）武力衝突可否作為情事變更的理由：①[[art|vclt-73|條約法公約第73條]]明定不處理國家間敵對行為所生的條約問題，須回歸習慣法；②國際法委員會2011年《武裝衝突對條約的影響條款》第3條：武裝衝突不當然終止或停止條約，須依條約性質、目的、衝突強度與期間個案判斷，人權、人道法、劃界、外交關係等條約原則上繼續適用；第18條保留情況之基本改變等條約法事由。",
"分析：武力衝突本身不當然構成情況之基本改變；仍須逐一檢驗第62條要件。若衝突由援引國非法使用武力所引起，屬第62條第2項(乙)款「自身違反國際義務」所致，不得援引；劃界條約亦不得援引。此外，侵略國不得因此獲益（條約法公約第75條、憲章第2條第4項）。",
"結論：武力衝突原則上不能直接作為情事變更的合法理由；只有在衝突使構成同意必要根據的情況根本改變，且非援引國不法行為所致、非劃界條約時，才可能例外援引，並須踐行通知與和平解決程序。"
],

ARTICLES.push({"treaty": "unclos", "no": "1", "heading": "用語和範圍", "tier": "A", "paras": [{"n": "1", "en": "For the purposes of this Convention:\n(1) \"Area\" means the seabed and ocean floor and subsoil thereof, beyond the limits of national jurisdiction;\n(2) \"Authority\" means the International Seabed Authority;\n(3) \"activities in the Area\" means all activities of exploration for, and exploitation of, the resources of the Area;\n(4) \"pollution of the marine environment\" means the introduction by man, directly or indirectly, of substances or energy into the marine environment, including estuaries, which results or is likely to result in such deleterious effects as harm to living resources and marine life, hazards to human health, hindrance to marine activities, including fishing and other legitimate uses of the sea, impairment of quality for use of sea water and reduction of amenities;\n(5) (a) \"dumping\" means:\n(i) any deliberate disposal of wastes or other matter from vessels, aircraft, platforms or other man-made structures at sea;\n(ii) any deliberate disposal of vessels, aircraft, platforms or other man-made structures at sea;\n(b) \"dumping\" does not include:\n(i) the disposal of wastes or other matter incidental to, or derived from the normal operations of vessels, aircraft, platforms or other man-made structures at sea and their equipment, other than wastes or other matter transported by or to vessels, aircraft, platforms or other man-made structures at sea, operating for the purpose of disposal of such matter or derived from the treatment of such wastes or other matter on such vessels, aircraft, platforms or structures;\n(ii) placement of matter for a purpose other than the mere disposal thereof, provided that such placement is not contrary to the aims of this Convention.", "zh": "為本公約的目的：\n(1)「區域」是指國家管轄範圍以外的海床和洋底及其底土。\n(2)「管理局」是指國際海底管理局。\n(3)「『區域』內活動」是指勘探和開發「區域」的資源的一切活動。\n(4)「海洋環境的污染」是指：人類直接或間接把物質或能量引入海洋環境，其中包括河口灣，以致造成或可能造成損害生物資源和海洋生物、危害人類健康、妨礙包括捕魚和海洋的其他正當用途在內的各種海洋活動、損壞海水使用質量和減損環境優美等有害影響。\n(5)(a)「傾倒」是指：\n(一)從船隻、飛機、平臺或其他人造海上結構故意處置廢物或其他物質的行為；\n(二)故意處置船隻、飛機、平臺或其他人造海上結構的行為。\n(b)「傾倒」不包括：\n(一)船隻、飛機、平臺或其他人造海上結構及其裝備的正常操作所附帶發生或產生的廢物或其他物質的處置，但為了處置這種物質而操作的船隻、飛機、平臺或其他人造海上結構所運載或向其輸送的廢物或其他物質，或在這種船隻、飛機、平臺或結構上處理這種廢物或其他物質所產生的廢物或其他物質均除外；\n(二)並非為了單純處置物質而放置物質，但以這種放置不違反本公約的目的為限。"}, {"n": "2", "en": "(1) \"States Parties\" means States which have consented to be bound by this Convention and for which this Convention is in force.\n(2) This Convention applies mutatis mutandis to the entities referred to in article 305, paragraph 1(b), (c), (d), (e) and (f), which become Parties to this Convention in accordance with the conditions relevant to each, and to that extent \"States Parties\" refers to those entities.", "zh": "(1)「締約國」是指同意受本公約拘束而本公約對其生效的國家。\n(2)本公約比照適用於第三百零五條第一款(b)、(c)、(d)、(e)和(f)項所指的實體，這些實體按照與各自有關的條件成為本公約的締約國，在這種情況下，「締約國」也指這些實體。"}], "keys": ["國家管轄範圍以外的海床和洋底及其底土", "同意受本公約拘束而本公約對其生效的國家"], "plain": "第1條是公約的「名詞解釋」，考試最常考兩組定義。第一組是「區域」（the Area）：國家管轄範圍以外的海床、洋底及底土，也就是深海底，屬於人類共同繼承財產（第136條），由國際海床管理局管理；注意「區域」只指海床以下，上方水體仍是公海。第二組是海洋環境污染與「傾倒」：傾倒限於從船舶、飛機、平臺等海上人造結構「故意處置」廢物，或故意處置這些載具本身；陸上排放不是傾倒，船舶正常操作附帶產生的廢棄物也不算。第2款說「締約國」是同意受公約拘束且公約已對其生效的國家，不論是先簽署再批准，或沒簽署直接加入。", "elements": [{"req": ["國家管轄範圍以外", "海床、洋底及其底土"], "effect": "屬於「區域」，其資源為人類共同繼承財產（第136條），由國際海床管理局管理"}, {"req": ["從船舶、飛機、平臺或其他海上人造結構", "故意處置廢物或其他物質（或故意處置該載具本身）"], "effect": "構成「傾倒」，受第十二部分海洋環境保護規範"}, {"req": ["國家同意受公約拘束（批准或加入等）", "公約已對該國生效"], "effect": "為「締約國」；第305條所列實體（如歐盟）比照適用"}], "traps": ["陷阱：「區域」只包括海床、洋底及底土，不包括上覆水域；上覆水域的法律地位是公海（gl109a_4選項A即考此定義）。", "陷阱：「傾倒」明文包括從「飛機」故意處置廢物；說傾倒「不包括飛行器」是錯的（gl109a_4正解D）。", "陷阱：締約國的判斷標準是「同意受拘束且公約對其生效」，與是否簽署無關；未簽署而直接加入的國家同樣是締約國。"], "custom": {"status": "不適用", "note": "定義條款，屬條約用語，不涉習慣法地位。", "cases": []}, "related": ["unclos-136", "unclos-137", "unclos-192", "unclos-194", "unclos-207", "unclos-210"], "cases": [{"id": "itlos-climate", "point": "人為溫室氣體排放進入大氣，屬第1條第1項第4款所稱的「海洋環境污染」（國際海洋法法庭2024年諮詢意見，全體一致）。"}], "roc": "我國《海洋污染防治法》第4條第9款定義「海洋棄置」為利用船舶、航空器、海洋設施或其他設施，運送物質至海洋傾倒、排洩或處置，可與公約的「傾倒」對照。", "essay": "論海洋環境保護時可先界定：「依《聯合國海洋法公約》第1條第1款第4項，海洋環境污染係指人類直接或間接將物質或能量引入海洋環境（含河口灣），造成或可能造成有害影響；其中『傾倒』（第5項）限於自船舶、飛機、平臺等海上人造結構故意處置廢物之行為。」", "exam": [{"qid": "gl109a_4", "note": "正解D：傾倒的定義明文包括飛機。選項C附加「不包括未簽署者」，與第1條第2款的標準不完全相符，見本題的查證旗標。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第2款第(2)項作「(e)和(f)所指」，依聯合國作準中文本補「項」字。"}, {"date": "2026-10-07", "type": "補充", "text": "第2D-2批：判例欄位補列國際海洋法法庭2024年氣候變遷諮詢意見，相關條文補列第207條。"}]});

ARTICLES.push({"treaty": "unclos", "no": "2", "heading": "領海及其上空、海床和底土的法律地位", "tier": "A", "paras": [{"n": "1", "en": "The sovereignty of a coastal State extends, beyond its land territory and internal waters and, in the case of an archipelagic State, its archipelagic waters, to an adjacent belt of sea, described as the territorial sea.", "zh": "沿海國的主權及於其陸地領土及其內水以外鄰接的一帶海域，在群島國的情形下則及於群島水域以外鄰接的一帶海域，稱為領海。"}, {"n": "2", "en": "This sovereignty extends to the air space over the territorial sea as well as to its bed and subsoil.", "zh": "此項主權及於領海的上空及其海床和底土。"}, {"n": "3", "en": "The sovereignty over the territorial sea is exercised subject to this Convention and to other rules of international law.", "zh": "對於領海的主權的行使受本公約和其他國際法規則的限制。"}], "keys": ["領海", "上空", "海床和底土", "其他國際法規則"], "plain": "沿海國的主權從陸地、內水（群島國則從群島水域）往外延伸到一條鄰接的海帶，這就是{{領海}}。主權不只及於水面，也包括上空、海床和底土，所以領海上空就是領空，外國航空器沒有「無害通過」可言，未經同意不得飛越。不過領海主權不是絕對的：第3項說主權的行使要受公約與其他國際法規則限制，最重要的限制就是外國船舶的無害通過權（第17條）。", "elements": [{"req": ["沿海國的陸地領土與內水（群島國為群島水域）以外", "鄰接的一帶海域"], "effect": "構成領海，沿海國主權及之"}, {"req": ["領海"], "effect": "主權及於上空、海床和底土（立體的主權範圍）"}, {"req": ["沿海國行使領海主權"], "effect": "須受公約及其他國際法規則限制，例如須容忍外國船舶無害通過"}], "traps": ["陷阱：無害通過權只適用於「船舶」；外國航空器沒有飛越他國領海上空的無害通過權。", "陷阱：領海是主權範圍，不是「管轄權」或「主權權利」；後兩者是專屬經濟海域與大陸礁層的用語（第56、77條）。"], "custom": {"status": "習慣法", "note": "沿海國對領海（含上空、海床與底土）享有主權，早在1958年《領海及鄰接區公約》前即為公認的習慣國際法。", "cases": []}, "related": ["unclos-3", "unclos-8", "unclos-17", "unclos-49"], "cases": [], "roc": "《中華民國領海及鄰接區法》（1998）第2條規定我國主權及於領海、領海之上空、海床及其底土，與本條相同。", "essay": "申論開頭可寫：「依《聯合國海洋法公約》第2條，沿海國主權及於領海及其上空、海床與底土，惟其行使須受公約及其他國際法規則之限制，最主要者為外國船舶之無害通過權（第17條）。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "3", "heading": "領海的寬度", "tier": "A", "paras": [{"n": "", "en": "Every State has the right to establish the breadth of its territorial sea up to a limit not exceeding 12 nautical miles, measured from baselines determined in accordance with this Convention.", "zh": "每一國家有權確定其領海的寬度，直至從按照本公約確定的基線量起不超過十二海里的界限為止。"}], "keys": ["十二海里", "基線"], "plain": "每個國家都可以自己決定領海寬度，但上限是從基線量起12{{海里}}（浬）。12是「最多」，不是固定值，國家可以主張3海里或其他較窄的寬度。所有海域寬度都從基線起算，這是考題最常玩的地方：鄰接區24海里、專屬經濟海域200海里，都是從基線量，不是從領海外緣量。", "elements": [{"req": ["國家宣布領海寬度", "自依公約劃定的基線起算", "不超過12海里"], "effect": "領海寬度合法"}, {"req": ["主張超過12海里的領海"], "effect": "超出部分違反公約，對他國無對抗力"}], "traps": ["陷阱：領海上限是12海里，24海里是鄰接區上限（第33條第2項）。gl109a_9選項A把領海寫成24海里，是錯誤敘述。", "陷阱：12海里是「不超過」，國家可主張較窄的領海；公約沒有強制每國一律12海里。", "陷阱：所有寬度都從「基線」量起；說「專屬經濟海域自鄰接區外緣起算」是錯的（gl115a_10）。"], "custom": {"status": "習慣法", "note": "1958年日內瓦會議與1960年第二次會議都未能就寬度達成協議；公約通過後，12海里上限已被普遍接受為習慣國際法。", "cases": []}, "related": ["unclos-4", "unclos-5", "unclos-33", "unclos-57"], "cases": [], "roc": "《中華民國領海及鄰接區法》第3條：領海為自基線起至其外側12浬間之海域。", "essay": "比較各海域時可用一句話：「各海域寬度均自基線起算：領海不超過12海里（第3條）、鄰接區不超過24海里（第33條第2項）、專屬經濟海域不超過200海里（第57條）；大陸礁層以自然延伸為原則，原則上至200海里，最遠不超過350海里或2,500公尺等深線外100海里（第76條）。」", "exam": [{"qid": "gl109a_9", "note": "正解A為錯誤敘述：領海寬度上限是12海里，不是24海里。B、C、D分別照錄第4、7、6條。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）作「每一個國家」，依聯合國作準中文本更正為「每一國家」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "4", "heading": "領海的外部界限", "tier": "B", "paras": [{"n": "", "en": "The outer limit of the territorial sea is the line every point of which is at a distance from the nearest point of the baseline equal to the breadth of the territorial sea.", "zh": "領海的外部界限是一條其每一點同基線最近點的距離等於領海寬度的線。"}], "keys": ["領海的外部界限", "領海寬度的線"], "plain": "領海外界線的畫法：線上每一點到基線最近點的距離，都剛好等於領海寬度（例如12海里）。這種畫法叫「圓弧法」或「包絡線法」，好處是外界線會自動跟著基線形狀走，不會因海岸彎曲而出現爭議。", "elements": [{"req": ["線上每一點與基線最近點的距離", "等於領海寬度"], "effect": "該線為領海的外部界限"}], "traps": ["陷阱：外部界限是「每一點同基線最近點」的距離等於領海寬度，不是與海岸線或陸地的距離。"], "custom": {"status": "不適用", "note": "技術性規定。", "cases": []}, "related": ["unclos-3", "unclos-5", "unclos-7"], "cases": [], "roc": "我國依《領海及鄰接區法》第5條，由行政院訂定並公告領海基線及領海外界線（1999年公告第一批，2009年修正）。", "essay": "", "exam": [{"qid": "gl109a_9", "note": "選項B照錄本條，敘述正確。"}, {"qid": "gl115a_9", "note": "選項D照錄本條，敘述正確；本題正解C。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "5", "heading": "正常基線", "tier": "A", "paras": [{"n": "", "en": "Except where otherwise provided in this Convention, the normal baseline for measuring the breadth of the territorial sea is the low-water line along the coast as marked on large-scale charts officially recognized by the coastal State.", "zh": "除本公約另有規定外，測算領海寬度的正常基線是沿海國官方承認的大比例尺海圖所標明的沿岸低潮線。"}], "keys": ["正常基線", "大比例尺海圖", "低潮線"], "plain": "基線是量測所有海域寬度的起點。「{{正常基線}}」就是沿岸的低潮線，以沿海國官方承認的大比例尺海圖標示為準。用低潮線（而不是高潮線）會讓基線更靠海一點，海域範圍也稍大。海岸平直時用正常基線；海岸曲折時可改用第7條的直線基線。", "elements": [{"req": ["公約無其他規定（如第6、7、9、10、47條）"], "effect": "以沿海國官方承認之大比例尺海圖所標明的沿岸低潮線為基線"}], "traps": ["陷阱：正常基線是「低潮線」，不是高潮線或平均海平面。", "陷阱：海圖須為沿海國「官方承認」的「大比例尺」海圖（gl115a_9選項A照錄本條，敘述正確）。"], "custom": {"status": "習慣法", "note": "低潮線為正常基線是長期國家實踐，英挪漁業案亦以低潮線為一般規則出發。", "cases": ["fisheries"]}, "related": ["unclos-6", "unclos-7", "unclos-3", "unclos-13"], "cases": [{"id": "fisheries", "point": "法院確認低潮線是測算領海的一般規則，但在海岸極為曲折時，可改用直線基線。"}], "roc": "《中華民國領海及鄰接區法》第4條：我國領海基線採直線基線為原則、正常基線為例外的混合基線法。", "essay": "", "exam": [{"qid": "gl115a_9", "note": "選項A照錄本條，敘述正確；本題正解C（我國未公告太平島基線）。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "6", "heading": "礁石", "tier": "B", "paras": [{"n": "", "en": "In the case of islands situated on atolls or of islands having fringing reefs, the baseline for measuring the breadth of the territorial sea is the seaward low-water line of the reef, as shown by the appropriate symbol on charts officially recognized by the coastal State.", "zh": "在位於環礁上的島嶼或有岸礁環列的島嶼的情形下，測算領海寬度的基線是沿海國官方承認的海圖上以適當標記顯示的礁石的向海低潮線。"}], "keys": ["環礁", "岸礁", "向海低潮線"], "plain": "島嶼位在環礁上或周圍有岸礁環繞時，{{基線}}不畫在島的岸邊，而是畫在礁石朝海那一側的低潮線，等於把礁湖包進基線內。南太平洋、印度洋許多珊瑚礁島國都依靠這條規定。", "elements": [{"req": ["島嶼位於環礁上，或有岸礁環列"], "effect": "以官方海圖標示之礁石向海低潮線為基線"}], "traps": ["陷阱：基線是礁石的「向海」低潮線，不是向陸一側，也不是島嶼本身的海岸線（gl109a_9選項D照錄本條，敘述正確）。"], "custom": {"status": "不適用", "note": "公約新增的技術性規定。", "cases": []}, "related": ["unclos-5", "unclos-47", "unclos-121"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl109a_9", "note": "選項D照錄本條，敘述正確。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "7", "heading": "直線基線", "tier": "A", "paras": [{"n": "1", "en": "In localities where the coastline is deeply indented and cut into, or if there is a fringe of islands along the coast in its immediate vicinity, the method of straight baselines joining appropriate points may be employed in drawing the baseline from which the breadth of the territorial sea is measured.", "zh": "在海岸線極為曲折的地方，或者如果緊接海岸有一系列島嶼，測算領海寬度的基線的劃定可採用連接各適當點的直線基線法。"}, {"n": "2", "en": "Where because of the presence of a delta and other natural conditions the coastline is highly unstable, the appropriate points may be selected along the furthest seaward extent of the low-water line and, notwithstanding subsequent regression of the low-water line, the straight baselines shall remain effective until changed by the coastal State in accordance with this Convention.", "zh": "在因有三角洲和其他自然條件以致海岸線非常不穩定之處，可沿低潮線向海最遠處選擇各適當點，而且儘管以後低潮線發生後退現象，該直線基線在沿海國按照本公約加以改變以前仍然有效。"}, {"n": "3", "en": "The drawing of straight baselines must not depart to any appreciable extent from the general direction of the coast, and the sea areas lying within the lines must be sufficiently closely linked to the land domain to be subject to the regime of internal waters.", "zh": "直線基線的劃定不應在任何明顯的程度上偏離海岸的一般方向，而且基線內的海域必須充分接近陸地領土，使其受內水制度的支配。"}, {"n": "4", "en": "Straight baselines shall not be drawn to and from low-tide elevations, unless lighthouses or similar installations which are permanently above sea level have been built on them or except in instances where the drawing of baselines to and from such elevations has received general international recognition.", "zh": "除在低潮高地上築有永久高於海平面的燈塔或類似設施，或以這種高地作為劃定基線的起訖點已獲得國際一般承認者外，直線基線的劃定不應以低潮高地為起訖點。"}, {"n": "5", "en": "Where the method of straight baselines is applicable under paragraph 1, account may be taken, in determining particular baselines, of economic interests peculiar to the region concerned, the reality and the importance of which are clearly evidenced by long usage.", "zh": "在依據第一款可以採用直線基線法之處，確定特定基線時，對於有關地區所特有的並經長期慣例清楚地證明其為實在而重要的經濟利益，可予以考慮。"}, {"n": "6", "en": "The system of straight baselines may not be applied by a State in such a manner as to cut off the territorial sea of another State from the high seas or an exclusive economic zone.", "zh": "一國不得採用直線基線制度，致使另一國的領海同公海或專屬經濟區隔斷。"}], "keys": ["極為曲折", "直線基線", "一般方向", "低潮高地"], "plain": "海岸線非常曲折（例如挪威的峽灣），或緊靠海岸有一串島嶼時，沿海國可以不沿著低潮線，改用直線把各適當點連起來當基線。這條規定源自1951年英挪漁業案。{{直線基線}}有幾項限制：不能明顯偏離海岸的一般方向；線內海域須與陸地關係夠密切，才能當作內水；原則上不能以低潮高地為端點；不能把別國領海和公海或專屬經濟海域隔開。地區特有、經長期慣例證明的經濟利益（例如漁業）可以納入考量。", "elements": [{"req": ["海岸線極為曲折，或緊接海岸有一系列島嶼"], "effect": "得採用連接各適當點的直線基線"}, {"req": ["不明顯偏離海岸一般方向", "線內海域與陸地充分接近", "原則上不以低潮高地為起訖點（有燈塔等永久設施或已獲國際一般承認者除外）", "不使他國領海與公海或專屬經濟海域隔斷"], "effect": "直線基線合法；線內水域為內水（但第8條第2項保留無害通過）"}, {"req": ["三角洲等自然條件使海岸線非常不穩定"], "effect": "可沿低潮線向海最遠處選點；低潮線後退時，基線在沿海國修改前仍然有效"}], "traps": ["陷阱：直線基線是「得」採用（may），不是沿海國的義務；條件不符時應使用正常基線。", "陷阱：公約對直線基線的長度沒有上限；24海里是海灣封口線的上限（第10條）。", "陷阱：直線基線與英挪漁業案密切相關（gl115a_9選項B，敘述正確）。"], "custom": {"status": "習慣法", "note": "英挪漁業案確認直線基線法不違反國際法，其要件後來寫入1958年《領海及鄰接區公約》第4條及本條。", "cases": ["fisheries"]}, "related": ["unclos-5", "unclos-8", "unclos-13", "unclos-47"], "cases": [{"id": "fisheries", "point": "法院以10比2認定挪威1935年敕令採用的直線基線法不違反國際法，並提出「不得明顯偏離海岸一般方向」、經濟利益經長期慣例證明等標準。"}], "roc": "我國1999年公告第一批領海基線，台灣本島與澎湖、釣魚臺列嶼、東沙群島、中沙群島大多採直線基線；南沙群島基線及領海外界線則表明「另案公告」，至今未公告。我國直線基線曾遭美國國務院《海洋界限》（Limits in the Seas）系列報告批評未符合第7條要件。", "essay": "論直線基線時可寫：「依《聯合國海洋法公約》第7條，於海岸線極為曲折或緊接海岸有一系列島嶼之處，得採直線基線；惟不得明顯偏離海岸一般方向，線內海域須與陸地充分接近而得適用內水制度（第3項），此即英挪漁業案（1951）所確立之標準。」", "exam": [{"qid": "gl109a_9", "note": "選項C照錄本條第1項，敘述正確。"}, {"qid": "gl115a_9", "note": "選項B（直線基線與英挪漁業案密切相關）敘述正確；正解C。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "8", "heading": "內水", "tier": "A", "paras": [{"n": "1", "en": "Except as provided in Part IV, waters on the landward side of the baseline of the territorial sea form part of the internal waters of the State.", "zh": "除第四部分另有規定外，領海基線向陸一面的水域構成國家內水的一部分。"}, {"n": "2", "en": "Where the establishment of a straight baseline in accordance with the method set forth in article 7 has the effect of enclosing as internal waters areas which had not previously been considered as such, a right of innocent passage as provided in this Convention shall exist in those waters.", "zh": "如果按照第七條所規定的方法確定直線基線的效果使原來並未認為是內水的區域被包圍在內成為內水，則在此種水域內應有本公約所規定的無害通過權。"}], "keys": ["向陸一面的水域", "內水", "無害通過權"], "plain": "基線向陸地那一側的水域都是{{內水}}，例如港口、河流、封口線內的海灣。內水與陸地領土地位相同，沿海國有完整主權，外國船舶原則上沒有無害通過權，進港要經沿海國同意。唯一例外在第2項：如果因劃直線基線，把原本不算內水的海域圈進來，這些水域仍保留外國船舶的無害通過權。群島國的群島水域另依第四部分處理，不是內水。", "elements": [{"req": ["水域位於領海基線向陸一面", "不屬於第四部分的群島水域"], "effect": "為內水，沿海國享有完整主權；外國船舶原則上無無害通過權"}, {"req": ["因依第7條劃設直線基線", "使原非內水的區域成為內水"], "effect": "該水域仍適用公約規定的無害通過權"}], "traps": ["陷阱：外國船舶在內水原則上「沒有」無害通過權（SG046正解B）；例外只有第8條第2項，因直線基線新圈入的水域。", "陷阱：群島基線內的水域是「群島水域」（第49條），不是內水；群島國可在群島水域內再為河口、海灣、港口劃封閉線，線內才是內水（第50條）。", "陷阱：外國軍艦經同意進入內水，仍享有主權豁免（第32條的精神；SG046選項C敘述正確）。"], "custom": {"status": "習慣法", "note": "內水受沿海國完整主權支配，為傳統習慣國際法；外國船舶入港並無一般性的權利，但遇難船舶可依習慣法進港避難。", "cases": []}, "related": ["unclos-7", "unclos-9", "unclos-10", "unclos-50", "unclos-25"], "cases": [], "roc": "《中華民國領海及鄰接區法》沒有明文定義內水；依第4條的混合基線法劃定基線後，基線向陸一側的水域即屬內水。", "essay": "區分內水與領海時：「內水為基線向陸一側之水域（第8條第1項），沿海國享有與陸地領土相同之完整主權，外國船舶原則上無無害通過權；領海則須容忍外國船舶無害通過（第17條）。惟因劃設直線基線而新圈入之內水，仍保留無害通過權（第8條第2項）。」", "exam": [{"qid": "SG046", "note": "正解B為錯誤敘述：外國船舶在內水原則上無無害通過權。選項A的數字問題見本題查證旗標。"}, {"qid": "gl115a_10", "note": "選項A（基線向陸一側之所有水域為內水）依本條為正確敘述；本題正解C。嚴格而言群島水域是例外。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "9", "heading": "河口", "tier": "B", "paras": [{"n": "", "en": "If a river flows directly into the sea, the baseline shall be a straight line across the mouth of the river between points on the low-water line of its banks.", "zh": "如果河流直接流入海洋，基線應是一條在兩岸低潮線上兩點之間橫越河口的直線。"}], "keys": ["河口", "直線"], "plain": "河流直接流入海洋時，基線就是橫越河口、連接兩岸低潮線上兩點的直線；線內的河段是內水。公約沒有規定這條線的長度上限，這一點和海灣不同（海灣封口線上限24海里）。", "elements": [{"req": ["河流直接流入海洋"], "effect": "以橫越河口、連接兩岸低潮線上兩點的直線為基線"}], "traps": ["陷阱：河口直線沒有長度上限；「不得超過24海里」是第10條海灣封口線的規定。若河口形成河口灣而符合海灣要件，則適用第10條。"], "custom": {"status": "不適用", "note": "技術性規定，沿襲1958年《領海及鄰接區公約》第13條。", "cases": []}, "related": ["unclos-8", "unclos-10", "unclos-5"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG046", "note": "選項A稱河口封口線「不得超過24海里」，與本條不符（本條無長度限制），見本題查證旗標。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "10", "heading": "海灣", "tier": "B", "paras": [{"n": "1", "en": "This article relates only to bays the coasts of which belong to a single State.", "zh": "本條僅涉及海岸屬於一國的海灣。"}, {"n": "2", "en": "For the purposes of this Convention, a bay is a well-marked indentation whose penetration is in such proportion to the width of its mouth as to contain land-locked waters and constitute more than a mere curvature of the coast. An indentation shall not, however, be regarded as a bay unless its area is as large as, or larger than, that of the semi-circle whose diameter is a line drawn across the mouth of that indentation.", "zh": "為本公約的目的，海灣是明顯的水曲，其凹入程度和曲口寬度的比例，使其有被陸地環抱的水域，而不僅為海岸的彎曲。但水曲除其面積等於或大於橫越曲口所劃的直線作為直徑的半圓形的面積外，不應視為海灣。"}, {"n": "3", "en": "For the purpose of measurement, the area of an indentation is that lying between the low-water mark around the shore of the indentation and a line joining the low-water mark of its natural entrance points. Where, because of the presence of islands, an indentation has more than one mouth, the semi-circle shall be drawn on a line as long as the sum total of the lengths of the lines across the different mouths. Islands within an indentation shall be included as if they were part of the water area of the indentation.", "zh": "為測算的目的，水曲的面積是位於水曲陸岸周圍的低潮標和一條連接水曲天然入口兩端低潮標的線之間的面積。如果因有島嶼而水曲有一個以上的曲口，該半圓形應劃在與橫越各曲口的各線總長度相等的一條線上。水曲內的島嶼應視為水曲水域的一部分而包括在內。"}, {"n": "4", "en": "If the distance between the low-water marks of the natural entrance points of a bay does not exceed 24 nautical miles, a closing line may be drawn between these two low-water marks, and the waters enclosed thereby shall be considered as internal waters.", "zh": "如果海灣天然入口兩端的低潮標之間的距離不超過二十四海里，則可在這兩個低潮標之間劃出一條封口線，該線所包圍的水域應視為內水。"}, {"n": "5", "en": "Where the distance between the low-water marks of the natural entrance points of a bay exceeds 24 nautical miles, a straight baseline of 24 nautical miles shall be drawn within the bay in such a manner as to enclose the maximum area of water that is possible with a line of that length.", "zh": "如果海灣天然入口兩端的低潮標之間的距離超過二十四海里，二十四海里的直線基線應劃在海灣內，以劃入該長度的線所可能劃入的最大水域。"}, {"n": "6", "en": "The foregoing provisions do not apply to so-called \"historic\" bays, or in any case where the system of straight baselines provided for in article 7 is applied.", "zh": "上述規定不適用於所謂「歷史性」海灣，也不適用於採用第七條所規定的直線基線法的任何情形。"}], "keys": ["海灣", "半圓形", "二十四海里", "歷史性"], "plain": "本條只處理海岸屬於同一國家的海灣。要構成法律上的海灣，必須是明顯凹入、被陸地環抱的水曲，而且面積至少等於以灣口寬度為直徑畫出的半圓（半圓測試）。灣口寬度不超過24海里，就可直接畫封口線，線內是內水；超過24海里，則在灣內畫一條24海里的直線，盡量圈入最大水域。第6項有兩個例外：「{{歷史性海灣}}」不受這些限制，採用第7條直線基線的情形也不適用本條。公約沒有定義歷史性海灣，通說要求長期、公開、有效行使主權，並獲得他國默認。", "elements": [{"req": ["海岸屬於單一國家", "明顯水曲，面積不小於以灣口寬度為直徑的半圓"], "effect": "法律上的海灣"}, {"req": ["天然入口兩端低潮標距離不超過24海里"], "effect": "得劃封口線，線內水域為內水"}, {"req": ["天然入口距離超過24海里"], "effect": "在灣內劃24海里直線基線，圈入最大水域"}, {"req": ["歷史性海灣，或已適用第7條直線基線"], "effect": "不適用本條限制"}], "traps": ["陷阱：24海里限制只適用於海岸屬於單一國家的海灣；多國共有的海灣（如豐塞卡灣）不適用本條。", "陷阱：公約沒有定義「歷史性海灣」，也沒有列出要件；要件來自習慣法與判決，作答時應說明國家長期有效行使主權並獲他國默認。", "陷阱：英挪漁業案已認定「10海里海灣規則」不是習慣國際法，公約最後採24海里。"], "custom": {"status": "部分", "note": "半圓測試與24海里封口線源自1958年公約第7條；歷史性海灣的要件屬習慣法，常引用1992年陸地、島嶼和海上邊界爭端案（薩爾瓦多/宏都拉斯：尼加拉瓜參加）處理的豐塞卡灣。", "cases": ["fisheries"]}, "related": ["unclos-8", "unclos-9", "unclos-7", "unclos-15", "unclos-298"], "cases": [{"id": "fisheries", "point": "法院認定英國主張的10海里海灣封口線並未成為國際法規則，且挪威一向反對適用。"}], "roc": "", "essay": "論歷史性水域時：「公約未定義歷史性水域，僅於第10條第6項（歷史性海灣）、第15條（歷史性所有權）及第298條第1項(a)款（得排除強制程序）提及。通說認為，主張國須長期、公開、有效行使主權，並獲他國默認。南海仲裁案（2016）並認定，公約已取代與其不符的歷史性權利主張。」", "exam": [{"qid": "SG046", "note": "24海里封口線是本條第4項的海灣規定；SG046選項A將其套用於河口，見查證旗標。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "13", "heading": "低潮高地", "tier": "A", "paras": [{"n": "1", "en": "A low-tide elevation is a naturally formed area of land which is surrounded by and above water at low tide but submerged at high tide. Where a low-tide elevation is situated wholly or partly at a distance not exceeding the breadth of the territorial sea from the mainland or an island, the low-water line on that elevation may be used as the baseline for measuring the breadth of the territorial sea.", "zh": "低潮高地是在低潮時四面環水並高於水面但在高潮時沒入水中的自然形成的陸地。如果低潮高地全部或一部與大陸或島嶼的距離不超過領海的寬度，該高地的低潮線可作為測算領海寬度的基線。"}, {"n": "2", "en": "Where a low-tide elevation is wholly situated at a distance exceeding the breadth of the territorial sea from the mainland or an island, it has no territorial sea of its own.", "zh": "如果低潮高地全部與大陸或島嶼的距離超過領海的寬度，則該高地沒有其自己的領海。"}], "keys": ["低潮高地", "沒入水中", "沒有其自己的領海"], "plain": "{{低潮高地}}是自然形成、低潮時露出水面、高潮時被淹沒的陸地。它不是島嶼，本身不能產生領海。但是如果它全部或一部分位在大陸或島嶼的領海範圍內，它的低潮線可以當作基線，等於把領海再往外推。如果完全位於領海之外，就沒有自己的領海。", "elements": [{"req": ["自然形成", "低潮時四面環水且露出水面", "高潮時沒入水中"], "effect": "為低潮高地（不是島嶼）"}, {"req": ["全部或一部位於距大陸或島嶼不超過領海寬度之處"], "effect": "其低潮線可作為測算領海寬度的基線"}, {"req": ["全部位於領海寬度以外"], "effect": "沒有自己的領海"}], "traps": ["陷阱：低潮高地是「高潮時沒入」；島嶼是「高潮時高於水面」（第121條）。兩者的分界就是高潮時是否露出。", "陷阱：距離超過領海寬度的低潮高地「沒有」自己的領海（gl110a_6選項B錯誤）。", "陷阱：南海仲裁案認定低潮高地不能透過占有取得主權，也不能經人工改造而變成島嶼。"], "custom": {"status": "部分", "note": "國際法院在卡達訴巴林案（2001）依本條內容處理低潮高地，並指出國際法對低潮高地能否被占有尚無定論；南海仲裁案（2016）則認定低潮高地不能被占有。", "cases": []}, "related": ["unclos-121", "unclos-7", "unclos-5", "unclos-60"], "cases": [], "roc": "", "essay": "比較島嶼、岩礁、低潮高地時：「島嶼為高潮時高於水面之自然陸地，享有完整海域（第121條第2項）；不能維持人類居住或其本身經濟生活之岩礁，無專屬經濟海域或大陸礁層（第121條第3項）；低潮高地高潮時沒入水中，原則上無自己的領海，僅位於領海內者得作為基線起點（第13條）。」", "exam": [{"qid": "gl110a_6", "note": "選項B錯誤：低潮高地全部距大陸或島嶼超過領海寬度時，沒有自己的領海。正解A。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "15", "heading": "海岸相向或相鄰國家間領海界限的劃定", "tier": "A", "paras": [{"n": "", "en": "Where the coasts of two States are opposite or adjacent to each other, neither of the two States is entitled, failing agreement between them to the contrary, to extend its territorial sea beyond the median line every point of which is equidistant from the nearest points on the baselines from which the breadth of the territorial seas of each of the two States is measured. The above provision does not apply, however, where it is necessary by reason of historic title or other special circumstances to delimit the territorial seas of the two States in a way which is at variance therewith.", "zh": "如果兩國海岸彼此相向或相鄰，兩國中任何一國在彼此沒有相反協議的情形下，均無權將其領海伸延至一條其每一點都同測算兩國中每一國領海寬度的基線上最近各點距離相等的中間線以外。但如因歷史性所有權或其他特殊情況而有必要按照與上述規定不同的方法劃定兩國領海的界限，則不適用上述規定。"}], "keys": ["中間線", "歷史性所有權", "特殊情況"], "plain": "兩國海岸相向或相鄰而領海重疊時，除非兩國另有協議，任何一方都不能把領海延伸到中間線（等距線）以外。但有歷史性所有權或其他特殊情況時，可以不照中間線劃界。這就是「等距／特殊情況」規則。和專屬經濟海域、大陸礁層的劃界（第74、83條只要求「公平解決」）相比，領海劃界的條文對等距線的依賴最明確。", "elements": [{"req": ["兩國海岸相向或相鄰", "無相反協議", "無歷史性所有權或其他特殊情況"], "effect": "任一國領海不得超過中間線（等距線）"}, {"req": ["有歷史性所有權或其他特殊情況"], "effect": "得以不同於中間線的方式劃界"}], "traps": ["陷阱：協議優先；中間線只在「無相反協議」時適用。", "陷阱：第15條（領海）有明文的等距線規則，第74、83條（專屬經濟海域、大陸礁層）則只要求「公平解決」，沒有規定等距線；實務上國際法院對後兩者採「三階段劃界法」。"], "custom": {"status": "習慣法", "note": "國際法院在卡達訴巴林案（2001）認定本條反映習慣國際法；實務上先劃暫定等距線，再審酌特殊情況調整。", "cases": []}, "related": ["unclos-74", "unclos-83", "unclos-10", "unclos-298"], "cases": [], "roc": "《中華民國領海及鄰接區法》第6條：我國領海與相鄰或相向國家的領海重疊時，以等距中線為分界線，但有協議者從其協議。條文沒有「特殊情況」的但書。", "essay": "論海洋劃界方法時：「領海劃界依第15條之等距／特殊情況規則；專屬經濟海域與大陸礁層劃界依第74、83條，以達成公平解決為目標。國際法院於黑海劃界案（2009）整理出三階段劃界法：先劃暫定等距線，再考量相關情況調整，最後以不成比例檢驗確認結果公平。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "17", "heading": "無害通過權", "tier": "A", "paras": [{"n": "", "en": "Subject to this Convention, ships of all States, whether coastal or land-locked, enjoy the right of innocent passage through the territorial sea.", "zh": "在本公約的限制下，所有國家，不論為沿海國或內陸國，其船舶均享有無害通過領海的權利。"}], "keys": ["所有國家", "內陸國", "無害通過領海的權利"], "plain": "所有國家的船舶，不論是沿海國或內陸國的船，都享有{{無害通過}}他國領海的權利。這是沿海國領海主權最重要的限制。權利主體是「船舶」，飛機沒有；適用範圍是「領海」，內水原則上沒有。公約沒有區分軍艦與商船，所以軍艦是否享有無害通過權、沿海國能否要求事先許可或通知，一直有爭議（我國《領海及鄰接區法》第7條要求外國軍用或公務船舶通過須事先告知）。", "elements": [{"req": ["任何國家（含內陸國）的船舶", "通過他國領海", "通過符合第18條「通過」的意義", "通過屬第19條所稱「無害」"], "effect": "享有無害通過權，沿海國不得妨礙（第24條）"}], "traps": ["陷阱：權利屬於所有國家的「船舶」，內陸國也有；但航空器沒有飛越領海的無害通過權。", "陷阱：領海的通行制度是「無害通過」；「過境通行」適用於國際海峽（第38條），「群島海道通過」適用於群島水域（第53條），三者不可混用（gl113a_6）。", "陷阱：鄰接區與專屬經濟海域不是領海，船舶在那裡享有的是航行自由（第58條），不是「無害通過」（gl113a_6選項C錯誤）。", "陷阱：沿海國仍可依第21條制定無害通過的法律規章；說沿海國「不得制定」相關法規是錯的（gl110a_6選項C）。"], "custom": {"status": "習慣法", "note": "無害通過權是公認的習慣國際法；軍艦是否須事先許可或通知，各國實踐不一。", "cases": ["corfu"]}, "related": ["unclos-18", "unclos-19", "unclos-21", "unclos-25", "unclos-30", "unclos-38", "unclos-52"], "cases": [{"id": "corfu", "point": "法院認定各國軍艦平時有權無害通過連接公海兩部分的國際海峽，沿海國不得禁止；常被引為軍艦享有無害通過權的依據。"}], "roc": "《中華民國領海及鄰接區法》第7條：外國民用船舶在不損害我國和平、良好秩序與安全的前提下，得無害通過我國領海；外國軍用或公務船舶通過我國領海，應先行告知。", "essay": "論軍艦通過權時：「公約第17條規定『所有國家之船舶』均享無害通過權，第二部分第三分節C目復有軍艦專節（第29至32條），文義上不排除軍艦。惟部分國家要求事先許可或通知，美國等海權國家則反對。科孚海峽案（1949）肯定軍艦平時得無害通過國際海峽。」", "exam": [{"qid": "gl110a_6", "note": "選項C錯誤：沿海國得依第21條制定無害通過的法律規章。正解A。"}, {"qid": "gl113a_6", "note": "正解D（專屬經濟海域的航行自由）。本條是領海的「無害通過」；A把領海說成過境通行、C把鄰接區說成無害通過，都錯。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "18", "heading": "通過的意義", "tier": "A", "paras": [{"n": "1", "en": "Passage means navigation through the territorial sea for the purpose of:\n(a) traversing that sea without entering internal waters or calling at a roadstead or port facility outside internal waters; or\n(b) proceeding to or from internal waters or a call at such roadstead or port facility.", "zh": "通過是指為了下列目的，通過領海的航行：\n(a)穿過領海但不進入內水或停靠內水以外的泊船處或港口設施；或\n(b)駛往或駛出內水或停靠這種泊船處或港口設施。"}, {"n": "2", "en": "Passage shall be continuous and expeditious. However, passage includes stopping and anchoring, but only in so far as the same are incidental to ordinary navigation or are rendered necessary by force majeure or distress or for the purpose of rendering assistance to persons, ships or aircraft in danger or distress.", "zh": "通過應繼續不停和迅速進行。通過包括停船和下錨在內，但以通常航行所附帶發生的或由於不可抗力或遇難所必要的或為救助遇險或遭難的人員、船舶或飛機的目的為限。"}], "keys": ["穿過領海", "駛往或駛出內水", "繼續不停和迅速進行", "停船和下錨"], "plain": "「通過」有兩種：一是單純穿越領海、不進內水；二是駛進或駛出內水（或停靠內水外的泊船處、港口設施）。通過必須繼續不停、迅速進行。停船下錨原則上不算通過，只有三種情形例外：通常航行附帶發生、因不可抗力或遇難所必要、為救助遇險的人員、船舶或飛機。所以在領海內長時間逗留、徘徊，即使沒做壞事，也已不是「通過」。", "elements": [{"req": ["穿越領海不進入內水", "或駛往、駛出內水或停靠泊船處、港口設施"], "effect": "屬於「通過」"}, {"req": ["繼續不停", "迅速進行"], "effect": "符合通過要件"}, {"req": ["停船或下錨"], "effect": "僅於通常航行附帶、不可抗力或遇難、救助遇險者時，仍屬通過"}], "traps": ["陷阱：無害通過須「繼續不停和迅速」，停船下錨只有三種例外；在領海內徘徊不是通過。", "陷阱：駛往或駛出內水也是「通過」的一種，不限於單純穿越。"], "custom": {"status": "習慣法", "note": "與1958年《領海及鄰接區公約》第14條第2、3項內容相近，屬無害通過制度的核心。", "cases": []}, "related": ["unclos-17", "unclos-19", "unclos-28", "unclos-39"], "cases": [], "roc": "", "essay": "申論「何謂無害通過」時，應分「通過」與「無害」兩個要件：通過須符合第18條（穿越或進出內水、繼續不停且迅速），無害須符合第19條。", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "19", "heading": "無害通過的意義", "tier": "A", "paras": [{"n": "1", "en": "Passage is innocent so long as it is not prejudicial to the peace, good order or security of the coastal State. Such passage shall take place in conformity with this Convention and with other rules of international law.", "zh": "通過只要不損害沿海國的和平、良好秩序或安全，就是無害的。這種通過的進行應符合本公約和其他國際法規則。"}, {"n": "2", "en": "Passage of a foreign ship shall be considered to be prejudicial to the peace, good order or security of the coastal State if in the territorial sea it engages in any of the following activities:\n(a) any threat or use of force against the sovereignty, territorial integrity or political independence of the coastal State, or in any other manner in violation of the principles of international law embodied in the Charter of the United Nations;\n(b) any exercise or practice with weapons of any kind;\n(c) any act aimed at collecting information to the prejudice of the defence or security of the coastal State;\n(d) any act of propaganda aimed at affecting the defence or security of the coastal State;\n(e) the launching, landing or taking on board of any aircraft;\n(f) the launching, landing or taking on board of any military device;\n(g) the loading or unloading of any commodity, currency or person contrary to the customs, fiscal, immigration or sanitary laws and regulations of the coastal State;\n(h) any act of wilful and serious pollution contrary to this Convention;\n(i) any fishing activities;\n(j) the carrying out of research or survey activities;\n(k) any act aimed at interfering with any systems of communication or any other facilities or installations of the coastal State;\n(l) any other activity not having a direct bearing on passage.", "zh": "如果外國船舶在領海內進行下列任何一種活動，其通過即應視為損害沿海國的和平、良好秩序或安全：\n(a)對沿海國的主權、領土完整或政治獨立進行任何武力威脅或使用武力，或以任何其他違反「聯合國憲章」所體現的國際法原則的方式進行武力威脅或使用武力；\n(b)以任何種類的武器進行任何操練或演習；\n(c)任何目的在於搜集情報使沿海國的防務或安全受損害的行為；\n(d)任何目的在於影響沿海國防務或安全的宣傳行為；\n(e)在船上起落或接載任何飛機；\n(f)在船上發射、降落或接載任何軍事裝置；\n(g)違反沿海國海關、財政、移民或衛生的法律和規章，上下任何商品、貨幣或人員；\n(h)違反本公約規定的任何故意和嚴重的污染行為；\n(i)任何捕魚活動；\n(j)進行研究或測量活動；\n(k)任何目的在於干擾沿海國任何通訊系統或任何其他設施或設備的行為；\n(l)與通過沒有直接關係的任何其他活動。"}], "keys": ["不損害沿海國的和平、良好秩序或安全", "任何捕魚活動", "與通過沒有直接關係的任何其他活動"], "plain": "通過只要不損害沿海國的和平、良好秩序或安全，就是無害的。第2項列出12種活動，外國船舶在領海內從事其中任何一種，通過就被視為有害，例如：武力威脅或使用武力、武器演習、蒐集情報、軍事宣傳、起降飛機或軍事裝置、違法裝卸貨物或人員、故意且嚴重的污染、捕魚、研究或測量、干擾通訊，以及「與通過沒有直接關係的任何其他活動」。判斷標準是船舶的「活動」，而不是船舶的種類、國籍或貨物。", "elements": [{"req": ["通過不損害沿海國的和平、良好秩序或安全", "符合公約與其他國際法規則"], "effect": "為無害通過"}, {"req": ["外國船舶在領海內從事第2項(a)至(l)款任一活動"], "effect": "通過視為損害沿海國和平、良好秩序或安全，沿海國得依第25條採取必要步驟"}], "traps": ["陷阱：第2項看的是船舶在領海內「從事」的活動；船舶種類（如核動力船、軍艦）本身不使通過變成有害。", "陷阱：「任何捕魚活動」都有害，不論規模；污染則限於「故意和嚴重」的污染行為。", "陷阱：第(l)款「與通過沒有直接關係的任何其他活動」是概括條款，所以第2項不是窮盡列舉。", "陷阱：潛水艇在領海內須浮出水面並展示船旗（第20條），否則不符合無害通過的條件。"], "custom": {"status": "部分", "note": "第1項的一般標準是習慣法；第2項的列舉是公約新增。美蘇1989年《關於無害通過的國際法規則統一解釋》確認第2項為窮盡列舉，但學說仍有爭論。", "cases": []}, "related": ["unclos-17", "unclos-18", "unclos-20", "unclos-21", "unclos-25", "unclos-30"], "cases": [], "roc": "《中華民國領海及鄰接區法》第8條列舉外國船舶通過非屬無害的情形，對應本條第2項。", "essay": "論軍艦在他國領海的權利時，可列出軍艦最常違反的款項：武器演習（b）、蒐集情報（c）、起降飛機（e）或軍事裝置（f）；並指出公約以「活動」判斷有害與否，軍艦身分本身不使通過喪失無害性。", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「就是無害的，這種通過」依作準本改為句號；第2項「損害沿海的和平」漏「國」字，依聯合國作準中文本補正。"}]});

ARTICLES.push({"treaty": "unclos", "no": "21", "heading": "沿海國關於無害通過的法律和規章", "tier": "A", "paras": [{"n": "1", "en": "The coastal State may adopt laws and regulations, in conformity with the provisions of this Convention and other rules of international law, relating to innocent passage through the territorial sea, in respect of all or any of the following:\n(a) the safety of navigation and the regulation of maritime traffic;\n(b) the protection of navigational aids and facilities and other facilities or installations;\n(c) the protection of cables and pipelines;\n(d) the conservation of the living resources of the sea;\n(e) the prevention of infringement of the fisheries laws and regulations of the coastal State;\n(f) the preservation of the environment of the coastal State and the prevention, reduction and control of pollution thereof;\n(g) marine scientific research and hydrographic surveys;\n(h) the prevention of infringement of the customs, fiscal, immigration or sanitary laws and regulations of the coastal State.", "zh": "沿海國可依本公約規定和其他國際法規則，對下列各項或任何一項制定關於無害通過領海的法律和規章：\n(a)航行安全及海上交通管理；\n(b)保護助航設備和設施以及其他設施或設備；\n(c)保護電纜和管道；\n(d)養護海洋生物資源；\n(e)防止違犯沿海國的漁業法律和規章；\n(f)保全沿海國的環境，並防止、減少和控制該環境受污染；\n(g)海洋科學研究和水文測量；\n(h)防止違犯沿海國的海關、財政、移民或衛生的法律和規章。"}, {"n": "2", "en": "Such laws and regulations shall not apply to the design, construction, manning or equipment of foreign ships unless they are giving effect to generally accepted international rules or standards.", "zh": "這種法律和規章除使一般接受的國際規則或標準有效外，不應適用於外國船舶的設計、構造、人員配備或裝備。"}, {"n": "3", "en": "The coastal State shall give due publicity to all such laws and regulations.", "zh": "沿海國應將所有這種法律和規章妥為公佈。"}, {"n": "4", "en": "Foreign ships exercising the right of innocent passage through the territorial sea shall comply with all such laws and regulations and all generally accepted international regulations relating to the prevention of collisions at sea.", "zh": "行使無害通過領海權利的外國船舶應遵守所有這種法律和規章以及關於防止海上碰撞的一切一般接受的國際規章。"}], "keys": ["航行安全及海上交通管理", "設計、構造、人員配備或裝備", "妥為公佈"], "plain": "沿海國可以就8類事項制定無害通過的法律規章，包括航行安全、保護助航設施與電纜管道、養護生物資源、防止違反漁業法規、保全環境、海洋科學研究與水文測量、防止違反海關、財政、移民或衛生法規。外國船舶通過時必須遵守。但有一個重要限制：除非是落實一般接受的國際規則或標準，沿海國不能規定外國船舶的設計、構造、人員配備或裝備（以免每國各訂一套造船標準，讓船舶無法航行）。法規也必須妥為公布。", "elements": [{"req": ["法規內容屬第1項(a)至(h)款事項", "符合公約及其他國際法規則", "妥為公布"], "effect": "外國船舶行使無害通過時應遵守（第4項）"}, {"req": ["法規涉及外國船舶的設計、構造、人員配備或裝備"], "effect": "除使一般接受的國際規則或標準生效外，不適用於外國船舶"}], "traps": ["陷阱：沿海國「可以」制定無害通過的法律規章；說沿海國不得制定是錯的（gl110a_6選項C）。", "陷阱：船舶設計、構造、人員配備、裝備只能落實國際標準，沿海國不能自訂更嚴格的標準。"], "custom": {"status": "不適用", "note": "公約將沿海國立法權限明文化。", "cases": []}, "related": ["unclos-17", "unclos-19", "unclos-22", "unclos-24", "unclos-25"], "cases": [], "roc": "《中華民國領海及鄰接區法》第11條授權政府就無害通過制定法令，第12條規定外國船舶應遵守海道或分道通航制。", "essay": "", "exam": [{"qid": "gl110a_6", "note": "選項C錯誤：沿海國得依本條制定關於無害通過的法律規章。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "25", "heading": "沿海國的保護權", "tier": "A", "paras": [{"n": "1", "en": "The coastal State may take the necessary steps in its territorial sea to prevent passage which is not innocent.", "zh": "沿海國可在其領海內採取必要的步驟以防止非無害的通過。"}, {"n": "2", "en": "In the case of ships proceeding to internal waters or a call at a port facility outside internal waters, the coastal State also has the right to take the necessary steps to prevent any breach of the conditions to which admission of those ships to internal waters or such a call is subject.", "zh": "在船舶駛往內水或停靠內水外的港口設備的情形下，沿海國也有權採取必要的步驟，以防止對准許這種船舶駛往內水或停靠港口的條件的任何破壞。"}, {"n": "3", "en": "The coastal State may, without discrimination in form or in fact among foreign ships, suspend temporarily in specified areas of its territorial sea the innocent passage of foreign ships if such suspension is essential for the protection of its security, including weapons exercises. Such suspension shall take effect only after having been duly published.", "zh": "如為保護國家安全包括武器演習在內而有必要，沿海國可在對外國船舶之間在形式上或事實上不加歧視的條件下，在其領海的特定區域內暫時停止外國船舶的無害通過。這種停止僅應在正式公佈後發生效力。"}], "keys": ["防止非無害的通過", "暫時停止", "正式公佈"], "plain": "沿海國可以在領海內採取必要步驟，阻止非無害的通過；對要進港的船，也可以採取步驟防止其違反入港條件。此外，為了保護國家安全（包括武器演習），沿海國可以在領海的特定區域「暫時停止」外國船舶的無害通過，但有三個條件：對外國船舶不得在形式上或事實上有差別待遇、限於特定區域且為暫時、必須正式公布後才生效。注意：國際海峽的過境通行不得停止（第44條）。", "elements": [{"req": ["通過非屬無害"], "effect": "沿海國得在領海內採取必要步驟防止"}, {"req": ["為保護國家安全（含武器演習）所必要", "對外國船舶無形式上或事實上的歧視", "限於領海的特定區域並為暫時", "經正式公布"], "effect": "得暫時停止外國船舶在該區域的無害通過"}], "traps": ["陷阱：只能「暫時」停止「特定區域」的無害通過，不能全面或永久停止，且須公布後才生效。", "陷阱：國際海峽的過境通行不得停止（第44條）；適用無害通過的海峽，其無害通過也不得停止（第45條第2項）。"], "custom": {"status": "習慣法", "note": "與1958年《領海及鄰接區公約》第16條相近。", "cases": []}, "related": ["unclos-19", "unclos-21", "unclos-30", "unclos-44", "unclos-45"], "cases": [], "roc": "《中華民國領海及鄰接區法》第10條：政府基於國家利益或安全，得暫停外國船舶在領海特定海域內無害通過，範圍及期間由行政院公告。注意：我國法的事由寫「國家利益或安全」，比公約限於「保護國家安全」寬，也沒有寫出不歧視的要求。", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": ARTICLES.push({"treaty": "unclos", "no": "27", "heading": "外國船舶上的刑事管轄權", "tier": "A", "paras": [{"n": "1", "en": "The criminal jurisdiction of the coastal State should not be exercised on board a foreign ship passing through the territorial sea to arrest any person or to conduct any investigation in connection with any crime committed on board the ship during its passage, save only in the following cases:\n(a) if the consequences of the crime extend to the coastal State;\n(b) if the crime is of a kind to disturb the peace of the country or the good order of the territorial sea;\n(c) if the assistance of the local authorities has been requested by the master of the ship or by a diplomatic agent or consular officer of the flag State; or\n(d) if such measures are necessary for the suppression of illicit traffic in narcotic drugs or psychotropic substances.", "zh": "沿海國不應在通過領海的外國船舶上行使刑事管轄權，以逮捕與在該船舶通過期間船上所犯任何罪行有關的任何人或進行與該罪行有關的任何調查，但下列情形除外：\n(a)罪行的後果及於沿海國；\n(b)罪行屬於擾亂當地安寧或領海的良好秩序的性質；\n(c)經船長或船旗國外交代表或領事官員請求地方當局予以協助；或\n(d)這些措施是取締違法販運麻醉藥品或精神調理物質所必要的。"}, {"n": "2", "en": "The above provisions do not affect the right of the coastal State to take any steps authorized by its laws for the purpose of an arrest or investigation on board a foreign ship passing through the territorial sea after leaving internal waters.", "zh": "上述規定不影響沿海國為在駛離內水後通過領海的外國船舶上進行逮捕或調查的目的而採取其法律所授權的任何步驟的權利。"}, {"n": "3", "en": "In the cases provided for in paragraphs 1 and 2, the coastal State shall, if the master so requests, notify a diplomatic agent or consular officer of the flag State before taking any steps, and shall facilitate contact between such agent or officer and the ship's crew. In cases of emergency this notification may be communicated while the measures are being taken.", "zh": "在第一和第二兩款規定的情形下，如經船長請求，沿海國在採取任何步驟前應通知船旗國的外交代表或領事官員，並應便利外交代表或領事官員和船上乘務人員之間的接觸。遇有緊急情況，發出此項通知可與採取措施同時進行。"}, {"n": "4", "en": "In considering whether or in what manner an arrest should be made, the local authorities shall have due regard to the interests of navigation.", "zh": "地方當局在考慮是否逮捕或如何逮捕時，應適當顧及航行的利益。"}, {"n": "5", "en": "Except as provided in Part XII or with respect to violations of laws and regulations adopted in accordance with Part V, the coastal State may not take any steps on board a foreign ship passing through the territorial sea to arrest any person or to conduct any investigation in connection with any crime committed before the ship entered the territorial sea, if the ship, proceeding from a foreign port, is only passing through the territorial sea without entering internal waters.", "zh": "除第十二部份有所規定外或有違犯按照第五部份制定的法律和規章的情形，如果來自外國港口的外國船舶僅通過領海而不駛入內水，沿海國不得在通過領海的該船舶上採取任何步驟，以逮捕與該船舶駛進領海前所犯任何罪行有關的任何人或進行與該罪行有關的調查。"}], "keys": ["刑事管轄權", "罪行的後果及於沿海國", "擾亂當地安寧", "麻醉藥品或精神調理物質"], "plain": "外國船舶通過領海時，船上發生的犯罪原則上由船旗國處理，沿海國「不應」上船逮捕或調查。只有四種例外：（a）犯罪後果及於沿海國；（b）犯罪擾亂沿海國安寧或領海良好秩序；（c）船長或船旗國外交代表、領事官員請求協助；（d）為取締毒品販運所必要。船舶是從內水駛出時，沿海國可依其國內法逮捕或調查（第2項）。船舶只是從外國港口駛來、穿越領海而不進內水時，沿海國原則上不能就船舶進入領海前發生的犯罪採取任何步驟（第5項）。船長請求時，沿海國須事先通知船旗國外交或領事官員。", "elements": [{"req": ["外國船舶正通過領海", "罪行在通過期間發生於船上", "屬第1項(a)至(d)款情形之一"], "effect": "沿海國得在船上逮捕或調查"}, {"req": ["船舶駛離內水後通過領海"], "effect": "沿海國得依其法律採取逮捕或調查步驟（第2項）"}, {"req": ["船舶自外國港口駛來，僅通過領海不進入內水", "罪行發生於船舶進入領海前"], "effect": "沿海國原則上不得採取任何步驟（第十二部分與第五部分法規另有規定者除外）"}, {"req": ["船長請求"], "effect": "沿海國採取步驟前應通知船旗國外交代表或領事官員（緊急時可同時通知）"}], "traps": ["陷阱：四種例外是後果及於沿海國、擾亂安寧或良好秩序、船長或船旗國外交領事官員請求、取締毒品；「經沿海國法院下令」不是例外（gl113a_7正解C）。", "陷阱：條文用「不應」（should not），語氣比第28條第2項的「不得」（may not）弱，學說多認為是禮讓性質的規定。", "陷阱：沿海國原則上「不應」行使刑事管轄權；說沿海國「應」行使是錯的（gl110a_6選項D）。"], "custom": {"status": "部分", "note": "源自1958年《領海及鄰接區公約》第19條；毒品例外是1982年新增。", "cases": []}, "related": ["unclos-28", "unclos-17", "unclos-32", "unclos-220"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl113a_7", "note": "正解C：「經當地法院下令」不在第1項的四種例外中；例外(c)是船長或船旗國外交代表、領事官員請求協助。"}, {"qid": "gl110a_6", "note": "選項D錯誤：條文是沿海國原則上「不應」行使刑事管轄權。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "28", "heading": "對外國船舶的民事管轄權", "tier": "A", "paras": [{"n": "1", "en": "The coastal State should not stop or divert a foreign ship passing through the territorial sea for the purpose of exercising civil jurisdiction in relation to a person on board the ship.", "zh": "沿海國不應為對通過領海的外國船舶上某人行使民事管轄權的目的而停止其航行或改變其航向。"}, {"n": "2", "en": "The coastal State may not levy execution against or arrest the ship for the purpose of any civil proceedings, save only in respect of obligations or liabilities assumed or incurred by the ship itself in the course or for the purpose of its voyage through the waters of the coastal State.", "zh": "沿海國不得為任何民事訴訟的目的而對船舶從事執行或加以逮捕，但涉及該船舶本身在通過沿海國水域的航行中或為該航行的目的而承擔的義務或因而負擔的責任，則不在此限。"}, {"n": "3", "en": "Paragraph 2 is without prejudice to the right of the coastal State, in accordance with its laws, to levy execution against or to arrest, for the purpose of any civil proceedings, a foreign ship lying in the territorial sea, or passing through the territorial sea after leaving internal waters.", "zh": "第二款不妨害沿海國按照其法律為任何民事訴訟的目的而對在領海內停泊或駛離內水後通過領海的外國船舶從事執行或加以逮捕的權利。"}], "keys": ["民事管轄權", "停止其航行或改變其航向", "執行或加以逮捕"], "plain": "沿海國不應為了對船上某人行使民事管轄權，而叫通過領海的外國船舶停船或改變航向。對船舶本身，沿海國「不得」為民事訴訟扣押或執行，只有一個例外：債務或責任是這艘船在通過沿海國水域的航程中，或為了這段航程而承擔或負擔的（例如在通過期間發生碰撞所生的賠償、引水費用）。但船舶如果停泊在領海內，或從內水駛出後通過領海，沿海國可依國內法扣押或執行（第3項）。", "elements": [{"req": ["外國船舶正通過領海", "目的在對船上某人行使民事管轄"], "effect": "沿海國不應使其停航或改變航向"}, {"req": ["為民事訴訟扣押或執行船舶"], "effect": "原則上不得；僅限船舶本身在通過沿海國水域航程中或為該航程所承擔的義務或責任"}, {"req": ["船舶停泊於領海，或駛離內水後通過領海"], "effect": "沿海國得依其法律扣押或執行（第3項）"}], "traps": ["陷阱：無害通過中的船舶，原則上不能因其他航程的債務（例如船東在別處欠的錢）被假扣押（es109e_2考此）。", "陷阱：停泊在領海內的船舶，或從內水駛出的船舶，不受第2項保護（第3項）。"], "custom": {"status": "部分", "note": "源自1958年《領海及鄰接區公約》第20條。", "cases": []}, "related": ["unclos-27", "unclos-17", "unclos-18"], "cases": [], "roc": "", "essay": "回答「可否對無害通過中的外國船舶為民事假扣押」：「依第28條第2項，原則上不得；僅於債務係該船舶本身在通過沿海國水域之航程中或為該航程所承擔者，始得為之。惟船舶停泊於領海或駛離內水後通過領海者，依第3項不受此限。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "29", "heading": "軍艦的定義", "tier": "A", "paras": [{"n": "", "en": "For the purposes of this Convention, \"warship\" means a ship belonging to the armed forces of a State bearing the external marks distinguishing such ships of its nationality, under the command of an officer duly commissioned by the government of the State and whose name appears in the appropriate service list or its equivalent, and manned by a crew which is under regular armed forces discipline.", "zh": "為本公約的目的，「軍艦」是指屬於一國武裝部隊、具備辨別軍艦國籍的外部標誌、由該國政府正式委任並名列相應的現役名冊或類似名冊的軍官指揮和配備有服從正規武裝部隊紀律的船員的船舶。"}], "keys": ["軍艦", "武裝部隊", "外部標誌", "正式委任"], "plain": "公約上的「{{軍艦}}」須同時符合四個條件：屬於一國武裝部隊；有辨別軍艦國籍的外部標誌；由政府正式委任、列名於現役名冊（或類似名冊）的軍官指揮；船員服從正規武裝部隊紀律。海巡、海警等非軍方的公務船，即使有武裝，也不是公約定義的軍艦，而屬「用於非商業目的的政府船舶」。", "elements": [{"req": ["屬於一國武裝部隊", "具備辨別該國軍艦國籍的外部標誌", "由政府正式委任並列名現役名冊或類似名冊的軍官指揮", "船員服從正規武裝部隊紀律"], "effect": "為公約所稱「軍艦」，享有第32、95條的豁免"}], "traps": ["陷阱：四個要件須同時具備；隸屬海巡等非軍事機關的武裝公務船不是「軍艦」。", "陷阱：本條定義適用於整部公約（「為本公約的目的」），公海上軍艦的豁免見第95條。"], "custom": {"status": "習慣法", "note": "定義沿襲1958年《公海公約》第8條第2項，並反映國家實踐。", "cases": []}, "related": ["unclos-30", "unclos-31", "unclos-32", "unclos-95", "unclos-110"], "cases": [], "roc": "我國海巡署艦艇屬政府公務船舶，不是公約所稱的軍艦。", "essay": "論軍艦航行權時先定義：「依第29條，軍艦指屬於一國武裝部隊、具備國籍外部標誌、由政府正式委任之軍官指揮，並配備服從正規武裝部隊紀律之船員的船舶。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）開頭漏「為」字，且「武裝部隊，具備」標點與作準本不同，均依聯合國作準中文本更正。"}]});

ARTICLES.push({"treaty": "unclos", "no": "30", "heading": "軍艦不遵守沿海國的法律和規章", "tier": "A", "paras": [{"n": "", "en": "If any warship does not comply with the laws and regulations of the coastal State concerning passage through the territorial sea and disregards any request for compliance therewith which is made to it, the coastal State may require it to leave the territorial sea immediately.", "zh": "如果任何軍艦不遵守沿海國關於通過領海的法律和規章，而且不顧沿海國向其提出遵守法律和規章的任何要求，沿海國可要求該軍艦立即離開領海。"}], "keys": ["軍艦", "立即離開領海"], "plain": "軍艦在領海內不遵守沿海國關於通過的法律規章，且不理會沿海國要求其遵守時，沿海國能做的是「要求它立即離開領海」。由於軍艦享有豁免（第32條），沿海國原則上不能登臨、扣押或逮捕。至於船旗國的賠償責任，見第31條。", "elements": [{"req": ["軍艦不遵守沿海國關於通過領海的法律規章", "不顧沿海國提出的遵守要求"], "effect": "沿海國得要求其立即離開領海"}], "traps": ["陷阱：沿海國對違規軍艦的手段是「要求立即離開」，不是扣押或逮捕；軍艦豁免依第32條仍然存在。", "陷阱：公約沒有明文授權沿海國以武力驅離；若軍艦拒不離開，是否得使用武力，須依一般國際法（必要性、比例原則）判斷。"], "custom": {"status": "習慣法", "note": "與1958年《領海及鄰接區公約》第23條相同。", "cases": []}, "related": ["unclos-29", "unclos-31", "unclos-32", "unclos-25"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "31", "heading": "船旗國對軍艦或非商業目的政府船舶所生損害的責任", "tier": "A", "paras": [{"n": "", "en": "The flag State shall bear international responsibility for any loss or damage to the coastal State resulting from the non-compliance by a warship or other government ship operated for non-commercial purposes with the laws and regulations of the coastal State concerning passage through the territorial sea or with the provisions of this Convention or other rules of international law.", "zh": "對於軍艦或其他用於非商業目的的政府船舶不遵守沿海國有關通過領海的法律和規章或不遵守本公約的規定或其他國際法規則，而使沿海國遭受的任何損失或損害，船旗國應負國際責任。"}], "keys": ["船旗國", "國際責任"], "plain": "軍艦或其他非商業用途的政府船舶，不遵守沿海國的通過法規、公約或其他國際法規則，使沿海國受到損失或損害時，由船旗國負國際責任。沿海國不能直接處分這艘船（它有豁免），而是向船旗國求償，這是國家責任的一般原則在海洋法的具體化。", "elements": [{"req": ["軍艦或非商業目的政府船舶", "不遵守沿海國的通過法規、公約或其他國際法規則", "致沿海國受到損失或損害"], "effect": "船旗國負國際責任"}], "traps": ["陷阱：負責的是「船旗國」，不是船長或船舶本身；沿海國應循國家責任途徑向船旗國求償。"], "custom": {"status": "習慣法", "note": "國家須為其機關（包括軍艦）的不法行為負責，屬國家責任的一般規則。", "cases": []}, "related": ["unclos-29", "unclos-30", "unclos-32"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "32", "heading": "軍艦和非商業目的政府船舶的豁免", "tier": "A", "paras": [{"n": "", "en": "With such exceptions as are contained in subsection A and in articles 30 and 31, nothing in this Convention affects the immunities of warships and other government ships operated for non-commercial purposes.", "zh": "Ａ分節和第三十及第三十一條所規定的情形除外，本公約規定不影響軍艦和其他用於非商業目的的政府船舶的豁免權。"}], "keys": ["豁免權", "非商業目的的政府船舶"], "plain": "除了A分節（適用於所有船舶的無害通過規定）與第30、31條的例外，公約不影響軍艦及非商業目的政府船舶的豁免。換句話說，軍艦也要遵守無害通過的規則，但沿海國不能對它行使管轄（例如扣押、搜查、逮捕船員）；違規時只能要求離開（第30條）並向船旗國求償（第31條）。", "elements": [{"req": ["軍艦或其他用於非商業目的的政府船舶"], "effect": "除A分節及第30、31條外，公約不影響其豁免"}], "traps": ["陷阱：豁免限於「非商業目的」的政府船舶；從事商業運輸的國有船舶不享有此豁免（適用第27、28條）。", "陷阱：豁免不等於可以不守法；軍艦仍須遵守無害通過規則，只是沿海國的救濟手段受限。", "陷阱：軍艦經同意進入他國內水，仍享有豁免（SG046選項C敘述正確）。"], "custom": {"status": "習慣法", "note": "軍艦豁免為公認的習慣國際法；國際海洋法法庭在「ARA Libertad號案」（阿根廷訴迦納，2012）臨時措施裁定中，命迦納釋放停泊於其港口的阿根廷軍艦。", "cases": []}, "related": ["unclos-29", "unclos-30", "unclos-31", "unclos-95", "unclos-96"], "cases": [], "roc": "", "essay": "論軍艦在他國領海的地位：「軍艦仍須遵守無害通過規則（第二部分第三分節A目），但依第32條享有豁免；違規時沿海國僅得要求其立即離開（第30條），損害則由船旗國負國際責任（第31條）。」", "exam": [{"qid": "SG046", "note": "選項C（經同意進入內水之外國軍艦仍享主權豁免）敘述正確。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2A]});

ARTICLES.push({"treaty": "unclos", "no": "33", "heading": "鄰接區", "tier": "A", "paras": [{"n": "1", "en": "In a zone contiguous to its territorial sea, described as the contiguous zone, the coastal State may exercise the control necessary to:\n(a) prevent infringement of its customs, fiscal, immigration or sanitary laws and regulations within its territory or territorial sea;\n(b) punish infringement of the above laws and regulations committed within its territory or territorial sea.", "zh": "沿海國可在毗連其領海稱為毗連區的區域內，行使為下列事項所必要的管制：\n(a)防止在其領土或領海內違犯其海關、財政、移民或衛生的法律和規章；\n(b)懲治在其領土或領海內違犯上述法律和規章的行為。"}, {"n": "2", "en": "The contiguous zone may not extend beyond 24 nautical miles from the baselines from which the breadth of the territorial sea is measured.", "zh": "毗連區從測算領海寬度的基線量起，不得超過二十四海里。"}], "keys": ["毗連", "海關、財政、移民或衛生", "二十四海里"], "plain": "{{鄰接區}}是緊接領海外側、從基線量起不超過24海里的海域。沿海國在這裡沒有主權，只有為兩個目的所需的「管制」：一是防止在其領土或領海內違反海關、財政、移民或衛生（四大類）法規；二是處罰在其領土或領海內已發生的這類違法行為。換句話說，鄰接區的管制是為了保護領土與領海，不是為了規範在鄰接區內發生的行為本身。鄰接區不會自動存在，須由沿海國主張。", "elements": [{"req": ["鄰接區內（自基線起不超過24海里）", "為防止在其領土或領海內違犯海關、財政、移民或衛生法規"], "effect": "沿海國得行使必要管制（預防）"}, {"req": ["違法行為已在其領土或領海內發生"], "effect": "沿海國得在鄰接區懲治（處罰）"}], "traps": ["陷阱：鄰接區只限四類事項：海關、財政、移民、衛生；「安全」或「國防」不在其中。", "陷阱：24海里從「基線」量起，不是從領海外緣量起（領海外緣再加12海里）。", "陷阱：鄰接區的管制是為了「防止」違法行為發生在沿海國的領土或領海內；外國船舶在鄰接區內準備走私進入沿海國，沿海國可以攔查，不必等它進入領海。", "陷阱：鄰接區屬專屬經濟海域範圍內（若有主張），船舶享有的是航行自由，不是「無害通過」（gl113a_6選項C錯誤）。"], "custom": {"status": "習慣法", "note": "鄰接區制度源自1958年《領海及鄰接區公約》第24條（當時為12海里），公約將上限延至24海里，已為普遍國家實踐。", "cases": []}, "related": ["unclos-3", "unclos-111", "unclos-303", "unclos-55"], "cases": [], "roc": "《中華民國領海及鄰接區法》第14條：鄰接區為鄰接領海外側至距離基線24浬間之海域；第15條規定政府得在鄰接區防止並處罰在領土或領海內違反海關、財政、貿易、檢驗、移民、衛生或環保法令及非法廣播的行為（事項多於公約的四類）；第17條規定得緊追、登臨、檢查，必要時扣留或逮捕。", "essay": "比較鄰接區與專屬經濟海域：「鄰接區（第33條）僅授予沿海國就海關、財政、移民、衛生四類事項之預防與懲治管制權，目的在保護領土與領海；專屬經濟海域（第56條）則授予沿海國對自然資源之主權權利及特定管轄權。兩者空間上重疊，但權限基礎不同。」", "exam": [{"qid": "SG027", "note": "題庫答案B。注意B的走私目的地是D國：依本條，鄰接區管制只為防止或處罰在A國領土或領海內的違法，單憑本條不足以管制走私至D國的行為；B若被認為錯誤，理由可能在1988年《 ARTICLES.push({"treaty": "unclos", "no": "38", "heading": "過境通行權", "tier": "A", "paras": [{"n": "1", "en": "In straits referred to in article 37, all ships and aircraft enjoy the right of transit passage, which shall not be impeded; except that, if the strait is formed by an island of a State bordering the strait and its mainland, transit passage shall not apply if there exists seaward of the island a route through the high seas or through an exclusive economic zone of similar convenience with respect to navigational and hydrographical characteristics.", "zh": "在第三十七條所指的海峽中，所有船舶和飛機均享有過境通行的權利，過境通行不應受阻礙；但如果海峽是由海峽沿岸國的一個島嶼和該國大陸形成，而且該島向海一面有在航行和水文特徵方面同樣方便的一條穿過公海，或穿過專屬經濟區的航道，過境通行就不應適用。"}, {"n": "2", "en": "Transit passage means the exercise in accordance with this Part of the freedom of navigation and overflight solely for the purpose of continuous and expeditious transit of the strait between one part of the high seas or an exclusive economic zone and another part of the high seas or an exclusive economic zone. However, the requirement of continuous and expeditious transit does not preclude passage through the strait for the purpose of entering, leaving or returning from a State bordering the strait, subject to the conditions of entry to that State.", "zh": "過境通行是指按照本部份規定，專為在公海或專屬經濟區的一個部份和公海或專屬經濟區的另一部份之間的海峽繼續不停和迅速過境的目的而行使航行和飛越自由。但是，對繼續不停和迅速過境的要求，並不排除在一個海峽沿岸國入境條件的限制下，為駛入、駛離該國或自該國返回的目的而通過海峽。"}, {"n": "3", "en": "Any activity which is not an exercise of the right of transit passage through a strait remains subject to the other applicable provisions of this Convention.", "zh": "任何非行使海峽過境通行權的活動，仍受本公約其他適用的規定的限制。"}], "keys": ["過境通行", "不應受阻礙", "繼續不停和迅速過境", "航行和飛越自由"], "plain": "在第37條的海峽中，所有船舶和飛機都享有{{過境通行}}權，沿岸國不得阻礙。過境通行是為了從海峽一端繼續不停、迅速地到另一端，而行使航行和飛越自由。和領海的無害通過相比，過境通行有三點更寬：飛機也有權飛越；潛水艇可以用通常方式（潛航）通過；而且不得停止（第44條）。例外是：海峽由沿岸國的島嶼和其大陸形成，島嶼向海一側又有同樣方便的公海或專屬經濟海域航道時（例如義大利本土與西西里島之間的墨西拿海峽），不適用過境通行，改依第45條適用無害通過。為進出沿岸國而通過海峽，也算過境通行，但受該國入境條件限制。", "elements": [{"req": ["第37條所指的海峽", "所有船舶和飛機", "專為繼續不
