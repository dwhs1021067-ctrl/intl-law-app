ARTICLES.push({"treaty": "vccr", "no": "5", "heading": "領事職務", "tier": "A", "paras": [{"n": "", "en": "Consular functions consist in:\n(a) protecting in the receiving State the interests of the sending State and of its nationals, both individuals and bodies corporate, within the limits permitted by international law;\n(b) furthering the development of commercial, economic, cultural and scientific relations between the sending State and the receiving State and otherwise promoting friendly relations between them in accordance with the provisions of the present Convention;\n(c) ascertaining by all lawful means conditions and developments in the commercial, economic, cultural and scientific life of the receiving State, reporting thereon to the Government of the sending State and giving information to persons interested;\n(d) issuing passports and travel documents to nationals of the sending State, and visas or appropriate documents to persons wishing to travel to the sending State;\n(e) helping and assisting nationals, both individuals and bodies corporate, of the sending State;\n(f) acting as notary and civil registrar and in capacities of a similar kind, and performing certain functions of an administrative nature, provided that there is nothing contrary thereto in the laws and regulations of the receiving State;\n(g) safeguarding the interests of nationals, both individuals and bodies corporate, of the sending State in cases of succession mortis causa in the territory of the receiving State, in accordance with the laws and regulations of the receiving State;\n(h) safeguarding, within the limits imposed by the laws and regulations of the receiving State, the interests of minors and other persons lacking full capacity who are nationals of the sending State, particularly where any guardianship or trusteeship is required with respect to such persons;\n(i) subject to the practices and procedures obtaining in the receiving State, representing or arranging appropriate representation for nationals of the sending State before the tribunals and other authorities of the receiving State, for the purpose of obtaining, in accordance with the laws and regulations of the receiving State, provisional measures for the preservation of the rights and interests of these nationals, where, because of absence or any other reason, such nationals are unable at the proper time to assume the defence of their rights and interests;\n(j) transmitting judicial and extra-judicial documents or executing letters rogatory or commissions to take evidence for the courts of the sending State in accordance with international agreements in force or, in the absence of such international agreements, in any other manner compatible with the laws and regulations of the receiving State;\n(k) exercising rights of supervision and inspection provided for in the laws and regulations of the sending State in respect of vessels having the nationality of the sending State, and of aircraft registered in that State, and in respect of their crews;\n(l) extending assistance to vessels and aircraft mentioned in sub-paragraph (k) of this Article and to their crews, taking statements regarding the voyage of a vessel, examining and stamping the ship's papers, and, without prejudice to the powers of the authorities of the receiving State, conducting investigations into any incidents which occurred during the voyage, and settling disputes of any kind between the master, the officers and the seamen in so far as this may be authorized by the laws and regulations of the sending State;\n(m) performing any other functions entrusted to a consular post by the sending State which are not prohibited by the laws and regulations of the receiving State or to which no objection is taken by the receiving State or which are referred to in the international agreements in force between the sending State and the receiving State.", "zh": "領事職務包括：\n(一)於國際法許可之限度內，在接受國內保護派遣國及其國民——個人與法人——之利益；\n(二)依本公約之規定，增進派遣國與接受國間之商業、經濟、文化及科學關係之發展，並在其他方面促進兩國間之友好關係；\n(三)以一切合法手段調查接受國內商業、經濟、文化及科學活動之狀況暨發展情形，向派遣國政府具報，並向關心人士提供資料；\n(四)向派遣國國民發給護照及旅行證件，並向擬赴派遣國旅行人士發給簽證或其他適當文件；\n(五)幫助及協助派遣國國民——個人與法人；\n(六)擔任公證人、民事登記員及類似之職司，並辦理若干行政性質之事務，但以接受國法律規章無禁止之規定為限；\n(七)依接受國法律規章在接受國境內之死亡繼承事件中，保護派遣國國民——個人與法人——之利益；\n(八)在接受國法律規章所規定之限度內，保護為派遣國國民之未成年人及其他無充分行為能力人之利益，尤以須對彼等施以監護或託管之情形為然；\n(九)以不牴觸接受國內施行之辦法與程序為限，遇派遣國國民因不在當地或由於其他原因不能於適當期間自行辯護其權利與利益時，在接受國法院及其他機關之前擔任其代表或為其安排適當之代表，俾依照接受國法律規章取得保全此等國民之權利與利益之臨時措施；\n(十)依現行國際協定之規定或於無此種國際協定時，以符合接受國法律規章之任何其他方式，轉送司法書狀與司法以外文件或執行囑託調查書或代派遣國法院調查證據之委託書；\n(十一)對具有派遣國國籍之船舶，在該國登記之航空機，以及其航行人員，行使派遣國法律規章所規定之監督及檢查權；\n(十二)對本條第(十一)款所稱之船舶與航空機及其航行人員給予協助，聽取關於船舶航程之陳述，查驗船舶文書並加蓋印章，於不妨害接受國當局權力之情形下調查航行期間發生之任何事故及在派遣國法律規章許可範圍內調解船長、船員與水手間之任何爭端；\n(十三)執行派遣國責成領館辦理而不為接受國法律規章所禁止、或不為接受國所反對、或派遣國與接受國間現行國際協定所訂明之其他職務。"}], "keys": ["保護派遣國及其國民——個人與法人——之利益", "幫助及協助派遣國國民", "發給護照及旅行證件"], "plain": "列舉領事的13款職務，重點可歸納為四類：①保護本國及本國國民（含法人）的利益、幫助及協助本國國民（第(一)(五)(七)(八)(九)款）；②促進兩國商業、經濟、文化、科學關係並蒐集資訊回報（第(二)(三)款）；③行政與司法協助：發護照、簽證，擔任公證人、民事登記員，轉送司法文書（第(四)(六)(十)款）；④對本國船舶、航空器及其人員的監督與協助（第(十一)(十二)款）；最後一款是概括條款。和外交使館相比，領事的職務偏重「服務國民」與「地方性事務」，不負責政治交涉。", "elements": [{"req": ["於國際法許可之限度內", "在接受國內"], "effect": "保護派遣國及其國民（個人與法人）的利益"}, {"req": ["接受國法律規章無禁止規定"], "effect": "得擔任公證人、民事登記員及辦理行政性質事務"}, {"req": ["派遣國責成", "不為接受國法律規章所禁止、或不為接受國所反對、或現行國際協定所訂明"], "effect": "得執行其他職務（第(十三)款概括條款）"}], "traps": ["陷阱：領事保護國民是「在國際法許可之限度內」，不等於外交保護；外交保護是國家對他國提出國際求償，通常須先用盡當地救濟。", "陷阱：簽證是發給「擬赴派遣國旅行人士」（多為外國人），護照才是發給本國國民。", "陷阱：使館也可以執行領事職務（第3條、第70條；外交關係公約第3條第2項），所以「領事職務只能由領館行使」是錯的。"], "custom": {"status": "習慣法", "note": "公約多數規定被認為是習慣法的編纂；第5條列舉的核心職務（保護國民、發給證件）為各國普遍實踐。", "cases": []}, "related": ["vccr-3", "vccr-36", "vccr-70", "vccr-17"], "cases": [{"id": "tehran-hostages", "point": "伊朗使美國領事無法執行保護國民等職務，法院認定違反領事關係公約第5條。"}], "roc": "外交部領事事務局與各駐外館處（含無邦交國家的代表處、辦事處）實際執行本條所列職務，例如核發護照、簽證、文件證明，以及急難救助國人。", "essay": "論領事職務時可先引第5條歸類（保護國民、促進關係、行政司法協助、船舶航空器），再連結第36條的領事通知與探視，以及第70條使館兼辦領事職務。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。原件第(六)(九)款作「担任」（俗寫），統一作「擔任」。"}, {"date": "2026-10-07", "type": "補充", "text": "第4A批補列德黑蘭人質案。"}]});
ARTICLES.push({"treaty": "vccr", "no": "23", "heading": "認為不受歡迎之人員", "tier": "A", "paras": [{"n": "1", "en": "The receiving State may at any time notify the sending State that a consular officer is persona non grata or that any other member of the consular staff is not acceptable. In that event, the sending State shall, as the case may be, either recall the person concerned or terminate his functions with the consular post.", "zh": "接受國得隨時通知派遣國，宣告某一領事官員為不受歡迎人員或任何其他領館館員為不能接受。遇此情事，派遣國應視情形召回該員或終止其在領館中之職務。"}, {"n": "2", "en": "If the sending State refuses or fails within a reasonable time to carry out its obligations under paragraph 1 of this Article, the receiving State may, as the case may be, either withdraw the exequatur from the person concerned or cease to consider him as a member of the consular staff.", "zh": "倘派遣國拒絕履行或不在相當期間內履行其依本條第一項所負之義務，接受國得視情形撤銷關係人員之領事證書或不復承認該員為領館館員。"}, {"n": "3", "en": "A person appointed as a member of a consular post may be declared unacceptable before arriving in the territory of the receiving State or, if already in the receiving State, before entering on his duties with the consular post. In any such case, the sending State shall withdraw his appointment.", "zh": "任何派為領館人員之人得於其到達接受國國境前——如其已在接受國境內，於其在領館就職前——被宣告為不能接受。遇此情形，派遣國應撤銷該員之任命。"}, {"n": "4", "en": "In the cases mentioned in paragraphs 1 and 3 of this Article, the receiving State is not obliged to give to the sending State reasons for its decision.", "zh": "遇本條第一項及第三項所稱之情形，接受國無須向派遣國說明其所為決定之理由。"}], "keys": ["接受國得隨時通知派遣國", "接受國無須向派遣國說明其所為決定之理由", "撤銷關係人員之領事證書"], "plain": "接受國可以隨時宣告領事官員為「不受歡迎人員」（persona non grata），或宣告其他領館館員「不能接受」，而且不必說明理由。派遣國應召回該員或終止其職務；派遣國不履行時，接受國可以撤銷其領事證書，或不再承認其為領館館員。人員到任前也可以先被宣告為不能接受，派遣國應撤銷任命。這是接受國對抗不當行為最主要的「自助」手段，和外交關係公約第9條相同。", "elements": [{"req": ["接受國隨時通知派遣國"], "effect": "宣告領事官員為不受歡迎人員或其他館員不能接受，派遣國應召回或終止其職務"}, {"req": ["派遣國拒絕或未在相當期間內履行"], "effect": "接受國得撤銷領事證書或不復承認其為館員"}, {"req": ["第一項或第三項之情形"], "effect": "接受國無須說明理由"}], "traps": ["陷阱：接受國「無須說明理由」，也不以當事人有違法行為為前提。", "陷阱：宣告不受歡迎人員是接受國的權利，不是對派遣國的反措施，也不構成國際不法行為。", "陷阱：即使當事人已到任，也可以隨時宣告；到任前也可以宣告不能接受。"], "custom": {"status": "習慣法", "note": "與外交關係公約第9條相同，為長期一貫的國家實踐。", "cases": []}, "related": ["vccr-12", "vccr-25", "vccr-55"], "cases": [], "roc": "我國實務上也曾對外國駐臺人員表示不予接受；我國駐外人員在無邦交國家則依雙邊協定運作，多數協定比照本條處理。", "essay": "不受歡迎人員的答題順序：①接受國隨時得宣告、無須說明理由（第23條；外交關係公約第9條）；②派遣國應召回或終止職務；③不履行時撤銷領事證書或不復承認其身分；④這是接受國面對濫用特權時的自助手段，對照外交關係公約第41條、第55條尊重接受國法律的義務。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。原件第3項「如其已在」之「已」字形近「己」，依文義與英文本判讀。"}]});
ARTICLES.push({"treaty": "vccr", "no": "31", "heading": "領館館舍不得侵犯", "tier": "A", "paras": [{"n": "1", "en": "Consular premises shall be inviolable to the extent provided in this Article.", "zh": "領館館舍於本條所規定之限度內不得侵犯。"}, {"n": "2", "en": "The authorities of the receiving State shall not enter that part of the consular premises which is used exclusively for the purpose of the work of the consular post except with the consent of the head of the consular post or of his designee or of the head of the diplomatic mission of the sending State. The consent of the head of the consular post may, however, be assumed in case of fire or other disaster requiring prompt protective action.", "zh": "接受國官吏非經領館館長或其指定人員或派遣國使館館長同意，不得進入領館館舍中專供領館工作之用之部份。惟遇火災或其他災害須迅速採取保護行動時，得推定領館館長已表示同意。"}, {"n": "3", "en": "Subject to the provisions of paragraph 2 of this Article, the receiving State is under a special duty to take all appropriate steps to protect the consular premises against any intrusion or damage and to prevent any disturbance of the peace of the consular post or impairment of its dignity.", "zh": "除本條第二項另有規定外，接受國負有特殊責任，採取一切適當步驟保護領館館舍免受侵入或損害，並防止任何擾亂領館安寧或有損領館尊嚴之情事。"}, {"n": "4", "en": "The consular premises, their furnishings, the property of the consular post and its means of transport shall be immune from any form of requisition for purposes of national defence or public utility. If expropriation is necessary for such purposes, all possible steps shall be taken to avoid impeding the performance of consular functions, and prompt, adequate and effective compensation shall be paid to the sending State.", "zh": "領館館舍、館舍設備以及領館之財產與交通工具應免受為國防或公用目的而實施之任何方式之徵用。如為此等目的確有徵用之必要時，應採取一切可能步驟以免領館職務之執行受有妨礙，並應向派遣國為迅速、充分及有效之賠償。"}], "keys": ["於本條所規定之限度內不得侵犯", "得推定領館館長已表示同意", "專供領館工作之用之部份"], "plain": "領館館舍的不可侵犯是「有限度的」：接受國官員只是不得進入「專供領館工作之用」的部分，而且遇火災或其他災害須迅速採取保護行動時，可以推定館長已同意。接受國負有特殊責任保護館舍免受侵入或損害、維護其安寧與尊嚴。館舍、設備、財產與交通工具原則上免受徵用；必要時可徵收，但應採取步驟避免妨礙領事職務，並為迅速、充分及有效的賠償。這三點都和外交使館館舍（外交關係公約第22條，絕對不可侵犯、無推定同意、完全免於徵用及強制執行）不同。", "elements": [{"req": ["接受國官吏欲進入專供領館工作之用之部分"], "effect": "須經領館館長、其指定人員或派遣國使館館長同意"}, {"req": ["火災或其他災害", "須迅速採取保護行動"], "effect": "得推定領館館長已表示同意"}, {"req": ["為國防或公用目的確有徵用必要"], "effect": "得徵用，但應避免妨礙領事職務並為迅速、充分及有效之賠償"}], "traps": ["陷阱：領館館舍的不可侵犯只及於「專供領館工作之用」的部分，不是整個館舍。", "陷阱：火災或其他災害時可「推定同意」進入；外交使館館舍沒有這種例外（外交關係公約第22條）。", "陷阱：同意者除領館館長外，也可以是其指定人員或派遣國使館館長。", "陷阱：領館館舍原則上免受徵用，但第4項容許在給予迅速、充分及有效賠償下徵用；外交使館館舍則完全免於搜查、徵用、扣押或強制執行。"], "custom": {"status": "部分習慣法", "note": "館舍保護的基本原則屬習慣法；推定同意與徵用條款是公約的具體安排。", "cases": []}, "related": ["vccr-55", "vccr-59", "vccr-27"], "cases": [], "roc": "我國對外國駐臺機構館舍的保護，依雙邊協定與《駐華外國機構及其人員特權暨豁免條例》處理。", "essay": "比較題常考「使館館舍與領館館舍」：使館館舍絕對不可侵犯（外交關係公約第22條），即使緊急情況也須經館長同意；領館館舍只保護工作專用部分、災害時推定同意、可在賠償下徵用（第31條）。2018年沙烏地駐伊斯坦堡總領事館事件可用來討論館舍不可侵犯與濫用館舍（第55條第2項）的關係。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vccr", "no": "36", "heading": "與派遣國國民通訊及聯絡", "tier": "A", "paras": [{"n": "1", "en": "With a view to facilitating the exercise of consular functions relating to nationals of the sending State:\n(a) consular officers shall be free to communicate with nationals of the sending State and to have access to them. Nationals of the sending State shall have the same freedom with respect to communication with and access to consular officers of the sending State;\n(b) if he so requests, the competent authorities of the receiving State shall, without delay, inform the consular post of the sending State if, within its consular district, a national of that State is arrested or committed to prison or to custody pending trial or is detained in any other manner. Any communication addressed to the consular post by the person arrested, in prison, custody or detention shall also be forwarded by the said authorities without delay. The said authorities shall inform the person concerned without delay of his rights under this sub-paragraph;\n(c) consular officers shall have the right to visit a national of the sending State who is in prison, custody or detention, to converse and correspond with him and to arrange for his legal representation. They shall also have the right to visit any national of the sending State who is in prison, custody or detention in their district in pursuance of a judgment. Nevertheless, consular officers shall refrain from taking action on behalf of a national who is in prison, custody or detention if he expressly opposes such action.", "zh": "為便於領館執行其對派遣國國民之職務計：\n(一)領事官員得自由與派遣國國民通訊及會見。派遣國國民與派遣國領事官員通訊及會見應有同樣自由；\n(二)遇有領館轄區內有派遣國國民受逮捕或監禁或羈押候審、或受任何其他方式之拘禁之情事，經其本人請求時，接受國主管當局應迅即通知派遣國領館。受逮捕、監禁、羈押或拘禁之人致領館之信件亦應由該當局迅予遞交。該當局應將本款規定之權利迅即告知當事人；\n(三)領事官員有權探訪受監禁、羈押或拘禁之派遣國國民，與之交談或通訊，並代聘其法律代表。領事官員並有權探訪其轄區內依判決而受監禁、羈押或拘禁之派遣國國民。但如受監禁、羈押或拘禁之國民明示反對為其採取行動時，領事官員應避免採取此種行動。"}, {"n": "2", "en": "The rights referred to in paragraph 1 of this Article shall be exercised in conformity with the laws and regulations of the receiving State, subject to the proviso, however, that the said laws and regulations must enable full effect to be given to the purposes for which the rights accorded under this Article are intended.", "zh": "本條第一項所稱各項權利應遵照接受國法律規章行使之，但此項法律規章務須使本條所規定之權利之目的得以充分實現。"}], "keys": ["經其本人請求時", "接受國主管當局應迅即通知派遣國領館", "該當局應將本款規定之權利迅即告知當事人", "明示反對為其採取行動時"], "plain": "外國人在接受國被逮捕、拘禁時，領事協助的三項保障：①領事與本國國民可以自由通訊、會見（第1項(一)款）；②「領事通知」：被拘禁者本人請求時，接受國主管當局應迅即通知派遣國領館，並轉交其信件；當局還必須迅即告知當事人享有這些權利（(二)款）；③領事有權探視、交談、通訊，並代聘律師；但當事人明示反對時，領事應避免採取行動（(三)款）。第2項：這些權利依接受國法律規章行使，但國內法必須使權利的目的得以充分實現，不能用國內程序規則架空。國際法院在拉格朗案、阿韋納案、賈達夫案連續認定違反本條。", "elements": [{"req": ["派遣國國民在領館轄區內受逮捕、監禁、羈押候審或其他拘禁", "本人請求"], "effect": "接受國主管當局應迅即通知派遣國領館，並迅予遞交其致領館之信件"}, {"req": ["接受國主管當局拘禁外國人"], "effect": "應迅即告知當事人享有第(二)款的權利（不以本人請求為前提）"}, {"req": ["國民受監禁、羈押或拘禁"], "effect": "領事有權探視、交談、通訊並代聘律師；本人明示反對時領事應避免採取行動"}, {"req": ["接受國以國內法規範權利的行使"], "effect": "國內法須使本條權利目的得以充分實現（第2項）"}], "traps": ["陷阱：「通知領館」須經本人請求，但「告知當事人有此權利」是當局主動的義務，不以請求為前提。", "陷阱：第(二)款賦予被拘禁者個人權利，派遣國可代其主張（拉格朗案）；是否「自動履行」是國內法問題，不影響國際義務。", "陷阱：「迅即」（without delay）不等於「逮捕當下」，也不必在訊問之前；但當局一知悉或有理由認為當事人是外國人，就應告知（阿韋納案）。", "陷阱：涉嫌間諜的人也受本條保護，公約沒有間諜例外（賈達夫案）；雙邊協定只能補充，不能取代本條。", "陷阱：國內「程序失權」規則若使法院無法審查違反本條的影響，即違反第2項（拉格朗案、阿韋納案）。", "陷阱：救濟方式是由違約國自選方法「審查與重新考量」定罪與量刑，必須在司法程序中進行，行政赦免不足以單獨滿足。"], "custom": {"status": "習慣法", "note": "領事通知與探視被廣泛認為反映習慣法，國際法院的三件判決均以公約及其強制解決爭端任擇議定書為依據。", "cases": ["lagrand", "avena", "jadhav"]}, "related": ["vccr-5", "vclt-27", "icj-41", "icj-36"], "cases": [{"id": "lagrand", "point": "第36條第1項賦予被拘禁外國人個人權利；美國適用程序失權規則違反第2項；臨時措施有拘束力。"}, {"id": "avena", "point": "美國對51名墨西哥國民中的多數違反告知與通知義務；救濟為以美國自選方法，在司法程序中審查與重新考量定罪與量刑。"}, {"id": "jadhav", "point": "涉嫌間諜者不排除適用第36條；巴基斯坦違反告知、通知與探視義務，應有效審查與重新考量定罪與量刑。"}, {"id": "tehran-hostages", "point": "被扣押的美國人質無法與本國領事通訊、會見，法院認定違反第36條。"}], "roc": "外國人在臺遭逮捕、羈押時，實務上會通知其所屬國駐臺機構並安排探視；我國國人在海外遭拘禁時，駐外館處依本條精神請求通知與探視並提供協助。", "essay": "申論模板：①第36條第1項(二)款賦予個人權利，派遣國得同時以自身權利與外交保護名義起訴（拉格朗案）；②違反的認定：未迅即告知、未通知、拒絕探視，不必證明若有協助結果會不同；③國內法抗辯不成立（條約法公約第27條、第2項）；④救濟：審查與重新考量（阿韋納案），間諜案件亦同（賈達夫案）；⑤管轄依據：強制解決爭端任擇議定書第1條。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "補充", "text": "第4A批補列德黑蘭人質案。"}]});
ARTICLES.push({"treaty": "vccr", "no": "41", "heading": "領事官員人身不得侵犯", "tier": "A", "paras": [{"n": "1", "en": "Consular officers shall not be liable to arrest or detention pending trial, except in the case of a grave crime and pursuant to a decision by the competent judicial authority.", "zh": "領事官員不得予以逮捕候審或羈押候審，但遇犯嚴重罪行之情形，依主管司法機關之裁判執行者不在此列。"}, {"n": "2", "en": "Except in the case specified in paragraph 1 of this Article, consular officers shall not be committed to prison or liable to any other form of restriction on their personal freedom save in execution of a judicial decision of final effect.", "zh": "除有本條第一項所規定之情形外，對於領事官員不得施以監禁或對其人身自由加以任何其他方式之拘束，但為執行有確定效力之司法判決者不在此限。"}, {"n": "3", "en": "If criminal proceedings are instituted against a consular officer, he must appear before the competent authorities. Nevertheless, the proceedings shall be conducted with the respect due to him by reason of his official position and, except in the case specified in paragraph 1 of this Article, in a manner which will hamper the exercise of consular functions as little as possible. When, in the circumstances mentioned in paragraph 1 of this Article, it has become necessary to detain a consular officer, the proceedings against him shall be instituted with the minimum of delay.", "zh": "如對領事官員提起刑事訴訟，該員須到管轄機關出庭。惟進行訴訟程序時，應顧及該員所任職位予以適當之尊重，除有本條第一項所規定之情形外，並應儘量避免妨礙領事職務之執行。遇有本條第一項所稱之情形，確有羈押領事官員之必要時，對該員提起訴訟，應儘速辦理。"}], "keys": ["但遇犯嚴重罪行之情形", "該員須到管轄機關出庭", "有確定效力之司法判決"], "plain": "領事官員的人身保障比外交代表弱：原則上不得逮捕候審或羈押候審，但「犯嚴重罪行」且依主管司法機關裁判者例外；除此之外，只有為執行確定判決才能監禁或限制其人身自由。領事官員被提起刑事訴訟時必須出庭（外交代表則享有完全的刑事管轄豁免）；程序進行時應給予適當尊重，並儘量避免妨礙領事職務。若因嚴重罪行羈押領事官員，應儘速提起訴訟。", "elements": [{"req": ["犯嚴重罪行", "依主管司法機關之裁判"], "effect": "得逮捕候審或羈押候審"}, {"req": ["執行有確定效力之司法判決"], "effect": "得監禁或限制人身自由"}, {"req": ["對領事官員提起刑事訴訟"], "effect": "該員須出庭；程序應予尊重並避免妨礙職務；如已羈押應儘速辦理"}], "traps": ["陷阱：領事官員沒有完全的刑事管轄豁免，被起訴時「須到管轄機關出庭」；外交代表則對接受國刑事管轄享有完全豁免（外交關係公約第31條）。", "陷阱：可逮捕羈押的條件是「嚴重罪行＋主管司法機關的裁判」兩者兼具，不是警察可以自行決定。", "陷阱：本條適用於「領事官員」，不包括領館僱員與服務人員。"], "custom": {"status": "部分習慣法", "note": "領事官員人身受適當保護屬習慣法；「嚴重罪行」的界線由公約具體化，各國以國內法認定。", "cases": []}, "related": ["vccr-43", "vccr-42", "vccr-40", "vccr-71"], "cases": [], "roc": "依《駐華外國機構及其人員特權暨豁免條例》，外國駐臺機構人員的特權豁免依互惠原則個案給予，實務上比照本公約處理。", "essay": "比較題：外交代表人身絕對不可侵犯、刑事管轄完全豁免（外交關係公約第29、31條）；領事官員只在嚴重罪行並經司法裁判時可羈押、須出庭受審（第41條），職務行為才有管轄豁免（第43條）。理由是兩者的功能不同：外交代表代表國家整體，領事主要處理行政服務事務（功能必要說）。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vccr", "no": "43", "heading": "管轄之豁免", "tier": "A", "paras": [{"n": "1", "en": "Consular officers and consular employees shall not be amenable to the jurisdiction of the judicial or administrative authorities of the receiving State in respect of acts performed in the exercise of consular functions.", "zh": "領事官員及領館僱員對其為執行領事職務而實施之行為不受接受國司法或行政機關之管轄。"}, {"n": "2", "en": "The provisions of paragraph 1 of this Article shall not, however, apply in respect of a civil action either:\n(a) arising out of a contract concluded by a consular officer or a consular employee in which he did not contract expressly or impliedly as an agent of the sending State; or\n(b) by a third party for damage arising from an accident in the receiving State caused by a vehicle, vessel or aircraft.", "zh": "惟本條第一項之規定不適用於下列民事訴訟：\n(一)因領事官員或領館僱員並未明示或默示以派遣國代表身份而訂契約所生之訴訟；\n(二)第三者因車輛、船舶或航空機在接受國內所造成之意外事故而要求損害賠償之訴訟。"}], "keys": ["對其為執行領事職務而實施之行為", "並未明示或默示以派遣國代表身份而訂契約", "意外事故而要求損害賠償之訴訟"], "plain": "領事官員與領館僱員只享有「職務豁免」：對於為執行領事職務而實施的行為，不受接受國司法或行政機關管轄；私人行為則沒有豁免。即使是職務行為，兩種民事訴訟仍不享有豁免：①未明示或默示以派遣國代表身分所訂契約而生的訴訟；②第三人因車輛、船舶或航空器在接受國造成意外事故而請求損害賠償的訴訟。職務豁免在職務終止後仍繼續有效、無時間限制（第53條第4項）。", "elements": [{"req": ["領事官員或領館僱員", "為執行領事職務而實施之行為"], "effect": "不受接受國司法或行政機關管轄"}, {"req": ["未以派遣國代表身分所訂契約"], "effect": "民事訴訟不享豁免"}, {"req": ["第三人因車輛、船舶或航空器之意外事故請求損害賠償"], "effect": "民事訴訟不享豁免"}], "traps": ["陷阱：領事豁免是「職務豁免」，私人行為（如下班酒駕）不享有豁免；外交代表則享有完全的刑事管轄豁免與大部分民事豁免。", "陷阱：交通意外的損害賠償訴訟，即使發生在執行職務途中，也不享有豁免。", "陷阱：豁免主體包括領館僱員（行政技術人員），不只是領事官員。", "陷阱：職務豁免在離職後仍繼續，無時間限制（第53條第4項）。"], "custom": {"status": "習慣法", "note": "領事職務行為享有豁免為傳統習慣法；第2項兩項例外是公約的具體規定。", "cases": []}, "related": ["vccr-41", "vccr-44", "vccr-53", "vccr-45", "vccr-71"], "cases": [], "roc": "我國法院審理涉及外國駐臺機構人員案件時，依《駐華外國機構及其人員特權暨豁免條例》與互惠原則判斷其豁免範圍。", "essay": "職務豁免的判斷：①身分：領事官員或領館僱員；②行為性質：是否「為執行領事職務」而實施（客觀判斷，不看主觀意圖）；③即使是職務行為，契約與交通事故兩類民事訴訟例外；④與外交代表比較（外交關係公約第31條第1項的三項民事例外、刑事完全豁免）。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vccr", "no": "53", "heading": "領事特權與豁免之開始及終止", "tier": "B", "paras": [{"n": "1", "en": "Every member of the consular post shall enjoy the privileges and immunities provided in the present Convention from the moment he enters the territory of the receiving State on proceeding to take up his post or, if already in its territory, from the moment when he enters on his duties with the consular post.", "zh": "各領館人員自進入接受國國境前往就任之時起享有本公約所規定之特權與豁免，其已在該國境內者，自其就領館職務之時起開始享有。"}, {"n": "2", "en": "Members of the family of a member of the consular post forming part of his household and members of his private staff shall receive the privileges and immunities provided in the present Convention from the date from which he enjoys privileges and immunities in accordance with paragraph 1 of this Article or from the date of their entry into the territory of the receiving State or from the date of their becoming a member of such family or private staff, whichever is the latest.", "zh": "領館人員之與其構成同一戶口之家屬及其私人服務人員自領館人員依本條第一項享受特權及豁免之日起，或自本人進入接受國國境之時起，或自其成為領館人員之家屬或私人服務人員之日起，享有本公約所規定之特權與豁免，以在後之日期為準。"}, {"n": "3", "en": "When the functions of a member of the consular post have come to an end, his privileges and immunities and those of a member of his family forming part of his household or a member of his private staff shall normally cease at the moment when the person concerned leaves the receiving State or on the expiry of a reasonable period in which to do so, whichever is the sooner, but shall subsist until that time, even in case of armed conflict. In the case of the persons referred to in paragraph 2 of this Article, their privileges and immunities shall come to an end when they cease to belong to the household or to be in the service of a member of the consular post provided, however, that if such persons intend leaving the receiving State within a reasonable period thereafter, their privileges and immunities shall subsist until the time of their departure.", "zh": "領館人員之職務如已終止，其本人之特權與豁免以及與其構成同一戶口之家屬或私人服務人員之特權與豁免通常應於各該人員離接受國國境時或其離境之合理期間終了時停止，以在先之時間為準，縱有武裝衝突情事，亦應繼續有效至該時為止。就本條第二項所稱之人員而言，其特權與豁免於其不復為領館人員戶內家屬或不復為領館人員僱用時終止，但如此等人員意欲於稍後合理期間內離接受國國境，其特權與豁免應繼續有效至其離境之時為止。"}, {"n": "4", "en": "However, with respect to acts performed by a consular officer or a consular employee in the exercise of his functions, immunity from jurisdiction shall continue to subsist without limitation of time.", "zh": "惟關於領事官員或領館僱員為執行職務所實施之行為，其管轄之豁免應繼續有效，無時間限制。"}, {"n": "5", "en": "In the event of the death of a member of the consular post, the members of his family forming part of his household shall continue to enjoy the privileges and immunities accorded to them until they leave the receiving State or until the expiry of a reasonable period enabling them to do so, whichever is the sooner.", "zh": "遇領館人員死亡，與其構成同一戶口之家屬應繼續享有應享之特權與豁免至其離接受國國境時或其離境之合理期間終了時為止，以在先之時間為準。"}], "keys": ["自進入接受國國境前往就任之時起", "縱有武裝衝突情事", "其管轄之豁免應繼續有效，無時間限制"], "plain": "特權豁免從何時開始、何時結束：①開始：自進入接受國國境前往就任時起；已在境內者，自就職時起；家屬與私人服務人員以最晚的日期為準。②結束：職務終止後，於離境時或離境的合理期間屆滿時（以先到者為準）停止，即使發生武裝衝突也要維持到那時。③例外：為執行職務所實施的行為，管轄豁免永久持續、無時間限制。④領館人員死亡時，家屬享有的特權豁免維持到離境或合理期間屆滿。", "elements": [{"req": ["領館人員進入接受國國境前往就任（已在境內者為就職）"], "effect": "開始享有特權與豁免"}, {"req": ["職務終止"], "effect": "於離境時或合理期間屆滿時（以先到者為準）停止，武裝衝突亦同"}, {"req": ["為執行職務所實施之行為"], "effect": "管轄豁免繼續有效，無時間限制"}], "traps": ["陷阱：卸任後私人行為不再享有豁免，但職務行為的豁免永久持續。", "陷阱：家屬與私人服務人員的起算日以三者中「在後」的日期為準；終止則以離境或合理期間「在先」者為準。", "陷阱：武裝衝突不會使特權豁免立即消滅。"], "custom": {"status": "習慣法", "note": "與外交關係公約第39條相同的結構，職務行為豁免永久持續屬習慣法。", "cases": []}, "related": ["vccr-43", "vccr-26", "vccr-25"], "cases": [], "roc": "我國對外國駐臺機構人員離任後的豁免範圍，同樣區分職務行為與私人行為。", "essay": "卸任外交官或領事官員能否被追訴：私人行為於離境或合理期間屆滿後即可追訴；職務行為的管轄豁免無時間限制（第53條第4項；外交關係公約第39條第2項）。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vccr", "no": "55", "heading": "尊重接受國法律規章", "tier": "B", "paras": [{"n": "1", "en": "Without prejudice to their privileges and immunities, it is the duty of all persons enjoying such privileges and immunities to respect the laws and regulations of the receiving State. They also have a duty not to interfere in the internal affairs of that State.", "zh": "在不妨礙領事特權與豁免之情形下，凡享有此項特權與豁免之人員均負有尊重接受國法律規章之義務。此等人員並負有不干涉該國內政之義務。"}, {"n": "2", "en": "The consular premises shall not be used in any manner incompatible with the exercise of consular functions.", "zh": "領館館舍不得充作任何與執行領事職務不相符合之用途。"}, {"n": "3", "en": "The provisions of paragraph 2 of this Article shall not exclude the possibility of offices of other institutions or agencies being installed in part of the building in which the consular premises are situated, provided that the premises assigned to them are separate from those used by the consular post. In that event, the said offices shall not, for the purposes of the present Convention, be considered to form part of the consular premises.", "zh": "本條第二項之規定並不禁止於領館館舍所在之建築物之一部份設置其他團體或機關之辦事處，但供此類辦事處應用之房舍須與領館自用房舍隔離。在此情形下，此項辦事處在本公約之適用上，不得視為領館館舍之一部份。"}], "keys": ["均負有尊重接受國法律規章之義務", "不干涉該國內政之義務", "不得充作任何與執行領事職務不相符合之用途"], "plain": "享有特權豁免的人仍有義務遵守接受國法律規章，也不得干涉其內政；豁免只是程序上不受管轄，不等於不必守法。領館館舍不得用於與領事職務不相符合的用途；同一棟建築物內可以設置其他機構的辦公室，但必須和領館自用房舍隔離，而且不算領館館舍。", "elements": [{"req": ["享有特權與豁免之人員"], "effect": "負有尊重接受國法律規章、不干涉其內政的義務"}, {"req": ["領館館舍"], "effect": "不得充作與執行領事職務不相符合之用途"}, {"req": ["同一建築物設置其他團體或機關之辦事處", "與領館自用房舍隔離"], "effect": "允許，但該辦事處不視為領館館舍"}], "traps": ["陷阱：享有豁免不等於可以違法；豁免只是接受國不能行使管轄，實體責任仍在（對照外交關係公約第31條第4項）。", "陷阱：濫用館舍違反本條，但不會使館舍喪失不可侵犯的保護；接受國的對策是宣告不受歡迎人員或斷絕領事關係。"], "custom": {"status": "習慣法", "note": "與外交關係公約第41條相同，屬習慣法。", "cases": []}, "related": ["vccr-31", "vccr-23"], "cases": [], "roc": "我國外交部對駐臺外國機構人員違反我國法令的情形，通常以照會表達關切，必要時要求調離。", "essay": "論「濫用特權」時，先引第55條（及外交關係公約第41條）說明守法與不干涉內政的義務，再說明接受國可用的對策：宣告不受歡迎人員（第23條）、斷絕領事關係、要求派遣國放棄豁免（第45條）；不能以違反為由強行進入館舍。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vccr", "no": "70", "heading": "使館承辦領事職務", "tier": "B", "paras": [{"n": "1", "en": "The provisions of the present Convention apply also, so far as the context permits, to the exercise of consular functions by a diplomatic mission.", "zh": "本公約之各項規定，在其文義所許可之範圍內，對於使館承辦領事職務亦適用之。"}, {"n": "2", "en": "The names of members of a diplomatic mission assigned to the consular section or otherwise charged with the exercise of the consular functions of the mission shall be notified to the Ministry for Foreign Affairs of the receiving State or to the authority designated by that Ministry.", "zh": "使館人員派任領事組工作者，或另經指派擔任使館內領事職務者，其姓名應通知接受國外交部或該部指定之機關。"}, {"n": "3", "en": "In the exercise of consular functions a diplomatic mission may address:\n(a) the local authorities of the consular district;\n(b) the central authorities of the receiving State if this is allowed by the laws, regulations and usages of the receiving State or by relevant international agreements.", "zh": "使館執行領事職務時得與下列當局接洽：\n(一)其轄區內之地方當局；\n(二)接受國之中央當局，但以經接受國之法律規章與慣例或有關國際協定所許可者為限。"}, {"n": "4", "en": "The privileges and immunities of the members of a diplomatic mission referred to in paragraph 2 of this Article shall continue to be governed by the rules of international law concerning diplomatic relations.", "zh": "本條第二項所稱使館人員之特權與豁免仍以關於外交關係之國際法規則為準。"}], "keys": ["對於使館承辦領事職務亦適用之", "仍以關於外交關係之國際法規則為準"], "plain": "使館也可以執行領事職務（實務上多設「領事組」）。本公約的規定在文義許可範圍內同樣適用；派任領事組或另經指派辦理領事職務的使館人員，姓名應通知接受國外交部。使館辦理領事事務時可以和轄區地方當局接洽；和中央當局接洽則須經接受國法律、慣例或國際協定許可。重點是第4項：這些使館人員的特權與豁免仍依外交關係法，不會因為辦領事業務而降為領事豁免。", "elements": [{"req": ["使館承辦領事職務"], "effect": "本公約在文義許可範圍內適用"}, {"req": ["使館人員派任領事組或經指派辦理領事職務"], "effect": "姓名應通知接受國外交部或其指定機關"}, {"req": ["上述使館人員"], "effect": "特權與豁免仍依外交關係的國際法規則"}], "traps": ["陷阱：使館人員兼辦領事業務時，仍享有外交特權豁免，不是領事特權豁免（第4項）。", "陷阱：使館執行領事職務時可直接與地方當局接洽；與中央當局接洽須經接受國法律、慣例或國際協定許可。"], "custom": {"status": "習慣法", "note": "外交關係公約第3條第2項亦規定使館得執行領事職務，為普遍實踐。", "cases": []}, "related": ["vccr-3", "vccr-5", "vccr-2"], "cases": [], "roc": "我國駐外大使館多設領事業務單位辦理護照、簽證與急難救助。", "essay": "外交與領事的關係：兩者功能不同，但使館得執行領事職務（外交關係公約第3條第2項、本條）；兩國同意建立外交關係即同意建立領事關係（第2條第2項）；斷絕外交關係不當然斷絕領事關係（第2條第3項）。", "exam": [{"qid": "gl115a_16", "note": "選項D「外交使館得執行領事職務」正確（本條、外交關係公約第3條第2項）；本題錯誤選項為B。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4B批新增本條；中文依聯合國條約集第596卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。原件第2項作「担任」（俗寫），統一作「擔任」。"}]});
CASES.push({"id": "avena", "nameZh": "阿韋納及其他墨西哥國民案（墨西哥訴美國）", "nameEn": "Avena and Other Mexican Nationals (Mexico v. United States of America)", "court": "國際法院", "year": "2004", "date": "2004-03-31", "kind": "判決", "parties": "墨西哥2003年1月9日起訴美國；管轄依據為領事關係公約強制解決爭端任擇議定書第1條。", "facts": "數十名墨西哥國民在美國多個州被判處死刑，美國當局逮捕時未依領事關係公約第36條告知其得請求領事協助，也未迅即通知墨西哥領館。墨西哥在拉格朗案判決後起訴，法院於2003年2月5日就其中3人發布臨時措施，要求美國在終局判決前不得執行。", "issues": ["美國是否違反第36條第1項(二)款的告知與通知義務，以及(一)(三)款的通訊與探視權？", "「迅即」（without delay）應如何理解？", "美國的程序失權規則與行政赦免程序能否提供有效救濟？"], "holding": ["美國對51名墨西哥國民中的多數未迅即告知其權利、未迅即通知墨西哥領館，違反第36條第1項(二)款，並在部分案件中妨礙墨西哥領事的通訊、探視與代聘律師。", "「迅即」不等於逮捕當下，也不必在訊問之前；但當局一知悉或有理由認為當事人是外國人，就應告知其權利。", "美國對已確定判決的國民適用程序失權規則，使法院無法審查違約的影響，違反第36條第2項。", "救濟：美國應以其自選的方法，對相關國民的定罪與量刑進行「審查與重新考量」，並應在司法程序中進行；行政赦免程序本身不足以滿足，但可作為補充。法院也指出，本案結論對處於類似情況的其他外國人同樣適用。"], "significance": "第36條三部曲的第二案，具體化「審查與重新考量」的救濟內容。後續發展：美國2005年3月退出強制解決爭端任擇議定書；美國最高法院2008年梅德林訴德州案認定本判決在美國國內不能直接執行，須經國會立法；國際法院2009年1月19日就墨西哥請求解釋判決作成判決，並認定美國在臨時措施期間執行梅德林死刑違反義務。考點：國際判決的國內執行與條約法公約第27條。", "articles": ["vccr-36", "icj-41"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/128", "verified": "2026-10-07"});
CASES.push({"id": "jadhav", "nameZh": "賈達夫案（印度訴巴基斯坦）", "nameEn": "Jadhav (India v. Pakistan)", "court": "國際法院", "year": "2019", "date": "2019-07-17", "kind": "判決", "parties": "印度2017年5月8日起訴巴基斯坦；管轄依據為領事關係公約強制解決爭端任擇議定書第1條。", "facts": "印度國民賈達夫2016年3月在巴基斯坦被捕，巴方指控他從事間諜與恐怖活動，軍事法院判處死刑。巴基斯坦在逮捕後約三週才通知印度，並多次拒絕印度領事探視。法院於2017年5月18日發布臨時措施，要求在終局判決前不得執行。", "issues": ["涉嫌間諜的人是否排除適用第36條？", "印巴兩國2008年的領事探視雙邊協定能否取代第36條？", "巴基斯坦是否違反第36條？應給予何種救濟？"], "holding": ["第36條沒有間諜例外：依條約法公約第31、32條解釋，條文與準備工作都看不出排除涉嫌間諜者的意思。", "2008年雙邊協定只能補充、不能取代第36條的義務（領事關係公約第73條第2項）。", "巴基斯坦未迅即告知賈達夫其權利、未迅即通知印度、拒絕印度領事通訊與探視，違反第36條第1項(一)(二)(三)款（15比1）。", "救濟：巴基斯坦應以自選的方法，有效審查與重新考量其定罪與量刑，並在此期間繼續暫緩執行死刑；法院未支持印度撤銷判決、釋放並遣返的請求。"], "significance": "第36條三部曲的第三案：①間諜嫌疑不構成排除領事通知與探視的理由；②雙邊協定不能降低公約保障；③救濟仍是「有效的審查與重新考量」，不是撤銷判決或釋放；④軍事法院審判的案件，審查程序同樣必須有效。", "articles": ["vccr-36", "vccr-73"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/168", "verified": "2026-10-07"});

TREATIES.push({"id": "vcdr", "short": "外交關係公約", "topic": "外交與領事關係", "aliases": ["外交關係公約", "外交公約", "維也納外交關係公約", "vcdr"], "titleZh": "維也納外交關係公約", "titleEn": "Vienna Convention on Diplomatic Relations", "adopted": "1961年4月14日於聯合國外交往來及豁免會議通過，4月18日在維也納開放簽署", "inForce": "1964年4月24日（第22份批准書或加入書交存後第30日，第51條）", "parties": "約192至193個當事國（聯合國多邊條約交存狀況頁顯示192；新加坡國立大學國際法中心彙整稱2024年12月為193，2026-10-07查證，待以聯合國條約資料庫確認），是批准國最多的條約之一。另有兩項任擇議定書：關於取得國籍、關於強制解決爭端（德黑蘭人質案的管轄依據之一）。", "rocStatus": "中華民國1961年4月18日簽署，1969年12月19日交存批准書，為當事國（聯合國條約資料庫有註記）。1971年失去聯合國代表權後，中華人民共和國1975年11月25日加入時聲明中華民國的簽署與批准為非法、無效。我國另制定《駐華外國機構及其人員特權暨豁免條例》，以互惠原則處理無邦交國家駐臺機構的待遇。", "zhSource": {"type": "authentic", "label": "作準中文本（聯合國條約集第500卷，1961年正體字原本）", "note": "公約以中、英、法、俄、西五種文字同一作準（第53條）。中文本為1961年中華民國代表參與議定的正體字原本，本App照錄原文用字（如「派遣國」「接受國」「使館館舍」「不得侵犯」「拋棄」），不改為現行用語。底本為掃描影像，經文字辨識後逐字對照原件影像校對；原件標點照錄，引號改用「」，項次以數字顯示（原件作「一、二、」），款次保留「(甲)(乙)」。原件異體「强」統一作「強」。"}, "srcUrl": "https://treaties.un.org/doc/Publication/UNTS/Volume%20500/volume-500-I-7310-English.pdf", "structure": "序言加53條，不分章；第1至19條使館之建立與館長，第20至40條使館與人員之特權與豁免，第41至47條義務、職務終止與斷交，第48至53條最後條款。", "parts": [{"title": "定義（第一條）", "from": 1, "to": 1}, {"title": "使館之建立、職務與人員（第2至19條）", "from": 2, "to": 19}, {"title": "使館及其人員之特權與豁免（第20至40條）", "from": 20, "to": 40}, {"title": "義務、職務終止與斷交（第41至47條）", "from": 41, "to": 47}, {"title": "最後條款（第48至53條）", "from": 48, "to": 53}], "verified": "2026-10-07"});
ARTICLES.push({"treaty": "vcdr", "no": "1", "heading": "用語", "tier": "A", "paras": [{"n": "", "en": "For the purpose of the present Convention, the following expressions shall have the meanings hereunder assigned to them:\n(a) the \"head of the mission\" is the person charged by the sending State with the duty of acting in that capacity;\n(b) the \"members of the mission\" are the head of the mission and the members of the staff of the mission;\n(c) the \"members of the staff of the mission\" are the members of the diplomatic staff, of the administrative and technical staff and of the service staff of the mission;\n(d) the \"members of the diplomatic staff\" are the members of the staff of the mission having diplomatic rank;\n(e) a \"diplomatic agent\" is the head of the mission or a member of the diplo matic staff of the mission;\n(f) the \"members of the administrative and technical staff\" are the members of the staff of the mission employed in the administrative and technical service of the mission;\n(g) the \"members of the service staff\" are the members of the staff of the mission in the domestic service of the mission;\n(h) a \"private servant\" is a person who is in the domestic service of a member of the mission and who is not an employee of the sending State;\n(i) the \"premises of the mission\" are the buildings or parts of buildings and the land ancillary thereto, irrespective of ownership, used for the purposes of the mission including the residence of the head of the mission.", "zh": "就適用本公約而言，下列名稱之意義，應依下列規定：\n(甲)稱「使館館長」者，謂派遣國責成擔任此項職位之人；\n(乙)稱「使館人員」者，謂使館館長及使館職員；\n(丙)稱「使館職員」者，謂使館外交職員、行政及技術職員，及事務職員；\n(丁)稱「外交職員」者，謂具有外交官級位之使館職員；\n(戊)稱「外交代表」者，謂使館館長或使館外交職員；\n(己)稱「行政及技術職員」者，謂承辦使館行政及技術事務之使館職員；\n(庚)稱「事務職員」者，謂為使館僕役之使館職員；\n(辛)稱「私人僕役」者，謂充使館人員傭僕而非為派遣國僱用之人；\n(壬)稱「使館館舍」者，謂供使館使用及供使館館長寓邸之用之建築物或建築物之各部分，以及其所附屬之土地，至所有權誰屬，則在所不問。"}], "keys": ["稱「外交代表」者，謂使館館長或使館外交職員", "稱「私人僕役」者，謂充使館人員傭僕而非為派遣國僱用之人", "至所有權誰屬，則在所不問"], "plain": "定義九種人員與「使館館舍」。人員的層次是：使館人員＝使館館長＋使館職員；使館職員分三類：外交職員（有外交官級位）、行政及技術職員、事務職員。外交代表＝使館館長或外交職員。私人僕役不是使館職員，而是使館人員私人僱用的傭僕。使館館舍包括供使館使用與館長寓邸的建築物及土地，不論所有權屬於誰（租來的也算）。後面各條的特權豁免層級，都依這些身分而定。", "elements": [{"req": ["使館館長或外交職員"], "effect": "屬外交代表，享有完整外交特權與豁免（第29至36條）"}, {"req": ["行政及技術職員、事務職員"], "effect": "屬使館職員但非外交代表，特權豁免依第37條第2、3項"}, {"req": ["供使館使用或館長寓邸之建築物及土地"], "effect": "屬使館館舍，不論所有權歸屬"}], "traps": ["陷阱：私人僕役不是「使館職員」，使館職員只有外交職員、行政及技術職員、事務職員三類（gl113a_11）。", "陷阱：外交代表只包括使館館長與外交職員，行政技術職員不是外交代表。", "陷阱：館長寓邸屬「使館館舍」；其他外交代表的私人寓所則依第30條另受保護。", "陷阱：館舍不論所有權歸屬，租用的建築物也算。"], "custom": {"status": "習慣法", "note": "定義本身是公約的用語安排，但人員分類與館舍範圍已為各國普遍採用。", "cases": []}, "related": ["vcdr-37", "vcdr-30", "vcdr-22"], "cases": [], "roc": "《駐華外國機構及其人員特權暨豁免條例》亦區分機構人員與其眷屬等類別。", "essay": "答題第一步先定性身分：依第1條判斷當事人是外交代表、行政技術職員、事務職員或私人僕役，再依第29至39條決定其特權豁免範圍。", "exam": [{"qid": "gl113a_11", "note": "正解C：私人僕役不是第1條(丙)款所稱使館職員。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "2", "heading": "外交關係之建立", "tier": "B", "paras": [{"n": "", "en": "The establishment of diplomatic relations between States, and of permanent diplomatic missions, takes place by mutual consent.", "zh": "國與國間外交關係及常設使館之建立，以協議為之。"}], "keys": ["以協議為之"], "plain": "國與國之間建立外交關係、設立常設使館，都必須經雙方協議，沒有一國可以單方面要求。建交本身也不是國家的義務。建立外交關係通常被理解為默示承認對方為國家，但斷交不等於撤回承認。", "elements": [{"req": ["兩國協議"], "effect": "建立外交關係及設立常設使館"}], "traps": ["陷阱：建立外交關係與設立常設使館都須「協議」，同意建交後設使館仍須合意（gl115a_16選項B錯誤）。", "陷阱：建交通常含默示承認，但斷交不等於撤回對國家的承認（gl115a_16選項A正確）。"], "custom": {"status": "習慣法", "note": "外交關係以相互同意為基礎是長期一貫的國家實踐。", "cases": []}, "related": ["vcdr-45", "vclt-63", "vccr-2"], "cases": [], "roc": "我國與邦交國依建交公報或協議互設大使館；與無邦交國家則以協議互設代表處。", "essay": "論建交與承認時：建交須協議（第2條），通常構成默示承認；斷交則依第45條處理館舍與利益保護，不影響承認，也不當然影響條約效力（條約法公約第63條）。", "exam": [{"qid": "gl115a_16", "note": "選項B「建交後不需另行協議即可互設常駐使館」錯誤：依第2條，設立常設使館亦以協議為之。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "3", "heading": "使館之職務", "tier": "A", "paras": [{"n": "1", "en": "The functions of a diplomatic mission consist inter alia in:\n(a) representing the sending State in the receiving State;\n(b) protecting in the receiving State the interests of the sending State and of its nationals, within the limits permitted by international law;\n(c) negotiating with the Government of the receiving State;\n(d) ascertaining by all lawful means conditions and developments in the receiving State, and reporting thereon to the Government of the sending State;\n(e) promoting friendly relations between the sending State and the receiving State, and developing their economic, cultural and scientific relations.", "zh": "除其他事項外，使館之職務如下：\n(甲)在接受國中代表派遣國；\n(乙)於國際法許可之限度內，在接受國中保護派遣國及其國民之利益；\n(丙)與接受國政府辦理交涉；\n(丁)以一切合法手段調查接受國之狀況及發展情形，向派遣國政府具報；\n(戊)促進派遣國與接受國間之友好關係，及發展兩國間之經濟、文化與科學關係。"}, {"n": "2", "en": "Nothing in the present Convention shall be construed as preventing the performance of consular functions by a diplomatic mission.", "zh": "本公約任何規定不得解釋為禁止使館執行領事職務。"}], "keys": ["在接受國中代表派遣國", "與接受國政府辦理交涉", "不得解釋為禁止使館執行領事職務"], "plain": "使館的五項基本職務：代表派遣國、保護派遣國及其國民的利益（限國際法許可範圍內）、與接受國政府交涉、以合法手段調查接受國情勢並回報、促進友好關係及經濟文化科學關係。「除其他事項外」表示這是例示，不是窮盡列舉。第2項明定使館可以執行領事職務。注意「以一切合法手段」調查，間諜活動就不在使館職務範圍內。", "elements": [{"req": ["使館"], "effect": "執行代表、保護、交涉、調查具報、促進關係等職務（例示）"}, {"req": ["使館執行領事職務"], "effect": "公約不禁止（第2項；領事關係公約第70條）"}], "traps": ["陷阱：調查接受國情勢須以「合法手段」，不包括間諜活動。", "陷阱：保護國民的利益限於「國際法許可之限度內」，不等於可以干涉接受國內政（第41條）。", "陷阱：使館可以執行領事職務（gl115a_16選項D正確）。"], "custom": {"status": "習慣法", "note": "使館職務的列舉被認為反映習慣法。", "cases": []}, "related": ["vccr-5", "vccr-70", "vcdr-41"], "cases": [], "roc": "我國駐外大使館除政務交涉外，多設領務組辦理護照、簽證與急難救助。", "essay": "比較外交與領事職務：使館代表國家、辦理政治交涉（第3條）；領館偏重服務國民與地方事務（領事關係公約第5條）；使館得兼辦領事職務（第3條第2項、領事關係公約第70條）。", "exam": [{"qid": "gl115a_16", "note": "選項D「外交使館得執行領事職務」正確（第3條第2項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批 ARTICLES.push({"treaty": "vcdr", "no": "4", "heading": "同意（使館館長之人選）", "tier": "A", "paras": [{"n": "1", "en": "The sending State must make certain that the agrément of the receiving State has been given for the person it proposes to accredit as head of the mission to that State.", "zh": "派遣國對於擬派駐接受國之使館館長人選務須查明其確已獲得接受國之同意。"}, {"n": "2", "en": "The receiving State is not obliged to give reasons to the sending State for a refusal of agrément.", "zh": "接受國無須向派遣國說明不予同意之理由。"}], "keys": ["務須查明其確已獲得接受國之同意", "接受國無須向派遣國說明不予同意之理由"], "plain": "派遣國派任使館館長前，必須先取得接受國的「同意」（agrément）。接受國可以拒絕，而且不必說明理由。實務上通常是秘密徵詢，避免被拒時公開難堪。其他外交職員原則上不需事先同意（武官名單可要求先行提送，第7條）。", "elements": [{"req": ["派遣國擬派使館館長"], "effect": "須先查明已獲接受國同意"}, {"req": ["接受國不予同意"], "effect": "無須說明理由"}], "traps": ["陷阱：需要事先同意的只有「使館館長」；其他外交職員原則上由派遣國自由委派（第7條）。", "陷阱：拒絕同意不必說明理由（es110l_1）。"], "custom": {"status": "習慣法", "note": "徵求同意（agrément）為長期一貫的外交慣例。", "cases": []}, "related": ["vcdr-9", "vcdr-7", "vcdr-10"], "cases": [], "roc": "我國派任駐外大使前，均先徵詢駐在國同意。", "essay": "es110l_1：接受國能否拒絕同意大使人選且不說明理由？依第4條第2項可以；這是接受國主權的表現，與第9條隨時宣告不受歡迎人員同屬接受國的裁量權。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "9", "heading": "不受歡迎人員", "tier": "A", "paras": [{"n": "1", "en": "The receiving State may at any time and without having to explain its decision, notify the sending State that the head of the mission or any member of the diplomatic staff of the mission is persona non grata or that any other member of the staff of the mission is not acceptable. In any such case, the sending State shall, as appropriate, either recall the person concerned or ter minate his functions with the mission. A person may be declared non grata or not acceptable before arriving in the territory of the receiving State.", "zh": "接受國得隨時不具解釋通知派遣國宣告使館館長或使館任何外交職員為不受歡迎人員或使館任何其他職員為不能接受。遇此情形，派遣國應斟酌情況召回該員或終止其在使館中之職務。任何人員得於其到達接受國國境前，被宣告為不受歡迎或不能接受。"}, {"n": "2", "en": "If the sending State refuses or fails within a reasonable period to carry out its obligations under paragraph 1 of this Article, the receiving State may refuse to recognize the person concerned as a member of the mission.", "zh": "如派遣國拒絕或不在相當期間內履行其依本條第一項規定所負義務，接受國得拒絕承認該員為使館人員。"}], "keys": ["接受國得隨時不具解釋通知派遣國", "為不受歡迎人員", "接受國得拒絕承認該員為使館人員"], "plain": "接受國可以隨時、不必說明理由，宣告使館館長或任何外交職員為「不受歡迎人員」（persona non grata），或宣告其他職員「不能接受」。派遣國應召回或終止其職務；人員到任前也可以先被宣告。派遣國不履行時，接受國可以拒絕承認其為使館人員，之後其特權豁免依第39條第2項於合理期間後停止。這是接受國對付濫用豁免最主要的合法手段。", "elements": [{"req": ["接受國隨時通知，不具解釋"], "effect": "宣告不受歡迎人員或不能接受，派遣國應召回或終止職務"}, {"req": ["派遣國拒絕或不在相當期間內履行"], "effect": "接受國得拒絕承認該員為使館人員"}], "traps": ["陷阱：宣告不受歡迎人員不需理由，也不以違法為前提（es110l_1）。", "陷阱：外交代表犯罪時，接受國不能逮捕審判（第29、31條），只能宣告不受歡迎人員、要求派遣國拋棄豁免（第32條）或由派遣國自行追訴（第31條第4項）。", "陷阱：可在到任前宣告；被拒絕承認後，豁免並非立即消滅，而是依第39條第2項於離境合理期間後停止。"], "custom": {"status": "習慣法", "note": "為長期一貫的國家實踐。", "cases": []}, "related": ["vcdr-4", "vcdr-39", "vcdr-32", "vccr-23"], "cases": [], "roc": "我國實務上曾要求外國駐臺人員離境；我國外交人員在外遭驅逐時亦依本條處理。", "essay": "外交代表犯罪的處理順序：①不得逮捕羈押（第29條）、刑事管轄豁免（第31條）；②要求派遣國拋棄豁免（第32條）；③宣告不受歡迎人員（第9條）；④由派遣國依其國內法追訴（第31條第4項）；⑤嚴重時斷交（第45條）。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-0 ARTICLES.push({"treaty": "vcdr", "no": "14", "heading": "使館館長之等級", "tier": "B", "paras": [{"n": "1", "en": "Heads of mission are divided into three classes, namely:\n(a) that of ambassadors or nuncios accredited to Heads of State, and other heads of mission of equivalent rank;\n(b) that of envoys, ministers and internuncios accredited to Heads of State;\n(c) that of charg s d'affaires accredited to Ministers for Foreign Affairs.", "zh": "使館館長分為如下三級：\n(甲)向國家元首派遣之大使或教廷大使，及其他同等級位之使館館長；\n(乙)向國家元首派遣之使節、公使及教廷公使；\n(丙)向外交部長派遣之代辦。"}, {"n": "2", "en": "Except as concerns precedence and etiquette, there shall be no differentia tion between heads of mission by reason of their class.", "zh": "除關於優先地位及禮儀之事項外，各使館館長不應因其所屬等級而有任何差別。"}], "keys": ["向國家元首派遣之大使或教廷大使", "向外交部長派遣之代辦"], "plain": "使館館長分三級：①大使、教廷大使（向國家元首派遣）；②使節、公使、教廷公使（向國家元首派遣）；③代辦（向外交部長派遣）。等級只影響優先地位與禮儀，不影響特權豁免。注意第14條的「代辦」是常任館長，和館長缺位時暫代的「臨時代辦」（第19條）不同。", "elements": [{"req": ["使館館長"], "effect": "分為大使、公使、代辦三級"}, {"req": ["不同等級之館長"], "effect": "除優先地位及禮儀外，不得有任何差別"}], "traps": ["陷阱：代辦是向「外交部長」派遣，大使與公使是向「國家元首」派遣。", "陷阱：常任代辦（第14條）與臨時代辦（第19條）不同（gl110a_10）。", "陷阱：等級不影響特權與豁免的範圍。"], "custom": {"status": "習慣法", "note": "延續1815年維也納會議與1818年亞琛議定書的外交等級制度。", "cases": []}, "related": ["vcdr-19", "vcdr-16", "vcdr-15"], "cases": [], "roc": "我國駐邦交國多為大使館；無邦交國家則設代表處，不屬本條的使館等級。", "essay": "外交等級的歷史可連結1815年維也納會議；考試多問三級的區分與「代辦」和「臨時代辦」的差別。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "19", "heading": "臨時代辦", "tier": "A", "paras": [{"n": "1", "en": "If the post of head of the mission is vacant, or if the head of the mission is unable to perform his functions, a charg d'affaires ad interim shall act provisionally as head of the mission. The name of the charg d'affaires ad interim shall be notified, either by the head of the mission or, in case he is unable to do so, by the Ministry for Foreign Affairs of the sending State to the Ministry for Foreign Affairs of the receiving State or such other ministry as may be agreed.", "zh": "使館館長缺位或不能執行職務時，應由臨時代辦暫代使館館長。臨時代辦姓名應由使館館長通知接受國外交部或另經商定之其他部；如館長不能通知時，則由派遣國外交部通知之。"}, {"n": "2", "en": "In cases where no member of the diplomatic staff of the mission is present in the receiving State, a member of the administrative and technical staff may, with the consent of the receiving State, be designated by the sending State to be in charge of the current administrative affairs of the mission.", "zh": "使館如在接受國內並無外交職員時，派遣國得於徵得接受國同意後，指派行政或技術職員一人，主持使館日常行政事務。"}], "keys": ["應由臨時代辦暫代使館館長", "則由派遣國外交部通知之", "指派行政或技術職員一人，主持使館日常行政事務"], "plain": "使館館長缺位或不能執行職務時，由「臨時代辦」（chargé d'affaires ad interim）暫代館長；臨時代辦姓名由館長通知接受國外交部，館長不能通知時由派遣國外交部通知。若使館在接受國內完全沒有外交職員，派遣國可在徵得接受國同意後，指派一名行政或技術職員主持日常行政事務（不是臨時代辦）。", "elements": [{"req": ["使館館長缺位或不能執行職務"], "effect": "由臨時代辦暫代館長"}, {"req": ["使館在接受國內無外交職員", "接受國同意"], "effect": "得指派行政或技術職員一人主持日常行政事務"}], "traps": ["陷阱：暫代館長的是「臨時代辦」，不是外交團團長、常任代辦或無任所大使（gl110a_10）。", "陷阱：指派行政技術職員主持事務須「徵得接受國同意」，且只限日常行政事務。"], "custom": {"status": "習慣法", "note": "臨時代辦制度為長期外交慣例。", "cases": []}, "related": ["vcdr-14", "vcdr-10"], "cases": [], "roc": "我國駐外大使出缺時，由館內副館長以臨時代辦名義主持館務。", "essay": "簡答時區分：常任代辦（第14條第1項(丙)款，向外交部長派遣的館長）與臨時代辦（第19條，暫代館長）。", "exam": [{"qid": "gl110a_10", "note": "正解A：館長缺位或不能執行職務時，由臨時代辦暫代（第19條第1項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "22", "heading": "使館館舍不得侵犯", "tier": "A", "paras": [{"n": "1", "en": "The premises of the mission shall be inviolable. The agents of the receiving State may not enter them, except with the consent of the head of the mission.", "zh": "使館館舍不得侵犯。接受國官吏非經使館館長許可，不得進入使館館舍。"}, {"n": "2", "en": "The receiving State is under a special duty to take all appropriate steps to protect the premises of the mission against any intrusion or damage and to prevent any disturbance of the peace of the mission or impairment of its dignity.", "zh": "接受國負有特殊責任，採取一切適當步驟保護使館館舍免受侵入或損害，並防止一切擾亂使館安寧或有損使館尊嚴之情事。"}, {"n": "3", "en": "The premises of the mission, their furnishings and other property thereon and the means of transport of the mission shall be immune from search, requisition, attachment or execution.", "zh": "使館館舍及設備，以及館舍內其他財產與使館交通工具免受搜查、徵用、扣押或強制執行。"}], "keys": ["使館館舍不得侵犯", "接受國官吏非經使館館長許可，不得進入使館館舍", "接受國負有特殊責任", "免受搜查、徵用、扣押或強制執行"], "plain": "使館館舍「絕對」不可侵犯，包含三層義務：①消極義務：接受國官員未經館長許可不得進入，沒有火災、災害或國家安全的例外；②積極義務：接受國負「特殊責任」，採取一切適當步驟保護館舍免受侵入或損害，並防止擾亂安寧或損害尊嚴；③館舍、設備、館內財產與交通工具免受搜查、徵用、扣押或強制執行。即使使館濫用館舍（第41條第3項），接受國也不能因此強行進入，只能宣告不受歡迎人員或斷交。", "elements": [{"req": ["接受國官吏欲進入使館館舍"], "effect": "須經使館館長許可，無緊急情況例外"}, {"req": ["使館館舍"], "effect": "接受國負特殊責任，採取一切適當步驟防止侵入、損害、擾亂安寧或有損尊嚴"}, {"req": ["館舍、設備、館內其他財產、使館交通工具"], "effect": "免受搜查、徵用、扣押或強制執行"}], "traps": ["陷阱：使館館舍沒有「推定同意」的例外；領館館舍才有火災或其他災害時推定同意（領事關係公約第31條第2項）。", "陷阱：接受國不得以國家安全為由進入搜索扣押（gl109a_5選項D錯誤）。", "陷阱：接受國除了不進入，還負有積極保護義務；放任群眾闖入也構成違反（德黑蘭人質案）。", "陷阱：使館館舍仍是接受國領土，不是派遣國領土；不可侵犯不等於「治外法權」。", "陷阱：公約未賦予使館提供外交庇護的權利（gl115a_16選項C正確），但接受國也不得因此進入館舍逮人。"], "custom": {"status": "習慣法", "note": "館舍不可侵犯是外交法最古老的規則之一；國際法院在德黑蘭人質案指出這些義務也是一般國際法上的義務。", "cases": ["tehran-hostages"]}, "related": ["vcdr-30", "vcdr-41", "vcdr-45", "vccr-31", "vcdr-1"], "cases": [{"id": "tehran-hostages", "point": "伊朗未採取任何適當步驟保護美國使館免受群眾侵入，事後又認可占領，違反第22條第2項的特殊保護責任。"}], "roc": "我國對外國駐臺使館及代表處館舍，依本公約及《駐華外國機構及其人員特權暨豁免條例》給予保護。", "essay": "論館舍不可侵犯：①消極不進入（第1項，無例外）；②積極保護（第2項， ARTICLES.push({"treaty": "vcdr", "no": "27", "heading": "通訊自由、外交郵袋與外交信差", "tier": "A", "paras": [{"n": "1", "en": "The receiving State shall permit and protect free communication on the part of the mission for all official purposes. In communicating with the Govern ment and the other missions and consulates of the sending State, wherever situated, the mission may employ all appropriate means, including diplomatic couriers and messages in code or cipher. However, the mission may install and use a wireless transmitter only with the consent of the receiving State. No, 7310", "zh": "接受國應允許使館為一切公務目的自由通訊，並予保護。使館與派遣國政府及無論何處之該國其他使館及領事館通訊時，得採用一切適當方法，包括外交信差及明密碼電信在內。但使館非經接受國同意，不得裝置並使用無線電發報機。"}, {"n": "2", "en": "The official correspondence of the mission shall be inviolable. Official correspondence means all correspondence relating to the mission and its func tions.", "zh": "使館之來往公文不得侵犯。來往公文指有關使館及其職務之一切來往文件。"}, {"n": "3", "en": "The diplomatic bag shall not be opened or detained.", "zh": "外交郵袋不得予以開拆或扣留。"}, {"n": "4", "en": "The packages constituting the diplomatic bag must bear visible external marks of their character and may contain only diplomatic documents or articles intended for official use.", "zh": "構成外交郵袋之包裹須附有可資識別之外部標記，以裝載外交文件或公務用品為限。"}, {"n": "5", "en": "The diplomatic courier, who shall be provided with an official document indicating his status and the number of packages constituting the diplomatic bag, shall be protected by the receiving State in the performance of his functions. He shall enjoy personal inviolability and shall not be liable to any form of arrest or detention.", "zh": "外交信差應持有官方文件，載明其身分及構成郵袋之包裹件數；其於執行職務時，應受接受國保護。外交信差享有人身不得侵犯權，不受任何方式之逮捕或拘禁。"}, {"n": "6", "en": "The sending State or the mission may designate diplomatic couriers ad hoc. In such cases the provisions of paragraph 5 of this Article shall also apply, except that the immunities therein mentioned shall cease to apply when such a courier has delivered to the consignee the diplomatic bag in ARTICLES.push({"treaty": "vcdr", "no": "29", "heading": "外交代表人身不得侵犯", "tier": "A", "paras": [{"n": "", "en": "The person of a diplomatic agent shall be inviolable. He shall not be liable to any form of arrest or detention. The receiving State shall treat him with due respect and shall take all appropriate steps to prevent any attack on his person, freedom or dignity.", "zh": "外交代表人身不得侵犯。外交代表不受任何方式之逮捕或拘禁。接受國對外交代表應特示尊重，並應採取一切適當步驟以防止其人身、自由或尊嚴受有任何侵犯。"}], "keys": ["外交代表人身不得侵犯", "外交代表不受任何方式之逮捕或拘禁", "接受國對外交代表應特示尊重"], "plain": "外交代表人身不得侵犯：不受任何方式的逮捕或拘禁。接受國還負有積極義務：特示尊重，並採取一切適當步驟防止其人身、自由或尊嚴受到侵犯（例如保護免於群眾攻擊、綁架）。實務上，為了自衛或防止立即危害，可以暫時制止（例如阻止酒駕者繼續開車），但不能逮捕拘禁。", "elements": [{"req": ["外交代表"], "effect": "人身不得侵犯，不受任何方式之逮捕或拘禁"}, {"req": ["外交代表之人身、自由或尊嚴面臨侵犯"], "effect": "接受國應特示尊重並採取一切適當步驟防止"}], "traps": ["陷阱：人身不可侵犯沒有「現行犯」或「重罪」例外；領事官員才有嚴重罪行的例外（領事關係公約第41條）。", "陷阱：接受國不能以「報仇」或反措施為由逮捕拘禁外交代表；外交法的違反只能用公約內的手段處理（es110d_4、德黑蘭人質案）。", "陷阱：接受國的保護是積極義務，未盡保護責任也會違反本條。"], "custom": {"status": "習慣法", "note": "外交代表人身不可侵犯是最古老的國際法規則之一。", "cases": ["tehran-hostages"]}, "related": ["vcdr-31", "vcdr-30", "vcdr-9", "vccr-41"], "cases": [{"id": "tehran-hostages", "point": "伊朗認可並延續對美國外交人員的扣押，違反第29條；法院強調外交法自成體系，接受國不能以對方不法行為為由扣押外交官。"}], "roc": "《駐華外國機構及其人員特權暨豁免條例》依互惠原則給予駐臺人員相當的保障。", "essay": "es110d_4：①外交代表人身及寓所不可侵犯（第29、30條）；②接受國不能以反措施為由對外交官採取強制措施：國家責任條款第50條第2項(b)款明定反措施不得影響尊重外交與領事人員、館舍、檔案及文件不可侵犯的義務；③德黑蘭人質案：外交法是自成體系，對濫用的救濟限於宣告不受歡迎人員、斷交。", "exam": [{"qid": "gl109a_10", "note": "相關觀念：特權豁免是為確保職務執行而給予，非為個人利益（弁言）；選項C錯誤。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "30", "heading": "私人寓所、文書、信件與財產", "tier": "B", "paras": [{"n": "1", "en": "The private residence of a diplomatic agent shall enjoy the same in violability and protection as the premises of the mission.", "zh": "外交代表之私人寓所一如使館館舍應享有同樣之不得侵犯權及保護。"}, {"n": "2", "en": "His papers, correspondence and, except as provided in paragraph 3 of Article 31, his property, shall likewise enjoy inviolability.", "zh": "外交代表之文書及信件同樣享有不得侵犯權；其財產除第三十一條第三項另有規定外，亦同。"}], "keys": ["外交代表之私人寓所一如使館館舍", "外交代表之文書及信件同樣享有不得侵犯權"], "plain": "外交代表的私人寓所與使館館舍享有同樣的不可侵犯權與保護（暫住的旅館房間也包括在內）。文書與信件同樣不得侵犯；財產也不得侵犯，但在第31條第1項三種民事案件中，若執行處分無損於其人身或寓所的不可侵犯，可以執行（第31條第3項）。", "elements": [{"req": ["外交代表之私人寓所"], "effect": "享有與使館館舍同樣之不得侵犯權及保護"}, {"req": ["外交代表之文書、信件及財產"], "effect": "不得侵犯；財產依第31條第3項有例外"}], "traps": ["陷阱：私人寓所的保護「一如使館館舍」，同樣沒有緊急例外。", "陷阱：財產的不可侵犯有例外（第31條第3項），文書與信件則沒有。", "陷阱：館長寓邸依第1條屬於使館館舍；其他外交代表的寓所依本條受保護。"], "custom": {"status": "習慣法", "note": "被認為反映習慣法。", "cases": []}, "related": ["vcdr-22", "vcdr-29", "vcdr-31", "vcdr-1"], "cases": [], "roc": "依我國特權暨豁免條例，駐臺外國機構人員的住所得依互惠給予相當保護。", "essay": "es110d_4：私人寓所不可侵犯（本條）與人身不可侵犯（第29條）並列討論。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "31", "heading": "管轄之豁免", "tier": "A", "paras": [{"n": "1", "en": "A diplomatie agent shall enjoy immunity from the criminal jurisdiction of the receiving State. He shall also enjoy immunity from its civil and admin istrative jurisdiction, except in the case of:\n(a) a real action relating to private immovable property situated in the territory of the receiving State, unless he holds it on behalf of the sending State for the purposes of the mission;\n(b) an action relating to succession in which the diplomatic agent is involved as executor, administrator, heir or legatee as a private person and not on behalf of the sending State;\n(c) an action relating to any professional or commercial activity exercised by the diplomatic agent in the receiving State outside his official functions.", "zh": "外交代表對接受國之刑事管轄享有豁免。除下列案件外，外交代表對接受國之民事及行政管轄亦享有豁免：\n(甲)關於接受國境內私有不動產之物權訴訟，但其代表派遣國為使館用途置有之不動產不在此列；\n(乙)關於外交代表以私人身分並不代表派遣國而為遺囑執行人、遺產管理人、繼承人或受遺贈人之繼承事件之訴訟；\n(丙)關於外交代表於接受國內在公務範圍以外所從事之專業或商務活動之訴訟。"}, {"n": "2", "en": "A diplomatic agent is not obliged to give evidence as a witness.", "zh": "外交代表無以證人身分作證之義務。"}, {"n": "3", "en": "No measures of execution may be taken in respect of a diplomatic agent except in the cases coming under sub-paragraphs (a), (b) and (c) of paragraph 1 of this Article, and provided that the measures concerned can be taken without infringing the inviolability of his person or of his residence.", "zh": "對外交代表不得為執行之處分，但關於本條第一項(甲)、(乙)、(丙)各款所列之案件，而執行處分復無損於其人身或寓所之不得侵犯權者，不在此限。"}, {"n": "4", "en": "The immunity of a diplomatic agent from the jurisdiction of the receiving State does not exempt him from the jurisdiction of the sending State.", "zh": "外交代表不因其對接受國管轄所享之豁免而免除其受派遣國之管轄。"}], "keys": ["外交代表對接受國之刑事管轄享有豁免", "關於接受國境內私有不動產之物權訴訟", "外交代表無以證人身分作證之義務", "免除其受派遣國之管轄"], "plain": "外交代表對接受國的刑事管轄享有「完全」豁免，沒有例外。民事及行政管轄原則上也豁免，只有三種例外：①接受國境內私有不動產的物權訴訟（為使館用途置有者除外）；②以私人身分參與的繼承事件訴訟；③公務範圍以外的專業或商務活動訴訟。外交代表沒有以證人身分作證的義務。執行處分原則上不得為之，只有在三種例外案件中、且不損及人身與寓所不可侵犯時才可以。豁免是程序上的，不免除派遣國的管轄，也不免除實體責任。", "elements": [{"req": ["外交代表", "接受國刑事管轄"], "effect": "完全豁免"}, {"req": ["接受國民事及行政管轄"], "effect": "原則豁免；私有不動產物權訴訟、私人繼承事件、公務外專業或商務活動三種例外"}, {"req": ["作證"], "effect": "無以證人身分作證之義務"}, {"req": ["屬三種例外案件", "執行處分無損於人身或寓所之不得侵犯"], "effect": "得為執行處分"}, {"req": ["外交代表在接受國享有豁免"], "effect": "不免除其受派遣國管轄"}], "traps": ["陷阱：刑事管轄是完全豁免，酒駕、殺人都一樣（es115d_2）；民事管轄才有三種例外（gl108a_11）。", "陷阱：若甲為外交代表，出售私人車輛不屬三種例外（不是不動產、繼承或持續性的「專業或商務活動」），仍享有民事豁免；若為行政技術職員則否（es115d_2）。", "陷阱：管轄豁免不等於免除實體責任（gl115a_12選項B錯誤）；派遣國仍可依其國內法追訴（第4項）。", "陷阱：例外(甲)款不包括代表派遣國為使館用途置有的不動產。", "陷阱：交通事故訴訟不是外交代表的民事豁免例外（對照領事官員，領事關係公約第43條第2項(二)款）。"], "custom": {"status": "習慣法", "note": "刑事完全豁免與民事豁免的三項例外被認為反映習慣法。", "cases": ["tehran-hostages"]}, "related": ["vcdr-29", "vcdr-32", "vcdr-37", "vcdr-38", "vcdr-39", "vccr-43"], "cases": [{"id": "tehran-hostages", "point": "伊朗揚言將美國外交人員交付審判，法院認為這會違反第31條的刑事管轄豁免。"}], "roc": "我國法院處理駐臺外國人員涉訟案件，依《駐華外國機構及其人員特權暨豁免條例》與互惠原則判斷是否豁免。", "essay": "es115d_2：①外交代表酒駕：刑事管轄完全豁免（第31條第1項），接受國不得逮捕起訴，只能請求派遣國拋棄豁免（第32條）、宣告不受歡迎人員（第9條）或由派遣國追訴（第31條第4項）；②出售私人車輛的民事訴訟：不屬三種例外，享有豁免；③豁免不免除實體責任，離任後私人行為可追訴（第39條第2項）。", "exam": [{"qid": "gl108a_11", "note": "正解D：接受國境內私有不動產之物權訴訟是民事豁免的例外（第31條第1項(甲)款）。"}, {"qid": "gl115a_12", "note": "選項B錯誤：管轄豁免不等於免除實際責任；派遣國仍可行使管轄（第31條第4項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "32", "heading": "豁免之拋棄", "tier": "A", "paras": [{"n": "1", "en": "The immunity from jurisdiction of diplomatic agents and of persons enjoying immunity under Article 37 may be waived by the sending State.", "zh": "外交代表及依第三十七條享有豁免之人對管轄之豁免得由派遣國拋棄之。"}, {"n": "2", "en": "Waiver must always be express.", "zh": "豁免之拋棄，概須明示。"}, {"n": "3", "en": "The initiation of proceedings by a diplomatic agent or by a person enjoying immunity from jurisdiction under Article 37 shall preclude him from invoking immunity from jurisdiction in respect of any counter-claim directly connected with the principal claim.", "zh": "外交代表或依第三十七條享有管轄之豁免之人如主動提起訴訟即不得對與主訴直接相關之反訴主張管轄之豁免。"}, {"n": "4", "en": "Waiver of immunity from jurisdiction in respect of civil or administrative proceedings shall not be held to imply waiver of immunity in respect of the execution of the judgment, for which a separate waiver shall be necessary.", "zh": "在民事或行政訴訟程序上管轄豁免之拋棄，不得視為對判決執行之豁免亦默示拋棄，後項拋棄須分別為之。"}], "keys": ["得由派遣國拋棄之", "豁免之拋棄，概須明示", "後項拋棄須分別為之"], "plain": "豁免是派遣國的權利，只有「派遣國」可以拋棄，外交代表個人不能自行拋棄（es110l_1）。拋棄必須明示。外交代表主動起訴時，對與主訴直接相關的反訴不得主張豁免（這是法定的效果，不是默示拋棄）。在民事或行政程序中拋棄管轄豁免，不等於同時拋棄執行豁免；執行豁免必須另外拋棄。", "elements": [{"req": ["外交代表或第37條享有豁免之人的管轄豁免"], "effect": "得由派遣國拋棄，且須明示"}, {"req": ["享有豁免之人主動提起訴訟"], "effect": "對與主訴直接相關之反訴不得主張豁免"}, {"req": ["民事或行政程序中拋棄管轄豁免"], "effect": "不視為默示拋棄執行豁免，執行豁免須另行拋棄"}], "traps": ["陷阱：拋棄權在「派遣國」，大使個人不能自行拋棄（es110l_1）；實務上外交代表或使館館長代表派遣國表示時，視為派遣國的拋棄。", "陷阱：拋棄須明示，不能從行為推定（反訴的情形是第3項的明文規定）。", "陷阱：管轄豁免與執行豁免分開，拋棄前者不等於拋棄後者。"], "custom": {"status": "習慣法", "note": "豁免屬於國家、須由國家拋棄，為習慣法。", "cases": []}, "related": ["vcdr-31", "vcdr-37", "vcdr-9"], "cases": [], "roc": "我國外交人員在外涉案時，是否拋棄豁免由外交部決定。", "essay": "es110l_1：大使能否自行拋棄豁免？不能，依第32條第1項須由派遣國拋棄，且須明示；理由是豁免的目的在確保使館職務，不是個人利益（弁言）。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "37", "heading": "家屬及其他使館人員之特權與豁免", "tier": "A", "paras": [{"n": "1", "en": "The members of the family of a diplomatic agent forming part of his household shall, if they are not nationals of the receiving State, enjoy the privi leges and immunities specified in Articles 29 to 36.", "zh": "外交代表之與其構成同一戶口之家屬，如非接受國國民，應享有第二十九條至第三十六條所規定之特權與豁免。"}, {"n": "2", "en": "Members of the administrative and technical staff of the mission, together with members of their families forming part of their respective households, shall, if they are not nationals of or permanently resident in the receiving State, enjoy the privileges and immunities specified in Articles 29 to 35, except that the immunity from civil and administrative jurisdiction of the receiving State specified in paragraph 1 of Article 31 shall not extend to acts performed outside the course of their duties. They shall also enjoy the privileges specified in Article 36, paragraph 1, in respect of articles imported at the time of first installation.", "zh": "使館行政與技術職員暨與其構成同一戶口之家屬，如非接受國國民且不在該國永久居留者，均享有第二十九條至第三十五條所規定之特權與豁免，但第三十一條第一項所規定對接受國民事及行政管轄之豁免不適用於執行職務範圍以外之行為。關於最初定居時所輸入之物品，此等人員亦享有第三十六條第一項所規定之特權。"}, {"n": "3", "en": "Members of the service staff of the mission who are not nationals of or permanently resident in the receiving State shall enjoy immunity in respect of acts performed in the course of their duties, exemption from dues and taxes on the emoluments they receive by reason of their employment and the exemp tion contained in Article 33.", "zh": "使館事務職員如非接受國國民且不在該國永久居留者，就其執行公務之行為享有豁免，其受雇所得酬報免納捐稅，並享有第三十三條所載之豁免。"}, {"n": "4", "en": "Private servants of members of the mission shall, if they are not nationals of or permanently resident in the receiving State, be exempt from dues and taxes on the emoluments they receive by reason of their employment. In other respects, they may enjoy privileges and immunities only to the extent admitted by the receiving State. However, the receiving State must exercise its juris diction over those persons in such a manner as not to interfere unduly with the performance of the functions of the mission.", "zh": "使館人員之私人僕役如非接受國國民且不在該國永久居留者，其受雇所得酬報免納捐稅。在其他方面，此等人員僅得在接受國許可範圍內享有特權與豁免。但接受國對此等人員所施之管轄應妥為行使，以免對使館職務之執行有不當之妨礙。"}], "keys": ["如非接受國國民，應享有第二十九條至第三十六條所規定之特權與豁免", "不適用於執行職務範圍以外之行為", "就其執行公務之行為享有豁免", "其受雇所得酬報免納捐稅"], "plain": "依身分分層給予特權豁免：①外交代表的家屬（同一戶口）如非接受國國民，享有和外交代表相同的第29至36條待遇；②行政及技術職員與其家屬（非接受國國民且非永久居留）享有第29至35條待遇，刑事管轄完全豁免，但民事及行政管轄豁免只限執行職務的行為；③事務職員只有職務行為豁免、薪資免稅及社會保險豁免；④私人僕役只有薪資免稅，其餘依接受國許可。接受國對③④行使管轄時，應避免不當妨礙使館職務。", "elements": [{"req": ["外交代表之同戶家屬", "非接受國國民"], "effect": "享有第29至36條之特權與豁免"}, {"req": ["行政及技術職員及其同戶家屬", "非接受國國民且不在該國永久居留"], "effect": "享有第29至35條之特權與豁免；民事及行政管轄豁免限於執行職務之行為"}, {"req": ["事務職員", "非接受國國民且不在該國永久居留"], "effect": "職務行為豁免、受雇酬報免稅、社會保險豁免"}, {"req": ["私人僕役", "非接受國國民且不在該國永久居留"], "effect": "受雇酬報免稅；其他特權豁免以接受國許可為限"}], "traps": ["陷阱：家屬指「與其構成同一戶口」的家屬，習慣上包括同住的配偶與未成年子女（gl115a_12正解D）。", "陷阱：行政技術職員的刑事管轄是完全豁免，民事及行政管轄豁免才限於職務行為。", "陷阱：行政技術職員的「家屬」也享有第29至35條待遇，題目說「家屬在執行職務範圍內享有豁免」是錯誤的表述（gl115a_12選項C）。", "陷阱：私人僕役不是使館職員，只有薪資免稅（第1條(辛)款、本條第4項）。"], "custom": {"status": "部分習慣法", "note": "家屬享有外交代表待遇為習慣法；行政技術職員的分層待遇是1961年會議的折衷安排。", "cases": ["tehran-hostages"]}, "related": ["vcdr-1", "vcdr-38", "vcdr-31", "vcdr-29"], "cases": [{"id": "tehran-hostages", "point": "被扣押者包括行政技術職員與事務職員，法院認定伊朗同時違反對這些人員的保護義務。"}], "roc": "依我國特權暨豁免條例，駐臺機構人員的眷屬是否享有特權豁免，依互惠協議認定。", "essay": "身分判斷三步驟：①依第1條認定類別；②是否為接受國國民或永久居留者（第38條）；③依本條決定範圍。es115d_2若甲是行政技術人員，刑事仍完全豁免，但出售私車屬職務外的民事行為，不享有豁免。", "exam": [{"qid": "gl115a_12", "note": "正解D：外交代表的家屬指構成同一戶口者，習慣上包括配偶與未成年子女（第37條第1項）。選項C錯誤：行政技術職員的家屬享有第29至35條待遇，並非「在執行職務範圍內」享有豁免。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "38", "heading": "接受國國民或永久居民之外交代表", "tier": "A", "paras": [{"n": "1", "en": "Except insofar as additional privileges and immunities may be granted by the receiving State, a diplomatic agent who is a national of or permanently resident in that State shall enjoy only immunity from jurisdiction, and inviola bility, in respect of official acts performed in the exercise of his functions.", "zh": "除接受國特許享受其他特權及豁免外，外交代表為接受國國民或在該國永久居留者，僅就其執行職務之公務行為，享有管轄之豁免及不得侵犯權。"}, {"n": "2", "en": "Other members of the staff of the mission and private servants who are nationals of or permanently resident in the receiving State shall enjoy privileges and immunities only to the extent admitted by the receiving State. However, the receiving State must exercise its jurisdiction over those persons in such a manner as not to interfere unduly with the performance of the functions of the mission.", "zh": "其他使館館員及私人僕役為接受國國民或在該國永久居留者僅得在接受國許可之範圍內享有特權與豁免。但接受國對此等人員所施之管轄應妥為行使，以免對使館職務之執行有不當之妨礙。"}], "keys": ["僅就其執行職務之公務行為，享有管轄之豁免及不得侵犯權", "僅得在接受國許可之範圍內享有特權與豁免"], "plain": "外交代表如果是接受國國民或在接受國永久居留，只就執行職務的公務行為享有管轄豁免與不可侵犯（接受國另給予更多者不在此限）。其他使館人員與私人僕役若是接受國國民或永久居民，只能在接受國許可的範圍內享有特權豁免，但接受國行使管轄時應避免不當妨礙使館職務。委派接受國國民為外交職員，須經接受國同意（第8條第2項）。", "elements": [{"req": ["外交代表為接受國國民或在該國永久居留"], "effect": "僅就執行職務之公務行為享有管轄豁免及不可侵犯（接受國另特許者除外）"}, {"req": ["其他使館人員及私人僕役為接受國國民或永久居民"], "effect": "僅在接受國許可範圍內享有特權豁免"}], "traps": ["陷阱：接受國國民身分的外交代表只有職務行為豁免，沒有作證豁免或完全刑事豁免（gl111a_8）。", "陷阱：接受國可以特許給予更多特權豁免。"], "custom": {"status": "習慣法", "note": "被認為反映習慣法。", "cases": []}, "related": ["vcdr-37", "vcdr-8", "vccr-71"], "cases": [], "roc": "我國國民受僱於外國駐臺機構時，原則上不享有特權豁免，職務行為除外。", "essay": "與領事關係公約第71條對照：兩者都只給予職務行為豁免。", "exam": [{"qid": "gl111a_8", "note": "正解C：外交代表為接受國國民時，僅就執行職務之公務行為享有管轄豁免及不得侵犯權（第38條第1項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "39", "heading": "特權與豁免之開始及終止", "tier": "A", "paras": [{"n": "1", "en": "Every person entitled to privileges and immunities shall enjoy them from the moment he enters the territory of the receiving State on proceeding to take up his post or, if already in its territory, from the moment when his appointment is notified to the Ministry for Foreign Affairs or such other ministry as may be agreed.", "zh": "凡享有外交特權與豁免之人，自其進入接受國國境前往就任之時起享有此項特權與豁免，其已在該國境內者，自其委派通知外交部或另經商定之其他部之時開始享有。"}, {"n": "2", "en": "When the functions of a person enjoying privileges and immunities have come to an end, such privileges and immunities shall normally cease at the moment when he leaves the country, or on expiry of a reasonable period in which to do so, but shall subsist until that time, even in case of armed conflict. However, with respect to acts performed by such a person in the exercise of his functions as a member of the mission, immunity shall continue to subsist.", "zh": "享有特權與豁免人員之職務如已終止，此項特權與豁免通常於該員離境之時或聽任其離境之合理期間終了之時停止，縱有武裝衝突情事，亦應繼續有效至該時為止。但關於其以使館人員資格執行職務之行為，豁免應始終有效。"}, {"n": "3", "en": "In case of the death of a member of the mission, the members of his family shall continue to enjoy the privileges and immunities to which they are entitled until the expiry of a reasonable period in which to leave the country.", "zh": "遇使館人員死亡，其家屬應繼續享有應享之特權與豁免，至聽任其離境之合理期間終了之時為止。"}, {"n": "4", "en": "In the event of the death of a member of the mission not a national of or permanently resident in the receiving State or a member of his family forming part of his household, the receiving State shall permit the withdrawal of the movable property of the deceased, with the exception of any property acquired in the country the export of which was prohibited at the time of his death. Estate, succession and inheritance duties shall not be levied on movable property the presence of which in the receiving State was due solely to the presence there of the deceased as a member of the mission or as a member of the family of a member of the mission.", "zh": "遇非為接受國國民且不在該國永久居留之使館人員或與其構成同一戶口之家屬死亡，接受國應許可亡故者之動產移送出國，但任何財產如係在接受國內取得而在當事人死亡時禁止出口者，不在此列。動產之在接受國純係因亡故者為使館人員或其家屬而在接受國境內所致者，應不課征遺產稅、遺產取得稅及繼承稅。"}], "keys": ["自其進入接受國國境前往就任之時起享有此項特權與豁免", "縱有武裝衝突情事", "豁免應始終有效"], "plain": "特權豁免從進入接受國國境前往就任時開始；已在境內者，從委派通知外交部時開始。職務終止後，於離境時或離境的合理期間屆滿時停止，即使發生武裝衝突也要維持到那時。但以使館人員資格執行職務的行為，豁免永久有效。使館人員死亡時，家屬享有的特權豁免維持到離境的合理期間屆滿；接受國應許可亡故者動產移送出國，並不課遺產稅。", "elements": [{"req": ["進入接受國國境前往就任（已在境內者為委派通知時）"], "effect": "開始享有特權與豁免"}, {"req": ["職務終止"], "effect": "於離境或合理期間屆滿時停止，武裝衝突亦同"}, {"req": ["以使館人員資格執行職務之行為"], "effect": "豁免始終有效"}], "traps": ["陷阱：卸任外交官的私人行為，於離境或合理期間屆滿後即可追訴；職務行為的豁免永久持續（gl109a_10選項C錯誤）。", "陷阱：特權豁免目的在確保職務執行而非個人利益（弁言），所以卸任後不能全部保留。", "陷阱：開始時點是「進入國境前往就任」，不是遞交國書時。"], "custom": {"status": "習慣法", "note": "職務行為豁免永久持續（屬事豁免）為習慣法。", "cases": []}, "related": ["vcdr-31", "vcdr-9", "vccr-53"], "cases": [], "roc": "我國對卸任駐臺人員私人行為的追訴，同樣依本條原則處理。", "essay": "卸任外交官可否追訴：區分職務行為（永久豁免）與私人行為（離境或合理期間後可追訴），可連結皮諾契特案討論卸任元首的屬事豁免。", "exam": [{"qid": "gl109a_10", "note": "選項C錯誤：特權豁免是為職務而非個人而給予，卸任後只有職務行為豁免繼續（第39條第2項）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vcdr", "no": "40", "heading": "第三國之義務", "tier": "B", "paras": [{"n": "1", "en": "If a diplomatic agent passes through or is in the territory of a third State, which has granted him a passport visa if such visa was necessary, while proceeding to take up or to return to his post, or when returning to his own country, the third State shall accord him inviolability and such other immunities as may be required to ensure his transit or return. The same shall apply in the case of any members of his family enjoying privileges or immunities who are accompanying the diplomatic agent, or travelling separately to join him or to return to their country.", "zh": "遇外交代表前往就任或返任或返回本國，道經第三國國境或在該國境內，而該國曾發給所需之護照簽證時，第三國應給予不得侵犯權及確保其過境或返回所必需之其他豁免。享有外交特權或豁免之家屬與外交代表同行時，或單獨旅行前往會聚或返回本國時，本項規定同樣適用。"}, {"n": "2", "en": "In circumstances similar to those specified in paragraph 1 of this Article, third States shall not hinder the passage of members of the administrative and technical or service staff of a mission, and of members of their families, through their territories.", "zh": "遇有類似本條第一項所述之情形，第三國不得阻礙使館之行政與技術或事務職員及其家屬經過該國國境。"}, {"n": "3", "en": "Third States shall accord to official correspondence and other official communications in transit, including messages in code or cipher, the same freedom and protection as is accorded by the receiving State. They shall accord to diplomatic couriers, who have been granted a passport visa if such visa was necessary, and diplomatic bags in transit the same inviolability and protection as the receiving State is bound to accord.", "zh": "第三國對於過境之來往公文及其他公務通訊，包括明密碼電信在內，應一如接受國給予同樣之自由及保護。第三國於已發給所需護照簽證之外交信差及外交郵袋過境時，應比照接受國所負之義務，給予同樣之不得侵犯權及保護。"}, {"n": "4", "en": "The obligations of third States under paragraphs 1, 2 and 3 of this Article shall also apply to the persons mentioned respectively in those para graphs, and to official communications and diplomatic bags, whose presence in the territory of the third State is due to force majeure.", "zh": "第三國依本條第一項、第二項及第三項規定所負之義務，對於各該項內分別述及之人員與公務通訊及外交郵袋之因不可抗力而在第三國境內者，亦適用之。"}], "keys": ["道經第三國國境或在該國境內", "第三國應給予不得侵犯權及確保其過境或返回所必需之其他豁免", "因不可抗力而在第三國境內者"], "plain": "外交代表前往就任、返任或返回本國途中，若過境第三國且該國曾發給所需護照簽證，第三國應給予人身不可侵犯及過境所必需的豁免；家屬同行或單獨前往會聚、返國時亦同。第三國不得阻礙使館行政技術與事務職員及家屬過境；對過境的公文、通訊、外交信差與郵袋，應比照接受國給予保護。因不可抗力而在第三國境內者，也適用本條。注意：本條只保護「過境」，外交代表在第三國的其他活動不享有豁免。", "elements": [{"req": ["外交代表前往就任、返任或返國", "過境第三國", "第三國曾發給所需護照簽證"], "effect": "第三國應給予不可侵犯權及過境所必需之其他豁免"}, {"req": ["公務通訊、外交信差及郵袋過境第三國"], "effect": "第三國應比照接受國給予同樣的自由與保護"}, {"req": ["因不可抗力而在第三國境內"], "effect": "亦適用本條"}], "traps": ["陷阱：外交代表在第三國原則上不享有豁免，只有在「前往或返回駐地的過境」時才受本條保護（es108d_4）。", "陷阱：過境保護以第三國曾發給所需簽證為前提（免簽情形亦可）。"], "custom": {"status": "部分習慣法", "note": "過境保護的核心被認為反映習慣法。", "cases": []}, "related": ["vcdr-31", "vcdr-27", "vcdr-29"], "cases": [], "roc": "我國外交人員過境第三國時，依本條及當地國實踐處理。", "essay": "es108d_4：B國派駐A國的武官甲在C國劫機被捕，主張豁免無理由：①武官屬外交職員，但其豁免是對「接受國」A國而言（第31條）；②在C國只有第40條的過境保護，而劫機不是前往或返回駐地的過境行為；③C國得依領域管轄（及相關反劫機公約）追訴。", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第4A批新增本條；中文依聯合國條約集第500卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

CASES.push({"id": "tehran-hostages", "nameZh": "德黑蘭人質案（美國訴伊朗）", "nameEn": "United States Diplomatic and Consular Staff in Tehran (United States of America v. Iran)", "court": "國際法院", "year": "1980", "date": "1980-05-24", "kind": "判決", "parties": "美國1979年11月29日起訴伊朗；管轄依據為外交關係公約及領事關係公約的強制解決爭端任擇議定書，以及1955年美伊友好條約。伊朗未出庭。", "facts": "1979年11月4日，伊朗學生群眾攻占美國駐德黑蘭大使館，扣押外交與領事人員及其他美國公民作為人質；美國在大不里士、設拉子的領館也遭占領。伊朗安全部隊未加阻止。最高領袖何梅尼隨後公開表示支持，宣布人質須待美國交出前國王才會釋放。法院1979年12月15日發布臨時措施，要求立即釋放人質並歸還館舍。", "issues": ["群眾攻占使館的行為能否歸屬於伊朗？", "伊朗是否違反外交關係公約與領事關係公約的義務？", "伊朗能否以美國干涉內政、從事間諜活動為由正當化其行為？"], "holding": ["第一階段：攻占使館的群眾當時不是伊朗國家機關，其行為本身不能歸屬伊朗；但伊朗明知危險而未採取任何適當步驟保護使館與人員，違反第22條第2項、第24、25、26、27、29條等積極保護義務。", "第二階段：伊朗官方認可並決定延續占領與扣押人質，使群眾的行為轉化為伊朗國家的行為，伊朗須負國際責任。", "外交法是「自成體系」的規則：對外交人員濫用特權的救濟，公約已規定宣告不受歡迎人員、斷交等手段；伊朗指控美國干涉內政或從事間諜活動，不能正當化扣押人質。", "伊朗應立即釋放人質、歸還館舍與檔案，不得將外交人員交付審判，並應賠償（13比2）；賠償金額保留，後因1981年阿爾及爾協定雙方和解，美國撤回請求。"], "significance": "外交法的核心判例：①館舍與人員不可侵犯包括接受國的積極保護義務；②私人行為經國家認可後可歸屬於國家（國家責任條款第11條的原型）；③外交法自成體系，接受國不能以反措施為由侵犯外交人員（國家責任條款第50條第2項(b)款）；④外交與領事關係公約的規定同時反映一般國際法。人質於1981年1月20日獲釋。", "articles": ["vcdr-22", "vcdr-24", "vcdr-29", "vcdr-31", "vcdr-37", "vcdr-41", "vcdr-45", "vccr-5", "vccr-36"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/64", "verified": "2026-10-07"});
