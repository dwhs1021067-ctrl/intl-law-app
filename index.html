ARTICLES.push({"treaty": "vclt", "no": "20", "heading": "接受及反對保留", "tier": "A", "paras": [{"n": "1", "en": "A reservation expressly authorized by a treaty does not require any subsequent acceptance by the other contracting States unless the treaty so provides.", "zh": "凡為條約明示准許之保留，無須其他締約國事後予以接受，但條約規定須如此辦理者，不在此限。"}, {"n": "2", "en": "When it appears from the limited number of the negotiating States and the object and purpose of a treaty that the application of the treaty in its entirety between all the parties is an essential condition of the consent of each one to be bound by the treaty, a reservation requires acceptance by all the parties.", "zh": "倘自談判國之有限數目及條約之目的與宗旨，可見在全體當事國間適用全部條約為每一當事國同意承受條約拘束之必要條件時，保留須經全體當事國接受。"}, {"n": "3", "en": "When a treaty is a constituent instrument of an international organization and unless it otherwise provides, a reservation requires the acceptance of the competent organ of that organization.", "zh": "倘條約為國際組織之組織約章，除條約另有規定外，保留須經該組織主管機關接受。"}, {"n": "4", "en": "In cases not falling under the preceding paragraphs and unless the treaty otherwise provides:\n(a) Acceptance by another contracting State of a reservation constitutes the reserving State a party to the treaty in relation to that other State if or when the treaty is in force for those States;\n(b) An objection by another contracting State to a reservation does not preclude the entry into force of the treaty as between the objecting and reserving States unless a contrary intention is definitely expressed by the objecting State;\n(c) An act expressing a State's consent to be bound by the treaty and containing a reservation is effective as soon as at least one other contracting State has accepted the reservation.", "zh": "凡不屬以上各項所稱之情形，除條約另有規定外：\n(甲)保留經另一締約國接受，就該另一締約國而言，保留國即成為條約之當事國，但須條約對各該國均已生效；\n(乙)保留經另一締約國反對，則條約在反對國與保留國間並不因此而不生效力，但反對國確切表示相反之意思者不在此限；\n(丙)表示一國同意承受條約拘束而附以保留之行為，一俟至少有另一締約國接受保留，即發生效力。"}, {"n": "5", "en": "For the purposes of paragraphs 2 and 4 and unless the treaty otherwise provides, a reservation is considered to have been accepted by a State if it shall have raised no objection to the reservation by the end of a period of twelve months after it was notified of the reservation or by the date on which it expressed its consent to be bound by the treaty, whichever is later.", "zh": "就適用第二項與第四項而言，除條約另有規定外，倘一國在接獲關於保留之通知後十二個月期間屆滿時或至其表示同意承受條約拘束之日為止，兩者中以較後之日期為準，迄未對保留提出反對，此項保留即視為業經該國接受。"}], "keys": ["無須其他締約國事後予以接受", "保留須經全體當事國接受", "保留須經該組織主管機關接受", "保留國即成為條約之當事國", "條約在反對國與保留國間並不因此而不生效力，但反對國確切表示相反之意思者不在此限", "此項保留即視為業經該國接受"], "plain": "接受與反對保留的規則分四層：①條約明示准許的保留，不需他國接受（第1項）；②談判國數目有限、且全體適用全部條約是各國同意的必要條件時（小型多邊條約），保留須經「全體」當事國接受（第2項）；③國際組織的組織約章，保留須經該組織主管機關接受（第3項）；④其他一般多邊條約（第4項）：(甲)另一締約國接受保留，保留國與該國之間即成為條約當事國；(乙)另一締約國反對保留，條約在兩國間「仍然生效」，除非反對國確切表示不讓條約在兩國間生效；(丙)只要至少有一個締約國接受，保留國表示同意的行為就生效。第5項：收到保留通知後12個月內（或至本國表示同意承受拘束之日，以較後者為準）未提出反對，視為默示接受。反對的效果見第21條第3項。", "elements": [{"req": ["條約明示准許的保留"], "effect": "無須其他締約國接受"}, {"req": ["談判國數目有限", "全體適用全部條約為各國同意的必要條件"], "effect": "保留須經全體當事國接受"}, {"req": ["一般多邊條約", "另一締約國接受保留"], "effect": "保留國與該國間成為條約當事國"}, {"req": ["一般多邊條約", "另一締約國反對保留，但未確切表示反對條約在兩國間生效"], "effect": "條約在兩國間仍然生效（保留所涉規定在保留範圍內不適用，第21條第3項）"}, {"req": ["收到保留通知後12個月內或至表示同意承受拘束之日（以較後者為準）未反對"], "effect": "視為接受保留"}], "traps": ["陷阱：一般多邊條約中，反對保留「不當然」使條約在兩國間不生效；須反對國「確切表示」相反意思（最大反對）才不生效。", "陷阱：默示接受的期間是收到通知後12個月，或至該國表示同意承受拘束之日，以「較後」者為準。", "陷阱：國際組織組織約章的保留，由該組織主管機關接受，不是由各會員國個別接受。"], "custom": {"status": "部分", "note": "彈性體制源自殘害人群罪公約保留諮詢意見；細節為條約規定。", "cases": []}, "related": ["vclt-19", "vclt-21", "vclt-23"], "cases": [{"id": "genocide-reservations", "point": "各當事國可自行判斷保留是否與公約目的及宗旨相容，並據以決定是否視保留國為當事國；為第20條第4項彈性體制的前身。"}], "roc": "", "essay": "接受與反對保留：「依第20條第4項，除條約另有規定外，保留經另一締約國接受，保留國即與該國成為當事國；經另一締約國反對，條約在兩國間仍然生效，除非反對國確切表示相反意思。依第5項，收到通知後12個月內未反對者視為接受。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "21", "heading": "保留及對保留提出之反對之法律效果", "tier": "A", "paras": [{"n": "1", "en": "A reservation established with regard to another party in accordance with articles 19, 20 and 23:\n(a) Modifies for the reserving State in its relations with that other party the provisions of the treaty to which the reservation relates to the extent of the reservation; and\n(b) Modifies those provisions to the same extent for that other party in its relations with the reserving State.", "zh": "依照第十九條、第二十條及第二十三條對另一當事國成立之保留：\n(甲)對保留國而言，其與該另一當事國之關係上照保留之範圍修改保留所關涉之條約規定；及\n(乙)對該另一當事國而言，其與保留國之關係上照同一範圍修改此等規定。"}, {"n": "2", "en": "The reservation does not modify the provisions of the treaty for the other parties to the treaty inter se.", "zh": "此項保留在條約其他當事國相互間不修改條約之規定。"}, {"n": "3", "en": "When a State objecting to a reservation has not opposed the entry into force of the treaty between itself and the reserving State, the provisions to which the reservation relates do not apply as between the two States to the extent of the reservation.", "zh": "倘反對保留之國家未反對條約在其本國與保留國間生效，此項保留所關涉之規定在保留之範圍內於該兩國間不適用之。"}], "keys": ["照保留之範圍修改保留所關涉之條約規定", "此項保留在條約其他當事國相互間不修改條約之規定", "此項保留所關涉之規定在保留之範圍內於該兩國間不適用之"], "plain": "保留成立後的法律效果是「雙向、相對」的：①保留國與接受國之間，保留所涉規定在保留範圍內被修改，而且對雙方同樣修改（互惠，第1項）；②其他當事國彼此之間不受影響（第2項）；③反對保留但不反對條約生效的國家，與保留國之間，保留所涉規定在保留範圍內「不適用」（第3項）。實際上，第1項與第3項在許多情形結果相近——無論接受或單純反對，保留所涉的規定在兩國間都不適用；差別主要在「修改」與「不適用」的措辭，以及最大反對時條約在兩國間根本不生效。", "elements": [{"req": ["保留依第19、20、23條對另一當事國成立"], "effect": "在保留國與該國之間，雙方均照保留範圍修改相關規定"}, {"req": ["反對保留之國家未反對條約在兩國間生效"], "effect": "保留所涉規定在保留範圍內於兩國間不適用"}], "traps": ["陷阱：保留效果是「相互」的，接受國對保留國也可主張同一範圍的修改。", "陷阱：保留不影響其他當事國相互之間的條約關係。", "陷阱：單純反對時，條約在兩國間仍生效，只是保留所涉規定在保留範圍內不適用（SG041選項D「就保留部分不存在條約關係」的說法即指此）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["vclt-19", "vclt-20", "vclt-23"], "cases": [], "roc": "", "essay": "反對保留的效果：「另一締約國書面反對保留時，依第20條第4項(乙)款，條約在反對國與保留國間仍然生效，除非反對國確切表示相反之意思；依第21條第3項，保留所涉規定在保留範圍內於兩國間不適用。若反對國明確表示反對條約在兩國間生效，則 ARTICLES.push({"treaty": "vclt", "no": "22", "heading": "撤回保留及撤回對保留提出之反對", "tier": "A", "paras": [{"n": "1", "en": "Unless the treaty otherwise provides, a reservation may be withdrawn at any time and the consent of a State which has accepted the reservation is not required for its withdrawal.", "zh": "除條約另有規定外，保留得隨時撤回，無須經業已接受保留之國家同意。"}, {"n": "2", "en": "Unless the treaty otherwise provides, an objection to a reservation may be withdrawn at any time.", "zh": "除條約另有規定外，對保留提出之反對得隨時撤回。"}, {"n": "3", "en": "Unless the treaty otherwise provides, or it is otherwise agreed:\n(a) The withdrawal of a reservation becomes operative in relation to another contracting State only when notice of it has been received by that State;\n(b) The withdrawal of an objection to a reservation becomes operative only when notice of it has been received by the State which formulated the reservation.", "zh": "除條約另有規定或另經協議外：\n(甲)保留之撤回，在對另一締約國之關係上，自該國收到撤回保留之通知之時起方始發生效力；\n(乙)對保留提出之反對之撤回，自提出保留之國家收到撤回反對之通知時起方始發生效力。"}], "keys": ["保留得隨時撤回，無須經業已接受保留之國家同意", "對保留提出之反對得隨時撤回"], "plain": "保留與反對都可以「隨時」撤回，撤回保留不需要已接受保留國家的同意（第1、2項）。生效時點（第3項）：撤回保留，在對另一締約國的關係上，自該國「收到」撤回通知時起生效；撤回反對，自保留國「收到」撤回反對的通知時起生效。撤回必須以書面為之（第23條第4項）。", "elements": [{"req": ["除條約另有規定外"], "effect": "保留與對保留的反對都得隨時撤回；撤回保留無須接受國同意"}, {"req": ["撤回保留"], "effect": "自另一締約國收到撤回通知時起，對該國生效"}], "traps": ["陷阱：保留得隨時撤回，不需其他國家同意（SG041選項A「一旦做出即不得撤回」錯誤）。", "陷阱：撤回的效力自對方「收到通知」時起算，不是自發出時。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["vclt-19", "vclt-23"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG041", "note": "正解A：選項稱保留一旦做出即不得撤回，與第22條第1項「保留得隨時撤回」相反。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "25", "heading": "暫時適用", "tier": "B", "paras": [{"n": "1", "en": "A treaty or a part of a treaty is applied provisionally pending its entry into force if:\n(a) The treaty itself so provides; or\n(b) The negotiating States have in some other manner so agreed.", "zh": "條約或條約之一部分於條約生效前在下列情形下暫時適用：\n(甲)條約本身如此規定；或\n(乙)談判國以其他方式協議如此辦理。"}, {"n": "2", "en": "Unless the treaty otherwise provides or the negotiating States have otherwise agreed, the provisional application of a treaty or a part of a treaty with respect to a State shall be terminated if that State notifies the other States between which the treaty is being applied provisionally of its intention not to become a party to the treaty. OF TREATIES", "zh": "除條約另有規定或談判國另有協議外，條約或條約一部分對一國之暫時適用，於該國將其不欲成為條約當事國之意思通知已暫時適用條約之其他各國時終止。"}], "keys": ["條約或條約之一部分於條約生效前在下列情形下暫時適用", "於該國將其不欲成為條約當事國之意思通知已暫時適用條約之其他各國時終止"], "plain": "{{暫時適用}}：條約或其一部分，可以在生效前暫時適用，條件是條約本身規定或談判國另有協議（第1項）。適用期間，一國可通知其他暫時適用的國家「不欲成為當事國」而終止暫時適用（第2項）。實例：1994年《關於執行海洋法公約第十一部分的協定》、《能源憲章條約》第45條（俄羅斯暫時適用並退出引發的尤科斯案）。", "elements": [{"req": ["條約本身規定，或談判國另有協議"], "effect": "條約或其一部分得於生效前暫時適用"}, {"req": ["一國通知其他暫時適用的國家不欲成為當事國"], "effect": "對該國的暫時適用終止"}], "traps": ["陷阱：暫時適用須有條約規定或談判國協議，不是簽署後當然適用。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["vclt-24", "vclt-18"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "26", "heading": "條約必須遵守", "tier": "A", "paras": [{"n": "", "en": "Every treaty in force is binding upon the parties to it and must be performed by them in good faith.", "zh": "凡有效之條約對其各當事國有拘束力，必須由各該國善意履行。"}], "keys": ["凡有效之條約對其各當事國有拘束力，必須由各該國善意履行"], "plain": "{{條約必須遵守}}（pacta sunt servanda）是條約法的基石，也是習慣國際法與一般法律原則。兩個要素：①有效的條約拘束各當事國；②必須「善意」履行。善意不只是形式上遵守文字，也禁止以濫用權利或規避手段使條約落空（加布契科沃—大毛羅斯案：當事國應以合理方式履行，使條約目的得以實現）。聯合國憲章第2條第2項也規定會員國應一秉善意履行憲章義務。", "elements": [{"req": ["有效的條約"], "effect": "拘束各當事國，並須由各當事國善意履行"}], "traps": ["陷阱：條約必須遵守只拘束「當事國」；對第三國不生義務（第34條）。", "陷阱：善意履行是條約法的核心原則，第27條（不得以國內法為由不履行）是其延伸。"], "custom": {"status": "習慣法", "note": "條約必須遵守原則屬習慣國際法與一般法律原則，亦見憲章第2條第2項。", "cases": []}, "related": ["vclt-27", "vclt-34", "unc-2", "vclt-18"], "cases": [], "roc": "", "essay": "條約必須遵守：「依條約法公約第26條，凡有效之條約對其各當事國有拘束力，必須由各該國善意履行；此原則亦屬習慣國際法，並見於聯合國憲章第2條第2項。」", "exam": [{"qid": "gl113a_2", "note": "選項A依第26條敘述正確；本題錯誤選項為B（第27條：不得援引國內法為理由不履行條約）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "27", "heading": "國內法與條約之遵守", "tier": "A", "paras": [{"n": "", "en": "A party may not invoke the provisions of its internal law as justification for its failure to perform a treaty. This rule is without prejudice to article 46.", "zh": "一當事國不得援引其國內法規定為理由而不履行條約。此項規則不妨礙第四十六條。"}], "keys": ["一當事國不得援引其國內法規定為理由而不履行條約", "此項規則不妨礙第四十六條"], "plain": "國家不能以國內法（包括憲法、法院判決、聯邦制、權力分立）作為不履行條約的理由。這是條約必須遵守原則的延伸，也與國家責任條款第3條（國際不法行為依國際法認定，不受國內法影響）、第32條一致。唯一保留是第46條：締約權限的國內法規定，若違反「明顯」且涉及「具根本重要性」的國內法規則，國家才可援引為同意無效的理由——這處理的是「同意是否有效」，不是「已生效條約能否不履行」。[[case|lagrand|拉格朗案]]中，美國以國內的「程序失權」規則為由未能審查違反領事通知的判決，國際法院認定此規則的適用違反領事關係公約第36條。", "elements": [{"req": ["當事國援引其國內法規定"], "effect": "不得據以為不履行條約的理由（但第46條另有規定）"}], "traps": ["陷阱：不論國內法位階為何（憲法也一樣），都不能作為不履行條約的理由（gl113a_2選項B錯誤；gl114a_1選項C錯誤）。", "陷阱：條約在國內須否完成「內國法化」程序，是國內法問題；在國際上，國家不能以尚未完成國內程序為由暫不履行已生效的條約（gl115a_6選項C錯誤）。", "陷阱：第46條是唯一例外，且僅涉及締約權限的國內法規定，要件極嚴（明顯違反、具根本重要性）。"], "custom": {"status": "習慣法", "note": "國際常設法院在但澤波蘭國民待遇案（1932）等即已確立；亦見國家責任條款第3、32條。", "cases": []}, "related": ["vclt-26", "vclt-46"], "cases": [], "roc": "我國憲法第141條要求尊重條約；司法院釋字第329號將條約界定為須經立法院審議的國際書面協定。我國以施行法使兩公約等國際人權條約具國內法效力，但在國際上，國內是否已完成這些程序不影響國家履行條約的義務。", "essay": "不得以國內法為由不履行：「依條約法公約第27條，當事國不得援引其國內法規定為理由而不履行條約；權力分立、司法獨立或條約在國內僅具法律位階，均不能作為抗辯。國際法院在拉格朗案亦認定，美國不得以國內程序規則為由，免除違反領事關係公約的責任。」", "exam": [{"qid": "gl113a_2", "note": "選項B稱於國內管轄原則適用時得援引國內法為理由不履行條約，與第27條相反，錯誤（正解B）。"}, {"qid": "gl114a_1", "note": "選項C稱國家得以國內法律或立法程序疏漏為正當理由違反國際義務，錯誤（正解C），參照第27條。"}, {"qid": "gl115a_6", "note": "選項C稱條約生效後、完成內國法化程序前可暫時不履行，錯誤：依第27條不得以國內法為由不履行。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "28", "heading": "條約不溯既往", "tier": "B", "paras": [{"n": "", "en": "Unless a different intention appears from the treaty or is otherwise established, its provisions do not bind a party in relation to any act or fact which took place or any situation which ceased to exist before the date of the entry into force of the treaty with respect to that party.", "zh": "除條約表示不同意思，或另經確定外，關於條約對一當事國生效之日以前所發生之任何行為或事實或已不存在之任何情勢，條約之規定不對該當事國發生拘束力。"}], "keys": ["條約之規定不對該當事國發生拘束力"], "plain": "條約不溯既往：條約對一當事國生效前發生的行為、事實，或已不存在的情勢，條約不拘束該當事國——除非條約表示不同意思或另經確定。注意區分「持續性行為」：生效時仍在持續的狀態，生效後的部分即受條約拘束。本條是條約的不溯既往；第4條則是「本公約」本身的不溯既往。", "elements": [{"req": ["條約對當事國生效前發生的行為或事實，或已不存在的情勢", "條約未表示不同意思，亦未另經確定"], "effect": "條約規定不拘束該當事國"}], "traps": ["陷阱：條約可以明示溯及既往；本條只是推定規則。", "陷阱：生效時仍持續中的情勢，生效後的部分受條約拘束。"], "custom": {"status": "習慣法", "note": "不溯既往為一般原則，國家責任條款第13條亦同。", "cases": []}, "related": ["vclt-4", "vclt-24", "vclt-29"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl113a_2", "note": "選項C依第28條敘述正確。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3A批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

CASES.push({"id": "genocide-reservations", "nameZh": "殘害人群罪公約保留諮詢意見", "nameEn": "Reservations to the Convention on the Prevention and Punishment of the Crime of Genocide (Advisory Opinion)", "court": "國際法院", "year": "1951", "date": "1951-05-28", "kind": "諮詢意見", "parties": "聯合國大會1950年11月16日第478(V)號決議請求。", "facts": "《防止及懲治殘害人群罪公約》（1948）沒有保留條款。蘇聯集團等國批准時對公約第9條（爭端交付國際法院）等提出保留，部分國家反對。當時傳統規則是保留須經全體當事國同意（全體一致原則），聯合國秘書長作為保管機關無所適從，大會因而請求諮詢意見。", "issues": ["保留遭部分當事國反對、但其他當事國未反對時，保留國能否視為公約當事國？", "若可以，保留在保留國與反對國、接受國之間的效果如何？", "尚未批准的簽署國、或有權加入而未加入的國家，提出的反對有何效果？"], "holding": ["保留與公約「目的及宗旨」相容者，即使遭部分當事國反對，保留國仍可視為當事國；不相容者，不能視為當事國（7比5）。", "反對國若認為保留與目的及宗旨不相容，可以不視保留國為當事國；接受國則可視其為當事國。", "尚未批准的簽署國所提反對，在其批准前不生法律效果；有權簽署或加入而尚未為之的國家所提反對，不生法律效果。", "理由：殘害人群罪公約具人道與普遍性質，締約國沒有自身利益，只有共同利益；既希望普遍參加，也不能容許破壞公約目的的保留。"], "significance": "放棄全體一致原則，創設「目的及宗旨」標準，成為條約法公約第19條(丙)款與第20條第4項彈性體制的來源。法院同時指出公約所含原則為文明國家承認、即使無條約義務亦拘束各國——後來被視為殘害人群罪禁止具習慣法乃至強行法地位的重要依據。考點：①目的及宗旨標準；②反對保留的效果由各國自行判斷；③申論題es112d_2。", "articles": ["vclt-19", "vclt-20"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/12", "verified": "2026-10-07"});
CASES.push({"id": "qatar-bahrain", "nameZh": "卡達與巴林間海洋劃界與領土問題案（管轄權與可受理性）", "nameEn": "Maritime Delimitation and Territorial Questions between Qatar and Bahrain (Qatar v. Bahrain), Jurisdiction and Admissibility", "court": "國際法院", "year": "1994", "date": "1994-07-01", "kind": "判決", "parties": "卡達1991年7月8日單方起訴巴林；巴林爭執法院管轄權。", "facts": "兩國就哈瓦爾群島等領土與海域劃界有爭議，沙烏地阿拉伯居間斡旋。1987年雙方換函同意將爭端交付國際法院；1990年12月25日在多哈舉行的海灣合作理事會會議中，卡達、巴林、沙烏地三國外交部長簽署會議紀錄（《多哈紀錄》），重申先前承諾並約定提交法院的方式。卡達據以起訴；巴林主張多哈紀錄只是會議紀錄，其外交部長簽署時無意承擔法律義務，且依巴林憲法須經批准。", "issues": ["1987年換函與1990年多哈紀錄是否構成國際協定？", "簽署者主觀上無意受拘束，或未經國內批准程序，是否影響其效力？", "未依憲章第102條登記，是否影響其效力？"], "holding": ["1987年換函與1990年多哈紀錄都是為當事國創設權利義務的國際協定；判斷依據是文書的實際用語與締結的具體情況，而非名稱或形式（15比1，小田滋法官不同意）。", "巴林外交部長已簽署載有承諾的文件，事後不得主張其只是同意一份政治性的會議紀錄；簽署者的主觀意圖不能推翻文書的明確內容。", "未依聯合國憲章第102條登記，不影響協定的效力，只是不得在聯合國機關援引。", "法院給予當事國機會將整個爭端提交法院，1995年判決確認管轄權，2001年作成實體判決。"], "significance": "考點：①條約不以名稱為準，會議紀錄也可能是條約（條約法公約第2條第1項(甲)款）；②外交部長簽署的效力（第7條第2項(甲)款）；③未登記不影響效力（憲章第102條，gl115a_7）。", "articles": ["vclt-2"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/87", "verified": "2026-10-07"});
CASES.push({"id": "eastern-greenland", "nameZh": "東格陵蘭法律地位案（丹麥訴挪威）", "nameEn": "Legal Status of Eastern Greenland (Denmark v. Norway)", "court": "常設國際法院", "year": "1933", "date": "1933-04-05", "kind": "判決", "parties": "丹麥1931年7月12日起訴挪威。", "facts": "1919年7月22日，丹麥公使向挪威外交部長伊倫（Nils Ihlen）表示：丹麥不反對挪威對斯瓦巴群島的主張，希望挪威也不反對丹麥將主權擴及格陵蘭全境。伊倫口頭答覆，挪威政府在此問題的解決上「不會製造困難」，並作成會談紀錄。1931年挪威宣布占領東格陵蘭部分地區，丹麥起訴。", "issues": ["丹麥在1931年前是否已對格陵蘭全境取得主權？", "挪威外交部長伊倫的口頭答覆是否拘束挪威？"], "holding": ["丹麥長期且和平地對格陵蘭全境行使國家權力，在人煙稀少的偏遠地區，有限的實際行使已足以構成有效占領，丹麥已取得主權。", "伊倫外交部長就其職權範圍內的事項，代表政府答覆外國使節所作的聲明，拘束挪威。", "挪威1931年的占領宣告及相關措施違法無效（12比2）。"], "significance": "考點：①外交部長的口頭聲明可拘束國家（條約法公約第7條第2項(甲)款的實踐基礎；第3條：非書面協定亦有效力）；②偏遠地區有效占領的程度要求（與帕爾馬斯島案、克利柏頓島案並列）。本案也常被歸類為國家單方行為的拘束力。", "articles": ["vclt-3", "vclt-7", "vclt-31"], "exam": [], "srcUrl": "https://www.icj-cij.org/pcij-series-ab", "verified": "2026-10-07"});

ARTICLES.push({"treaty": "vclt", "no": "30", "heading": "關於同一事項先後所訂條約之適用", "tier": "A", "paras": [{"n": "1", "en": "Subject to Article 103 of the Charter of the United Nations, the rights and obligations of States parties to successive treaties relating to the same subject-matter shall be determined in accordance with the following paragraphs.", "zh": "以不違反聯合國憲章第一百零三條為限，就同一事項先後所訂條約當事國之權利與義務應依下列各項確定之。"}, {"n": "2", "en": "When a treaty specifies that it is subject to, or that it is not to be considered as incompatible with, an earlier or later treaty, the provisions of that other treaty prevail.", "zh": "遇條約訂明須不違反先訂或後訂條約或不得視為與先訂或後訂條約不合時，該先訂或後訂條約之規定應居優先。"}, {"n": "3", "en": "When all the parties to the earlier treaty are parties also to the later treaty but the earlier treaty is not terminated or suspended in operation under article 59, the earlier treaty applies only to the extent that its provisions are compatible with those of the later treaty.", "zh": "遇先訂條約全體當事國亦為後訂條約當事國但不依第五十九條終止或停止施行先訂條約時，先訂條約僅於其規定與後訂條約規定相合之範圍內適用之。"}, {"n": "4", "en": "When the parties to the later treaty do not include all the parties to the earlier one:\n(a) As between States parties to both treaties the same rule applies as in paragraph 3;\n(b) As between a State party to both treaties and a State party to only one of the treaties, the treaty to which both States are parties governs their mutual rights and obligations.", "zh": "遇後訂條約之當事國不包括先訂條約之全體當事國時：\n(甲)在同為兩條約之當事國間，適用第三項之同一規則；\n(乙)在為兩條約之當事國與僅為其中一條約之當事國間彼此之權利與義務依兩國均為當事國之條約定之。"}, {"n": "5", "en": "Paragraph 4 is without prejudice to article 41, or to any question of the termination or suspension of the operation of a treaty under article 60 or to any question tion of responsibility which may arise for a State from the conclusion or application of a treaty the provisions of which are incompatible with its obligations towards another State under another treaty.", "zh": "第四項不妨礙第四十一條，或依第六十條終止或停止施行條約之任何問題，或一國因締結或適用一條約而其規定與該國依另一條約對另一國之義務不合所生之任何責任問題。"}], "keys": ["以不違反聯合國憲章第一百零三條為限", "先訂條約僅於其規定與後訂條約規定相合之範圍內適用之", "依兩國均為當事國之條約定之"], "plain": "同一事項先後有兩個條約，誰優先？①最高層：聯合國憲章第103條——會員國憲章義務與其他國際協定義務衝突時，憲章優先；②條約自己訂有衝突條款者（「不得違反某條約」「不視為與某條約不合」），依其規定（第2項）；③兩條約的當事國完全相同時，後法優於前法：先訂條約只在與後訂條約相合的範圍內適用（第3項）；④當事國不完全相同時：同為兩條約當事國之間，後法優先；一國只參加其中一個條約時，兩國間依「雙方都參加的那個條約」決定（第4項）。第5項提醒：國家同時對不同國家負有互相衝突的條約義務時，不論本條如何處理優先順序，仍可能對另一方負國家責任。", "elements": [{"req": ["同一事項先後訂立的條約", "兩條約當事國完全相同"], "effect": "先訂條約僅於與後訂條約相合的範圍內適用（後法優先）"}, {"req": ["當事國不完全相同", "一國為兩條約當事國，另一國僅為其中一條約當事國"], "effect": "兩國間依雙方均為當事國的條約"}], "traps": ["陷阱：本條須受憲章第103條限制；憲章義務優先於任何其他條約義務。", "陷阱：後法優先只適用於兩條約「同為當事國」的國家之間；與只參加一個條約的國家，依雙方共同參加的條約。", "陷阱：本條處理適用順序，不免除國家因衝突義務對他國的責任（第5項）。"], "custom": {"status": "部分", "note": "後法優於前法、特別法優於普通法為一般法律原則；本條細節為條約規定。", "cases": []}, "related": ["unc-103", "vclt-41", "vclt-59", "vclt-60"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "待查", "text": "第5項末行原件字跡模糊，依可辨字形與英文作準本判讀，待以清晰影本覆核。"}]});
ARTICLES.push({"treaty": "vclt", "no": "31", "heading": "解釋之通則", "tier": "A", "paras": [{"n": "1", "en": "A treaty shall be interpreted in good faith in accordance with the ordinary meaning to be given to the terms of the treaty in their context and in the light of its object and purpose.", "zh": "條約應依其用語按其上下文並參照條約之目的及宗旨所具有之通常意義，善意解釋之。"}, {"n": "2", "en": "The context for the purpose of the interpretation of a treaty shall comprise, in addition to the text, including its preamble and annexes:\n(a) Any agreement relating to the treaty which was made between all the parties in connexion with the conclusion of the treaty;\n(b) Any instrument which was made by one or more parties in connexion with the conclusion of the treaty and accepted by the other parties as an instrument related to the treaty.", "zh": "就解釋條約而言，上下文除指連同弁言及附件在內之約文外，並應包括：\n(甲)全體當事國間因締結條約所訂與條約有關之任何協定；\n(乙)一個以上當事國因締結條約所訂並經其他當事國接受為條約有關文書之任何文書。"}, {"n": "3", "en": "There shall be taken into account, together with the context:\n(a) Any subsequent agreement between the parties regarding the interpretation of the treaty or the application of its provisions;\n(b) Any subsequent practice in the application of the treaty which establishes the agreement of the parties regarding its interpretation;\n(c) Any relevant rules of international law applicable in the relations between the parties.", "zh": "應與上下文一併考慮者尚有：\n(甲)當事國嗣後所訂關於條約之解釋或其規定之適用之任何協定；\n(乙)嗣後在條約適用方面確定各當事國對條約解釋之協定之任何慣例；\n(丙)適用於當事國間關係之任何有關國際法規則。"}, {"n": "4", "en": "A special meaning shall be given to a term if it is established that the parties so intended.", "zh": "倘經確定當事國有此原意，條約用語應使其具有特殊意義。"}], "keys": ["條約應依其用語按其上下文並參照條約之目的及宗旨所具有之通常意義，善意解釋之", "上下文除指連同弁言及附件在內之約文外", "全體當事國間因締結條約所訂與條約有關之任何協定", "當事國嗣後所訂關於條約之解釋或其規定之適用之任何協定", "嗣後在條約適用方面確定各當事國對條約解釋之協定之任何慣例", "適用於當事國間關係之任何有關國際法規則", "條約用語應使其具有特殊意義"], "plain": "條約解釋的「通則」，國際法院多次確認反映習慣法。第1項是核心公式：善意＋通常意義＋上下文＋目的及宗旨，四者並用、沒有先後階層（客觀解釋為主，兼顧目的解釋）。第2項界定「上下文」：約文本身（含{{弁言}}與附件），以及(甲)全體當事國因締約所訂的相關協定、(乙)一國以上所訂並經其他當事國接受為相關文書的文書（ ARTICLES.push({"treaty": "vclt", "no": "32", "heading": "解釋之補充資料", "tier": "A", "paras": [{"n": "", "en": "Recourse may be had to supplementary means of interpretation, including the preparatory work of the treaty and the circumstances of its conclusion, in order to confirm the meaning resulting from the application of article 31, or to determine the meaning when the interpretation according to article 31:\n(a) Leaves the meaning ambiguous or obscure; or\n(b) Leads to a result which is manifestly absurd or unreasonable.", "zh": "為證實由適用第三十一條所得之意義起見，或遇依第三十一條作解釋而：\n(甲)意義仍屬不明或難解；或\n(乙)所獲結果顯屬荒謬或不合理時，為確定其意義起見，得使用解釋之補充資料，包括條約之準備工作及締約之情況在內。"}], "keys": ["得使用解釋之補充資料，包括條約之準備工作及締約之情況在內", "意義仍屬不明或難解", "所獲結果顯屬荒謬或不合理時"], "plain": "補充資料主要是條約的{{準備工作}}（談判紀錄、草案、會議紀錄）與締約時的情況。使用時機有二：①「證實」依第31條所得的意義（可隨時使用）；②依第31條解釋後，意義仍不明或難解，或結果顯然荒謬、不合理時，用以「確定」意義。補充資料的地位低於第31條各要素，這是公約採客觀解釋、不採主觀（探求立法者原意）解釋的表現。", "elements": [{"req": ["為證實依第31條所得的意義"], "effect": "得使用補充資料"}, {"req": ["依第31條解釋後意義不明或難解，或結果顯屬荒謬或不合理"], "effect": "得使用補充資料以確定意義"}], "traps": ["陷阱：準備工作是「補充」資料，不是第31條的上下文。", "陷阱：補充資料可以用來「證實」第31條所得意義，不限於意義不明時才能使用。"], "custom": {"status": "習慣法", "note": "與第31條同被國際法院認定反映習慣法。", "cases": []}, "related": ["vclt-31", "vclt-33"], "cases": [], "roc": "", "essay": "補充資料：「準備工作及締約情況為解釋之補充資料，僅於證實依第31條所得之意義，或依第31條解釋後意義仍不明、難解或結果顯屬荒謬不合理時使用（第32條）。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "33", "heading": "以兩種以上文字認證之條約之解釋", "tier": "B", "paras": [{"n": "1", "en": "When a treaty has been authenticated in two or more languages, the text is equally authoritative in each language, unless the treaty provides or the parties agree that, in case of divergence, a particular text shall prevail.", "zh": "條約約文經以兩種以上文字認證作準者，除依條約之規定或當事國之協議遇意義分歧時應以某種約文為根據外，每種文字之約文應同一作準。"}, {"n": "2", "en": "A version of the treaty in a language other than one of those in which the text was authenticated shall be considered an authentic text only if the treaty so provides or the parties so agree.", "zh": "以認證作準文字以外之他種文字作成之條約譯本，僅於條約有此規定或當事國有此協議時，始得視為作準約文。"}, {"n": "3", "en": "The terms of the treaty are presumed to have the same meaning in each authentic text.", "zh": "條約用語推定在各作準約文內意義相同。"}, {"n": "4", "en": "Except where a particular text prevails in accordance with paragraph 1, when a comparison of the authentic texts discloses a difference of meaning which the application of articles 31 and 32 does not remove, the meaning which best reconciles the texts, having regard to the object and purpose of the treaty, shall be adopted.", "zh": "除依第一項應以某種約文為根據之情形外，倘比較作準約文後發現意義有差別而非適用第三十一條及第三十二條所能消除時，應採用顧及條約目的及宗旨之最能調和各約文之意義。"}], "keys": ["每種文字之約文應同一作準", "條約用語推定在各作準約文內意義相同", "應採用顧及條約目的及宗旨之最能調和各約文之意義"], "plain": "多語文條約的解釋：①各作準文字約文同一作準，除非條約另定某文本優先（第1項）；②非作準文字的譯本，原則上不是作準約文（第2項，例如我國對外協定的非作準中文譯本）；③推定各作準約文用語意義相同（第3項）；④比較後仍有差異，且無法以第31、32條消除時，採「最能調和各約文、並顧及條約目的及宗旨」的意義（第4項）。[[case|lagrand|拉格朗案]]中，國際法院依本條第4項，比較國際法院規約第41條英、法文本，並以規約的目的及宗旨認定臨時措施具拘束力。本公約自己也有中、英、法、俄、西五種作準文本（第85條）。", "elements": [{"req": ["條約以兩種以上文字認證作準"], "effect": "各文字約文同一作準，用語推定意義相同"}, {"req": ["作準約文意義有差別，且無法以第31、32條消除"], "effect": "採顧及目的及宗旨、最能調和各約文的意義"}], "traps": ["陷阱：非作準文字的譯本，只有在條約規定或當事國協議時才是作準約文。", "陷阱：多語文條約並非以締約時使用的語文或某一文本當然優先，除非條約另有規定。"], "custom": {"status": "習慣法", "note": "拉格朗案（2001）國際法院認定第33條第4項反映習慣法。", "cases": []}, "related": ["vclt-31", "vclt-32", "icj-41"], "cases": [], "roc": "《條約締結法》規定條約約 ARTICLES.push({"treaty": "vclt", "no": "42", "heading": "條約之效力及繼續有效", "tier": "B", "paras": [{"n": "1", "en": "The validity of a treaty or of the consent of a State to be bound by a treaty may be impeached only through the application of the present Convention.", "zh": "條約之效力或一國承受條約拘束之同意之效力僅經由本公約之適用始得加以非議。"}, {"n": "2", "en": "The termination of a treaty, its denunciation or the withdrawal of a party, may take place only as a result of the application of the provisions of the treaty or of the present Convention. The same rule applies to suspension of the operation of a treaty.", "zh": "終止條約，廢止條約，或一當事國退出條約，僅因該條約或本公約規定之適用結果始得為之。同一規則適用於條約之停止施行。"}], "keys": ["僅經由本公約之適用始得加以非議", "僅因該條約或本公約規定之適用結果始得為之"], "plain": "第五編的總閘門：條約或同意的效力，只能依本公約的規定加以質疑（第1項）；終止、廢止、退出或停止施行，只能依條約本身或本公約的規定為之（第2項）。目的在維護條約安定性：無效、終止的理由採「封閉清單」，國家不能自創理由。", "elements": [{"req": ["質疑條約或同意的效力；終止、退出或停止施行條約"], "effect": "僅得依本公約（或條約本身）的規定為之"}], "traps": ["陷阱：失效、終止與停止施行的理由限於公約與條約本身規定，國家不能任意主張其他理由（例如斷交本身不是終止理由，第63條）。"], "custom": {"status": "部分", "note": "反映條約安定性與條約必須遵守原則。", "cases": []}, "related": ["vclt-26", "vclt-43", "vclt-44", "vclt-45"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "43", "heading": "無須基於條約之國際法所加義務", "tier": "B", "paras": [{"n": "", "en": "The invalidity, termination or denunciation of a treaty, the withdrawal of a party from it, or the suspension of its operation, as a result of the application of the present Convention or of the provisions of the treaty, shall not in any way impair the duty of any State to fulfil any obligation embodied in the treaty to which it would be subject under international law independently of the treaty.", "zh": "條約因本公約或該條約規定適用結果而失效，終止或廢止，由當事國退出，或停止施行之情形，絕不損害任何國家依國際法而毋須基於條約所負履行該條約所載任何義務之責任。"}], "keys": ["絕不損害任何國家依國際法而毋須基於條約所負履行該條約所載任何義務之責任"], "plain": "條約失效、終止、廢止、退出或停止施行，都不影響國家依「條約以外」的國際法（主要是習慣法）所負、內容與條約相同的義務。與第38條一體兩面：條約義務消滅，習慣法義務仍在。", "elements": [{"req": ["條約失效、終止、廢止、退出或停止施行"], "effect": "不影響國家依條約以外的國際法所負相同內容的義務"}], "traps": ["陷阱：退出條約後，相同內容的習慣法義務仍然拘束該國（SG022）。"], "custom": {"status": "習慣法", "note": "條約與習慣法並存原則。", "cases": []}, "related": ["vclt-38", "vclt-42"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG022", "note": "丙國退出日內瓦公約，依第43條，不影響其依習慣國際法所負提供戰俘最低待遇的義務（正解B）。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "更正", "text": "原件「毋須基於條約」之「基」字形近「其」，依標題與上下文作「基」。"}]});
ARTICLES.push({"treaty": "vclt", "no": "44", "heading": "條約之規定可否分離", "tier": "B", "paras": [{"n": "1", "en": "A right of a party, provided for in a treaty or arising under article 56, to denounce, withdraw from or suspend the operation of the treaty may be exercised only with respect to the whole treaty unless the treaty otherwise provides or the parties otherwise agree.", "zh": "除條約另有規定或當事國另有協議外，條約內所規定或因第五十六條所生之當事國廢止、退出或停止施行條約之權利僅得對整個條約行使之。"}, {"n": "2", "en": "A ground for invalidating, terminating, withdrawing from or suspending the operation of a treaty recognized in the present Convention may be invoked only with respect to the whole treaty except as provided in the following paragraphs or in article 60.", "zh": "本公約所承認之條約失效、終止、退出或停止施行條約之理由僅得對整個條約援引之，但下列各項或第六十條所規定之情形不在此限。"}, {"n": "3", "en": "If the ground relates solely to particular clauses, it may be invoked only with respect to those clauses where:\n(a) The said clauses are separable from the remainder of the treaty with regard to their application;\n(b) It appears from the treaty or is otherwise established that acceptance of those clauses was not an essential basis of the consent of the other party or parties to be bound by the treaty as a whole; and\n(c) Continued performance of the remainder of the treaty would not be unjust.", "zh": "倘理由僅與特定條文有關，得於下列情形下僅對各該條文援引之：\n(甲)有關條文在適用上可與條約其餘部分分離；\n(乙)由條約可見或另經確定各該條文之接受並非另一當事國或其他當事國同意承受整個條約拘束之必要根據；及\n(丙)條約其餘部分之繼續實施不致有失公平。"}, {"n": "4", "en": "In cases falling under articles 49 and 50 the State entitled to invoke the fraud or corruption may do so with respect either to the whole treaty or, subject to paragraph 3, to the particular clauses alone.", "zh": "在第四十九條及第五十條所稱情形下，有權援引詐欺或賄賂理由之國家得對整個條約或以不違反第三項為限專對特定條文援引之。"}, {"n": "5", "en": "In cases falling under articles 51, 52 and 53, no separation of the provisions of the treaty is permitted.", "zh": "在第五十一條、第五十二條及第五十三條所稱之情形下，條約之規定一概不許分離。"}], "keys": ["僅得對整個條約行使之", "條約之規定一概不許分離"], "plain": "原則：退出、終止、停止施行或無效的理由，只能對「整個條約」主 ARTICLES.push({"treaty": "vclt", "no": "52", "heading": "以威脅或使用武力對一國施行強迫", "tier": "A", "paras": [{"n": "", "en": "A treaty is void if its conclusion has been procured by the threat or use of force in violation of the principles of international law embodied in the Charter of the United Nations.", "zh": "條約係違反聯合國憲章所含國際法原則以威脅或使用武力而獲締結者無效。"}], "keys": ["以威脅或使用武力而獲締結者無效"], "plain": "違反聯合國憲章所含國際法原則（即憲章第2條第4項禁止武力威脅或使用），以威脅或使用武力締結的條約無效（絕對無效）。這是對傳統「和平條約有效論」的根本轉變：二十世紀以前，戰敗國被迫簽署的和約仍屬有效。爭議：本條所稱「武力」是否包括政治或經濟壓迫？會議否決將其納入，只另通過一項宣言譴責以軍事、政治或經濟壓迫締約。另一問題：時際法——本條不溯及憲章或非戰公約前的條約。", "elements": [{"req": ["違反聯合國憲章所含國際法原則", "以威脅或使用武力而獲締結"], "effect": "條約無效（絕對無效，不許分離）"}], "traps": ["陷阱：本條的「武力」指武裝力量；政治、經濟壓迫未被納入條文，只有會議通過的宣言。", "陷阱：強迫國家締結的條約整體無效，不能只刪除部分條文（第44條第5項），也不能因默認而補正。"], "custom": {"status": "習慣法", "note": "國際法院在漁業管轄權案（管轄權，1973）指出，以威脅或使用武力締結的條約依現代國際法無效，幾乎無疑問。", "cases": []}, "related": ["unc-2", "vclt-51", "vclt-53", "vclt-44"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "更正", "text": "原件「強迫」作異體「强」，統一作「強」。"}]});
ARTICLES.push({"treaty": "vclt", "no": "53", "heading": "與一般國際法強制規律（絕對法）牴觸之條約", "tier": "A", "paras": [{"n": "", "en": "A treaty is void if, at the time of its conclusion, it conflicts with a peremptory norm of general international law. For the purposes of the present Convention, a peremptory norm of general international law is a norm accepted and recognized by the international community of States as a whole as a norm from which no derogation is permitted and which can be modified only by a subsequent norm of general international law having the same character.", "zh": "條約在締結時與一般國際法強制規律牴觸者無效。就適用本公約而言，一般國際法強制規律指國家之國際社會全體接受並公認為不許損抑且僅有以後具有同等性質之一般國際法規律始得更改之規律。"}], "keys": ["條約在締結時與一般國際法強制規律牴觸者無效", "國家之國際社會全體接受並公認為不許損抑且僅有以後具有同等性質之一般國際法規律始得更改之規律"], "plain": "{{強行法}}（jus cogens，作準中文本譯為「一般國際法強制規律（絕對法）」）。條約在締結時牴觸強行法者無效。強行法的四要素：①一般國際法的規範；②「國家之國際社會全體」接受並公認——不需每一國家同意，但須絕大多數國家且跨越各主要法系；③不許損抑（不得以條約或習慣排除）；④只能由之後同等性質的規範更改。效果：條約自始、整體無效（第44條第5項不許分離），不能因默認補正；爭端可提交國際法院（第66條(甲)款）；後果見第71條。締約「後」才出現的新強行法，則依第64條使牴觸的條約「終止」（向將來無效）。公約沒有列舉內容；國際法委員會2022年《一般國際法強制性規範結論》非窮盡清單：禁止侵略、滅絕種族、危害人類罪、國際人道法基本規則、種族歧視與種族隔離、奴隸、酷刑，以及自決權。詳見[[concept|jus-cogens|強行法概念卡]]。", "elements": [{"req": ["條約在締結時與一般國際法強制規律牴觸"], "effect": "條約無效（自始、整體無效）"}, {"req": ["規範為一般國際法", "經國家之國際社會全體接受並公認為不許損抑", "僅能由以後同等性質的規範更改"], "effect": "構成強行法"}], "traps": ["陷阱：「國家之國際社會全體」接受並公認，不需要每一個國家都同意。", "陷阱：第53條處理締約時已存在的強行法（條約無效）；第64條處理新產生的強行法（條約終止）。", "陷阱：強行法的效果是條約整體無效，不能分離（第44條第5項），也不適用第45條的默認。", "陷阱：以武力兼併他國領土為目的的協議因牴觸強行法而無效（SG042選項C）。"], "custom": {"status": "習慣法", "note": "國際法院在剛果境內武裝活動案（剛果訴盧安達，2006）首次明確承認強行法，並認定禁止滅絕種族屬之。", "cases": []}, "related": ["vclt-64", "vclt-44", "vclt-52", "vclt-66", "vclt-71"], "cases": [], "roc": "", "essay": "強行法：「依條約法公約第53條，一般國際法強制規律（強行法）指國家之國際社會全體接受並公認為不許損抑，且僅有以後具同等性質之一般國際法規律始得更改之規律；條約在締結時與之牴觸者無效。國際法院在剛果訴盧安達案（2006）承認禁止滅絕種族屬強行法。」", "exam": [{"qid": "SG042", "note": "選項C甲、乙兩國協議以武力兼併丙國領土，牴觸禁止侵略的強行法（第53條），亦違反憲章第2條第4項，無效。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3B批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "更正", "text": "原件「強制規律」作異體「强」，統一作「強」。"}]});
CASES.push({"id": "cameroon-nigeria", "nameZh": "喀麥隆與奈及利亞間陸地與海洋疆界案", "nameEn": "Land and Maritime Boundary between Cameroon and Nigeria (Cameroon v. Nigeria: Equatorial Guinea intervening)", "court": "國際法院", "year": "2002", "date": "2002-10-10", "kind": "判決", "parties": "喀麥隆1994年3月29日起訴奈及利亞；赤道幾內亞獲准參加訴訟（非當事國參加）。", "facts": "兩國就查德湖地區、陸地邊界及巴卡西半島主權與海域劃界有爭議。喀麥隆援引1913年英德協定（巴卡西屬德屬喀麥隆）及1975年6月1日兩國元首簽署的《馬魯阿宣言》（劃定部分海上邊界）。奈及利亞主張馬魯阿宣言未經其最高軍事委員會依憲法批准，元首無權單獨使國家受拘束，而且喀麥隆應知悉此限制。", "issues": ["1913年英德協定是否使巴卡西半島主權歸屬喀麥隆？", "未經奈及利亞國內批准程序的《馬魯阿宣言》是否拘束奈及利亞？", "奈及利亞能否依條約法公約第46條主張違反國內法關於締約權限的規定？"], "holding": ["巴卡西半島主權屬於喀麥隆（13比3），依1913年英德協定的邊界。", "馬魯阿宣言是有拘束力的國際協定：國家元首依條約法公約第7條第2項被視為代表國家；國家元首簽署權力的國內限制，除非已適當公布，不構成第46條所稱「顯明」的違反。", "國家沒有法律義務隨時了解其他國家立法與憲法的發展；奈及利亞元首並未表示需經國內批准，奈及利亞不能援引第46條。", "海上邊界依馬魯阿宣言等協議劃定的部分予以確認，其外依等距離／相關情況方法劃界（13比3）。"], "significance": "考點：①國家元首依第7條第2項(甲)款，無須全權證書即代表國家締約；②第46條「顯明」違反的客觀標準，國家無義務隨時掌握他國憲法限制；③條約不以批准為必要，簽署即可生效（第12條）。判決後兩國2006年簽署格林崔協定，奈及利亞於2008年完成移交巴卡西。", "articles": ["vclt-46"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/94", "verified": "2026-10-07"});
CASES.push({"id": "preah-vihear", "nameZh": "柏威夏寺案（柬埔寨訴泰國）", "nameEn": "Temple of Preah Vihear (Cambodia v. Thailand), Merits", "court": "國際法院", "year": "1962", "date": "1962-06-15", "kind": "判決", "parties": "柬埔寨1959年10月6日起訴泰國。", "facts": "1904年法國（代表柬埔寨）與暹羅（泰國）條約約定，邊界沿分水嶺劃定，由混合委員會勘定。1907年法國官員繪製的附件一地圖把柏威夏寺劃在柬埔寨一側，但依實地分水嶺，寺廟可能在泰國一側。暹羅收到並向法方索取更多份地圖，此後數十年沒有提出異議；1930年暹羅親王丹龍訪問寺廟時，受到法國官員以殖民當局身分接待。泰國主張地圖有錯誤，不應受其拘束。", "issues": ["暹羅（泰國）是否已接受附件一地圖及其邊界線？", "泰國能否以地圖有錯誤為由，主張不受拘束？"], "holding": ["暹羅接受了附件一地圖：收到地圖後長期未提異議、使用並分送地圖，在應表示反對的情況下保持沉默，應視為同意（默認）。", "錯誤抗辯不成立：一方若以自身行為助成錯誤、能夠避免錯誤，或情況足以使其察覺可能有錯誤，即不得以錯誤為由主張同意有瑕疵；暹羅有專業人員可察覺問題。", "柏威夏寺位於柬埔寨主權領土內（9比3）；泰國應撤出駐軍，並歸還自寺廟移走的文物（7比5）。", "2013年11月11日解釋判決（全體一致）：柏威夏寺所在的整個海角屬柬埔寨。"], "significance": "考點：①錯誤的限制——自身行為助成或應可察覺者不得援引（條約法公約第48條第2項的來源）；②默認與禁反言（第45條）；③地圖作為條約附件時的效力。", "articles": ["vclt-45", "vclt-48"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/45", "verified": "2026-10-07"});
CONCEPTS.push({"id": "jus-cogens", "title": "強行法（一般國際法強制規律）", "definition": "強行法（jus cogens）指國家之國際社會全體接受並公認為不許損抑，且僅有以後具同等性質之一般國際法規範始得更改的規範（條約法公約第53條）。作準中文本譯為「一般國際法強制規律（絕對法）」。強行法處理的是規範的「位階」：任何條約或習慣都不能排除它。", "points": ["識別標準：①一般國際法的規範（通常是習慣法）；②國家之國際社會「全體」接受並公認為不許損抑——不需每一國家同意，但須絕大多數且跨越地區與法系；③只能由以後同等性質的規範更改。國際法委員會2022年《一般國際法強制性規範（強行法）的識別和法律後果結論》採此標準。", "例示（國際法委員會2022年結論附件，非窮盡）：禁止侵略、禁止滅絕種族、禁止危害人類罪、國際人道法基本規則、禁止種族歧視與種族隔離、禁止奴隸制、禁止酷刑、自決權。", "條約法上的效果：①締約時牴觸者自始無效（[[art|vclt-53|第53條]]）；②新強行法產生後，牴觸的現行條約終止（第64條，向將來無效）；③整個條約無效，不許分離（[[art|vclt-44|第44條]]第5項）；④不因默認補正（[[art|vclt-45|第45條]]不適用）；⑤爭端可依第66條(甲)款提交國際法院；⑥後果見第71條。", "與對世義務的關係：強行法談「位階」（不許損抑），{{對世義務}}談「對誰負有義務」（對國際社會全體）。強行法所生義務都具對世性質，但對世義務不一定是強行法。", "國家責任上的效果：違反強行法之嚴重違反，各國應合作以合法手段制止、不承認其造成的情勢為合法、不提供援助（國家責任條款第40、41條）；危急情況等阻卻違法事由不能用以正當化違反強行法的行為（第26條）。", "國際法院實踐：剛果境內武裝活動案（剛果訴盧安達，2006）首次明確承認強行法並認定禁止滅絕種族屬之，但強行法不當然創設法院管轄權；比利時訴塞內加爾案（2012）認定禁止酷刑屬強行法；[[case|chagos|查哥斯諮詢意見]]（2019）以自決權為對世義務。", "與國家豁免：國家管轄豁免案（德國訴義大利，2012）認為豁免是程序規則、強行法是實體規則，兩者不衝突；即使行為違反強行法，國家仍可在他國法院主張豁免（申論題es115d_4）。", "陷阱：強行法不是「強制執行的法」；也不等於習慣法——大部分習慣法可以條約排除，只有強行法不行。"], "cases": ["chagos"], "articles": ["vclt-53", "vclt-44", "vclt-45"], "exam": ["SG042"], "verified": "2026-10-07"});
GLOSSARY["弁言"] = {"en": "preamble", "tw": "弁言、序言（前言）", "cn": "序言", "def": "條約正文前說明締約目的與背景的部分；屬於解釋條約時「上下文」的一部分（條約法公約第31條第2項），常用來探求條約的目的及宗旨。"};

ARTICLES.push({"treaty": "vclt", "no": "60", "heading": "條約因違約而終止或停止施行", "tier": "A", "paras": [{"n": "1", "en": "A material breach of a bilateral treaty by one of the parties entitles the other to invoke the breach as a ground for terminating the treaty or suspending its operation in whole or in part.", "zh": "雙邊條約當事國一方有重大違約情事時，他方有權援引違約為理由終止該條約，或全部或局部停止其施行。"}, {"n": "2", "en": "A material breach of a multilateral treaty by one of the parties entitles:\n(a) The other parties by unanimous agreement to suspend the operation of the treaty in whole or in part or to terminate it either:\n(i) In the relations between themselves and the defaulting State, or\n(ii) As between all the parties;\n(b) A party specially affected by the breach to invoke it as a ground for suspending the operation of the treaty in whole or in part in the relations between itself and the defaulting State;\n(c) Any party other than the defaulting State to invoke the breach as a ground for suspending the operation of the treaty in whole or in part with respect to itself if the treaty is of such a character that a material breach of its provisions by one party radically changes the position of every party with respect to the further performance of its obligations under the treaty.", "zh": "多邊條約當事國之一有重大違約情事時：\n(甲)其他當事國有權以一致協議：\n(一)在各該國與違約國之關係上，或\n(二)在全體當事國之間，\n將條約全部或局部停止施行或終止該條約；\n(乙)特別受違約影響之當事國有權援引違約為理由在其本國與違約國之關係上將條約全部或局部停止施行；\n(丙)如由於條約性質關係，遇一當事國對其規定有重大違反情事，致每一當事國繼續履行條約義務所處之地位因而根本改變，則違約國以外之任何當事國皆有權援引違約為理由將條約對其本國全部或局部停止施行。"}, {"n": "3", "en": "A material breach of a treaty, for the purposes of this article, consists in:\n(a) A repudiation of the treaty not sanctioned by the present Convention; or\n(b) The violation of a provision essential to the accomplishment of the object or purpose of the treaty.", "zh": "就適用本條而言，重大違約係指：\n(甲)廢棄條約，而此種廢棄非本公約所准許者；或\n(乙)違反條約規定，而此項規定為達成條約目的或宗旨所必要者。"}, {"n": "4", "en": "The foregoing paragraphs are without prejudice to any provision in the treaty applicable in the event ARTICLES.push({"treaty": "vclt", "no": "61", "heading": "發生意外不可能履行", "tier": "A", "paras": [{"n": "1", "en": "A party may invoke the impossibility of performing a treaty as a ground for terminating or withdrawing from it if the impossibility results from the permanent disappearance or destruction of an object indispensable for the execution of the treaty. If the impossibility is temporary, it may be invoked only as a ground for suspending the operation of the treaty.", "zh": "倘因實施條約所必不可少之標的物永久消失或毀壞以致不可能履行條約時，當事國得援引不可能履行為理由終止或退出條約。如不可能履行係屬暫時性質，僅得援引為停止施行條約之理由。"}, {"n": "2", "en": "Impossibility of performance may not be invoked by a party as a ground for terminating, withdrawing from or suspending the operation of a treaty if the impossibility is the result of a breach by that party either of an obligation under the treaty or of any other international obligation owed to any other party to the treaty.", "zh": "倘條約不可能履行係一當事國違反條約義務或違反對條約任何其他當事國所負任何其他國際義務之結果，該當事國不得援引不可能履行為理由終止、退出或停止施行條約。"}], "keys": ["實施條約所必不可少之標的物永久消失或毀壞", "如不可能履行係屬暫時性質，僅得援引為停止施行條約之理由", "該當事國不得援引不可能履行為理由"], "plain": "履行不能：實施條約所必不可少的「標的物」永久消失或毀壞（例如作為條約標的的島嶼沉沒、河流乾涸、水壩毀損），當事國得援引為終止或退出的理由；若只是暫時不能，只能停止施行（第1項）。自己違反條約或其他國際義務所造成的不能，不得援引（第2項）。注意門檻：國際法院在[[case|gabcikovo|加布契科沃—大毛羅斯案]]中認為，條約所規定的聯合投資體制雖已不存在，但條約本身就有調整機制，不構成標的物永久消失；財政困難也不是履行不能。", "elements": [{"req": ["實施條約所必不可少的標的物永久消失或毀壞", "非由援引國違反條約或其他國際義務所造成"], "effect": "得援引為終止或退出的理由（暫時不能則只能停止施行）"}], "traps": ["陷阱：履行不能可以作為終止理由（gl110a_2選項C稱不得，錯誤）。", "陷阱：暫時的不能只能「停止施行」，不能終止。", "陷阱：財政困難、經濟負擔加重不屬於履行不能（加布契科沃案）。"], "custom": {"status": "習慣法", "note": "加布契科沃—大毛羅斯案（1997）視為反映習慣法。", "cases": []}, "related": ["vclt-62", "vclt-72", "vclt-45"], "cases": [{"id": "gabcikovo", "point": "匈牙利主張條約標的（聯合投資的水利系統）消失，法院認為條約本身含有調整機制，不構成標的物永久消失。"}], "roc": "", "essay": "", "exam": [{"qid": "gl110a_2", "note": "選項C稱不得以標的物永久消失或毀壞致履行不能為由終止條約，與第61條相反，錯誤。"}], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐 ARTICLES.push({"treaty": "vclt", "no": "62", "heading": "情況之基本改變", "tier": "A", "paras": [{"n": "1", "en": "A fundamental change of circumstances which has occurred with regard to those existing at the time of the conclusion of a treaty, and which was not foreseen by the parties, may not be invoked as a ground for terminating or withdrawing from the treaty unless:\n(a) The existence of those circumstances constituted an essential basis of the consent of the parties to be bound by the treaty; and\n(b) The effect of the change is radically to transform the extent of obligations still to be performed under the treaty.", "zh": "條約締結時存在之情況發生基本改變而非當事國所預料者，不得援引為終止或退出條約之理由，除非：\n(甲)此等情況之存在構成當事國同意承受條約拘束之必要根據；及\n(乙)該項改變之影響將根本變動依條約尚待履行之義務之範圍。"}, {"n": "2", "en": "A fundamental change of circumstances may not be invoked as a ground for terminating or withdrawing from a treaty:\n(a) If the treaty establishes a boundary; or\n(b) If the fundamental change is the result of a breach by the party invoking it either of an obligation under the treaty or of any other international obligation owed to any other party to the treaty.", "zh": "情況之基本改變不得援引為終止或退出條約之理由：\n(甲)倘該條約確定一邊界；或\n(乙)倘情況之基本改變係援引此項理由之當事國違反條約義務或違反對條約任何其他當事國所負任何其他國際義務之結果。"}, {"n": "3", "en": "If, under the foregoing paragraphs, a party may invoke a fundamental change of circumstances as a ground for terminating or withdrawing from a treaty it may also invoke the change as a ground for suspending the operation of the treaty.", "zh": "倘根據以上各項，一當事國得援引情況之基本改變為終止或退出條約之理由，該國亦得援引該項改變為停止施行條約之理由。"}], "keys": ["不得援引為終止或退出條約之理由", "此等情況之存在構成當事國同意承受條約拘束之必要根據", "該項改變之影響將根本變動依條約尚待履行之義務之範圍", "倘該條約確定一邊界", "亦得援引該項改變為停止施行條約之理由"], "plain": "情事變更（rebus sic stantibus，作準中文本稱「情況之基本改變」）。條文用「不得援引……除非」的否定句式，表示這是嚴格的例外。要件（第1項，須同時具備）：①締約時存在的情況發生「基本」改變；②非當事國所預料；③該情況的存在是當事國同意的「必要根據」；④改變的影響將「根本變動」尚待履行義務的範圍。排除（第2項）：(甲)劃定邊界的條約——維護邊界安定；(乙)改變是援引國自己違約所造成。效果：可終止、退出，或只停止施行（第3項）。實踐：國際法院至今從未接受此主張——[[case|fisheries-jurisdiction|冰島漁業管轄權案]]（1973）認為捕魚技術進步不構成根本變動；[[case|g ARTICLES.push({"treaty": "vclt", "no": "64", "heading": "一般國際法新強制規律（絕對法）之產生", "tier": "A", "paras": [{"n": "", "en": "If a new peremptory norm of general international law emerges, any existing treaty which is in conflict with that norm becomes void and terminates.", "zh": "遇有新一般國際法強制規律產生時，任何現有條約之與該項規律牴觸者即成為無效而終止。"}], "keys": ["任何現有條約之與該項規律牴觸者即成為無效而終止"], "plain": "新強行法產生時，現有條約中與之牴觸者「成為無效而終止」。與第53條的差別：第53條是締約時已存在的強行法，條約自始無效；本條是締約後才出現的強行法，條約自新規範出現時起向將來終止，終止前因實施條約已產生的權利義務原則上不受影響（第71條第2項）。爭端可依第66條(甲)款提交國際法院。見[[concept|jus-cogens|強行法概念卡]]。", "elements": [{"req": ["新一般國際法強制規律產生", "現有條約與之牴觸"], "effect": "該條約成為無效而終止（向將來）"}], "traps": ["陷阱：第53條是自始無效；第64條是新強行法出現後「終止」，效果向將來（第71條第2項）。", "陷阱：本條同樣不許分離（第44條第5項）。"], "custom": {"status": "習慣法", "note": "與第53條一體適用。", "cases": []}, "related": ["vclt-53", "vclt-44", "vclt-66", "vclt-71"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}, {"date": "2026-10-07", "type": "更正", "text": "原件「強制規律」作異體「强」，統一作「強」。"}]});
ARTICLES.push({"treaty": "vclt", "no": "65", "heading": "關於條約失效、終止、退出條約或停止施行條約應依循之程序", "tier": "B", "paras": [{"n": "1", "en": "A party which, under the provisions of the present Convention, invokes either a defect in its consent to be bound by a treaty or a ground for impeaching the validity of a treaty, terminating it, withdrawing from it or suspending its operation, must notify the other parties of its claim. The notification shall indicate the measure proposed to be taken with respect to the treaty and the reasons therefor.", "zh": "當事國依照本公約之規定援引其承受條約拘束之同意有誤為理由，或援引非難條約效力、終止、退出或停止施行條約之理由者，必須將其主張通知其他當事國。此項通知應載明對條約所提議採取之措施及其理由。"}, {"n": "2", "en": "If, after the expiry of a period which, except in cases of special urgency, shall not be less than three months after the receipt of the notification, no party has raised any objection, the party making the notification may carry out in the manner provided in article 67 the measure which it has proposed.", "zh": "在一非遇特別緊急情形不得短於自收到通知時起算三個月之期間屆滿後，倘無當事國表示反對，則發出通知之當事國得依第六十七條規定之方式，實施其所提議之措施。"}, {"n": "3", "en": "If, however, objection has been raised by any other party, the parties shall seek a solution through the means indicated in Article 33 of the Charter of the United Nations.", "zh": "但如有任何其他當事國表示反對，當事國應藉聯合國憲章第三十三條所指示之方法以謀解決。"}, {"n": "4", "en": "Nothing in the foregoing paragraphs shall affect the rights or obligations of the parties under any provisions in force binding the parties with regard to the settlement of disputes.", "zh": "上列各項絕不影響當事國在對其有拘束力之任何關於解決爭端之現行規定下所具有之權利或義務。"}, {"n": "5", "en": "Without prejudice to article 45, the fact that a State has not previously made the notification prescribed in paragraph 1 shall not prevent it from making such notification in answer to another party claiming performance of the treaty or alleging its violation.", "zh": "以不妨礙第四十五條為限，一國未於事前發出第一項所規定之通知之事實並不阻止該國為答覆另一當事國要求其履行條約或指稱其違反條約而發出此種通知。"}], "keys": ["必須將其主張通知其他當事國", "不得短於自收到通知時起算三個月之期間屆滿後", "當事國應藉聯合國憲章第三十三條所指示之方法以謀解決"], "pl ARTICLES.push({"treaty": "vclt", "no": "66", "heading": "司法解決、公斷及和解之程序", "tier": "B", "paras": [{"n": "", "en": "If, under paragraph 3 of article 65, no solution has been reached within a period of twelve months following the date on which the objection was raised, the following procedures shall be followed:\n(a) Any one of the parties to a dispute concerning the application or the interpretation of article 53 or 64 may, by a written application, submit it to the International Court of Justice for a decision unless the parties by common consent agree to submit the dispute to arbitration;\n(b) Any one of the parties to a dispute concerning the application or the interpretation of any of the other articles in Part V of the present Convention may set in motion the procedure specified in the Annex to the Convention by submitting a request to that effect to the Secretary-General of the United Nations.", "zh": "倘在提出反對之日後十二個月內未能依第六十五條第三項獲致解決，應依循下列程序：\n(甲)關於第五十三條或第六十四條之適用或解釋之爭端之任一當事國得以請求書將爭端提請國際法院裁決之，但各當事國同意將爭端提交公斷者不在此限；\n(乙)關於本公約第五編任一其他條文之適用或解釋之爭端之任一當事國得向聯合國秘書長提出請求，發動本公約附件所定之程序。"}], "keys": ["得以請求書將爭端提請國際法院裁決之", "發動本公約附件所定之程序"], "plain": "第65條提出反對後12個月內未解決時：(甲)涉及強行法（第53、64條）的爭端，任一方可單方以請求書提交國際法院，除非雙方同意交付仲裁——這是公約對強行法爭端設計的強制司法解決；(乙)第五編其他條文的爭端，任一方可請求聯合國秘書長啟動附件的「和解」程序（和解委員會的報告無拘束力）。許多國家對本條提出保留。", "elements": [{"req": ["反對後12個月內未獲解決", "涉及第53或64條"], "effect": "任一方得以請求書提交國際法院（除非同意仲裁）"}, {"req": ["反對後12個月內未獲解決", "涉及第五編其他條文"], "effect": "任一方得請求聯合國秘書長啟動附件的和解程序"}], "traps": ["陷阱：只有強行法爭端可單方提交國際法院；其他第五編爭端僅能啟動和解程序。"], "custom": {"status": "不適用", "note": "條約規定；許多國家對本條提出保留。", "cases": []}, "related": ["vclt-65", "vclt-53", "vclt-64"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "69", "heading": "條約失效之後果", "tier": "A", "paras": [{"n": "1", "en": "A treaty the invalidity of which is established under the present Convention is void. The provisions of a void treaty have no legal force.", "zh": "條約依本公約確定失效者無效。條約無效者，其規定無法律效力。"}, {"n": "2", "en": "If acts have nevertheless been performed in reliance on such a treaty:\n(a) Each party may require any other party to establish as far as possible in their mutual relations the position that would have existed if the acts had not been performed;\n(b) Acts performed in good faith before the invalidity was invoked are not rendered unlawful by reason only of the invalidity of the treaty.", "zh": "但如已有信賴此種條約而實施之行為，則：\n(甲)每一當事國得要求任何其他當事國在彼此關係上儘可能恢復未實施此項行為前原應存在之狀況；\n(乙)在援引條約失效之理由前以善意實施之行為並不僅因條約失效而成為不合法。"}, {"n": "3", "en": "In cases falling under articles 49, 50, 51 or 52, paragraph 2 does not apply with respect to the party to which the fraud, the act of corruption or the coercion is imputable.", "zh": "遇第四十九條、第五十條、第五十一條或第五十二條所稱之情形，第二項之規定對應就詐欺、賄賂行為或強迫負責之當事國不適用之。"}, {"n": "4", "en": "In the case of the invalidity of a particular State's consent to be bound by a multilateral treaty, the foregoing rules apply in the relations between that State and the parties to the treaty,", "zh": "遇某一國家承受多邊條約拘束之同意成為無效之情形，上列各項規則在該國與條約當事國之關係上適用之。"}], "keys": ["條約無效者，其規定無法律效力", "儘可能恢復未實施此項行為前原應存在之狀況", "以善意實施之行為並不僅因條約失效而成為不合法"], "plain": "條約無效的後果：無效條約的規定「沒有法律效力」（第1項）。但已有信賴條約而實施的行為時：(甲)各當事國可要求他方在彼此關係上儘可能回復原狀；(乙)援引無效理由前善意實施的行為，不因條約無效而變成不法（第2項）。詐欺、賄賂、強迫的責任國，不得享有第2項的保護（第3項）。多邊條約中只有某國的同意無效時，上述規則只在該國與其他當事國間適用（第4項）。", "elements": [{"req": ["條約依本公約確定失效"], "effect": "規定無法律效力；已實施的行為得要求回復原狀，善意行為不因此成為不法"}], "traps": ["陷阱：對詐欺、賄賂或強迫負責的國家，不得主張善意行為的保護（第3項）。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["vclt-71", "vclt-70", "vclt-49", "vclt-50", "vclt-51", "vclt-52"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2 ARTICLES.push({"treaty": "vclt", "no": "70", "heading": "條約終止之後果", "tier": "A", "paras": [{"n": "1", "en": "Unless the treaty otherwise provides or the parties otherwise agree, the termination of a treaty under its provisions or in accordance with the present Convention:\n(a) Releases the parties from any obligation further to perform the treaty;\n(b) Does not affect any right, obligation or legal situation of the parties created through the execution of the treaty prior to its termination.", "zh": "除條約另有規定或當事國另有協議外，條約依其規定或依照本公約終止時：\n(甲)解除當事國繼續履行條約之義務；\n(乙)不影響當事國在條約終止前經由實施條約而產生之任何權利、義務或法律情勢。"}, {"n": "2", "en": "If a State denounces or withdraws from a multilateral treaty, paragraph 1 applies in the relations between that State and each of the other parties to the treaty from the date when such denunciation or withdrawal takes effect.", "zh": "倘一國廢止或退出多邊條約，自廢止或退出生效之日起，在該國與條約每一其他當事國之關係上適用第一項之規定。"}], "keys": ["解除當事國繼續履行條約之義務", "不影響當事國在條約終止前經由實施條約而產生之任何權利、義務或法律情勢"], "plain": "條約終止的後果：(甲)解除繼續履行的義務——向將來生效；(乙)不影響終止前因實施條約已產生的權利、義務或法律情勢（例如已劃定的邊界、已移轉的領土、已發生的賠償請求權）。多邊條約中某國退出時，只在該國與其他當事國之間適用（第2項）。對照第72條：停止施行時，條約法律關係仍然存在。", "elements": [{"req": ["條約依其規定或依本公約終止"], "effect": "解除繼續履行的義務，但不影響終止前已產生的權利、義務或法律情勢"}], "traps": ["陷阱：終止只向將來生效，不溯及影響已產生的權利義務與法律情勢（例如依條約劃定的邊界不因條約終止而消失）。"], "custom": {"status": "習慣法", "note": "一般認為反映習慣法。", "cases": []}, "related": ["vclt-72", "vclt-69", "vclt-54"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

ARTICLES.push({"treaty": "vclt", "no": "72", "heading": "條約停止施行之後果", "tier": "B", "paras": [{"n": "1", "en": "Unless the treaty otherwise provides or the parties otherwise agree, the suspension of the operation of a treaty under its provisions or in accordance with the present Convention:\n(a) Releases the parties between which the operation of the treaty is suspended from the obligation to perform the treaty in their mutual relations during the period of the suspension;\n(b) Does not otherwise affect the legal relations between the parties established by the treaty.", "zh": "除條約另有規定或當事國另有協議外，條約依其本身規定或依照本公約停止施行時：\n(甲)解除停止施行條約之當事國於停止施行期間在彼此關係上履行條約之義務；\n(乙)除此以外，並不影響條約所確定當事國間之法律關係。"}, {"n": "2", "en": "During the period of the suspension the parties shall refrain from acts tending to obstruct the resumption of the operation of the treaty.", "zh": "在停止施行期間，當事國應避免足以阻撓條約恢復施行之行為。"}], "keys": ["解除停止施行條約之當事國於停止施行期間在彼此關係上履行條約之義務", "當事國應避免足以阻撓條約恢復施行之行為"], "plain": "停止施行的後果：只免除停止期間在彼此關係上的履行義務，其他條約法律關係不受影響（第1項）。停止期間，當事國不得作出阻撓條約恢復施行的行為（第2項）——是善意原則的延伸，類似第18條。", "elements": [{"req": ["條約停止施行"], "effect": "免除停止期間的履行義務，但法律關係仍存在；當事國應避免阻撓條約恢復施行"}], "traps": ["陷阱：停止施行與終止不同：條約關係仍在，且停止期間不得阻撓恢復施行。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["vclt-57", "vclt-70", "vclt-18"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});
ARTICLES.push({"treaty": "vclt", "no": "73", "heading": "國家繼承、國家責任及發生敵對行為問題", "tier": "B", "paras": [{"n": "", "en": "The provisions of the present Convention shall not prejudge any question that may arise in regard to a treaty from a succession of States or from the international responsibility of a State or from the outbreak of hostilities between States.", "zh": "本公約之規定不妨礙國家繼承或國家所負國際責任或國家間發生敵對行為所引起關於條約之任何問題。"}], "keys": ["不妨礙國家繼承或國家所負國際責任或國家間發生敵對行為所引起關於條約之任何問題"], "plain": "三個「留白」：國家繼承（另有1978年《關於國家在條約方面繼承的維也納公約》）、國家責任（國家責任條款）、國家間敵對行為對條約的影響，公約都不處理。最後一項，國際法委員會2011年《武裝衝突對條約的影響條款》提出：武裝衝突不當然終止或停止條約（第3條）；是否受影響，依條約性質、目的、衝突的強度與期間等判斷；人權、國際人道法、劃界、外交關係等條約原則上繼續適用（附件清單）；該條款第18條並保留情況之基本改變等條約法事由的適用。", "elements": [{"req": ["國家繼承、國家責任或國家間敵對行為所引起的條約問題"], "effect": "不受本公約規定影響，依其他國際法規則處理"}], "traps": ["陷阱：武力衝突不當然終止或停止條約（國際法委員會2011年條款第3條）。", "陷阱：申論題es111g_1問武力衝突能否作為情事變更的理由：公約第73條未處理，須另依習慣法與國際法委員會2011年條款判斷，且仍受第62條嚴格要件限制。"], "custom": {"status": "不適用", "note": "保留條款。", "cases": []}, "related": ["vclt-62", "vclt-63"], "cases": [], "roc": "", "essay": "武力衝突對條約的影響：「條約法公約第73條明定不處理國家間敵對行為所引起之條約問題；依國際法委員會2011年《武裝衝突對條約的影響條款》第3條，武裝衝突不當然終止或停止條約，須依條約性質與衝突情形個案判斷。」", "exam": [], "news": [], "verified": "2026-10-07", "changelog": [{"date": "2026-10-07", "type": "新增", "text": "第3C批新增本條；中文依聯合國條約集第1155卷作準中文本照錄，經文字辨識後逐字對照原件影像校對。"}]});

CASES.push({"id": "gabcikovo", "nameZh": "加布契科沃—大毛羅斯計畫案（匈牙利／斯洛伐克）", "nameEn": "Gabčíkovo-Nagymaros Project (Hungary/Slovakia)", "court": "國際法院", "year": "1997", "date": "1997-09-25", "kind": "判決", "parties": "匈牙利與斯洛伐克1993年4月7日以特別協定共同提交；斯洛伐克為捷克斯洛伐克在本條約上的繼承國。", "facts": "1977年匈牙利與捷克斯洛伐克訂約，在多瑙河上共同興建加布契科沃（捷方）與大毛羅斯（匈方）兩座水壩與相關設施。1989年匈牙利以環境疑慮為由停工並放棄工程；捷克斯洛伐克改採單方的「C變體」，自行在本國境內截流改道，1992年10月實際截流。匈牙利於1992年5月19日通知終止1977年條約，自同年5月25日生效。", "issues": ["匈牙利停止並放棄工程，能否以「生態危急情況」阻卻違法？", "捷克斯洛伐克實施C變體是否合法？", "匈牙利1992年的終止通知是否有效（危急情況、履行不能、情況之基本改變、重大違約、新環境規範）？", "條約是否因捷克斯洛伐克解體而失效？兩國今後應如何處理？"], "holding": ["匈牙利停止並放棄工程不能以危急情況正當化：危險並非「嚴重且迫切」，匈牙利也有其他手段，且本身促成了該情況（14比1）。", "捷克斯洛伐克有權採取臨時解決方案，但實際運轉C變體、單方控制共享資源，違反比例原則，屬不法行為（10比5）。", "匈牙利的終止通知無效（11比4）：危急情況是阻卻違法事由，不是終止條約的理由；條約規定的聯合投資體制不構成標的物永久消失；政治變局、經濟可行性降低、環境知識發展都不是情況的基本改變，第62條只能在例外情形適用；捷克斯洛伐克的違約在匈牙利通知時尚未發生，匈牙利援引重大違約屬過早；新的環境規範可透過條約本身的條款納入，不能據以終止。", "1977年條約依國家繼承規則對斯洛伐克繼續有效（創設屬地制度的條約）；雙方應善意談判，依條約目的並考量新的環境規範，達成履約方式。"], "significance": "條約法考點最集中的判例：①第60至62條要件嚴格，法院確認反映習慣法；②條約法（條約是否有效）與國家責任法（違約有無阻卻違法事由）必須區分；③不能以自己的違法行為援引對方違約（不可援用自己的不法）；④條約必須遵守與善意履行（第26條）；⑤永續發展概念首次出現在國際法院判決中（環境法原則）。申論題es109l_2、es111g_1。", "articles": ["vclt-60", "vclt-61", "vclt-62"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/92", "verified": "2026-10-07"});
CASES.push({"id": "fisheries-jurisdiction", "nameZh": "冰島漁業管轄權案（英國訴冰島）", "nameEn": "Fisheries Jurisdiction (United Kingdom v. Iceland), Jurisdiction of the Court", "court": "國際法院", "year": "1973", "date": "1973-02-02", "kind": "判決", "parties": "英國1972年4月14日起訴冰島；冰島未出庭。德國另案起訴冰島（併行審理）。", "facts": "英國與冰島1961年換文：英國承認冰島12浬漁區，冰島承諾將來擴大漁區時，若生爭端，任一方可提交國際法院。1972年冰島宣布擴大漁區至50浬，並主張1961年換文中的司法解決條款因情況改變（捕魚技術進步、魚群資源壓力增加、冰島經濟對漁業的依賴）而失效。", "issues": ["1961年換文是否賦予國際法院管轄權？", "冰島能否以情況之基本改變為由，主張換文中的司法解決條款已失效？"], "holding": ["法院對本案有管轄權（14比1）。", "條約法公約第62條在許多方面可視為既有習慣法的編纂；但援引情況之基本改變，須改變的影響「根本變動」尚待履行義務的範圍，即使該義務的負擔增加到與原承擔的義務本質不同。", "本案尚待履行的義務只是將爭端提交法院，此義務並未因捕魚技術的變化而改變，主張不成立。", "法院並指出，以威脅或使用武力締結的條約依現代國際法無效（冰島主張換文是在英國海軍壓力下締結，但未獲證明）。"], "significance": "考點：①國際法院確認第62條反映習慣法，並嚴格解釋「根本變動尚待履行的義務」；②情況改變須與「尚待履行」的特定義務相關；③第52條以武力強迫締約無效。1974年實體判決認定冰島不得對英國片面主張50浬專屬漁區，雙方應談判；其後的「鱈魚戰爭」與1982年海洋法公約的專屬經濟海域制度使爭議失去實益。", "articles": ["vclt-62"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/55", "verified": "2026-10-07"});
CASES.push({"id": "namibia", "nameZh": "南非不顧安理會決議繼續留駐納米比亞的法律後果諮詢意見", "nameEn": "Legal Consequences for States of the Continued Presence of South Africa in Namibia (South West Africa) notwithstanding Security Council Resolution 276 (1970) (Advisory Opinion)", "court": "國際法院", "year": "1971", "date": "1971-06-21", "kind": "諮詢意見", "parties": "聯合國安全理事會1970年7月29日第284號決議請求。", "facts": "西南非（納米比亞）原為國際聯盟委任統治地，由南非管理。南非拒絕將其置於聯合國託管制度並推行種族隔離。聯合國大會1966年以第2145號決議終止委任統治；安理會第276號決議（1970）宣告南非繼續留駐為非法。南非主張大會無權終止委任統治，且安理會第276號決議在兩個常任理事國棄權下通過而無效。", "issues": ["常任理事國棄權時，安理會決議是否有效？", "大會能否以南非重大違約為由終止委任統治？", "南非繼續留駐的法律後果為何？"], "holding": ["常任理事國自願棄權，依安理會長期一貫的實踐，不構成否決；此實踐已為會員國普遍接受（嗣後慣例，條約法公約第31條第3項(乙)款）。", "條約法公約第60條關於因違約終止條約的規則，在許多方面可視為既有習慣法的編纂；拒絕履行條約的根本義務、違反對達成條約目的及宗旨所必要的規定，構成重大違約。南非違反委任統治的根本義務，大會有權終止委任統治。", "南非繼續留駐納米比亞為非法，應立即撤出（13比2）；聯合國會員國有義務不承認南非在納米比亞的任何行為為合法，不得給予支持或協助（11比4）。"], "significance": "考點：①第60條重大違約反映習慣法；②嗣後慣例可影響條約解釋（棄權不視為否決，憲章第27條第3項）；③不承認義務；④自決權發展。答申論題時常與加布契科沃案並列。", "articles": ["vclt-60"], "exam": [], "srcUrl": "https://www.icj-cij.org/case/53", "verified": "2026-10-07"});
