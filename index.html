ARTICLES.push({"treaty": "unclos", "no": "39", "heading": "船舶和飛機在過境通行時的義務", "tier": "A", "paras": [{"n": "1", "en": "Ships and aircraft, while exercising the right of transit passage, shall:\n(a) proceed without delay through or over the strait;\n(b) refrain from any threat or use of force against the sovereignty, territorial integrity or political independence of States bordering the strait, or in any other manner in violation of the principles of international law embodied in the Charter of the United Nations;\n(c) refrain from any activities other than those incident to their normal modes of continuous and expeditious transit unless rendered necessary by force majeure or by distress;\n(d) comply with other relevant provisions of this Part.", "zh": "船舶和飛機在行使過境通行權時應：\n(a)毫不遲延地通過或飛越海峽；\n(b)不對海峽沿岸國的主權、領土完整或政治獨立進行任何武力威脅或使用武力，或以任何其他違反「聯合國憲章」所體現的國際法原則的方式進行武力威脅或使用武力；\n(c)除因不可抗力或遇難而有必要外，不從事其繼續不停和迅速過境的通常方式所附帶發生的活動以外的任何活動；\n(d)遵守本部份的其他有關規定。"}, {"n": "2", "en": "Ships in transit passage shall:\n(a) comply with generally accepted international regulations, procedures and practices for safety at sea, including the International Regulations for Preventing Collisions at Sea;\n(b) comply with generally accepted international regulations, procedures and practices for the prevention, reduction and control of pollution from ships.", "zh": "過境通行的船舶應：\n(a)遵守一般接受的關於海上安全的國際規章、程序和慣例，包括「國際海上避碰規則」；\n(b)遵守一般接受的關於防止、減少和控制來自船舶的污染的國際規章、程序和慣例。"}, {"n": "3", "en": "Aircraft in transit passage shall:\n(a) observe the Rules of the Air established by the International Civil Aviation Organization as they apply to civil aircraft; state aircraft will normally comply with such safety measures and will at all times operate with due regard for the safety of navigation;\n(b) at all times monitor the radio frequency assigned by the competent internationally designated air traffic control authority or the appropriate international distress radio frequency.", "zh": "過境通行的飛機應：\n(a)遵守國際民用航空組織制定的適用於民用飛機的「航空規則」；國有飛機通常應遵守這種安全措施，並在操作時隨時適當顧及航行安全；\n(b)隨時監聽國際上指定的空中交通管制主管機構所分配的無線電頻率或有關的國際呼救無線電頻率。"}], "keys": ["毫不遲延", "不可抗力或遇難", "航空規則"], "plain": "享有過境通行權的船舶和飛機也有義務。共同義務：毫不遲延地通過或飛越；不得對沿岸國武力威脅或使用武力；除不可抗力或遇難外，不從事繼續不停和迅速過境的「通常方式」以外的活動；遵守第三部分其他規定。船舶另須遵守一般接受的海上安全國際規章（含國際海上避碰規則）與防止船舶污染的國際規章。飛機須遵守國際民航組織的航空規則（國有航空器「通常」也應遵守，並隨時適當顧及航行安全），並隨時監聽指定的無線電頻率。研究或測量活動另由第40條規定，須經沿岸國事前准許。", "elements": [{"req": ["船舶或飛機行使過境通行權"], "effect": "應毫不遲延通過、不得武力威脅或使用武力、除不可抗力或遇難外不從事通常過境方式以外的活動、遵守第三部分"}, {"req": ["過境通行的船舶"], "effect": "應遵守一般接受的海上安全與防止船舶污染的國際規章"}, {"req": ["過境通行的飛機"], "effect": "應遵守國際民航組織航空規則（國有航空器通常應遵守），並監聽指定無線電頻率"}], "traps": ["陷阱：過境通行時「得進行任何研究或測量」是錯的；依第40條須經沿岸國事前准許（gl114a_8正解D）。", "陷阱：「通常方式」被美國等海權國家解為潛水艇可潛航、航空母艦可依航行安全需要起降艦載機，這是過境通行比無害通過寬鬆之處；但後者是否屬通常方式仍有爭議。", "陷阱：國有航空器對航空規則是「通常應遵守」，不是絕對義務。"], "custom": {"status": "不適用", "note": "公約創設的條約義務，與過境通行制度一併形成。", "cases": []}, "related": ["unclos-38", "unclos-40", "unclos-42", "unclos-44", "unclos-54", "unclos-19"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_8", "note": "A、B、C都是第1項(a)至(c)款的義務；D錯誤，研究或測量須經沿岸國事前准許（第40條）。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "40", "heading": "過境通行中的研究和測量活動", "tier": "B", "paras": [{"n": "", "en": "During transit passage, foreign ships, including marine scientific research and hydrographic survey ships, may not carry out any research or survey activities without the prior authorization of the States bordering straits.", "zh": "外國船舶，包括海洋科學研究和水文測量的船舶在內，在過境通行時，非經海峽沿岸國事前准許，不得進行任何研究或測量活動。"}], "keys": ["事前准許", "研究或測量活動"], "plain": "外國船舶在過境通行時，包括海洋科學研究船和水文測量船，未經海峽沿岸國事前准許，不得進行任何研究或測量活動。這和領海內「進行研究或測量活動」會使通過變成有害（第19條第2項(j)款）是同一思路：通過的權利不包括順便做研究。群島海道通過準用本條（第54條）。", "elements": [{"req": ["外國船舶（含研究船、測量船）", "正在行使過境通行"], "effect": "未經沿岸國事前准許，不得進行任何研究或測量"}], "traps": ["陷阱：研究測量須「事前」准許；gl114a_8選項D稱過境通行時「得進行任何研究或測量活動」是錯誤敘述。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-39", "unclos-19", "unclos-54", "unclos-245"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_8", "note": "正解D：依本條，過境通行中的研究或測量須經海峽沿岸國事前准許。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "44", "heading": "海峽沿岸國的義務", "tier": "A", "paras": [{"n": "", "en": "States bordering straits shall not hamper transit passage and shall give appropriate publicity to any danger to navigation or overflight within or over the strait of which they have knowledge. There shall be no suspension of transit passage.", "zh": "海峽沿岸國不應妨礙過境通行，並應將其所知的海峽內或海峽上空對航行或飛越有危險的任何情況妥為公佈。過境通行不應予以停止。"}], "keys": ["不應妨礙過境通行", "妥為公佈", "不應予以停止"], "plain": "沿岸國不得妨礙過境通行，並應把所知的海峽內或上空對航行、飛越有危險的情況妥為公布。最重要的是最後一句：過境通行不得停止。即使為了國家安全或武器演習，沿岸國也不能像在領海那樣暫時停止通行（比較第25條第3項、第52條第2項）。", "elements": [{"req": ["海峽適用過境通行"], "effect": "沿岸國不得妨礙、應公布已知的危險，且不得停止過境通行"}], "traps": ["陷阱：領海與群島水域的無害通過可「暫時停止」（第25條第3項、第52條第2項）；國際海峽的過境通行與第45條的無害通過都「不得停止」。", "陷阱：公布危險的義務呼應科孚海峽案：阿爾巴尼亞明知領海有水雷卻未通知，須負責。"], "custom": {"status": "部分", "note": "國際海峽通行不得停止源自科孚海峽案及1958年《領海及鄰接區公約》第16條第4項；公布危險的義務也與該案見解一致。", "cases": ["corfu"]}, "related": ["unclos-38", "unclos-45", "unclos-25", "unclos-52", "unclos-24", "unclos-54"], "cases": [{"id": "corfu", "point": "阿爾巴尼亞知道海峽內有水雷卻未通知過往船舶，應負國際責任；本條公布危險的義務與此一致。"}], "roc": "", "essay": "強調通行不得停止時：「過境通行不得停止（第44條），適用第45條的無害通過亦不得停止（第45條第2項），與領海、群島水域的無害通過得暫時停止（第25條第3項、第52條第2項）不同。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "45", "heading": "國際海峽的無害通過", "tier": "B", "paras": [{"n": "1", "en": "The regime of innocent passage, in accordance with Part II, section 3, shall apply in straits used for international navigation:\n(a) excluded from the application of the regime of transit passage under article 38, paragraph 1; or\n(b) between a part of the high seas or an exclusive economic zone and the territorial sea of a foreign State.", "zh": "按照第二部份第三節，無害通過制度應適用於下列用於國際航行的海峽：\n(a)按照第三十八條第一款不適用過境通行制度的海峽；或\n(b)在公海或專屬經濟區的一個部份和外國領海之間的海峽。"}, {"n": "2", "en": "There shall be no suspension of innocent passage through such straits.", "zh": "在這種海峽中的無害通過不應予以停止。"}], "keys": ["無害通過制度", "不應予以停止"], "plain": "不適用過境通行的國際海峽，適用無害通過，包括兩種：（a）依第38條第1項例外而排除過境通行的海峽（島嶼與大陸之間、島外另有同樣方便航道）；（b）連接公海或專屬經濟海域與外國領海的海峽。這裡的無害通過依第二部分第三節，但有一個重要差別：不得停止。也就是說，沒有飛越權、潛水艇須浮航，但沿岸國不能暫停通行。", "elements": [{"req": ["依第38條第1項不適用過境通行的海峽"], "effect": "適用無害通過"}, {"req": ["連接公海或專屬經濟海域與外國領海的海峽"], "effect": "適用無害通過"}, {"req": ["上述海峽中的無害通過"], "effect": "不得停止"}], "traps": ["陷阱：本條的無害通過「不得停止」，與一般領海無害通過可暫時停止不同。", "陷阱：本條沒有飛越權；航空器只有在適用過境通行的海峽才可飛越。"], "custom": {"status": "習慣法", "note": "國際海峽的無害通過不得停止，已見於1958年《領海及鄰接區公約》第16條第4項，並源自科孚海峽案。", "cases": ["corfu"]}, "related": ["unclos-38", "unclos-37", "unclos-44", "unclos-17", "unclos-25"], "cases": [{"id": "corfu", "point": "法院認定沿海國不得禁止各國軍艦平時無害通過國際海峽；本條第2項「不得停止」承此見解。"}], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "46", "heading": "群島國與群島的定義", "tier": "A", "paras": [{"n": "", "en": "For the purposes of this Convention:\n(a) \"archipelagic State\" means a State constituted wholly by one or more archipelagos and may include other islands;\n(b) \"archipelago\" means a group of islands, including parts of islands, interconnecting waters and other natural features which are so closely interrelated that such islands, waters and other natural features form an intrinsic geographical, economic and political entity, or which historically have been regarded as such.", "zh": "為本公約的目的：\n(a)「群島國」是指全部由一個或多個群島構成的國家，並可包括其他島嶼；\n(b)「群島」是指一群島嶼，包括若干島嶼的若干部份、相連的水域或其他自然地形，彼此密切相關，以致這種島嶼、水域和其他自然地形在本質上構成一個地理、經濟和政治的實體，或在歷史上已被視為這種實體。"}], "keys": ["群島國", "群島", "地理、經濟和政治的實體"], "plain": "「{{群島國}}」必須「全部」由一個或多個群島構成（可另含其他島嶼），例如印尼、菲律賓、斐濟。有大陸領土的國家即使擁有離岸群島（如厄瓜多的加拉巴哥群島），也不是群島國，不能適用第四部分劃群島基線。「群島」則指一群島嶼與相連的水域、其他自然地形，彼此密切相關，在本質上構成地理、經濟和政治的實體，或歷史上已被視為這種實體。", "elements": [{"req": ["國家全部由一個或多個群島構成（可包括其他島嶼）"], "effect": "為群島國，得依第47條劃群島基線"}, {"req": ["一群島嶼及相連水域、其他自然地形", "本質上構成地理、經濟和政治實體，或歷史上被視為此種實體"], "effect": "構成「群島」"}], "traps": ["陷阱：群島國須「全部」由群島構成；有大陸領土的國家即使擁有群島，也不能為該群島劃群島基線。", "陷阱：群島國的定義看國家整體，群島的定義看地理、經濟、政治的一體性；兩者都符合，再加上第47條的數量要件，才能劃群島基線。"], "custom": {"status": "部分", "note": "群島國制度是第三次海洋法會議應印尼、菲律賓等國要求新創，現已獲普遍接受。南海仲裁案（2016）認為中國不是群島國，不得為南沙群島劃群島基線。", "cases": []}, "related": ["unclos-47", "unclos-49", "unclos-7", "unclos-121"], "cases": [], "roc": "我國不是群島國。《中華民國領海及鄰接區法》第4條採直線基線為原則、正常基線為例外的混合基線法；行政院1999年公告的第一批領海基線，對臺灣本島及附屬島嶼、東沙群島等採直線基線（第7條），不是第四部分的群島基線。", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第(b)款「相連的水域和其他自然地形」依聯合國作準中文本更正為「或」（英文本作and，但中文本同為作準本，照錄作準本）。"}]});

ARTICLES.push({"treaty": "unclos", "no": "47", "heading": "群島基線", "tier": "A", "paras": [{"n": "1", "en": "An archipelagic State may draw straight archipelagic baselines joining the outermost points of the outermost islands and drying reefs of the archipelago provided that within such baselines are included the main islands and an area in which the ratio of the area of the water to the area of the land, including atolls, is between 1 to 1 and 9 to 1.", "zh": "群島國可劃定連接群島最外緣各島和各乾礁的最外緣各點的直線群島基線，但這種基線應包括主要的島嶼和一個區域，在該區域內，水域面積和包括環礁在內的陸地面積的比例應在一比一至九比一之間。"}, {"n": "2", "en": "The length of such baselines shall not exceed 100 nautical miles, except that up to 3 per cent of the total number of baselines enclosing any archipelago may exceed that length, up to a maximum length of 125 nautical miles.", "zh": "這種基線的長度不應超過一百海里。但圍繞任何群島的基線總數中至多百分之三可超過該長度，最長以一百二十五海里為限。"}, {"n": "3", "en": "The drawing of such baselines shall not depart to any appreciable extent from the general configuration of the archipelago.", "zh": "這種基線的劃定不應在任何明顯的程度上偏離群島的一般輪廓。"}, {"n": "4", "en": "Such baselines shall not be drawn to and from low-tide elevations, unless lighthouses or similar installations which are permanently above sea level have been built on them or where a low-tide elevation is situated wholly or partly at a distance not exceeding the breadth of the territorial sea from the nearest island.", "zh": "除在低潮高地上築有永久高於海平面的燈塔或類似設施，或者低潮高地全部或一部與最近的島嶼的距離不超過領海的寬度外，這種基線的劃定不應以低潮高地為起訖點。"}, {"n": "5", "en": "The system of such baselines shall not be applied by an archipelagic State in such a manner as to cut off from the high seas or the exclusive economic zone the territorial sea of another State.", "zh": "群島國不應採用一種基線制度，致使另一國的領海同公海或專屬經濟區隔斷。"}, {"n": "6", "en": "If a part of the archipelagic waters of an archipelagic State lies between two parts of an immediately adjacent neighbouring State, existing rights and all other legitimate interests which the latter State has traditionally exercised in such waters and all rights stipulated by agreement between those States shall continue and be respected.", "zh": "如果群島國的群島水域的一部份位於一個直接相鄰國家的兩個部分之間，該鄰國傳統上在該水域內行使的現有權利和一切其他合法利益以及兩國間協定所規定的一切權利，均應繼續，並予以尊重。"}, {"n": "7", "en": "For the purpose of computing the ratio of water to land under paragraph 1, land areas may include waters lying within the fringing reefs of islands and atolls, including that part of a steep-sided oceanic plateau which is enclosed or nearly enclosed by a chain of limestone islands and drying reefs lying on the perimeter of the plateau.", "zh": "為計算第一款規定的水域與陸地的比例的目的，陸地面積可包括位於島嶼和環礁的岸礁以內的水域，其中包括位於陡側海臺周圍的一系列灰岩島和乾礁所包圍或幾乎包圍的海臺的那一部分。"}, {"n": "8", "en": "The baselines drawn in accordance with this article shall be shown on charts of a scale or scales adequate for ascertaining their position. Alternatively, lists of geographical coordinates of points, specifying the geodetic datum, may be substituted.", "zh": "按照本條劃定的基線，應在足以確定這些線的位置的一種或幾種比例尺的海圖上標出。或者，可以用列出各點的地理座標並註明大地基準點的表來代替。"}, {"n": "9", "en": "The archipelagic State shall give due publicity to such charts or lists of geographical coordinates and shall deposit a copy of each such chart or list with the Secretary-General of the United Nations.", "zh": "群島國應將這種海圖或地理座標表妥為公佈，並應將各該海圖或座標表的一份副本交存於聯合國秘書長。"}], "keys": ["直線群島基線", "一比一至九比一", "一百海里", "一百二十五海里"], "plain": "群島國可以用直線連接最外緣島嶼和乾礁的最外緣各點，劃出「{{群島基線}}」。四個數量限制最常考：①基線內必須包括主要島嶼，且水域面積與陸地面積（含環礁）的比例在1:1到9:1之間；②每條基線不超過100海里，但總數中至多3%可以超過，最長125海里；③不得明顯偏離群島的一般輪廓；④原則上不得以低潮高地為起訖點（上面有燈塔等永久設施，或位於最近島嶼領海範圍內者除外）。此外不得把他國領海與公海或專屬經濟海域隔斷，鄰國在群島水域內的傳統權利應予尊重。基線要標在海圖上（或列地理座標表），並交存聯合國秘書長。", "elements": [{"req": ["群島國", "連接最外緣各島和乾礁的最外緣各點", "包括主要島嶼", "水陸面積比在1:1至9:1之間", "每條不超過100海里（至多3%可超過，最長125海里）", "不明顯偏離群島一般輪廓"], "effect": "得劃定直線群島基線，線內為群島水域"}, {"req": ["以低潮高地為起訖點"], "effect": "原則不得；高地上有永久高於海面的燈塔等設施，或高地位於最近島嶼領海範圍內者除外"}, {"req": ["群島水域的一部分位於直接相鄰國家的兩部分之間"], "effect": "該鄰國的傳統權利、合法利益及協定權利應繼續並受尊重"}], "traps": ["陷阱：比例是「水：陸」在1:1到9:1之間；陸地太多或水域太多都不能劃。", "陷阱：群島基線長度上限100海里，例外最長125海里且不超過總數3%；第7條的直線基線則沒有明文長度上限。", "陷阱：只有群島國能劃群島基線；一般國家的離岸群島只能在符合第7條要件時劃直線基線。"], "custom": {"status": "部分", "note": "具體數量標準是公約新創；群島國得劃群島基線的制度已獲普遍接受。", "cases": []}, "related": ["unclos-46", "unclos-48", "unclos-49", "unclos-7", "unclos-13", "unclos-51"], "cases": [], "roc": "", "essay": "論群島國制度：「群島國得依第47條劃定群島基線，惟須包括主要島嶼、水陸比介於1:1至9:1、單一基線原則不超過100海里（至多3%得達125海里），且不得明顯偏離群島輪廓；基線內為群島水域（第49條），群島國享有主權，但須尊重無害通過與群島海道通過。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「最外線各島」依聯合國作準中文本更正為「最外緣各島」、「一比一到九比一」更正為「一比一至九比一」；第7項「干礁」為簡體字形殘留，改為「乾礁」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "48", "heading": "群島國各海域寬度的測算", "tier": "B", "paras": [{"n": "", "en": "The breadth of the territorial sea, the contiguous zone, the exclusive economic zone and the continental shelf shall be measured from archipelagic baselines drawn in accordance with article 47.", "zh": "領海、毗連區、專屬經濟區和大陸架的寬度，應從按照第四十七條劃定的群島基線量起。"}], "keys": ["群島基線量起"], "plain": "群島國的領海、鄰接區、專屬經濟海域和大陸礁層，都從群島基線向外量。群島基線對群島國的作用，相當於一般國家的領海基線：線內是群島水域，線外依序是領海（12海里）、鄰接區（24海里）、專屬經濟海域（200海里）。", "elements": [{"req": ["群島國依第47條劃定群島基線"], "effect": "領海、鄰接區、專屬經濟海域、大陸礁層的寬度自群島基線量起"}], "traps": ["陷阱：群島基線向內是「群島水域」，不是內水；向外第一條海帶才是領海。"], "custom": {"status": "不適用", "note": "配合群島基線的技術性規定。", "cases": []}, "related": ["unclos-47", "unclos-49", "unclos-3", "unclos-33", "unclos-57", "unclos-76"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）開頭「領海，毗連區」依聯合國作準中文本改為頓號。"}]});

ARTICLES.push({"treaty": "unclos", "no": "49", "heading": "群島水域的法律地位", "tier": "A", "paras": [{"n": "1", "en": "The sovereignty of an archipelagic State extends to the waters enclosed by the archipelagic baselines drawn in accordance with article 47, described as archipelagic waters, regardless of their depth or distance from the coast.", "zh": "群島國的主權及於按照第四十七條劃定的群島基線所包圍的水域，稱為群島水域，不論其深度或距離海岸的遠近如何。"}, {"n": "2", "en": "This sovereignty extends to the air space over the archipelagic waters, as well as to their bed and subsoil, and the resources contained therein.", "zh": "此項主權及於群島水域的上空、海床和底土，以及其中所包含的資源。"}, {"n": "3", "en": "This sovereignty is exercised subject to this Part.", "zh": "此項主權的行使受本部份規定的限制。"}, {"n": "4", "en": "The regime of archipelagic sea lanes passage established in this Part shall not in other respects affect the status of the archipelagic waters, including the sea lanes, or the exercise by the archipelagic State of its sovereignty over such waters and their air space, bed and subsoil, and the resources contained therein.", "zh": "本部份所規定的群島海道通過制度，不應在其他方面影響包括海道在內的群島水域的地位，或影響群島國對這種水域及其上空、海床和底土以及其中所含資源行使其主權。"}], "keys": ["群島水域", "主權", "群島海道通過制度"], "plain": "群島基線包圍的水域稱為「{{群島水域}}」，不論深度或離岸遠近，群島國都有主權，及於上空、海床、底土與其中資源。但主權受第四部分限制：外國船舶有無害通過權（第52條），指定海道或慣用航道有群島海道通過權（第53條），還要尊重既有協定、鄰國傳統捕魚權與既有海底電纜（第51條）。群島水域是介於內水與領海之間的新類型：主權完整及於整片水域，但外國船舶的通行權比內水多。", "elements": [{"req": ["依第47條劃定的群島基線所包圍的水域"], "effect": "為群島水域，群島國主權及於水域、上空、海床、底土及資源"}, {"req": ["群島國行使群島水域主權"], "effect": "受第四部分限制（無害通過、群島海道通過、傳統捕魚權、海底電纜等）"}], "traps": ["陷阱：群島水域不是內水，也不是領海；群島國可再依第50條在群島水域內劃封閉線，線內才是內水（SG046選項D）。", "陷阱：主權及於群島水域上空，但在指定空中航道內，外國航空器享有群島海道通過的飛越權（第53條）。"], "custom": {"status": "部分", "note": "群島水域是公約新創的海域類別，與群島國制度一併獲普遍接受。", "cases": []}, "related": ["unclos-47", "unclos-50", "unclos-51", "unclos-52", "unclos-53", "unclos-2", "unclos-8"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG046", "note": "選項D的前提「群島基線內部屬於群島國家之內水」不精確：群島基線內是群島水域，只有依第50條劃封閉線所圍的部分才是內水。本題正解B（見第8條）。"}], "news": [], " ARTICLES.push({"treaty": "unclos", "no": "50", "heading": "群島水域內的內水界限", "tier": "B", "paras": [{"n": "", "en": "Within its archipelagic waters, the archipelagic State may draw closing lines for the delimitation of internal waters, in accordance with articles 9, 10 and 11.", "zh": "群島國可按照第九、第十和第十一條，在其群島水域內用封閉線劃定內水的界限。"}], "keys": ["封閉線", "內水的界限"], "plain": "群島國可以在群島水域裡，依第9條（河口）、第10條（海灣）、第11條（港口）的方法劃封閉線，線內才是內水。所以群島國的海域由內而外是：內水、群島水域、領海、鄰接區、專屬經濟海域。", "elements": [{"req": ["群島國", "依第9、10、11條的方法在群島水域內劃封閉線"], "effect": "線內為內水"}], "traps": ["陷阱：群島水域本身不是內水；只有封閉線內的河口、海灣、港口水域才是內水。"], "custom": {"status": "不適用", "note": "技術性規定。", "cases": []}, "related": ["unclos-49", "unclos-8", "unclos-9", "unclos-10", "unclos-52"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG046", "note": "選項D的前提不精確：依本條，只有群島國在群島水域內劃封閉線所圍的水域才是內水。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）「接照第九、第十和第十一條」為錯字，依聯合國作準中文本更正為「按照」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "51", "heading": "既有協定、傳統捕魚權和既有海底電纜", "tier": "A", "paras": [{"n": "1", "en": "Without prejudice to article 49, an archipelagic State shall respect existing agreements with other States and shall recognize traditional fishing rights and other legitimate activities of the immediately adjacent neighbouring States in certain areas falling within archipelagic waters. The terms and conditions for the exercise of such rights and activities, including the nature, the extent and the areas to which they apply, shall, at the request of any of the States concerned, be regulated by bilateral agreements between them. Such rights shall not be transferred to or shared with third States or their nationals.", "zh": "在不妨害第四十九條的情形下，群島國應尊重與其他國家間的現有協定，並應承認直接相鄰國家在群島水域範圍內的某些區域內的傳統捕魚權利和其他合法活動。行使這種權利和進行這種活動的條款和條件，包括這種權利和活動的性質、範圍和適用的區域，經任何有關國家要求，應由有關國家之間的雙邊協定予以規定。這種權利不應轉讓給第三國或其國民，或與第三國或其國民分享。"}, {"n": "2", "en": "An archipelagic State shall respect existing submarine cables laid by other States and passing through its waters without making a landfall. An archipelagic State shall permit the maintenance and replacement of such cables upon receiving due notice of their location and the intention to repair or replace them.", "zh": "群島國應尊重其他國家所鋪設的通過其水域而不靠岸的現有海底電纜。群島國於接到關於這種電纜的位置和修理或更換這種電纜的意圖的適當通知後，應准許對其進行維修和更換。"}], "keys": ["傳統捕魚權利", "現有海底電纜", "不應轉讓給第三國"], "plain": "群島國把大片海域圈成群島水域後，必須照顧既有的利益：①尊重與他國的既有協定；②承認直接相鄰國家在群島水域某些區域內的傳統捕魚權和其他合法活動，具體條件經任一方要求以雙邊協定規定，且這種權利不得轉讓給第三國或其國民，也不得與其分享；③尊重他國鋪設、通過其水域而不靠岸的既有海底電纜，接到適當通知後應准許維修和更換。", "elements": [{"req": ["群島國與他國有既有協定"], "effect": "應尊重"}, {"req": ["直接相鄰國家在群島水域某些區域的傳統捕魚與合法活動"], "effect": "群島國應承認；條件經要求以雙邊協定規定；不得轉讓或與第三國分享"}, {"req": ["他國鋪設、通過其水域而不靠岸的既有海底電纜", "接到位置及修理更換意圖的適當通知"], "effect": "群島國應尊重並准許維修和更換"}], "traps": ["陷阱：傳統捕魚權屬於「直接相鄰國家」，不是所有國家；且不得轉讓或與第三國分享。", "陷阱：受保護的是既有的、「不靠岸」通過其水域的海底電纜；群島國應准許維修和更換（gl114a_9選項A正確）。"], "custom": {"status": "不適用", "note": "條約規定，是群島國制度的配套妥協。", "cases": []}, "related": ["unclos-47", "unclos-49", "unclos-52", "unclos-79"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_9", "note": "選項A（尊重不靠岸的現有海底電纜）與B（承認直接相鄰國的傳統捕魚權）都是本條的正確敘述；正解D。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "52", "heading": "群島水域的無害通過權", "tier": "A", "paras": [{"n": "1", "en": "Subject to article 53 and without prejudice to article 50, ships of all States enjoy the right of innocent passage through archipelagic waters, in accordance with Part II, section 3.", "zh": "在第五十三條的限制下並在不妨害第五十條的情形下，按照第二部份第三節的規定，所有國家的船舶均享有通過群島水域的無害通過權。"}, {"n": "2", "en": "The archipelagic State may, without discrimination in form or in fact among foreign ships, suspend temporarily in specified areas of its archipelagic waters the innocent passage of foreign ships if such suspension is essential for the protection of its security. Such suspension shall take effect only after having been duly published.", "zh": "如為保護國家安全所必要，群島國可在對外國船舶之間在形式上或事實上不加歧視的條件下，暫時停止外國船舶在其群島水域特定區域內的無害通過。這種停止僅應在正式公佈後發生效力。"}], "keys": ["無害通過權", "暫時停止"], "plain": "所有國家的船舶都享有通過群島水域的{{無害通過}}權，依第二部分第三節（領海無害通過）的規則。兩個前提：受第53條限制（指定海道內適用群島海道通過），也不妨害第50條（封閉線內的內水沒有無害通過）。群島國為保護國家安全有必要時，可以在不歧視的條件下，暫時停止特定區域的無害通過，正式公布後生效，這一點和領海相同（第25條第3項）。", "elements": [{"req": ["所有國家的船舶", "通過群島水域（封閉線內的內水除外）", "符合第二部分第三節的無害通過要件"], "effect": "享有無害通過權"}, {"req": ["為保護國家安全所必要", "對外國船舶不加歧視", "限於特定區域且為暫時", "正式公布"], "effect": "群島國得暫時停止無害通過"}], "traps": ["陷阱：群島水域的無害通過可以暫時停止，但群島海道通過不得停止（第54條準用第44條）。", "陷阱：無害通過只給船舶；航空器只有在指定（或慣用）空中航道內才有群島海道通過的飛越權。"], "custom": {"status": "部分", "note": "隨群島水域制度形成。", "cases": []}, "related": ["unclos-49", "unclos-50", "unclos-53", "unclos-17", "unclos-19", "unclos-25"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "gl114a_9", "note": "選項C（所有國家船舶原則上享有通過群島水域的無害通過權）是本條的正確敘述；正解D。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "53", "heading": "群島海道通過權", "tier": "A", "paras": [{"n": "1", "en": "An archipelagic State may designate sea lanes and air routes thereabove, suitable for the continuous and expeditious passage of foreign ships and aircraft through or over its archipelagic waters and the adjacent territorial sea.", "zh": "群島國可指定適當的海道和其上的空中航道，以便外國船舶和飛機繼續不停和迅速通過或飛越其群島水域和鄰接的領海。"}, {"n": "2", "en": "All ships and aircraft enjoy the right of archipelagic sea lanes passage in such sea lanes and air routes.", "zh": "所有船舶和飛機均享有在這種海道和空中航道內的群島海道通過權。"}, {"n": "3", "en": "Archipelagic sea lanes passage means the exercise in accordance with this Convention of the rights of navigation and overflight in the normal mode solely for the purpose of continuous, expeditious and unobstructed transit between one part of the high seas or an exclusive economic zone and another part of the high seas or an exclusive economic zone.", "zh": "群島海道通過是指按照本公約規定，專為在公海或專屬經濟區的一部份和公海或專屬經濟區的另一部份之間繼續不停、迅速和無障礙地過境的目的，行使正常方式的航行和飛越的權利。"}, {"n": "4", "en": "Such sea lanes and air routes shall traverse the archipelagic waters and the adjacent territorial sea and shall include all normal passage routes used as routes for international navigation or overflight through or over archipelagic waters and, within such routes, so far as ships are concerned, all normal navigational channels, provided that duplication of routes of similar convenience between the same entry and exit points shall not be necessary.", "zh": "這種海道和空中航道應穿過群島水域和鄰接的領海，並應包括用作通過群島水域或其上空的國際航行或飛越的航道的所有正常通道，並且在這種航道內，就船舶而言，包括所有正常航行水道，但無須在相同的進出點之間另設同樣方便的其他航道。"}, {"n": "5", "en": "Such sea lanes and air routes shall be defined by a series of continuous axis lines from the entry points of passage routes to the exit points. Ships and aircraft in archipelagic sea lanes passage shall not deviate more than 25 nautical miles to either side of such axis lines during passage, provided that such ships and aircraft shall not navigate closer to the coasts than 10 per cent of the distance between the nearest points on islands bordering the sea lane.", "zh": "這種海道和空中航道應以通道進出點之間的一系列連續不斷的中心線劃定，通過群島海道和空中航道的船舶和飛機在通過時不應偏離這種中心線二十五海里以外，但這種船舶和飛機在航行時與海岸的距離不應小於海道邊緣各島最近各點之間的距離的百分之十。"}, {"n": "6", "en": "An archipelagic State which designates sea lanes under this article may also prescribe traffic separation schemes for the safe passage of ships through narrow channels in such sea lanes.", "zh": "群島國根據本條指定海道時，為了使船舶安全通過這種海道內的狹窄水道，也可規定分道通航制。"}, {"n": "7", "en": "An archipelagic State may, when circumstances require, after giving due publicity thereto, substitute other sea lanes or traffic separation schemes for any sea lanes or traffic separation schemes previously designated or prescribed by it.", "zh": "群島國可於情況需要時，經妥為公佈後，以其他的海道或分道通航制替換任何其原先指定或規定的海道或分道通航制。"}, {"n": "8", "en": "Such sea lanes and traffic separation schemes shall conform to generally accepted international regulations.", "zh": "這種海道或分道通航制應符合一般接受的國際規章。"}, {"n": "9", "en": "In designating or substituting sea lanes or prescribing or substituting traffic separation schemes, an archipelagic State shall refer proposals to the competent international organization with a view to their adoption. The organization may adopt only such sea lanes and traffic separation schemes as may be agreed with the archipelagic State, after which the archipelagic State may designate, prescribe or substitute them.", "zh": "群島國在指定或替換海道或在規定或替換分道通航制時，應向主管國際組織提出建議，以期得到採納。該組織僅可採納同群島國議定的海道和分道通航制；在此以後，群島國可對這些海道和分道通航制予以指定、規定或替換。"}, {"n": "10", "en": "The archipelagic State shall clearly indicate the axis of the sea lanes and the traffic separation schemes designated or prescribed by it on charts to which due publicity shall be given.", "zh": "群島國應在海圖上清楚地標出其指定或規定的海道中心線和分道通航制，並應將該海圖妥為公佈。"}, {"n": "11", "en": "Ships in archipelagic sea lanes passage shall respect applicable sea lanes and traffic separation schemes established in accordance with this article.", "zh": "通過群島海道的船舶應尊重按照本條制定的適用的海道和分道通航制。"}, {"n": "12", "en": "If an archipelagic State does not designate sea lanes or air routes, the right of archipelagic sea lanes passage may be exercised through the routes normally used for international navigation.", "zh": "如果群島國沒有指定海道或空中航道，可通過正常用於國際航行的航道，行使群島海道通過權。"}], "keys": ["群島海道通過權", "空中航道", "二十五海里", "百分之十"], "plain": "群島國可以指定海道和上方的空中航道，供外國船舶和飛機繼續不停、迅速地通過群島水域與鄰接的領海。所有船舶和飛機在這些海道和航道內享有「{{群島海道通過}}」權：專為從公海或專屬經濟海域一部分到另一部分，繼續不停、迅速且無障礙地過境，以正常方式行使航行和飛越權利。性質接近國際海峽的過境通行（第54條準用第39、40、42、44條，因此也不得停止）。海道以一系列連續的中心線劃定，船舶飛機不得偏離中心線兩側25海里以上，但離岸距離不得小於海道邊緣最近島嶼間距離的10%。海道須經主管國際組織（國際海事組織）採納。群島國沒有指定海道時，可通過正常用於國際航行的航道行使群島海道通過權（第12項）。", "elements": [{"req": ["群島國指定的海道及空中航道（或未指定時的正常國際航道）", "所有船舶和飛機", "專為在公海或專屬經濟海域兩部分間繼續不停、迅速、無障礙過境", "以正常方式航行或飛越"], "effect": "享有群島海道通過權，且不得停止（第54條準用第44條）"}, {"req": ["指定海道"], "effect": "以中心線劃定；船機不得偏離中心線25海里以外，且離岸不得小於海道邊緣島嶼最近距離的10%"}, {"req": ["群島國指定或替換海道、分道通航制"], "effect": "應向主管國際組織提出建議，經其採納"}], "traps": ["陷阱：群島海道通過包括「飛機」的飛越權；說航空器不享有群島水域空中通行權是錯的（gl114a_9正解D）。", "陷阱：群島海道通過適用於群島水域及鄰接的領海，不是題目所稱群島國的專屬經濟海域（gl113a_6選項B錯誤）。", "陷阱：群島國未指定海道時，各國仍可在正常國際航道行使群島海道通過權（第12項），不是只剩無害通過。", "陷阱：25海里是偏離中心線的上限，10%是離岸距離的下限，兩者容易對調。"], "custom": {"status": "部分", "note": "公約新創，與過境通行同為海權國家換取群島國制度的條件。國際海事組織1998年採納印尼提出的三條南北向群島海道，是第一個（部分的）群島海道指定案例。", "cases": []}, "related": ["unclos-52", "unclos-54", "unclos-38", "unclos-39", "unclos-44", "unclos-49"], "cases": [], "roc": "", "essay": "論群島國的通行制度：「群島水域原則適用無害通過（第52條），在指定海道及空中航道則適用群島海道通過（第53條），船舶與航空器均得以正常方式繼續不停、迅速且無障礙地過境；依第54條準用第44條，群島海道通過不得停止。」", "exam": [{"qid": "gl114a_9", "note": "正解D：依第2項，所有船舶和飛機均享有群島海道通過權，航空器在指定空中航道內有飛越權。"}, {"qid": "gl113a_6", "note": "選項B錯誤：群島海道通過的範圍是群島水域及鄰接的領海，不是專屬經濟海域。正解D。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "55", "heading": "專屬經濟海域的特定法律制度", "tier": "A", "paras": [{"n": "", "en": "The exclusive economic zone is an area beyond and adjacent to the territorial sea, subject to the specific legal regime established in this Part, under which the rights and jurisdiction of the coastal State and the rights and freedoms of other States are governed by the relevant provisions of this Convention.", "zh": "專屬經濟區是領海以外並鄰接領海的一個區域，受本部份規定的特定法律制度的限制，在這個制度下，沿海國的權利和管轄權以及其他國家的權利和自由均受本公約有關規定的支配。"}], "keys": ["特定法律制度", "鄰接領海"], "plain": "{{專屬經濟海域}}是領海以外、鄰接領海的區域，受第五部分的「特定法律制度」（自成一類）規範：它不是領海（沿海國沒有主權），也不是公海（沿海國有資源的主權權利與特定管轄權）。沿海國的權利與管轄權、其他國家的權利與自由，都由公約有關規定支配；兩者衝突而公約沒有分配時，依第59條在公平基礎上解決。", "elements": [{"req": ["領海以外並鄰接領海的區域", "經沿海國主張"], "effect": "適用專屬經濟海域的特定法律制度，沿海國與其他國家的權利義務均依公約規定"}], "traps": ["陷阱：專屬經濟海域是「特定法律制度」，既非領海也非公海；說沿海國在專屬經濟海域有「主權」是錯的（gl111a_7選項A）。", "陷阱：專屬經濟海域需要沿海國主張才存在；大陸礁層則是固有權利，不需主張（第77條第3項）。"], "custom": {"status": "習慣法", "note": "國際法院在利比亞／馬爾他大陸礁層案（1985）指出，專屬經濟海域制度已成為習慣國際法的一部分。", "cases": []}, "related": ["unclos-56", "unclos-57", "unclos-58", "unclos-59", "unclos-86", "unclos-77"], "cases": [], "roc": "《中華民國專屬經濟海域及大陸礁層法》（1998年制定）第2條第1項、第2項：我國專屬經濟海域為鄰接領海外側至距離領海基線200浬間的海域，包括水體、海床及底土。", "essay": "破題可寫：「專屬經濟海域為領海以外並鄰接領海之區域，受公約第五部分特定法律制度之規範（第55條），沿海國享有資源主權權利及特定事項管轄權（第56條），他國則享有航行、飛越、鋪設海底電纜管道等自由（第58條）。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "56", "heading": "沿海國在專屬經濟海域的權利、管轄權和義務", "tier": "A", "paras": [{"n": "1", "en": "In the exclusive economic zone, the coastal State has:\n(a) sovereign rights for the purpose of exploring and exploiting, conserving and managing the natural resources, whether living or non-living, of the waters superjacent to the seabed and of the seabed and its subsoil, and with regard to other activities for the economic exploitation and exploration of the zone, such as the production of energy from the water, currents and winds;\n(b) jurisdiction as provided for in the relevant provisions of this Convention with regard to:\n(i) the establishment and use of artificial islands, installations and structures;\n(ii) marine scientific research;\n(iii) the protection and preservation of the marine environment;\n(c) other rights and duties provided for in this Convention.", "zh": "沿海國在專屬經濟區內有：\n(a)以勘探和開發、養護和管理海床上覆水域和海床及其底土的自然資源（不論為生物或非生物資源）為目的的主權權利，以及關於在該區內從事經濟性開發和勘探，如利用海水、海流和風力生產能等其他活動的主權權利；\n(b)本公約有關條款規定的對下列事項的管轄權：\n(1)人工島嶼、設施和結構的建造和使用；\n(2)海洋科學研究；\n(3)海洋環境的保護和保全；\n(c)本公約規定的其他權利和義務。"}, {"n": "2", "en": "In exercising its rights and performing its duties under this Convention in the exclusive economic zone, the coastal State shall have due regard to the rights and duties of other States and shall act in a manner compatible with the provisions of this Convention.", "zh": "沿海國在專屬經濟區內根據本公約行使其權利和履行其義務時，應適當顧及其他國家的權利和義務，並應以符合本公約規定的方式行事。"}, {"n": "3", "en": "The rights set out in this article with respect to the seabed and subsoil shall be exercised in accordance with Part VI.", "zh": "本條所載的關於海床和底土的權利，應按照第六部份的規定行使。"}], "keys": ["主權權利", "管轄權", "風力生產能", "適當顧及"], "plain": "沿海國在專屬經濟海域有三類權利：（a）{{主權權利}}：為探勘、開發、養護和管理上覆水域、海床和底土的自然資源（生物與非生物都包括），以及其他經濟性開發活動，例如利用海水、海流、風力生產能源；（b）管轄權：人工島嶼、設施和結構的建造使用、海洋科學研究、海洋環境保護保全，這三項依公約其他條款行使；（c）公約規定的其他權利義務。沿海國行使權利時應適當顧及其他國家的權利義務。關於海床和底土的權利，依第六部分（大陸礁層）行使。注意用語層次：領海是「主權」，專屬經濟海域是資源的「主權權利」加特定事項的「管轄權」。", "elements": [{"req": ["專屬經濟海域", "探勘、開發、養護、管理自然資源（生物或非生物）或其他經濟性開發活動"], "effect": "沿海國享有主權權利"}, {"req": ["人工島嶼設施結構、海洋科學研究、海洋環境保護保全"], "effect": "沿海國依公約有關條款享有管轄權"}, {"req": ["沿海國行使權利、履行義務"], "effect": "應適當顧及他國權利義務；海床底土權利依第六部分行使"}], "traps": ["陷阱：沿海國享有的是「主權權利」與特定事項的「管轄權」，不是主權（gl111a_7選項A錯誤）。", "陷阱：主權權利涵蓋生物與非生物資源，只說其中一種都錯（gl111a_7選項B、C）。", "陷阱：利用海水、海流和風力生產能源也屬沿海國主權權利（gl111a_7正解D），離岸風電即屬之。", "陷阱：管轄權只有三項：人工島嶼設施結構、海洋科學研究、海洋環境保護；軍事活動、一般航行不在其中。", "陷阱：海床和底土的權利依第六部分行使（第3項），所以專屬經濟海域內的海床礦產實際上適用大陸礁層制度。"], "custom": {"status": "習慣法", "note": "見第55條說明。", "cases": []}, "related": ["unclos-55", "unclos-57", "unclos-58", "unclos-60", "unclos-73", "unclos-77", "unclos-246"], "cases": [], "roc": "《中華民國專屬經濟海域及大陸礁層法》第5條：我國在專屬經濟海域或大陸礁層享有探勘、開發、養護、管理生物或非生物資源的主權權利，及人工島嶼設施結構、海洋科學研究、海洋環境保護的管轄權；並在專屬經濟海域享有利用海水、海流、風力所產生能源的主權權利。我國的離岸風電開發即以此為法律基礎。", "essay": "論沿海國專屬經濟海域權利：「依第56條第1項，沿海國享有(a)自然資源及其他經濟性開發活動之主權權利；(b)人工島嶼設施結構、海洋科學研究、海洋環境保護之管轄權；(c)其他權利義務。惟行使時應適當顧及他國權利義務（第2項），海床底土之權利依第六部分行使（第3項）。」", "exam": [{"qid": "gl111a_7", "note": "正解D：利用風力生產能源屬第1項(a)款的主權權利。A錯（是主權權利不是主權），B、C錯（生物與非生物資源都包括）。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項(a)款「自然資料」為錯字，依聯合國作準中文本更正為「自然資源」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "57", "heading": "專屬經濟海域的寬度", "tier": "A", "paras": [{"n": "", "en": "The exclusive economic zone shall not extend beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured.", "zh": "專屬經濟區從測算領海寬度的基線量起，不應超過二百海里。"}], "keys": ["二百海里", "基線量起"], "plain": "專屬經濟海域從領海基線量起，不超過200海里。領海已占前12海里，所以專屬經濟海域實際是12到200海里之間的海域；鄰接區（12到24海里）則重疊在專屬經濟海域範圍內。兩國海岸距離不到400海里時，主張會重疊，須依第74條劃界。", "elements": [{"req": ["自測算領海寬度的基線量起"], "effect": "專屬經濟海域外界不超過200海里"}], "traps": ["陷阱：200海里從「基線」量起，不是從領海外緣或鄰接區外緣量起（gl115a_10正解C）。", "陷阱：專屬經濟海域與鄰接區在空間上重疊；鄰接區的管制權與專屬經濟海域的資源權利併存。"], "custom": {"status": "習慣法", "note": "200海里寬度為普遍的國家實踐。", "cases": []}, "related": ["unclos-55", "unclos-3", "unclos-33", "unclos-74", "unclos-76", "unclos-121"], "cases": [], "roc": "《中華民國專屬經濟海域及大陸礁層法》第2條第1項：專屬經濟海域為鄰接領海外側至距離領海基線200浬間的海域。", "essay": "", "exam": [{"qid": "gl115a_10", "note": "正解C錯誤：專屬經濟海域自領海基線起算不超過200海里，不是自鄰接區外緣起算。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "58", "heading": "其他國家在專屬經濟海域的權利和義務", "tier": "A", "paras": [{"n": "1", "en": "In the exclusive economic zone, all States, whether coastal or land-locked, enjoy, subject to the relevant provisions of this Convention, the freedoms referred to in article 87 of navigation and overflight and of the laying of submarine cables and pipelines, and other internationally lawful uses of the sea related to these freedoms, such as those associated with the operation of ships, aircraft and submarine cables and pipelines, and compatible with the other provisions of this Convention.", "zh": "在專屬經濟區內，所有國家，不論為沿海國或內陸國，在本公約有關規定的限制下，享有第八十七條所指的航行和飛越的自由，鋪設海底電纜和管道的自由，以及與這些自由有關的海洋其他國際合法用途，諸如同船舶和飛機的操作及海底電纜和管道的使用有關的並符合本公約其他規定的那些用途。"}, {"n": "2", "en": "Articles 88 to 115 and other pertinent rules of international law apply to the exclusive economic zone in so far as they are not incompatible with this Part.", "zh": "第八十八至第一百一十五條以及其他國際法有關規則，只要與本部份不相牴觸，均適用於專屬經濟區。"}, {"n": "3", "en": "In exercising their rights and performing their duties under this Convention in the exclusive economic zone, States shall have due regard to the rights and duties of the coastal State and shall comply with the laws and regulations adopted by the coastal State in accordance with the provisions of this Convention and other rules of international law in so far as they are not incompatible with this Part.", "zh": "各國在專屬經濟區內根據本公約行使其權利和履行其義務時，應適當顧及沿海國的權利和義務，並應遵守沿海國按照本公約的規定和其他國際法規則所制定的與本部份不相牴觸的法律和規章。"}], "keys": ["航行和飛越的自由", "鋪設海底電纜和管道的自由", "適當顧及沿海國的權利和義務"], "plain": "在他國專屬經濟海域，所有國家（包括內陸國）享有第87條所指的航行、飛越、鋪設海底電纜和管道的自由，以及與這些自由有關、符合公約的其他國際合法用途（例如船舶、飛機的操作）。公海規定的第88至115條（例如船旗國專屬管轄、海盜）只要與第五部分不衝突，也適用於專屬經濟海域。各國行使這些自由時，應{{適當顧及}}沿海國的權利義務，並遵守沿海國依公約制定的法律規章。外國軍艦在他國專屬經濟海域從事軍事演習或偵察是否須經同意，是本條最大的爭議。", "elements": [{"req": ["所有國家（包括內陸國）", "在他國專屬經濟海域"], "effect": "享有第87條所指的航行、飛越、鋪設海底電纜管道自由及相關國際合法用途"}, {"req": ["第88至115條及其他國際法規則", "與第五部分不相牴觸"], "effect": "適用於專屬經濟海域"}, {"req": ["各國行使權利、履行義務"], "effect": "應適當顧及沿海國權利義務，並遵守沿海國依公約制定的法規"}], "traps": ["陷阱：在專屬經濟海域享有的是「航行自由」，不是「無害通過」（gl113a_6正解D）。", "陷阱：「適當顧及」是雙向的：沿海國要顧及他國（第56條第2項），他國也要顧及沿海國（本條第3項）。", "陷阱：在他國專屬經濟海域進行海洋科學研究須經沿海國同意（第246條），不屬航行自由。", "陷阱：軍事活動是否屬「其他國際合法用途」有爭議：美國等認為不需同意，中國、巴西、印度等主張須經同意或事先通知。"], "custom": {"status": "部分", "note": "航行、飛越與鋪設電纜管道自由適用於專屬經濟海域，已為國家實踐普遍接受；軍事活動的爭議仍未解決。", "cases": []}, "related": ["unclos-56", "unclos-87", "unclos-86", "unclos-59", "unclos-246", "unclos-297"], "cases": [], "roc": "", "essay": "論外國軍艦在專屬經濟海域的活動：「依第58條第1項，各國享有第87條所指航行、飛越自由及與其有關之其他國際合法用途，但應適當顧及沿海國權利（第3項）。軍事演習、偵察是否屬之，公約未明文規定；海權國家採肯定說，部分沿海國主張須經同意，可援引第59條以公平原則處理此類衝突。」", "exam": [{"qid": "gl113a_6", "note": "正解D：依本條，各國在專屬經濟海域享有第87條所指的航行自由。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第2項「不相牴觸均適用」依聯合國作準中文本補逗號。"}]});

ARTICLES.push({"treaty": "unclos", "no": "59", "heading": "專屬經濟海域權利歸屬衝突的解決基礎", "tier": "B", "paras": [{"n": "", "en": "In cases where this Convention does not attribute rights or jurisdiction to the coastal State or to other States within the exclusive economic zone, and a conflict arises between the interests of the coastal State and any other State or States, the conflict should be resolved on the basis of equity and in the light of all the relevant circumstances, taking into account the respective importance of the interests involved to the parties as well as to the international community as a whole.", "zh": "在本公約未將在專屬經濟區內的權利或管轄權歸屬於沿海國或其他國家而沿海國和任何其他一國或數國之間的利益發生衝突的情形下，這種衝突應在公平的基礎上參照一切有關情況，考慮到所涉利益分別對有關各方和整個國際社會的重要性，加以解決。"}], "keys": ["公平的基礎", "整個國際社會的重要性"], "plain": "公約沒有把某項權利或管轄權分配給沿海國或其他國家（所謂「{{剩餘權利}}」），而雙方利益發生衝突時，應在公平的基礎上，參照一切有關情況，考慮所涉利益對當事各方和整個國際社會的重要性來解決。本條沒有預設偏向沿海國或他國，常被用來討論外國在專屬經濟海域的軍事活動、水文測量等公約未明定的事項。", "elements": [{"req": ["公約未將專屬經濟海域內某項權利或管轄權歸屬於沿海國或他國", "沿海國與他國的利益發生衝突"], "effect": "應在公平基礎上，參照一切有關情況及利益對各方與國際社會的重要性解決"}], "traps": ["陷阱：本條不是推定剩餘權利屬於沿海國，也不是推定屬於公海自由，而是個案依公平原則解決。"], "custom": {"status": "不適用", "note": "條約規定。", "cases": []}, "related": ["unclos-55", "unclos-56", "unclos-58"], "cases": [], "roc": "", "essay": "", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B]});

ARTICLES.push({"treaty": "unclos", "no": "60", "heading": "專屬經濟海域內的人工島嶼、設施和結構", "tier": "A", "paras": [{"n": "1", "en": "In the exclusive economic zone, the coastal State shall have the exclusive right to construct and to authorize and regulate the construction, operation and use of:\n(a) artificial islands;\n(b) installations and structures for the purposes provided for in article 56 and other economic purposes;\n(c) installations and structures which may interfere with the exercise of the rights of the coastal State in the zone.", "zh": "沿海國在專屬經濟區內應有專屬權利建造並授權和管理建造、操作和使用：\n(a)人工島嶼；\n(b)為第五十六條所規定的目的和其他經濟目的的設施和結構；\n(c)可能干擾沿海國在區內行使權利的設施和結構。"}, {"n": "2", "en": "The coastal State shall have exclusive jurisdiction over such artificial islands, installations and structures, including jurisdiction with regard to customs, fiscal, health, safety and immigration laws and regulations.", "zh": "沿海國對這種人工島嶼、設施和結構應有專屬管轄權，包括有關海關、財政、衛生、安全和移民的法律和規章方面的管轄權。"}, {"n": "3", "en": "Due notice must be given of the construction of such artificial islands, installations or structures, and permanent means for giving warning of their presence must be maintained. Any installations or structures which are abandoned or disused shall be removed to ensure safety of navigation, taking into account any generally accepted international standards established in this regard by the competent international organization. Such removal shall also have due regard to fishing, the protection of the marine environment and the rights and duties of other States. Appropriate publicity shall be given to the depth, position and dimensions of any installations or structures not entirely removed.", "zh": "這種人工島嶼、設施或結構的建造，必須妥為通知，並對其存在必須維持永久性的警告方法。已被放棄或不再使用的任何設施或結構，應予以撤除，以確保航行安全，同時考慮到主管國際組織在這方面制訂的任何為一般所接受的國際標準。這種撤除也應適當地考慮到捕魚、海洋環境的保護和其他國家的權利和義務。尚未全部撤除的任何設施或結構的深度、位置和大小應妥為公佈。"}, {"n": "4", "en": "The coastal State may, where necessary, establish reasonable safety zones around such artificial islands, installations and structures in which it may take appropriate measures to ensure the safety both of navigation and of the artificial islands, installations and structures.", "zh": "沿海國可於必要時在這種人工島嶼、設施和結構的周圍設置合理的安全地帶，並可在該地帶中採取適當措施以確保航行以及人工島嶼、設施和結構的安全。"}, {"n": "5", "en": "The breadth of the safety zones shall be determined by the coastal State, taking into account applicable international standards. Such zones shall be designed to ensure that they are reasonably related to the nature and function of the artificial islands, installations or structures, and shall not exceed a distance of 500 metres around them, measured from each point of their outer edge, except as authorized by generally accepted international standards or as recommended by the competent international organization. Due notice shall be given of the extent of safety zones.", "zh": "安全地帶的寬度應由沿海國參照可適用的國際標準加以確定。這種地帶的設置應確保其與人工島嶼、設施或結構的性質和功能有合理的關聯；這種地帶從人工島嶼、設施或結構的外緣各點量起，不應超過這些人工島嶼、設施或結構周圍五百公尺的距離，但為一般接受的國際標準所許可或主管國際組織所建議者除外。安全地帶的範圍應妥為通知。"}, {"n": "6", "en": "All ships must respect these safety zones and shall comply with generally accepted international standards regarding navigation in the vicinity of artificial islands, installations, structures and safety zones.", "zh": "一切船舶都必須尊重這些安全地帶，並應遵守關於在人工島嶼、設施、結構和安全地帶附近航行的一般接受的國際標準。"}, {"n": "7", "en": "Artificial islands, installations and structures and the safety zones around them may not be established where interference may be caused to the use of recognized sea lanes essential to international navigation.", "zh": "人工島嶼、設施和結構及其周圍的安全地帶，不得設在對使用國際航行必經的公認海道可能有干擾的地方。"}, {"n": "8", "en": "Artificial islands, installations and structures do not possess the status of islands. They have no territorial sea of their own, and their presence does not affect the delimitation of the territorial sea, the exclusive economic zone or the continental shelf.", "zh": "人工島嶼、設施和結構不具有島嶼地位。它們沒有自己的領海，其存在也不影響領海、專屬經濟區或大陸架界限的劃定。"}], "keys": ["人工島嶼", "專屬管轄權", "安全地帶", "五百公尺", "不具有島嶼地位"], "plain": "沿海國在專屬經濟海域有專屬權利建造並授權管理：人工島嶼、為第56條目的或其他經濟目的的設施和結構、可能干擾其權利行使的設施和結構；並對它們有專屬管轄權（包括海關、財政、衛生、安全和移民法規）。建造須妥為通知並維持警告；廢棄設施應撤除以確保航行安全。沿海國可在周圍設置合理的安全地帶，寬度原則不超過500公尺。這些設施不得設在國際航行必經的公認海道上。最常考的是第8項：人工島嶼、設施和結構不具有島嶼地位，沒有自己的領海，也不影響領海、專屬經濟海域或大陸礁層的劃界。大陸礁層上的人工島嶼準用本條（第80條）。", "elements": [{"req": ["專屬經濟海域內的人工島嶼、設施和結構"], "effect": "沿海國有專屬建造、授權管理的權利及專屬管轄權（含海關、財政、衛生、安全、移民）"}, {"req": ["沿海國認為必要"], "effect": "得在周圍設合理安全地帶，原則不超過500公尺，並應妥為通知"}, {"req": ["人工島嶼、設施和結構"], "effect": "不具有島嶼地位，沒有領海，不影響海域劃界"}], "traps": ["陷阱：人工島嶼「不具有島嶼地位」，沒有領海，也不影響劃界（gl113a_8選項C正確）。", "陷阱：以人工方式填高低潮高地，不能取得島嶼地位或領土主權（SG026正解C；南海仲裁案亦同此見解）。", "陷阱：安全地帶原則上不超過500公尺，不是500海里，也不是12海里。", "陷阱：人工島嶼的管轄事項包括海關、財政、衛生、安全、移民，比鄰接區的四類（海關、財政、移民、衛生）多了「安全」。"], "custom": {"status": "部分", "note": "人工島嶼不產生海域的原則已獲國際判決肯認；南海仲裁案（2016）認定人工改造不能改變海洋地物的原始地位。", "cases": []}, "related": ["unclos-56", "unclos-80", "unclos-121", "unclos-13", "unclos-147", "unclos-111"], "cases": [], "roc": "《中華民國專屬經濟海域及大陸礁層法》第5條第1項第2款：我國享有人工島嶼、設施或結構之建造、使用、改變或拆除的管轄權。離岸風力發電機組即屬設施或結構。", "essay": "論人工島嶼的法律地位：「依第60條第8項，人工島嶼、設施和結構不具有島嶼地位，沒有自己的領海，其存在也不影響領海、專屬經濟海域或大陸礁層界限之劃定；南海仲裁案（2016）並認定，人工建設不能使低潮高地或岩礁升格為島嶼（第121條）。」", "exam": [{"qid": "gl113a_8", "note": "選項C（人工島嶼不具有島嶼地位）依本條第8項為正確敘述；正解A。"}, {"qid": "SG026", "note": "正解C錯誤：依本條第8項，人工島嶼不具有島嶼地位；以人工方式改造專屬經濟海域內的低潮高地，不能取得領土主權。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「國際標準，這種撤除」依聯合國作準中文本改為句號。"}]});

ARTICLES.push({"treaty": "unclos", "no": "73", "heading": "沿海國漁業法規的執行", "tier": "A", "paras": [{"n": "1", "en": "The coastal State may, in the exercise of its sovereign rights to explore, exploit, conserve and manage the living resources in the exclusive economic zone, take such measures, including boarding, inspection, arrest and judicial proceedings, as may be necessary to ensure compliance with the laws and regulations adopted by it in conformity with this Convention.", "zh": "沿海國行使其勘探、開發、養護和管理在專屬經濟區內的生物資源的主權權利時，可採取為確保其依照本公約制定的法律和規章得到遵守所必要的措施，包括登臨、檢查、逮捕和進行司法程序。"}, {"n": "2", "en": "Arrested vessels and their crews shall be promptly released upon the posting of reasonable bond or other security.", "zh": "被逮捕的船隻及其船員，在提出適當的保證書或其他擔保後，應迅速獲得釋放。"}, {"n": "3", "en": "Coastal State penalties for violations of fisheries laws and regulations in the exclusive economic zone may not include imprisonment, in the absence of agreements to the contrary by the States concerned, or any other form of corporal punishment.", "zh": "沿海國對於在專屬經濟區內違犯漁業法律和規章的處罰，如有關國家無相反的協議，不得包括監禁，或任何其他方式的體罰。"}, {"n": "4", "en": "In cases of arrest or detention of foreign vessels the coastal State shall promptly notify the flag State, through appropriate channels, of the action taken and of any penalties subsequently imposed.", "zh": "在逮捕或扣留外國船隻的情形下，沿海國應通過適當途徑將其所採取的行動及隨後所施加的任何處罰迅速通知船旗國。"}], "keys": ["登臨、檢查、逮捕", "迅速獲得釋放", "不得包括監禁", "通知船旗國"], "plain": "沿海國為行使專屬經濟海域生物資源的主權權利，可以採取必要措施確保其漁業法規被遵守，包括登臨、檢查、逮捕和司法程序。但有三個保護外國漁船與船員的限制：①被逮捕的船隻和船員，在提出合理的保證金或其他擔保後應{{迅速釋放}}，沿海國不釋放時，船旗國可依第292條向法院或法庭聲請；②違反漁業法規的處罰，除有關國家另有協議外，不得包括監禁或其他任何形式的體罰；③逮捕或扣留外國船隻時，應迅速通知船旗國。本條只適用於生物資源（漁業）執法。", "elements": [{"req": ["沿海國行使專屬經濟海域生物資源的主權權利"], "effect": "得採取必要措施，包括登臨、檢查、逮捕和司法程序"}, {"req": ["船隻及船員被逮捕", "已提出合理保證金或其他擔保"], "effect": "應迅速釋放；未釋放時船旗國得依第292條聲請"}, {"req": ["違反專屬經濟海域漁業法規", "有關國家間無相反協議"], "effect": "處罰不得包括監禁或任何其他方式的體罰"}, {"req": ["逮捕或扣留外國船隻"], "effect": "應迅速通知船旗國所採行動及隨後的處罰"}], "traps": ["陷阱：專屬經濟海域漁業違規的處罰原則上不得監禁；在「領海」內非法捕魚則不受本條限制。", "陷阱：迅速釋放的聲請只能由船旗國或以其名義提出（第292條第2項），法庭不能依職權為之（SG020選項D錯誤）。", "陷阱：本條限於生物資源執法；違反專屬經濟海域環境法規的執法另依第220、226、230條。", "陷阱：國際海洋法法庭在塞加號案（1999）認為執法應盡量避免使用武力，不可避免時也不得超過合理且必要的程度。"], "custom": {"status": "部分", "note": "沿海國漁業執法權已為普遍實踐；迅速釋放與禁止監禁是公約特有的保障。國際海洋法法庭早期受理的案件多為依第292條聲請的迅速釋放案。", "cases": []}, "related": ["unclos-56", "unclos-62", "unclos-111", "unclos-292", "unclos-297", "unclos-220"], "cases": [], "roc": "2013年5月9日，我國漁船「廣大興28號」在臺菲專屬經濟海域重疊海域遭菲律賓海巡人員開槍射擊，船員洪石成身亡。臺菲其後於2015年11月5日簽署《臺菲有關促進漁業事務執法合作協定》，三項共識為：避免使用暴力或不必要的武力、建立緊急通報機制、建立迅速釋放機制。", "essay": "論沿海國漁業執法的界限：「依第73條，沿海國得登臨、檢查、逮捕並進行司法程序，但被捕船員於提出合理擔保後應迅速釋放（第2項），處罰不得包括監禁或體罰（第3項），並應迅速通知船旗國（第4項）；使用武力須合理且必要（塞加號案，1999）。」", "exam": [{"qid": "SG020", "note": "選項D錯誤：迅速釋放須由船旗國或以其名義聲請（第292條第2項），法庭不能依職權裁定；本條第2項是迅速釋放的實體依據。正解C。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項句末冒號依聯合國作準中文本改為句號；第2項「保書」補正為「保證書」；第4項「沿海貫」更正為「沿海國」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "74", "heading": "海岸相向或相鄰國家間專屬經濟海域界限的劃定", "tier": "A", "paras": [{"n": "1", "en": "The delimitation of the exclusive economic zone between States with opposite or adjacent coasts shall be effected by agreement on the basis of international law, as referred to in Article 38 of the Statute of the International Court of Justice, in order to achieve an equitable solution.", "zh": "海岸相向或相鄰的國家間專屬經濟區的界限，應在國際法院規約第三十八條所指國際法的基礎上以協議劃定，以便得到公平解決。"}, {"n": "2", "en": "If no agreement can be reached within a reasonable period of time, the States concerned shall resort to the procedures provided for in Part XV.", "zh": "有關國家如在合理期間內未能達成任何協議，應訴諸第十五部份所規定的程序。"}, {"n": "3", "en": "Pending agreement as provided for in paragraph 1, the States concerned, in a spirit of understanding and cooperation, shall make every effort to enter into provisional arrangements of a practical nature and, during this transitional period, not to jeopardize or hamper the reaching of the final agreement. Such arrangements shall be without prejudice to the final delimitation.", "zh": "在達成第一款規定的協議以前，有關各國應基於諒解和合作精神，盡一切努力作出實際性的臨時安排，並在此過渡期間內，不危害或阻礙最後協議的達成。這種安排應不妨害最後界限的劃定。"}, {"n": "4", "en": "Where there is an agreement in force between the States concerned, questions relating to the delimitation of the exclusive economic zone shall be determined in accordance with the provisions of that agreement.", "zh": "如果有關國家間存在現行有效的協定，關於劃定專屬經濟區界限的問題，應按照該協定的規定加以決定。"}], "keys": ["國際法院規約第三十八條", "協議劃定", "公平解決", "臨時安排"], "plain": "兩國專屬經濟海域重疊時，界線應在國際法（規約第38條所指的法源）的基礎上以協議劃定，目標是「公平解決」。條文沒有規定任何劃界方法（例如等距線），這是會議上「等距線派」與「公平原則派」妥協的結果。合理期間內談不成，應訴諸第十五部分的爭端解決程序（但締約國可依第298條第1項(a)款聲明排除強制程序）。達成協議前，各國應基於諒解和合作精神，盡一切努力作出實際性的臨時安排，過渡期間不得危害或阻礙最後協議，臨時安排也不妨害最後劃界。實務上，國際法院以{{三階段劃界法}}操作「公平解決」。第83條（大陸礁層）文字幾乎相同。", "elements": [{"req": ["海岸相向或相鄰國家的專屬經濟海域重疊"], "effect": "應在國際法基礎上以協議劃定，以達成公平解決"}, {"req": ["合理期間內未能達成協議"], "effect": "應訴諸第十五部分程序（可能受第298條聲明排除）"}, {"req": ["達成協議前"], "effect": "應盡力作實際性臨時安排，不得危害或阻礙最後協議；臨時安排不妨害最後劃界"}, {"req": ["有關國家間有現行有效的協定"], "effect": "依該協定決定"}], "traps": ["陷阱：第74、83條只要求以協議劃定、達成公平解決，沒有明定等距線；明文規定中間線的是第15條（領海）。", "陷阱：臨時安排不妨害最後界限的劃定，所以簽臨時漁業協定不等於承認對方的海域主張。", "陷阱：劃界爭端可依第298條第1項(a)款聲明排除強制程序（SG036正解C），中國即已作此聲明。"], "custom": {"status": "習慣法", "note": "國際法院在多個判決中認定第74、83條反映習慣國際法；實務上兩條通常合併適用於單一海域界線。", "cases": ["north-sea"]}, "related": ["unclos-83", "unclos-15", "unclos-57", "unclos-298", "unclos-121", "icj-38"], "cases": [{"id": "black-sea", "point": "法院一致劃定兩國大陸礁層與專屬經濟海域的單一界線，並系統化提出三階段劃界法：暫定等距線、依相關情況調整、不成比例檢驗。"}], "roc": "《中華民國專屬經濟海域及大陸礁層法》第4條：專屬經濟海域或大陸礁層與相鄰或相向國家重疊時，分界線依衡平原則以協議劃定；協議未達成前，得基於諒解及合作之精神作成過渡時期的臨時安排，臨時安排不妨礙最後分界線的劃定。2013年4月10日簽署的《臺日漁業協議》在重疊海域劃設雙方漁船可作業的水域，屬不涉及劃界的實際性臨時安排。", "essay": "論海洋劃界：「專屬經濟海域與大陸礁層之劃界，依第74、83條應在國際法基礎上以協議劃定，以達成公平解決；未能協議時訴諸第十五部分程序，協議前應作實際性臨時安排。國際法院於[[case|black-sea|黑海劃界案]]（2009）採三階段劃界法：①劃暫定等距線；②審酌相關情況調整；③不成比例檢驗。」", "exam": [{"qid": "SG036", "note": "正解C：依第298條第1項(a)款，締約國得書面聲明就第15、74、83條的劃界爭端不接受強制程序；本條第2項所稱第十五部分程序即受此限制。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第1項「相鄰國家間」依聯合國作準中文本作「相鄰的國家間」；第3項「諒解和合作的精神」依作準本作「諒解和合作精神」，「達成，這種安排」改為句號。"}]});

ARTICLES.push({"treaty": "unclos", "no": "76", "heading": "大陸礁層的定義", "tier": "A", "paras": [{"n": "1", "en": "The continental shelf of a coastal State comprises the seabed and subsoil of the submarine areas that extend beyond its territorial sea throughout the natural prolongation of its land territory to the outer edge of the continental margin, or to a distance of 200 nautical miles from the baselines from which the breadth of the territorial sea is measured where the outer edge of the continental margin does not extend up to that distance.", "zh": "沿海國的大陸架包括其領海以外依其陸地領土的全部自然延伸，擴展到大陸邊外緣的海底區域的海床和底土，如果從測算領海寬度的基線量起到大陸邊的外緣的距離不到二百海里，則擴展到二百海里的距離。"}, {"n": "2", "en": "The continental shelf of a coastal State shall not extend beyond the limits provided for in paragraphs 4 to 6.", "zh": "沿海國的大陸架不應擴展到第四至第六款所規定的界限以外。"}, {"n": "3", "en": "The continental margin comprises the submerged prolongation of the land mass of the coastal State, and consists of the seabed and subsoil of the shelf, the slope and the rise. It does not include the deep ocean floor with its oceanic ridges or the subsoil thereof.", "zh": "大陸邊包括沿海國陸塊沒入水中的延伸部分，由陸架、陸坡和陸基的海床和底土構成，它不包括深洋洋底及其洋脊，也不包括其底土。"}, {"n": "4", "en": "(a) For the purposes of this Convention, the coastal State shall establish the outer edge of the continental margin wherever the margin extends beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured, by either:\n(i) a line delineated in accordance with paragraph 7 by reference to the outermost fixed points at each of which the thickness of sedimentary rocks is at least 1 per cent of the shortest distance from such point to the foot of the continental slope; or\n(ii) a line delineated in accordance with paragraph 7 by reference to fixed points not more than 60 nautical miles from the foot of the continental slope.\n(b) In the absence of evidence to the contrary, the foot of the continental slope shall be determined as the point of maximum change in the gradient at its base.", "zh": "(a)為本公約的目的，在大陸邊從測算領海寬度的基線量起超過二百海里的任何情形下，沿海國應以下列兩種方式之一，劃定大陸邊的外緣：\n(1)按照第七款，以最外各定點為準劃定界線，每一定點上沉積岩厚度至少為從該點至大陸坡腳最短距離的百分之一；或\n(2)按照第七款，以離大陸坡腳的距離不超過六十海里的各定點為準劃定界線。\n(b)在沒有相反證明的情形下，大陸坡腳應定為大陸坡底坡度變動最大之點。"}, {"n": "5", "en": "The fixed points comprising the line of the outer limits of the continental shelf on the seabed, drawn in accordance with paragraph 4 (a)(i) and (ii), either shall not exceed 350 nautical miles from the baselines from which the breadth of the territorial sea is measured or shall not exceed 100 nautical miles from the 2,500 metre isobath, which is a line connecting the depth of 2,500 metres.", "zh": "組成按照第四款(a)項(1)和(2)目劃定的大陸架在海床上的外部界線的各定點，不應超過從測算領海寬度的基線量起三百五十海里，或不應超過連接二千五百公尺深度各點的二千五百公尺等深線一百海里。"}, {"n": "6", "en": "Notwithstanding the provisions of paragraph 5, on submarine ridges, the outer limit of the continental shelf shall not exceed 350 nautical miles from the baselines from which the breadth of the territorial sea is measured. This paragraph does not apply to submarine elevations that are natural components of the continental margin, such as its plateaux, rises, caps, banks and spurs.", "zh": "雖有第五款的規定，在海底洋脊上的大陸架外部界限不應超過從測算領海寬度的基線量起三百五十海里。本款規定不適用於作為大陸邊自然構成部分的海臺、海隆、海峰、暗灘和坡尖等海底高地。"}, {"n": "7", "en": "The coastal State shall delineate the outer limits of its continental shelf, where that shelf extends beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured, by straight lines not exceeding 60 nautical miles in length, connecting fixed points, defined by coordinates of latitude and longitude.", "zh": "沿海國的大陸架如從測算領海寬度的基線量起超過二百海里，應連接以經緯度座標標出的各定點劃出長度各不超過六十海里的若干直線，劃定其大陸架的外部界限。"}, {"n": "8", "en": "Information on the limits of the continental shelf beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured shall be submitted by the coastal State to the Commission on the Limits of the Continental Shelf set up under Annex II on the basis of equitable geographical representation. The Commission shall make recommendations to coastal States on matters related to the establishment of the outer limits of their continental shelf. The limits of the shelf established by a coastal State on the basis of these recommendations shall be final and binding.", "zh": "從測算領海寬度的基線量起二百海里以外大陸架界限的情報應由沿海國提交根據附件二在公平地區代表制基礎上成立的大陸架界限委員會。委員會應就有關劃定大陸架外部界限的事項向沿海國提出建議，沿海國在這些建議的基礎上劃定的大陸架界限應有確定性和拘束力。"}, {"n": "9", "en": "The coastal State shall deposit with the Secretary-General of the United Nations charts and relevant information, including geodetic data, permanently describing the outer limits of its continental shelf. The Secretary-General shall give due publicity thereto.", "zh": "沿海國應將永久標明其大陸架外部界限的海圖和有關情報，包括大地基準點，交存於聯合國秘書長。秘書長應將這些情報妥為公佈。"}, {"n": "10", "en": "The provisions of this article are without prejudice to the question of delimitation of the continental shelf between States with opposite or adjacent coasts.", "zh": "本條的規定不妨害海岸相向或相鄰國家間大陸架界限劃定的問題。"}], "keys": ["全部自然延伸", "大陸邊外緣", "二百海里", "三百五十海里", "二千五百公尺等深線", "大陸架界限委員會", "確定性和拘束力"], "plain": "{{大陸礁層}}是沿海國領海以外、陸地領土全部自然延伸到{{大陸邊}}外緣的海床和底土。有兩個標準：①距離標準：大陸邊外緣不到200海里時，一律擴展到200海里（即使地質上沒有延伸）；②自然延伸標準：大陸邊超過200海里時，可依第4項的兩種公式（沉積岩厚度公式、離大陸坡腳60海里公式）劃定外緣，但外部界限不得超過離基線350海里，或不得超過2,500公尺等深線外100海里（兩者擇一，第5項）；在海底洋脊上則一律不超過350海里（第6項）。200海里以外的界限，沿海國須將資料提交{{大陸礁層界限委員會}}，委員會提出建議，沿海國以建議為基礎劃定的界限才有確定性和拘束力（第8項）。本條不影響相向或相鄰國家間的劃界（第10項，見第83條）。", "elements": [{"req": ["領海以外", "陸地領土的自然延伸至大陸邊外緣"], "effect": "為大陸礁層"}, {"req": ["大陸邊外緣距基線不到200海里"], "effect": "大陸礁層擴展到200海里"}, {"req": ["大陸邊超過200海里", "依第4項公式劃定外緣"], "effect": "外部界限不超過350海里，或不超過2,500公尺等深線外100海里（海底洋脊上限350海里）"}, {"req": ["200海里以外的界限資料提交大陸礁層界限委員會", "沿海國以委員會建議為基礎劃定"], "effect": "該界限有確定性和拘束力"}], "traps": ["陷阱：大陸邊超過200海里時，沿海國可主張200海里以外的大陸礁層，不是「僅得主張200海里」（SG017選項A錯誤）。", "陷阱：只有200海里以外的界限須提交大陸礁層界限委員會，且委員會只提「建議」；說所有大陸礁層主張都須經委員會「核定」才有拘束力是錯的（SG017選項B）。", "陷阱：350海里與「2,500公尺等深線外100海里」是兩個擇一的上限，非洋脊的情形外部界限可能超過350海里；說大陸礁層「至多不得超過350海里」並不精確（gl115a_10選項D）。", "陷阱：大陸礁層的法律定義與地質定義不同：200海里內不論地形一律享有。"], "custom": {"status": "部分", "note": "200海里距離標準與自然延伸概念已獲普遍接受；200海里以外的具體公式與委員會程序是公約創設。", "cases": ["north-sea"]}, "related": ["unclos-77", "unclos-82", "unclos-83", "unclos-57", "unclos-121", "unclos-78"], "cases": [{"id": "north-sea", "point": "法院以「陸地領土的自然延伸」作為沿海國大陸礁層權利的基礎；本條第1項沿用此一概念，另加200海里距離標準。"}], "roc": "《中華民國專屬經濟海域及大陸礁層法》第2條第3項：我國大陸礁層為領海以外依陸地領土自然延伸至大陸邊外緣的海底區域。我國不是公約締約方，無法向大陸礁層界限委員會提交劃界案。", "essay": "論大陸礁層範圍：「依第76條，大陸礁層為陸地領土自然延伸至大陸邊外緣之海床及底土，不足200海里者擴展至200海里；超過者依第4項公式劃定，惟不得超過350海里或2,500公尺等深線外100海里（洋脊上限350海里）。200海里外界限須經大陸礁層界限委員會建議，沿海國據以劃定者具確定性與拘束力。」", "exam": [{"qid": "SG017", "note": "A錯：大陸邊超過200海里時可主張至第5項的上限；B錯：只有200海里以外的界限須提交委員會，且委員會只提建議。正解C（見第82條）。"}, {"qid": "gl115a_10", "note": "選項D（大陸礁層至多不超過350海里）被當作正確敘述，但依第5項另有「2,500公尺等深線外100海里」的替代上限，嚴格而言不精確；本題正解C。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）中文本「海浬」依聯合國作準中文本及本公約其他條文統一為「海里」；第4項(a)款(1)目「百分之一或；」更正為「百分之一；或」；(b)款「大陸坡坡底」依作準本作「大陸坡底」；第6項「量超」更正為「量起」；第9項「有關情報。包括」改為逗號。"}]});

ARTICLES.push({"treaty": "unclos", "no": "77", "heading": "沿海國對大陸礁層的權利", "tier": "A", "paras": [{"n": "1", "en": "The coastal State exercises over the continental shelf sovereign rights for the purpose of exploring it and exploiting its natural resources.", "zh": "沿海國為勘探大陸架和開發其自然資源的目的，對大陸架行使主權權利。"}, {"n": "2", "en": "The rights referred to in paragraph 1 are exclusive in the sense that if the coastal State does not explore the continental shelf or exploit its natural resources, no one may undertake these activities without the express consent of the coastal State.", "zh": "第一款所指的權利是專屬性的，即：如果沿海國不勘探大陸架或開發其自然資源，任何人未經沿海國明示同意，均不得從事這種活動。"}, {"n": "3", "en": "The rights of the coastal State over the continental shelf do not depend on occupation, effective or notional, or on any express proclamation.", "zh": "沿海國對大陸架的權利並不取決於有效或象徵的占領或任何明文公告。"}, {"n": "4", "en": "The natural resources referred to in this Part consist of the mineral and other non-living resources of the seabed and subsoil together with living organisms belonging to sedentary species, that is to say, organisms which, at the harvestable stage, either are immobile on or under the seabed or are unable to move except in constant physical contact with the seabed or the subsoil.", "zh": "本部份所指的自然資源包括海床和底土的礦物和其他非生物資源，以及屬於定居種的生物，即在可捕撈階段海床上或海床下不能移動或其軀體須與海床或底土保持接觸才能移動的生物。"}], "keys": ["主權權利", "專屬性", "明示同意", "明文公告", "定居種"], "plain": "沿海國為探勘大陸礁層和開發其自然資源，對大陸礁層行使主權權利。這種權利有三個特點：①專屬性：沿海國自己不探勘不開發，別人未經其明示同意也不能做；②固有性：不取決於有效或象徵的占領，也不需要任何明文公告（北海大陸礁層案所說「當然且自始」存在）；③範圍：自然資源包括海床底土的礦物與其他非生物資源，以及{{定居種}}生物（在可捕撈階段固著於海床，或須與海床保持接觸才能移動的生物，例如珊瑚、貝類）。游動的魚類不屬大陸礁層資源，而是專屬經濟海域或公海的漁業資源。", "elements": [{"req": ["為探勘大陸礁層及開發其自然資源"], "effect": "沿海國行使主權權利"}, {"req": ["沿海國未探勘或開發"], "effect": "任何人未經其明示同意不得從事"}, {"req": ["沿海國對大陸礁層的權利"], "effect": "不取決於有效或象徵的占領或任何明文公告"}, {"req": ["海床底土的礦物和非生物資源，或定居種生物"], "effect": "屬大陸礁層的自然資源"}], "traps": ["陷阱：大陸礁層權利不需宣告或占領即存在；專屬經濟海域則需沿海國主張。", "陷阱：大陸礁層的生物資源只限「定居種」；能離開海床游動的底棲魚類不是定居種。", "陷阱：沿海國享有的是「主權權利」，不是主權；上覆水域與上空的法律地位不受影響（第78條）。"], "custom": {"status": "習慣法", "note": "北海大陸礁層案（1969）認定沿海國對大陸礁層的權利「當然且自始」存在，屬習慣法；1945年杜魯門公告是此一制度的起點。", "cases": ["north-sea"]}, "related": ["unclos-76", "unclos-78", "unclos-79", "unclos-81", "unclos-56", "unclos-68"], "cases": [{"id": "north-sea", "point": "法院指出沿海國對構成其陸地領土自然延伸的大陸礁層，享有當然且自始存在的固有權利，不需占領或宣告；本條第3項即此見解的明文化。"}], "roc": "《中華民國專屬經濟海域及大陸礁層法》第5條第1項第1款、第3項：我國在大陸礁層享有探勘、開發、養護、管理生物或非生物資源的主權權利，並享有舖設、維護或變更海底電纜或管線的管轄權。", "essay": "論大陸礁層與專屬經濟海域之區別：「大陸礁層權利為固有權利，不取決於占領或明文公告（第77條第3項），專屬經濟海域則須主張；大陸礁層權利限於海床底土之非生物資源及定居種（第77條第4項），專屬經濟海域則及於上覆水域生物資源；大陸礁層得延伸至200海里以外（第76條），專屬經濟海域以200海里為限（第57條）。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第4項「在可捕撈階段在海床上」依聯合國作準中文本作「在可捕撈階段海床上」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "82", "heading": "開發200海里以外大陸礁層應繳的費用和實物", "tier": "B", "paras": [{"n": "1", "en": "The coastal State shall make payments or contributions in kind in respect of the exploitation of the non-living resources of the continental shelf beyond 200 nautical miles from the baselines from which the breadth of the territorial sea is measured.", "zh": "沿海國對從測算領海寬度的基線量起二百海里以外的大陸架上的非生物資源的開發，應繳付費用或實物。"}, {"n": "2", "en": "The payments and contributions shall be made annually with respect to all production at a site after the first five years of production at that site. For the sixth year, the rate of payment or contribution shall be 1 per cent of the value or volume of production at the site. The rate shall increase by 1 per cent for each subsequent year until the twelfth year and shall remain at 7 per cent thereafter. Production does not include resources used in connection with exploitation.", "zh": "在某一礦址進行第一個五年生產以後，對該礦址的全部生產應每年繳付費用和實物。第六年繳付費用或實物的比率應為礦址產值或產量的百分之一。此後該比率每年增加百分之一，至第十二年為止，其後比率應保持為百分之七。產品不包括供開發用途的資源。"}, {"n": "3", "en": "A developing State which is a net importer of a mineral resource produced from its continental shelf is exempt from making such payments or contributions in respect of that mineral resource.", "zh": "某一發展中國家如果是其大陸架上所生產的某種礦物資源的純輸入者，對該種礦物資源免繳這種費用或實物。"}, {"n": "4", "en": "The payments or contributions shall be made through the Authority, which shall distribute them to States Parties to this Convention, on the basis of equitable sharing criteria, taking into account the interests and needs of developing States, particularly the least developed and the land-locked among them.", "zh": "費用或實物應通過管理局繳納。管理局應根據公平分享的標準將其分配給本公約各締約國，同時考慮到發展中國家的利益和需要，特別是其中最不發達的國家和內陸國的利益和需要。"}], "keys": ["費用或實物", "百分之七", "純輸入者", "管理局"], "plain": "沿海國開發200海里以外大陸礁層的非生物資源（例如石油、天然氣），要向國際海床管理局繳付費用或實物，這是對「區域」人類共同繼承財產理念的妥協。某礦址前5年免繳；第6年起按礦址產值或產量的1%，每年增加1%，到第12年達7%後維持不變；開發本身所用的資源不計入。發展中國家若是該礦物的純輸入國，免繳。費用或實物透過管理局繳納，由管理局依公平分享標準分配給各締約國，特別考慮發展中國家、最不發達國家和內陸國。", "elements": [{"req": ["開發200海里以外大陸礁層的非生物資源", "礦址生產滿5年"], "effect": "自第6年起每年繳付費用或實物，比率1%逐年加1%，第12年起為7%"}, {"req": ["發展中國家", "為該礦物資源的純輸入者"], "effect": "就該礦物免繳"}, {"req": ["繳付費用或實物"], "effect": "透過管理局繳納，依公平分享標準分配給締約國，特別考慮發展中國家與內陸國"}], "traps": ["陷阱：繳付方式是「費用或實物」，沿海國可以選擇以金錢或實物繳納（SG017正解C）。", "陷阱：內陸國雖沒有大陸礁層，仍可依第4項分配這些費用或實物（SG017選項D錯誤）。", "陷阱：只有200海里以外的大陸礁層開發要繳；200海里以內不用。", "陷阱：只限「非生物資源」；採捕定居種不必繳。"], "custom": {"status": "不適用", "note": "公約創設的條約義務，國際海床管理局仍在研議執行方式。", "cases": []}, "related": ["unclos-76", "unclos-77", "unclos-136", "unclos-140", "unclos-156"], "cases": [], "roc": "", "essay": "", "exam": [{"qid": "SG017", "note": "正解C：依第1項，沿海國應繳付「費用或實物」，可選擇方式；D錯，第4項明定分配時特別考慮內陸國。"}], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）標題與第1項「海浬」依聯合國作準中文本統一為「海里」。"}]});

ARTICLES.push({"treaty": "unclos", "no": "83", "heading": "海岸相向或相鄰國家間大陸礁層界限的劃定", "tier": "A", "paras": [{"n": "1", "en": "The delimitation of the continental shelf between States with opposite or adjacent coasts shall be effected by agreement on the basis of international law, as referred to in Article 38 of the Statute of the International Court of Justice, in order to achieve an equitable solution.", "zh": "海岸相向或相鄰國家間大陸架的界限，應在國際法院規約第三十八條所指國際法的基礎上以協議劃定，以便得到公平解決。"}, {"n": "2", "en": "If no agreement can be reached within a reasonable period of time, the States concerned shall resort to the procedures provided for in Part XV.", "zh": "有關國家如在合理期間內未能達成任何協議，應訴諸第十五部份所規定的程序。"}, {"n": "3", "en": "Pending agreement as provided for in paragraph 1, the States concerned, in a spirit of understanding and cooperation, shall make every effort to enter into provisional arrangements of a practical nature and, during this transitional period, not to jeopardize or hamper the reaching of the final agreement. Such arrangements shall be without prejudice to the final delimitation.", "zh": "在達成第一款規定的協議以前，有關各國應基於諒解和合作的精神，盡一切努力作出實際性的臨時安排，並在此過渡期間內，不危害或阻礙最後協議的達成。這種安排不妨害最後界限的劃定。"}, {"n": "4", "en": "Where there is an agreement in force between the States concerned, questions relating to the delimitation of the continental shelf shall be determined in accordance with the provisions of that agreement.", "zh": "如果有關國家間存在現行有效的協定，關於劃定大陸架界線的問題，應按照該協定的規定加以決定。"}], "keys": ["協議劃定", "公平解決", "臨時安排"], "plain": "文字與第74條幾乎相同：大陸礁層重疊時，應在國際法的基礎上以協議劃定，以達成公平解決；談不成就訴諸第十五部分；協議前應作實際性臨時安排；有現行協定者依協定。和1958年《大陸礁層公約》第6條（協議、等距線、特殊情況）相比，本條刪除了等距線規則，只留下「公平解決」的目標，這是北海大陸礁層案以後的發展。實務上，大陸礁層與專屬經濟海域常以一條「單一海域界線」同時劃定，國際法院以三階段劃界法操作。", "elements": [{"req": ["海岸相向或相鄰國家的大陸礁層重疊"], "effect": "應在國際法基礎上以協議劃定，以達成公平解決"}, {"req": ["合理期間內未能達成協議"], "effect": "應訴諸第十五部分程序（可能受第298條聲明排除）"}, {"req": ["達成協議前"], "effect": "應盡力作實際性臨時安排，不得危害或阻礙最後協議；臨時安排不妨害最後劃界"}, {"req": ["有關國家間有現行有效的協定"], "effect": "依該協定決定"}], "traps": ["陷阱：1958年公約第6條有等距線規則，但北海大陸礁層案認定等距線不是習慣法；1982年公約第83條也沒有等距線規則。", "陷阱：200海里內的劃界，「自然延伸」已不具決定性；國際法院在利比亞／馬爾他案（1985）指出，200海里內應以距離為準。", "陷阱：三階段劃界法是判決發展出來的方法，不是公約條文。"], "custom": {"status": "習慣法", "note": "見第74條說明。", "cases": ["north-sea"]}, "related": ["unclos-74", "unclos-76", "unclos-15", "unclos-298", "icj-38"], "cases": [{"id": "north-sea", "point": "法院拒絕將等距線視為習慣法，改以公平原則協議劃界；本條不規定特定方法而以「公平解決」為目標，承襲此一發展。"}, {"id": "black-sea", "point": "法院以三階段劃界法劃定大陸礁層與專屬經濟海域的單一界線；本條的「公平解決」在實務上以暫定等距線為起點。"}], "roc": "《中華民國專屬經濟海域及大陸礁層法》第4條同時適用於大陸礁層的劃界（見[[art|unclos-74|第74條]]）。", "essay": "論大陸礁層劃界方法的演進：「1958年《大陸礁層公約》第6條採協議、等距線、特殊情況三層規則；[[case|north-sea|北海大陸礁層案]]（1969）否認等距線為習慣法，改採公平原則；1982年公約第83條僅要求以協議達成公平解決；[[case|black-sea|黑海劃界案]]（2009）以三階段劃界法使方法論趨於穩定。」", "exam": [], "news": [], "verified": "2026-10-06", "changelog": [LOG_2B, {"date": "2026-10-06", "type": "更正", "text": "中文本（海洋委員會正體本）第3項「這種安排應不妨害」依聯合國作準中文本作「這種安排不妨害」；第4項「大陸架界限的問題」依作準本作「界線」。"}]});
