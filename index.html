土與管轄權", "stem": "依據國際法，下列何者並非國家領土喪失的原因？", "options": ["因自然力作用而喪失", "放棄領土", "叛亂後的分離", "被他國軍事占領"], "answer": 3, "explanation": "軍事占領不移轉主權，不是領土喪失的原因；自然力、放棄、分離則可能導致喪失。"}, {"id": "gl108a_9", "src": "108年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列何者並非國家在國際法中得主張普遍刑事管轄的罪行？", "options": ["販毒罪", "種族滅絕罪", "海盜罪", "違反人道罪"], "answer": 0, "explanation": "海盜、殘害人群罪、違反人道罪一般認為適用普遍管轄；販毒罪通常依條約建立管轄，不屬習慣法上的普遍管轄。"}, {"id": "gl108a_10", "src": "108年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "下列何者為國家豁免的項目？", "options": ["國家所為的國內行政管理行為", "為銷售貨物而訂立的商業契約", "國家所訂的貸款或金融契約", "締結商業、工業、貿易或專業性質的契約"], "answer": 0, "explanation": "限制豁免論下，國家的主權行為（如國內行政管理）享有豁免；商業交易、金融契約等商業行為不享有豁免（聯合國國家豁免公約第10條）。"}, {"id": "gl108a_11", "src": "108年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "下列何者並非外交代表得享豁免的項目？", "options": ["不受刑事逮捕或拘禁", "使館館舍不受侵犯", "免關稅及查驗", "在接受國境內私有不動產之物權訴訟"], "answer": 3, "explanation": "依維也納外交關係公約第31條第1項（甲）款，外交代表就接受國境內私有不動產之物權訴訟，不享有民事管轄豁免。"}, {"id": "gl108a_12", "src": "108年外交特考", "kind": "外交特考", "topic": "國際法淵源與基本概念", "stem": "下列何者並非國家在國際法下所負的基本義務？", "options": ["不得在他國領土內實施主權行為", "不得加入或成立違反民主原則之國際組織", "不得干預他國內政事務", "遵守所締結條約"], "answer": 1, "explanation": "國家基本義務包括尊重他國主權、不干涉內政、善意履行條約；國際法並無「不得加入違反民主原則之國際組織」的一般義務。"}, {"id": "gl108a_13", "src": "108年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "關於國家在國際法所享有禁止使用武力原則之例外情形，下列何者因為具有高度爭議，而未為國際社會普遍接受？", "options": ["聯合國安全理事會授權的維護集體安全行動", "國家內戰", "國家遭受武力攻擊時的自我防衛", "預防受到武力攻擊的自我防衛"], "answer": 3, "explanation": "安理會授權與受武力攻擊時的自衛是憲章承認的例外；預防性自衛（攻擊尚未發生）高度爭議，未獲普遍接受。"}, {"id": "gl108a_14", "src": "108年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "我國與巴拿馬在2017年6月斷交，臺巴自由貿易協定第21.05條雖訂有終止條款，但雙方迄今未依本條款實施終止程序。依1969年維也納條約法公約第63條規定，臺巴自由貿易協定目前的效力為何？", "options": ["失效", "終止", "停止實施", "有效"], "answer": 3, "explanation": "依條約法公約第63條，斷絕外交關係不影響條約所確定的法律關係，除非外交關係之存在為適用條約所必不可少；臺巴自由貿易協定未依終止條款終止，仍屬有效。"}, {"id": "gl109a_1", "src": "109年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "聯合國國際法院（International Court of Justice）為重要的國際爭端解決機構，下列對於國際法院規約（Statute of the International Court of Justice）之敘述，何者錯誤？", "options": ["國際法院以獨立法官若干人組織之，法官應不論國籍，就品格高尚並在各國具有最高司法職位之任命資格或公認為國際法之法學家中選舉之", "國際法院之法官候選人在聯合國大會及在安全理事會得絕對多數票者應認為當選", "當事國一造不到法院或不辯護其主張時，他造得請求國際法院對自己主張為有利之裁判", "在國際法院得為訴訟當事國者，限於國家與聯合國附屬機構"], "answer": 3, "explanation": "同108年題，國際法院規約第34條規定訴訟當事國限於國家。"}, {"id": "gl109a_2", "src": "109年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "世界貿易組織（WTO）為重要的國際經貿組織，下列敘述何者錯誤？", "options": ["在二次世界大戰後的布列頓森林會議中，各國決議成立世界貿易組織，並將其總部設於瑞士日內瓦", "世界貿易組織強調會員間之平等，故沒有任何會員有否決權，一會員一票、票票等值", "世界貿易組織爭端解決小組及上訴機構透過法律解釋的方式處理WTO會員間之貿易爭端", "我國為世界貿易組織之正式會員，入會名稱為「臺澎金馬個別關稅領域」，並享有出席會議及各項完整權利"], "answer": 0, "explanation": "WTO係1995年由烏拉圭回合談判成立，布列頓森林會議（1944年）僅催生IMF與世界銀行，原擬成立的國際貿易組織（ITO）並未實現，本選項敘述錯誤。"}, {"id": "gl109a_3", "src": "109年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "我國於民國104年7月1日公布「條約締結法」，關於本法之內容，下列敘述何者錯誤？", "options": ["主辦機關於條約草案內容獲致協議前，得就談判之方針、原則及可能爭議事項，適時向立法院說明並向立法院相關委員會報告", "條約內容涉及國家機密、國家安全或外交考量者，行政院於條約案送立法院審議時，應標明機密等級，立法院應以秘密會議為之", "未具有條約或公約名稱，但已有批准、接受、贊同或加入條款之條約，得視同條約案，主辦機關得於簽署後三十日內報請行政院備查，並於條約生效後，主辦機關應報請行政院轉呈總統公布，並送立法院查照", "雙邊條約經立法院決議修正者，應退回主辦機關與締約對方重新談判；條約案未獲立法院審議通過者，主辦機關應即通知締約對方"], "answer": 2, "explanation": "條約締結法規定屬「條約案」者應送立法院審議並經總統公布，並非「報請行政院備查」即可，本選項將協定案之簡易程序誤用於條約案，敘述錯誤。"}, {"id": "gl109a_4", "src": "109年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據聯合國海洋法公約之規範，下列名詞之解釋何者錯誤？", "options": ["「區域」係指國家管轄範圍以外的海床和洋底及其底土", "「海洋環境污染」係指人類直接或間接把物質或能量引入海洋環境，以致造成或可能造成損害生物資源和海洋生物、危害人類健康、妨礙包括捕魚和海洋的其他正當用途在內的各種海洋活動、損壞海水使用質量和減損環境優美等有害影響", "「締約國」係指同意受「聯合國海洋法公約」拘束而該公約對其生效的國家，但不包括未簽署該公約者", "「傾倒」係指從船隻、平台、或其他人造海上結構故意處置廢物或其他物質的行為，但不包括陸上設施與飛行器"], "answer": 3, "explanation": "答案為D。依聯合國海洋法公約第1條，「傾倒」是指從船隻、飛機、平臺或其他人造海上結構故意處置廢物或其他物質的行為，飛機明文包括在內，所以「不包括飛行器」的敘述錯誤。A「區域」、B「海洋環境污染」的定義與公約相符，C的核心定義（同意受公約拘束且公約對其生效的國家）也正確。"}, {"id": "gl109a_5", "src": "109年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "國際法上對於「豁免」之規定，下列何者錯誤？", "options": ["外交豁免通常會透過國際公約或雙邊條約的方式規定，絕對豁免的情況已不多見", "國家豁免之意義源於一個國家的司法機構不得審判其他國家", "外交代表除在特殊情況外，基本上免納一切對人或對物課徵之國家、區域、或地方性捐稅", "外交使館並非享有刑事司法豁免，接受國基於國家安全理由得進入外國使館處搜索與扣押不法物證"], "answer": 3, "explanation": "使館館舍不可侵犯，接受國不得以任何理由（含國家安全）逕自進入搜索扣押，本選項敘述錯誤。"}, {"id": "gl109a_6", "src": "109年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "世界衛生組織（WHO）是國際間重要的公共衛生與傳染疾病防疫專業機構，關於該組織之敘述何者正確？", "options": ["我國雖非世界衛生組織之成員國，但每年皆以觀察員身分參與世界衛生大會（WHA），參與各項討論與決議", "世界衛生組織的總部位於聯合國總部大樓內，地點在美國的紐約市", "在嚴重特殊傳染性肺炎（COVID-19）的流行下，美國因不滿世界衛生組織之權力運作，而另外成立新的機構，名為「國際衛生組織」（International Health Organization），與之抗衡", "世界衛生組織的最高決策機構為會員國大會，而秘書處僅為常設的執行單位"], "answer": 3, "explanation": "WHO最高決策機構為世界衛生大會（WHA），秘書處為常設執行機關，本選項敘述正確；WHO總部位於瑞士日內瓦（非紐約），故B錯誤；美國並未另立「國際衛生組織」，C錯誤；我國自2017年起已未能以觀察員身分參與WHA，A之敘述已與現況不符。"}, {"id": "gl109a_7", "src": "109年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "國際習慣（Customary International Law）依國際法院規約第38條規定，係「作為通例之證明而經接受為法律者」，下列敘述何者正確？", "options": ["國際習慣之形成必須要有在地域上之普遍適用，亦即所有的聯合國成員都接受成為法律之約束者，始可適用", "國際習慣與條約都是國際法院規約第38條規範之國際法主要淵源，可作為國際法院法官審理案件之依據", "國際習慣之適用，必須經五個聯合國常任理事國在不提出否決權之情況下方得成為規則並適用之", "國際習慣最具有歷史淵源，其效力高於條約與一般法律原則"], "answer": 1, "explanation": "國際法院規約第38條明定條約與國際習慣皆為法院裁判所應適用之國際法淵源，本選項敘述正確。"}, {"id": "gl109a_8", "src": "109年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "關於「1969年維也納條約法公約」（The Vienna Convention on the Law of Treaties）第2條之規定，下列敘述何者錯誤？", "options": ["本條約稱「締約國」者，係指同意承受條約拘束，且該條約已於其境內生效之國家", "本條約稱「保留」者，謂一國於簽署、批准、接受、贊同或加入條約時所作之片面聲明，不論措辭或名稱為何，其目的在排除或更改條約中若干規定對該國適用時之法律效果", "本條約稱「批准、接受、贊同及加入」者，各依本義指一國據以在國際上確定其同意承受條約拘束之國際行為", "本條約稱「第三國」者，謂非條約當事國之國家"], "answer": 0, "explanation": "「締約國」僅指同意受條約拘束之國家，不以條約已生效為要件；條約對其生效者為「當事國」，本選項混淆二者定義，敘述錯誤。"}, {"id": "gl109a_9", "src": "109年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "就聯合國海洋法公約之規範，「領海」係一個國家得行使排他的專屬主權，下列對於領海的敘述，何者錯誤？", "options": ["每一國家有權確定其領海的寬度，直至從按照本公約確定的基線量起不超過二十四海里的界限為止", "領海的外部界限是一條其每一點同基線最近點的距離等於領海寬度的線", "在海岸線極為曲折的地方，或者如果緊接海岸有一系列島嶼，測算領海寬度的基線的劃定可採用連接各適當點的直線基線法", "在位於環礁上的島嶼或有岸礁環列的島嶼的情形下，測算領海寬度的基線是沿海國官方承認的海圖上以適當標記顯示的礁石的向海低潮線"], "answer": 0, "explanation": "領海寬度上限為12浬，非24浬，本選項敘述錯誤。"}, {"id": "gl109a_10", "src": "109年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "國家對外關係之代表通常具有外交特權與豁免，下列對於外交代表之敘述何者正確？", "options": ["一國的外交部長與外交官才是國家對外關係之正式代表，國家元首在外交出訪時始得代表國家", "外交部之聲明通常會具有國內法院在涉外事實問題上之法律認定效果", "外交代表之特權與豁免係給予其「個人」而非其「職務」，故外交代表卸任後仍享有前述權利", "「維也納外交關係公約」係聯合國關於外交特權與豁免之重要條約，但目前僅有少數國家締約並未正式生效"], "answer": 1, "explanation": "外交部就涉外事實所為聲明，實務上常具國內法院認定涉外事實之效果，本選項敘述正確；其餘選項均有明顯錯誤。"}, {"id": "gl109a_11", "src": "109年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "和平解決國際爭端係聯合國憲章中的重要原則，對於國際間之爭議，請問下列敘述何者錯誤？", "options": ["兩國間透過談判、斡旋、諮商等方式所締結的和平條約皆應以善意原則履行之", "在國際調停的案件中，必須是由聯合國維和部隊之見證下，始得簽署雙方的停火協定", "國際仲裁方式有非常多樣的型態，但就其性質皆為當事國不違反意願之狀況下進行之", "「使用武力」係違反聯合國憲章，安全理事會基於憲章第七章之規定，得對破壞國際和平進行必要之決議"], "answer": 1, "explanation": "調停並不以聯合國維和部隊見證為必要條件，本選項敘述錯誤。"}, {"id": "gl109a_12", "src": "109年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "依據蒙特維多國家權利義務公約之規定，下列何種情況並非條約中所述喪失國家特徵的原因？", "options": ["海平面上升後完全失去領土的小島", "因不同種族同化後所形成的非單一民族結構", "被推翻而流亡境外無法實施有效控制的政府", "因戰爭或武裝衝突而被完全滅絕之種族"], "answer": 1, "explanation": "種族同化形成之多元民族結構不影響蒙特維多公約所定國家四要件之存續。"}, {"id": "gl109a_13", "src": "109年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "關於世界貿易組織（WTO）爭端解決之運作，下列何者敘述錯誤？", "options": ["世界貿易組織之爭端解決為二審級制度，於爭端解決小組敗訴之會員，得將案件提起至上訴機構，但二審即為最終審理", "近年來因美國杯葛上訴機構法官之提名，使得世界貿易組織之秘書處以多數決方式通過上訴法官之人選提名案", "我國自2002年加入世界貿易組織後，運用爭端解決機制處理貿易糾紛，並多次以第三方身分參與多起案件", "世界貿易組織之爭端解決機制為專屬且排他之性質，敗訴會員不得再將同一案件提交不同的國際法庭審理"], "answer": 1, "explanation": "上訴機構法官提名須經DSB共識決通過，並非以多數決方式通過，本選項敘述錯誤。"}, {"id": "gl109a_14", "src": "109年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "我國自從退出聯合國後，由於喪失正式會員國資格，相繼於許多國際組織中退出，以下幾個國際組織之參與，何者受到上述事件的影響？", "options": ["世界貿易組織", "亞洲開發銀行", "國際復興開發銀行", "亞太經濟合作會議"], "answer": 2, "explanation": "我國原為國際復興開發銀行（世界銀行）創始會員國，退出聯合國後於1980年會籍遭中國大陸取代，受影響最直接；WTO、APEC之參與與聯合國會籍無涉。"}, {"id": "gl110a_1", "src": "110年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "《國際法院規約》第38條規定國際法的淵源，下列敘述何者錯誤？", "options": ["第38條並未明示法源之間的位階", "司法判決可作為確定法律之資料", "習慣係作為通例之證明而經接受為法律者", "公允及善良原則係該條所稱「一般法律原則」之重要例子"], "answer": 3, "explanation": "公允及善良原則（ex aequo et bono）規定於國際法院規約第38條第2項，須經當事國同意始得適用，並非同條第1項所稱「一般法律原則」之例子，本選項敘述錯誤。"}, {"id": "gl110a_2", "src": "110年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "依維也納條約法公約，關於條約之終止，下列敘述何者正確？", "options": ["條約中若無條款規定終止問題，原則上條約無限期有效", "當事國一方違反雙邊條約時，他方即可終止條約", "締約之一方，不得因實施條約所必不可少之標的物永久消失或毀壞以致履行不能為由，終止條約", "二國斷絕外交或領事關係，所有條約當然終止"], "answer": 0, "explanation": "依公約第56條，未規定終止條款之條約原則上不得片面終止（除非另有意思或依條約性質可推知），故條約原則上持續有效，本選項敘述正確；B須經公約第60條要件（重大違反）始得終止；C為「履行不能」得作為終止事由（第61條）；D斷交並不當然使條約失效（第63條）。"}, {"id": "gl110a_3", "src": "110年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "參考瑞士中立化之實踐，下列敘述何者正確？", "options": ["一國得單方面宣告中立化而成為中立化國家", "有關大國訂定條約對一國中立化地位給予集體保證", "須經由聯合國大會通過，一國才能取得中立化地位", "一個中立國有不參加任何國際組織的義務"], "answer": 1, "explanation": "瑞士之永久中立地位係1815年維也納會議由列強簽署條約集體承認保證，中立化非單方宣告即可成立，亦非由聯合國大會決議產生，本選項敘述正確。"}, {"id": "gl110a_4", "src": "110年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "國際法中的「先占」概念已成為領土取得的重要要件。下列敘述何者錯誤？", "options": ["國際法中之「先占」概念來自國內私法之「時效取得」概念", "國家發現無主地後，仍需有效控制始能取得領土主權", "實際上持續並和平展現國家功能係先占的重要要件之一", "「發現」給予國家期待權可以在合理期間內完成先占"], "answer": 0, "explanation": "「先占」（occupation）概念係源自羅馬法上對無主物之「先占取得」（occupatio），而非「時效取得」（prescriptio），本選項敘述錯誤。"}, {"id": "gl110a_5", "src": "110年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "1951年「難民地位公約」所列符合難民資格的畏懼受迫害之因素，不包括下列何者？", "options": ["國籍", "戰爭", "屬於某一社會團體", "具有某種政治見解"], "answer": 1, "explanation": "1951年難民地位公約第1條列舉之迫害原因為種族、宗教、國籍、屬於特定社會團體、政治意見五項，並不包括「戰爭」本身。"}, {"id": "gl110a_6", "src": "110年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據聯合國海洋法公約，下列敘述何者正確？", "options": ["島嶼是四面環水並在高潮時高於水平面的自然形成的陸地區域，故人造島無法擁有領海", "若低潮高地全部與大陸或島嶼的距離超過領海的寬度，則該高地可以有其自己的領海", "所有國家的船舶均享有無害通過他國領海的權利，沿海國不得制定關於無害通過的法律或規章", "沿海國應在通過領海的外國船舶上行使刑事管轄權，以逮捕與在該船舶通過期間船上所犯任何罪行有關的任何人，或進行與該罪行有關的任何調查"], "answer": 0, "explanation": "依海洋法公約第121條，島嶼須為自然形成之陸地，人工島嶼不適用島嶼制度、不得擁有領海，本選項敘述正確；低潮高地距大陸或島嶼超過領海寬度者不得有自己的領海（B錯誤）；沿海國得依公約制定無害通過相關法律規章（C錯誤）；沿海國原則上不應在通過領海的外國船舶上行使刑事管轄權，僅得於例外情形行使，並非「應」行使（D錯誤）。"}, {"id": "gl110a_7", "src": "110年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "關於「國籍」，下列敘述何者錯誤？", "options": ["一國得對具有該國國籍之人民行使屬人管轄權", "各國國內法關於取得國籍之方式有相同之規定", "國民得請求其國家保護，並得依國際法規範享有與國籍相關的利益", "一國原則上得依其國內法規定決定何人為其國民"], "answer": 1, "explanation": "各國關於國籍取得之方式（屬人主義、屬地主義等）規定並不相同，本選項敘述錯誤。"}, {"id": "gl110a_8", "src": "110年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "依國家對國際不法行為的責任條款草案規定，一個國家犯了國際不法行為而需負國際責任時，下列何者通常不被視為國家解除責任的方式？", "options": ["恢復原狀", "補償", "抵償", "反措施"], "answer": 3, "explanation": "恢復原狀、補償、抵償（satisfaction）為國家責任條款草案所定之三種賠償（reparation）方式；反措施（countermeasures）係他國對不法行為國採取之對抗手段，並非不法行為國自身解除責任之方式。"}, {"id": "gl110a_9", "src": "110年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "有關《聯合國憲章》第51條自衛權之規定，下列敘述何者錯誤？", "options": ["第51條肯認一國有個別或集體自衛之固有權利", "行使自衛權之前提係一國受到「武力攻擊」", "自衛權之習慣法地位起源於1986年國際法院尼加拉瓜案判決", "「武力攻擊」之認定條件包含攻擊之「規模和效果」"], "answer": 2, "explanation": "自衛權作為習慣國際法之地位淵源已久（早於聯合國憲章），1986年尼加拉瓜案判決僅係國際法院確認並闡釋此習慣法地位，並非其起源，本選項敘述錯誤。"}, {"id": "gl110a_10", "src": "110年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "依維也納外交關係公約第19條，如使館館長缺位或不能執行職務時，應由下列何者暫代使館館長？", "options": ["臨時代辦", "外交團團長", "代辦", "無任所大使"], "answer": 0, "explanation": "依公約第19條，使館館長缺位或不能執行職務時，由臨時代辦（chargé d'affaires ad interim）暫代館務。"}, {"id": "gl110a_11", "src": "110年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "依馬爾喀什設立世界貿易組織協定（Marrakesh Agreement Establishing the World Trade Organization）規定，世界貿易組織（World Trade Organization）原則上優先採取何種方式做決策？", "options": ["二分之一多數決", "共識決", "三分之二多數決", "四分之三多數決"], "answer": 1, "explanation": "WTO決策原則上採共識決（consensus），無人正式反對即視為通過，僅於無法達成共識時始依協定規定改採表決。"}, {"id": "gl110a_12", "src": "110年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "關於國際法院，下列敘述何者錯誤？", "options": ["國際法院的法官共15名，其中不得有2人為同一國家之國民", "除了第一次選出的法官中之10人外，國際法院的法官任期9年，並得連選連任", "在法院得為訴訟當事國者，限於國家", "非聯合國會員國無法成為國際法院規約的當事國"], "answer": 3, "explanation": "非聯合國會員國仍得依聯合國大會經安理會建議所定條件成為國際法院規約當事國（如瑞士於加入聯合國前即已為規約當事國），本選項敘述錯誤。"}, {"id": "gl110a_13", "src": "110年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "關於「國際人道法」，下列敘述何者正確？", "options": ["國際人道法並不規範武器之使用", "國際人道法並不保護戰俘", "武裝衝突中，各方必須隨時區分民用和軍事目標", "國際人道法僅由1949年四個日內瓦公約構成"], "answer": 2, "explanation": "區分原則（principle of distinction）為國際人道法核心原則之一，要求武裝衝突各方隨時區分軍事目標與民用目標；國際人道法亦規範武器使用（如禁止使用特定武器之公約）、保護戰俘（第三日內瓦公約），且尚包括海牙法、附加議定書等其他規範，A、B、D均錯誤。"}, {"id": "gl110a_14", "src": "110年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "為了遏阻全球暖化，聯合國氣候變化綱要公約（United Nations Framework Convention on Climate Change）下的巴黎協定（Paris Agreement）冀望將全球平均氣溫升幅控制在工業化前水平低於攝氏幾度的目標？", "options": ["1.5度", "2度", "2.5度", "3度"], "answer": 1, "explanation": "巴黎協定訂定目標為將全球升溫控制在工業化前水準以上低於攝氏2度，並努力追求限制在1.5度以內，主要門檻目標為2度。"}, {"id": "gl111a_1", "src": "111年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "一般認為國際法院規約第38條係國際法淵源最重要的依據，下列敘述何者正確？", "options": ["國際公約係由聯合國大會或安全理事會通過所建立之規則", "國際習慣係由文明國家所接受其為法律，而作為國家實踐之證據", "一般法律原則係指由聯合國會員國所承認之國際規則", "在國際法院規約第59條規定下，司法判例及各國權威最高之公法學家學說，作為確定法律原則之補助資料者"], "answer": 3, "explanation": "依規約第38條第1項(d)款並參照第59條，司法判例（含不具先例拘束力之特性）及最高公法學家學說係作為確定法律原則之「補助資料」，本選項敘述正確；A國際公約係由國家間締結而非聯合國機關「建立」；B、C選項對習慣及一般法律原則之定義亦有誤植。"}, {"id": "gl111a_2", "src": "111年外交特考", "kind": "外交特考", "topic": "國際法淵源與基本概念", "stem": "下列何者之規定，具有我國國內法律之效力？", "options": ["聯合國大會決議", "聯合國安全理事會制裁名單", "身心障礙者權利公約", "南海仲裁案仲裁判斷"], "answer": 2, "explanation": "身心障礙者權利公約經我國制定施行法（身心障礙者權利公約施行法）內國法化後，具有國內法律效力；聯合國大會決議、安理會制裁名單及南海仲裁判斷對我國均不當然具有國內法律效力。"}, {"id": "gl111a_3", "src": "111年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "依維也納條約法公約，關於「條約的解釋」，下列敘述何者正確？", "options": ["條約用語總是採用特殊的意義", "依照上下文解釋條約時，無須考慮條約的弁言", "條約用語應依條約目的與宗旨而善意解釋之", "依照上下文脈絡解釋條約時，無須考慮條約的附件"], "answer": 2, "explanation": "依公約第31條，條約應依其用語按上下文並參照條約之目的及宗旨所具有之通常意義，善意解釋之，本選項敘述正確；上下文依同條規定包括弁言及附件在內，B、D均錯誤；用語僅於當事國有此意思時始採特殊意義，A錯誤。"}, {"id": "gl111a_4", "src": "111年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列何者並未被列入聯合國非自治領土之名單？", "options": ["開曼群島", "東帝汶", "關島", "百慕達"], "answer": 1, "explanation": "東帝汶已於2002年獨立建國並成為聯合國會員國，已非「非自治領土」；開曼群島、關島、百慕達迄今仍列於聯合國非自治領土名單。"}, {"id": "gl111a_5", "src": "111年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "國際法院在2010年公布有關科索沃獨立宣言合法性的諮詢意見。關於這份諮詢意見，下列敘述何者正確？", "options": ["此諮詢意見係由塞爾維亞向國際法院提出請求而作成", "國際法院認為科索沃宣布獨立之行為未違反國際法", "國際法院認為人民自決權於殖民地人民範疇外亦適用", "國際法院認為其他國家承認科索沃為獨立國家有溯及至宣布獨立之日的效力"], "answer": 1, "explanation": "此諮詢意見係由聯合國大會（應塞爾維亞提案）請求作成，並非塞爾維亞直接向法院提出（A錯誤）；法院認定科索沃宣布獨立本身未違反一般國際法（B正確）；法院並未就自決權是否逾越殖民脈絡、亦未論及承認之溯及效力表示意見，C、D均非本諮詢意見內容。"}, {"id": "gl111a_6", "src": "111年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "被請求國經由引渡程序，將人犯解交請求國時，請求國僅能就引渡請求書中所載之犯罪為追訴或處罰，此原則稱為：", "options": ["互惠原則", "再引渡原則", "特定行為原則", "雙重犯罪原則"], "answer": 2, "explanation": "此即「特定原則」（rule of speciality），限制請求國僅得就引渡請求所載罪名追訴或處罰引渡人犯。"}, {"id": "gl111a_7", "src": "111年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "沿海國在專屬經濟海域有何種權利？", "options": ["沿海國對專屬經濟區擁有主權", "自然資源探勘、開發、養護和管理，但僅限於生物資源", "自然資源探勘、開發、養護和管理，但僅限於非生物資源", "利用風力生產能源"], "answer": 3, "explanation": "依海洋法公約第56條，沿海國於專屬經濟區享有主權權利（非主權本身，A錯誤），涵蓋生物與非生物資源之探勘開發（B、C均侷限錯誤），並包括利用海水、海流和風力生產能源等其他經濟性活動之管轄權，D正確。"}, {"id": "gl111a_8", "src": "111年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "依維也納外交關係公約，若外交代表為接受國國民，下列敘述何者正確？", "options": ["外交代表無以證人身分作證之義務", "外交代表對接受國之刑事管轄均享有豁免", "外交代表原則上僅就其執行職務之公務行為，享有管轄之豁免及不得侵犯權", "外交代表不受任何方式之逮捕或拘禁"], "answer": 2, "explanation": "依公約第38條，具接受國國籍或於接受國有永久居留之外交代表，除接受國另予optional較大特權外，僅就其執行職務行為享有管轄之豁免及不受侵犯之權利，本選項敘述正確；其餘選項均係一般外交代表（非接受國國民時）之完整特權，不適用於本題情形。"}, {"id": "gl111a_9", "src": "111年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "1963年訂立的「航空器上所犯罪行及若干其他行為（東京）公約」第4條規定，如果在飛機上的罪行是對一個締約國國民或其永久居民所為者，該締約國可以行使管轄權。上述規定採取那一種管轄原則？", "options": ["保護管轄", "被害人（消極）國籍管轄", "國籍（積極）管轄", "領域管轄"], "answer": 1, "explanation": "依被害人國籍（消極國籍）作為管轄連繫因素，屬被害人國籍管轄原則。"}, {"id": "gl111a_10", "src": "111年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "關於「國家責任」，下列敘述何者錯誤？", "options": ["依據2001年《國家國際不法行為責任條款草案》第4條規定，任何國家機構所為之行為，皆應視為國際法上之國家行為，無論該機構之特徵以及其所執行之功能", "國家如對他國利益直接造成損害，應負擔國家責任", "國家可以該國法律或憲法規定而主張對於國際索償之抗辯", "2001年《國家國際不法行為責任條款草案》第11條規定，國家只有在認知並採取有關行為時，將其視為本國行為的情況下，才有國家責任之產生"], "answer": 2, "explanation": "依責任條款草案第3條，國家不得以其國內法規定作為未履行國際義務之正當化理由，本選項敘述錯誤。"}, {"id": "gl111a_11", "src": "111年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "關於和平解決國際爭端，下列敘述何者錯誤？", "options": ["國家並無必須解決爭端之國際法義務", "爭端解決程序之啟動原則上需要爭端國間之合意", "國際法院尚未確認和平解決國際爭端具有習慣國際法的地位", "具有強制性的爭端解決機構已經開始出現"], "answer": 2, "explanation": "和平解決國際爭端原則已普遍被承認具有習慣國際法地位（並見於聯合國憲章第2條第3項），本選項敘述錯誤。"}, {"id": "gl111a_12", "src": "111年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "下列何者國際刑事法院或法庭尚未成立？", "options": ["前南斯拉夫國際刑事特別法庭", "緬甸國際刑事特別法庭", "盧安達國際刑事特別法庭", "國際刑事法院"], "answer": 1, "explanation": "國際間並無「緬甸國際刑事特別法庭」之設置（僅有獨立調查機制IIMM），前南斯拉夫特別法庭、盧安達特別法庭及常設之國際刑事法院均已成立。"}, {"id": "gl111a_13", "src": "111年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "下列何者為世界貿易組織轄下的複邊協定？", "options": ["原產地規則協定", "補貼暨平衡措施協定", "政府採購協定", "技術性貿易障礙協定"], "answer": 2, "explanation": "政府採購協定（GPA）為WTO複邊協定（僅部分會員締約適用），其餘三者均為WTO多邊協定（對所有會員均適用）。"}, {"id": "gl111a_14", "src": "111年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "下列何者為公民與政治權利國際公約設立的條約機構？", "options": ["聯合國人權理事會（United Nations Human Rights Council）", "人權事務委員會（Human Rights Committee）", "聯合國人權事務高級專員辦事處（Office of the United Nations High Commissioner for Human Rights）", "聯合國秘書處（United Nations Secretariat）"], "answer": 1, "explanation": "人權事務委員會係依公民與政治權利國際公約第28條設立之條約機構，負責監督公約履行；人權理事會、高專辦、秘書處均為聯合國一般機關，非本公約所設之條約機構。"}, {"id": "gl112a_1", "src": "112年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "關於國際法與國內法的關係，有關條約在美國的地位，下列敘述何者錯誤？", "options": ["所有批准的條約都是美國的最高法律", "美國每一州法官都受到所有批准條約的拘束", "所有的條約都需經過四分之三以上的參議員同意", "美國每一州的憲法或法律都不能牴觸所有批准的條約"], "answer": 2, "explanation": "依美國憲法，條約須經參議院出席議員三分之二（非全體參議員四分之三）同意批准，本選項敘述錯誤。"}, {"id": "gl112a_2", "src": "112年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "依據1969年維也納條約法公約，下列何者為國際法據以確定一國同意受條約拘束之國際行為？", "options": ["議定", "批准", "保留", "認證文本"], "answer": 1, "explanation": "依公約第2條，批准（及接受、贊同、加入）為國家確定同意受條約拘束之國際行為；保留為片面聲明以排除或變更條約適用效果，非屬此列。"}, {"id": "gl112a_3", "src": "112年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "有關國際法院規約第38條明定國際法院得適用之國際法淵源，下列敘述何者正確？", "options": ["不包括司法裁判", "包括條約、國際習慣和軟法", "包括各國權威最高之公法學家學說", "包括一般法律原則及國際組織決議"], "answer": 2, "explanation": "第38條第1項(d)款明定司法判例及各國權威最高公法學家學說得作為確定法律原則之補助資料，本選項敘述正確；第38條並未列入「軟法」或「國際組織決議」為正式淵源，亦有包括司法裁判（僅作為補助資料而非主要淵源），A、B、D均有誤。"}, {"id": "gl112a_4", "src": "112年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "關於人權保障制度，下列敘述何者正確？", "options": ["「歐洲保障人權與基本自由公約」仍未在歐洲生效", "「非洲人與人民權利憲章」已在非洲生效", "「亞洲人權憲章」已在亞洲生效", "「美洲人權公約」仍未在美洲生效"], "answer": 1, "explanation": "非洲人與人民權利憲章（Banjul Charter）已生效並廣為非洲國家批准；歐洲人權公約及美洲人權公約均早已生效（A、D錯誤）；目前尚無具拘束力之全亞洲區域性人權公約（「亞洲人權憲章」並非正式生效之公約），C錯誤。"}, {"id": "gl112a_5", "src": "112年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列取得領土之方式，何者指國家既有領土因自然力而延伸擴張？", "options": ["先占", "征服與兼併", "添附", "時效"], "answer": 2, "explanation": "添附（accretion）係指因自然力作用（如河流沖積、火山造陸）使既有領土延伸擴張之領土取得方式。"}, {"id": "gl112a_6", "src": "112年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據聯合國海洋法公約規定，「區域」及其資源的法律性質為何？", "options": ["無主物", "海洋保護區", "人類共同繼承財產", "無主地"], "answer": 2, "explanation": "依海洋法公約第136條，「區域」及其資源為人類共同繼承財產（common heritage of mankind）。"}, {"id": "gl112a_7", "src": "112年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "當符合特定要件時，地主國可以徵收外國的投資。下列何者並非該等要件之一？", "options": ["為公共目的", "基於雙邊的條約", "符合非歧視的態度", "給予補償"], "answer": 1, "explanation": "國際法上合法徵收外資之要件通常為：基於公共目的、符合正當程序、非歧視、給予及時有效之補償，並不以「基於雙邊條約」為必要要件（徵收本身係地主國依國內法之主權行為）。"}, {"id": "gl112a_8", "src": "112年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "國家對於危害其安全或干擾其政府運作的罪行，即使行為地不在領域內，仍可對外國人行使管轄權，此為下列何種原則？", "options": ["領域", "國籍", "保護", "普遍"], "answer": 2, "explanation": "此即保護管轄原則（protective principle），基於保護國家安全或重大利益，對域外外國人所犯特定罪行主張管轄。"}, {"id": "gl112a_9", "src": "112年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "依聯合國外交特權及豁免公約第5條第18節之規定，聯合國人員應豁免於當地管轄及執行。下列敘述何者錯誤？", "options": ["關於其執行公務時以口頭或文字所發表之言論及行為所生之刑事訴訟，均受豁免，但不包括民事訴訟", "豁免聯合國所予薪給及津貼之稅務", "豁免國家公民服務之義務", "該國政府所予外交國類似等級官員所享受之同樣的外匯便利"], "answer": 0, "explanation": "依該公約第18節，聯合國人員就其執行公務時以口頭或文字發表言論及所為行為，應同時豁免刑事及民事之司法程序（並非僅限刑事訴訟而排除民事），本選項敘述錯誤。"}, {"id": "gl112a_10", "src": "112年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "下列何者並非聯合國憲章第1條所定之聯合國宗旨？", "options": ["維持國際和平及安全", "發展各國間的友好關係", "作為協調各國行動的中心", "促進國際貿易並減少障礙"], "answer": 3, "explanation": "聯合國憲章第1條所列宗旨為：維持國際和平及安全、發展各國間基於平等權利與自決原則之友好關係、促成國際合作解決國際問題並促進人權、作為協調各國行動之中心，並無「促進國際貿易並減少障礙」（此屬GATT/WTO宗旨）。"}, {"id": "gl112a_11", "src": "112年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "世界貿易組織為當代國際法下重要的國際經貿組織，下列敘述何者正確？", "options": ["「1994年建立世界貿易組織協定」強化了「1947年建立國際貿易組織協定」之程序與規則", "世界貿易組織爭端解決小組對於其內括協定具有管轄權", "世界貿易組織爭端解決之最終救濟方式包括回復原狀及金錢賠償", "世界貿易組織會員依據GATT第20條之一般例外條款得簽訂區域貿易協定"], "answer": 1, "explanation": "WTO爭端解決小組對於WTO協定（內括協定，covered agreements）所生之爭端具有管轄權，本選項敘述正確；1947年僅有GATT並無「建立國際貿易組織協定」正式生效（A有誤，且用語錯置）；WTO爭端解決之救濟原則為撤銷違反措施或提供補償，並非回復原狀或金錢賠償（C錯誤）；區域貿易協定之例外依據為GATT第24條而非第20條（D錯誤）。"}, {"id": "gl112a_12", "src": "112年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "下列何者得為國際法院訴訟主體？", "options": ["個人", "屬地", "國家", "國際組織"], "answer": 2, "explanation": "依國際法院規約第34條，僅國家得為訴訟當事國，個人、屬地及國際組織均不得為訴訟主體（國際組織僅得於一定條件下請求諮詢意見）。"}, {"id": "gl112a_13", "src": "112年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "依據1977年6月8日簽署之「1949年8月12日日內瓦四公約關於保護國際性武裝衝突受難者的附加議定書」（第一議定書），不分皂白的攻擊是被禁止的。下列何種情況構成不分皂白的攻擊？", "options": ["針對特定軍事目標之攻擊", "對某一城市實施地毯式轟炸", "攻擊使用的作戰方法或手段是針對特定軍事目標", "對原野上之坦克及步兵全面攻擊"], "answer": 1, "explanation": "對城市實施不分軍事與民用目標之地毯式轟炸，未區分軍事目標與平民及民用物體，構成第一議定書所禁止之「不分皂白的攻擊」。"}, {"id": "gl112a_14", "src": "112年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "國家負有確保在其管轄或控制範圍內的活動，不致損害其他國家或在國家管轄範圍以外地區之環境的責任。下列何者符合前述要求？", "options": ["善鄰原則", "預防原則", "污染者付費原則", "永續發展原則"], "answer": 0, "explanation": "此即國際環境法上之「善鄰原則」（good neighbourliness / no-harm principle），要求國家確保其管轄或控制範圍內活動不損害他國或國家管轄範圍外之環境。"}, {"id": "gl113a_1", "src": "113年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "依據維也納條約法公約，關於條約的解釋，下列敘述何者錯誤？", "options": ["條約應以善意解釋之", "條約應按其上下文並參考其目的及宗旨解釋所具有之特殊意義解釋", "就解釋條約而言，上下文應包括弁言及附件", "就解釋條約而言，上下文應包括全體當事國間因締結條約所訂與條約有關之任何協定"], "answer": 1, "explanation": "依公約第31條，條約用語原則上應依其「通常意義」解釋，僅於當事國有此意思時始依「特殊意義」解釋，本選項將通常意義誤植為特殊意義，敘述錯誤。"}, {"id": "gl113a_2", "src": "113年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "關於1969年維也納條約法公約規定，下列敘述何者錯誤？", "options": ["依維也納條約法公約第26條之規定，凡有效之條約對其各當事國有拘束力，必須由各該國善意履行", "依維也納條約法公約第27條規定，若有國內管轄原則之適用時，一當事國得援引其國內法規定為理由而不履行條約", "依維也納條約法公約第28條之規定，除條約表示不同意思，或另經確定外，關於條約對一當事國生效之日以前所發生之任何行為或事實或已不存在之任何情勢，條約之規定不對該當事國發生拘束力", "依維也納條約法公約第29條之規定，除條約表示不同意思，或另經確定外，條約對每一當事國之拘束力及於其全部領土"], "answer": 1, "explanation": "依公約第27條，當事國不得援引其國內法規定為理由而不履行條約，本選項敘述適與條文相反，錯誤。"}, {"id": "gl113a_3", "src": "113年外交特考", "kind": "外交特考", "topic": "國際法淵源與基本概念", "stem": "關於國際法主體，下列敘述何者正確？", "options": ["政府間國際組織已成為最重要的國際法主體", "非自治領土均非國際法主體", "個人一定不是國際法主體", "民族解放運動得為國際法主體"], "answer": 3, "explanation": "民族解放運動（national liberation movements）於特定條件下（如經聯合國承認代表性）得具有有限之國際法主體地位；國家仍為最重要之國際法主體（A錯誤）；非自治領土於特定脈絡下仍具一定國際法地位（B錯誤）；個人於國際人權法及國際刑事法領域已漸具有限之國際法主體性（C錯誤）。"}, {"id": "gl113a_4", "src": "113年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "下列何者並非現存區域性人權條約所設之區域人權法院？", "options": ["歐洲人權法院（European Court of Human Rights）", "美洲人權法院（Inter-American Court of Human Rights）", "非洲人權和人民權利法院（African Court on Human and People's Rights）", "亞洲人權法院（Asian Court of Human Rights）"], "answer": 3, "explanation": "目前並無具拘束力之全亞洲區域性人權法院；歐洲、美洲、非洲均已設有區域人權法院。"}, {"id": "gl113a_5", "src": "113年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "依據國際法院規約第38條第1項規定，司法裁判為確定法律原則之補助資料。下列敘述何者正確？", "options": ["國際法院之裁判具有拘束所有國家之普遍效力", "國際法院規約第38條第1項規定之司法裁判係指國際爭端解決機制之裁決", "國際法院規約第38條第1項規定之司法裁判也包括國內法院裁判", "國際法院規約第38條第1項規定之司法裁判係指國際法院本身之判決"], "answer": 2, "explanation": "第38條第1項(d)款所稱「司法裁判」並未限於國際法院自身判決，亦包括其他國際法庭裁決及國內法院裁判，均得作為確定法律原則之補助資料，本選項敘述正確；國際法院裁判依規約第59條僅對訟爭當事國有拘束力，並無普遍效力（A錯誤）。"}, {"id": "gl113a_6", "src": "113年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依聯合國海洋法公約，有關船舶於不同海域所享有之不同程度之航行權，下列敘述何者正確？", "options": ["通過領海之過境通過權", "通過群島國專屬經濟區之群島海道通過權", "通過鄰接區之無害通過權", "通過專屬經濟區之航行自由"], "answer": 3, "explanation": "專屬經濟區內各國享有公海航行自由（第58條準用），本選項敘述正確；領海之航行權為「無害通過權」而非「過境通過權」（過境通過權適用於用於國際航行之海峽，A錯誤）；群島海道通過權適用於「群島水域」而非「專屬經濟區」（B錯誤）；鄰接區並無獨立之「無害通過權」概念，其性質仍屬領海以外海域（C錯誤）。"}, {"id": "gl113a_7", "src": "113年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依聯合國海洋法公約第27條規定：「沿海國不應在通過領海的外國船舶上行使刑事管轄權，以逮捕與在該船舶通過期間船上所犯任何罪行有關的任何人或進行與該罪行有關的任何調查」，下列何者並非該條明定之例外？", "options": ["倘若罪行的後果及於沿海國", "罪行屬於擾亂當地安寧或領海的良好秩序的性質", "倘若經沿岸國當地法院下令進行調查或審判", "倘若這些措施是取締違法販運麻醉藥品或精神調理物質所必要的"], "answer": 2, "explanation": "海洋法公約第27條所列例外為：罪行後果及於沿海國、擾亂當地安寧或領海良好秩序、經船長或船旗國外交代表或領事官員請求當地當局協助、取締違法販運麻醉藥品或精神調理物質所必要，並無「經當地法院下令」此一例外事由。"}, {"id": "gl113a_8", "src": "113年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據聯合國海洋法公約，下列關於島嶼制度的敘述何者錯誤？", "options": ["島嶼指四面環水並在低潮時高於水面的自然形成的陸地區域", "島嶼可以有專屬經濟海域", "人工島嶼不具有島嶼的地位", "不能維持人類居住或其本身的經濟生活的岩礁，不應有專屬經濟海域"], "answer": 0, "explanation": "依公約第121條，島嶼係指四面環水並在「高潮時」（非低潮時）高於水面之自然形成陸地區域，本選項敘述錯誤。"}, {"id": "gl113a_9", "src": "113年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "國際法允許國家得用以決定其是否有管轄權之基本原則，不包括下列何者？", "options": ["共同管轄原則", "領域管轄原則", "保護管轄原則", "被害人國籍原則"], "answer": 0, "explanation": "國際法上決定管轄權之基本原則包括領域管轄、國籍（積極）管轄、保護管轄、被害人（消極）國籍管轄、普遍管轄等，並無「共同管轄原則」此一分類。"}, {"id": "gl113a_10", "src": "113年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "依「國家對國際不法行為的責任條款草案」規定，下列何者不是得免除國際不當行為責任的情況？", "options": ["自衛", "經授權行使政府權力的個人違背指示行事", "危急情況", "不可抗力"], "answer": 1, "explanation": "依責任條款草案第7條，經授權行使政府權力之機關或個人縱使逾越權限或違背指示行事，其行為仍歸責於國家，並不因此免除國家責任，本選項並非免責事由。"}, {"id": "gl113a_11", "src": "113年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "下列何者並非維也納外交關係公約第1條(c)所指的「使館職員」？", "options": ["外交職員", "行政與技術職員", "私人僕役", "事務職員"], "answer": 2, "explanation": "依公約第1條，「使館職員」包括外交職員、行政與技術職員、事務職員，私人僕役（private servant）非屬使館職員，而係另受規範之人員類別。"}, {"id": "gl113a_12", "src": "113年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "下列國際組織之會議，何者採加權表決制？", "options": ["國際能源署", "國際貨幣基金組織", "聯合國教科文組織", "世界衛生組織"], "answer": 1, "explanation": "國際貨幣基金（IMF）採依會員國認繳份額計算之加權表決制（weighted voting），其餘多採一國一票制。"}, {"id": "gl113a_13", "src": "113年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "為求實現聯合國憲章第1條宗旨，其第2條規定聯合國及其會員國應遵行之原則，不包括下列何者？", "options": ["本組織在維持國際和平及安全之必要範圍內，應保證非聯合國會員國遵行聯合國憲章第2條所列之原則", "各會員國應以和平方法解決其國際爭端，俾免危及國際和平、安全、及正義", "各會員國應設立國際託管制度，以管理並監督憑此後個別協定而置於該制度下之領土", "各會員國應一秉善意，履行其依本憲章所擔負之義務，以保證全體會員國由加入本組織而發生之權益"], "answer": 2, "explanation": "國際託管制度規定於聯合國憲章第12章（第75條以下），並非第2條所列會員國應遵行之基本原則，本選項與第2條規範內容不符。"}, {"id": "gl113a_14", "src": "113年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "依據聯合國憲章，下列何者非聯合國的主要機關？", "options": ["託管理事會", "國際法院", "秘書處", "國際刑事法院"], "answer": 3, "explanation": "聯合國憲章第7條所定六大主要機關為大會、安全理事會、經濟暨社會理事會、託管理事會、國際法院及秘書處，國際刑事法院為依羅馬規約設立之獨立國際組織，並非聯合國主要機關。"}, {"id": "gl113a_15", "src": "113年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "關於1947及1994年關稅暨貿易總協定，下列敘述何者錯誤？", "options": ["最惠國待遇是1947及1994年關稅暨貿易總協定中最重要的原則之一", "國民待遇是1947及1994年關稅暨貿易總協定中最重要的原則之一", "1947及1994年關稅暨貿易總協定有規範一般例外及安全例外事項", "1947及1994年關稅暨貿易總協定都沒有規範爭端解決事項"], "answer": 3, "explanation": "GATT第22條、第23條即分別規定諮商與爭端解決（不滿意見之處理）事項，1947年與1994年GATT均有涉及爭端解決之規範，本選項敘述錯誤。"}, {"id": "gl113a_16", "src": "113年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "下列何者並非「第三方解決國際爭端」機制？", "options": ["世界貿易組織爭端解決", "國際海洋法法庭", "投資人與地主國間爭端解決", "國際人道干預委員會"], "answer": 3, "explanation": "並無所謂「國際人道干預委員會」此一具第三方爭端解決功能之常設機制，其餘三者均屬第三方（仲裁或司法）解決國際爭端之機制。"}, {"id": "gl113a_17", "src": "113年外交特考", "kind": "外交特考", "topic": "國際法淵源與基本概念", "stem": "下列何者係同時適用國內法和國際法的「國際化或混合」刑事法庭？", "options": ["遠東國際軍事法庭（東京法庭）", "國際刑事法院", "前南斯拉夫國際刑事法庭", "柬埔寨法院特別法庭"], "answer": 3, "explanation": "柬埔寨法院特別法庭（ECCC）係設於柬埔寨國內法院體系下、同時適用柬埔寨國內法與國際法之混合式（hybrid）法庭；東京法庭、前南國際刑事法庭及國際刑事法院均為純粹國際性法庭。"}, {"id": "gl113a_18", "src": "113年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "有關《核武器不擴散條約》（Treaty on the Non-Proliferation of Nuclear Weapons）和《禁止核武器條約》（Treaty on the Prohibition of Nuclear Weapons）之比較，下列敘述何者正確？", "options": ["前者締約國多數為有核國家，後者締約國多數為無核國家", "前者於1970年生效，後者尚未生效", "前者僅規範有核國，後者同時規範所有國家", "前者未禁止使用核武器，後者明文禁止使用核武器"], "answer": 3, "explanation": "不擴散條約（NPT）並未明文禁止使用核武器（僅規範不擴散與裁軍義務），禁止核武器條約（TPNW）則明文全面禁止研發、試驗、生產、擁有及使用核武器，本選項敘述正確；NPT締約國絕大多數為無核武國家（A方向相反）；NPT於1970年生效屬實，惟TPNW已於2021年生效（B後段錯誤）；NPT亦對無核國課予不擴散義務（C錯誤）。"}, {"id": "gl113a_19", "src": "113年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "聯合國氣候變化綱要公約下之巴黎協定（Paris Agreement）以將地球氣溫上升的幅度控制在攝氏2度內為目標。此長期氣溫目標係約以下列何者作為比較之基準年？", "options": ["1750年", "1900年", "1945年", "2000年"], "answer": 0, "explanation": "巴黎協定所稱「工業化前水準」一般以約1750年（工業革命開始前）作為比較基準。"}, {"id": "gl113a_20", "src": "113年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "下列何者並非保護人權之區域性機制？", "options": ["非洲人權和人民權利法院（African Court on Human and People's Rights）", "阿拉伯人權和人民權利法院（Arab Court on Human and People's Rights）", "歐洲人權法院（European Court of Human Rights）", "美洲人權委員會（Inter-American Commission on Human Rights）"], "answer": 1, "explanation": "阿拉伯國家聯盟迄今並未成立具實際運作之「阿拉伯人權和人民權利法院」，其餘三者均為實際運作之區域性人權保障機制。"}, {"id": "gl114a_1", "src": "114年外交特考", "kind": "外交特考", "topic": "國際法淵源與基本概念", "stem": "關於「國際法」與「國內法」的關係，下列敘述何者錯誤？", "options": ["就理論上而言，國際法與國內法的關係通常指向「一元論」及「二元論」二種不同的方法取徑", "我國憲法第141條規定：「中華民國之外交，應……尊重條約及聯合國憲章，……」", "一國得以國內法律或國內立法程序疏漏等理由，作為違反國際法上義務之正當理由", "一國國內法院能否直接適用國際法，很大程度取決於各該國家的憲法、法律規定及法院裁判"], "answer": 2, "explanation": "依國際法一般原則（並見維也納條約法公約第27條之精神），國家不得以其國內法規定或立法疏漏作為未履行國際法義務之正當化理由，本選項敘述錯誤。"}, {"id": "gl114a_2", "src": "114年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "依據《維也納條約法公約》對於條約所作之定義，下列何者非為條約？", "options": ["京都議定書", "斯德哥爾摩人類環境宣言", "維也納外交關係公約", "馬關條約"], "answer": 1, "explanation": "1972年斯德哥爾摩人類環境宣言為不具法律拘束力之宣示性文件（軟法），並非國家間受國際法拘束之書面協定，非屬公約所稱之「條約」；其餘三者均為具拘束力之條約。"}, {"id": "gl114a_3", "src": "114年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "Pacta tertiis nec nocent nec prosunt 一詞之意義為何？", "options": ["條約神聖原則", "需經國家同意方能使條約生效", "條約僅對締約國生效，不對第三國產生義務", "情勢發生重大且不可預見之變化"], "answer": 2, "explanation": "此一拉丁法諺意指「條約不損益第三者」，即條約原則上僅拘束締約當事國，非經其同意不對第三國創設權利義務。"}, {"id": "gl114a_4", "src": "114年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "關於「不干涉內政原則」，下列敘述何者錯誤？", "options": ["國際法基本規則要求，一國沒有權利侵害其他國家對國內事務的管轄", "依《聯合國憲章》第7章所為的執行措施，得適用於一國國內管轄事件", "依《聯合國憲章》規定，聯合國原則上不得干涉一國國內管轄事件", "依《聯合國憲章》要求，會員國須將所有爭端依憲章提交國際法院解決"], "answer": 3, "explanation": "聯合國憲章並未強制會員國將所有爭端提交國際法院解決，爭端解決方式尚包括談判、斡旋、調停、仲裁等多元途徑，本選項敘述錯誤。"}, {"id": "gl114a_5", "src": "114年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "關於國際法上的「國家繼承」，下列敘述何者錯誤？", "options": ["1978年《關於國家在條約方面的繼承的維也納公約》，與《維也納外交關係公約》相比，前者之爭議性較大", "1978年《關於國家在條約方面的繼承的維也納公約》為國家繼承原則之法典化成果之一", "國際法委員會於1983年已通過《關於國家在財產、檔案及債務方面的繼承的維也納公約》，但該公約尚未生效", "國家繼承包括因交戰關係而占領等暫時性的改變"], "answer": 3, "explanation": "國家繼承係指因領土主權變更（如獨立、合併、分裂）所生條約、財產等權利義務之繼受問題，交戰占領僅屬暫時性軍事管理而非領土主權之終局變更，並不構成國家繼承之情形，本選項敘述錯誤。"}, {"id": "gl114a_6", "src": "114年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "關於「人權」，下列敘述何者正確？", "options": ["《經濟社會文化權利國際公約》並沒有提到民族（人民）自決權", "《聯合國憲章》第1條規定，聯合國設立的目的是在達成國際合作，藉以促進和鼓勵對全體人類之人權與基本自由的尊重", "《國際人權憲章》是《公民與政治權利國際公約》及《經濟社會文化權利國際公約》二者之總稱", "人權事務屬於一國的國內管轄範圍，不適用國際法規範"], "answer": 1, "explanation": "聯合國憲章第1條第3項明定聯合國宗旨包括促進對人權與基本自由之尊重，本選項敘述正確；經社文公約第1條亦明文規定人民自決權（A錯誤）；「國際人權憲章」（International Bill of Human Rights）泛指世界人權宣言及兩公約合稱，不僅限於兩公約（C錯誤）；當代國際法已普遍認為人權事項不再純屬一國國內管轄範圍（D錯誤）。"}, {"id": "gl114a_7", "src": "114年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "下列區域何者並未受多邊公約之規範？", "options": ["國家管轄以外的海床和洋底及其底土", "南極", "地心", "蘇伊士運河"], "answer": 2, "explanation": "地心並非現行任何多邊公約所規範之特定法律地位區域；海洋法公約規範「區域」、南極條約規範南極、相關國際協定亦規範蘇伊士運河之通行地位。"}, {"id": "gl114a_8", "src": "114年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據《聯合國海洋法公約》第39條，關於船舶與航空器「過境通行」之義務，下列敘述何者錯誤？", "options": ["船舶與航空器應毫不遲延地通過或飛越海峽", "船舶與航空器不得對海峽沿岸國的主權、領土完整或政治獨立進行任何武力威脅或使用武力", "船舶與航空器除因不可抗力或遇難而有必要外，不得從事其繼續不停和迅速過境的通常方式所附帶發生的活動以外的任何活動", "船舶與航空器得進行任何研究或測量活動"], "answer": 3, "explanation": "依公約第40條，過境通行時外國船舶（含海洋科學研究和水文測量船）非經海峽沿岸國事前准許，不得進行任何研究或測量活動，本選項敘述錯誤。"}, {"id": "gl114a_9", "src": "114年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "依據《聯合國海洋法公約》，關於群島水域，下列敘述何者錯誤？", "options": ["群島國應尊重其他國家所鋪設的通過其水域而不靠岸的現有海底電纜", "群島國應承認直接相鄰國在群島水域範圍內某些區域的傳統捕魚權", "原則上所有國家的船舶均享有通過群島水域的無害通過權", "航空器不享有群島水域空中通行權"], "answer": 3, "explanation": "依公約規定，群島水域內劃定群島海道者，所有國家之船舶及航空器均享有「群島海道通過權」，航空器並非完全不享有空中通行權，本選項敘述錯誤。"}, {"id": "gl114a_10", "src": "114年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "有關世界貿易組織之爭端解決機構，下列敘述何者正確？", "options": ["世界貿易組織爭端解決機構是國際貿易法領域中成立的第一個爭端解決機制", "《世界貿易組織協定》係爭端解決機構適用之唯一法源", "爭端解決機構就《世界貿易組織協定》之爭端，享有強制和專屬的管轄權", "爭端解決機構已獲得世界貿易組織會員之信任，向其上訴機構提出上訴的比率相當低"], "answer": 2, "explanation": "依爭端解決規則與程序瞭解書（DSU），DSB對WTO內括協定爭端享有強制且專屬之管轄權，會員不得逕自訴諸其他論壇，本選項敘述正確；GATT時期即已存在爭端解決機制，並非首創（A錯誤）；DSU本身及其他內括協定亦為適用法源，非僅WTO協定（B用語不精確）；實務上上訴比率相當高而非偏低（D錯誤）。"}, {"id": "gl114a_11", "src": "114年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列何者並非一國法院經常用以決定跨境電信詐騙犯罪案件管轄權之依據？", "options": ["領域管轄", "普遍管轄", "行為人國籍管轄", "被害者國籍管轄"], "answer": 1, "explanation": "普遍管轄原則通常適用於海盜、種族滅絕、戰爭罪等國際核心罪行，跨境電信詐騙案件管轄權主要依領域、行為人國籍及被害人國籍等連繫因素決定，較少援引普遍管轄。"}, {"id": "gl114a_12", "src": "114年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "依2001年《國家對國際不法行為的責任條款草案》，關於「一國國際不法行為之要素」，下列敘述何者錯誤？", "options": ["是由一個不法的作為或不作為造成", "存在一個違反義務的作為或不作為", "不法的作為或不作為是可歸責於某一個國家", "國際不法行為之認定應依國際法及國內法共同為之"], "answer": 3, "explanation": "依責任條款草案第3條，一國行為是否構成國際不法行為，應依國際法認定，不受該行為依國內法是否合法之影響，本選項敘述錯誤。"}, {"id": "gl114a_13", "src": "114年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "隨著國際環境法法律原則之發展，下列敘述何者錯誤？", "options": ["國家負有一般義務確保其管轄範圍內之活動尊重他國環境，已為1996年國際法院「威脅使用或使用核武器合法性」諮詢意見所確認", "污染者付費原則已被1972年《聯合國人類環境會議宣言》確認為一般法律原則", "要求進行環境影響評估已為2010年國際法院「烏拉圭河紙漿廠」判決所確認", "永續發展概念已被運用於一般經貿協定中"], "answer": 1, "explanation": "污染者付費原則係於1992年里約環境與發展宣言（而非1972年斯德哥爾摩人類環境會議宣言）中受到明確確認及闡述，本選項敘述錯誤。"}, {"id": "gl114a_14", "src": "114年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "依據《聯合國憲章》第7章，有關聯合國安全理事會，下列敘述何者錯誤？", "options": ["在「人道干預」之情形下，不需事前經安全理事會之決議，聯合國秘書長得逕自要求會員國採取緊急軍事措施", "安全理事會應斷定任何和平之威脅、和平之破壞、或侵略行為之是否存在，並應作成建議或採取適當之辦法，以維持或恢復國際和平及安全", "安全理事會得採取必要之空海陸軍行動，以維持或恢復國際和平及安全", "安全理事會得決定採取武力以外之辦法，以維持國際和平與安全，並得要求聯合國會員採取該相關措施"], "answer": 0, "explanation": "依憲章第7章，採取軍事措施之權限專屬於安全理事會（第39條、第42條），秘書長並無逕自要求會員國採取緊急軍事措施之職權，本選項敘述錯誤。"}, {"id": "gl114a_15", "src": "114年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "依《聯合國憲章》第4條，關於申請成為聯合國會員國的程序，下列敘述何者正確？", "options": ["經大會會員國二分之一之出席與同意行之", "經安全理事會理事國三分之二之出席與同意", "由大會經安全理事會之推薦以決議行之", "經安全理事會理事國二分之一之出席與同意"], "answer": 2, "explanation": "依憲章第4條，新會員入會須先經安全理事會推薦，再由大會決議通過，本選項敘述正確。"}, {"id": "gl114a_16", "src": "114年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "世界貿易組織之規範體系不包括下列何協定？", "options": ["與貿易有關之貨幣互換協定", "服務貿易總協定", "與貿易有關之智慧財產權協定", "技術性貿易障礙協定"], "answer": 0, "explanation": "WTO並無所謂「與貿易有關之貨幣互換協定」，服務貿易總協定（GATS）、與貿易有關智慧財產權協定（TRIPS）及技術性貿易障礙協定（TBT）均為WTO協定體系之一部分。"}, {"id": "gl114a_17", "src": "114年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "菲律賓於2013年1月提出有關南海爭議的爭端解決，是向下列何者提出？", "options": ["常設仲裁法院", "國際法院", "國際海洋法法庭", "《聯合國海洋法公約》附件七仲裁庭"], "answer": 3, "explanation": "菲律賓依聯合國海洋法公約附件七提起強制仲裁程序，仲裁庭由常設仲裁法院（PCA）提供秘書處服務，惟程序依據為附件七仲裁機制，而非向PCA本身或ICJ、ITLOS提出。"}, {"id": "gl114a_18", "src": "114年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "《聯合國憲章》第2條規定多項原則，下列敘述何者錯誤？", "options": ["各會員國應以和平方法解決其國際爭端，俾免危及國際和平、安全及正義", "各會員國在其國際關係上不得使用威脅或武力，或以與聯合國宗旨不符之任何其他方法，侵害任何會員國或國家之領土完整或政治獨立", "當任何會員遭受軍事攻擊時，聯合國大會得採取必要之空海陸軍行動，以維持或恢復該國之和平及安全", "本憲章不得認為授權聯合國干涉在本質上屬於任何國家國內管轄之事件，且並不要求會員國將該項事件依本憲章提請解決；但此項原則不妨礙第7章內執行辦法之適用"], "answer": 2, "explanation": "採取必要之空海陸軍行動以維持或恢復國際和平及安全之權限，依憲章第42條係屬安全理事會，而非聯合國大會，本選項敘述錯誤。"}, {"id": "gl114a_19", "src": "114年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "1949年四個日內瓦公約的共同第3條，確立在非國際性武裝衝突的情形下，衝突之各方對不實際參與戰鬥人員應給予之人道待遇。下列何者非共同第3條具體提及之內容？", "options": ["禁止劫持作為人質", "禁止強迫遷移", "禁止未經公正審判而判處刑罰", "公正的人道團體得向衝突各方提供服務的權利"], "answer": 1, "explanation": "日內瓦四公約共同第3條明文禁止：對生命與人身施加暴力（含殺害、酷刑）、劫持人質、侵害人格尊嚴、未經正常組成法庭公正審判而科刑或執行死刑，並規定公正人道團體得提供服務，惟並未具體提及「禁止強迫遷移」。"}, {"id": "gl114a_20", "src": "114年外交特考", "kind": "外交特考", "topic": "國際環境與經濟法", "stem": "關於與國際環境保護相關的公約規範，下列敘述何者錯誤？", "options": ["《控制危險廢物越境轉移及其處置巴塞爾公約》（Basel Convention on the Control of Transboundary Movements of Hazardous Wastes and Their Disposal）完全禁止廢棄物跨國移轉", "《防止海洋油污染國際公約》（International Convention for the Prevention of Pollution of the Sea by Oil）限制有害物質的排放", "依據《生物多樣性公約》（Convention on Biological Diversity），可否取得遺傳資源的決定權屬於國家政府", "《巴黎協定》採國家自主貢獻方式，減量降低溫室氣體的排放"], "answer": 0, "explanation": "巴塞爾公約旨在管制（非完全禁止）危險廢物之越境轉移，要求事前告知同意程序等管制機制，並未全面禁止跨國移轉，本選項敘述錯誤。"}, {"id": "gl115a_1", "src": "115年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列何者非國家領土取得的方式？", "options": ["添附", "發現", "先占", "割讓"], "answer": 1, "explanation": "「發現」只產生初步權利（不完全權利），須在合理期間內有效占領始能取得主權（帕爾馬斯島仲裁案），本身不是取得方式；添附、先占、割讓都是。"}, {"id": "gl115a_2", "src": "115年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "關於國家承認與國家繼承，下列敘述何者錯誤？", "options": ["對於過急承認，國際法上不鼓勵", "對於他國為國家承認，原則上是不可以撤回的", "對於政府繼承，普遍認為適用「國家繼續原則」", "依據《關於國家在條約方面的繼承的維也納公約》，國家單獨對於條約繼承所做出之選擇性適用聲明，將拘束第三國"], "answer": 3, "explanation": "依1978年《關於國家在條約方面的繼承的維也納公約》，繼承國的單方聲明本身不影響條約其他當事國的權利義務，不拘束第三國，故D錯誤。"}, {"id": "gl115a_3", "src": "115年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "依據國際規範及實踐，下列那類條約不受國家繼承影響，將繼續適用於繼承國？", "options": ["仲裁條約", "國際人權條約", "建立非軍事區之條約", "建立國際組織之條約"], "answer": 2, "explanation": "邊界條約與其他領土制度（如設立非軍事區）不受國家繼承影響（1978年公約第11、12條），繼續適用於繼承國。"}, {"id": "gl115a_4", "src": "115年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "下列有關國籍之敘述何者正確？", "options": ["有關國籍的規定多由各國國內法決定，就原始國籍而言，我國《國籍法》採血統制為主，出生地制為輔", "國家不得將本國人引渡至他國接受調查或審判", "依據國際法院判決，公司國籍國為其主要營運地所在地國", "為減少無國籍狀態，任何人的國籍均不得剝奪"], "answer": 0, "explanation": "國籍原則上由各國國內法決定；我國國籍法採血統主義為主、出生地主義為輔。B錯：許多國家會引渡本國人；C錯：巴塞隆納電力公司案以設立地與登記營業所為準；D錯：國際法並未絕對禁止剝奪國籍。"}, {"id": "gl115a_5", "src": "115年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "受氣候變遷與環境影響而流離失所者被稱為氣候難民（climate refugees）。關於「氣候難民」，下列敘述何者正確？", "options": ["根據1951年《關於難民地位公約》，因氣候變遷流離失所者應享有難民地位", "《巴黎協定》正式將「氣候難民」納入規範，為國際環境法與國際人權法的一大進步", "現行國際法框架對氣候難民並無普遍適用的保障規範及機制", "聯合國人權事務委員會認為，氣候難民之遣返應納入《聯合國氣候變遷框架公約》規範，而非適用《公民與政治權利國際公約》"], "answer": 2, "explanation": "因氣候變遷流離失所者通常不符合難民公約的難民定義，《巴黎協定》也未納入「氣候難民」，現行國際法沒有普遍適用的專門保障機制。"}, {"id": "gl115a_6", "src": "115年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "有關條約法之規範，下列敘述何者正確？", "options": ["兩國斷交後，其彼此間條約當然失效", "兩個無外交關係之國家仍可締結條約", "條約生效後，締約國在依其國內法規定完成條約之內國法化程序前，可暫時性的不履行該條約", "《維也納條約法公約》規定國家間非書面協議不具條約效力"], "answer": 1, "explanation": "依條約法公約第74條，國家間無外交關係不妨礙締結條約。A錯（第63條）；C錯：不得以國內法為由不履行條約（第27條）；D錯：第3條明定公約不適用於非書面協定，但不影響其法律效力。"}, {"id": "gl115a_7", "src": "115年外交特考", "kind": "外交特考", "topic": "條約法", "stem": "關於條約登記，下列何者正確？", "options": ["根據《聯合國憲章》第102條，條約應在聯合國祕書處登記，始生效力", "根據《聯合國憲章》第102條，條約採登記制度，未登記者，不得向聯合國任何機關援引之", "《國際聯盟盟約》第18條亦為聯合國憲章全文援引", "為避免第一次世界大戰前秘密外交之情形發生，條約必須在網路公開"], "answer": 1, "explanation": "憲章第102條：未登記的條約不得向聯合國任何機關援引，但條約效力不受影響。A錯（登記非生效要件）；C錯：國際聯盟盟約第18條是未登記不生拘束力，憲章並未照搬。"}, {"id": "gl115a_8", "src": "115年外交特考", "kind": "外交特考", "topic": "國家、承認與繼承", "stem": "聯合國託管委員會在1994年11月停止運作，下列那個國家是其協助獨立的最後一個前殖民地？", "options": ["帛琉", "吐瓦魯", "聖露西亞", "聖文森及格瑞那丁"], "answer": 0, "explanation": "帛琉是最後一個託管領土，1994年獨立，託管理事會隨後於1994年11月停止運作。"}, {"id": "gl115a_9", "src": "115年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "下列關於基線的敘述何者錯誤？", "options": ["測算領海寬度的正常基線是沿海國官方承認的大比例尺海圖所標明的沿海低潮線", "直線基線與聯合國國際法院英國與挪威漁業權案密切相關", "中華民國內政部在南海仲裁案後公告了太平島基線", "領海的外部界限是一條其每一點同基線最近點的距離等於領海寬度的線"], "answer": 2, "explanation": "我國1999年公告第一批領海基線時，南沙群島的基線另案公告，至今未公告太平島基線，故C錯誤；直線基線源自英挪漁業案。"}, {"id": "gl115a_10", "src": "115年外交特考", "kind": "外交特考", "topic": "海洋法", "stem": "關於1982年《聯合國海洋法公約》規範之海域管轄，下列敘述何者錯誤？", "options": ["領海基線向陸地一側之所有水域，稱之為內水", "鄰接區自領海基線起算，至多24海里", "專屬經濟海域自鄰接區外緣起算，不得超過200海里", "大陸礁層自領海基線起，至多不得超過350海里"], "answer": 2, "explanation": "專屬經濟海域自領海基線起算不超過200海里（海洋法公約第57條），不是自鄰接區外緣起算。"}, {"id": "gl115a_11", "src": "115年外交特考", "kind": "外交特考", "topic": "領土與管轄權", "stem": "關於引渡之國際法規則，下列敘述何者錯誤？", "options": ["國家可基於國際禮讓（comity）進行引渡", "各國原則上不引渡政治犯，但對政治犯之認定，受引渡請求國有片面與終局決定權", "引渡之義務必須透過締結條約而建立", "按雙重犯罪原則，引渡以被引渡人在受引渡請求國亦受有罪判決確定為前提"], "answer": 3, "explanation": "雙重犯罪原則要求該行為在請求國與被請求國均構成犯罪，不要求被引渡人已受有罪判決確定。"}, {"id": "gl115a_12", "src": "115年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "關於外交代表與其家屬之豁免，下列敘述何者正確？", "options": ["依據《維也納外交關係公約》，外交代表之私人僕役，充當使館人員傭僕時，並非該公約所指享有豁免權之人員", "外交代表對接受國之管轄豁免，包括實際之責任豁免", "依據《維也納外交關係公約》，使館之行政與技術人員之家屬，對接受國民事、刑事、行政管轄，在其執行職務範圍內，享有豁免", "外交代表之家屬，習慣法上包括共同生活之配偶與未成年子女"], "answer": 3, "explanation": "外交代表的家屬，習慣上指構成其戶口一部分的配偶與未成年子女。B錯：管轄豁免不等於免除實體責任（外交關係公約第31條第4項）。"}, {"id": "gl115a_13", "src": "115年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "依據聯合國國際法委員會《國家對國際不法行為的責任條款草案》，下列那個概念並非國家解除行為不法性的要件？", "options": ["同意", "制裁", "自衛", "不可抗力因素"], "answer": 1, "explanation": "國家責任條款草案第20至25條的解除不法性事由為同意、自衛、反措施、不可抗力、危難、危急情況；「制裁」不是其中之一。"}, {"id": "gl115a_14", "src": "115年外交特考", "kind": "外交特考", "topic": "國家豁免與國家責任", "stem": "有關2001年《國家對國際不法行為的責任條款草案》中，所謂相應措施（countermeasures）的規定，下列敘述何者正確？", "options": ["相應措施包括武力使用", "相應措施無需符合比例原則", "未直接受害的國家在任何情事下，皆無權對加害國實施相應措施", "實施相應措施不得使保護基本人權的義務受影響"], "answer": 3, "explanation": "反措施不得影響保護基本人權的義務（國家責任條款草案第50條第1項）；不得使用武力、須符合比例原則（第51條），非受害國依第54條仍可採取合法措施。"}, {"id": "gl115a_15", "src": "115年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "關於不具外交或領事性質之人員，其在國際法上之權利義務，下列敘述何者錯誤？", "options": ["間諜在國際法上沒有外交豁免之地位", "間諜在當地國造成損害或人員傷亡時，派遣間諜的國家仍舊要負國際責任", "為了解他國是否履行某些國際義務，經其同意，得派遣觀察員到該他國執行觀察之工作", "派遣到他國代表國營企業之商務代表，亦享有外交特權與豁免"], "answer": 3, "explanation": "國營企業的商務代表不具外交人員身分，不當然享有外交特權與豁免。"}, {"id": "gl115a_16", "src": "115年外交特考", "kind": "外交特考", "topic": "外交與領事關係", "stem": "有關外交關係及外交使館的敘述，何者錯誤？", "options": ["建立外交關係可解讀具國家承認之效果，但斷交不等於撤回國家承認", "兩國同意建立外交關係後不需另行協議，即可互設常駐使館及派駐人員", "《維也納外交關係公約》中肯認使館及外交代表之特殊地位，但並未賦予提供外交庇護之權利", "外交人員及領事人員關係密切但具不同功能，但外交使館得執行領事職務"], "answer": 1, "explanation": "建立外交關係及設立常駐使館，均須經雙方協議（外交關係公約第2條），故B錯誤；使館得執行領事職務（第3條第2項）。"}, {"id": "gl115a_17", "src": "115年外交特考", "kind": "外交特考", "topic": "使用武力與國際人道法", "stem": "《北大西洋公約》第5條規定，任一成員國受到攻擊時，視為對全體成員國之攻擊，其他成員國可以採取必要行動協助受攻擊之成員國，下列敘述何者錯誤？", "options": ["《北大西洋公約》第5條規定是《聯合國憲章》第51條所承認的集體自衛權", "集體自衛權的行使不需事先得到聯合國安理會的授權", "依據聯合國安理會，集體自衛權的行使僅能針對由國家或政府發動的武力攻擊", "自衛是國家的自然權利，不是聯合國憲章所創設或賦予的"], "answer": 2, "explanation": "安理會並未表示集體自衛只能針對國家發動的武力攻擊（九一一事件後的第1368號決議確認自衛權），故C錯誤；自衛為固有權利，行使不需安理會事先授權。"}, {"id": "gl115a_18", "src": "115年外交特考", "kind": "外交特考", "topic": "國際組織與聯合國", "stem": "對於聯合國的法律權能，下列敘述何者錯誤？", "options": ["聯合國得成為國際法院的訴訟當事人", "聯合國與國家間發生爭端，聯合國可以提交仲裁", "聯合國具有締結條約的能力", "聯合國可代其受僱人向加害國索償"], "answer": 0, "explanation": "依規約第34條，只有國家能成為國際法院訴訟當事國，聯合國不能；但聯合國可請求諮詢意見、締約、依賠償案向加害國求償。"}, {"id": "gl115a_19", "src": "115年外交特考", "kind": "外交特考", "topic": "國際法院與爭端解決", "stem": "有關國際法院（International Court of Justice）對國家間爭端之訴訟管轄權，下列敘述何者錯誤？", "options": ["所謂強制管轄聲明，是指國家事先依國際法院規約聲明接受國際法院管轄", "國際法院規約締約方接受強制管轄之聲明得附帶條件", "倘當事國對國際法院就案件是否有管轄權有所爭執，該管轄權爭議應由常設仲裁庭（Permanent Court of Arbitration）審議", "非國際法規約締約國也可以在國際法院進行爭訟"], "answer": 2, "explanation": "依規約第36條第6項，法院有無管轄權的爭端由國際法院自己裁決，不是交常設仲裁法院。"}, {"id": "gl115a_20", "src": "115年外交特考", "kind": "外交特考", "topic": "國際人權與刑事法", "stem": "下列那個國際司法機構接受個人作為訴訟主體？", "options": ["聯合國國際法院", "世界貿易組織", "國際海洋法法庭", "歐洲人權法院"], "answer": 3, "explanation": "歐洲人權法院接受個人申訴；國際法院、WTO爭端解決限於國家（或會員）。"}, {"id": "SG001", "src": "111年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "關於引渡之國際法規則，下列敘述何者錯誤？", "options": ["不論本國人或外國人均可被引渡，但國際法允許各國立法規定拒絕引渡本國人", "政治犯原則上不引渡，但對政治犯之認定，受引渡請求國有片面與終局決定權", "甲國派遣特工至乙國領土內將人犯綁架秘送回甲國，甲國法院對該人犯即無權審理", "除有雙邊條約外，國家之間並無引渡罪犯之義務，惟亦有可能透過多邊條約規定締約國間有引渡義務者，如1948年之危害種族罪公約"], "answer": 2, "explanation": "各國司法實務普遍認為，即使人犯係經非法綁架方式解送回國（違反國際法上之地域主權原則），法院對該人犯仍得依「不問方式取得管轄」（male captus, bene detentus）原則行使審判權，並非「無權審理」，此為本題錯誤選項。"}, {"id": "SG002", "src": "111年律師一試", "kind": "律師一試", "topic": "國際法院與爭端解決", "stem": "國際法院規約第38條規範國際法院審判時得適用之法源，下列敘述何者錯誤？", "options": ["國際法院得適用對爭端國有拘束力之條約", "在法源順位上，條約應優先於習慣國際法適用", "國際法院之判決除對於當事國及本案外，並無拘束力", "國際法院亦得引用各國最高權威之公法學說，作為裁判法源"], "answer": 1, "explanation": "國際法院規約第38條所列法源（條約、習慣國際法、一般法律原則等）並未明定其相互間存在絕對之優先適用順位，條約與習慣國際法之適用取決於具體個案情形，並非條約「應優先於」習慣國際法適用，此為本題錯誤選項。"}, {"id": "SG003", "src": "111年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "國際法院在1962年柏威夏古寺案（Cambodia v. Thailand）判決中，認為泰國不得再主張系爭古寺附近領土主權之理由為何？", "options": ["領土不在國家繼承涵蓋之範圍", "已依條約割讓該領土", "已依禁反言原則喪失該領土", "對該領土之占領不符合時效取得要件"], "answer": 2, "explanation": "國際法院於柏威夏古寺案認為，泰國過去長期默認地圖劃界結果並未提出異議，其後又反覆主張相反立場，已構成「禁反言」（estoppel），故不得再爭執該領土主權之歸屬。"}, {"id": "SG004", "src": "111年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "關於條約締結法之國際書面協定，下列敘述何者錯誤？", "options": ["定有批准、接受、贊同或加入條款者，為條約", "未定有批准、接受、贊同或加入條款者，無須經立法院審議通過", "內容涉及國防、外交等國家重要事項者，為條約", "雖不涉及國內法律之變更，但內容對締約各方均具拘束力者，仍為協定"], "answer": 1, "explanation": "依條約締結法規定，縱使國際書面協定未定有批准等條款而屬「協定」性質，惟若其內容具有法律上效力、涉及國家重要事項或人民權利義務者，仍應送立法院審議，並非「無須」經立法院審議通過，此為本題錯誤選項。"}, {"id": "SG005", "src": "111年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "關於條約之批准，下列敘述何者錯誤？", "options": ["批准表示國家願意承受條約拘束之同意", "條約是否要批准，完全由締約國自行決定，國家並無批准條約之義務", "批准是締約國表達同意受條約拘束之唯一方式", "設有生效要件之多邊條約，仍須待該條約生效要件滿足後，始對批准國生拘束力"], "answer": 2, "explanation": "國家表達同意受條約拘束之方式多元，除批准外，尚包括簽署、接受、贊同或加入等方式，並非「唯一」以批准為之，此為本題錯誤選項。"}, {"id": "SG006", "src": "111年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國家「中立化（neutralization）」之敘述，下列敘述何者正確？", "options": ["一國須經過聯合國大會決議同意，其「中立化」之宣告始生拘束力", "「中立化」之國家不得任意宣告終止中立地位", "「中立化」之國家應避免提供交戰國軍事基地，或以其領土作為軍事目的使用", "「中立化」之國家不得對交戰國之違反人類犯罪發表譴責聲明"], "answer": 2, "explanation": "中立化國家（如永久中立國瑞士）之核心義務，即在於避免捲入軍事同盟或衝突，包括不得提供交戰國軍事基地或以其領土供軍事目的使用；中立化通常透過條約而非聯合國大會決議形成，中立國仍得就違反人道之國際罪行表達譴責，中立地位之終止亦非絕對禁止。"}, {"id": "SG007", "src": "111年律師一試", "kind": "律師一試", "topic": "國際組織與聯合國", "stem": "關於聯合國之經費，下列敘述何者正確？", "options": ["踰越聯合國憲章規定權限之行為，即使符合憲章之目的，其支出仍不屬聯合國之經費", "聯合國憲章並未規定所屬各機關行為有效性之認定基準，各機關得自行認定其支出經費之合法性", "若支出經費與聯合國之經常性支出根本不同，即不得被認定為聯合國之經費", "由於聯合國是政治性組織，支出經費限於符合政治性目的者，始屬合法"], "answer": 1, "explanation": "依國際法院1962年關於聯合國若干經費之諮詢意見：憲章並未規定判斷各機關行為有效性的專屬程序，各機關至少須先自行決定其管轄權，故B正確。A錯：即使由錯誤機關作成決定（機關間權限分配不當），也不當然使其支出不屬聯合國經費，且為實現宗旨之行為推定未逾越權限；C錯：「經費」依文義指全部支出，不限經常性支出；D錯：聯合國經費不以政治性目的為限。"}, {"id": "SG008", "src": "111年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國家繼承，下列敘述何者錯誤？", "options": ["國家繼承是指因國家之解消、分裂、兼併、割讓等原因永久一部或全部消滅，對其權利義務加以繼受之程序", "國家繼承可能因繼受國之選擇而造成不完全繼承", "即使是無關主權功能之財產如元首之受贈物，仍當然屬於國家繼承之標的", "國家檔案屬於與主權功能有關之財產，當然屬於國家繼承之標的"], "answer": 2, "explanation": "與國家主權功能無關之財產（如元首個人受贈物等私人性質財產），並非當然屬於國家繼承之標的，僅與主權公務功能相關之財產（如國家檔案）始屬國家繼承之典型標的，此為本題錯誤選項。"}, {"id": "SG009", "src": "111年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "關於國際法對引渡所建立之原則，下列敘述何者正確？", "options": ["種族滅絕罪嫌重大者，得視為政治犯而拒絕引渡", "引渡後有遭受酷刑之具體風險者，應拒絕引渡", "非法劫持航空器者，應視其政治動機判斷是否引渡", "被引渡人受追訴之罪名，不限於引渡請求書所載之罪"], "answer": 1, "explanation": "國際人權法及引渡實務普遍肯認「不驅逐原則」之延伸適用，若引渡後該人有遭受酷刑之具體風險，應拒絕引渡；種族滅絕、劫機等重大國際犯罪通常不得以政治犯為由拒絕引渡，且依「特定性原則」，被引渡人受追訴之罪名原則上應限於引渡請求書所載之罪。"}, {"id": "SG010", "src": "111年律師一試", "kind": "律師一試", "topic": "國際法院與爭端解決", "stem": "關於國際法院得受理之案件，下列敘述何者錯誤？", "options": ["安全理事會有權向國際法院提出諮詢意見案", "個人亦得以規約締約國違反條約為由，向國際法院提起訴訟", "提起訴訟之國家，必須對爭端在法律上有權利或利益", "爭端當事國皆同意接受管轄時，國際法院得受理該訴訟"], "answer": 1, "explanation": "國際法院訴訟程序之當事人僅限於「國家」，個人並無資格逕以規約締約國違反條約為由向國際法院提起訴訟，此為本題錯誤選項。"}, {"id": "SG011", "src": "112年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "有關國際法上永久中立國，下列敘述何者正確？", "options": ["國家得自行宣告為永久中立國而無須獲得他國承認", "永久中立國必須承諾不參加軍事同盟", "在遭受他國攻擊時，永久中立國不得使用武力加以自衛", "永久中立國得提供其領土給他國作為軍事上的使用"], "answer": 1, "explanation": "永久中立國之核心義務即承諾不參加軍事同盟或捲入他國間之戰爭；其地位通常須經他國承認或條約確認方具國際法效力，中立國遭受攻擊時仍得行使自衛權，亦不得提供領土供他國軍事使用。"}, {"id": "SG012", "src": "112年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "有關國際法上政府承認，下列敘述何者正確？", "options": ["一國得以他國新政府應繼承舊政府之條約義務，作為加以承認之條件", "國家有義務不得承認藉由武裝革命所成立之新政府", "不被承認的政府，在事實上無法行使國家之權能", "撤銷對他國政府之承認，即等同於撤銷對其國家之承認"], "answer": 0, "explanation": "國家於承認他國新政府時，得將該新政府承諾繼受舊政府條約義務作為承認之條件之一；國際法上並未絕對禁止承認經武裝革命成立之新政府，未受承認之政府在事實上仍可能有效統治並行使國家權能，政府承認與國家承認性質不同，撤銷政府承認並不當然等同撤銷國家承認。"}, {"id": "SG013", "src": "112年律師一試", "kind": "律師一試", "topic": "國際組織與聯合國", "stem": "有關國際組織之地位與權能，下列敘述何者正確？", "options": ["聯合國之總部位置，由聯合國秘書處選定", "依1949年國際法院之諮詢意見，聯合國對雇員所受職務上損害，有獨立求償之權能", "國際組織違反國際法，會員國當然應負擔連帶責任", "國際組織之權能，僅以章程所明定者為限"], "answer": 1, "explanation": "依國際法院1949年關於聯合國雇員受害求償案諮詢意見，聯合國具有獨立之國際法律人格，得就其雇員因執行職務所受損害向責任國提出求償；聯合國總部位置係經會員國協議決定，國際組織違反國際法未必當然使會員國負連帶責任，其權能亦不限於章程明文規定者（尚包含達成宗旨所需之隱含權能）。"}, {"id": "SG014", "src": "112年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "有關國際法上人民自決權，下列敘述何者錯誤？", "options": ["人民自決權屬於國際法所明文承認之人權", "人民自決權在規範性質上屬於國際強行法", "人民自決權僅得由殖民地和非自治領土之人民行使", "國家有義務避免採取干涉或限制人民自決權行使之行為"], "answer": 2, "explanation": "人民自決權之行使主體並不僅限於殖民地或非自治領土人民，亦得適用於遭外國占領或其他特殊情況下之人民，並非「僅得」由殖民地及非自治領土人民行使，此為本題錯誤選項。"}, {"id": "SG015", "src": "112年律師一試", "kind": "律師一試", "topic": "國際人權與刑事法", "stem": "關於國際法對個人權利之保障，下列敘述何者錯誤？", "options": ["依1951年難民地位公約，除因國家安全或公共秩序理由外，締約國不得驅逐合法在其領土內之難民", "公民與政治權利國際公約與經濟社會文化權利國際公約，為保障個人權利之核心國際公約", "條約與各國司法實務都已確立，從事普通犯罪之人不得主張為政治犯而不受引渡", "日內瓦公約及其附加議定書保障平民與戰俘，在武裝衝突中應受人道之待遇"], "answer": 2, "explanation": "從事普通犯罪與具政治性質犯罪之區辨於國際引渡實務及學說上仍存有相當爭議，並非已「確立」從事普通犯罪者一律不得主張政治犯身分而拒絕引渡，此仍屬個案認定問題，此為本題錯誤選項。"}, {"id": "SG016", "src": "112年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "依條約締結法，關於條約之締結，下列敘述何者錯誤？", "options": ["具專門性、技術性之條約及協定，其簽訂應由各專司部會主辦，無須經外交部同意", "主辦機關於條約草案內容獲致協議前，得就談判之方針、原則及可能爭議事項，適時向立法院說明並向立法院相關委員會報告", "雙邊條約經立法院決議修正者，應退回主辦機關與締約對方重新談判", "條約或協定之約本，應同時以中文及締約對方之官方文字作成，各種文本同等作準為原則"], "answer": 0, "explanation": "依條約締結法規定，即使具專門性、技術性之條約及協定，其簽訂仍應會商外交部同意後始得辦理，並非「無須」經外交部同意，此為本題錯誤選項。"}, {"id": "SG017", "src": "112年律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於沿海國依聯合國海洋法公約對大陸礁層得主張之權利，下列敘述何者正確？", "options": ["即使事實延伸超過200浬，沿海國仍僅得主張不超過200浬之大陸礁層權利", "所有締約國主張之大陸礁層，均須經大陸礁層界限委員會審查核定後始生拘束力", "沿海國向國際海床管理局繳付開發大陸礁層之費用，得選擇以金錢或實物方式繳納", "內陸國因事實上沒有大陸礁層，所以無權享有或分配大陸礁層開發所獲取之惠益"], "answer": 2, "explanation": "聯合國海洋法公約規定，沿海國就200浬外大陸礁層開發所獲利益應向國際海床管理局繳付費用或實物，並得選擇繳納方式；若地質延伸事實超過200浬，沿海國得依公約程序主張延伸至最遠350浬或2500公尺等深線外100浬之大陸礁層，內陸國亦得依公約規定分享此類惠益（不因無大陸礁層而完全喪失分配資格）。"}, {"id": "SG018", "src": "112年律師一試", "kind": "律師一試", "topic": "使用武力與國際人道法", "stem": "甲國占領乙國部分領土。甲國僅加入公民與政治權利國際公約（ICCPR），乙國則僅加入經濟社會文化權利國際公約（ICESCR）。關於乙國被占領區內人民享有之兩公約權利保障，下列敘述何者正確？", "options": ["被占領區人民僅受ICCPR保障", "被占領區人民僅受ICESCR保障", "被占領區人民同受ICCPR及ICESCR保障", "被占領區人民不受ICCPR或ICESCR保障"], "answer": 2, "explanation": "占領國（甲國，ICCPR締約國）於其實際管轄（占領）之領土內，其公約義務隨其管轄權延伸適用；而被占領領土之原主權國（乙國，ICESCR締約國）之公約義務亦不因遭占領而當然免除，故被占領區人民同時受兩公約之保障。"}, {"id": "SG019", "src": "112年律師一試", "kind": "律師一試", "topic": "國際法院與爭端解決", "stem": "國際法院對國家間爭端之訴訟管轄權，須以當事國合意為基礎，下列敘述何者錯誤？", "options": ["國際法院對爭端利益相關第三方國家無管轄權，不影響其訴訟管轄權之行使", "爭端當事國得於爭端發生後，藉由特別協議接受國際法院管轄", "就爭端法律問題，國際法院規約締約國得隨時聲明承認國際法院強制管轄", "國際法院規約締約國就其接受國際法院強制管轄之聲明，不得附帶任何條件"], "answer": 3, "explanation": "國際法院規約第36條第3項明文規定，締約國得於其聲明接受強制管轄時，附加互惠條件或一定期限等保留條件，並非「不得附帶任何條件」，此為本題錯誤選項。"}, {"id": "SG020", "src": "112年律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於國際海洋法法庭，下列敘述何者正確？", "options": ["法庭管轄權不包括國家以外的實體", "法庭管轄權不包括聯合國海洋法公約以外其他協定所生之爭端", "法庭得為防止嚴重損害海洋環境，規定具有拘束力之臨時措施", "法庭得依職權裁定締約國應迅速釋放被扣留之船舶與船員，無待爭端方之提出"], "answer": 2, "explanation": "國際海洋法法庭為防止對海洋環境造成嚴重損害，得依聲請規定具有拘束力之臨時措施；該法庭管轄權尚可及於國家以外之特定實體（如國際海床管理局）及公約以外其他協定明文賦予管轄權之爭端，迅速釋放程序亦須經爭端一方提出聲請，非法庭得依職權主動裁定。"}, {"id": "SG021", "src": "113年律師一試", "kind": "律師一試", "topic": "國際法淵源與基本概念", "stem": "關於習慣國際法，下列敘述何者錯誤？", "options": ["習慣國際法必須經多國普遍且重複實踐，不能僅存於兩國之間", "一國自始持續反對他國之慣行，可以阻止習慣國際法之形成", "一國對他國行為的聲明、抗議、發布的新聞稿，都可能被當成是否對習慣國際法具有法之確信的證據", "習慣國際法也可能被成文化為條約之內容"], "answer": 0, "explanation": "習慣國際法之形成不以「多國」普遍實踐為絕對必要，亦可能存在於「兩國之間」之特殊習慣（bilateral custom），並非「不能僅存於兩國之間」，此為本題錯誤選項。"}, {"id": "SG022", "src": "113年律師一試", "kind": "律師一試", "topic": "使用武力與國際人道法", "stem": "日內瓦公約規定對非國際戰爭戰俘亦應提供最低程度待遇，在國際法上被認為具有習慣國際法之性質。若甲國為日內瓦公約之締約國，乙國不是締約國，丙國曾是締約國但之後退出。下列敘述何者錯誤？", "options": ["乙國對於非國際戰爭戰俘，有義務提供最低程度待遇", "丙國主張退出日內瓦公約後即欠缺法之確信，毋須對非國際戰爭戰俘提供最低程度待遇", "丙國退出日內瓦公約後，該公約對丙國無條約之拘束力", "日內瓦公約對乙國無條約之拘束力"], "answer": 1, "explanation": "日內瓦公約提供最低程度人道待遇之規定，已具備習慣國際法之性質，此種義務不因一國退出公約本身而當然免除，丙國縱使退出公約（免除條約義務），仍應受具習慣國際法性質之最低待遇義務拘束，並非「毋須」提供，此為本題錯誤選項。"}, {"id": "SG023", "src": "113年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國際法上非國家政治實體，下列敘述何者錯誤？", "options": ["二戰後之託管地在完成獨立或與他國結合之前，得被歸類為非國家政治實體", "有效控制特定領土而被承認之交戰團體，得被歸類為非國家政治實體", "非國家政治實體之流亡政府，指對其領土喪失有效統治而迫遷他國的政府", "非國家政治實體之民族解放團體，在未完成獨立並獲承認前，不得參與聯合國或其專門機構舉行之會議"], "answer": 3, "explanation": "民族解放團體於未完成獨立建國並獲國際承認前，於一定條件下仍可能取得聯合國大會觀察員地位，得參與聯合國或其專門機構舉行之相關會議，並非「不得參與」，此為本題錯誤選項。"}, {"id": "SG024", "src": "113年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國際法中之國家承認，下列敘述何者錯誤？", "options": ["對於交戰團體之承認，可能違反不干涉（預）原則", "國家承認亦得藉由默示方式為之", "對一國家之承認，不得附加任何條件", "既存國家無國際法上之義務承認新國家"], "answer": 2, "explanation": "國家於承認新國家時，實務上仍可能附加一定之政治性條件（如要求承諾遵守特定國際義務），並非國際法上絕對禁止「附加任何條件」，此為本題錯誤選項。"}, {"id": "SG025", "src": "113年律師一試", "kind": "律師一試", "topic": "國際組織與聯合國", "stem": "關於國際組織，下列敘述何者錯誤？", "options": ["國際組織之權能，必須受其所由創設之法律文件規定之限制", "為了實現其設立之目的與宗旨，即使章程未明文規定，國際組織也可能擁有某些隱有的權能", "因維也納條約法公約之除外規定，國際組織無法成為締結條約之主體", "國際組織得自設行政法庭處理其與雇員間之勞資爭議，並依條約豁免駐在地法院之管轄"], "answer": 2, "explanation": "維也納條約法公約雖主要規範國家間條約，惟並未因此排除國際組織作為締約主體之資格，國際組織締結條約另有1986年維也納條約法公約（國家與國際組織間或國際組織相互間）予以規範，並非「無法成為締結條約之主體」，此為本題錯誤選項。"}, {"id": "SG026", "src": "113年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "依二次大戰後之國際法原則，關於國家取得領土主權之方式，下列敘述何者錯誤？", "options": ["國家得以合意交換方式取得領土主權", "對於公海上因自然力形成之島嶼，國家得先占取得其領土主權", "國家得藉由人工方式改造領海外之專屬經濟海域中低潮高地為島嶼，從而取得其領土主權", "國家不得以合法行使武力之方式取得他國領土主權"], "answer": 2, "explanation": "依國際法（含聯合國海洋法公約），低潮高地經人工填海造陸等方式改造為人工島嶼，並不因此使該國取得該處之領土主權或改變其海域地位，此為本題錯誤選項。"}, {"id": "SG027", "src": "113年律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於海域執法，下列敘述何者錯誤？", "options": ["除非條約另有約定，否則一國海巡船舶不得於公海對他國船舶之毒品運送行為進行登檢", "B國籍船舶與C國籍船舶在A國鄰接區內準備共同走私毒品至D國，A國對該二船不得行使管轄權", "發動緊追之政府船舶，如不在被緊追之外國船舶目視範圍內，即不得發動緊追", "用於航行之國際海峽沿海國，有權制定與執行該海峽分道航行之規則"], "answer": 1, "explanation": "沿海國於其鄰接區內，得為防止及處罰違反其海關、財政、移民或衛生法令（含毒品走私）之行為行使必要管制權，A國對於在其鄰接區內準備共同走私毒品之外國船舶，得依鄰接區管轄權行使必要管制措施，並非「不得行使管轄權」，此為本題錯誤選項。"}, {"id": "SG028", "src": "113年律師一試", "kind": "律師一試", "topic": "外交與領事關係", "stem": "關於國家管轄之豁免，下列敘述何者錯誤？", "options": ["一國元首於他國出訪時為子女購物所生之消費糾紛，得主張豁免該國法院之管轄", "一國之國營銀行就出具之信用狀於他國所生之爭執，得主張豁免該國法院之管轄", "一國依科學合作條約於他國領海探勘之公務船舶所致之損害，得主張豁免該國法院之管轄", "一國卸任元首對其在任期間之職務行為，得主張豁免他國法院之管轄"], "answer": 1, "explanation": "國營銀行從事商業性質行為（如出具信用狀等商業交易）所生之爭議，依「限制豁免原則」通常不得主張國家豁免，此與純粹公務性質行為（如元首私人行為、公務船舶執行公務行為）享有豁免之情形有別，此為本題錯誤選項。"}, {"id": "SG029", "src": "113年律師一試", "kind": "律師一試", "topic": "國家豁免與國家責任", "stem": "個人向國際人權條約監督機構提起訴訟或申訴前，應「窮盡當地救濟」。設定該尋求國際人權機構救濟條件之理由，下列敘述何者錯誤？", "options": ["尊重國際人權條約所載不干涉（預）原則條款", "允許被告國有機會修正錯誤或賠償損失", "內國程序訴訟效率較高且有利判決執行", "推定國家法體系正常運作以尊重管轄權"], "answer": 2, "explanation": "「窮盡當地救濟」原則之理由著重於尊重國家主權管轄、給予被告國自我修正機會，並非因「內國程序訴訟效率較高」（此非該原則設定之理由，且未必符合實際情形），此為本題錯誤選項。"}, {"id": "SG030", "src": "113年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "依羅馬規約之規定，下列何者不屬於國際刑事法院行使管轄權之條件？", "options": ["聯合國認證之人道組織向檢察官提交情勢", "締約國向檢察官提交本國情勢", "聯合國安全理事會依憲章第七章決議向檢察官提交情勢", "國際刑事法院檢察官依職權主動發動偵查"], "answer": 0, "explanation": "依羅馬規約，得提交情勢予檢察官者為締約國、聯合國安全理事會（依憲章第七章 律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於聯合國海洋法公約之解釋與適用爭端，下列敘述何者正確？", "options": ["涉及訴訟時，爭端締約國僅得選擇由國際海洋法法庭解決相關爭端", "涉及調解時，爭端締約國僅得從調解員名單中指定人選進行調解", "締約國得以書面聲明就海域劃界事項不接受強制爭端解決程序", "沿海國有義務將專屬經濟區內生物資源主權權利事項交付強制爭端解決程序"], "answer": 2, "explanation": "聯合國海洋法公約第298條允許締約國就海域劃界等特定敏感事項，以書面聲明排除適用強制爭端解決程序；訴訟解決機制尚包括國際法院、仲裁法庭等其他選項（非僅限國際海洋法法庭），調解員亦未必僅限於名單指定人選，專屬經濟區生物資源主權權利事項亦非義務性交付強制爭端解決。"}, {"id": "SG037", "src": "114年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國際地役，下列敘述何者正確？", "options": ["兩國依條約約定在其中一國領土境內設置核子廢棄物儲存設施，屬於一種國際地役", "若甲國領土被乙國繼承時，原本丙國依條約取得通行甲國領土之地役權，當然終止", "在國際地役權存續期間，供役範圍之領土主權發生暫時移轉之效果", "駐在國外館之不可侵犯權屬於一種國際地役"], "answer": 0, "explanation": "國際地役係指依條約約定，一國領土對他國負有特定容忍或作為義務（如同意他國於其境內設置特定設施），本題核子廢棄物儲存設施之約定即屬此種國際地役之典型；地役權原則上隨領土主權移轉（繼承）而延續，領土主權亦不因設定地役而發生暫時移轉，使館不可侵犯權則屬外交特權豁免範疇而非國際地役。"}, {"id": "SG038", "src": "114年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "關於條約在我國國內法上的地位，下列敘述何者正確？", "options": ["憲法明文規定條約具有國內法的效力", "符合憲法規定所締結之條約，其位階高於法律", "名稱為條約或公約而附有批准條款者，應送立法院審議", "我國與國際組織間締結之書面協定，雖直接涉及人民權利義務，仍無須送立法院審議"], "answer": 2, "explanation": "依條約締結法規定，名稱為條約或公約且定有批准等條款者，應送立法院審議；我國憲法本文並未明文規定條約當然具有國內法效力或其位階高於法律，我國與國際組織締結直接涉及人民權利義務之書面協定，仍應依法送立法院審議。"}, {"id": "SG039", "src": "114年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "關於領土割讓後，被割讓領土上人民之國籍歸屬，下列敘述何者正確？", "options": ["被割讓領土之人民於喪失讓與國國籍後，當然取得受讓國國籍", "被割讓領土之人民繼續保有讓與國國籍，不當然取得受讓國國籍", "被割讓領土之人民繼續保有讓與國國籍，並當然取得受讓國國籍而擁有雙重國籍", "被割讓領土之人民，通常被賦予取得受讓國國籍或保有讓與國國籍之擇一權利"], "answer": 3, "explanation": "依國際法慣例及相關條約實務，領土割讓後，當地人民通常被賦予於一定期間內選擇取得受讓國國籍或保留原讓與國國籍之「擇一權利」（optant），而非當然自動變更或雙重取得國籍。"}, {"id": "SG040", "src": "114年律師一試", "kind": "律師一試", "topic": "國際組織與聯合國", "stem": "關於國際組織，下列敘述何者正確？", "options": ["國際組織成立後須向聯合國秘書處為登記，始取得國際法主體之地位", "國際組織之多數決議，對所有會員國均生直接之拘束力", "國際組織所享有之權能，不以該組織章程明文規定者為限", "基於主權平等原則，所有國際組織之決議投票均為票票等值，無權重差異"], "answer": 2, "explanation": "國際組織除章程明文賦予之權能外，依「隱含權能理論」，為達成其設立宗旨目的所必要者，亦得認定其擁有相應之隱含權能；國際組織之法律人格取得不以向聯合國秘書處登記為要件，其決議未必對所有會員國均生直接拘束力（視組織性質與決議類型而定），部分國際組織（如國際貨幣基金）之投票權重亦依出資比例等因素而有差異，並非一律票票等值。"}, {"id": "SG041", "src": "115年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "關於條約之保留，下列敘述何者錯誤？", "options": ["締約國一旦做出條約保留，即不得撤回", "即使條約未規定不得保留，保留亦不得違背條約之目的與宗旨", "條約保留之目的，在排除或變更部分條約對該國適用時之法律效果", "依條約為保留之締約國，就保留部分與反對保留之締約國不存在條約關係"], "answer": 0, "explanation": "依維也納條約法公約規定，締約國得隨時撤回其所為之條約保留（除條約另有規定外），並非「即不得撤回」，此為本題錯誤選項。"}, {"id": "SG042", "src": "115年律師一試", "kind": "律師一試", "topic": "條約法", "stem": "依據維也納條約法公約規定，下列何者得為有效之國際條約？", "options": ["多國間締結創設政府間國際組織之協議", "甲、乙兩國的地方政府未經國家授權簽訂之姊妹都市協定", "甲、乙兩國所簽訂由甲國提供武器協助乙國以武力兼併丙國領土之協議", "甲、乙兩國之國營企業間簽訂於甲國採礦之合作開發協議"], "answer": 0, "explanation": "多國間締結創設政府間國際組織之協議，係國家間依國際法所締結之有效條約；地方政府未經國家授權之協定、以武力兼併他國領土為目的之協議（違反禁止使用武力之強行法規範而無效）及國營企業間之商業合作協議（非國家間之國際法主體締約行為），均非維也納條約法公約所稱之有效國際條約。"}, {"id": "SG043", "src": "115年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "關於國家之分類及其效果，下列敘述何者錯誤？", "options": ["大英國協與法蘭西聯盟為非國際組織之國家結合體", "獨立國協屬於單一國家型態之國家", "被保護國得依條約賦予保護國為其行使外交權限", "被保護國之國民通常不取得保護國之國籍"], "answer": 1, "explanation": "獨立國協（CIS）係由多個獨立主權國家組成之鬆散國家結合體（類似邦聯性質之國際組織），並非「單一國家型態之國家」，此為本題錯誤選項。"}, {"id": "SG044", "src": "115年律師一試", "kind": "律師一試", "topic": "國家、承認與繼承", "stem": "下列何者應適用完全繼承原則？", "options": ["所欲繼承之條約，對締約國資格設有須經其他締約國同意之特定條件", "新獨立之國家因憲政體制要求，無法繼續履行所脫離母國之條約義務", "叛亂團體在控制部分領土期間與他國訂立條約，嗣後擊敗該叛亂團體並回復統治之政府，拒絶履行該條約", "透過合法選舉程序取得執政之新政府，拒絕清償舊政府執政期間為興建水壩向他國舉借之外債"], "answer": 3, "explanation": "政府更迭（縱經合法選舉產生新政府）原則上不影響國家本身之國際法人格及其對外債務之繼受，新政府仍應概括繼受（完全繼承）舊政府執政期間所生之正當外債義務，不得逕行拒絕清償；其餘選項則涉及條約締約資格特定條件、新獨立國家之條約選擇繼承及叛亂團體條約效力等不完全繼承或特殊情形。"}, {"id": "SG045", "src": "115年律師一試", "kind": "律師一試", "topic": "國際組織與聯合國", "stem": "關於國際組織之法律人格，下列敘述何者正確？", "options": ["國際組織之法律人格，以成立該組織之條約明示規定者為限", "國際組織就其受雇人員執行職務時因他國不法行為所受之損害，得對該國請求賠償", "具有國際法律人格之國際組織，在其會員國當然取得國內法上之法律人格", "國際組織內部之法律爭端，均受該組織總部所在地國之司法管轄"], "answer": 1, "explanation": "依國際法院1949年關於聯合國雇員受害求償案之諮詢意見，國際組織就其受雇人員執行職務因他國不法行為所受損害，得以國際法人格對該責任國提出求償；國際組織之國際法律人格未必以條約明示規定為限（亦得依隱含權能理論認定），其在會員國之國內法律人格通常尚須另依總部協定或國內立法承認，內部法律爭端亦未必當然受總部所在地國司法管轄（常另設內部行政法庭處理）。"}, {"id": "SG046", "src": "115年律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於沿海國之內水，下列敘述何者錯誤？", "options": ["河口兩側適當點劃設之直線封口線，其長度不得超過24海里", "外國船舶於他國內水享有無害通過權", "經沿海國同意進入其內水之外國軍艦，於內水仍享有主權豁免", "群島基線內部固然屬於群島國家之內水，但在符合1982年聯合國海洋法公約之條件下仍允許外國船舶通行"], "answer": 1, "explanation": "內水為沿海國領土主權完全及於之水域，外國船舶原則上並「不」享有如領海般之無害通過權，除經沿海國同意或特定條約安排外，外國船舶進入內水須經沿海國許可，此為本題錯誤選項。"}, {"id": "SG047", "src": "115年律師一試", "kind": "律師一試", "topic": "領土與管轄權", "stem": "關於領土主權之得喪變更及其效果，下列敘述何者正確？", "options": ["一國因行使自衛權而占領侵略國之部分領土，得逕行主張取得該領土主權", "一國得僅依「既存占有原則（doctrine of uti possidetis）」主張固有疆域之領土主權", "一國得僅因地理上之毗鄰或地質上的延伸關係而取得該領土之主權", "因條約移轉領土主權，受讓國有義務賦予移轉領土上人民以受讓國之國籍"], "answer": 3, "explanation": "依國際法慣例，因條約移轉領土主權時，受讓國通常負有義務賦予當地人民取得受讓國國籍之機會（或選擇權）；單純行使自衛權占領他國領土、僅憑地理毗鄰或地質延伸關係，均不當然使占領國或主張國取得該領土之主權，「既存占有原則」則主要適用於新獨立國家繼承殖民時期既有行政疆界之情形，非可逕行單獨主張取得固有疆域領土主權之依據。"}, {"id": "SG048", "src": "115年律師一試", "kind": "律師一試", "topic": "海洋法", "stem": "關於防空識別區，下列敘述何者正確？", "options": ["航經防空識別區之外國航空器，有義務事前對劃定國提交飛航計畫書", "防空識別區須以飛航情報區為其劃定範圍", "防空識別區由劃定國片面劃定，目的為基於防空需要迅速定位並管制他國航空器", "防空識別區一經劃定，其效力等同於一國之領空"], "answer": 2, "explanation": "防空識別區係由劃定國基於國防安全需要而「片面」劃定之空域範圍，目的在及早識別、定位並視情況管制進入之外國航空器；防空識別區並非國際法上正式法律概念，其劃定範圍未必與飛航情報區一致，外國航空器亦無國際法上絕對義務須事前提交飛航計畫書，防空識別區之法律效力更不等同於一國領空（領空範圍係另依國際法明確界定）。"}, {"id": "SG049", "src": "115年律師一試", "kind": "律師一試", "topic": "國際法院與爭端解決", "stem": "關於第三國參加國際法院訴訟程序，下列敘述何者錯誤？", "options": ["第三國認為其具有法律性質之利益將因判決受影響，得向法院聲請參加訴訟", "在訴訟當事國反對之下，法院仍得允許第三國參加訴訟", "當多邊條約解釋發生爭議時，書記官長有義務通知訴訟當事國外之締約國", "法院之判決對參加訴訟之第三國不生拘束力"], "answer": 3, "explanation": "依國際法院規約規定，第三國經允許參加訴訟並就多邊條約解釋表示意見後，該判決就其所涉及之條約解釋部分，對參加之第三國「亦生拘束力」，並非「不生拘束力」，此為本題錯誤選項。"}, {"id": "SG050", "src": "115年律師一試", "kind": "律師一試", "topic": "國際人權與刑事法", "stem": "甲國國民A因被甲國判處死刑，遂逃亡至依公民與政治權利國際公約廢止死刑之締約國乙國，乙國決定將A遣返甲國。依聯合國人權事務委員會相關見解，下列敘述何者正確？", "options": ["乙國廢除死刑之公約義務，僅涵蓋其本國人與境內受審判之刑事被告", "若乙國已盡全力與甲國協調後甲國仍拒絕承諾不執行A死刑，則乙國已克盡保護A生命權之義務", "乙國無條件遣返A等於間接執行其死刑，本身即構成違反公約保護A生命權之義務", "乙國雖已經簽署加入該公約第二號廢死議定書，但僅遣返A而未自己執行死刑，不構成對生命權之侵害"], "answer": 2, "explanation": "聯合國人權事務委員會見解認為，廢死締約國若明知遣返將導致當事人於他國遭執行死刑，卻仍無條件將其遣返，此舉本身即等同間接執行死刑，構成對公約所保障生命權之違反，締約國之廢死義務不因當事人非本國籍或未於境內受審而免除，亦不因僅係「遣返」而非親自執行死刑即可免責。"}];

var CN_NUM = ['〇','一','二','三','四','五','六','七','八','九'];
function noText(no){ var x = String(no).match(/^a(\d+)-(\d+)$/); return x ? '附件' + CN_NUM[+x[1]] + '第' + x[2] + '條' : '第' + no + '條'; }
function noShort(no){ var x = String(no).match(/^a(\d+)-(\d+)$/); return x ? '附' + CN_NUM[+x[1]] + '-' + x[2] : String(no); }
TREATIES.forEach(function(t){ TREATY_BY_ID[t.id] = t; ARTS_OF[t.id] = []; });
ARTICLES.forEach(function(a){ ART_BY_ID[artId(a)] = a; ARTS_OF[a.treaty].push(a); });
Object.keys(ARTS_OF).forEach(function(k){ ARTS_OF[k].sort(function(x, y){ return numOf(x.no) - numOf(y.no) || String(x.no).localeCompare(String(y.no)); }); });

CONCEPTS.forEach(function(c){ CONCEPT_BY_ID[c.id] = c; });

function artLabel(id){
  var p = id.split('-'); var tid = p[0], no = p.slice(1).join('-');
  var t = TREATY_BY_ID[tid];
  return (t ? t.short : (TREATY_NAMES_PLANNED[tid] || tid)) + noText(no);
}
function refTitle(ref){
  if (ref.type === 'art') return artLabel(ref.id);
  if (ref.type === 'case') return CASE_BY_ID[ref.id] ? CASE_BY_ID[ref.id].nameZh.replace(/（.*$/, '') : ref.id;
  if (ref.type === 'concept') return CONCEPT_BY_ID[ref.id] ? CONCEPT_BY_ID[ref.id].title : ref.id;
  if (ref.type === 'cmp') return CMP_BY_ID[ref.id] ? CMP_BY_ID[ref.id].title : ref.id;
  return ref.id;
}
function exists(type, id){
  return type === 'art' ? !!ART_BY_ID[id] : type === 'case' ? !!CASE_BY_ID[id] : type === 'concept' ? !!CONCEPT_BY_ID[id] : type === 'cmp' ? !!CMP_BY_ID[id] : type === 'treaty' ? !!TREATY_BY_ID[id] : type === 'essay' ? !!ESSAY_BY_ID[id] : false;
}

/* ---------- 文字轉換 ---------- */
function parseInline(text){
  var out = esc(text).replace(/\{\{(.*?)\}\}/g, function(m, term){
    return '<span class="term" data-act="term" data-term="' + term + '">' + term + '</span>';
  });
  out = out.replace(/\[\[([a-z]+)\|([a-z0-9-]+)\|(.*?)\]\]/g, function(m, type, id, label){
    if (!exists(type, id)) return '<span class="jumplink pending" title="待收錄">' + label + '</span>';
    return '<span class="jumplink" data-act="go" data-href="' + type + '/' + id + '">' + label + '</span>';
  });
  return out;
}
function chip(type, id, label){
  if (!exists(type, id)) return '<span class="chip pending">' + esc(label) + '（待收錄）</span>';
  return '<button class="chip" data-act="go" data-href="' + type + '/' + id + '">' + esc(label) + '</button>';
}
function plainText(s){ return String(s || '').replace(/\{\{(.*?)\}\}/g, '$1').replace(/\[\[[a-z]+\|[a-z0-9-]+\|(.*?)\]\]/g, '$1'); }

var state = { route: 'home', id: null, tab: 'text', textMode: 'both', quiz: false, revealed: false,
  drawer: false, openAcc: {}, search: false, searchQ: '', pop: null, jumpMsg: '',
  examFilter: 'all', errataFilter: 'fix', essayFilter: 'core', practice: null, practiceType: 'cloze', exportText: '' };
var navDepth = 0;
function currentHash(){ return '#' + state.route + (state.id ? '/' + state.id : ''); }
function parseHash(h){
  h = decodeURIComponent((h || '').replace(/^#/, ''));
  var i = h.indexOf('/');
  var r = i < 0 ? h : h.slice(0, i), id = i < 0 ? null : h.slice(i + 1);
  var ok = { home:1, art:1, 'case':1, concept:1, cmp:1, treaty:1, glossary:1, traps:1, errata:1, exams:1, practice:1, 'export':1, cases:1, concepts:1, cmps:1, essays:1, essay:1 };
  if (!ok[r]) return { route: 'home', id: null };
  if ((r === 'art' || r === 'case' || r === 'concept' || r === 'cmp' || r === 'treaty' || r === 'essay') && !exists(r, id)) return { route: 'home', id: null };
  return { route: r, id: id };
}
function go(href, push){
  var p = parseHash('#' + href);
  var changed = p.route !== state.route || p.id !== state.id;
  if (p.route !== state.route || p.id !== state.id) { state.tab = 'text'; state.revealed = false; }
  state.route = p.route; state.id = p.id; state.drawer = false; state.search = false; state.pop = null; state.jumpMsg = '';
  if (changed && push !== false) { navDepth++; try { history.pushState(null, '', currentHash()); } catch (e) {} }
  render(); try { window.scrollTo(0, 0); } catch (e) {}
}
function applyRoute(){
  var p = parseHash(location.hash);
  state.route = p.route; state.id = p.id; state.drawer = false; state.search = false; state.pop = null; state.revealed = false;
  render();
}

var PLANNED = { 'unclos':'海洋法公約', '海洋法':'海洋法公約', '海洋法公約':'海洋法公約', 'vclt':'條約法公約', '條約法':'條約法公約', '條約法公約':'條約法公約',
  'vcdr':'外交關係公約', '外交關係公約':'外交關係公約', 'vccr':'領事關係公約', '領事關係公約':'領事關係公約', 'arsiwa':'國家責任條款草案', '國家責任':'國家責任條款草案',
  '條約締結法':'條約締結法', 'gatt':'GATT', 'dsu':'爭端解決瞭解書', 'wto':'WTO協定' };
function parseJump(q){
  q = String(q || '').trim().replace(/[《》「」]/g, '');
  var ax = q.match(/^(.*?)\s*附件?\s*([一二三四五六七八九]|\d)\s*[-－第]?\s*(\d+)\s*條?$/);
  var m = ax ? [ax[0], ax[1], ax[3]] : q.match(/^(.*?)\s*第?\s*(\d+)\s*條?$/);
  if (!m) return { msg: '請輸入「條約＋條號」，例如：憲章 51、規約38、icj 36。' };
  var name = m[1].trim().toLowerCase(), no = String(parseInt(m[2], 10));
  var tid = null;
  TREATIES.forEach(function(t){ if (t.aliases.some(function(a){ return a.toLowerCase() === name; })) tid = t.id; });
  if (!tid) {
    if (PLANNED[name]) return { msg: '《' + PLANNED[name] + '》尚未收錄，將於後續批次加入。' };
    return { msg: '找不到「' + m[1] + '」。目前可用：' + TREATIES.map(function(t){ return t.short + '（' + t.id + '）'; }).join('、') + '。' };
  }
  if (ax) no = 'a' + (CN_NUM.indexOf(ax[2]) > 0 ? CN_NUM.indexOf(ax[2]) : parseInt(ax[2], 10)) + '-' + no;
  var id = tid + '-' + no;
  if (ART_BY_ID[id]) return { href: 'art/' + id };
  return { msg: TREATY_BY_ID[tid].short + noText(no) + '尚未收錄。', href: 'treaty/' + tid };
}

function renderArticle(a){

       '<span class="nav-pn"><button data-act="prev" ' + (idx <= 0 ? 'disabled' : '') + '>‹ 上一條</button><button data-act="next" ' + (idx >= list.length - 1 ? 'disabled' : '') + '>下一條 ›</button></span></div>';
  var tabs = [['text', '條文'], ['explain', '解說'], ['practice', '實務'], ['exam', '考試']];
  h += '<div class="tabs">' + tabs.map(function(x){ return '<button class="' + (state.tab === x[0] ? 'on' : '') + '" data-act="tab" data-tab="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';

  else h += '<span></span>';

function hidable(inner, label){

  return inner;
}
function clozeZh(zh, keys){
  var s = esc(zh);
  (keys || []).slice().sort(function(x, y){ return y.length - x.length; }).forEach(function(k){
    var ek = esc(k);
    s = s.split(ek).join('\u0001' + ek + '\u0002');
  });
  return s.replace(/\u0001(.*?)\u0002/g, function(m, k){ return '<button class="cloze" data-act="cloze">' + k + '</button>'; });
}
function articleText(a, t){
  var h = '';

    var mode = state.textMode;

    if (mode !== 'en') h += '<div class="zh">' + (state.quiz ? clozeZh(p.zh, a.keys) : esc(p.zh)) + '</div>';
    if (mode !== 'zh') h += '<div class="en">' + esc(p.en) + '</div>';

        var key = 'art:' + artId(a), cur = state.route === 'art' && state.id === artId(a);
        h += '<button class="d-row ttl' + (cur ? ' cur' : '') + '" data-act="go" data-href="art/' + artId(a) + '"><span class="no">' + esc(noShort(a.no)) + '</span><span>' + esc(a.heading) + '</span><span class="mk">' + (progress.star[key] ? '★' : '') + (progress.read[key] ? '✓' : '') + '</span></button>';

  });
  [['cases', '判例卡'], ['concepts', '概念卡'], ['cmps', '比較表'], ['glossary', '用語對照表'], ['traps', '考點陷阱彙整'], ['errata', '勘誤清單'], ['exams', '考古題對照'], ['essays', '申論題'], ['practice', '條文測驗'], ['export', '匯出選擇題 JSON']].forEach(function(x){

/* ---------- 搜尋 ---------- */
function searchAll(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  var res = [];

  function snip(s){ s = plainText(s); var i = s.toLowerCase().indexOf(q); if (i < 0) return s.slice(0, 60); return (i > 20 ? '…' : '') + s.slice(Math.max(0, i - 20), i + q.length + 40) + '…'; }

    var fields = [a.heading, a.plain].concat(a.paras.map(function(p){ return p.zh; }), a.paras.map(function(p){ return p.en; }), a.traps || [], [a.essay, a.roc]);

  CONCEPTS.forEach(function(c){ var f = [c.title, c.definition].concat(c.points).filter(hit)[0]; if (f !== undefined) res.push({ ty: '概念', t: c.title, s: snip(f), href: 'concept/' + c.id }); });
  ESSAYS.forEach(function(e){ var f = [e.key, e.stem].concat(e.outline ? e.outline.points : []).filter(hit)[0]; if (f !== undefined) res.push({ ty: '申論', t: e.year + '年 ' + essayGroup(e) + '第' + e.no + '題　' + e.key, s: snip(f), href: 'essay/' + e.id }); });
  Object.keys(GLOSSARY).forEach(function(k){ var g = GLOSSARY[k]; var f = [k, g.en, g.tw, g.cn, g.def].filter(hit)[0]; if (f !== undefined) res.push({ ty: '用語', t: k, s: snip(f), term: k }); });
  return res;
}
function renderSearch(){
  var res = searchAll(state.searchQ);
  var h = '<div class="overlay" id="search-panel"><div class="bar"><input id="search-input" placeholder="搜尋條文、判例、用語…" value="' + esc(state.searchQ) + '"><button class="icon-btn" data-act="close-search" aria-label="關閉">✕</button></div><div class="results">';

function renderPop(){

  return '<div class="pop" role="dialog"><h3>' + esc(state.pop) + '</h3><div class="r">英：' + esc(g.en) + '</div><div class="r">台：' + esc(g.tw) + '</div><div class="r">陸：' + esc(g.cn) + '</div><div class="prose" style="font-size:14.5px;margin-top:6px">' + parseInline(g.def) + '</div><button class="mark-btn" data-act="close-pop" style="margin-top:8px">關閉</button></div>';

/* ---------- 主渲染 ---------- */
function render(){

/* ---------- 事件 ---------- */

    else if (act === 'pnext') { state.practice = null; render(); }

  });

  });
